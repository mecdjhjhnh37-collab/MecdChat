<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Call - Mecd Chat</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

body{
    margin:0;
    background:#050807;
    color:white;
    font-family:Arial,Tahoma;
    text-align:center;
}

.app{
    max-width:650px;
    margin:auto;
    padding:20px;
}

h1{
    color:#00e889;
}

video{

    width:100%;
    height:280px;
    background:black;
    border-radius:20px;
    margin-top:15px;
    border:2px solid #00e889;

}

.card{

    background:#111916;
    padding:20px;
    border-radius:20px;
    margin-top:20px;

}

button{

    width:100%;
    padding:15px;
    margin-top:15px;

    border:0;
    border-radius:15px;

    background:#00e889;
    color:#00150e;

    font-size:17px;
    font-weight:bold;

}

#myId{

    color:#00e889;
    word-break:break-all;

}

</style>

</head>


<body>


<div class="app">


<h1>📹 مكالمة فيديو</h1>


<video id="localVideo"
autoplay
muted
playsinline></video>


<video id="remoteVideo"
autoplay
playsinline></video>


<div class="card">


<h3>كود الاتصال</h3>


<div id="myId">
جاري إنشاء الكود...
</div>


<input id="friendId"
placeholder="ضع كود الطرف الآخر"
style="
width:100%;
padding:15px;
margin-top:15px;
border-radius:15px;
border:0;
">


<button onclick="startCall()">
📞 اتصال
</button>


<button onclick="endCall()">
🔴 إنهاء
</button>


</div>


</div>


<script src="video-call.js"></script>


</body>

</html>
