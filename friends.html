<style>

*{
box-sizing:border-box;
margin:0;

body{

font-family:
Arial,
Tahoma,

radial-gradient(

.background{

}

.glow{

.glow.two{

.app{

z-index:1;

width:100%;

margin:auto;

padding:22px 20px 45px;

header{

.brand{

.logo{

height:52px;

.brand span{

}

.notification-button{

height:50px;

border-radius:17px;

border:1px solid
rgba(255,255,255,.09);

background:
rgba(255,255,255,.045);

color:white;

font-size:23px;

cursor:pointer;

display:flex;

align-items:center;
justify-content:center;

transition:.2s ease;
}

.notification-button:active{
transform:scale(.95);
}

.notification-count{

position:absolute;

top:-5px;
right:-5px;

height:21px;

padding:0 5px;

align-items:center;
justify-content:center;

border-radius:50%;

background:#ff3b30;

}

.notification-count.show{
display:flex;
}

.page-title{

margin-bottom:30px;
}

.page-title h1{

font-size:
clamp(30px,7vw,45px);

}

.page-title h1 span{

}

.page-title p{

color:#9ba7a4;

.section-title{

.friend-count{

.friends-list{

.friend{

width:100%;

border:1px solid
rgba(255,255,255,.08);

rgba(255,255,255,.035);

align-items:center;

}

.friend:hover{

transform:translateY(-2px);

rgba(0,230,118,.25);

}

}

.friend-avatar{

width:58px;
height:58px;

flex-shrink:0;

overflow:hidden;

justify-content:center;

linear-gradient(
135deg,
#293b37,

);

border:2px solid
rgba(0,230,118,.55);

}

.friend-avatar img{

width:100%;
height:100%;

object-fit:cover;
}

.friend-info{

}

.friend-name{

font-size:17px;

font-weight:bold;

overflow:hidden;

}

.friend-id{

margin-top:5px;
}

.friend-arrow{

}

.empty{

padding:35px 20px;

border-radius:22px;

border:1px solid
rgba(255,255,255,.07);

rgba(255,255,255,.025);

}

.empty-icon{

}

.friend-modal{

position:fixed;

inset:0;

z-index:9000;

display:none;

align-items:center;
justify-content:center;

padding:20px;

background:
rgba(0,0,0,.72);

backdrop-filter:blur(9px);
}

.friend-modal.show{
display:flex;
}

.friend-modal-box{

position:relative;

width:100%;

max-width:400px;

padding:28px 22px 22px;

border-radius:28px;

background:
linear-gradient(
180deg,
#111b18,
#070b09
);

border:1px solid
rgba(255,255,255,.1);

box-shadow:
0 25px 90px
rgba(0,0,0,.65);

}

.friend-modal-close{

position:absolute;

top:15px;
right:15px;

width:42px;
height:42px;

border-radius:13px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.05);

color:white;

font-size:22px;

cursor:pointer;
}

.selected-avatar{

width:100px;
height:100px;

margin:10px auto 17px;

border-radius:50%;

overflow:hidden;

display:flex;

align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
#293b37,
#15211e
);

border:3px solid #00e676;

box-shadow:
0 0 30px
rgba(0,230,118,.18);

font-size:40px;
}

.selected-avatar img{

width:100%;
height:100%;

object-fit:cover;
}

.selected-name{

font-size:23px;

font-weight:bold;

margin-bottom:8px;
}

.selected-id{

margin-bottom:25px;
}

.friend-modal-actions{

display:flex;

flex-direction:column;

gap:11px;
}

.chat-button,
.remove-friend-button{

width:100%;

padding:16px;

border-radius:16px;

font-family:inherit;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s ease;
}

.chat-button{

border:none;

background:#00e889;

color:#00150e;
}

.remove-friend-button{

border:1px solid
rgba(255,90,90,.2);

background:
rgba(255,70,70,.07);

}

.modal{

position:fixed;

inset:0;

z-index:9999;

display:none;

align-items:center;

justify-content:center;

padding:20px;

background:
rgba(0,0,0,.72);

backdrop-filter:blur(8px);
}

.modal.show{
display:flex;
}

.modal-box{

width:100%;

max-width:480px;

max-height:80vh;

overflow-y:auto;

padding:23px;

border-radius:27px;

background:
linear-gradient(
180deg,
#101916,
#070b09
);

border:1px solid
rgba(255,255,255,.1);

box-shadow:
0 25px 80px
rgba(0,0,0,.6);
}

.modal-header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:22px;
}

.modal-header h2{
font-size:22px;
}

.close-button{

width:40px;
height:40px;

border-radius:13px;

border:1px solid
rgba(255,255,255,.08);

background:#161d1a;

color:white;

font-size:20px;

cursor:pointer;
}

.request-list{

display:flex;

flex-direction:column;

gap:12px;
}

.request{

padding:15px;

border-radius:19px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.07);
}

.request-user{

display:flex;

align-items:center;

gap:12px;

margin-bottom:13px;
}

.request-avatar{

width:52px;
height:52px;

border-radius:50%;

overflow:hidden;

flex-shrink:0;

background:#17221f;

border:2px solid
rgba(0,230,118,.5);

display:flex;

align-items:center;
justify-content:center;

font-size:22px;
}

.request-avatar img{

width:100%;
height:100%;

object-fit:cover;
}

.request-name{

font-size:16px;

font-weight:bold;
}

.request-id{

font-size:11px;

color:#00e676;

margin-top:4px;
}

.request-actions{

display:flex;

gap:9px;
}

.accept-button,
.reject-button{

flex:1;

padding:13px;

border-radius:14px;

font-family:inherit;

font-size:14px;

font-weight:bold;

cursor:pointer;
}

.accept-button{

border:none;

background:#00e889;

color:#00150e;
}

.reject-button{

background:#171e1b;

color:#ff8e8e;

border:1px solid
rgba(255,100,100,.18);
}

.accept-button:disabled,
.reject-button:disabled{

opacity:.5;

cursor:not-allowed;
}

.loading{

position:fixed;

inset:0;

z-index:10000;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:18px;

background:
linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;

font-size:16px;
}

.spinner{

width:35px;
height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

.back-button{

width:100%;

margin-top:30px;

padding:17px;

border-radius:18px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.035);

color:white;

font-family:inherit;

font-size:15px;

cursor:pointer;
}

footer{

margin-top:auto;

padding-top:40px;

text-align:center;

color:#58635f;

font-size:11px;
}

.error-box{

padding:25px 18px;

border-radius:20px;

border:1px solid
rgba(255,80,80,.18);

background:
rgba(255,60,60,.05);

text-align:center;

color:#ffaaaa;

font-size:14px;

line-height:1.8;
}

.retry-button{

margin-top:15px;

padding:12px 20px;

border:none;

border-radius:13px;

background:#00e889;

color:#00150e;

font-family:inherit;

font-weight:bold;

cursor:pointer;
}

@media(max-width:480px){

.app{
padding:18px 15px 35px;
}

.logo{

width:45px;
height:45px;

border-radius:14px;

font-size:23px;
}

.brand h2{
font-size:18px;
}

.notification-button{

width:45px;
height:45px;

font-size:21px;
}

.page-title h1{
font-size:31px;
}

.friend{
padding:13px;
}

.friend-avatar{

width:54px;
height:54px;
}

.friend-name{
font-size:16px;
}

.friend-arrow{
font-size:21px;
}

.modal-box{
padding:19px;
}

.friend-modal-box{
padding:25px 18px 20px;
}

.selected-avatar{

width:90px;
height:90px;
}

.selected-name{
font-size:21px;
}

}

</style>

</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
deleteDoc,
collection,
getDocs,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const app =
document.getElementById("app");

const friendsList =
document.getElementById("friendsList");

const friendCount =
document.getElementById("friendCount");

const notificationsBtn =
document.getElementById("notificationsBtn");

const notificationCount =
document.getElementById("notificationCount");

const notificationModal =
document.getElementById("notificationModal");

const closeModalBtn =
document.getElementById("closeModalBtn");

const requestList =
document.getElementById("requestList");

const backBtn =
document.getElementById("backBtn");

const friendModal =
document.getElementById("friendModal");

const closeFriendModal =
document.getElementById("closeFriendModal");

const selectedAvatar =
document.getElementById("selectedAvatar");

const selectedName =
document.getElementById("selectedName");

const selectedId =
document.getElementById("selectedId");

const chatButton =
document.getElementById("chatButton");

const removeFriendButton =
document.getElementById("removeFriendButton");


let currentUser = null;

let selectedFriend = null;


function escapeHTML(text){

return String(text || "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function avatarHTML(photo){

if(photo){

return `
<img
src="${escapeHTML(photo)}"
alt="صورة المستخدم"
>
`;

}

return "👤";

}


async function getUserData(uid){

try{

const snap =
await getDoc(
doc(db,"users",uid)
);

if(!snap.exists()){

return {
name:"مستخدم Mecd",
photo:"",
chatID:""
};

}

const data = snap.data();

return {

name:
data.name ||
data.displayName ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
data.id ||
""

};

}catch(error){

console.error(error);

return {

name:"مستخدم Mecd",
photo:"",
chatID:""

};

}

}


/* =========================================
   FRIENDS
========================================= */

async function loadFriends(){

friendsList.innerHTML = "";

friendCount.textContent = "0";

try{

const snap =
await getDocs(
collection(
db,
"users",
currentUser.uid,
"friends"
)
);

if(snap.empty){

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

لا يوجد لديك أصدقاء حتى الآن.

<br>

يمكنك البحث عن مستخدم وإرسال طلب صداقة.

</div>

`;

return;

}

let count = 0;

for(const friendDoc of snap.docs){

const uid = friendDoc.id;

const data =
await getUserData(uid);

const element =
document.createElement("div");

element.className = "friend";

element.innerHTML = `

<div class="friend-avatar">

${avatarHTML(data.photo)}

</div>

<div class="friend-info">

<div class="friend-name">
${escapeHTML(data.name)}
</div>

<div class="friend-id">

${data.chatID
?
"ID: " + escapeHTML(data.chatID)
:
""}

</div>

</div>

<div class="friend-arrow">
←
</div>

`;

element.addEventListener(
"click",
()=>openFriend(data,uid)
);

friendsList.appendChild(element);

count++;

}

friendCount.textContent = count;

}catch(error){

console.error("Friends error:",error);

friendsList.innerHTML = `

<div class="error-box">

⚠️ تعذر تحميل الأصدقاء.

<br><br>

${escapeHTML(error.message)}

<br>

<button
class="retry-button"
id="retryFriends"
>
إعادة المحاولة
</button>

</div>

`;

const retry =
document.getElementById("retryFriends");

if(retry){

retry.onclick = loadFriends;

}

}

}


/* =========================================
   OPEN FRIEND
========================================= */

function openFriend(data,uid){

selectedFriend = {

uid:uid,

name:data.name,

photo:data.photo,

chatID:data.chatID

};

selectedName.textContent =
data.name;

selectedId.textContent =
data.chatID
?
"ID: " + data.chatID
:
"";

selectedAvatar.innerHTML =
avatarHTML(data.photo);

friendModal.classList.add("show");

}


/* =========================================
   REMOVE FRIEND
========================================= */

removeFriendButton.addEventListener(
"click",
async()=>{

if(!currentUser || !selectedFriend)
return;

if(!confirm(
"هل تريد إلغاء الصداقة مع " +
selectedFriend.name +
"؟"
))
return;

removeFriendButton.disabled = true;

removeFriendButton.textContent =
"جاري الإلغاء...";

try{

await deleteDoc(
doc(
db,
"users",
currentUser.uid,
"friends",
selectedFriend.uid
)
);

await deleteDoc(
doc(
db,
"users",
selectedFriend.uid,
"friends",
currentUser.uid
)
);

friendModal.classList.remove("show");

selectedFriend = null;

await loadFriends();

}catch(error){

alert(
"تعذر إلغاء الصداقة:\n" +
error.message
);

}finally{

removeFriendButton.disabled = false;

removeFriendButton.textContent =
"❌ إلغاء الصداقة";

}

}
);


/* =========================================
   CHAT
========================================= */

chatButton.addEventListener(
"click",
()=>{

if(!selectedFriend)
return;

window.location.href =
"./chat.html?friend=" +
encodeURIComponent(
selectedFriend.uid
);

}
);


/* =========================================
   FRIEND REQUESTS
========================================= */

async function loadFriendRequests(){

requestList.innerHTML = "";

try{

const snap =
await getDocs(
collection(db,"friendRequests")
);

const requests = [];

snap.forEach(requestDoc=>{

const data = requestDoc.data();

if(
data.toUid === currentUser.uid &&
data.status === "pending"
){

requests.push({

id:requestDoc.id,
...data

});

}

});


notificationCount.textContent =
requests.length;

if(requests.length){

notificationCount.classList.add("show");

}else{

notificationCount.classList.remove("show");

}


if(!requests.length){

requestList.innerHTML = `

<div class="empty">

<div class="empty-icon">
🔔
</div>

لا توجد طلبات صداقة جديدة.

</div>

`;

return;

}


for(const request of requests){

const user =
await getUserData(request.fromUid);

const name =
request.fromName ||
user.name ||
"مستخدم Mecd";

const photo =
request.fromPhoto ||
user.photo ||
"";

const chatID =
request.fromChatID ||
user.chatID ||
"";


const element =
document.createElement("div");

element.className = "request";

element.innerHTML = `

<div class="request-user">

<div class="request-avatar">

${avatarHTML(photo)}

</div>

<div>

<div class="request-name">

${escapeHTML(name)}

</div>

<div class="request-id">

${escapeHTML(
chatID
?
"ID: " + chatID
:
""
)}

</div>

</div>

</div>

<div class="request-actions">

<button
class="accept-button"
type="button"
>
قبول
</button>

<button
class="reject-button"
type="button"
>
رفض
</button>

</div>

`;


const accept =
element.querySelector(
".accept-button"
);

const reject =
element.querySelector(
".reject-button"
);


accept.addEventListener(
"click",
async()=>{

accept.disabled = true;
reject.disabled = true;

try{

await setDoc(

doc(
db,
"users",
currentUser.uid,
"friends",
request.fromUid
),

{

since:serverTimestamp()

}

);


await setDoc(

doc(
db,
"users",
request.fromUid,
"friends",
currentUser.uid
),

{

since:serverTimestamp()

}

);


await deleteDoc(

doc(
db,
"friendRequests",
request.id
)

);


element.remove();

await loadFriends();

await loadFriendRequests();

}catch(error){

console.error(error);

alert(
"تعذر قبول الطلب:\n" +
error.message
);

accept.disabled = false;
reject.disabled = false;

}

}
);


reject.addEventListener(
"click",
async()=>{

accept.disabled = true;
reject.disabled = true;

try{

await deleteDoc(

doc(
db,
"friendRequests",
request.id
)

);

element.remove();

await loadFriendRequests();

}catch(error){

console.error(error);

alert(
"تعذر رفض الطلب:\n" +
error.message
);

accept.disabled = false;
reject.disabled = false;

}

}
);


requestList.appendChild(element);

}

}catch(error){

console.error(
"Requests error:",
error
);

requestList.innerHTML = `

<div class="error-box">

⚠️ تعذر تحميل طلبات الصداقة.

<br><br>

${escapeHTML(error.message)}

</div>

`;

}

}


/* =========================================
   NOTIFICATIONS
========================================= */

notificationsBtn.addEventListener(
"click",
async()=>{

notificationModal.classList.add("show");

await loadFriendRequests();

}
);


closeModalBtn.addEventListener(
"click",
()=>{

notificationModal.classList.remove("show");

}
);


notificationModal.addEventListener(
"click",
event=>{

if(event.target === notificationModal){

notificationModal.classList.remove("show");

}

}
);


/* =========================================
   FRIEND MODAL CLOSE
========================================= */

closeFriendModal.addEventListener(
"click",
()=>{

friendModal.classList.remove("show");

selectedFriend = null;

}
);


friendModal.addEventListener(
"click",
event=>{

if(event.target === friendModal){

friendModal.classList.remove("show");

selectedFriend = null;

}

}
);


/* =========================================
   BACK
========================================= */

backBtn.addEventListener(
"click",
()=>{

window.location.href =
"./index.html";

}
);


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

loadingText.textContent =
"يجب تسجيل الدخول أولاً...";

setTimeout(()=>{

window.location.href =
"./index.html";

},1000);

return;

}

currentUser = user;

try{

await loadFriends();

await loadFriendRequests();

app.style.display = "flex";

loading.style.display = "none";

}catch(error){

console.error(error);

loading.style.display = "none";

app.style.display = "flex";

}

}
);

</script>

</body>
</html>
