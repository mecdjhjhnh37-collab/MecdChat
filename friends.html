<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050807">

<title>Mecd Chat - الأصدقاء</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),
linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.glow{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
filter:blur(100px);
opacity:.18;
}

.glow.one{
background:#00e676;
top:-100px;
right:-100px;
}

.glow.two{
background:#2979ff;
bottom:-100px;
left:-100px;
}

.app{
position:relative;
z-index:1;
width:100%;
max-width:650px;
min-height:100vh;
margin:auto;
padding:25px 20px 45px;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:40px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:52px;
height:52px;

display:flex;
align-items:center;
justify-content:center;

border-radius:16px;
font-size:27px;

background:
linear-gradient(
135deg,
#00e676,
#00a85a
);

box-shadow:
0 10px 30px
rgba(0,230,118,.22);
}

.brand h2{
font-size:21px;
}

.brand span{
display:block;
margin-top:4px;
color:#8d9a97;
font-size:12px;
}

.back-button{
border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.04);

color:white;

padding:10px 14px;

border-radius:15px;

font-size:14px;
cursor:pointer;
}

.back-button:active{
transform:scale(.96);
}

.hero{
text-align:center;
margin-bottom:30px;
}

.hero-icon{
width:82px;
height:82px;

margin:0 auto 20px;

display:flex;
align-items:center;
justify-content:center;

border-radius:26px;

font-size:40px;

background:
rgba(0,255,145,.08);

border:1px solid
rgba(0,255,145,.15);

box-shadow:
0 20px 60px
rgba(0,0,0,.3);
}

.hero h1{
font-size:34px;
margin-bottom:12px;
}

.hero h1 span{
color:#00e676;
}

.hero p{
color:#9ba7a4;
font-size:15px;
line-height:1.7;
}

.search-box{
padding:20px;
border-radius:25px;

background:
linear-gradient(
135deg,
rgba(0,85,58,.55),
rgba(2,31,24,.75)
);

border:1px solid
rgba(0,255,145,.16);

box-shadow:
0 15px 45px
rgba(0,0,0,.25);

margin-bottom:22px;
}

.search-title{
font-size:17px;
font-weight:bold;
margin-bottom:12px;
}

.search-row{
display:flex;
gap:10px;
}

#friendId{
flex:1;
min-width:0;

padding:15px;

border-radius:15px;

border:1px solid
rgba(255,255,255,.1);

outline:none;

background:
rgba(0,0,0,.25);

color:white;

font-size:15px;
font-family:inherit;

text-align:right;
}

#friendId::placeholder{
color:#687872;
}

#searchBtn{
padding:0 20px;

border:none;

border-radius:15px;

background:#00e889;

color:#00150e;

font-weight:bold;

font-size:15px;

cursor:pointer;
}

#searchBtn:active{
transform:scale(.96);
}

#searchBtn:disabled{
opacity:.6;
cursor:not-allowed;
}

.result{
display:none;

padding:20px;

border-radius:25px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.08);

margin-bottom:20px;
}

.user-card{
display:flex;
align-items:center;
gap:15px;
}

.user-avatar{
width:65px;
height:65px;

flex-shrink:0;

border-radius:20px;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;

background:
rgba(0,255,145,.1);

border:1px solid
rgba(0,255,145,.15);
}

.user-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:18px;
font-weight:bold;
margin-bottom:7px;

overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.user-id{
color:#00e889;
font-size:13px;
}

.add-button{
margin-top:15px;

width:100%;

padding:14px;

border:none;

border-radius:15px;

background:#00e889;

color:#00150e;

font-size:15px;

font-weight:bold;

cursor:pointer;
}

.add-button:active{
transform:scale(.98);
}

.add-button:disabled{
opacity:.65;
cursor:not-allowed;
}

.message{
display:none;

padding:18px;

border-radius:18px;

text-align:center;

font-size:14px;

line-height:1.6;

margin-bottom:20px;
}

.message.error{
background:
rgba(255,70,70,.08);

border:1px solid
rgba(255,70,70,.15);

color:#ffaaaa;
}

.message.success{
background:
rgba(0,230,118,.08);

border:1px solid
rgba(0,230,118,.15);

color:#8fffc5;
}

.section-head{
display:flex;
align-items:center;
justify-content:space-between;

margin:30px 0 15px;
}

.section-title{
font-size:20px;
font-weight:bold;
}

.notification-button{
width:58px;
height:58px;

border-radius:18px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.04);

color:white;

font-size:29px;

cursor:pointer;

position:relative;
}

.notification-button:active{
transform:scale(.95);
}

.notification-count{
position:absolute;

top:-5px;
left:-5px;

min-width:22px;
height:22px;

padding:0 5px;

display:none;

align-items:center;
justify-content:center;

border-radius:50%;

background:#ff3b30;

color:white;

font-size:12px;

font-weight:bold;

border:2px solid #06100d;
}

.requests{
display:none;

padding:20px;

border-radius:25px;

background:
linear-gradient(
135deg,
rgba(0,85,58,.55),
rgba(2,31,24,.75)
);

border:1px solid
rgba(0,255,145,.16);

margin-bottom:20px;
}

.requests-header{
display:flex;
align-items:center;
justify-content:space-between;

margin-bottom:18px;
}

.requests-title{
font-size:20px;
font-weight:bold;
}

.close-requests{
width:45px;
height:45px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.06);

color:#aaa;

font-size:28px;

cursor:pointer;
}

.request-item{
padding:15px;

border-radius:20px;

background:
rgba(0,0,0,.20);

border:1px solid
rgba(255,255,255,.07);

margin-bottom:12px;
}

.request-user{
display:flex;
align-items:center;
gap:12px;
}

.request-avatar{
width:55px;
height:55px;

border-radius:17px;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:#303030;

font-size:25px;
}

.request-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.request-info{
flex:1;
min-width:0;
}

.request-name{
font-weight:bold;
font-size:16px;
margin-bottom:5px;
}

.request-id{
font-size:12px;
color:#00e889;
}

.request-actions{
display:flex;
gap:8px;
margin-top:14px;
}

.accept-button,
.reject-button{
flex:1;

border:none;

padding:12px;

border-radius:13px;

font-weight:bold;

font-size:14px;

cursor:pointer;
}

.accept-button{
background:#00e889;
color:#00150e;
}

.reject-button{
background:
rgba(255,70,70,.12);

border:1px solid
rgba(255,70,70,.2);

color:#ffaaaa;
}

.no-requests{
text-align:center;
color:#788680;
font-size:14px;
padding:20px 5px;
}

.friends-list{
display:flex;
flex-direction:column;
gap:12px;
}

.empty{
padding:25px;

border-radius:22px;

background:
rgba(255,255,255,.03);

border:1px solid
rgba(255,255,255,.06);

text-align:center;

color:#788680;

font-size:14px;

line-height:1.7;
}

.friend-item{
display:flex;
align-items:center;
gap:14px;

padding:16px;

border-radius:22px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.07);
}

.friend-avatar{
width:58px;
height:58px;

border-radius:18px;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:#303030;

font-size:25px;
}

.friend-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.friend-info{
flex:1;
}

.friend-name{
font-weight:bold;
font-size:16px;
margin-bottom:5px;
}

.friend-id{
color:#00e889;
font-size:12px;
}

.loading{
position:fixed;
inset:0;

z-index:999;

display:flex;
align-items:center;
justify-content:center;

flex-direction:column;

gap:18px;

background:
linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;
}

.spinner{
width:35px;
height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

@media(max-width:480px){

.app{
padding:20px 15px 35px;
}

.logo{
width:45px;
height:45px;
border-radius:14px;
font-size:23px;
}

.brand h2{
font-size:18px;
}

.back-button{
font-size:12px;
padding:9px 11px;
}

.hero h1{
font-size:30px;
}

.search-row{
flex-direction:column;
}

#searchBtn{
height:50px;
}

}

</style>

</head>

<body>

<div class="background">

<div class="glow one"></div>
<div class="glow two"></div>

</div>

<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>

<main id="app" class="app" style="display:none;">

<header>

<div class="brand">

<div class="logo">
👥
</div>

<div>

<h2>
الأصدقاء
</h2>

<span>
Mecd Chat
</span>

</div>

</div>

<button
id="backBtn"
class="back-button"
>
← رجوع
</button>

</header>

<section class="hero">

<div class="hero-icon">
👥
</div>

<h1>
<span>
الأصدقاء
</span>
</h1>

<p>
ابحث عن أصدقائك باستخدام ID الخاص بهم
وأرسل لهم طلب صداقة.
</p>

</section>

<section class="search-box">

<div class="search-title">
🔎 البحث عن صديق
</div>

<div class="search-row">

<input
id="friendId"
type="text"
placeholder="مثال: MC-000002"
autocomplete="off"
>

<button id="searchBtn">
بحث
</button>

</div>

</section>

<div
id="errorMessage"
class="message error"
></div>

<div
id="successMessage"
class="message success"
></div>

<div
id="result"
class="result"
>

<div class="user-card">

<div
id="userAvatar"
class="user-avatar"
>
👤
</div>

<div class="user-info">

<div
id="userName"
class="user-name"
></div>

<div
id="foundUserId"
class="user-id"
></div>

</div>

</div>

<button
id="addButton"
class="add-button"
>
📨 إرسال طلب صداقة
</button>

</div>

<div class="section-head">

<div class="section-title">
👥 أصدقائي
</div>

<button
id="notificationBtn"
class="notification-button"
title="طلبات الصداقة"
>
🔔

id="notificationCount"
class="notification-count"
>
0
</span>

</button>

</div>

<div
id="requests"
class="requests"
>

<div class="requests-header">

<div class="requests-title">
🔔 طلبات الصداقة
</div>

<button
id="closeRequests"
class="close-requests"
>
×
</button>

</div>

<div
id="requestsList"
>
</div>

</div>

<div
id="friendsList"

>

<div class="empty">

لا يوجد أصدقاء حتى الآن.
<br>

ابحث عن صديق باستخدام الـ ID لإضافته.

</div>

</div>

</main>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
updateDoc,
deleteDoc,
orderBy,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* العناصر */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const friendId =
document.getElementById("friendId");

const searchBtn =
document.getElementById("searchBtn");

const result =
document.getElementById("result");

const userAvatar =
document.getElementById("userAvatar");

const userName =
document.getElementById("userName");

const foundUserId =
document.getElementById("foundUserId");

const addButton =
document.getElementById("addButton");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");

const backBtn =
document.getElementById("backBtn");

const notificationBtn =
document.getElementById("notificationBtn");

const notificationCount =
document.getElementById("notificationCount");

const requests =
document.getElementById("requests");

const requestsList =
document.getElementById("requestsList");

const closeRequests =
document.getElementById("closeRequests");

const friendsList =
document.getElementById("friendsList");


let currentUser = null;
let foundUser = null;


const mecdChatURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/";


/* الرسائل */

function hideMessages(){

errorMessage.style.display =
"none";

successMessage.style.display =
"none";

}

function showError(message){

successMessage.style.display =
"none";

result.style.display =
"none";

errorMessage.textContent =
message;

errorMessage.style.display =
"block";

}

function showSuccess(message){

errorMessage.style.display =
"none";

successMessage.textContent =
message;

successMessage.style.display =
"block";

}


/* تسجيل الدخول */

onAuthStateChanged(
auth,
async(user)=>{

if(user){

currentUser = user;

loading.style.display =
"none";

app.style.display =
"block";

await loadFriends();

await loadRequestCount();

}else{

window.location.replace(
mecdChatURL
);

}

}
);


/* =========================
   البحث
========================= */

async function searchFriend(){

hideMessages();

result.style.display =
"none";

const id =
friendId.value
.trim()
.toUpperCase();


if(!id){

showError(
"اكتب ID الخاص بالصديق أولاً."
);

return;

}


if(
!/^MC-\d{6}$/.test(id)
){

showError(
"صيغة ID غير صحيحة. مثال: MC-000002"
);

return;

}


searchBtn.disabled =
true;

searchBtn.textContent =
"جاري البحث...";


try{

const usersRef =
collection(
db,
"users"
);

const usersQuery =
query(
usersRef,
where(
"chatID",
"==",
id
)
);

const snapshot =
await getDocs(
usersQuery
);


if(snapshot.empty){

showError(
"لم يتم العثور على مستخدم بهذا الـ ID."
);

return;

}


const userDoc =
snapshot.docs[0];

const data =
userDoc.data();


if(
currentUser &&
userDoc.id === currentUser.uid
){

showError(
"لا يمكنك إرسال طلب صداقة لنفسك."
);

return;

}


foundUser = {

uid:
userDoc.id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
"",

chatID:
data.chatID ||
id

};


/* عرض الصورة */

if(foundUser.photo){

userAvatar.innerHTML = `

<img
src="${foundUser.photo}"
alt="صورة المستخدم"
>

`;

}else{

userAvatar.textContent =
"👤";

}


userName.textContent =
foundUser.name;

foundUserId.textContent =
"ID: " +
foundUser.chatID;


/* فحص الحالة */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
foundUser.uid
);

const existingFriend =
await getDoc(
myFriendRef
);


if(existingFriend.exists()){

addButton.textContent =
"✓ أنتم أصدقاء بالفعل";

addButton.disabled =
true;

}else{

const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);

const existingRequest =
await getDoc(
requestRef
);


if(existingRequest.exists()){

const requestData =
existingRequest.data();


if(
requestData.status ===
"pending"
){

addButton.textContent =
"✓ تم إرسال طلب الصداقة";

addButton.disabled =
true;

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled =
false;

}

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled =
false;

}

}


result.style.display =
"block";


}catch(error){

console.error(
"Search error:",
error
);

console.error(
"Error code:",
error.code
);

console.error(
"Error message:",
error.message
);

showError(
"حدث خطأ أثناء البحث. حاول مرة أخرى."
);

}finally{

searchBtn.disabled =
false;

searchBtn.textContent =
"بحث";

}

}


/* زر البحث */

searchBtn.addEventListener(
"click",
searchFriend
);


friendId.addEventListener(
"keydown",
(event)=>{

if(
event.key === "Enter"
){

searchFriend();

}

}
);


/* =========================
   إرسال طلب الصداقة
========================= */

addButton.addEventListener(
"click",
async()=>{

if(
!currentUser ||
!foundUser
){

return;

}


addButton.disabled =
true;

addButton.textContent =
"جاري إرسال الطلب...";


try{

/* تأكيد عدم وجود صداقة */

const friendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
foundUser.uid
);

const existingFriend =
await getDoc(
friendRef
);


if(existingFriend.exists()){

addButton.textContent =
"✓ أنتم أصدقاء بالفعل";

return;

}


/* الطلب */

const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);

const existingRequest =
await getDoc(
requestRef
);


if(existingRequest.exists()){

const requestData =
existingRequest.data();

if(
requestData.status ===
"pending"
){

showSuccess(
"✓ تم إرسال طلب الصداقة مسبقًا."
);

addButton.textContent =
"✓ تم إرسال الطلب";

return;

}

}


/* إنشاء الطلب */

await setDoc(
requestRef,
{

fromUid:
currentUser.uid,

toUid:
foundUser.uid,

fromName:
currentUser.displayName ||
currentUser.email?.split("@")[0] ||
"مستخدم Mecd",

fromPhoto:
currentUser.photoURL ||
"",

fromChatID:
currentUser.chatID ||
"",

toName:
foundUser.name,

toPhoto:
foundUser.photo,

toChatID:
foundUser.chatID,

status:
"pending",

createdAt:
serverTimestamp()

}
);


showSuccess(
"📨 تم إرسال طلب الصداقة بنجاح!"
);

addButton.textContent =
"✓ تم إرسال الطلب";


}catch(error){

console.error(
"Request error:",
error
);

console.error(
"Request error code:",
error.code
);

console.error(
"Request error message:",
error.message
);

showError(
"حدث خطأ أثناء إرسال طلب الصداقة."
);

addButton.disabled =
false;

addButton.textContent =
"📨 إرسال طلب صداقة";

}

}
);


/* =========================
   عدد الطلبات
========================= */

async function loadRequestCount(){

if(!currentUser){

return;

}


try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where(
"status",
"==",
"pending"
)
);

const snapshot =
await getDocs(
requestsQuery
);


const count =
snapshot.size;


if(count > 0){

notificationCount.textContent =
count > 99 ? "99+" : count;

notificationCount.style.display =
"flex";

}else{

notificationCount.style.display =
"none";

}


}catch(error){

console.error(
"Request count error:",
error
);

}

}


/* =========================
   عرض الطلبات
========================= */

async function loadRequests(){

if(!currentUser){

return;

}


requestsList.innerHTML = `
<div class="no-requests">
جاري تحميل الطلبات...
</div>
`;


try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where(
"status",
"==",
"pending"
)
);

const snapshot =
await getDocs(
requestsQuery
);


if(snapshot.empty){

requestsList.innerHTML = `
<div class="no-requests">
لا توجد طلبات صداقة حالياً.
</div>
`;

return;

}


requestsList.innerHTML = "";


snapshot.forEach(
(requestDoc)=>{

const data =
requestDoc.data();

const item =
document.createElement("div");

item.className =
"request-item";


let avatar =
"👤";

if(data.fromPhoto){

avatar = `
<img
src="${data.fromPhoto}"
alt="صورة المستخدم"
>
`;

}


item.innerHTML = `

<div class="request-user">

<div class="request-avatar">
${avatar}
</div>

<div class="request-info">

<div class="request-name">
${escapeHTML(
data.fromName ||
"مستخدم Mecd"
)}
</div>

<div class="request-id">
ID: ${escapeHTML(
data.fromChatID ||
""
)}
</div>

</div>

</div>

<div class="request-actions">

<button
class="accept-button"
data-uid="${requestDoc.id}"
>
✓ قبول
</button>

<button
class="reject-button"
data-uid="${requestDoc.id}"
>
✕ رفض
</button>

</div>
`;


requestsList.appendChild(item);

}
);


/* أزرار القبول */

document
.querySelectorAll(".accept-button")
.forEach(
(button)=>{

button.addEventListener(
"click",
()=>acceptRequest(
button.dataset.uid
)
);

}
);


/* أزرار الرفض */

document
.querySelectorAll(".reject-button")
.forEach(
(button)=>{

button.addEventListener(
"click",
()=>rejectRequest(
button.dataset.uid
)
);

}
);


}catch(error){

console.error(
"Load requests error:",
error
);

requestsList.innerHTML = `
<div class="no-requests">
حدث خطأ أثناء تحميل الطلبات.
</div>
`;

}

}


/* =========================
   قبول طلب
========================= */

async function acceptRequest(senderUid){

if(!currentUser){

return;

}


try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
senderUid
);

const requestSnapshot =
await getDoc(
requestRef
);


if(!requestSnapshot.exists()){

showError(
"طلب الصداقة لم يعد موجودًا."
);

await loadRequests();

await loadRequestCount();

return;

}


const requestData =
requestSnapshot.data();


if(
requestData.status !==
"pending"
){

await loadRequests();

return;

}


/*
نحتاج معلومات المرسل
*/

const senderRef =
doc(
db,
"users",
senderUid
);

const senderSnapshot =
await getDoc(
senderRef
);


if(!senderSnapshot.exists()){

showError(
"حساب صاحب الطلب غير موجود."
);

return;

}


const senderData =
senderSnapshot.data();


/*
إضافة الصديق عند الطرف الحالي
*/

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
senderUid
);


await setDoc(
myFriendRef,
{

uid:
senderUid,

name:
senderData.name ||
requestData.fromName ||
"مستخدم Mecd",

photo:
senderData.photo ||
requestData.fromPhoto ||
"",

chatID:
senderData.chatID ||
requestData.fromChatID ||
"",

addedAt:
serverTimestamp()

}
);


/*
إضافة الطرف الحالي عند المرسل
*/

const senderFriendRef =
doc(
db,
"users",
senderUid,
"friends",
currentUser.uid
);


await setDoc(
senderFriendRef,
{

uid:
currentUser.uid,

name:
currentUser.displayName ||
"مستخدم Mecd",

photo:
currentUser.photoURL ||
"",

chatID:
requestData.toChatID ||
"",

addedAt:
serverTimestamp()

}
);


/*
تغيير حالة الطلب
*/

await updateDoc(
requestRef,
{

status:
"accepted",

acceptedAt:
serverTimestamp()

}
);


showSuccess(
"🤝 تمت الموافقة على طلب الصداقة!"
);


await loadRequests();

await loadRequestCount();

await loadFriends();


}catch(error){

console.error(
"Accept error:",
error);

showError(
"حدث خطأ أثناء قبول طلب الصداقة."
);

}

}


/* =========================
   رفض الطلب
========================= */

async function rejectRequest(senderUid){

if(!currentUser){

return;

}


try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
senderUid
);


await deleteDoc(
requestRef
);


showSuccess(
"تم رفض طلب الصداقة."
);


await loadRequests();

await loadRequestCount();


}catch(error){

console.error(
"Reject error:",
error
);

showError(
"حدث خطأ أثناء رفض الطلب."
);

}

}

   الأصدقاء

}

/* =========================
   حماية النصوص
========================= */

function escapeHTML(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

backBtn.addEventListener(
"click",
()=>{

window.location.href =
mecdChatURL;

}
);

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.then(
registration=>{

console.log(
"Friends Service Worker:",
registration.scope
);

}
)
.catch(
error=>{

console.error(
"Service Worker:",
error
);

}
);

}
);

}
