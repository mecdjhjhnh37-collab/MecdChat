<style>

/* =========================
   RESET
========================= */

*{
box-sizing:border-box;
margin:0;

}


/* =========================
   BODY
========================= */

body{

min-height:100vh;

Arial,

/* =========================

<script type="module">

/* ==================================================

import {

}
from

from

}
from

/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:

};


/* ==================================================
   INITIALIZE
================================================== */

const firebaseApp =
initializeApp(
firebaseConfig
);

const auth =
getAuth(
firebaseApp
);

const db =
getFirestore(
firebaseApp
);


/* ==================================================
   ELEMENTS
================================================== */

const loading =
document.getElementById(
"loading"
);

const loadingText =
document.getElementById(
"loadingText"
);

const app =
document.getElementById(
"app"
);

const friendsList =
document.getElementById(
"friendsList"
);

const friendCount =
document.getElementById(
"friendCount"
);

const notificationsBtn =
document.getElementById(
"notificationsBtn"
);

const notificationCount =
document.getElementById(
"notificationCount"
);

const notificationModal =
document.getElementById(
"notificationModal"
);

const closeModalBtn =
document.getElementById(
"closeModalBtn"
);

const requestList =
document.getElementById(
"requestList"
);

const backBtn =
document.getElementById(
"backBtn"
);

const friendModal =
document.getElementById(
"friendModal"
);

const closeFriendModal =
document.getElementById(
"closeFriendModal"
);

const selectedAvatar =
document.getElementById(
"selectedAvatar"
);

const selectedName =
document.getElementById(
"selectedName"
);

const selectedId =
document.getElementById(
"selectedId"
);

const chatButton =
document.getElementById(
"chatButton"
);

const removeFriendButton =
document.getElementById(
"removeFriendButton"
);


/* ==================================================
   VARIABLES
================================================== */

let currentUser = null;

let selectedFriend = null;


/* ==================================================
   URLS
================================================== */

const mecdChatURL =
"./index.html";

const chatURL =
"./chat.html";


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

return String(value ?? "")

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* ==================================================
   DEFAULT AVATAR
================================================== */

function defaultAvatar(){

return "👤";

}


/* ==================================================
   GET USER DATA
================================================== */

async function getUserData(uid){

if(!uid){

return {

name:"مستخدم Mecd",

photo:"",

chatID:""

};

}

try{

const userRef =
doc(
db,
"users",
uid
);

const userSnapshot =
await getDoc(
userRef
);

if(!userSnapshot.exists()){

return {

name:"مستخدم Mecd",

photo:"",

chatID:""

};

}

const data =
userSnapshot.data();

return {

name:
data.name ||
data.displayName ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
data.avatar ||
"",

chatID:
data.chatID ||
data.id ||
""

};

}catch(error){

console.error(
"getUserData:",
error
);

return {

name:"مستخدم Mecd",

photo:"",

chatID:""

};

}

}


/* ==================================================
   CREATE AVATAR
================================================== */

function avatarHTML(photo){

if(!photo){

return `
<span style="
display:flex;
align-items:center;
justify-content:center;
width:100%;
height:100%;
">
👤
</span>
`;

}

return `

<img
src="${escapeHTML(photo)}"
alt="صورة المستخدم"
onerror="
this.style.display='none';
this.parentElement.innerHTML='👤';
"
>

`;

}


/* ==================================================
   LOAD FRIENDS
================================================== */

async function loadFriends(){

friendsList.innerHTML = "";

friendCount.textContent = "0";

try{

const friendsRef =
collection(
db,
"users",
currentUser.uid,
"friends"
);

const snapshot =
await getDocs(
friendsRef
);

if(snapshot.empty){

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

لا يوجد لديك أصدقاء حتى الآن.

<br>

ابحث عن مستخدم وأرسل له طلب صداقة.

</div>

`;

return;

}


const friendElements = [];


for(
const friendDoc
of snapshot.docs
){

const friendUID =
friendDoc.id;

if(!friendUID){

continue;

}

const data =
await getUserData(
friendUID
);


const friendElement =
document.createElement(
"div"
);

friendElement.className =
"friend";


friendElement.innerHTML = `

<div class="friend-avatar">

${avatarHTML(data.photo)}

</div>

<div class="friend-info">

<div class="friend-name">

${escapeHTML(data.name)}

</div>

<div class="friend-id">

${
data.chatID
?
"ID: " +
escapeHTML(data.chatID)
:
""
}

</div>

</div>

<div class="friend-arrow">

←

</div>

`;


friendElement.addEventListener(
"click",
()=>{

selectedFriend = {

uid:friendUID,

name:data.name,

photo:data.photo,

chatID:data.chatID

};


selectedName.textContent =
data.name;


selectedId.textContent =
data.chatID
?
"ID: " + data.chatID
:
"";


selectedAvatar.innerHTML =
avatarHTML(data.photo);


friendModal.classList.add(
"show"
);

}
);


friendElements.push(
friendElement
);

}


if(friendElements.length === 0){

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

لا يوجد لديك أصدقاء حتى الآن.

</div>

`;

return;

}


friendElements.forEach(
element =>
friendsList.appendChild(element)
);


friendCount.textContent =
friendElements.length;


}catch(error){

console.error(
"loadFriends error:",
error
);

friendsList.innerHTML = `

<div class="error-box">

<div style="font-size:40px;">
⚠️
</div>

تعذر تحميل الأصدقاء.

<br>

${escapeHTML(error.message)}

<br>

<button
class="retry-button"
id="retryFriends"
type="button"
>

إعادة المحاولة

</button>

</div>

`;

const retry =
document.getElementById(
"retryFriends"
);

if(retry){

retry.addEventListener(
"click",
loadFriends
);

}

}

}


/* ==================================================
   LOAD FRIEND REQUESTS
================================================== */

async function loadFriendRequests(){

requestList.innerHTML = "";

notificationCount.textContent = "0";

notificationCount.classList.remove(
"show"
);


try{

/*
  مهم:
  نبحث فقط عن الطلبات المرسلة إلى المستخدم الحالي.
  هذا أفضل من قراءة كل friendRequests.
*/

const requestsRef =
collection(
db,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where(
"toUid",
"==",
currentUser.uid
)
);

const snapshot =
await getDocs(
requestsQuery
);


const requests = [];


snapshot.forEach(
requestDoc => {

const data =
requestDoc.data();


/*
  نقبل فقط الطلبات المعلقة.
*/

if(
data.status === "pending" ||
!data.status
){

requests.push({

id:requestDoc.id,

...data

});

}

}
);


/*
  تحديث الرقم الأحمر.
*/

notificationCount.textContent =
requests.length;


if(requests.length > 0){

notificationCount.classList.add(
"show"
);

}else{

notificationCount.classList.remove(
"show"
);

}


/*
  لا توجد طلبات.
*/

if(requests.length === 0){

requestList.innerHTML = `

<div class="empty">

<div class="empty-icon">
🔔
</div>

لا توجد طلبات صداقة جديدة.

</div>

`;

return;

}


/*
  عرض الطلبات.
*/

for(
const request
of requests
){

const fromUID =
request.fromUid ||
request.senderUid ||
request.from;


if(!fromUID){

continue;

}


let userData =
await getUserData(
fromUID
);


/*
  إذا كان الطلب يحتوي معلومات المستخدم
  نستخدمها عند الحاجة.
*/

if(
request.fromName &&
userData.name === "مستخدم Mecd"
){

userData.name =
request.fromName;

}

if(
request.fromPhoto &&
!userData.photo
){

userData.photo =
request.fromPhoto;

}


const requestElement =
document.createElement(
"div"
);

requestElement.className =
"request";


requestElement.innerHTML = `

<div class="request-user">

<div class="request-avatar">

${avatarHTML(userData.photo)}

</div>

<div>

<div class="request-name">

${escapeHTML(
userData.name
)}

</div>

<div class="request-id">

${
userData.chatID
?
"ID: " +
escapeHTML(userData.chatID)
:
""
}

</div>

</div>

</div>


<div class="request-actions">

<button
class="accept-button"
type="button"
>

قبول

</button>

<button
class="reject-button"
type="button"
>

رفض

</button>

</div>

`;


const acceptButton =
requestElement.querySelector(
".accept-button"
);

const rejectButton =
requestElement.querySelector(
".reject-button"
);


/* =========================
   ACCEPT
========================= */

acceptButton.addEventListener(
"click",
async()=>{

acceptButton.disabled =
true;

rejectButton.disabled =
true;

acceptButton.textContent =
"جاري القبول...";


try{

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
fromUID
);


const otherFriendRef =
doc(
db,
"users",
fromUID,
"friends",
currentUser.uid
);


/*
  إضافة الصديق عند الطرفين.
*/

await setDoc(
myFriendRef,
{

uid:fromUID,

name:userData.name || "مستخدم Mecd",

photo:userData.photo || "",

chatID:userData.chatID || "",

addedAt:serverTimestamp()

},
{
merge:true
}
);


const myData =
await getUserData(
currentUser.uid
);


await setDoc(
otherFriendRef,
{

uid:currentUser.uid,

name:myData.name || "مستخدم Mecd",

photo:myData.photo || "",

chatID:myData.chatID || "",

addedAt:serverTimestamp()

},
{
merge:true
}
);


/*
  تغيير حالة الطلب.
*/

const requestRef =
doc(
db,
"friendRequests",
request.id
);


await setDoc(
requestRef,
{

status:"accepted",

acceptedAt:
serverTimestamp()

},
{
merge:true
}
);


requestElement.remove();


await loadFriends();

await loadFriendRequests();


}catch(error){

console.error(
"Accept request error:",
error
);

alert(
"تعذر قبول طلب الصداقة:\n\n" +
error.message
);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

acceptButton.textContent =
"قبول";

}

}
);


/* =========================
   REJECT
========================= */

rejectButton.addEventListener(
"click",
async()=>{

acceptButton.disabled =
true;

rejectButton.disabled =
true;

rejectButton.textContent =
"جاري الرفض...";


try{

const requestRef =
doc(
db,
"friendRequests",
request.id
);


await setDoc(
requestRef,
{

status:"rejected",

rejectedAt:
serverTimestamp()

},
{
merge:true
}
);


requestElement.remove();


await loadFriendRequests();


}catch(error){

console.error(
"Reject request error:",
error
);

alert(
"تعذر رفض الطلب:\n\n" +
error.message
);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

rejectButton.textContent =
"رفض";

}

}
);


requestList.appendChild(
requestElement
);

}


}catch(error){

console.error(
"loadFriendRequests error:",
error
);


requestList.innerHTML = `

<div class="error-box">

<div style="font-size:40px;">
⚠️
</div>

تعذر تحميل طلبات الصداقة.

<br>

${escapeHTML(error.message)}

<br>

<button
class="retry-button"
id="retryRequests"
type="button"
>

إعادة المحاولة

</button>

</div>

`;


const retry =
document.getElementById(
"retryRequests"
);

if(retry){

retry.addEventListener(
"click",
loadFriendRequests
);

}

}

}


/* ==================================================
   CHAT BUTTON
================================================== */

chatButton.addEventListener(
"click",
()=>{

if(
!selectedFriend ||
!selectedFriend.uid
){

return;

}


window.location.href =
chatURL +
"?friend=" +
encodeURIComponent(
selectedFriend.uid
);

}
);


/* ==================================================
   REMOVE FRIEND
================================================== */

removeFriendButton.addEventListener(
"click",
async()=>{

if(
!currentUser ||
!selectedFriend
){

return;

}


const confirmed =
confirm(
"هل تريد إلغاء الصداقة مع " +
selectedFriend.name +
"؟"
);


if(!confirmed){

return;

}


removeFriendButton.disabled =
true;

removeFriendButton.textContent =
"جاري الإلغاء...";


try{

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
selectedFriend.uid
);


const otherFriendRef =
doc(
db,
"users",
selectedFriend.uid,
"friends",
currentUser.uid
);


await deleteDoc(
myFriendRef
);

await deleteDoc(
otherFriendRef
);


friendModal.classList.remove(
"show"
);


selectedFriend =
null;


await loadFriends();


}catch(error){

console.error(
"Remove friend error:",
error
);

alert(
"تعذر إلغاء الصداقة:\n\n" +
error.message
);

}finally{

removeFriendButton.disabled =
false;

removeFriendButton.textContent =
"❌ إلغاء الصداقة";

}

}
);


/* ==================================================
   OPEN REQUESTS
================================================== */

notificationsBtn.addEventListener(
"click",
async()=>{

notificationModal.classList.add(
"show"
);

await loadFriendRequests();

}
);


/* ==================================================
   CLOSE REQUEST MODAL
================================================== */

closeModalBtn.addEventListener(
"click",
()=>{

notificationModal.classList.remove(
"show"
);

}
);


/* ==================================================
   CLOSE FRIEND MODAL
================================================== */

closeFriendModal.addEventListener(
"click",
()=>{

friendModal.classList.remove(
"show"
);

selectedFriend =
null;

}
);


/* ==================================================
   CLICK OUTSIDE FRIEND MODAL
================================================== */

friendModal.addEventListener(
"click",
(event)=>{

if(
event.target === friendModal
){

friendModal.classList.remove(
"show"
);

selectedFriend =
null;

}

}
);


/* ==================================================
   CLICK OUTSIDE REQUEST MODAL
================================================== */

notificationModal.addEventListener(
"click",
(event)=>{

if(
event.target === notificationModal
){

notificationModal.classList.remove(
"show"
);

}

}
);


/* ==================================================
   ESC KEY
================================================== */

document.addEventListener(
"keydown",
(event)=>{

if(event.key !== "Escape"){

return;

}


friendModal.classList.remove(
"show"
);

notificationModal.classList.remove(
"show"
);

selectedFriend =
null;

}
);


/* ==================================================
   BACK BUTTON
================================================== */

backBtn.addEventListener(
"click",
()=>{

window.location.href =
mecdChatURL;

}
);


/* ==================================================
   SHOW APP
================================================== */

function showApp(){

loading.style.display =
"none";

app.style.display =
"flex";

}


/* ==================================================
   SHOW ERROR
================================================== */

function showMainError(message){

loading.innerHTML = `

<div style="
font-size:45px;
">
⚠️
</div>

<div style="
text-align:center;
padding:0 25px;
line-height:1.8;
">

${escapeHTML(message)}

<br>

<button
id="mainRetry"
class="retry-button"
type="button"
>

إعادة المحاولة

</button>

</div>

`;


const retry =
document.getElementById(
"mainRetry"
);


if(retry){

retry.addEventListener(
"click",
()=>{

location.reload();

}
);

}

}


/* ==================================================
   AUTH
================================================== */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

currentUser =
null;

loadingText.textContent =
"يجب تسجيل الدخول أولاً...";


setTimeout(
()=>{

window.location.href =
mecdChatURL;

},
700
);

return;

}


currentUser =
user;


try{

/*
  نحاول تحميل الأصدقاء والطلبات معًا.
  حتى لو فشل أحدهما لا تتجمد الصفحة.
*/

await Promise.allSettled([

loadFriends(),

loadFriendRequests()

]);


showApp();


}catch(error){

console.error(
"Page loading error:",
error
);

showMainError(
"حدث خطأ أثناء تحميل الصفحة."
);

}

}
);


/* ==================================================
   AUTH TIMEOUT
   يمنع بقاء شاشة التحميل للأبد
================================================== */

setTimeout(
()=>{

if(
loading.style.display !== "none" &&
!currentUser
){

loadingText.textContent =
"تعذر التحقق من تسجيل الدخول.";

setTimeout(
()=>{

if(
loading.style.display !== "none"
){

showMainError(
"تعذر الاتصال بحساب Mecd Chat. تأكد من تسجيل الدخول ثم حاول مرة أخرى."
);

}

},
800
);

}

},
12000
);

</script>

</body>

</html>
