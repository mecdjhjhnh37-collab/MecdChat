<style>

*{
box-sizing:border-box;
margin:0;

body{

header{

.logo{

.hero-icon{

#searchBtn{

.requests{

.requests-header{

.requests-title{

height:45px;

.request-item:last-child{

.request-user{

height:55px;

align-items:center;
justify-content:center;

.request-info{

min-width:0;
}

.request-name{

}

.request-id{

.accept-button,
.reject-button{
flex:1;

border-radius:13px;

cursor:pointer;

.accept-button{

.reject-button{

.accept-button:disabled,
.reject-button:disabled{

}

.friends-list{

flex-direction:column;
gap:12px;

.empty{

border-radius:22px;

.friend-item{
display:flex;
align-items:center;
gap:14px;
padding:16px;
border-radius:22px;
background:rgba(255,255,255,.035);

}

.friend-item:active{
transform:scale(.98);
}

.friend-avatar{
width:58px;
height:58px;
flex-shrink:0;
border-radius:18px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#303030;
font-size:25px;
}

.friend-info{
flex:1;
min-width:0;
}

.friend-name{
font-weight:bold;
font-size:16px;
margin-bottom:5px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

.friend-id{

font-size:12px;
}

.friend-arrow{

}

.friend-menu{

inset:0;

display:none;

}

.friend-menu-box{
width:100%;
max-width:650px;
padding:22px 20px 30px;

}

.friend-menu-user{

align-items:center;
gap:14px;
padding-bottom:18px;
margin-bottom:15px;

}

.friend-menu-avatar{
width:58px;
height:58px;
flex-shrink:0;
border-radius:18px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#303030;
font-size:25px;
}

.friend-menu-info{
flex:1;
min-width:0;
}

.friend-menu-name{
font-size:18px;
font-weight:bold;
overflow:hidden;
text-overflow:ellipsis;

}

.friend-menu-id{

.friend-menu-button{

margin-top:9px;

border-radius:15px;

}

.chat-friend-button{

}

.remove-friend-button{
background:rgba(255,255,255,.06);

}

.block-friend-button{
background:rgba(255,70,70,.10);
color:#ffaaaa;
border:1px solid rgba(255,70,70,.18);
}

.close-friend-menu{
background:rgba(255,255,255,.04);
color:#aaa;
}

.loading{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:18px;
background:linear-gradient(180deg,#07110f,#020504);

}

.spinner{
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;

@keyframes spin{
to{
transform:rotate(360deg);
}
}

@media(max-width:480px){

.app{
padding:20px 15px 35px;
}

.logo{
width:45px;
height:45px;
border-radius:14px;

}

.brand h2{
font-size:18px;
}

font-size:12px;
padding:9px 11px;
}

.hero h1{
font-size:30px;
}

.search-row{
flex-direction:column;
}

#searchBtn{
height:50px;
}

}

</style>
</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
getDoc,
doc,
setDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};

const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* =========================
   العناصر
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const friendId =
document.getElementById("friendId");

const searchBtn =
document.getElementById("searchBtn");

const result =
document.getElementById("result");

const userAvatar =
document.getElementById("userAvatar");

const userName =
document.getElementById("userName");

const foundUserId =
document.getElementById("foundUserId");

const addButton =
document.getElementById("addButton");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");

const backBtn =
document.getElementById("backBtn");

const notificationBtn =
document.getElementById("notificationBtn");

const notificationCount =
document.getElementById("notificationCount");

const requests =
document.getElementById("requests");

const requestsList =
document.getElementById("requestsList");

const closeRequests =
document.getElementById("closeRequests");

const friendsList =
document.getElementById("friendsList");

const friendMenu =
document.getElementById("friendMenu");

const menuFriendAvatar =
document.getElementById("menuFriendAvatar");

const menuFriendName =
document.getElementById("menuFriendName");

const menuFriendId =
document.getElementById("menuFriendId");

const chatFriendButton =
document.getElementById("chatFriendButton");

const removeFriendButton =
document.getElementById("removeFriendButton");

const blockFriendButton =
document.getElementById("blockFriendButton");

const closeFriendMenu =
document.getElementById("closeFriendMenu");


/* =========================
   المتغيرات
========================= */

let currentUser = null;
let currentUserData = null;
let foundUser = null;
let selectedFriend = null;

const mecdChatURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/";

const chatPageURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/chat.html";


/* =========================
   حماية HTML
========================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   الرسائل
========================= */

function hideMessages(){

errorMessage.style.display = "none";
successMessage.style.display = "none";

}

function showError(message){

successMessage.style.display = "none";

result.style.display = "none";

errorMessage.textContent = message;

errorMessage.style.display = "block";

}

function showSuccess(message){

errorMessage.style.display = "none";

successMessage.textContent = message;

successMessage.style.display = "block";

}


/* =========================
   تحميل بيانات المستخدم الحالي
========================= */

async function loadCurrentUserData(){

if(!currentUser){
return null;
}

const userRef =
doc(
db,
"users",
currentUser.uid
);

const snapshot =
await getDoc(userRef);

if(snapshot.exists()){

currentUserData =
snapshot.data();

}else{

currentUserData = {};

}

return currentUserData;

}


/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.replace(
mecdChatURL
);

return;

}

currentUser = user;

try{

await loadCurrentUserData();

loading.style.display = "none";

app.style.display = "block";

await loadFriends();

await loadRequestCount();

}catch(error){

console.error(
"Initial loading error:",
error
);

loading.style.display = "none";

app.style.display = "block";

showError(
"حدث خطأ أثناء تحميل البيانات."
);

}

}
);


/* =========================
   البحث عن صديق
========================= */

async function searchFriend(){

hideMessages();

result.style.display = "none";

foundUser = null;

const id =
friendId.value
.trim()
.toUpperCase();


if(!id){

showError(
"اكتب ID الخاص بالصديق أولاً."
);

return;

}


if(!/^MC-\d{6}$/.test(id)){

showError(
"صيغة ID غير صحيحة. مثال: MC-000002"
);

return;

}


if(!currentUser){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}


searchBtn.disabled = true;

searchBtn.textContent = "جاري البحث...";


try{

const usersRef =
collection(
db,
"users"
);

const usersQuery =
query(
usersRef,
where(
"chatID",
"==",
id
)
);

const snapshot =
await getDocs(usersQuery);


if(snapshot.empty){

showError(
"لم يتم العثور على مستخدم بهذا الـ ID."
);

return;

}


const userDoc =
snapshot.docs[0];

const data =
userDoc.data();


if(userDoc.id === currentUser.uid){

showError(
"لا يمكنك إرسال طلب صداقة لنفسك."
);

return;

}


foundUser = {

uid:userDoc.id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
id

};


if(foundUser.photo){

userAvatar.innerHTML = `
<img
src="${escapeHTML(foundUser.photo)}"
alt="صورة المستخدم"
>
`;

}else{

/* =========================
   عدد طلبات الصداقة
========================= */

async function loadRequestCount(){

if(!currentUser){
return;
}

try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where(
"status",
"==",
"pending"
)
);

const snapshot =
await getDocs(requestsQuery);

const count =
snapshot.size;


if(count > 0){

notificationCount.textContent =
count > 99 ? "99+" : count;

notificationCount.style.display =
"flex";

}else{

notificationCount.style.display =
"none";

}

}catch(error){

console.error(
"Request count error:",
error
);

}

}


/* =========================
   عرض طلبات الصداقة
========================= */

async function loadRequests(){

if(!currentUser){
return;
}

requestsList.innerHTML = `
<div class="no-requests">
جاري تحميل الطلبات...
</div>
`;

try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where(
"status",
"==",
"pending"
)
);

const snapshot =
await getDocs(requestsQuery);


if(snapshot.empty){

requestsList.innerHTML = `
<div class="no-requests">
لا توجد طلبات صداقة حالياً.
</div>
`;

return;

}


requestsList.innerHTML = "";


snapshot.forEach(
(requestDoc)=>{

const data =
requestDoc.data();

const item =
document.createElement("div");

item.className =
"request-item";


let avatar = "👤";


if(data.fromPhoto){

avatar = `
<img
src="${escapeHTML(data.fromPhoto)}"
alt="صورة المستخدم"
>
`;

}


item.innerHTML = `

<div class="request-user">

<div class="request-avatar">
${avatar}
</div>

<div class="request-info">

<div class="request-name">
${escapeHTML(
data.fromName ||
"مستخدم Mecd"
)}
</div>

<div class="request-id">
ID:
${escapeHTML(
data.fromChatID ||
""
)}
</div>

</div>

</div>

<div class="request-actions">

<button
class="accept-button"
data-uid="${escapeHTML(requestDoc.id)}"
>
✓ قبول
</button>

<button
class="reject-button"
data-uid="${escapeHTML(requestDoc.id)}"
>
✕ رفض
</button>

</div>
`;

requestsList.appendChild(item);

}
);


document
.querySelectorAll(".accept-button")
.forEach(
(button)=>{

button.addEventListener(
"click",
()=>acceptRequest(
button.dataset.uid
)
);

}
);


document
.querySelectorAll(".reject-button")
.forEach(
(button)=>{

button.addEventListener(
"click",
()=>rejectRequest(
button.dataset.uid
)
);

}
);


}catch(error){

console.error(
"Load requests error:",
error
);

requestsList.innerHTML = `
<div class="no-requests">
حدث خطأ أثناء تحميل الطلبات.
</div>
`;

}

}


/* =========================
   قبول طلب
========================= */

async function acceptRequest(senderUid){

if(!currentUser){
return;
}

try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
senderUid
);

const requestSnapshot =
await getDoc(requestRef);


if(!requestSnapshot.exists()){

showError(
"طلب الصداقة غير موجود."
);

await loadRequests();

return;

}


const data =
requestSnapshot.data();


if(data.status !== "pending"){

showError(
"هذا الطلب لم يعد متاحًا."
);

await loadRequests();

return;

}


/* بيانات الطرف الآخر */

const senderRef =
doc(
db,
"users",
senderUid
);

const senderSnapshot =
await getDoc(senderRef);


if(!senderSnapshot.exists()){

showError(
"لم يتم العثور على حساب المرسل."
);

return;

}


const senderData =
senderSnapshot.data();


/* إنشاء الصداقة عند الطرف الحالي */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
senderUid
);


/* إنشاء الصداقة عند الطرف الآخر */

const senderFriendRef =
doc(
db,
"users",
senderUid,
"friends",
currentUser.uid
);


const myName =
currentUserData?.name ||
currentUser.displayName ||
currentUser.email?.split("@")[0] ||
"مستخدم Mecd";

const myPhoto =
currentUserData?.photo ||
currentUserData?.photoURL ||
currentUser.photoURL ||
"";

const myChatID =
currentUserData?.chatID ||
"";


await setDoc(
myFriendRef,
{

uid:
senderUid,

name:
senderData.name ||
data.fromName ||
"مستخدم Mecd",

photo:
senderData.photo ||
senderData.photoURL ||
data.fromPhoto ||
"",

chatID:
senderData.chatID ||
data.fromChatID ||
"",

addedAt:
serverTimestamp()

}
);


await setDoc(
senderFriendRef,
{

uid:
currentUser.uid,

name:
myName,

photo:
myPhoto,

chatID:
myChatID,

addedAt:
serverTimestamp()

}
);


/* حذف الطلب */

await deleteDoc(
requestRef
);


showSuccess(
"✓ تم قبول طلب الصداقة."
);

await loadRequests();

await loadRequestCount();

await loadFriends();


}catch(error){

console.error(
"Accept request error:",
error
);

if(error.code === "permission-denied"){

showError(
"تم رفض العملية من Firestore Rules."
);

}else{

showError(
"حدث خطأ أثناء قبول طلب الصداقة."
);

}

}

}


/* =========================
   رفض الطلب
========================= */

async function rejectRequest(senderUid){

if(!currentUser){
return;
}

try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
senderUid
);

await deleteDoc(
requestRef
);

showSuccess(
"تم رفض طلب الصداقة."
);

await loadRequests();

await loadRequestCount();


}catch(error){

console.error(
"Reject request error:",
error
);

showError(
"حدث خطأ أثناء رفض الطلب."
);

}

}


/* =========================
   تحميل الأصدقاء
========================= */

async function loadFriends(){

if(!currentUser){
return;
}

friendsList.innerHTML = `
<div class="empty">
جاري تحميل الأصدقاء...
</div>
`;

try{

const friendsRef =
collection(
db,
"users",
currentUser.uid,
"friends"
);

await getDocs(friendsRef);

friendsList.innerHTML = `

<br>

ابحث عن صديق باستخدام الـ ID لإضافته.

</div>
`;

return;

}


friendsList.innerHTML = "";


for(

of snapshot.docs
){

friendDoc.data();

friendDoc.id;


const item =
document.createElement("div");

item.className =
"friend-item";


let avatar =
"👤";


if(data.photo){

avatar = `
<img
src="${escapeHTML(data.photo)}"
alt="صورة المستخدم"
>
`;

}


item.innerHTML = `

<div class="friend-avatar">
${avatar}
</div>

<div class="friend-info">

<div class="friend-name">
${escapeHTML(
data.name ||
"مستخدم Mecd"
)}
</div>

<div class="friend-id">
ID:
${escapeHTML(
data.chatID ||
""
)}
</div>

</div>

<div class="friend-arrow">
‹
</div>
`;


item.addEventListener(
"click",
()=>openFriendMenu(
{

uid:
friendUid,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
"",

chatID:
data.chatID ||
""

}
)
);


friendsList.appendChild(item);

}


}catch(error){

console.error(
"Load friends error:",
error
);

friendsList.innerHTML = `
<div class="empty">
حدث خطأ أثناء تحميل الأصدقاء.
</div>
`;

}

}


/* =========================
   فتح قائمة الصديق
========================= */

function openFriendMenu(friend){

selectedFriend =
friend;

menuFriendName.textContent =
friend.name;

menuFriendId.textContent =
"ID: " +
friend.chatID;


if(friend.photo){

menuFriendAvatar.innerHTML = `
<img
src="${escapeHTML(friend.photo)}"
alt="صورة المستخدم"
>
`;

}else{

menuFriendAvatar.textContent =
"👤";

}


friendMenu.style.display =
"flex";

}


/* =========================
   إغلاق قائمة الصديق
========================= */

function closeMenu(){

friendMenu.style.display =
"none";

selectedFriend =
null;

}

closeFriendMenu.addEventListener(
"click",
closeMenu
);


friendMenu.addEventListener(
"click",
(event)=>{

if(event.target === friendMenu){

closeMenu();

}

}
);
