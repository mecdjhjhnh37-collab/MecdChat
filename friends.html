.loading{

<script type="module">

/* =====================================

===================================== */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* =====================================
   العناصر
===================================== */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const friendId =
document.getElementById("friendId");

const searchBtn =
document.getElementById("searchBtn");

const result =
document.getElementById("result");

const userAvatar =
document.getElementById("userAvatar");

const userName =
document.getElementById("userName");

const foundUserId =
document.getElementById("foundUserId");

const addButton =
document.getElementById("addButton");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");

const backBtn =
document.getElementById("backBtn");

const notificationBtn =
document.getElementById("notificationBtn");

const notificationCount =
document.getElementById("notificationCount");

const requests =
document.getElementById("requests");

const requestsList =
document.getElementById("requestsList");

const closeRequests =
document.getElementById("closeRequests");

const friendsList =
document.getElementById("friendsList");

const friendMenu =
document.getElementById("friendMenu");

const menuFriendAvatar =
document.getElementById("menuFriendAvatar");

const menuFriendName =
document.getElementById("menuFriendName");

document.getElementById("menuFriendId");

document.getElementById("chatFriendButton");

const blockFriendButton =
document.getElementById("blockFriendButton");

const closeFriendMenu =
document.getElementById("closeFriendMenu");


/* =====================================
   المتغيرات
===================================== */

let currentUser = null;
let currentUserData = null;
let foundUser = null;
let selectedFriend = null;


/* =====================================
   الروابط
===================================== */

const mecdChatURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/";

const chatPageURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/chat.html";


/* =====================================
   حماية النصوص
===================================== */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================
   الصورة
===================================== */

function setAvatar(element,photo){

element.innerHTML = "";

if(photo){

const img =
document.createElement("img");

img.src = photo;
img.alt = "صورة المستخدم";

img.onerror = () => {

element.innerHTML = "👤";

};

element.appendChild(img);

}else{

element.textContent = "👤";

}

}


/* =====================================
   الرسائل
===================================== */

function hideMessages(){

errorMessage.style.display = "none";
successMessage.style.display = "none";

}


function showError(message){

successMessage.style.display = "none";

errorMessage.textContent = message;

errorMessage.style.display = "block";

}


function showSuccess(message){

errorMessage.style.display = "none";

successMessage.textContent = message;

successMessage.style.display = "block";

}


/* =====================================
   بيانات المستخدم
===================================== */

async function loadCurrentUserData(){

if(!currentUser){
return null;
}

const userRef =
doc(
db,
"users",
currentUser.uid
);

const snapshot =
await getDoc(userRef);

if(snapshot.exists()){

currentUserData =
snapshot.data();

}else{

currentUserData = {};

}

return currentUserData;

}


/* =====================================
   البحث عن صديق
===================================== */

async function searchFriend(){

hideMessages();

result.style.display = "none";

foundUser = null;

const id =
friendId.value
.trim()
.toUpperCase();

if(!id){

showError(
"اكتب ID الخاص بالصديق أولاً."
);

return;

}


if(!/^MC-\d{6}$/.test(id)){

showError(
"صيغة ID غير صحيحة. مثال: MC-000002"
);

return;

}


if(!currentUser){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}


searchBtn.disabled = true;
searchBtn.textContent = "جاري البحث...";


try{

const usersRef =
collection(db,"users");

const usersQuery =
query(
usersRef,
where("chatID","==",id)
);

const snapshot =
await getDocs(usersQuery);


if(snapshot.empty){

showError(
"لم يتم العثور على مستخدم بهذا الـ ID."
);

return;

}


const userDoc =
snapshot.docs[0];

const data =
userDoc.data();


if(userDoc.id === currentUser.uid){

showError(
"لا يمكنك إرسال طلب صداقة لنفسك."
);

return;

}


foundUser = {

uid:userDoc.id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
id

};


setAvatar(
userAvatar,
foundUser.photo
);

userName.textContent =
foundUser.name;

foundUserId.textContent =
"ID: " + foundUser.chatID;


/* ===============================
   هل هو صديق؟
================================ */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,

async function loadRequests(){

}

try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

query(
requestsRef,
where("status","==","pending")
);

const snapshot =
await getDocs(requestsQuery);


if(snapshot.empty){

requestsList.innerHTML = `

<div class="no-requests">

لا توجد طلبات صداقة جديدة.

</div>

`;

return;

}


const requestArray = [];


snapshot.forEach(
(requestDoc)=>{

requestArray.push({

id:
requestDoc.id,

...requestDoc.data()

});

});


requestArray.sort(
(a,b)=>{

const aTime =
a.createdAt?.seconds || 0;

const bTime =
b.createdAt?.seconds || 0;

return bTime - aTime;

}
);


requestArray.forEach(
(request)=>{

createRequestElement(request);

});


}catch(error){

console.error(
"Load requests error:",
error
);

requestsList.innerHTML = `

<div class="no-requests">

حدث خطأ أثناء تحميل الطلبات.

</div>

`;

}

}

/* =====================================
   قبول طلب الصداقة
===================================== */

async function acceptFriendRequest(
request,
acceptButton,
rejectButton
){

if(!currentUser){

return;

}


acceptButton.disabled =
true;

rejectButton.disabled =
true;

acceptButton.textContent =
"جاري القبول...";


try{

const senderUid =
request.fromUid ||
request.id;


if(!senderUid){

throw new Error(
"Missing sender UID"
);

}


/* بيانات الطرف الآخر */

const senderRef =
doc(
db,
"users",
senderUid
);

const senderSnapshot =
await getDoc(senderRef);


let senderData =
{};


if(senderSnapshot.exists()){

senderData =
senderSnapshot.data();

}


/* بيانات الصديق للطرف الآخر */

const friendForMe = {

uid:
senderUid,

name:
senderData.name ||
request.fromName ||
"مستخدم Mecd",

chatID:
senderData.chatID ||
request.fromChatID ||
"",

photo:
senderData.photo ||
senderData.photoURL ||
request.fromPhoto ||
""

};


/* بياناتي للطرف الآخر */

const friendForThem = {

uid:
currentUser.uid,

name:
currentUserData?.name ||
currentUser.displayName ||
"مستخدم Mecd",

chatID:
currentUserData?.chatID ||
"",

photo:
currentUserData?.photo ||
currentUserData?.photoURL ||
currentUser.photoURL ||
""

};


const batch =
writeBatch(db);


/* إضافة الصديق عندي */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
senderUid
);


batch.set(
myFriendRef,
{

uid:
friendForMe.uid,

name:
friendForMe.name,

chatID:
friendForMe.chatID,

photo:
friendForMe.photo,

createdAt:
serverTimestamp()

}
);


/* إضافتي عنده */

const theirFriendRef =
doc(
db,
"users",
senderUid,
"friends",
currentUser.uid
);


batch.set(
theirFriendRef,
{

uid:
friendForThem.uid,

name:
friendForThem.name,

chatID:
friendForThem.chatID,

photo:
friendForThem.photo,

createdAt:
serverTimestamp()

}
);


/* حذف الطلب */

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
request.id
);


batch.delete(requestRef);


await batch.commit();


await loadRequests();
await loadRequestCount();
await loadFriends();


showSuccess(
"تم قبول طلب الصداقة."
);


}catch(error){

console.error(
"Accept request error:",
error
);

console.error(
"Error code:",
error.code
);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

acceptButton.textContent =
"✓ قبول";


if(error.code === "permission-denied"){

alert(
"تم رفض العملية بسبب Firestore Rules. تأكد من القواعد الموجودة أسفل الكود."
);

}else{

alert(
"حدث خطأ أثناء قبول الطلب."
);

}

}

}
