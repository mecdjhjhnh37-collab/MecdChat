<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050807">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-capable"
content="yes">

content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="Mecd Chat">

<title>Mecd Chat - بحث عن صديق</title>


<style>

/* ==================================================
   RESET
================================================== */

*{
box-sizing:border-box;
margin:0;
padding:0;
}


/* ==================================================
   BODY
================================================== */

body{

min-height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:

radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),

linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow-x:hidden;
}


/* ==================================================
   BACKGROUND
================================================== */

.background{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;
}

.glow{

position:absolute;

width:300px;
height:300px;

border-radius:50%;

filter:blur(100px);

opacity:.18;
}

.glow.one{

background:#00e676;

top:-100px;

right:-100px;
}

.glow.two{

background:#2979ff;

bottom:-100px;

left:-100px;
}


/* ==================================================
   APP
================================================== */

.app{

position:relative;

z-index:1;

width:100%;

max-width:650px;

min-height:100vh;

margin:auto;

padding:22px 20px 45px;

display:flex;

flex-direction:column;
}


/* ==================================================
   PAGE TITLE
================================================== */

.page-title{

text-align:center;

margin-top:35px;

margin-bottom:30px;
}

.page-title h1{

font-size:
clamp(30px,7vw,45px);

margin-bottom:12px;
}

.page-title h1 span{

color:#00e676;
}

.page-title p{

color:#9ba7a4;

font-size:14px;

line-height:1.7;
}


/* ==================================================
   SEARCH BOX
================================================== */

.search-box{

padding:25px;

border-radius:28px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.035);

box-shadow:
0 20px 60px
rgba(0,0,0,.22);
}


/* ==================================================
   LABEL
================================================== */

.search-label{

display:block;

margin-bottom:12px;

font-size:17px;

color:#cbd6d2;
}


/* ==================================================
   INPUT
================================================== */

.search-input{

width:100%;

height:60px;

padding:0 20px;

border-radius:20px;

border:1px solid
rgba(255,255,255,.1);

background:
rgba(255,255,255,.035);

color:white;

font-family:inherit;

font-size:17px;

outline:none;

direction:ltr;

text-align:left;

transition:.2s ease;
}

.search-input::placeholder{

color:#687572;
}

.search-input:focus{

border-color:#00e676;

box-shadow:
0 0 0 3px
rgba(0,230,118,.08);
}


/* ==================================================
   SEARCH BUTTON
================================================== */

.search-button{

width:100%;

height:64px;

margin-top:18px;

border:none;

border-radius:20px;

background:#00e889;

color:#00150e;

font-family:inherit;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.2s ease;
}

.search-button:hover{

background:#00f294;

transform:translateY(-2px);
}

.search-button:active{

transform:scale(.98);
}

.search-button:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;
}


/* ==================================================
   RESULT CARD
================================================== */

.result-card{

margin-top:30px;

padding:25px;

border-radius:25px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.045);

display:none;

animation:
resultIn .2s ease;
}

.result-card.show{

display:block;
}

@keyframes resultIn{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:translateY(0);

}

}


/* ==================================================
   RESULT TITLE
================================================== */

.result-title{

color:#8d9995;

font-size:15px;

margin-bottom:20px;
}


/* ==================================================
   USER ROW
================================================== */

.user-row{

display:flex;

align-items:center;

gap:15px;

margin-bottom:22px;
}


/* ==================================================
   USER AVATAR
================================================== */

.user-avatar{

width:70px;

height:70px;

flex-shrink:0;

border-radius:20px;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:
linear-gradient(
135deg,
#293b37,
#15211e
);

border:2px solid #00e676;

font-size:30px;

font-weight:bold;
}

.user-avatar img{

width:100%;

height:100%;

object-fit:cover;
}


/* ==================================================
   USER INFO
================================================== */

.user-info{

flex:1;

min-width:0;
}

.user-name{

font-size:22px;

font-weight:bold;

margin-bottom:7px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;
}

.user-id{

font-size:14px;

color:#00e676;

direction:ltr;

text-align:right;
}


/* ==================================================
   ACTION AREA
================================================== */

.action-area{

width:100%;
}


/* ==================================================
   SEND FRIEND REQUEST
================================================== */

.send-request-button{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#00e889;

color:#00150e;

font-family:inherit;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.2s ease;
}

.send-request-button:hover{

background:#00f294;

transform:translateY(-1px);
}

.send-request-button:active{

transform:scale(.98);
}

.send-request-button:disabled{

opacity:.6;

cursor:not-allowed;

transform:none;
}


/* ==================================================
   SENT + CANCEL BUTTONS
================================================== */

.request-status{

width:100%;

display:flex;

align-items:center;

justify-content:center;

gap:10px;
}


/* تم إرسال الطلب مسبقًا */

.already-sent-button{

flex:1;

min-width:0;

height:50px;

padding:0 12px;

border:1px solid
rgba(0,230,118,.16);

border-radius:15px;

background:
rgba(0,185,107,.72);

color:#001a10;

font-family:inherit;

font-size:13px;

font-weight:bold;

white-space:nowrap;

cursor:default;
}


/* إلغاء الطلب */

.cancel-request-button{

flex:0 0 auto;

height:50px;

padding:0 15px;

border-radius:15px;

border:1px solid
rgba(255,80,80,.3);

background:
rgba(255,60,60,.08);

color:#ff9b9b;

font-family:inherit;

font-size:13px;

font-weight:bold;

white-space:nowrap;

cursor:pointer;

transition:.2s ease;
}

.cancel-request-button:hover{

background:
rgba(255,60,60,.16);

border-color:
rgba(255,80,80,.5);

transform:translateY(-1px);
}

.cancel-request-button:active{

transform:scale(.97);
}

.cancel-request-button:disabled{

opacity:.5;

cursor:not-allowed;

transform:none;
}


/* ==================================================
   FRIEND BUTTON
================================================== */

.friend-button{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#00b96b;

color:#00150e;

font-family:inherit;

font-size:16px;

font-weight:bold;

cursor:default;
}


/* ==================================================
   MESSAGE
================================================== */

.message{

margin-top:25px;

padding:20px;

border-radius:18px;

text-align:center;

font-size:14px;

line-height:1.7;

display:none;
}

.message.show{

display:block;
}

.message.error{

background:
rgba(255,60,60,.06);

border:1px solid
rgba(255,80,80,.18);

color:#ffaaaa;
}

.message.info{

background:
rgba(0,230,118,.05);

border:1px solid
rgba(0,230,118,.15);

color:#9ddbc0;
}


/* ==================================================
   BACK BUTTON
================================================== */

.back-button{

width:100%;

margin-top:35px;

padding:18px;

border-radius:19px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.035);

color:white;

font-family:inherit;

font-size:15px;

cursor:pointer;

transition:.2s ease;
}

.back-button:hover{

border-color:
rgba(0,230,118,.3);

transform:translateY(-1px);
}

.back-button:active{

transform:scale(.98);
}


/* ==================================================
   FOOTER
================================================== */

footer{

margin-top:auto;

padding-top:45px;

text-align:center;

color:#58635f;

font-size:11px;
}


/* ==================================================
   LOADING
================================================== */

.loading{

position:fixed;

inset:0;

z-index:10000;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:18px;

background:

linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;

font-size:16px;
}

.spinner{

width:35px;

height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;
}

@keyframes spin{

to{

transform:rotate(360deg);

}

}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:480px){

.app{

padding:18px 15px 35px;
}

.page-title{

margin-top:25px;
}

.page-title h1{

font-size:31px;
}

.search-box{

padding:20px;

border-radius:24px;
}

.search-input{

height:58px;

font-size:16px;
}

.search-button{

height:60px;
}

.result-card{

padding:20px;

border-radius:22px;
}

.user-avatar{

width:62px;

height:62px;

border-radius:18px;
}

.user-name{

font-size:19px;
}

.user-id{

font-size:13px;
}


/*
   على الهاتف يبقى الزران
   بجانب بعض
*/

.request-status{

gap:8px;
}

.already-sent-button{

height:46px;

padding:0 9px;

font-size:11px;
}

.cancel-request-button{

height:46px;

padding:0 11px;

font-size:11px;
}

.back-button{

margin-top:30px;
}

}


/* ==================================================
   VERY SMALL SCREENS
================================================== */

@media(max-width:350px){

.request-status{

gap:6px;
}

.already-sent-button{

font-size:10px;

padding:0 7px;
}

.cancel-request-button{

font-size:10px;

padding:0 8px;
}

}

</style>

</head>


<body>

     BACKGROUND
================================================== -->

<div class="background">

id="loading"

>

>

<section class="search-box">

class="search-label"
for="friendIdInput"
>

الصديق ID

id="friendIdInput"
class="search-input"

placeholder="MC-000001"
autocomplete="off"
spellcheck="false"
>

<!-- ==================================================
     FIREBASE
================================================== -->

<script type="module">


/* ==================================================
   IMPORT FIREBASE APP
================================================== */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


/* ==================================================
   IMPORT AUTH
================================================== */

import {

getAuth,

onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ==================================================
   IMPORT FIRESTORE
================================================== */

import {

getFirestore,

doc,

getDoc,

setDoc,

deleteDoc,

collection,

getDocs,

query,

where,

serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


/* ==================================================
   INITIALIZE
================================================== */

const firebaseApp =
initializeApp(
firebaseConfig
);

const auth =
getAuth(
firebaseApp
);

const db =
getFirestore(
firebaseApp
);


/* ==================================================
   ELEMENTS
================================================== */

const loading =
document.getElementById(
"loading"
);

const app =
document.getElementById(
"app"
);

const input =
document.getElementById(
"friendIdInput"
);

const searchButton =
document.getElementById(
"searchButton"
);

const resultCard =
document.getElementById(
"resultCard"
);

const userAvatar =
document.getElementById(
"userAvatar"
);

const userName =
document.getElementById(
"userName"
);

const userId =
document.getElementById(
"userId"
);

const actionArea =
document.getElementById(
"actionArea"
);

const message =
document.getElementById(
"message"
);

const backButton =
document.getElementById(
"backButton"
);


/* ==================================================
   VARIABLES
================================================== */

let currentUser = null;

let foundUser = null;


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(text){

return String(text || "")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
text,
type = "info"
){

message.textContent =
text;

message.className =
"message show " + type;

}


function hideMessage(){

message.textContent =
"";

message.className =
"message";

}


/* ==================================================
   AVATAR
================================================== */

function setAvatar(
photo,
name
){

if(photo){

userAvatar.innerHTML = `

<img
src="${escapeHTML(photo)}"
alt="صورة المستخدم"
>

`;

return;

}


const letter =

String(
name || "م"
)

.trim()

.charAt(0)

.toUpperCase();


userAvatar.textContent =
letter || "👤";

}


/* ==================================================
   FIND USER
================================================== */

async function findUser(){

const enteredID =

input.value

.trim()

.toUpperCase();


if(!enteredID){

showMessage(
"اكتب ID المستخدم أولاً.",
"error"
);

resultCard.classList.remove(
"show"
);

return;

}


searchButton.disabled =
true;

searchButton.textContent =
"جاري البحث...";

hideMessage();

resultCard.classList.remove(
"show"
);

foundUser = null;


try{


/*
   البحث عن المستخدم بواسطة chatID
*/

const usersRef =
collection(
db,
"users"
);


const userQuery =
query(

usersRef,

where(
"chatID",
"==",
enteredID
)

);


const snapshot =
await getDocs(
userQuery
);


if(snapshot.empty){

showMessage(
"لم يتم العثور على مستخدم بهذا الـ ID.",
"error"
);

return;

}


const foundDoc =
snapshot.docs[0];


foundUser = {

uid:
foundDoc.id,

...foundDoc.data()

};


/*
   منع إرسال طلب لنفسك
*/

if(
foundUser.uid ===
currentUser.uid
){

showMessage(
"لا يمكنك إرسال طلب صداقة إلى نفسك.",
"error"
);

return;

}


/*
   عرض معلومات المستخدم
*/

userName.textContent =

foundUser.name ||

"مستخدم Mecd";


userId.textContent =

"ID: " +

(
foundUser.chatID ||
enteredID
);


setAvatar(

foundUser.photo ||
foundUser.photoURL ||
"",

foundUser.name

);


resultCard.classList.add(
"show"
);


/*
   معرفة حالة العلاقة
*/

await updateRequestButton();


}catch(error){

console.error(
"Search error:",
error
);

showMessage(
"حدث خطأ أثناء البحث. حاول مرة أخرى.",
"error"
);

}finally{

searchButton.disabled =
false;

searchButton.textContent =
"بحث";

}

}


/* ==================================================
   CHECK FRIEND
================================================== */

async function isFriend(){

if(
!currentUser ||
!foundUser
){

return false;

}


const friendRef =

doc(

db,

"users",

currentUser.uid,

"friends",

foundUser.uid

);


const friendDoc =

await getDoc(
friendRef
);


return friendDoc.exists();

}


/* ==================================================
   GET PENDING REQUEST
================================================== */

async function getPendingRequest(){

if(
!currentUser ||
!foundUser
){

return null;

}


/*
   البحث عن الطلب المرسل
*/

const requestsRef =

collection(
db,
"friendRequests"
);


const requestQuery =

query(

requestsRef,

where(
"fromUid",
"==",
currentUser.uid
),

where(
"toUid",
"==",
foundUser.uid
),

where(
"status",
"==",
"pending"
)

);


const snapshot =

await getDocs(
requestQuery
);


if(snapshot.empty){

return null;

}


const requestDoc =

snapshot.docs[0];


return {

id:
requestDoc.id,

...requestDoc.data()

};

}


/* ==================================================
   UPDATE BUTTON
================================================== */

async function updateRequestButton(){

actionArea.innerHTML = "";


try{


/*
   هل أصبحا أصدقاء؟
*/

const friend =
await isFriend();


if(friend){

const friendButton =
document.createElement(
"button"
);

friendButton.className =
"friend-button";

friendButton.type =
"button";

friendButton.textContent =
"👥 أنتم أصدقاء بالفعل";

friendButton.disabled =
true;

actionArea.appendChild(
friendButton
);

return;

}


/*
   هل يوجد طلب سابق؟
*/

const pendingRequest =
await getPendingRequest();


if(pendingRequest){

/*
   هنا الشكل المطلوب:

   [ تم إرسال الطلب مسبقًا ✅ ]
   [ ❌ إلغاء الطلب ]
*/

actionArea.innerHTML = `

<div class="request-status">

<button
class="already-sent-button"
type="button"
disabled
>

تم إرسال الطلب مسبقًا ✅

</button>


<button
id="cancelRequestButton"
class="cancel-request-button"
type="button"
>

❌ إلغاء الطلب

</button>

</div>

`;


const cancelButton =

document.getElementById(
"cancelRequestButton"
);


cancelButton.addEventListener(

"click",

async()=>{

await cancelFriendRequest(

pendingRequest.id,

cancelButton

);

}

);


return;

}


/*
   لا يوجد طلب
*/

const sendButton =
document.createElement(
"button"
);


sendButton.className =
"send-request-button";


sendButton.type =
"button";


sendButton.textContent =
"➕ إرسال طلب صداقة";


sendButton.addEventListener(

"click",

async()=>{

await sendFriendRequest(
sendButton
);

}

);


actionArea.appendChild(
sendButton
);


}catch(error){

console.error(
"Update button error:",
error
);

showMessage(
"تعذر معرفة حالة طلب الصداقة.",
"error"
);

}

}


/* ==================================================
   SEND FRIEND REQUEST
================================================== */

async function sendFriendRequest(
button
){

if(
!currentUser ||
!foundUser
){

return;

}


button.disabled =
true;

button.textContent =
"جاري الإرسال...";


try{


/*
   التأكد مرة ثانية
   من عدم وجود طلب
*/

const existingRequest =
await getPendingRequest();


if(existingRequest){

await updateRequestButton();

return;

}


/*
   التأكد من عدم وجود صداقة
*/

const alreadyFriend =
await isFriend();


if(alreadyFriend){

await updateRequestButton();

return;

}


/*
   إنشاء طلب جديد
*/

const requestRef =

doc(
collection(
db,
"friendRequests"
)
);


/*
   جلب بيانات المستخدم الحالي
   حتى يظهر اسمه وصورته عند الطرف الآخر
*/

let myName =
currentUser.displayName ||
"مستخدم Mecd";

let myPhoto =
currentUser.photoURL ||
"";


try{

const myUserRef =
doc(
db,
"users",
currentUser.uid
);

const myUserDoc =
await getDoc(
myUserRef
);


if(myUserDoc.exists()){

const myData =
myUserDoc.data();


myName =

myData.name ||

myName;


myPhoto =

myData.photo ||

myData.photoURL ||

myPhoto;

}

}catch(profileError){

console.warn(
"Could not load own profile:",
profileError
);

}


/*
   حفظ الطلب
*/

await setDoc(

requestRef,

{

fromUid:
currentUser.uid,

toUid:
foundUser.uid,

fromName:
myName,

fromPhoto:
myPhoto,

status:
"pending",

createdAt:
serverTimestamp()

}

);


/*
   رسالة نجاح
*/

showMessage(
"تم إرسال طلب الصداقة بنجاح.",
"info"
);


/*
   تحويل الأزرار مباشرةً
*/

await updateRequestButton();


}catch(error){

console.error(
"Send request error:",
error
);

showMessage(
"تعذر إرسال طلب الصداقة. حاول مرة أخرى.",
"error"
);

button.disabled =
false;

button.textContent =
"➕ إرسال طلب صداقة";

}

}


/* ==================================================
   CANCEL FRIEND REQUEST
================================================== */

async function cancelFriendRequest(

requestId,

button

){

if(!requestId){

return;

}


/*
   تأكيد الإلغاء
*/

const confirmed =

confirm(
"هل تريد إلغاء طلب الصداقة؟"
);


if(!confirmed){

return;

}


button.disabled =
true;

button.textContent =
"جاري الإلغاء...";


try{


/*
   حذف الطلب من Firestore
*/

const requestRef =

doc(

db,

"friendRequests",

requestId

);


await deleteDoc(
requestRef
);


/*
   رسالة نجاح
*/

showMessage(
"تم إلغاء طلب الصداقة.",
"info"
);


/*
   إعادة زر إرسال الطلب
*/

await updateRequestButton();


}catch(error){

console.error(
"Cancel request error:",
error
);

showMessage(
"تعذر إلغاء الطلب. حاول مرة أخرى.",
"error"
);

button.disabled =
false;

button.textContent =
"❌ إلغاء الطلب";

}

}

   ENTER SEARCH
================================================== */

input.addEventListener(

"keydown",

(event)=>{

if(
event.key ===
"Enter"
){

findUser();

}

}

);


/* ==================================================
   SEARCH BUTTON
================================================== */

searchButton.addEventListener(

"click",

findUser

);


/* ==================================================
   BACK
================================================== */

backButton.addEventListener(

"click",

()=>{

window.location.href =
"./index.html";

}

);


/* ==================================================
   AUTH
================================================== */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.href =
"./index.html";

return;

}


currentUser =
user;


/*
   إظهار الصفحة
*/

loading.style.display =
"none";

app.style.display =
"flex";

}

);

</script>
