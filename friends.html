================================================== */

   BODY
================================================== */

body{

/* ==================================================

================================================== */

inset:0;

}

position:absolute;

width:300px;
height:300px;

}

/* ==================================================
   APP
================================================== */

================================================== */

align-items:center;

/* ==================================================

================================================== */

function escapeHTML(text){

return String(
text || ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* ==================================================
   GET USER DATA
================================================== */

async function getUserData(uid){

try{

const userRef =
doc(
db,
"users",
uid
);

const userDoc =
await getDoc(
userRef
);


if(
!userDoc.exists()
){

return {

name:

photo:
"",

chatID:
""

};

}


const data =
userDoc.data();


return {

name:
data.name ||
data.displayName ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
""

};

}catch(error){

console.error(

error
);

return {

"مستخدم Mecd",

photo:
"",

chatID:
""

};

}

/* ==================================================
   LOAD FRIENDS
================================================== */

async function loadFriends(){

if(!currentUser){

return;

}


friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
⏳
</div>

جارٍ تحميل الأصدقاء...

</div>

`;


try{

const friendsRef =
collection(
db,
"users",
currentUser.uid,
"friends"
);


const friendsSnapshot =
await getDocs(
friendsRef
);


if(
friendsSnapshot.empty
){

friendCount.textContent =
"0";

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

لا يوجد لديك أصدقاء حتى الآن.

<br>

يمكنك البحث عن مستخدم وإرسال طلب صداقة.

</div>

`;

return;

}


let count = 0;


for(
const friendDoc
of friendsSnapshot.docs
){

const friendUID =
friendDoc.id;


if(
!friendUID ||
friendUID ===
currentUser.uid
){

continue;

}


const data =
await getUserData(
friendUID
);


const friendElement =
document.createElement(
"div"
);

friendElement.className =
"friend";


let avatarHTML =
defaultAvatar();


if(data.photo){

avatarHTML = `

<img
src="${escapeHTML(data.photo)}"
alt="صورة المستخدم"
loading="lazy"
>

`;

}


friendElement.innerHTML = `

<div class="friend-avatar">

${avatarHTML}

</div>


<div class="friend-info">

<div class="friend-name">

${escapeHTML(
data.name
)}

</div>


<div class="friend-id">

${
data.chatID
?
escapeHTML(
"ID: " +
data.chatID
)
:
""
}

</div>

</div>


<div class="friend-arrow">

←

</div>

`;


/* ==================================================
   CLICK FRIEND
================================================== */

friendElement.addEventListener(

"click",

()=>{

selectedFriend = {

uid:
friendUID,

name:
data.name,

photo:
data.photo,

chatID:
data.chatID

};


selectedName.textContent =
data.name ||
"مستخدم Mecd";


selectedId.textContent =
data.chatID
?
"ID: " +
data.chatID
:
"";


if(data.photo){

selectedAvatar.innerHTML = `

<img
src="${escapeHTML(data.photo)}"
alt="صورة المستخدم"
>

`;

}else{

selectedAvatar.innerHTML =
"👤";

}


friendModal.classList.add(
"show"
);

}

);


friendsList.appendChild(
friendElement
);

count++;

}


friendCount.textContent =
count;


if(count === 0){

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

لا يوجد لديك أصدقاء حتى الآن.

</div>

`;

}


}catch(error){

console.error(
"Load friends error:",
error
);

friendCount.textContent =
"0";

friendsList.innerHTML = `

<div class="error-box">

<div style="font-size:40px;margin-bottom:10px;">
⚠️
</div>

تعذر تحميل قائمة الأصدقاء.

<br>

<span style="color:#9faaa7;font-size:12px;">
${escapeHTML(error.message)}
</span>

<br>

<button
id="retryFriends"
class="retry-button"
type="button"
>
إعادة المحاولة
</button>

</div>

`;


const retryFriends =
document.getElementById(
"retryFriends"
);

if(retryFriends){

retryFriends.addEventListener(
"click",
loadFriends
);

}

}

}


/* ==================================================
   LOAD FRIEND REQUESTS
================================================== */

async function loadFriendRequests(){

if(!currentUser){

return;

}


requestList.innerHTML = `

<div class="empty">

<div class="empty-icon">
⏳
</div>

جارٍ تحميل الطلبات...

</div>

`;


try{


/*
   نستخدم query + where
   بدل قراءة كل friendRequests
*/

const requestsRef =
collection(
db,
"friendRequests"
);


const requestsQuery =
query(

requestsRef,

where(
"toUid",
"==",
currentUser.uid
),

where(
"status",
"==",
"pending"
)

);


const requestsSnapshot =
await getDocs(
requestsQuery
);


const requests =
[];


requestsSnapshot.forEach(

(requestDoc)=>{

requests.push({

id:
requestDoc.id,

...requestDoc.data()

});

}

);


/* ==================================================
   NOTIFICATION COUNT
================================================== */

notificationCount.textContent =
requests.length;


if(
requests.length > 0
){

notificationCount.classList.add(
"show"
);

}else{

notificationCount.classList.remove(
"show"
);

}


/* ==================================================
   EMPTY
================================================== */

if(
requests.length === 0
){

requestList.innerHTML = `

<div class="empty">

<div class="empty-icon">
🔔
</div>

لا توجد طلبات صداقة جديدة.

</div>

`;

return;

}


/* ==================================================
   DISPLAY REQUESTS
================================================== */

requestList.innerHTML = "";


for(
const request
of requests
){

const requestElement =
document.createElement(
"div"
);

requestElement.className =
"request";


let senderName =
request.fromName ||
"مستخدم Mecd";


let senderPhoto =
request.fromPhoto ||
"";


let senderID =
request.fromChatID ||
"";


/*
   إذا لم يكن الاسم أو الصورة موجودًا
   نحاول جلب بيانات المستخدم
*/

if(
request.fromUid
){

const senderData =
await getUserData(
request.fromUid
);


if(
senderName ===
"مستخدم Mecd" &&
senderData.name
){

senderName =
senderData.name;

}


if(
!senderPhoto &&
senderData.photo
){

senderPhoto =
senderData.photo;

}


if(
!senderID &&
senderData.chatID
){

senderID =
senderData.chatID;

}

}


let avatarHTML =
"👤";


if(senderPhoto){

avatarHTML = `

<img
src="${escapeHTML(senderPhoto)}"
alt="صورة المستخدم"
loading="lazy"
>

`;

}


requestElement.innerHTML = `

<div class="request-user">

<div class="request-avatar">

${avatarHTML}

</div>


<div>

<div class="request-name">

${escapeHTML(
senderName
)}

</div>


<div class="request-id">

${
senderID
?
escapeHTML(
"ID: " +
senderID
)
:
"طلب صداقة"
}

</div>

</div>

</div>


<div class="request-actions">

<button
class="accept-button"
type="button"
>

قبول

</button>


<button
class="reject-button"
type="button"
>

رفض

</button>

</div>

`;


const acceptButton =
requestElement.querySelector(
".accept-button"
);

const rejectButton =
requestElement.querySelector(
".reject-button"
);


/* ==================================================
   ACCEPT
================================================== */

acceptButton.addEventListener(

"click",

async()=>{

if(
!request.fromUid
){

alert(
"تعذر معرفة صاحب طلب الصداقة."
);

return;

}


acceptButton.disabled =
true;

rejectButton.disabled =
true;

acceptButton.textContent =
"جاري القبول...";


try{


/* ------------------------------------------
   أصدقاء المستخدم الحالي
------------------------------------------ */

const myFriendRef =
doc(

db,

"users",

currentUser.uid,

"friends",

request.fromUid

);


/* ------------------------------------------
   أصدقاء الطرف الآخر
------------------------------------------ */

const otherFriendRef =
doc(

db,

"users",

request.fromUid,

"friends",

currentUser.uid

);


/* ------------------------------------------
   بيانات المستخدم الحالي
------------------------------------------ */

const myData =
await getUserData(
currentUser.uid
);


/* ------------------------------------------
   إضافة الصديق للطرفين
------------------------------------------ */

await setDoc(

myFriendRef,

{

uid:
request.fromUid,

createdAt:
serverTimestamp()

},

{

merge:true

}

);


await setDoc(

otherFriendRef,

{

uid:
currentUser.uid,

createdAt:
serverTimestamp()

},

{

merge:true

}

);


/* ------------------------------------------
   حذف الطلب
------------------------------------------ */

await deleteDoc(

doc(
db,
"friendRequests",
request.id
)

);


/* ------------------------------------------
   تحديث الشاشة
------------------------------------------ */

requestElement.remove();


await loadFriends();

await loadFriendRequests();


}catch(error){

console.error(
"Accept request error:",
error
);

alert(

"تعذر قبول طلب الصداقة:\n\n" +
error.message

);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

acceptButton.textContent =
"قبول";

}

}

);


/* ==================================================
   REJECT
================================================== */

rejectButton.addEventListener(

"click",

async()=>{

if(
!request.id
){

return;

}


acceptButton.disabled =
true;

rejectButton.disabled =
true;

rejectButton.textContent =
"جاري الرفض...";


try{


await deleteDoc(

doc(
db,
"friendRequests",
request.id
)

);


requestElement.remove();


await loadFriendRequests();


}catch(error){

console.error(
"Reject request error:",
error
);

alert(

"تعذر رفض الطلب:\n\n" +
error.message

);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

rejectButton.textContent =
"رفض";

}

}

);


requestList.appendChild(
requestElement
);

}


}catch(error){

console.error(
"Load friend requests error:",
error
);


notificationCount.textContent =
"0";

notificationCount.classList.remove(
"show"
);


requestList.innerHTML = `

<div class="error-box">

<div style="font-size:40px;margin-bottom:10px;">
⚠️
</div>

تعذر تحميل طلبات الصداقة.

<br>

<span style="color:#9faaa7;font-size:12px;">
${escapeHTML(error.message)}
</span>

<br>

<button
id="retryRequests"
class="retry-button"
type="button"
>
إعادة المحاولة
</button>

</div>

`;


const retryRequests =
document.getElementById(
"retryRequests"
);


if(retryRequests){

retryRequests.addEventListener(

"click",

loadFriendRequests

);

}

}

}


/* ==================================================
   OPEN REQUEST MODAL

notificationsBtn.addEventListener(

notificationModal.classList.add(

);

/* ==================================================

================================================== */

friendModal.addEventListener(

){

friendModal.classList.remove(

);


/* ==================================================
   CHAT
================================================== */

chatButton.addEventListener(

"click",

()=>{

if(
!selectedFriend
){

return;

}


window.location.href =

chatURL +

"?friend=" +

encodeURIComponent(
selectedFriend.uid
);

}

);


/* ==================================================
   REMOVE FRIEND
================================================== */

removeFriendButton.addEventListener(

"click",

async()=>{

if(
!currentUser ||
!selectedFriend
){

return;

}


const confirmed =
confirm(

"هل تريد إلغاء الصداقة مع " +

selectedFriend.name +

"؟"

);


if(
!confirmed
){

return;

}


removeFriendButton.disabled =
true;

removeFriendButton.textContent =
"جاري الإلغاء...";


try{


/* ------------------------------------------
   حذف الصديق من حسابي
------------------------------------------ */

const myFriendRef =
doc(

db,

"users",

currentUser.uid,

"friends",

selectedFriend.uid

);


/* ------------------------------------------
   حذف الصديق من حساب الطرف الآخر
------------------------------------------ */

const otherFriendRef =
doc(

db,

"users",

selectedFriend.uid,

"friends",

currentUser.uid

);


await deleteDoc(
myFriendRef
);


await deleteDoc(
otherFriendRef
);


friendModal.classList.remove(
"show"
);

selectedFriend =
null;


await loadFriends();


}catch(error){

console.error(
"Remove friend error:",
error
);

alert(

"تعذر إلغاء الصداقة:\n\n" +
error.message

);

}finally{

removeFriendButton.disabled =
false;

removeFriendButton.textContent =
"❌ إلغاء الصداقة";

}

}

);


/* ==================================================
   BACK TO CHAT
================================================== */

backBtn.addEventListener(

"click",

()=>{

window.location.href =
mecdChatURL;

}

);


/* ==================================================
   AUTH
================================================== */

onAuthStateChanged(

auth,

async(user)=>{

try{


if(
!user
){

window.location.replace(
mecdChatURL
);

return;

}


currentUser =
user;


/* ------------------------------------------
   إظهار الصفحة أولًا
------------------------------------------ */

showApp();


/* ------------------------------------------
   تحميل الأصدقاء والطلبات
------------------------------------------ */

await Promise.allSettled([

loadFriends(),

loadFriendRequests()

]);


}catch(error){

console.error(
"Main auth error:",
error
);

showPageError(
error.message
);

}

}

);


/* ==================================================
   GLOBAL ERROR PROTECTION
================================================== */

window.addEventListener(

"error",

(event)=>{

console.error(
"Global error:",
event.error || event.message
);

}
);


/* ==================================================
   SERVICE WORKER
================================================== */

if(
"serviceWorker" in navigator
){

window.addEventListener(

"load",

()=>{

navigator.serviceWorker

.register(
"./sw.js"
)

.then(

(registration)=>{

console.log(
"Mecd Chat Service Worker:",
registration.scope
);

}

)

.catch(

(error)=>{

console.error(
"Service Worker error:",
error
);

}

);

}

);

}

</script>

</body>

</html>
