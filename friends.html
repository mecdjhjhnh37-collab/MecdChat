<script type="module">


/* =========================

import {

}

from

import {

getAuth,
onAuthStateChanged

}

from

import {

getFirestore,
doc,
getDoc,
setDoc,
deleteDoc,
collection,
getDocs,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


/* =========================
   تشغيل Firebase
========================= */

const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* =========================
   عناصر الصفحة
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const friendsList =
document.getElementById("friendsList");

const friendCount =
document.getElementById("friendCount");

const notificationsBtn =
document.getElementById("notificationsBtn");

const notificationCount =
document.getElementById("notificationCount");

const notificationModal =
document.getElementById("notificationModal");

const closeModalBtn =
document.getElementById("closeModalBtn");

const requestList =
document.getElementById("requestList");

const backBtn =
document.getElementById("backBtn");


/* =========================
   نافذة الصديق
========================= */

const friendModal =
document.getElementById("friendModal");

const closeFriendModal =
document.getElementById("closeFriendModal");

const selectedAvatar =
document.getElementById("selectedAvatar");

const selectedName =
document.getElementById("selectedName");

const chatButton =
document.getElementById("chatButton");

const removeFriendButton =
document.getElementById(
"removeFriendButton"
);


/* =========================
   المستخدم الحالي
========================= */

let currentUser = null;


/* =========================
   الصديق المحدد
========================= */

let selectedFriend = null;


/* =========================
   رابط Mecd Chat
========================= */

const mecdChatURL =
"./index.html";


/* =========================
   رابط الدردشة
========================= */

const chatURL =
"./chat.html";


/* ==================================================
   الصورة الافتراضية
================================================== */

function defaultAvatar(){

return `

<div

style="
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
"

>
👤
</div>

`;

}


/* ==================================================
   جلب معلومات المستخدم
================================================== */

async function getUserData(uid){

try{

const userRef =
doc(
db,
"users",
uid
);

const userDoc =
await getDoc(userRef);


if(!userDoc.exists()){

return {

name:
"مستخدم Mecd",

photo:
"",

chatID:
""

};

}


const data =
userDoc.data();


return {

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
"",

chatID:
data.chatID ||
""

};


}catch(error){

console.error(
"Get user error:",
error
);

return {

name:
"مستخدم Mecd",

photo:
"",

chatID:
""

};

}

}


/* ==================================================
   حماية HTML
================================================== */

function escapeHTML(text){

return String(text || "")

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}


/* ==================================================
   تحميل الأصدقاء
================================================== */

async function loadFriends(){

friendsList.innerHTML = "";


try{

const friendsRef =
collection(
db,
"users",
currentUser.uid,
"friends"
);


const friendsSnapshot =
await getDocs(
friendsRef
);


if(friendsSnapshot.empty){

friendCount.textContent =
"0";

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

لا يوجد لديك أصدقاء حتى الآن.

<br>

يمكنك البحث عن مستخدم وإرسال طلب صداقة.

</div>

`;

return;

}


let count = 0;


for(
const friendDoc
of friendsSnapshot.docs
){

const friendUID =
friendDoc.id;


const data =
await getUserData(
friendUID
);


const friendElement =
document.createElement(
"div"
);

friendElement.className =
"friend";


let avatarHTML =
defaultAvatar();


if(data.photo){

avatarHTML = `

<img

src="${escapeHTML(data.photo)}"

alt=""

>

`;

}


friendElement.innerHTML = `

<div class="friend-avatar">

${avatarHTML}

</div>


<div class="friend-info">

<div class="friend-name">

${escapeHTML(data.name)}

</div>

</div>


<div class="friend-arrow">

←

</div>

`;


/* ==================================================
   الضغط على الصديق
================================================== */

friendElement.addEventListener(

"click",

()=>{

openFriendModal(
friendUID,
data
);

}

);


friendsList.appendChild(
friendElement
);

count++;

}


friendCount.textContent =
count;


}catch(error){

console.error(
"Load friends error:",
error
);

friendsList.innerHTML = `

<div class="empty">

<div class="empty-icon">
⚠️
</div>

تعذر تحميل قائمة الأصدقاء.

</div>

`;

}

}


/* ==================================================
   فتح نافذة الصديق
================================================== */

function openFriendModal(
uid,
data
){

selectedFriend = {

uid:uid,

name:data.name,

photo:data.photo,

chatID:data.chatID

};


/* الصورة */

if(data.photo){

selectedAvatar.innerHTML = `

<img

src="${escapeHTML(data.photo)}"

alt=""

>

`;

}else{

selectedAvatar.innerHTML =
"👤";

}


/* الاسم */

selectedName.textContent =
data.name ||
"مستخدم Mecd";


/* فتح النافذة */

friendModal.classList.add(
"show"
);

}


/* ==================================================
   إغلاق نافذة الصديق
================================================== */

function closeFriend(){

friendModal.classList.remove(
"show"
);

selectedFriend =
null;

}


/* ==================================================
   زر إغلاق نافذة الصديق
================================================== */

closeFriendModal.addEventListener(

"click",

closeFriend

);


/* ==================================================
   الضغط خارج نافذة الصديق
================================================== */

friendModal.addEventListener(

"click",

(event)=>{

if(
event.target ===
friendModal
){

closeFriend();

}

}

);


/* ==================================================
   زر الدردشة
================================================== */

chatButton.addEventListener(

"click",

()=>{

if(!selectedFriend){

return;

}


/*
   حاليًا يفتح chat.html
   ويمكننا لاحقًا ربطه مباشرة
   بغرفة المحادثة الخاصة بالصديق.
*/

window.location.href =
chatURL;

}

);


/* ==================================================
   إلغاء الصداقة
================================================== */

removeFriendButton.addEventListener(

"click",

async()=>{

if(
!selectedFriend ||
!currentUser
){

return;

}


/* تأكيد */

const confirmed =
confirm(
"هل تريد إلغاء الصداقة مع " +
selectedFriend.name +
"؟"
);


if(!confirmed){

return;

}


removeFriendButton.disabled =
true;

removeFriendButton.textContent =
"جاري الإلغاء...";


try{


/* ==================================================
   حذف الصديق من حسابي
================================================== */

await deleteDoc(

doc(
db,
"users",
currentUser.uid,
"friends",
selectedFriend.uid
)

);


/* ==================================================
   حذف الصديق من حساب الطرف الآخر
================================================== */

await deleteDoc(

doc(
db,
"users",
selectedFriend.uid,
"friends",
currentUser.uid
)

);


/* ==================================================
   إغلاق النافذة
================================================== */

closeFriend();


/* ==================================================
   إعادة تحميل القائمة
================================================== */

await loadFriends();


}catch(error){

console.error(
"Remove friend error:",
error
);

alert(
"تعذر إلغاء الصداقة.\n\n" +
error.message
);

removeFriendButton.disabled =
false;

removeFriendButton.textContent =
"❌ إلغاء الصداقة";

}

});


/* ==================================================
   تحميل طلبات الصداقة
================================================== */

async function loadFriendRequests(){

requestList.innerHTML = "";


try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);


const snapshot =
await getDocs(
requestsRef
);


if(snapshot.empty){

notificationCount.classList.remove(
"show"
);

notificationCount.textContent =
"0";


requestList.innerHTML = `

<div class="empty">

<div class="empty-icon">
🔔
</div>

لا توجد طلبات صداقة جديدة.

</div>

`;

return;

}


notificationCount.textContent =
snapshot.size;

notificationCount.classList.add(
"show"
);


for(
const requestDoc
of snapshot.docs
){

const senderUID =
requestDoc.id;


const sender =
await getUserData(
senderUID
);


const requestElement =
document.createElement(
"div"
);

requestElement.className =
"request";


let avatarHTML =
defaultAvatar();


if(sender.photo){

avatarHTML = `

<img

src="${escapeHTML(sender.photo)}"

alt=""

>

`;

}


requestElement.innerHTML = `

<div class="request-user">

<div class="request-avatar">

${avatarHTML}

</div>

<div>

<div class="request-name">

${escapeHTML(sender.name)}

</div>

<div class="request-id">

ID:
${escapeHTML(sender.chatID)}

</div>

</div>

</div>


<div class="request-actions">

<button
class="accept-button"
type="button"
>
قبول ✅
</button>

<button
class="reject-button"
type="button"
>
رفض ❌
</button>

</div>

`;


const acceptButton =
requestElement.querySelector(
".accept-button"
);

const rejectButton =
requestElement.querySelector(
".reject-button"
);


/* ==================================================
   قبول طلب الصداقة
================================================== */

acceptButton.addEventListener(

"click",

async()=>{

acceptButton.disabled =
true;

rejectButton.disabled =
true;

acceptButton.textContent =
"جاري القبول...";


try{


/* إضافة المرسل إلى أصدقائي */

await setDoc(

doc(
db,
"users",
currentUser.uid,
"friends",
senderUID
),

{

uid:
senderUID,

addedAt:
serverTimestamp()

}

);


/* إضافة المستخدم الحالي إلى أصدقاء المرسل */

await setDoc(

doc(
db,
"users",
senderUID,
"friends",
currentUser.uid
),

{

uid:
currentUser.uid,

addedAt:
serverTimestamp()

}

);


/* حذف الطلب */

await deleteDoc(

doc(
db,
"users",
currentUser.uid,
"friendRequests",
senderUID
)

);


/* إزالة الطلب من الشاشة */

requestElement.remove();


/* تحديث الأصدقاء */

await loadFriends();


/* تحديث عدد الطلبات */

await loadFriendRequests();


}catch(error){

console.error(
"Accept request error:",
error
);

alert(
"تعذر قبول طلب الصداقة:\n" +
error.message
);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

acceptButton.textContent =
"قبول ✅";

}

}

);


/* ==================================================
   رفض الطلب
================================================== */

rejectButton.addEventListener(

"click",

async()=>{

acceptButton.disabled =
true;

rejectButton.disabled =
true;

rejectButton.textContent =
"جاري الرفض...";


try{

await deleteDoc(

doc(
db,
"users",
currentUser.uid,
"friendRequests",
senderUID
)

);


requestElement.remove();


await loadFriendRequests();


}catch(error){

console.error(
"Reject request error:",
error
);

alert(
"تعذر رفض الطلب:\n" +
error.message
);

acceptButton.disabled =
false;

rejectButton.disabled =
false;

rejectButton.textContent =
"رفض ❌";

}

}

);


requestList.appendChild(
requestElement
);

}


}catch(error){

console.error(
"Load requests error:",
error
);

requestList.innerHTML = `

<div class="empty">

<div class="empty-icon">
⚠️
</div>

تعذر تحميل طلبات الصداقة.

</div>

`;

}

}


/* ==================================================
   فتح الإشعارات
================================================== */

notificationsBtn.addEventListener(

"click",

async()=>{

notificationModal.classList.add(
"show"
);

await loadFriendRequests();

}

);


/* ==================================================
   إغلاق الإشعارات
================================================== */

closeModalBtn.addEventListener(

"click",

()=>{

notificationModal.classList.remove(
"show"
);

}

);


/* ==================================================
   الضغط خارج نافذة الإشعارات
================================================== */

notificationModal.addEventListener(

"click",

(event)=>{

if(
event.target ===
notificationModal
){

notificationModal.classList.remove(
"show"
);

}

}

);


/* ==================================================
   العودة إلى Mecd Chat
================================================== */

backBtn.addEventListener(

"click",

()=>{

window.location.href =
mecdChatURL;

}

);


/* ==================================================
   تسجيل الدخول
================================================== */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.replace(
"./index.html"
);

return;

}


currentUser =
user;


try{

await loadFriends();

await loadFriendRequests();


loading.style.display =
"none";

app.style.display =
"flex";


}catch(error){

console.error(error);

loading.innerHTML = `

<div>

⚠️ حدث خطأ أثناء تحميل الصفحة

</div>

`;

}

});


/* ==================================================
   Service Worker
================================================== */

if(
"serviceWorker" in navigator
){

window.addEventListener(

"load",

()=>{

navigator.serviceWorker

.register("./sw.js")

.then(

registration=>{

console.log(
"Service Worker:",
registration.scope
);

}

)

.catch(

error=>{

console.error(
"Service Worker:",
error
);

}

);

}

);

}

</script>

</body>

</html>
