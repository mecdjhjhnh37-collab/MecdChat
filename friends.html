function escapeHTML(value){

return String(value || "")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}

return String(value || "")
.trim()
.toUpperCase()
.replace(
/[\s\u200B-\u200D\uFEFF]/g,
""
);

}

async function searchFriend(){

result.style.display =
"none";

foundUser =
null;


const id =
normalizeChatID(
friendId.value
);


friendId.value =
id;


console.log(
"Searching for chatID:",
id
);


if(!id){

showError(
"اكتب ID الخاص بالصديق أولاً."
);

return;

}


if(
!/^MC-\d{6}$/.test(id)
){

showError(
"صيغة ID غير صحيحة. مثال: MC-000002"
);

return;

}


if(!currentUser){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}


searchBtn.disabled =
true;

searchBtn.textContent =
"جاري البحث...";


try{

/*
   البحث في users
   يجب أن يكون الحقل اسمه:
   chatID
*/

const usersRef =
collection(
db,
"users"
);


const usersQuery =
query(
usersRef,
where(
"chatID",
"==",
id
)
);


const snapshot =
await getDocs(
usersQuery
);


console.log(
"Search results:",
snapshot.size
);


if(snapshot.empty){

showError(
"لم يتم العثور على مستخدم بهذا الـ ID."
);

return;

}


const userDoc =
snapshot.docs[0];

const data =
userDoc.data();


console.log(
"Found user:",
userDoc.id,
data
);


if(
userDoc.id ===
currentUser.uid
){

showError(
"لا يمكنك إرسال طلب صداقة لنفسك."
);

return;

}


foundUser = {

uid:
userDoc.id,

name:
data.name ||
data.displayName ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
normalizeChatID(
data.chatID ||
id
)

};


/* =========================
   عرض المستخدم
========================= */

if(foundUser.photo){

userAvatar.innerHTML = `

<img
src="${escapeHTML(
foundUser.photo
)}"
alt="صورة المستخدم"
onerror="this.parentElement.textContent='👤';"
>

`;

}else{

userAvatar.textContent =
"👤";

}


userName.textContent =
foundUser.name;

foundUserId.textContent =
"ID: " +
foundUser.chatID;


/* =========================
   فحص الصداقة
========================= */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
foundUser.uid
);


const existingFriend =
await getDoc(
myFriendRef
);


if(existingFriend.exists()){

addButton.textContent =
"✓ أنتم أصدقاء بالفعل";

addButton.disabled =
true;

result.style.display =
"block";

return;

}


/* =========================
   فحص طلب سابق
========================= */

const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);


const existingRequest =
await getDoc(
requestRef
);


if(existingRequest.exists()){

const requestData =
existingRequest.data();


if(
requestData.status ===
"pending"
){

addButton.textContent =
"✓ تم إرسال طلب الصداقة";

addButton.disabled =
true;

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled =
false;

}

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled =
false;

}


result.style.display =
"block";


}catch(error){

console.error(
"===================="
);

console.error(
"SEARCH ERROR"
);

console.error(
"Code:",
error.code
);

console.error(
"Message:",
error.message
);

console.error(
"Full error:",
error
);

console.error(
"===================="
);


/*
   نعرض رسالة مختلفة حسب نوع الخطأ
*/

if(
error.code ===
"permission-denied"
){

showError(
"ليس لديك صلاحية البحث عن المستخدمين. تحقق من Firestore Rules."
);

}else if(
error.code ===
"failed-precondition"
){

showError(
"Firestore يحتاج إلى إعداد Query أو Index. افتح Console لمعرفة التفاصيل."
);

}else if(
error.code ===
"unavailable"
){

showError(
"لا يوجد اتصال حاليًا بـ Firebase. تحقق من الإنترنت وحاول مرة أخرى."
);

}else{

showError(
"حدث خطأ أثناء البحث. افتح Console لمعرفة الخطأ الحقيقي."
);

}

}finally{

searchBtn.disabled =
false;

searchBtn.textContent =
"بحث";

}

}

/* =========================
   قبول طلب
========================= */

async function acceptRequest(
requestUid
){

if(!currentUser){

return;

}


try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
requestUid
);


const requestSnap =
await getDoc(
requestRef
);


if(
!requestSnap.exists()
){

return;

}


const data =
requestSnap.data();


if(
data.status !==
"pending"
){

return;

}


/* إضافة عندي */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
requestUid
);


await setDoc(
myFriendRef,
{

uid:
requestUid,

name:
data.fromName ||
"مستخدم Mecd",

photo:
data.fromPhoto ||
"",

chatID:
data.fromChatID ||
"",

addedAt:
serverTimestamp()

}
);


/* إضافة عند الطرف الآخر */

const otherFriendRef =
doc(
db,
"users",
requestUid,
"friends",
currentUser.uid
);


const myName =
currentUserData?.name ||
currentUser.displayName ||
currentUser.email?.split("@")[0] ||
"مستخدم Mecd";


const myPhoto =
currentUserData?.photo ||
currentUser.photoURL ||
"";


const myChatID =
currentUserData?.chatID ||
"";


await setDoc(
otherFriendRef,
{

uid:
currentUser.uid,

name:
myName,

photo:
myPhoto,

chatID:
myChatID,

addedAt:
serverTimestamp()

}
);


/* حذف الطلب */

await deleteDoc(
requestRef
);


showSuccess(
"✓ تم قبول طلب الصداقة."
);


await loadFriends();

await loadRequestCount();

await loadRequests();


}catch(error){

console.error(
"Accept request error:",
error
);

showError(
"حدث خطأ أثناء قبول طلب الصداقة."
);

}

}


/* =========================
   رفض طلب

}
