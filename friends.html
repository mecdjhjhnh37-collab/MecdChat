<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050807">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="Mecd Chat">

<title>Mecd Chat - الأصدقاء</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),
linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.glow{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
filter:blur(100px);
opacity:.18;
}

.glow.one{
background:#00e676;
top:-100px;
right:-100px;
}

.glow.two{
background:#2979ff;
bottom:-100px;
left:-100px;
}

.app{
position:relative;
z-index:1;
width:100%;
max-width:650px;
min-height:100vh;
margin:auto;
padding:22px 20px 45px;
display:flex;
flex-direction:column;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:35px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
border-radius:16px;
font-size:27px;

background:
linear-gradient(
135deg,
#00e676,
#00a85a
);

box-shadow:
0 10px 30px
rgba(0,230,118,.22);
}

.brand h2{
font-size:21px;
}

.brand span{
display:block;
margin-top:4px;
color:#8d9a97;
font-size:12px;
}

.notification-button{
position:relative;

width:50px;
height:50px;

border-radius:17px;

border:1px solid
rgba(255,255,255,.09);

background:
rgba(255,255,255,.045);

color:white;

font-size:23px;

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;

transition:.2s ease;
}

.notification-button:hover{
transform:translateY(-2px);

border-color:
rgba(0,230,118,.35);
}

.notification-button:active{
transform:scale(.95);
}

.notification-count{
position:absolute;

top:-5px;
right:-5px;

min-width:21px;
height:21px;

padding:0 5px;

display:none;

align-items:center;
justify-content:center;

border-radius:50%;

background:#ff3b30;
color:white;

font-size:11px;
font-weight:bold;

border:2px solid #07110f;
}

.notification-count.show{
display:flex;
}

.page-title{
text-align:center;
margin-bottom:30px;
}

.page-title h1{
font-size:
clamp(30px,7vw,45px);

margin-bottom:12px;
}

.page-title h1 span{
color:#00e676;
}

.page-title p{
color:#9ba7a4;
font-size:14px;
line-height:1.7;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;

margin-bottom:15px;

font-size:21px;
color:#d9e8e3;
}

.friend-count{
color:#00e676;
font-size:13px;
}

.friends-list{
display:flex;
flex-direction:column;
gap:12px;
}

.friend{
width:100%;

padding:15px 17px;

border-radius:20px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.035);

display:flex;
align-items:center;

gap:14px;

transition:.2s ease;

cursor:pointer;
user-select:none;
}

.friend:hover{
transform:translateY(-2px);

border-color:
rgba(0,230,118,.25);

background:
rgba(255,255,255,.055);
}

.friend:active{
transform:scale(.98);
}

.friend-avatar{
width:58px;
height:58px;

flex-shrink:0;

border-radius:50%;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
#293b37,
#15211e
);

border:2px solid
rgba(0,230,118,.55);

font-size:25px;
}

.friend-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.friend-info{
flex:1;
min-width:0;
}

.friend-name{
font-size:17px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.friend-id{
font-size:11px;
color:#00e676;
margin-top:5px;
}

.friend-arrow{
font-size:24px;
color:#71807b;
}

.empty{
padding:35px 20px;

border-radius:22px;

border:1px solid
rgba(255,255,255,.07);

background:
rgba(255,255,255,.025);

text-align:center;

color:#7f8c88;

font-size:14px;

line-height:1.8;
}

.empty-icon{
font-size:42px;
margin-bottom:12px;
}

/* Friend Modal */

.friend-modal{
position:fixed;
inset:0;

z-index:9000;

display:none;

align-items:center;
justify-content:center;

padding:20px;

background:
rgba(0,0,0,.72);

backdrop-filter:blur(9px);
}

.friend-modal.show{
display:flex;
}

.friend-modal-box{
position:relative;

width:100%;
max-width:400px;

padding:28px 22px 22px;

border-radius:28px;

background:
linear-gradient(
180deg,
#111b18,
#070b09
);

border:1px solid
rgba(255,255,255,.1);

box-shadow:
0 25px 90px
rgba(0,0,0,.65);

text-align:center;

animation:modalIn .2s ease;
}

@keyframes modalIn{

from{
opacity:0;
transform:
scale(.92)
translateY(10px);
}

to{
opacity:1;
transform:
scale(1)
translateY(0);
}

}

.friend-modal-close{
position:absolute;

top:15px;
right:15px;

width:42px;
height:42px;

border-radius:13px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.05);

color:white;

font-size:22px;

cursor:pointer;
}

.selected-avatar{
width:100px;
height:100px;

margin:10px auto 17px;

border-radius:50%;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
135deg,
#293b37,
#15211e
);

border:3px solid #00e676;

box-shadow:
0 0 30px
rgba(0,230,118,.18);

font-size:40px;
}

.selected-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.selected-name{
font-size:23px;
font-weight:bold;
margin-bottom:8px;
}

.selected-id{
font-size:13px;
color:#00e676;
margin-bottom:25px;
}

.friend-modal-actions{
display:flex;
flex-direction:column;
gap:11px;
}

.chat-button,
.remove-friend-button{
width:100%;

padding:16px;

border-radius:16px;

font-family:inherit;

font-size:16px;
font-weight:bold;

cursor:pointer;

transition:.2s ease;
}

.chat-button{
border:none;

background:#00e889;
color:#00150e;
}

.chat-button:hover{
background:#00f294;
transform:translateY(-2px);
}

.remove-friend-button{
border:1px solid
rgba(255,90,90,.2);

background:
rgba(255,70,70,.07);

color:#ff9b9b;
}

.remove-friend-button:hover{
background:
rgba(255,70,70,.13);
}

.chat-button:active,
.remove-friend-button:active{
transform:scale(.98);
}

/* Notification Modal */

.modal{
position:fixed;
inset:0;

z-index:9999;

display:none;

align-items:center;
justify-content:center;

padding:20px;

background:
rgba(0,0,0,.72);

backdrop-filter:blur(8px);
}

.modal.show{
display:flex;
}

.modal-box{
width:100%;
max-width:480px;

max-height:80vh;

overflow-y:auto;

padding:23px;

border-radius:27px;

background:
linear-gradient(
180deg,
#101916,
#070b09
);

border:1px solid
rgba(255,255,255,.1);

box-shadow:
0 25px 80px
rgba(0,0,0,.6);
}

.modal-header{
display:flex;

align-items:center;
justify-content:space-between;

margin-bottom:22px;
}

.modal-header h2{
font-size:22px;
}

.close-button{
width:40px;
height:40px;

border-radius:13px;

border:1px solid
rgba(255,255,255,.08);

background:#161d1a;

color:white;

font-size:20px;

cursor:pointer;
}

.request-list{
display:flex;
flex-direction:column;
gap:12px;
}

.request{
padding:15px;

border-radius:19px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.07);
}

.request-user{
display:flex;

align-items:center;

gap:12px;

margin-bottom:13px;
}

.request-avatar{
width:52px;
height:52px;

border-radius:50%;

overflow:hidden;

flex-shrink:0;

background:#17221f;

border:2px solid
rgba(0,230,118,.5);

display:flex;

align-items:center;
justify-content:center;

font-size:22px;
}

.request-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.request-name{
font-size:16px;
font-weight:bold;
}

.request-id{
font-size:12px;
color:#00e676;
margin-top:4px;
}

.request-actions{
display:flex;
gap:9px;
}

.accept-button,
.reject-button{
flex:1;

padding:13px;

border-radius:14px;

font-family:inherit;

font-size:14px;
font-weight:bold;

cursor:pointer;
}

.accept-button{
background:#00e889;
color:#00150e;

border:none;
}

.reject-button{
background:#171e1b;

color:#ff8e8e;

border:1px solid
rgba(255,100,100,.18);
}

.accept-button:disabled,
.reject-button:disabled{
opacity:.5;
cursor:not-allowed;
}

/* Loading */

.loading{
position:fixed;
inset:0;

z-index:10000;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

gap:18px;

background:
linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;

font-size:16px;
}

.spinner{
width:35px;
height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.back-button{
width:100%;

margin-top:30px;

padding:17px;

border-radius:18px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.035);

color:white;

font-family:inherit;

font-size:15px;

cursor:pointer;

transition:.2s ease;
}

.back-button:hover{
border-color:
rgba(0,230,118,.3);
}

footer{
margin-top:auto;

padding-top:40px;

text-align:center;

color:#58635f;

font-size:11px;
}

@media(max-width:480px){

.app{
padding:18px 15px 35px;
}

.logo{
width:45px;
height:45px;

border-radius:14px;

font-size:23px;
}

.brand h2{
font-size:18px;
}

.notification-button{
width:45px;
height:45px;

font-size:21px;
}

.page-title h1{
font-size:31px;
}

.friend{
padding:13px;
}

.friend-avatar{
width:54px;
height:54px;
}

.friend-name{
font-size:16px;
}

.friend-arrow{
font-size:21px;
}

.modal-box{
padding:19px;
}

.friend-modal-box{
padding:25px 18px 20px;
}

.selected-avatar{
width:90px;
height:90px;
}

.selected-name{
font-size:21px;
}

}

</style>

</head>

<body>
