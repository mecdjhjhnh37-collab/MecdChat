<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050807">

<title>Mecd Chat - الأصدقاء</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

min-height:100vh;

font-family:Arial,Tahoma,sans-serif;

color:white;

background:
radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),
linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow-x:hidden;

}

.background{

position:fixed;
inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;

}

.glow{

position:absolute;

width:300px;
height:300px;

border-radius:50%;

filter:blur(100px);

opacity:.18;

}

.glow.one{

background:#00e676;

top:-100px;
right:-100px;

}

.glow.two{

background:#2979ff;

bottom:-100px;
left:-100px;

}

.app{

position:relative;

z-index:1;

width:100%;

max-width:650px;

min-height:100vh;

margin:auto;

padding:25px 20px 45px;

}

header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:40px;

}

.brand{

display:flex;

align-items:center;

gap:12px;

}

.logo{

width:52px;
height:52px;

display:flex;

align-items:center;
justify-content:center;

border-radius:16px;

font-size:27px;

background:
linear-gradient(
135deg,
#00e676,
#00a85a
);

box-shadow:
0 10px 30px
rgba(0,230,118,.22);

}

.brand h2{

font-size:21px;

}

.brand span{

display:block;

margin-top:4px;

color:#8d9a97;

font-size:12px;

}

.back-button{

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.04);

color:white;

padding:10px 14px;

border-radius:15px;

font-size:14px;

cursor:pointer;

}

.back-button:active{

transform:scale(.96);

}

.hero{

text-align:center;

margin-bottom:30px;

}

.hero-icon{

width:82px;
height:82px;

margin:0 auto 20px;

display:flex;

align-items:center;
justify-content:center;

border-radius:26px;

font-size:40px;

background:
rgba(0,255,145,.08);

border:1px solid
rgba(0,255,145,.15);

box-shadow:
0 20px 60px
rgba(0,0,0,.3);

}

.hero h1{

font-size:34px;

margin-bottom:12px;

}

.hero h1 span{

color:#00e676;

}

.hero p{

color:#9ba7a4;

font-size:15px;

line-height:1.7;

}

.search-box{

padding:20px;

border-radius:25px;

background:
linear-gradient(
135deg,
rgba(0,85,58,.55),
rgba(2,31,24,.75)
);

border:1px solid
rgba(0,255,145,.16);

box-shadow:
0 15px 45px
rgba(0,0,0,.25);

margin-bottom:22px;

}

.search-title{

font-size:17px;

font-weight:bold;

margin-bottom:12px;

}

.search-row{

display:flex;

gap:10px;

}

#friendId{

flex:1;

min-width:0;

padding:15px;

border-radius:15px;

border:1px solid
rgba(255,255,255,.1);

outline:none;

background:
rgba(0,0,0,.25);

color:white;

font-size:15px;

font-family:inherit;

text-align:right;

}

#friendId::placeholder{

color:#687872;

}

#searchBtn{

padding:0 20px;

border:none;

border-radius:15px;

background:#00e889;

color:#00150e;

font-weight:bold;

font-size:15px;

cursor:pointer;

}

#searchBtn:active{

transform:scale(.96);

}

#searchBtn:disabled{

opacity:.6;

cursor:not-allowed;

}

.result{

display:none;

padding:20px;

border-radius:25px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.08);

margin-bottom:20px;

}

.user-card{

display:flex;

align-items:center;

gap:15px;

}

.user-avatar{

width:65px;
height:65px;

flex-shrink:0;

border-radius:20px;

overflow:hidden;

display:flex;

align-items:center;
justify-content:center;

font-size:28px;

background:
rgba(0,255,145,.1);

border:1px solid
rgba(0,255,145,.15);

}

.user-avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.user-info{

flex:1;

min-width:0;

}

.user-name{

font-size:18px;

font-weight:bold;

margin-bottom:7px;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}

.user-id{

color:#00e889;

font-size:13px;

}

.add-button{

margin-top:15px;

width:100%;

padding:14px;

border:none;

border-radius:15px;

background:#00e889;

color:#00150e;

font-size:15px;

font-weight:bold;

cursor:pointer;

}

.add-button:active{

transform:scale(.98);

}

.add-button:disabled{

opacity:.7;

cursor:not-allowed;

}

.message{

display:none;

padding:18px;

border-radius:18px;

text-align:center;

font-size:14px;

line-height:1.6;

margin-bottom:20px;

}

.message.error{

background:
rgba(255,70,70,.08);

border:1px solid
rgba(255,70,70,.15);

color:#ffaaaa;

}

.message.success{

background:
rgba(0,230,118,.08);

border:1px solid
rgba(0,230,118,.15);

color:#8fffc5;

}


/* عنوان الأصدقاء */

.friends-header{

display:flex;

align-items:center;

justify-content:space-between;

margin:30px 0 15px;

}

.section-title{

font-size:20px;

font-weight:bold;

}


/* زر الإشعارات */

.requests-button{

position:relative;

width:48px;

height:48px;

border-radius:16px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.05);

color:white;

font-size:24px;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

}

.requests-button:active{

transform:scale(.94);

}

.request-count{

position:absolute;

top:-5px;

left:-5px;

min-width:21px;

height:21px;

padding:0 5px;

border-radius:50px;

display:none;

align-items:center;

justify-content:center;

background:#ff3d5a;

color:white;

font-size:11px;

font-weight:bold;

border:2px solid #07110f;

}


/* صندوق الطلبات */

.requests-panel{

display:none;

padding:18px;

margin-bottom:22px;

border-radius:24px;

background:
linear-gradient(
135deg,
rgba(0,85,58,.5),
rgba(2,31,24,.8)
);

border:1px solid
rgba(0,255,145,.15);

}

.requests-panel-title{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:15px;

font-size:18px;

font-weight:bold;

}

.close-requests{

border:none;

background:
rgba(255,255,255,.06);

color:#aaa;

width:34px;

height:34px;

border-radius:12px;

font-size:18px;

cursor:pointer;

}

.request-card{

padding:15px;

border-radius:18px;

background:
rgba(255,255,255,.04);

border:1px solid
rgba(255,255,255,.06);

margin-bottom:12px;

}

.request-user{

display:flex;

align-items:center;

gap:12px;

}

.request-avatar{

width:55px;

height:55px;

border-radius:17px;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:
rgba(0,255,145,.1);

font-size:25px;

flex-shrink:0;

}

.request-avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.request-info{

flex:1;

min-width:0;

}

.request-name{

font-size:16px;

font-weight:bold;

margin-bottom:5px;

}

.request-id{

font-size:12px;

color:#00e889;

}

.request-actions{

display:flex;

gap:8px;

margin-top:13px;

}

.accept-button,
.reject-button{

flex:1;

border:none;

padding:11px;

border-radius:12px;

font-family:inherit;

font-weight:bold;

cursor:pointer;

}

.accept-button{

background:#00e889;

color:#00150e;

}

.reject-button{

background:
rgba(255,70,70,.12);

color:#ffaaaa;

border:1px solid
rgba(255,70,70,.15);

}

.accept-button:disabled,
.reject-button:disabled{

opacity:.6;

cursor:not-allowed;

}

.no-requests{

text-align:center;

padding:20px;

color:#788680;

font-size:14px;

line-height:1.7;

}


/* قائمة الأصدقاء */

.empty{

padding:25px;

border-radius:22px;

background:
rgba(255,255,255,.03);

border:1px solid
rgba(255,255,255,.06);

text-align:center;

color:#788680;

font-size:14px;

line-height:1.7;

}

.friend-list{

display:flex;

flex-direction:column;

gap:12px;

}

.friend-item{

display:flex;

align-items:center;

gap:13px;

padding:15px;

border-radius:20px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.06);

}

.friend-item-avatar{

width:55px;

height:55px;

border-radius:17px;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:
rgba(0,255,145,.1);

font-size:24px;

flex-shrink:0;

}

.friend-item-avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.friend-item-info{

flex:1;

min-width:0;

}

.friend-item-name{

font-size:16px;

font-weight:bold;

margin-bottom:5px;

}

.friend-item-id{

font-size:12px;

color:#00e889;

}


/* Loading */

.loading{

position:fixed;

inset:0;

z-index:999;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

gap:18px;

background:
linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;

}

.spinner{

width:35px;
height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}

@keyframes spin{

to{

transform:rotate(360deg);

}

}


/* الموبايل */

@media(max-width:480px){

.app{

padding:20px 15px 35px;

}

.logo{

width:45px;

height:45px;

border-radius:14px;

font-size:23px;

}

.brand h2{

font-size:18px;

}

.back-button{

font-size:12px;

padding:9px 11px;

}

.hero h1{

font-size:30px;

}

.search-row{

flex-direction:column;

}

#searchBtn{

height:50px;

}

}

</style>

</head>


<body>


<div class="background">

<div class="glow two"></div>

</div>

<div>
جارٍ تحميل الحساب...

</div>


<main id="app" class="app" style="display:none;">


<header>

<div class="brand">

<div class="logo">
👥
</div>

<div>

<h2>
الأصدقاء
</h2>

<span>
Mecd Chat
</span>

id="backBtn"

>

>
</div>

<div

class="user-id"
>
</div>

<script type="module">


/* =========================
   Firebase
========================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getFirestore,
collection,
query,
where,
getDocs,
doc,
getDoc,
setDoc,
deleteDoc,
onSnapshot

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);


/* =========================
   العناصر
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const friendId =
document.getElementById("friendId");

const searchBtn =
document.getElementById("searchBtn");

const result =
document.getElementById("result");

const userAvatar =
document.getElementById("userAvatar");

const userName =
document.getElementById("userName");

const foundUserId =
document.getElementById("foundUserId");

const addButton =
document.getElementById("addButton");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");

const backBtn =
document.getElementById("backBtn");

const requestsBtn =
document.getElementById("requestsBtn");

const requestCount =
document.getElementById("requestCount");

const requestsPanel =
document.getElementById("requestsPanel");

const closeRequests =
document.getElementById("closeRequests");

const requestsList =
document.getElementById("requestsList");

const friendsList =
document.getElementById("friendsList");

const emptyFriends =
document.getElementById("emptyFriends");


/* =========================
   المتغيرات
========================= */

let currentUser = null;

let foundUser = null;

let requestsUnsubscribe = null;

let friendsUnsubscribe = null;


/* رابط Mecd Chat */

const mecdChatURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/";


/* =========================
   الرسائل
========================= */

function hideMessages(){

errorMessage.style.display =
"none";

successMessage.style.display =
"none";

}

function showError(message){

hideMessages();

result.style.display =
"none";

errorMessage.textContent =
message;

errorMessage.style.display =
"block";

}

function showSuccess(message){

hideMessages();

successMessage.textContent =
message;

successMessage.style.display =
"block";

}


/* =========================
   فحص تسجيل الدخول
========================= */

onAuthStateChanged(

auth,

(user)=>{

if(user){

currentUser = user;

loading.style.display =
"none";

app.style.display =
"block";


/* تشغيل طلبات الصداقة */

listenForRequests();


/* تشغيل قائمة الأصدقاء */

listenForFriends();


}else{

window.location.replace(
mecdChatURL
);

}

}

);


/* =========================
   البحث عن صديق
========================= */

async function searchFriend(){

hideMessages();

result.style.display =
"none";

const id =
friendId.value
.trim()
.toUpperCase();


if(!id){

showError(
"اكتب ID الخاص بالصديق أولاً."
);

return;

}


if(
!/^MC-\d{6}$/.test(id)
){

showError(
"صيغة ID غير صحيحة. مثال: MC-000002"
);

return;

}


searchBtn.disabled =
true;

searchBtn.textContent =
"جاري البحث...";


try{


const usersRef =
collection(
db,
"users"
);


const usersQuery =
query(
usersRef,
where(
"chatID",
"==",
id
)
);


const snapshot =
await getDocs(
usersQuery
);


if(snapshot.empty){

showError(
"لم يتم العثور على مستخدم بهذا الـ ID."
);

return;

}


const userDoc =
snapshot.docs[0];

const data =
userDoc.data();


/* منع إضافة نفسك */

if(
currentUser &&
userDoc.id === currentUser.uid
){

showError(
"لا يمكنك إرسال طلب صداقة لنفسك."
);

return;

}


foundUser = {

uid:
userDoc.id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
"",

chatID:
data.chatID ||
id

};


/* عرض الصورة */

if(foundUser.photo){

userAvatar.innerHTML = `

<img
src="${foundUser.photo}"
alt="صورة المستخدم"
>

`;

}else{

userAvatar.textContent =
"👤";

}


/* الاسم */

userName.textContent =
foundUser.name;


/* ID */

foundUserId.textContent =
"ID: " +
foundUser.chatID;


/* فحص حالة العلاقة */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
foundUser.uid
);

const friendDoc =
await getDoc(myFriendRef);


const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);

const requestDoc =
await getDoc(requestRef);


result.style.display =
"block";


if(friendDoc.exists()){

addButton.textContent =
"✓ صديق بالفعل";

addButton.disabled =
true;

}else if(requestDoc.exists()){

addButton.textContent =
"✓ تم إرسال الطلب";

addButton.disabled =
true;

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled =
false;

}


}catch(error){

console.error(
"Search error:",
error
);

showError(
"حدث خطأ أثناء البحث. حاول مرة أخرى."
);

}finally{

searchBtn.disabled =
false;

searchBtn.textContent =
"بحث";

}

}


/* =========================
   زر البحث
========================= */

searchBtn.addEventListener(

"click",

searchFriend

);


/* Enter */

friendId.addEventListener(

"keydown",

(event)=>{

if(
event.key === "Enter"
){

searchFriend();

}

}

);


/* =========================
   إرسال طلب صداقة
========================= */

addButton.addEventListener(

"click",

async()=>{

if(
!currentUser ||
!foundUser
){

return;

}


addButton.disabled =
true;

addButton.textContent =
"جاري إرسال الطلب...";


try{


/* التأكد أن الصداقة غير موجودة */

const friendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
foundUser.uid
);


const existingFriend =
await getDoc(friendRef);


if(existingFriend.exists()){

addButton.textContent =
"✓ صديق بالفعل";

return;

}


/* مكان الطلب عند الشخص الآخر */

const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);


const existingRequest =
await getDoc(requestRef);


if(existingRequest.exists()){

addButton.textContent =
"✓ تم إرسال الطلب";

return;

}


/* إنشاء طلب الصداقة */

await setDoc(

requestRef,

{

senderUid:
currentUser.uid,

senderName:
currentUser.displayName ||
"مستخدم Mecd",

senderPhoto:
currentUser.photoURL ||
"",

senderEmail:
currentUser.email ||
"",

senderChatID:
await getMyChatID(),

status:
"pending",

createdAt:
Date.now()

}

);


showSuccess(
"📨 تم إرسال طلب الصداقة بنجاح!"
);


addButton.textContent =
"✓ تم إرسال الطلب";


}catch(error){

console.error(
"Friend request error:",
error
);

console.error(
error.code
);

showError(
"حدث خطأ أثناء إرسال طلب الصداقة."
);

addButton.disabled =
false;

addButton.textContent =
"📨 إرسال طلب صداقة";

}

});


/* =========================
   الحصول على Chat ID الحالي
========================= */

async function getMyChatID(){

try{

const userRef =
doc(
db,
"users",
currentUser.uid
);


const userDoc =
await getDoc(userRef);


if(userDoc.exists()){

return (
userDoc.data().chatID ||
""
);

}

return "";

}catch(error){

console.error(error);

return "";

}

}


/* =========================
   الاستماع لطلبات الصداقة
========================= */

function listenForRequests(){

if(
!currentUser
){

return;

}


const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);


requestsUnsubscribe =
onSnapshot(

requestsRef,

(snapshot)=>{

const requests =
[];


snapshot.forEach(

(docSnap)=>{

const data =
docSnap.data();


if(
data.status === "pending"
){

requests.push({

id:
docSnap.id,

...data

});

}

}

);


/* عدد الطلبات */

if(
requests.length > 0
){

requestCount.textContent =
requests.length;

requestCount.style.display =
"flex";

}else{

requestCount.style.display =
"none";

}


/* عرض الطلبات */

renderRequests(requests);

},

(error)=>{

console.error(
"Requests listener:",
error
);

}

);

}


/* =========================
   عرض طلبات الصداقة
========================= */

function renderRequests(requests){

if(
requests.length === 0
){

requestsList.innerHTML = `

<div class="no-requests">

لا توجد طلبات صداقة حالياً.

</div>

`;

return;

}


requestsList.innerHTML =
"";


requests.forEach(

(request)=>{

const card =
document.createElement("div");

card.className =
"request-card";


const photo =
request.senderPhoto ||
"";


card.innerHTML = `

<div class="request-user">

<div class="request-avatar">

${
photo
?
`<img src="${photo}" alt="صورة المستخدم">`
:
"👤"
}

</div>


<div class="request-info">

<div class="request-name">

${escapeHTML(
request.senderName ||
"مستخدم Mecd"
)}

</div>

<div class="request-id">

ID:
${escapeHTML(
request.senderChatID ||
""
)}

</div>

</div>

</div>


<div class="request-actions">

<button
class="accept-button"
data-uid="${request.senderUid}"
data-id="${request.id}"
>

✓ قبول

</button>


<button
class="reject-button"
data-uid="${request.senderUid}"
data-id="${request.id}"
>

✕ رفض

</button>

</div>

`;


requestsList.appendChild(card);

}

);


/* أزرار القبول */

document
.querySelectorAll(".accept-button")
.forEach(

button=>{

button.addEventListener(

"click",

()=>{

acceptRequest(
button.dataset.uid,
button.dataset.id
);

}

);

}

);


/* أزرار الرفض */

document
.querySelectorAll(".reject-button")
.forEach(

button=>{

button.addEventListener(

"click",

()=>{

rejectRequest(
button.dataset.uid,
button.dataset.id
);

}

);

}

);

}


/* =========================
   قبول طلب الصداقة
========================= */

async function acceptRequest(
senderUid,
requestId
){

try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
requestId
);


const requestDoc =
await getDoc(requestRef);


if(!requestDoc.exists()){

return;

}


const request =
requestDoc.data();


/* بيانات المرسل */

const senderRef =
doc(
db,
"users",
senderUid
);


const senderDoc =
await getDoc(senderRef);


if(!senderDoc.exists()){

showError(
"لم يعد حساب صاحب الطلب موجودًا."
);

return;

}


const senderData =
senderDoc.data();


/* إضافة المرسل إلى أصدقائي */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
senderUid
);


await setDoc(

myFriendRef,

{

uid:
senderUid,

name:
senderData.name ||
request.senderName ||
"مستخدم Mecd",

photo:
senderData.photo ||
request.senderPhoto ||
"",

chatID:
senderData.chatID ||
request.senderChatID ||
"",

addedAt:
Date.now()

}

);


/* إضافة المستخدم الحالي إلى أصدقاء المرسل */

const senderFriendRef =
doc(
db,
"users",
senderUid,
"friends",
currentUser.uid
);


await setDoc(

senderFriendRef,

{

uid:
currentUser.uid,

name:
currentUser.displayName ||
"مستخدم Mecd",

photo:
currentUser.photoURL ||
"",

chatID:
await getMyChatID(),

addedAt:
Date.now()

}

);


/* حذف الطلب */

await deleteDoc(requestRef);


showSuccess(
"✅ تم قبول طلب الصداقة!"
);


}catch(error){

console.error(
"Accept request error:",
error
);

showError(
"حدث خطأ أثناء قبول طلب الصداقة."
);

}

}


/* =========================
   رفض الطلب
========================= */

async function rejectRequest(
senderUid,
requestId
){

try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
requestId
);


await deleteDoc(requestRef);


showSuccess(
"تم رفض طلب الصداقة."
);


}catch(error){

console.error(
"Reject request error:",
error
);

showError(
"حدث خطأ أثناء رفض الطلب."
);

}

}


/* =========================
   قائمة الأصدقاء مباشرة
========================= */

function listenForFriends(){

if(
!currentUser
){

return;

}


const friendsRef =
collection(
db,
"users",
currentUser.uid,
"friends"
);


friendsUnsubscribe =
onSnapshot(

friendsRef,

(snapshot)=>{

if(snapshot.empty){

emptyFriends.style.display =
"block";

friendsList
.querySelectorAll(".friend-item")
.forEach(
element=>element.remove()
);

return;

}


emptyFriends.style.display =
"none";


friendsList
.querySelectorAll(".friend-item")
.forEach(
element=>element.remove()
);


snapshot.forEach(

(friendDoc)=>{

const friend =
friendDoc.data();


const item =
document.createElement("div");

item.className =
"friend-item";


item.innerHTML = `

<div class="friend-item-avatar">

${
friend.photo
?
`<img src="${friend.photo}" alt="صورة الصديق">`
:
"👤"
}

</div>


<div class="friend-item-info">

<div class="friend-item-name">

${escapeHTML(
friend.name ||
"مستخدم Mecd"
)}

</div>

<div class="friend-item-id">

ID:
${escapeHTML(
friend.chatID ||
""
)}

</div>

</div>

`;


friendsList.appendChild(item);

}

);

},

(error)=>{

console.error(
"Friends listener:",
error
);

}

);

}


/* =========================
   حماية النصوص
========================= */

function escapeHTML(value){

return String(value)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
