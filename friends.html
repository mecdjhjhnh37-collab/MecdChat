<style>

*{

body{

header{

#searchBtn{

.request-avatar{

height:55px;

.request-info{

.request-name{

.request-id{

}

.accept-button,
.reject-button{

.accept-button{

.reject-button{

.accept-button:disabled,

}

.friend-item{

align-items:center;
gap:14px;
padding:16px;
border-radius:22px;

.friend-item:hover{

}

}

.friend-avatar{

height:58px;
flex-shrink:0;
border-radius:18px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#303030;
font-size:25px;
}

.friend-info{
flex:1;
min-width:0;
}

.friend-name{
font-weight:bold;
font-size:16px;
margin-bottom:5px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

.friend-id{

font-size:12px;
}

.friend-arrow{

}

.friend-menu{

inset:0;

display:none;

.friend-menu-box{

.friend-menu-user{

align-items:center;
gap:14px;
padding-bottom:18px;
margin-bottom:15px;

}

.friend-menu-avatar{
width:58px;
height:58px;
flex-shrink:0;
border-radius:18px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#303030;
font-size:25px;
}

.friend-menu-info{
flex:1;
min-width:0;
}

.friend-menu-name{
font-size:18px;
font-weight:bold;
overflow:hidden;

}

.friend-menu-id{

.friend-menu-button{

.chat-friend-button{

}

.remove-friend-button{
background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.08);
}

.block-friend-button{
background:rgba(255,70,70,.10);
color:#ffaaaa;
border:1px solid rgba(255,70,70,.18);
}

.close-friend-menu{
background:rgba(255,255,255,.04);
color:#aaa;
}

.loading{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:18px;
background:linear-gradient(180deg,#07110f,#020504);

}

.spinner{
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;

@keyframes spin{
to{
transform:rotate(360deg);
}
}

@media(max-width:480px){

.app{
padding:20px 15px 35px;
}

.logo{
width:45px;
height:45px;

}

.brand h2{
font-size:18px;
}

font-size:12px;
padding:9px 11px;
}

.hero h1{
font-size:30px;
}

.search-row{
flex-direction:column;
}

#searchBtn{
height:50px;
}

}

</style>
</head>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
getDoc,
doc,
setDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};

const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* =========================
   العناصر
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const friendId =
document.getElementById("friendId");

const searchBtn =
document.getElementById("searchBtn");

const result =
document.getElementById("result");

const userAvatar =
document.getElementById("userAvatar");

const userName =
document.getElementById("userName");

const foundUserId =
document.getElementById("foundUserId");

const addButton =
document.getElementById("addButton");

const errorMessage =
document.getElementById("errorMessage");

const successMessage =
document.getElementById("successMessage");

const backBtn =
document.getElementById("backBtn");

const notificationBtn =
document.getElementById("notificationBtn");

const notificationCount =
document.getElementById("notificationCount");

const requests =
document.getElementById("requests");

const requestsList =
document.getElementById("requestsList");

const closeRequests =
document.getElementById("closeRequests");

const friendsList =
document.getElementById("friendsList");

const friendMenu =
document.getElementById("friendMenu");

const menuFriendAvatar =
document.getElementById("menuFriendAvatar");

const menuFriendName =
document.getElementById("menuFriendName");

const menuFriendId =
document.getElementById("menuFriendId");

const chatFriendButton =
document.getElementById("chatFriendButton");

const removeFriendButton =
document.getElementById("removeFriendButton");

const blockFriendButton =
document.getElementById("blockFriendButton");

const closeFriendMenu =
document.getElementById("closeFriendMenu");


/* =========================
   المتغيرات
========================= */

let currentUser = null;
let currentUserData = null;
let foundUser = null;
let selectedFriend = null;

const mecdChatURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/";

const chatPageURL =
"https://mecdjhjhnh37-collab.github.io/MecdChat/chat.html";


/* =========================
   حماية HTML
========================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   الرسائل
========================= */

function hideMessages(){

errorMessage.style.display = "none";
successMessage.style.display = "none";

}

function showError(message){

successMessage.style.display = "none";

result.style.display = "none";

errorMessage.textContent = message;

errorMessage.style.display = "block";

}

function showSuccess(message){

errorMessage.style.display = "none";

successMessage.textContent = message;

successMessage.style.display = "block";

}


/* =========================
   بيانات المستخدم
========================= */

async function loadCurrentUserData(){

if(!currentUser){
return null;
}

const userRef =
doc(
db,
"users",
currentUser.uid
);

const snapshot =
await getDoc(userRef);

if(snapshot.exists()){

currentUserData =
snapshot.data();

}else{

currentUserData = {};

}

return currentUserData;

}


/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.replace(
mecdChatURL
);

return;

}

currentUser = user;

try{

await loadCurrentUserData();

loading.style.display = "none";

app.style.display = "block";

await loadFriends();

await loadRequestCount();

}catch(error){

console.error(
"Initial loading error:",
error
);

loading.style.display = "none";

app.style.display = "block";

showError(
"حدث خطأ أثناء تحميل البيانات."
);

}

}
);


/* =========================
   البحث عن صديق
========================= */

async function searchFriend(){

hideMessages();

result.style.display = "none";

foundUser = null;

const id =
friendId.value
.trim()
.toUpperCase();

if(!id){

showError(
"اكتب ID الخاص بالصديق أولاً."
);

return;

}

if(!/^MC-\d{6}$/.test(id)){

showError(
"صيغة ID غير صحيحة. مثال: MC-000002"
);

return;

}

if(!currentUser){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}

searchBtn.disabled = true;
searchBtn.textContent = "جاري البحث...";

try{

const usersRef =
collection(db,"users");

const usersQuery =
query(
usersRef,
where("chatID","==",id)
);

const snapshot =
await getDocs(usersQuery);

if(snapshot.empty){

showError(
"لم يتم العثور على مستخدم بهذا الـ ID."
);

return;

}

const userDoc =
snapshot.docs[0];

const data =
userDoc.data();

if(userDoc.id === currentUser.uid){

showError(
"لا يمكنك إرسال طلب صداقة لنفسك."
);

return;

}

foundUser = {

uid:userDoc.id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
id

};

if(foundUser.photo){

userAvatar.innerHTML = `
<img
src="${escapeHTML(foundUser.photo)}"
alt="صورة المستخدم"
>
`;

}else{

userAvatar.textContent = "👤";

}

userName.textContent =
foundUser.name;

foundUserId.textContent =
"ID: " + foundUser.chatID;


/* فحص الصداقة */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
foundUser.uid
);

const existingFriend =
await getDoc(myFriendRef);

if(existingFriend.exists()){

addButton.textContent =
"✓ أنتم أصدقاء بالفعل";

addButton.disabled = true;

result.style.display = "block";

return;

}


/* فحص طلب سابق */

const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);

const existingRequest =
await getDoc(requestRef);

if(existingRequest.exists()){

const requestData =
existingRequest.data();

if(requestData.status === "pending"){

addButton.textContent =
"✓ تم إرسال طلب الصداقة";

addButton.disabled = true;

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled = false;

}

}else{

addButton.textContent =
"📨 إرسال طلب صداقة";

addButton.disabled = false;

}

result.style.display = "block";

}catch(error){

console.error("Search error:",error);

if(error.code === "permission-denied"){

showError(
"ليس لديك صلاحية البحث عن المستخدمين. تأكد من نشر Firestore Rules."
);

}else{

showError(
"حدث خطأ أثناء البحث. حاول مرة أخرى."
);

}

}finally{

searchBtn.disabled = false;
searchBtn.textContent = "بحث";

}

}


/* =========================
   إرسال طلب صداقة
========================= */

async function sendFriendRequest(){

if(!foundUser || !currentUser){
return;
}

addButton.disabled = true;
addButton.textContent = "جاري الإرسال...";

try{

const requestRef =
doc(
db,
"users",
foundUser.uid,
"friendRequests",
currentUser.uid
);

await setDoc(
requestRef,
{
fromUid:currentUser.uid,
fromName:
currentUserData?.name ||
currentUser.displayName ||
"مستخدم Mecd",
fromPhoto:
currentUserData?.photo ||
currentUser.photoURL ||
"",
fromChatID:
currentUserData?.chatID ||
"",
status:"pending",
createdAt:serverTimestamp()
}
);

addButton.textContent =
"✓ تم إرسال طلب الصداقة";

showSuccess(
"تم إرسال طلب الصداقة بنجاح."
);

}catch(error){

console.error(
"Friend request error:",
error
);

addButton.disabled = false;
addButton.textContent =
"📨 إرسال طلب صداقة";

if(error.code === "permission-denied"){

showError(
"تم رفض العملية من Firestore Rules."
);

}else{

showError(
"حدث خطأ أثناء إرسال الطلب."
);

}

}

}


/* =========================
   تحميل عدد الطلبات
========================= */

async function loadRequestCount(){

if(!currentUser){
return;
}

try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where("status","==","pending")
);

const snapshot =
await getDocs(requestsQuery);

const count =
snapshot.size;

notificationCount.textContent =
count;

notificationCount.style.display =
count > 0 ? "flex" : "none";

}catch(error){

"Request count error:",
error
);

}


/* =========================
   تحميل طلبات الصداقة
========================= */

async function loadRequests(){

if(!currentUser){
return;
}

requestsList.innerHTML = "";

try{

const requestsRef =
collection(
db,
"users",
currentUser.uid,
"friendRequests"
);

const requestsQuery =
query(
requestsRef,
where("status","==","pending")
);

const snapshot =
await getDocs(requestsQuery);

if(snapshot.empty){

requestsList.innerHTML = `
<div class="no-requests">
لا توجد طلبات صداقة حالياً.
</div>
`;

return;

}

snapshot.forEach((requestDoc)=>{

const data =
requestDoc.data();

const item =
document.createElement("div");

item.className =
"request-item";

const avatar =
data.fromPhoto
? `
<img
src="${escapeHTML(data.fromPhoto)}"
alt="صورة المستخدم"
>
`
: "👤";

item.innerHTML = `

<div class="request-user">

<div class="request-avatar">
${avatar}
</div>

<div class="request-info">

<div class="request-name">
${escapeHTML(data.fromName || "مستخدم Mecd")}
</div>

<div class="request-id">
ID: ${escapeHTML(data.fromChatID || "")}
</div>

</div>

</div>

<div class="request-actions">

<button
class="accept-button"
data-id="${escapeHTML(requestDoc.id)}"
>
✓ قبول
</button>

<button
class="reject-button"
data-id="${escapeHTML(requestDoc.id)}"
>
✕ رفض
</button>

</div>
`;

requestsList.appendChild(item);

});

}catch(error){

console.error(
"Load requests error:",
error
);

requestsList.innerHTML = `
<div class="no-requests">
تعذر تحميل الطلبات.
</div>
`;

}

}


/* =========================
   قبول طلب الصداقة
========================= */

async function acceptFriendRequest(requestId){

if(!currentUser){
return;
}

try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
requestId
);

const requestSnapshot =
await getDoc(requestRef);

if(!requestSnapshot.exists()){

showError(
"طلب الصداقة غير موجود."
);

return;

}

const requestData =
requestSnapshot.data();

const friendUid =
requestData.fromUid;

if(!friendUid){

showError(
"بيانات طلب الصداقة غير مكتملة."
);

return;

}


/* إضافة الصديق عندي */

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
friendUid
);

await setDoc(
myFriendRef,
{
uid:friendUid,
name:
requestData.fromName ||
"مستخدم Mecd",
photo:
requestData.fromPhoto ||
"",
chatID:
requestData.fromChatID ||
"",
addedAt:serverTimestamp()
}
);


/* إضافة الصداقة عند الطرف الآخر */

const friendUserRef =
doc(
db,
"users",
friendUid
);

const friendUserSnapshot =
await getDoc(friendUserRef);

const friendUserData =
friendUserSnapshot.exists()
? friendUserSnapshot.data()
: {};

const myFriendForOther =
doc(
db,
"users",
friendUid,
"friends",
currentUser.uid
);

await setDoc(
myFriendForOther,
{
uid:currentUser.uid,
name:
currentUserData?.name ||
currentUser.displayName ||
"مستخدم Mecd",
photo:
currentUserData?.photo ||
currentUser.photoURL ||
"",
chatID:
currentUserData?.chatID ||
"",
addedAt:serverTimestamp()
}
);


/* حذف الطلب */

await deleteDoc(requestRef);

showSuccess(
"تم قبول طلب الصداقة بنجاح."
);

await loadFriends();
await loadRequests();
await loadRequestCount();

}catch(error){

console.error(
"Accept request error:",
error
);

if(error.code === "permission-denied"){

showError(
"تم رفض قبول الطلب بسبب Firestore Rules."
);

}else{

showError(
"حدث خطأ أثناء قبول طلب الصداقة."
);

}

}

}


/* =========================
   رفض طلب الصداقة
========================= */

async function rejectFriendRequest(requestId){

if(!currentUser){
return;
}

try{

const requestRef =
doc(
db,
"users",
currentUser.uid,
"friendRequests",
requestId
);

await deleteDoc(requestRef);

await loadRequests();
await loadRequestCount();

showSuccess(
"تم رفض طلب الصداقة."
);

}catch(error){

console.error(
"Reject request error:",
error
);

showError(
"حدث خطأ أثناء رفض الطلب."
);

}

}


/* =========================
   تحميل الأصدقاء
========================= */

async function loadFriends(){

if(!currentUser){
return;
}

friendsList.innerHTML = "";

try{

const friendsRef =
collection(
db,
"users",
currentUser.uid,
"friends"
);

const snapshot =
await getDocs(friendsRef);

if(snapshot.empty){

friendsList.innerHTML = `
<div class="empty">

لا يوجد أصدقاء حتى الآن.

<br>

ابحث عن صديق باستخدام الـ ID لإضافته.

</div>
`;

return;

}

snapshot.forEach((friendDoc)=>{

const friend =
friendDoc.data();

const item =
document.createElement("div");

item.className =
"friend-item";

const photo =
friend.photo || "";

const avatar =
photo
? `
<img
src="${escapeHTML(photo)}"
alt="صورة الصديق"
>
`
: "👤";

item.innerHTML = `

<div class="friend-avatar">
${avatar}
</div>

<div class="friend-info">

<div class="friend-name">
${escapeHTML(friend.name || "مستخدم Mecd")}
</div>

<div class="friend-id">
ID: ${escapeHTML(friend.chatID || "")}
</div>

</div>

<div class="friend-arrow">
←
</div>
`;


/* =========================
   عند الضغط على الصديق
========================= */

item.addEventListener(
"click",
()=>{

selectedFriend = {

uid:
friend.uid ||
friendDoc.id,

name:
friend.name ||
"مستخدم Mecd",

photo:
friend.photo ||
"",

chatID:
friend.chatID ||
""

};

menuFriendName.textContent =
selectedFriend.name;

menuFriendId.textContent =
"ID: " + selectedFriend.chatID;


if(selectedFriend.photo){

menuFriendAvatar.innerHTML = `

<img
src="${escapeHTML(selectedFriend.photo)}"
alt="صورة الصديق"
>

`;

}else{

menuFriendAvatar.textContent =
"👤";

}

friendMenu.style.display =
"flex";

}
);

friendsList.appendChild(item);

});

}catch(error){

console.error(
"Load friends error:",
error
);

friendsList.innerHTML = `
<div class="empty">
حدث خطأ أثناء تحميل الأصدقاء.
</div>
`;

}

}


/* =========================
   فتح الدردشة
========================= */

chatFriendButton.addEventListener(
"click",
()=>{

if(!selectedFriend){

showError(
"لم يتم تحديد الصديق."
);

return;

}

if(!selectedFriend.uid){

showError(
"بيانات الصديق غير مكتملة."
);

return;

}


/*
نرسل بيانات الصديق إلى chat.html
*/

const chatURL =
chatPageURL +
"?uid=" +
encodeURIComponent(
selectedFriend.uid
) +
"&chatID=" +
encodeURIComponent(
selectedFriend.chatID || ""
) +
"&name=" +
encodeURIComponent(
selectedFriend.name || "مستخدم Mecd"
);


/*
إغلاق القائمة قبل الانتقال
*/

friendMenu.style.display =
"none";


/*
فتح صفحة الدردشة
*/

window.location.href =
chatURL;

}
);


/* =========================
   إلغاء الصداقة
========================= */

removeFriendButton.addEventListener(
"click",
async()=>{

if(!selectedFriend || !currentUser){
return;
}

const confirmed =
confirm(
"هل تريد إلغاء الصداقة مع هذا الشخص؟"
);

if(!confirmed){
return;
}

try{

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
selectedFriend.uid
);

await deleteDoc(
myFriendRef
);

friendMenu.style.display =
"none";

selectedFriend = null;

await loadFriends();

showSuccess(
"تم إلغاء الصداقة."
);

}catch(error){

"Remove friend error:",
error
);

showError(
"حدث خطأ أثناء إلغاء الصداقة."
);

}

}
);


/* =========================
   الحظر
========================= */

blockFriendButton.addEventListener(
"click",
async()=>{

if(!selectedFriend || !currentUser){
return;
}

const confirmed =
confirm(
"هل تريد حظر هذا الصديق؟"
);

if(!confirmed){
return;
}

try{

const myFriendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
selectedFriend.uid
);

await deleteDoc(
myFriendRef
);

friendMenu.style.display =
"none";

selectedFriend = null;

showSuccess(
"تمت إزالة الصديق من قائمتك."
);

}catch(error){

console.error(
"Block friend error:",
error
);

showError(
"حدث خطأ أثناء العملية."
);

}

}
);


/* =========================
   الأحداث
========================= */

searchBtn.addEventListener(
"click",
searchFriend
);

friendId.addEventListener(
"keydown",
(event)=>{

if(event.key === "Enter"){

searchFriend();

}

}
);

addButton.addEventListener(
"click",
sendFriendRequest
);


/* =========================
   الإشعارات
========================= */

notificationBtn.addEventListener(
"click",
async()=>{

if(
requests.style.display === "block"
){

requests.style.display =
"none";

}else{

await loadRequests();

requests.style.display =
"block";

}

}
);


/* =========================
   إغلاق الطلبات
========================= */

closeRequests.addEventListener(
"click",
()=>{

requests.style.display =
"none";

}
);


/* =========================
   أزرار قبول ورفض
========================= */

requestsList.addEventListener(
"click",
async(event)=>{

const acceptButton =
event.target.closest(
".accept-button"
);

const rejectButton =
event.target.closest(
".reject-button"
);

if(acceptButton){

acceptButton.disabled =
true;

await acceptFriendRequest(
acceptButton.dataset.id
);

}

if(rejectButton){

rejectButton.disabled =
true;

await rejectFriendRequest(
rejectButton.dataset.id
);

}

}
);


/* =========================
   إغلاق قائمة الصديق
========================= */

closeFriendMenu.addEventListener(
"click",
()=>{

friendMenu.style.display =
"none";

selectedFriend = null;

}
);


/* الضغط خارج القائمة */

friendMenu.addEventListener(
"click",
(event)=>{

if(event.target === friendMenu){

friendMenu.style.display =
"none";

selectedFriend = null;

}

}
);


/* =========================
   الرجوع
========================= */

backBtn.addEventListener(
"click",
()=>{

window.location.href =
mecdChatURL;

}
);


/* =========================
   Service Worker
========================= */

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.then(
registration=>{

console.log(
"Mecd Chat Service Worker:",
registration.scope
);

}
)
.catch(
error=>{

console.error(
"Service Worker:",
error
);

}
);

}
);

}

</script>
