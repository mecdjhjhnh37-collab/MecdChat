<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#123d35,transparent 40%),
        linear-gradient(180deg,#07110f,#020504);
    overflow:hidden;
}

.app{
    height:100vh;
    max-width:650px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    background:#050807;
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
}

.back{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:#18231f;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:16px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:24px;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:12px;
    color:#777;
    margin-top:5px;
    transition:.2s;
}

.user-status.online{
    color:#00e889;
}

.user-status.typing{
    color:#00e889;
    font-weight:bold;
}

.call-buttons{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.call-buttons button{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#18231f;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.call-buttons button:active{
    transform:scale(.94);
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:20px 15px 150px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#72817c;
}

.message{
    max-width:78%;
    padding:12px 15px;
    border-radius:18px;
    position:relative;
    word-break:break-word;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.message.mine{
    align-self:flex-start;
    background:#00c96b;
    color:#00150e;
    border-bottom-left-radius:5px;
}

.message.other{
    align-self:flex-end;
    background:#18231f;
    border:1px solid rgba(255,255,255,.08);
    border-bottom-right-radius:5px;
}

.time{
    display:inline-block;
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:5px;
    margin-top:5px;
}

.message-status{
    font-size:12px;
    line-height:1;
    font-weight:bold;
    letter-spacing:-3px;
    direction:ltr;
    display:inline-block;
    min-width:16px;
}

.message-status.sent{
    opacity:.65;
}

.message-status.read{
    color:#006dff;
    opacity:1;
}

.input-area{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:650px;
    padding:10px;
    display:flex;
    gap:8px;
    background:#050807;
    z-index:50;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:14px;
    border-radius:17px;
    border:1px solid #27332f;
    background:#111916;
    color:white;
    outline:none;
    font-size:15px;
}

#messageInput:focus{
    border-color:#00e889;
}

#voiceButton,
#sendButton{
    width:50px;
    height:50px;
    border:0;
    border-radius:16px;
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
}

#voiceButton{
    background:#18231f;
    color:white;
}

#voiceButton.recording{
    background:#d83b3b;
}

#sendButton{
    background:#00e889;
    color:#00150e;
}

#sendButton:disabled{
    opacity:.6;
}

.message-menu{
    position:absolute;
    left:50%;
    bottom:calc(100% + 8px);
    transform:translateX(-50%);
    min-width:150px;
    padding:5px;
    background:#0b1512;
    border:1px solid rgba(0,232,137,.18);
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.55);
    z-index:99999;
}

.message-menu button{
    width:100%;
    padding:10px 14px;
    border:0;
    border-radius:11px;
    background:#18231f;
    color:white;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.call-message{
    min-width:245px;
    max-width:310px;
    padding:10px 12px !important;
}

.call-box{
    display:flex;
    align-items:center;
    gap:11px;
}

.call-icon{
    width:46px;
    height:46px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,232,137,.14);
    color:#00e889;
    font-size:22px;
    flex-shrink:0;
}

.call-info{
    min-width:0;
    flex:1;
}

.call-title{
    font-size:14px;
    font-weight:bold;
}

.call-subtitle{
    font-size:11px;
    opacity:.65;
    margin-top:4px;
}

.call-duration{
    font-size:11px;
    margin-top:4px;
    opacity:.75;
}

audio{
    max-width:100%;
}

/* =========================
   نافذة المكالمة
========================= */

#callOverlay{
    position:fixed;
    inset:0;
    background:rgba(2,5,4,.96);
    z-index:100000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.call-card{
    width:min(430px,100%);
    background:#0b1512;
    border:1px solid rgba(0,232,137,.18);
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.call-avatar{
    width:90px;
    height:90px;
    margin:0 auto 15px;
    border-radius:25px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:40px;
}

.call-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#callName{
    font-size:21px;
    font-weight:bold;
}

#callState{
    color:#00e889;
    font-size:13px;
    margin-top:8px;
}

.call-actions{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:25px;
}

.call-actions button{
    width:58px;
    height:58px;
    border:0;
    border-radius:18px;
    font-size:23px;
    cursor:pointer;
    background:#18231f;
    color:white;
}

.call-actions .end{
    background:#d83b3b;
}

#videoArea{
    width:100%;
    display:none;
    position:relative;
    margin-top:15px;
    border-radius:18px;
    overflow:hidden;
    background:#000;
}

#remoteVideo{
    width:100%;
    height:330px;
    object-fit:cover;
    background:#000;
}

#localVideo{
    position:absolute;
    width:100px;
    height:140px;
    left:12px;
    bottom:12px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid #00e889;
    background:#000;
}

@media(max-width:500px){
    .message{
        max-width:84%;
    }

    header{
        padding:12px;
    }

    .call-buttons button{
        width:40px;
        height:40px;
    }

    .call-message{
        min-width:225px;
        max-width:85%;
    }
}
</style>
</head>

<script type="module">

/* ============================================================
   Firebase
============================================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    query,
    orderBy,
    onSnapshot,
    addDoc,
    deleteDoc,
    updateDoc,
    arrayUnion,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

    authDomain:
        "mecd-tools.firebaseapp.com",

    projectId:
        "mecd-tools",

    storageBucket:
        "mecd-tools.firebasestorage.app",

    messagingSenderId:
        "643005547408",

    appId:
        "1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getFirestore(firebaseApp);

window.chatDB = db;


/* ============================================================
   العناصر
============================================================ */

const $ = id =>
    document.getElementById(id);

const messages =
    $("messages");

const messageInput =
    $("messageInput");

const sendButton =
    $("sendButton");

const voiceButton =
    $("voiceButton");

const friendName =
    $("friendName");

const friendAvatar =
    $("friendAvatar");

const friendStatus =
    $("friendStatus");

const backButton =
    $("backButton");

const callButton =
    $("callButton");

const videoButton =
    $("videoButton");

const loading =
    $("loading");

const app =
    $("app");

const callOverlay =
    $("callOverlay");

const callAvatar =
    $("callAvatar");

const callName =
    $("callName");

const callState =
    $("callState");

const endCallButton =
    $("endCallButton");

const muteButton =
    $("muteButton");

const cameraButton =
    $("cameraButton");

const videoArea =
    $("videoArea");

const remoteVideo =
    $("remoteVideo");

const localVideo =
    $("localVideo");


/* ============================================================
   المتغيرات
============================================================ */

let currentUser = null;
let friendUser = null;
let chatID = null;

let unsubscribeMessages = null;
let unsubscribeFriendStatus = null;
let unsubscribeFriendTyping = null;

let presenceInterval = null;
let typingTimer = null;
let typingState = false;

let mediaRecorder = null;
let audioChunks = [];

let localStream = null;
let peerConnection = null;

let activeCallId = null;
let activeCallType = null;
let callTimer = null;
let callSeconds = 0;


/* ============================================================
   WebRTC
============================================================ */

const rtcConfig = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* ============================================================
   أدوات
============================================================ */

function createChatID(a,b){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


function escapeHtml(value){

    return String(value)
        .replace(
            /[&<>'"]/g,
            c => ({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                "'":'&#39;',
                '"':'&quot;'
            }[c])
        );

}


function showApp(){

    loading.style.display =
        "none";

    app.style.display =
        "flex";

}


function showError(error){

    console.error(error);

    loading.innerHTML =
        `<div style="text-align:center;padding:20px">
        ⚠️ تعذر فتح الدردشة<br>
        <small style="color:#777">
        ${escapeHtml(error?.message || "حدث خطأ")}
        </small>
        </div>`;

}


/* ============================================================
   Presence
============================================================ */

async function updateMyPresence(
    online = true
){

    if(!currentUser) return;

    try{

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {
                online,
                lastSeen:
                    serverTimestamp()
            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Presence:",
            error
        );

    }

}


function startPresence(){

    updateMyPresence(true);

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        setInterval(
            () => {

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    updateMyPresence(true);

                }

            },
            10000
        );

}


function stopPresence(){

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        null;

    updateMyPresence(false);

}


/* ============================================================
   تحميل الصديق
============================================================ */

async function loadFriend(){

    const id =
        new URLSearchParams(
            location.search
        ).get("friend");

    if(!id){

        throw new Error(
            "لا يوجد صديق في الرابط"
        );

    }

    const userDoc =
        await getDoc(
            doc(
                db,
                "users",
                id
            )
        );

    if(!userDoc.exists()){

        throw new Error(
            "المستخدم غير موجود"
        );

    }

    const data =
        userDoc.data();

    friendUser = {

        uid:id,

        name:
            data.name ||
            "مستخدم Mecd",

        photo:
            data.photo ||
            ""

    };

    friendName.textContent =
        friendUser.name;

    callName.textContent =
        friendUser.name;

    if(friendUser.photo){

        const html =
            `<img src="${escapeHtml(
                friendUser.photo
            )}">`;

        friendAvatar.innerHTML =
            html;

        callAvatar.innerHTML =
            html;

    }

    chatID =
        createChatID(
            currentUser.uid,
            friendUser.uid
        );

    window.chatID =
        chatID;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friendUser;

    await setDoc(

        doc(
            db,
            "chats",
            chatID
        ),

        {
            members:[
                currentUser.uid,
                friendUser.uid
            ],

            createdAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );

    listenFriendStatus();

    listenFriendTyping();

}


/* ============================================================
   حالة الصديق
============================================================ */

function listenFriendStatus(){

    if(!friendUser) return;

    if(unsubscribeFriendStatus){

        unsubscribeFriendStatus();

    }

    unsubscribeFriendStatus =
        onSnapshot(

            doc(
                db,
                "users",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    setFriendOffline();

                    return;

                }

                const data =
                    snap.data();

                const last =
                    data.lastSeen
                    ?.toMillis?.() || 0;

                const online =
                    data.online === true &&
                    last > 0 &&
                    Date.now() - last < 30000;

                if(
                    !friendStatus.classList
                        .contains("typing")
                ){

                    friendStatus.textContent =
                        online
                        ? "● متصل"
                        : "● غير متصل";

                }

                friendStatus.classList.toggle(
                    "online",
                    online
                );

            }

        );

}


function setFriendOffline(){

    friendStatus.textContent =
        "● غير متصل";

    friendStatus.classList.remove(
        "online"
    );

}


/* ============================================================
   الكتابة
============================================================ */

function listenFriendTyping(){

    if(!friendUser) return;

    if(unsubscribeFriendTyping){

        unsubscribeFriendTyping();

    }

    unsubscribeFriendTyping =
        onSnapshot(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    setTypingUI(false);

                    return;

                }

                const data =
                    snap.data();

                const time =
                    data.updatedAt
                    ?.toMillis?.() || 0;

                const typing =
                    data.typing === true &&
                    (
                        !time ||
                        Date.now() - time < 5000
                    );

                setTypingUI(typing);

            }

        );

}


function setTypingUI(typing){

    if(typing){

        friendStatus.textContent =
            "يكتب...";

        friendStatus.classList.add(
            "typing"
        );

        friendStatus.classList.remove(
            "online"
        );

    }else{

        friendStatus.classList.remove(
            "typing"
        );

        listenFriendStatus();

    }

}


async function updateTyping(typing){

    if(
        !currentUser ||
        !chatID
    ) return;

    if(
        typingState === typing
    ) return;

    typingState =
        typing;

    try{

        await setDoc(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                currentUser.uid
            ),

            {
                typing,
                updatedAt:
                    serverTimestamp()
            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(error);

    }

}


messageInput.addEventListener(
    "input",
    () => {

        const hasText =
            messageInput.value.trim()
                .length > 0;

        if(!hasText){

            clearTimeout(
                typingTimer
            );

            updateTyping(false);

            return;

        }

        updateTyping(true);

        clearTimeout(
            typingTimer
        );

        typingTimer =
            setTimeout(
                () => updateTyping(false),
                1500
            );

    }
);


/* ============================================================
   الرسائل
============================================================ */

function formatTime(timestamp){

    if(!timestamp?.toDate)
        return "";

    return timestamp
        .toDate()
        .toLocaleTimeString(
            "ar",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function createStatus(data){

    if(
        data.senderId !==
        currentUser.uid
    ){

        return null;

    }

    const span =
        document.createElement("span");

    span.className =
        "message-status " +
        (
            data.read === true
            ? "read"
            : "sent"
        );

    span.textContent =
        data.read === true
        ? "✓✓"
        : "✓";

    return span;

}


function createCallMessage(
    box,
    data
){

    box.classList.add(
        "call-message"
    );

    const callBox =
        document.createElement("div");

    callBox.className =
        "call-box";

    const icon =
        document.createElement("div");

    icon.className =
        "call-icon";

    icon.textContent =
        data.callType === "video"
        ? "📹"
        : "📞";

    const info =
        document.createElement("div");

    info.className =
        "call-info";

    const title =
        document.createElement("div");

    title.className =
        "call-title";

    const incoming =
        data.callerId !==
        currentUser.uid;

    title.textContent =
        data.callStatus === "missed"
        ?
        "مكالمة لم يتم الرد عليها"
        :
        (
            incoming
            ? "مكالمة واردة"
            : "مكالمة صادرة"
        );

    const subtitle =
        document.createElement("div");

    subtitle.className =
        "call-subtitle";

    subtitle.textContent =
        data.callType === "video"
        ? "مكالمة فيديو"
        : "مكالمة صوتية";

    const duration =
        document.createElement("div");

    duration.className =
        "call-duration";

    duration.textContent =
        "⏱️ " +
        formatDuration(
            data.duration || 0
        );

    info.appendChild(title);
    info.appendChild(subtitle);
    info.appendChild(duration);

    callBox.appendChild(icon);
    callBox.appendChild(info);

    box.appendChild(callBox);

}


function formatDuration(seconds){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds || 0)
            )
        );

    const m =
        Math.floor(seconds / 60);

    const s =
        seconds % 60;

    return (
        String(m).padStart(2,"0")
        + ":" +
        String(s).padStart(2,"0")
    );

}


async function markRead(
    id,
    data
){

    ){

        await updateDoc(

            doc(

                "chats",

function addMessageActions(
    element,
    id,
    mine
){

    let timer = null;

    const cancel = () => {

        clearTimeout(timer);

        timer = null;

    };

    element.addEventListener(
        "pointerdown",
        e => {

            if(
                e.target.closest(
                    ".message-menu"
                )
            ) return;

            cancel();

            timer =
                setTimeout(
                    showMenu,
                    500
                );

        }
    );

    element.addEventListener(
        "pointerup",
        cancel
    );

    element.addEventListener(
        "pointercancel",
        cancel
    );

    element.addEventListener(
        "pointerleave",
        cancel
    );

    element.addEventListener(
        "contextmenu",
        e => {

            e.preventDefault();

            showMenu();

        }
    );

    function showMenu(){

        removeMenus();

        const menu =
            document.createElement("div");

        menu.className =
            "message-menu";

        const button =
            document.createElement("button");

        button.textContent =
            mine
            ? "🗑️ إلغاء الإرسال"
            : "🗑️ حذف لدي";

        button.onclick =
            async e => {

                e.stopPropagation();

                try{

                    const ref =
                        doc(
                            db,
                            "chats",
                            chatID,
                            "messages",
                            id
                        );

                    if(mine){

                        await deleteDoc(ref);

                    }else{

                        await updateDoc(
                            ref,
                            {
                                deletedFor:
                                    arrayUnion(
                                        currentUser.uid
                                    )
                            }
                        );

                    }

                    removeMenus();

                }catch(error){

                    console.error(error);

                    alert(
                        "حدث خطأ أثناء حذف الرسالة"
                    );

                }

            };

        menu.appendChild(button);

        element.appendChild(menu);

    }

}


function removeMenus(){

    document
        .querySelectorAll(
            ".message-menu"
        )
        .forEach(
            x => x.remove()
        );

}


document.addEventListener(
    "pointerdown",
    e => {

        if(
            !e.target.closest(
                ".message-menu"
            )
        ){

            removeMenus();

        }

    }
);


function renderMessages(snap){

    if(!renderMessages.elements){

        renderMessages.elements =
            new Map();

    }

    const elements =
        renderMessages.elements;

    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight < 120;

    snap.docChanges().forEach(
        change => {

            const id =
                change.doc.id;

            const data =
                change.doc.data();

            if(
                change.type === "added" ||
                change.type === "modified"
            ){

                if(
                    data.senderId !==
                    currentUser.uid
                ){

                    markRead(id,data);

                }

            }

            if(
                change.type === "removed"
            ){

                const old =
                    elements.get(id);

                if(old){

                    old.remove();

                    elements.delete(id);

                }

                return;

            }

            if(
                Array.isArray(
                    data.deletedFor
                ) &&
                data.deletedFor.includes(
                    currentUser.uid
                )
            ){

                const old =
                    elements.get(id);

                if(old){

                    old.remove();

                    elements.delete(id);

                }

                return;

            }

            const box =
                document.createElement("div");

            box.className =
                "message " +
                (
                    data.senderId ===
                    currentUser.uid
                    ? "mine"
                    : "other"
                );

            if(data.type === "call"){

                createCallMessage(
                    box,
                    data
                );

            }else if(
                data.type === "voice"
            ){

                const audio =
                    document.createElement(
                        "audio"
                    );

                audio.controls =
                    true;

                audio.src =
                    data.audio || "";

                box.appendChild(audio);

            }else{

                box.appendChild(
                    document.createTextNode(
                        data.text || ""
                    )
                );

            }

            const meta =
                document.createElement("span");

            meta.className =
                "message-meta";

            const time =
                document.createElement("span");

            time.className =
                "time";

            time.textContent =
                formatTime(
                    data.createdAt
                );

            meta.appendChild(time);

            const status =
                createStatus(data);

            if(status)
                meta.appendChild(status);

            box.appendChild(meta);

            if(data.type !== "call"){

                addMessageActions(
                    box,
                    id,
                    data.senderId ===
                    currentUser.uid
                );

            }

            const old =
                elements.get(id);

            if(old){

                old.replaceWith(box);

            }

            elements.set(id,box);

            if(!old){

                messages.appendChild(box);

            }

        }
    );

    const all =
        messages.querySelectorAll(
            ".message"
        );

    let empty =
        messages.querySelector(
            ".empty"
        );

    if(all.length === 0){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.innerHTML =
                "💬<br>ابدأ المحادثة الآن";

            messages.appendChild(empty);

        }

    }else{

        empty?.remove();

    }

    if(nearBottom){

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }

}


function listenMessages(){

    const ref =
        collection(
            db,
            "chats",
            chatID,
            "messages"
        );

    const q =
        query(
            ref,
            orderBy(
                "createdAt",
                "asc"
            )
        );

    unsubscribeMessages =
        onSnapshot(
            q,
            renderMessages,
            error =>
                console.error(
                    error
                )
        );

}

============================================================ */

voiceButton.addEventListener(
    "click",
    async () => {

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            alert(
                "المتصفح لا يدعم التسجيل الصوتي"
            );

            return;

        }

        if(mediaRecorder){

            mediaRecorder.stop();

            return;

        }

        try{

            const stream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio:true
                    });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(stream);

            mediaRecorder.ondataavailable =
                e => {

                    if(e.data.size > 0){

                        audioChunks.push(
                            e.data
                        );

                    }

                };

            mediaRecorder.onstop =
                async () => {

                    stream
                        .getTracks()
                        .forEach(
                            t => t.stop()
                        );

                    voiceButton
                        .classList
                        .remove(
                            "recording"
                        );

                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                    mediaRecorder.mimeType ||
                                    "audio/webm"
                            }
                        );

                    /*
                       بدون Firebase Storage لا يمكن
                       تخزين ملف صوتي دائمًا داخل Firestore
                       بشكل عملي.

                       لذلك نحاول إرسال التسجيل كـ
                       Data URL إذا كان صغيرًا.
                    */

                    const reader =
                        new FileReader();

                    reader.onload =
                        async () => {

                            const audio =
                                reader.result;

                            if(
                                audio.length >
                                900000
                            ){

                                alert(
                                    "التسجيل طويل جدًا، حاول تسجيل مقطع أقصر."
                                );

                                return;

                            }

                            try{

                                await addDoc(

                                    collection(
                                        db,
                                        "chats",
                                        chatID,
                                        "messages"
                                    ),

                                    {
                                        audio,

                                        senderId:
                                            currentUser.uid,

                                        receiverId:
                                            friendUser.uid,

                                        type:
                                            "voice",

                                        read:false,

                                        createdAt:
                                            serverTimestamp()

                                    }

                                );

                            }catch(error){

                                console.error(
                                    error
                                );

                                alert(
                                    "تعذر إرسال التسجيل"
                                );

                            }

                        };

                    reader.readAsDataURL(blob);

                    mediaRecorder =
                        null;

                };

            mediaRecorder.start();

            voiceButton
                .classList
                .add(
                    "recording"
                );

        }catch(error){

            console.error(error);

            alert(
                "يجب السماح باستخدام الميكروفون"
            );

        }

    }
);


/* ============================================================
   إنشاء اتصال WebRTC
============================================================ */

function createPeer(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    pc.onicecandidate =
        async event => {

            if(
                !event.candidate ||
                !activeCallId
            ) return;

            try{

                await addDoc(

                    collection(
                        db,
                        "calls",
                        activeCallId,
                        "candidates"
                    ),

                    {
                        senderId:
                            currentUser.uid,

                        candidate:
                            event.candidate.toJSON()

                    }

                );

            }catch(error){

                console.error(
                    "ICE:",
                    error
                );

            }

        };

    pc.ontrack =
        event => {

            if(event.streams[0]){

                remoteVideo.srcObject =
                    event.streams[0];

            }

        };

    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;

            if(
                state === "connected"
            ){

                callState.textContent =
                    "متصل";

                startCallTimer();

            }

            if(
                state === "failed" ||
                state === "disconnected"
            ){

                callState.textContent =
                    "انقطع الاتصال";

            }

        };

    return pc;

}

async function startCall(
    type
){

    if(!currentUser || !friendUser){

        alert(
            "تعذر بدء المكالمة"
        );

        return;

    }

    activeCallType =
        type;

    activeCallId =
        crypto.randomUUID();

    showCallOverlay(
        type
    );

    callState.textContent =
        "جارٍ الاتصال...";

    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        type === "video"

                });

        if(type === "video"){

            localVideo.srcObject =
                localStream;

            videoArea.style.display =
                "block";

            cameraButton.style.display =
                "block";

        }

        peerConnection =
            createPeer();

        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );

        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );

        await setDoc(
            callRef,
            {

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callType:type,

                status:"ringing",

                createdAt:
                    serverTimestamp()

            }
        );

        const offer =
            await peerConnection
                .createOffer();

        await peerConnection
            .setLocalDescription(
                offer
            );

        await updateDoc(
            callRef,
            {
                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }
            }
        );

        listenCallAsCaller();

    }catch(error){

        console.error(error);

        alert(
            "تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
        );

        await endCall();

    }

}


/* ============================================================
   متابعة المكالمة للطرف المتصل
============================================================ */

function listenCallAsCaller(){

    const callRef =
        doc(
            db,
            "calls",
            activeCallId
        );

    onSnapshot(
        callRef,
        async snap => {

            if(!snap.exists())
                return;

            const data =
                snap.data();

            if(
                data.answer &&
                peerConnection &&
                !peerConnection.currentRemoteDescription
            ){

                try{

                    await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                data.answer
                            )
                        );

                }catch(error){

                    console.error(error);

                }

            }

            if(
                data.status === "ended"
            ){

                cleanupCall();

            }

        }
    );

    onSnapshot(

        collection(
            db,
            "calls",
            activeCallId,
            "candidates"
        ),

        snap => {

            snap.docChanges()
                .forEach(
                    change => {

                        if(
                            change.type !==
                            "added"
                        ) return;

                        const data =
                            change.doc.data();

                        if(
                            data.senderId ===
                            currentUser.uid
                        ) return;

                        if(
                            peerConnection &&
                            data.candidate
                        ){

                            peerConnection
                                .addIceCandidate(
                                    new RTCIceCandidate(
                                        data.candidate
                                    )
                                )
                                .catch(
                                    console.error
                                );

                        }

                    }
                );

        }

    );

}

let incomingCallUnsubscribe =
    null;


function listenIncomingCalls(){

    if(!currentUser)
        return;

    const callsRef =
        collection(
            db,
            "calls"
        );

    /*
       يتم الاستماع للمكالمات الجديدة.
       إذا كانت قواعد Firestore تمنع هذا الاستعلام،
       يمكن بدلاً منه إنشاء collection خاصة بالمستخدم.
    */

    incomingCallUnsubscribe =
        onSnapshot(

            query(
                callsRef,
                orderBy(
                    "createdAt",
                    "desc"
                )
            ),

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                            return;

                            const data =
                                change.doc.data();

                            if(
                                data.receiverId !==
                                currentUser.uid
                            )
                            return;

                            if(
                                data.status !==
                                "ringing"
                            )
                            return;

                            if(
                                activeCallId
                            )
                            return;

                            activeCallId =
                                change.doc.id;

                            showIncomingCall(
                                data
                            );

                        }
                    );

            },

            error => {

                console.error(
                    "Incoming call:",
                    error
                );

            }

        );

}

        document.getElementById(

        );

    accept?.remove();

    try{

        const callRef =
            doc(
                db,
                "calls",
                activeCallId

            await getDoc(callRef);

        if(!snap.exists()){

            throw new Error(

            );

                        localStream
                    )
            );

        );

}

   واجهة المكالمة
============================================================ */

function showCallOverlay(type){

    callOverlay.style.display =
        "flex";

    callName.textContent =
        friendUser?.name ||
        "مكالمة";

    callState.textContent =
        type === "video"
        ? "مكالمة فيديو"
        : "مكالمة صوتية";

    if(type === "video"){

        videoArea.style.display =
            "block";

        cameraButton.style.display =
            "block";

    }else{

        videoArea.style.display =
            "none";

        cameraButton.style.display =
            "none";

    }

}


function startCallTimer(){

    if(callTimer)
        return;

    callSeconds = 0;

    callTimer =
        setInterval(
            () => {

                callSeconds++;

                callState.textContent =
                    "متصل • " +
                    formatDuration(
                        callSeconds
                    );

            },
            1000
        );

}


function stopCallTimer(){

    clearInterval(
        callTimer
    );

    callTimer =
        null;

}


async function endCall(){

    try{

        if(activeCallId){

            await updateDoc(

                doc(
                    db,
                    "calls",
                    activeCallId
                ),

                {
                    status:
                        "ended",

                    duration:
                        callSeconds,

                    endedAt:
                        serverTimestamp()
                }

            );

        }

    }catch(error){

        console.error(error);

    }

    cleanupCall();

}


function cleanupCall(){

    stopCallTimer();

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }

    localStream =
        null;

    if(peerConnection){

        peerConnection.close();

    }

    peerConnection =
        null;

    remoteVideo.srcObject =
        null;

    localVideo.srcObject =
        null;

    activeCallId =
        null;

    activeCallType =
        null;

    callOverlay.style.display =
        "none";

    const accept =
        document.getElementById(
            "acceptCallButton"
        );

    accept?.remove();

}

window.addEventListener(
    "pagehide",
    () => {

        if(currentUser){

            updateMyPresence(false);

            updateTyping(false);

        }

    }
);


/* ============================================================
   التشغيل
============================================================ */

function init(){

    onAuthStateChanged(
        auth,
        async user => {

            if(!user){

                loading.textContent =
                    "يجب تسجيل الدخول أولاً";

                return;

            }

            currentUser =
                user;

            window.chatUser =
                user;

            try{

                startPresence();

                await loadFriend();

                listenMessages();

                /*
                   مراقبة المكالمات الواردة
                */
                listenIncomingCalls();

                showApp();

            }catch(error){

                stopPresence();

                showError(error);

            }

        }
    );

}


init();

</script>

</html>
