<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#123d35,transparent 40%),
        linear-gradient(180deg,#07110f,#020504);
    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    height:100vh;
    max-width:650px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    background:#050807;
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
}

.back{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:#18231f;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:16px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:24px;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

.user-status.online{
    color:#00e889;
}

.user-status.typing{
    color:#00e889;
    font-weight:bold;
}

.call-buttons{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.call-buttons button{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#18231f;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.call-buttons button:active{
    transform:scale(.94);
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:20px 15px 150px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#72817c;
}

.message{
    max-width:78%;
    padding:12px 15px;
    border-radius:18px;
    position:relative;
    word-break:break-word;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.message.mine{
    align-self:flex-start;
    background:#00c96b;
    color:#00150e;
    border-bottom-left-radius:5px;
}

.message.other{
    align-self:flex-end;
    background:#18231f;
    border:1px solid rgba(255,255,255,.08);
    border-bottom-right-radius:5px;
}

.time{
    display:inline-block;
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:5px;
    margin-top:5px;
}

.message-status{
    font-size:12px;
    line-height:1;
    font-weight:bold;
    letter-spacing:-3px;
    direction:ltr;
    display:inline-block;
    min-width:16px;
}

.message-status.sent{
    opacity:.65;
}

.message-status.read{
    color:#006dff;
    opacity:1;
}

.input-area{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:650px;
    padding:10px;
    display:flex;
    gap:8px;
    background:#050807;
    z-index:50;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:14px;
    border-radius:17px;
    border:1px solid #27332f;
    background:#111916;
    color:white;
    outline:none;
    font-size:15px;
}

#messageInput:focus{
    border-color:#00e889;
}

#voiceButton,
#sendButton{
    width:50px;
    height:50px;
    border:0;
    border-radius:16px;
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
}

#voiceButton{
    background:#18231f;
    color:white;
}

#voiceButton.recording{
    background:#d83b3b;
}

#sendButton{
    background:#00e889;
    color:#00150e;
}

#sendButton:disabled{
    opacity:.6;
}

/* ================================
   الرسائل الصوتية
================================ */

.voice-message{
    min-width:220px;
}

.voice-message audio{
    width:100%;
    max-width:260px;
}

/* ================================
   قائمة الرسالة
================================ */

.message-menu{
    position:absolute;
    left:50%;
    bottom:calc(100% + 8px);
    transform:translateX(-50%);
    min-width:150px;
    padding:5px;
    background:#0b1512;
    border:1px solid rgba(0,232,137,.18);
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.55);
    z-index:99999;
}

.message-menu button{
    width:100%;
    padding:10px 14px;
    border:0;
    border-radius:11px;
    background:#18231f;
    color:white;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

/* ================================
   رسالة المكالمة
================================ */

.call-message{
    min-width:245px;
    max-width:310px;
    padding:10px 12px !important;
}

.call-box{
    display:flex;
    align-items:center;
    gap:11px;
}

.call-icon{
    width:46px;
    height:46px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,232,137,.14);
    color:#00e889;
    font-size:22px;
    flex-shrink:0;
}

.call-info{
    min-width:0;
    flex:1;
}

.call-title{
    font-size:14px;
    font-weight:bold;
}

.call-subtitle{
    font-size:11px;
    opacity:.65;
    margin-top:4px;
}

.call-duration{
    font-size:11px;
    margin-top:4px;
    opacity:.75;
}

/* ================================
   شاشة المكالمة
================================ */

#callOverlay{
    position:fixed;
    inset:0;
    background:#020504;
    z-index:100000;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.call-card{
    width:min(430px,100%);
    background:#0b1512;
    border:1px solid rgba(0,232,137,.18);
    border-radius:28px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

.call-avatar{
    width:100px;
    height:100px;
    margin:0 auto 15px;
    border-radius:28px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:42px;
    cursor:pointer;
}

.call-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#callName{
    font-size:21px;
    font-weight:bold;
}

#callState{
    color:#00e889;
    font-size:13px;
    margin-top:8px;
    min-height:18px;
}

.call-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
}

.call-actions button{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    font-size:23px;
    cursor:pointer;
    background:#18231f;
    color:white;
}

.call-actions button:active{
    transform:scale(.93);
}

.call-actions .accept{
    background:#00e889;
    color:#00150e;
}

.call-actions .reject,
.call-actions .end{
    background:#d83b3b;
    color:white;
}

.call-actions .muted{
    background:#36413d;
}

.call-actions .camera-off{
    background:#36413d;
}

/* ================================
   الفيديو
================================ */

#videoArea{
    width:100%;
    height:390px;
    display:none;
    position:relative;
    margin-top:18px;
    border-radius:22px;
    overflow:hidden;
    background:#000;
    border:1px solid rgba(255,255,255,.08);
}

#remoteVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    z-index:1;
}

#localVideo{
    position:absolute;
    width:105px;
    height:145px;
    left:12px;
    bottom:12px;
    object-fit:cover;
    border-radius:16px;
    border:2px solid #00e889;
    background:#000;
    z-index:3;
    cursor:pointer;
    transition:
        width .25s,
        height .25s,
        inset .25s,
        left .25s,
        top .25s,
        bottom .25s;
}

/* عند التبديل:
   أنا كبير والطرف الثاني صغير
*/
#videoArea.swap #localVideo{
    inset:0;
    width:100%;
    height:100%;
    border:0;
    border-radius:0;
    z-index:1;
}

#videoArea.swap #remoteVideo{
    width:105px;
    height:145px;
    left:12px;
    right:auto;
    top:auto;
    bottom:12px;
    border-radius:16px;
    border:2px solid #00e889;
    z-index:3;
    cursor:pointer;
}

/* طبقة اسم الطرف الآخر إذا لم توجد صورة */
.video-name{
    position:absolute;
    top:15px;
    right:15px;
    z-index:5;
    padding:7px 11px;
    background:rgba(0,0,0,.45);
    border-radius:12px;
    font-size:12px;
    pointer-events:none;
}

@media(max-width:500px){

    .message{
        max-width:84%;
    }

    header{
        padding:12px;
    }

    .call-buttons button{
        width:40px;
        height:40px;
    }

    .call-message{
        min-width:225px;
        max-width:85%;
    }

    .call-card{
        padding:20px 14px;
    }

    #videoArea{
        height:430px;
    }

    #localVideo,
    #videoArea.swap #remoteVideo{
        width:92px;
        height:130px;
    }

}

</style>
</head>

<script type="module">

/* ============================================================
   Firebase
============================================================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    deleteDoc,
    collection,
    query,
    where,
    orderBy,
    onSnapshot,
    addDoc,
    arrayUnion,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

    authDomain:
        "mecd-tools.firebaseapp.com",

    projectId:
        "mecd-tools",

    storageBucket:
        "mecd-tools.firebasestorage.app",

    messagingSenderId:
        "643005547408",

    appId:
        "1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getFirestore(firebaseApp);


/* ============================================================
   العناصر
============================================================ */

const $ =
    id => document.getElementById(id);

const loading =
    $("loading");

const app =
    $("app");

const messages =
    $("messages");

const messageInput =
    $("messageInput");

const sendButton =
    $("sendButton");

const voiceButton =
    $("voiceButton");

const friendName =
    $("friendName");

const friendAvatar =
    $("friendAvatar");

const friendStatus =
    $("friendStatus");

const backButton =
    $("backButton");

const callButton =
    $("callButton");

const videoButton =
    $("videoButton");

const callOverlay =
    $("callOverlay");

const callAvatar =
    $("callAvatar");

const callName =
    $("callName");

const callState =
    $("callState");

const videoArea =
    $("videoArea");

const remoteVideo =
    $("remoteVideo");

const localVideo =
    $("localVideo");

const videoName =
    $("videoName");

const muteButton =
    $("muteButton");

const remoteMuteButton =
    $("remoteMuteButton");

const cameraButton =
    $("cameraButton");

const flipCameraButton =
    $("flipCameraButton");

const endCallButton =
    $("endCallButton");

const acceptCallButton =
    $("acceptCallButton");

const rejectCallButton =
    $("rejectCallButton");


/* ============================================================
   متغيرات عامة
============================================================ */

let currentUser =
    null;

let friendUser =
    null;

let chatID =
    null;

let unsubscribeMessages =
    null;

let unsubscribeFriendStatus =
    null;

let unsubscribeFriendTyping =
    null;

let incomingCallUnsubscribe =
    null;

let activeCallUnsubscribe =
    null;

let activeCandidatesUnsubscribe =
    null;

let presenceInterval =
    null;

let typingTimer =
    null;

let typingState =
    false;

let localStream =
    null;

let peerConnection =
    null;

let activeCallId =
    null;

let activeCallType =
    null;

let activeCallRole =
    null;

let callTimer =
    null;

let callSeconds =
    0;

let callConnected =
    false;

let remoteMuted =
    false;

let currentFacingMode =
    "user";

let pendingIncomingData =
    null;

let callEnding =
    false;


/* ============================================================
   WebRTC
============================================================ */

const rtcConfig = {

    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"
        },
        {
            urls:
                "stun:stun1.l.google.com:19302"
        }
    ]

};


/* ============================================================
   Firebase variables للـ voice.js
============================================================ */

window.chatDB =
    db;


/* ============================================================
   أدوات
============================================================ */

function createChatID(a,b){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(
            /[&<>'"]/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"
            }[c])
        );

}


function showApp(){

    loading.style.display =
        "none";

    app.style.display =
        "flex";

}


function showError(error){

    console.error(error);

    loading.innerHTML = `
        <div style="
            text-align:center;
            padding:25px;
        ">
            ⚠️ تعذر فتح الدردشة
            <br>
            <small style="color:#777">
                ${escapeHtml(
                    error?.message ||
                    "حدث خطأ"
                )}
            </small>
        </div>
    `;

}


function formatDuration(seconds){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds || 0)
            )
        );

    const m =
        Math.floor(
            seconds / 60
        );

    const s =
        seconds % 60;

    return (
        String(m).padStart(2,"0")
        +
        ":"
        +
        String(s).padStart(2,"0")
    );

}


function formatTime(timestamp){

    if(!timestamp?.toDate)
        return "";

    return timestamp
        .toDate()
        .toLocaleTimeString(
            "ar",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


/* ============================================================
   الصور
============================================================ */

function setAvatar(element,photo){

    if(
        photo &&
        typeof photo === "string"
    ){

        element.innerHTML =
            "";

        const img =
            document.createElement("img");

        img.src =
            photo;

        img.alt =
            "";

        img.onerror =
            () => {

                element.innerHTML =
                    "👤";

            };

        element.appendChild(img);

    }else{

        element.innerHTML =
            "👤";

    }

}


/* ============================================================
   Presence
============================================================ */

async function updateMyPresence(
    online = true
){

    if(!currentUser)
        return;

    try{

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {
                online,
                lastSeen:
                    serverTimestamp()
            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Presence:",
            error
        );

    }

}


function startPresence(){

    updateMyPresence(true);

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        setInterval(
            () => {

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    updateMyPresence(true);

                }

            },
            10000
        );

}


function stopPresence(){

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        null;

    updateMyPresence(false);

}


/* ============================================================
   تحميل الصديق
============================================================ */

async function loadFriend(){

    const params =
        new URLSearchParams(
            location.search
        );

    const id =
        params.get("friend");

    if(!id){

        throw new Error(
            "لا يوجد صديق في الرابط"
        );

    }

    if(
        currentUser.uid === id
    ){

        throw new Error(
            "لا يمكنك فتح محادثة مع نفسك"
        );

    }

    const userDoc =
        await getDoc(
            doc(
                db,
                "users",
                id
            )
        );

    if(!userDoc.exists()){

        throw new Error(
            "المستخدم غير موجود"
        );

    }

    const data =
        userDoc.data();

    friendUser = {

        uid:id,

        name:
            data.name ||
            "مستخدم Mecd",

        photo:
            data.photo ||
            ""

    };

    friendName.textContent =
        friendUser.name;

    callName.textContent =
        friendUser.name;

    videoName.textContent =
        friendUser.name;

    setAvatar(
        friendAvatar,
        friendUser.photo
    );

    setAvatar(
        callAvatar,
        friendUser.photo
    );

    chatID =
        createChatID(
            currentUser.uid,
            friendUser.uid
        );

    window.chatID =
        chatID;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friendUser;

    await setDoc(

        doc(
            db,
            "chats",
            chatID
        ),

        {
            members:[
                currentUser.uid,
                friendUser.uid
            ],

            updatedAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );

    listenFriendStatus();

    listenFriendTyping();

}


/* ============================================================
   حالة الصديق
============================================================ */

function listenFriendStatus(){

    if(!friendUser)
        return;

    if(unsubscribeFriendStatus){

        unsubscribeFriendStatus();

    }

    unsubscribeFriendStatus =
        onSnapshot(

            doc(
                db,
                "users",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    setFriendOffline();

                    return;

                }

                const data =
                    snap.data();

                const last =
                    data.lastSeen
                    ?.toMillis?.() || 0;

                const online =
                    data.online === true &&
                    last > 0 &&
                    Date.now() - last < 30000;

                if(
                    !friendStatus
                        .classList
                        .contains("typing")
                ){

                    friendStatus.textContent =
                        online
                        ? "● متصل"
                        : "● غير متصل";

                    friendStatus.classList.toggle(
                        "online",
                        online
                    );

                }

            }

        );

}


function setFriendOffline(){

    friendStatus.textContent =
        "● غير متصل";

    friendStatus.classList.remove(
        "online"
    );

}

function listenFriendTyping(){

    if(!friendUser)
        return;

    if(unsubscribeFriendTyping){

        unsubscribeFriendTyping();

    }

    unsubscribeFriendTyping =
        onSnapshot(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    setTypingUI(false);

                    return;

                }

                const data =
                    snap.data();

                const time =
                    data.updatedAt
                    ?.toMillis?.() || 0;

                const typing =
                    data.typing === true &&
                    (
                        !time ||
                        Date.now() - time < 5000
                    );

                setTypingUI(typing);

            }

        );

}


function setTypingUI(typing){

    if(typing){

        friendStatus.textContent =
            "يكتب...";

        friendStatus.classList.add(
            "typing"
        );

        friendStatus.classList.remove(
            "online"
        );

    }else{

        friendStatus.classList.remove(
            "typing"
        );

        listenFriendStatus();

    }

}


async function updateTyping(typing){

    if(
        !currentUser ||
        !chatID
    )
        return;

    if(
        typingState === typing

        return;

    typingState =
        typing;

    try{

        await setDoc(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                currentUser.uid
            ),

            {
                typing,
                updatedAt:
                    serverTimestamp()
            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Typing:",
            error
        );

    }

}


messageInput.addEventListener(
    "input",
    () => {

        const hasText =
            messageInput.value
                .trim()
                .length > 0;

        if(!hasText){

            clearTimeout(
                typingTimer
            );

            updateTyping(false);

function createCallMessage(
    box,
    data
){

    box.classList.add(
        "call-message"
    );

    const callBox =
        document.createElement("div");

    callBox.className =
        "call-box";

    const icon =
        document.createElement("div");

    icon.className =
        "call-icon";

    icon.textContent =
        data.callType === "video"
        ? "📹"
        : "📞";

    const info =
        document.createElement("div");

    info.className =
        "call-info";

    const title =
        document.createElement("div");

    title.className =
        "call-title";

    const incoming =
        data.callerId !==
        currentUser.uid;

    let titleText =
        "";

    if(
        data.callStatus ===
        "missed"
    ){

        titleText =
            "مكالمة لم يتم الرد عليها";

    }else if(
        data.callStatus ===
        "rejected"
    ){

        titleText =
            "مكالمة مرفوضة";

    }else if(
        data.callStatus ===
        "cancelled"
    ){

        titleText =
            "مكالمة ملغاة";

    }else{

        titleText =
            incoming
            ? "مكالمة واردة"
            : "مكالمة صادرة";

    }

    title.textContent =
        titleText;

    const subtitle =
        document.createElement("div");

    subtitle.className =
        "call-subtitle";

    subtitle.textContent =
        data.callType === "video"
        ? "مكالمة فيديو"
        : "مكالمة صوتية";

    const duration =
        document.createElement("div");

    duration.className =
        "call-duration";

    duration.textContent =
        "⏱️ " +
        formatDuration(
            data.duration || 0
        );

    info.appendChild(title);
    info.appendChild(subtitle);
    info.appendChild(duration);

    callBox.appendChild(icon);
    callBox.appendChild(info);

    box.appendChild(callBox);

}

function removeMenus(){

    document
        .querySelectorAll(
            ".message-menu"
        )
        .forEach(
            x => x.remove()
        );

}


document.addEventListener(
    "pointerdown",
    event => {

        if(
            !event.target.closest(
                ".message-menu"
            )
        ){

            removeMenus();

        }

    }
);


function addMessageActions(
    element,
    id,
    mine
){

    let timer =
        null;

    const cancel = () => {

        clearTimeout(timer);

        timer =
            null;

    };

    const showMenu =
        () => {

            removeMenus();

            const menu =
                document.createElement(
                    "div"
                );

            menu.className =
                "message-menu";

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                mine
                ? "🗑️ إلغاء الإرسال"
                : "🗑️ حذف لدي";

            button.onclick =
                async event => {

                    event.stopPropagation();

                    try{

                        const ref =
                            doc(
                                db,
                                "chats",
                                chatID,
                                "messages",
                                id
                            );

                        if(mine){

                            await deleteDoc(
                                ref
                            );

                        }else{

                            await updateDoc(
                                ref,
                                {
                                    deletedFor:
                                        arrayUnion(
                                            currentUser.uid
                                        )
                                }
                            );

                        }

                        removeMenus();

                    }catch(error){

                        console.error(error);

                        alert(
                            "حدث خطأ أثناء حذف الرسالة"
                        );

                    }

                };

            menu.appendChild(
                button
            );

            element.appendChild(
                menu
            );

        };

    element.addEventListener(
        "pointerdown",
        event => {

            if(
                event.target.closest(
                    ".message-menu"
                )
            )
                return;

            cancel();

            timer =
                setTimeout(
                    showMenu,
                    500
                );

        }
    );

    element.addEventListener(
        "pointerup",
        cancel
    );

    element.addEventListener(
        "pointercancel",
        cancel
    );

    element.addEventListener(
        "pointerleave",
        cancel
    );

    element.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            showMenu();

        }
    );

}


/* ============================================================
   عرض الرسائل
============================================================ */

function renderMessages(snap){

    if(!renderMessages.elements){

        renderMessages.elements =
            new Map();

    }

    const elements =
        renderMessages.elements;

    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight < 120;

    snap.docChanges().forEach(
        change => {

            const id =
                change.doc.id;

            const data =
                change.doc.data();

            if(
                change.type ===
                "removed"
            ){

                const old =
                    elements.get(id);

                if(old){

                    old.remove();

                    elements.delete(id);

                }

                return;

            }

            if(
                Array.isArray(
                    data.deletedFor
                ) &&
                data.deletedFor.includes(
                    currentUser.uid
                )
            ){

                const old =
                    elements.get(id);

                if(old){

                    old.remove();

                    elements.delete(id);

                }

                return;

            }

            if(
                data.senderId !==
                currentUser.uid
            ){

                markRead(
                    id,
                    data
                );

            }

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "message " +
                (
                    data.senderId ===
                    currentUser.uid
                    ? "mine"
                    : "other"
                );

            if(
                data.type ===
                "call"
            ){

                createCallMessage(
                    box,
                    data
                );

            }else if(
                data.type ===
                "voice"
            ){

                box.classList.add(
                    "voice-message"
                );

                const audio =
                    document.createElement(
                        "audio"
                    );

                audio.controls =
                    true;

                audio.preload =
                    "metadata";

                audio.src =
                    data.audio ||
                    "";

                box.appendChild(
                    audio
                );

            }else{

                box.appendChild(
                    document.createTextNode(
                        data.text || ""
                    )
                );

            }

            const meta =
                document.createElement(
                    "span"
                );

            meta.className =
                "message-meta";

            const time =
                document.createElement(
                    "span"
                );

            time.className =
                "time";

            time.textContent =
                formatTime(
                    data.createdAt
                );

            meta.appendChild(
                time
            );

            const status =
                createStatus(
                    data
                );

            if(status){

                meta.appendChild(
                    status
                );

            }

            box.appendChild(
                meta
            );

            if(
                data.type !==
                "call"
            ){

                addMessageActions(
                    box,
                    id,
                    data.senderId ===
                    currentUser.uid
                );

            }

            const old =
                elements.get(id);

            if(old){

                old.replaceWith(
                    box
                );

            }else{

                messages.appendChild(
                    box
                );

            }

            elements.set(
                id,
                box
            );

        }
    );

    const all =
        messages.querySelectorAll(
            ".message"
        );

    let empty =
        messages.querySelector(
            ".empty"
        );

    if(all.length === 0){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.innerHTML =
                "💬<br>ابدأ المحادثة الآن";

            messages.appendChild(
                empty
            );

        }

    }else{

        empty?.remove();

    }

    if(nearBottom){

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }

}

/* ============================================================
   WebRTC: إنشاء Peer
============================================================ */

function createPeer(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    pc.onicecandidate =
        async event => {

            if(
                !event.candidate ||
                !activeCallId ||
                !currentUser
            )
                return;

            try{

                await addDoc(

                    collection(
                        db,
                        "calls",
                        activeCallId,
                        "candidates"
                    ),

                    {
                        senderId:
                            currentUser.uid,

                        candidate:
                            event.candidate
                                .toJSON()

                    }

                );

            }catch(error){

                console.error(
                    "ICE:",
                    error
                );

            }

        };


    pc.ontrack =
        event => {

            if(
                event.streams &&
                event.streams[0]
            ){

                const stream =
                    event.streams[0];

                remoteVideo.srcObject =
                    stream;

                remoteVideo.muted =
                    remoteMuted;

                remoteVideo
                    .play()
                    .catch(
                        () => {}
                    );

            }

        };


    pc.onconnectionstatechange =
        async () => {

            const state =
                pc.connectionState;

            console.log(
                "WebRTC:",
                state
            );

            if(
                state ===
                "connected"
            ){

                if(!callConnected){

                    callConnected =
                        true;

                    callState.textContent =
                        "متصل";

                    startCallTimer();

                    await updateCallStatus(
                        "connected"
                    );

                }

            }else if(
                state ===
                "failed"
            ){

                callState.textContent =
                    "تعذر الاتصال";

            }else if(
                state ===
                "disconnected"
            ){

                /*
                   لا ننهي فورًا بسبب انقطاع
                   الشبكة المؤقت.
                */

                callState.textContent =
                    "إعادة الاتصال...";

                setTimeout(
                    () => {

                        if(
                            peerConnection === pc &&
                            pc.connectionState ===
                            "disconnected"
                        ){

                            finishCallLocally();

                        }

                    },
                    4000
                );

            }

        };


    return pc;

}


/* ============================================================
   مراقبة وثيقة المكالمة
============================================================ */

function listenActiveCall(){

    if(
        !activeCallId
    )
        return;

    if(activeCallUnsubscribe){

        activeCallUnsubscribe();

    }

    if(activeCandidatesUnsubscribe){

        activeCandidatesUnsubscribe();

    }

    const callRef =
        doc(
            db,
            "calls",
            activeCallId
        );

    activeCallUnsubscribe =
        onSnapshot(
            callRef,
            async snap => {

                if(!snap.exists()){

                    finishCallLocally();

                    return;

                }

                const data =
                    snap.data();

                /*
                   المتصل:
                   عندما يصل الطلب للطرف الثاني
                   نغير جار الاتصال -> يرن
                */

                if(
                    activeCallRole ===
                    "caller"
                ){

                    if(
                        data.status ===
                        "ringing"
                    ){

                        callState.textContent =
                            "يرن";

                    }

                    if(
                        data.status ===
                        "rejected"
                    ){

                        callState.textContent =
                            "تم رفض المكالمة";

                        setTimeout(
                            () => {
                                finishCallLocally();
                            },
                            700
                        );

                        return;

                    }

                    if(
                        data.status ===
                        "cancelled"
                    ){

                        finishCallLocally();

                        return;

                    }

                    if(
                        data.status ===
                        "ended"
                    ){

                        finishCallLocally();

                        return;

                    }

                    if(
                        data.answer &&
                        peerConnection &&
                        !peerConnection
                            .currentRemoteDescription
                    ){

                        try{

                            await peerConnection
                                .setRemoteDescription(
                                    new RTCSessionDescription(
                                        data.answer
                                    )
                                );

                        }catch(error){

                            console.error(
                                "Remote answer:",
                                error
                            );

                        }

                    }

                }


                /*
                   الطرف المستقبل
                */

                if(
                    activeCallRole ===
                    "receiver"
                ){

                    if(
                        data.status ===
                        "cancelled"
                    ){

                        finishCallLocally();

                        return;

                    }

                    if(
                        data.status ===
                        "ended"
                    ){

                        finishCallLocally();

                        return;

                    }

                }

            },

            error => {

                console.error(
                    "Call listener:",
                    error
                );

            }
        );


    activeCandidatesUnsubscribe =
        onSnapshot(

            collection(
                db,
                "calls",
                activeCallId,
                "candidates"
            ),

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;

                            const data =
                                change.doc.data();

                            if(
                                data.senderId ===
                                currentUser.uid
                            )
                                return;

                            if(
                                peerConnection &&
                                data.candidate
                            ){

                                peerConnection
                                    .addIceCandidate(
                                        new RTCIceCandidate(
                                            data.candidate
                                        )
                                    )
                                    .catch(
                                        error =>
                                            console.error(
                                                "ICE add:",
                                                error
                                            )
                                    );

                            }

                        }
                    );

            },

            error => {

                console.error(
                    "Candidates:",
                    error
                );

            }

        );

}


/* ============================================================
   بدء مكالمة
============================================================ */

async function startCall(type){

    if(
        !currentUser ||
        !friendUser
    ){

        alert(
            "تعذر بدء المكالمة"
        );

        return;

    }

    if(activeCallId){

        return;

    }

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        alert(
            "المتصفح لا يدعم المكالمات"
        );

        return;

    }

    activeCallType =
        type;

    activeCallRole =
        "caller";

    activeCallId =
        crypto.randomUUID();

    callConnected =
        false;

    callEnding =
        false;

    callSeconds =
        0;

    remoteMuted =
        false;

    showCallOverlay(
        type,
        "caller"
    );

    callState.textContent =
        "جارٍ الاتصال...";

    try{

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        type ===
                        "video"

                });

        if(
            type ===
            "video"
        ){

            setupVideoUI();

            localVideo.srcObject =
                localStream;

        }

        peerConnection =
            createPeer();

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        await setDoc(

            callRef,

            {

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callerName:
                    currentUser.displayName ||
                    currentUser.name ||
                    "مستخدم Mecd",

                callerPhoto:
                    currentUser.photoURL ||
                    currentUser.photo ||
                    "",

                receiverName:
                    friendUser.name,

                receiverPhoto:
                    friendUser.photo,

                callType:
                    type,

                status:
                    "ringing",

                createdAt:
                    serverTimestamp()

            }

        );


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(

            callRef,

            {

                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }

            }

        );


        /*
           يبدأ الاستماع بعد إنشاء المكالمة.
        */

        listenActiveCall();

    }catch(error){

        console.error(
            "Start call:",
            error
        );

        alert(
            "تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
        );

        await cancelCallByCaller();

    }

}


/* ============================================================
   المكالمات الواردة
============================================================ */

function listenIncomingCalls(){

    if(!currentUser)
        return;

    if(incomingCallUnsubscribe){

        incomingCallUnsubscribe();

    }

    /*
       مهم جدًا:
       لا نستمع لكل calls.

       نستمع فقط للمكالمات التي receiverId
       يساوي المستخدم الحالي.

       لذلك C لن يحصل على مكالمة A -> B
       من هذا الاستماع.
    */

    const callsRef =
        collection(
            db,
            "calls"
        );

    const q =
        query(
            callsRef,

            where(
                "receiverId",
                "==",
                currentUser.uid
            ),

            where(
                "status",
                "==",
                "ringing"
            )
        );


    incomingCallUnsubscribe =
        onSnapshot(

            q,

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;

                            const data =
                                change.doc.data();

                            /*
                               حماية إضافية
                            */

                            if(
                                data.receiverId !==
                                currentUser.uid
                            )
                                return;

                            if(
                                data.callerId ===
                                currentUser.uid
                            )
                                return;

                            if(
                                activeCallId
                            )
                                return;

                            showIncomingCall(
                                change.doc.id,
                                data
                            );

                        }
                    );

            },

            error => {

                console.error(
                    "Incoming calls:",
                    error
                );

            }

        );

}


/* ============================================================
   عرض الاتصال الوارد
============================================================ */

function showIncomingCall(
    callId,
    data
){

    if(activeCallId)
        return;

    activeCallId =
        callId;

    activeCallType =
        data.callType ||
        "audio";

    activeCallRole =
        "receiver";

    pendingIncomingData =
        data;

    callConnected =
        false;

    callSeconds =
        0;

    callEnding =
        false;

    /*
       نستخدم صورة المتصل الموجودة
       داخل وثيقة المكالمة.
    */

    callName.textContent =
        data.callerName ||
        "مكالمة واردة";

    videoName.textContent =
        data.callerName ||
        "مكالمة واردة";

    setAvatar(
        callAvatar,
        data.callerPhoto ||
        ""
    );

    showCallOverlay(
        activeCallType,
        "receiver"
    );

    callState.textContent =
        activeCallType ===
        "video"
        ? "📹 مكالمة فيديو واردة"
        : "📞 مكالمة صوتية واردة";


    acceptCallButton.style.display =
        "block";

    rejectCallButton.style.display =
        "block";

    muteButton.style.display =
        "none";

    remoteMuteButton.style.display =
        "none";

    cameraButton.style.display =
        "none";

    flipCameraButton.style.display =
        "none";

    endCallButton.style.display =
        "none";


    /*
       استمع للمكالمة من الآن
       حتى إذا ضغط المتصل إنهاء
       تختفي عند المستقبل.
    */

    listenActiveCall();

}


/* ============================================================
   قبول المكالمة
============================================================ */

async function acceptIncomingCall(){

    if(
        !activeCallId ||
        activeCallRole !==
        "receiver"
    )
        return;

    const callId =
        activeCallId;

    try{

        acceptCallButton.style.display =
            "none";

        rejectCallButton.style.display =
            "none";

        callState.textContent =
            "جارٍ الاتصال...";


        const callRef =
            doc(
                db,
                "calls",
                callId
            );

        const snap =
            await getDoc(
                callRef
            );

        if(!snap.exists()){

            throw new Error(
                "المكالمة غير موجودة"
            );

        }

        const data =
            snap.data();

        if(
            data.receiverId !==
            currentUser.uid
        ){

            throw new Error(
                "هذه المكالمة ليست لك"
            );

        }

        if(
            data.status !==
            "ringing"
        ){

            finishCallLocally();

            return;

        }

        activeCallType =
            data.callType ||
            "audio";


        /*
           نأخذ صورة المتصل من بيانات المكالمة.
        */

        setAvatar(
            callAvatar,
            data.callerPhoto ||
            ""
        );

        callName.textContent =
            data.callerName ||
            "مستخدم Mecd";


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        activeCallType ===
                        "video"

                });


        if(
            activeCallType ===
            "video"
        ){

            setupVideoUI();

            localVideo.srcObject =
                localStream;

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        await peerConnection
            .setRemoteDescription(

                new RTCSessionDescription(
                    data.offer
                )

            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(

            callRef,

            {

                answer:{
                    type:
                        answer.type,

                    sdp:
                        answer.sdp
                },

                status:
                    "connected",

                acceptedAt:
                    serverTimestamp()

            }

        );


        callState.textContent =
            "متصل";


        showConnectedButtons();


        startCallTimer();

    }catch(error){

        console.error(
            "Accept call:",
            error
        );

        alert(
            "تعذر قبول المكالمة"
        );

        await rejectIncomingCall();

    }

}


/* ============================================================
   رفض المكالمة
============================================================ */

async function rejectIncomingCall(){

    if(
        !activeCallId
    ){

        finishCallLocally();

        return;

    }

    const id =
        activeCallId;

    try{

        await updateDoc(

            doc(
                db,
                "calls",
                id
            ),

            {

                status:
                    "rejected",

                endedBy:
                    currentUser.uid,

                duration:
                    0,

                endedAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "Reject:",
            error
        );

    }


    await addCallMessageIfNeeded(
        id,
        "rejected",
        0
    );


    finishCallLocally();

}


/* ============================================================
   إلغاء المكالمة من المتصل
============================================================ */

async function cancelCallByCaller(){

    if(
        !activeCallId
    ){

        finishCallLocally();

        return;

    }

    const id =
        activeCallId;

    try{

        await updateDoc(

            doc(
                db,
                "calls",
                id
            ),

            {

                status:
                    "cancelled",

                endedBy:
                    currentUser.uid,

                duration:
                    0,

                endedAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "Cancel call:",
            error
        );

    }


    await addCallMessageIfNeeded(
        id,
        "cancelled",
        0
    );


    finishCallLocally();

}


/* ============================================================
   إنهاء مكالمة متصلة
============================================================ */

async function endActiveCall(){

    if(
        callEnding
    )
        return;

    callEnding =
        true;

    const id =
        activeCallId;

    const duration =
        callSeconds;

    try{

        if(id){

            await updateDoc(

                doc(
                    db,
                    "calls",
                    id
                ),

                {

                    status:
                        "ended",

                    endedBy:
                        currentUser.uid,

                    duration:
                        duration,

                    endedAt:
                        serverTimestamp()

                }

            );

        }

    }catch(error){

        console.error(
            "End call:",
            error
        );

    }


    await addCallMessageIfNeeded(
        id,
        "ended",
        duration
    );


    finishCallLocally();

}


/* ============================================================
   زر الإنهاء
============================================================ */

endCallButton.onclick =
    async () => {

        /*
           إذا كنت المتصل والمكالمة ما زالت
           جار الاتصال / يرن:
           يلغي الطلب عند الطرف الثاني.
        */

        if(
            activeCallRole ===
            "caller" &&
            !callConnected
        ){

            await cancelCallByCaller();

            return;

        }


        /*
           إذا كانت مكالمة متصلة
        */

        await endActiveCall();

    };


/* ============================================================
   إظهار أزرار الاتصال المتصل
============================================================ */

    endCallButton.style.display =

    ){

/* ============================================================
   واجهة المكالمة
============================================================ */

function showCallOverlay(
    type,
    role
){

    callOverlay.style.display =
        "flex";

    callName.textContent =

    videoName.textContent =

       الصورة الافتراضية للطرف

    */

            "none";

        flipCameraButton.style.display =
            "none";

        endCallButton.style.display =
            "none";

    }

}


/* ============================================================
   مؤقت المكالمة
============================================================ */

function startCallTimer(){

    if(callTimer)
        return;

    callSeconds =
        0;

    callTimer =
        setInterval(
            () => {

                callSeconds++;

                callState.textContent =
                    "متصل • " +
                    formatDuration(
                        callSeconds
                    );

            },
            1000
        );

}


function stopCallTimer(){

    if(callTimer){

        clearInterval(
            callTimer
        );

    }

    callTimer =
        null;

}


/* ============================================================
   رسالة سجل المكالمة
============================================================ */

async function addCallMessageIfNeeded(
    callId,
    status,
    duration
){

    if(!callId)
        return;

    /*
       لا نرسل الرسالة مرتين بسهولة:
       نستخدم ID ثابت مبني على callId.
    */

    try{

        const messageRef =
            doc(
                db,
                "chats",
                chatID,
                "messages",
                "call_" + callId
            );

        const titleData = {

            type:
                "call",

            callType:
                activeCallType ||
                "audio",

            callStatus:
                status,

            duration:
                duration || 0,

            callerId:
                currentUser.uid,

            receiverId:
                friendUser.uid,

            createdAt:
                serverTimestamp()

        };

        await setDoc(
            messageRef,
            titleData,
            {
                merge:true
            }
        );

    }catch(error){

        console.error(
            "Call message:",
            error
        );

    }

}


/* ============================================================
   تحديث حالة المكالمة
============================================================ */

async function updateCallStatus(
    status
){

    if(!activeCallId)
        return;

    try{

        await updateDoc(

            doc(
                db,
                "calls",
                activeCallId
            ),

            {
                status
            }

        );

    }catch(error){

        console.error(
            "Call status:",
            error
        );

    }

}


/* ============================================================
   كتم صوتي
============================================================ */

muteButton.onclick =
    () => {

        if(!localStream)
            return;

        const track =
            localStream
                .getAudioTracks()[0];

        if(!track)
            return;

        track.enabled =
            !track.enabled;

        muteButton.textContent =
            track.enabled
            ? "🎤"
            : "🔇";

        muteButton.classList.toggle(
            "muted",
            !track.enabled
        );

    };


/* ============================================================
   كتم صوت الطرف الآخر
============================================================ */

remoteMuteButton.onclick =
    () => {

        remoteMuted =
            !remoteMuted;

        remoteVideo.muted =
            remoteMuted;

        /*
           remoteAudio موجود للمكالمات الصوتية
           أسفل الصفحة.
        */

        const remoteAudio =
            document.getElementById(
                "remoteAudio"
            );

        if(remoteAudio){

            remoteAudio.muted =
                remoteMuted;

        }

        remoteMuteButton.textContent =
            remoteMuted
            ? "🔇"
            : "🔊";

        remoteMuteButton.classList.toggle(
            "muted",
            remoteMuted
        );

    };


/* ============================================================
   الكاميرا تشغيل / إيقاف
============================================================ */

cameraButton.onclick =
    () => {

        if(!localStream)
            return;

        const track =
            localStream
                .getVideoTracks()[0];

        if(!track)
            return;

        track.enabled =
            !track.enabled;

        cameraButton.textContent =
            track.enabled
            ? "📹"
            : "🚫";

        cameraButton.classList.toggle(
            "camera-off",
            !track.enabled
        );

    };


/* ============================================================
   قلب الكاميرا
============================================================ */

flipCameraButton.onclick =
    async () => {

        if(
            !localStream ||
            activeCallType !==
            "video"
        )
            return;

        const oldTrack =
            localStream
                .getVideoTracks()[0];

        if(!oldTrack)
            return;

        currentFacingMode =
            currentFacingMode ===
            "user"
            ? "environment"
            : "user";

        try{

            const newStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio:false,

                        video:{
                            facingMode:{
                                exact:
                                    currentFacingMode
                            }
                        }

                    });

            const newTrack =
                newStream
                    .getVideoTracks()[0];

            const sender =
                peerConnection
                    ?.getSenders()
                    .find(
                        s =>
                            s.track &&
                            s.track.kind ===
                            "video"
                    );

            if(sender){

                await sender
                    .replaceTrack(
                        newTrack
                    );

            }

            oldTrack.stop();

            localStream.removeTrack(
                oldTrack
            );

            localStream.addTrack(
                newTrack
            );

            localVideo.srcObject =
                localStream;

        }catch(error){

            console.error(
                "Flip camera:",
                error
            );

            /*
               بعض الأجهزة لا تقبل exact.
               نحاول مرة ثانية بطريقة أبسط.
            */

            try{

                const newStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            audio:false,

                            video:{
                                facingMode:
                                    currentFacingMode
                            }

                        });

                const newTrack =
                    newStream
                        .getVideoTracks()[0];

                const sender =
                    peerConnection
                        ?.getSenders()
                        .find(
                            s =>
                                s.track &&
                                s.track.kind ===
                                "video"
                        );

                if(sender){

                    await sender
                        .replaceTrack(
                            newTrack
                        );

                }

                oldTrack.stop();

                localStream.removeTrack(
                    oldTrack
                );

                localStream.addTrack(
                    newTrack
                );

                localVideo.srcObject =
                    localStream;

            }catch(secondError){

                console.error(
                    secondError
                );

                currentFacingMode =
                    currentFacingMode ===
                    "user"
                    ? "environment"
                    : "user";

                alert(
                    "تعذر قلب الكاميرا على هذا الجهاز"
                );

            }

        }

    };


/* ============================================================
   تبديل الفيديو الكبير والصغير

/* ============================================================
   إعداد واجهة الفيديو
============================================================ */

function setupVideoUI(){

    videoArea.style.display =
        "block";

    cameraButton.style.display =
        "block";

    flipCameraButton.style.display =
        "block";

}


/* ============================================================
   تنظيف المكالمة محليًا
============================================================ */

function finishCallLocally(){

    stopCallTimer();

    if(
        activeCallUnsubscribe
    ){

        activeCallUnsubscribe();

        activeCallUnsubscribe =
            null;

    }

    if(
        activeCandidatesUnsubscribe
    ){

        activeCandidatesUnsubscribe();

        activeCandidatesUnsubscribe =
            null;

    }

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    try{

                        track.stop();

                    }catch(e){}

                }
            );

    }

    localStream =
        null;

    if(peerConnection){

        try{

            peerConnection.close();

        }catch(e){}

    }

    peerConnection =
        null;

    remoteVideo.srcObject =
        null;

    localVideo.srcObject =
        null;

    activeCallId =
        null;

    activeCallType =
        null;

    activeCallRole =
        null;

    pendingIncomingData =
        null;

    callConnected =
        false;

    callEnding =
        false;

    callSeconds =
        0;

    remoteMuted =
        false;

    currentFacingMode =
        "user";

    videoArea.classList.remove(
        "swap"
    );

    videoArea.style.display =
        "none";

    acceptCallButton.style.display =
        "none";

    rejectCallButton.style.display =
        "none";

    muteButton.style.display =
        "none";

    remoteMuteButton.style.display =
        "none";

    cameraButton.style.display =
        "none";

    flipCameraButton.style.display =
        "none";

    endCallButton.style.display =
        "block";

    muteButton.textContent =
        "🎤";

    remoteMuteButton.textContent =
        "🔊";

    cameraButton.textContent =
        "📹";

    callOverlay.style.display =
        "none";

}


/* ============================================================
   إذا الطرف الآخر أنهى المكالمة
============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        /*
           لا نستخدم Firestore هنا بشكل يعتمد عليه
           لأن beforeunload غير مضمون.

           presence فقط.
        */

        if(currentUser){

            updateMyPresence(false);

        }

    }
);


/* ============================================================
   الرجوع
============================================================ */

backButton.onclick =
    async () => {

        await updateTyping(
            false
        );

        if(
            activeCallId
        ){

            if(
                activeCallRole ===
                "caller" &&
                !callConnected
            ){

                await cancelCallByCaller();

            }else{

                await endActiveCall();

            }

        }

        if(unsubscribeMessages){

            unsubscribeMessages();

        }

        if(unsubscribeFriendStatus){

            unsubscribeFriendStatus();

        }

        if(unsubscribeFriendTyping){

            unsubscribeFriendTyping();

        }

        if(incomingCallUnsubscribe){

            incomingCallUnsubscribe();

        }

        stopPresence();

        history.back();

    };


/* ============================================================
   Visibility
============================================================ */

document.addEventListener(
    "visibilitychange",
    () => {

        if(!currentUser)
            return;

        if(
            document.visibilityState ===
            "visible"
        ){

            updateMyPresence(
                true
            );

        }else{

            /*
               أثناء مكالمة لا نعتبر المستخدم
               غير متصل فقط لأنه أخفى الصفحة.
            */

            if(!activeCallId){

                updateMyPresence(
                    false
                );

            }

            updateTyping(
                false
            );

        }

    }
);


/* ============================================================
   التشغيل
============================================================ */

async function init(){

    onAuthStateChanged(
        auth,
        async user => {

            if(!user){

                loading.textContent =
                    "يجب تسجيل الدخول أولاً";

                return;

            }

            currentUser =
                user;

            window.chatUser =
                user;

            try{

                startPresence();

                await loadFriend();

                listenMessages();

                /*
                   المكالمات الواردة للمستخدم الحالي فقط.
                */

                listenIncomingCalls();

                showApp();

                /*
                   تحميل voice.js بعد تجهيز
                   chatID / chatUser / chatFriend
                */

                await loadVoice();

            }catch(error){

                console.error(
                    error
                );

                stopPresence();

                showError(
                    error
                );

            }

        }
    );

}


init();
