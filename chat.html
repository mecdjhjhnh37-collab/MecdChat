<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
overflow:hidden
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}

.avatar,
.call-avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0
}

.avatar img,
.call-avatar img,
.local-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.user-status.recording{
font-weight:bold
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0
}

.call-buttons button, .menu-toggle-btn{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer
}

/* Chat Options Dropdown */
.chat-dropdown{
position:absolute;
top:75px;
left:15px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.6);
display:none;
z-index:100;
padding:6px;
width:180px;
}
.chat-dropdown.show{
display:block;
}
.chat-dropdown button{
width:100%;
padding:10px;
background:none;
border:0;
color:#fff;
text-align:right;
font-size:14px;
border-radius:8px;
cursor:pointer;
display:flex;
align-items:center;
gap:8px;
}
.chat-dropdown button:hover{
background:#18231f;
}

/* Pinned Message Banner */
#pinnedBanner{
background:#101d18;
border-bottom:1px solid rgba(0,232,137,.2);
padding:8px 15px;
display:none;
align-items:center;
justify-content:space-between;
font-size:13px;
cursor:pointer;
z-index:9;
}
#pinnedBanner .pin-text{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#00e889;
flex:1;
margin-left:10px;
}

/* Reply Preview Bar */
#replyPreview{
background:#101b17;
padding:8px 12px;
display:none;
align-items:center;
justify-content:space-between;
border-top:1px solid rgba(255,255,255,.08);
font-size:13px;
}
#replyPreview .reply-content{
border-right:3px solid #00e889;
padding-right:8px;
flex:1;
color:#b1c2bc;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}
#cancelReply{
background:none;
border:0;
color:#ff5555;
font-size:16px;
cursor:pointer;
padding:0 5px;
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:10px
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8
}

.message{
max-width:78%;
padding:10px 13px;
border-radius:18px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
user-select:none;
line-height:1.5;
align-self:flex-start;
min-width:0;
overflow:visible !important;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px
}

/* Quoted Reply inside Message */
.message-quote{
background:rgba(0,0,0,0.15);
border-right:3px solid #00150e;
padding:4px 8px;
margin-bottom:6px;
border-radius:6px;
font-size:12px;
opacity:0.9;
}
.message.other .message-quote{
background:rgba(255,255,255,0.06);
border-right-color:#00e889;
color:#a7b8b2;
}

/* Reactions Badge */
.message-reactions{
position:absolute;
bottom:-10px;
left:10px;
background:#0e1815;
border:1px solid rgba(0,232,137,0.3);
border-radius:12px;
padding:2px 6px;
font-size:12px;
display:flex;
gap:3px;
box-shadow:0 2px 6px rgba(0,0,0,0.4);
z-index:2;
}

.edited-tag{
font-size:9px;
opacity:0.6;
margin-right:4px;
}

.time{
display:block;
font-size:9px;
opacity:.6;
margin-top:5px
}

.message-meta{
display:flex;
align-items:center;
gap:5px;
margin-top:5px
}

.message-status{
font-size:12px;
font-weight:bold;
direction:ltr
}

.message-status.read{
color:#006dff
}

.input-area-wrapper{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
background:#050807;
z-index:50;
display:flex;
flex-direction:column;
}

.input-area{
padding:10px;
display:flex;
gap:8px;
background:#050807;
}

#messageInput{
flex:1;
min-width:0;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;
font-size:15px
}

#messageInput:focus{
border-color:#00e889
}

#voiceButton,
#sendButton,
#attachButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
flex-shrink:0
}

#attachButton{
background:#18231f;
color:#fff;
font-size:28px;
transition:.15s
}

#voiceButton{
background:#18231f;
color:#fff;
transition:.18s
}

#voiceButton.recording{
background:#321817;
color:#ff5555;
transform:scale(1.05)
}

#sendButton{
background:#00e889;
color:#00150e
}

#sendButton:disabled{
opacity:.6
}

#attachMenu{
position:fixed;
bottom:70px;
right:10px;
width:175px;
padding:7px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:17px;
box-shadow:0 10px 35px rgba(0,0,0,.55);
display:none;
z-index:1000
}

#attachMenu.show{
display:block
}

.attach-option{
width:100%;
height:45px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
font-size:14px;
font-weight:bold;
cursor:pointer;
margin-bottom:5px
}

.hidden-file{
display:none!important
}

/* Media & Voice styles */
.image-message, .video-message{
padding:6px !important;
width:max-content !important;
max-width:82vw !important;
}
.message-image, .message-video{
display:block !important;
max-width:100% !important;
max-height:360px !important;
border-radius:14px !important;
object-fit:contain !important;
}
.voice-message{
width:330px !important;
max-width:calc(100% - 20px) !important;
min-width:250px !important;
padding:8px 10px 7px !important;
border-radius:18px !important;
background:linear-gradient(135deg,#162923,#0d1714) !important;
border:1px solid rgba(0,232,137,.16) !important;
}
.message.mine.voice-message{
background:linear-gradient(135deg,#087e50,#00a866) !important;
}
.voice-message-box{
display:flex !important;
align-items:center !important;
gap:9px !important;
direction:rtl !important;
}
.voice-icon{
width:43px !important;
height:43px !important;
border-radius:50% !important;
display:flex !important;
align-items:center !important;
justify-content:center !important;
background:rgba(0,232,137,.13) !important;
color:#00e889 !important;
font-size:18px !important;
}
.voice-controls{
display:flex !important;
align-items:center !important;
gap:8px !important;
width:100% !important;
height:38px !important;
}
.voice-play{
width:38px !important;
height:38px !important;
border:0 !important;
border-radius:50% !important;
background:#00e889 !important;
color:#00150e !important;
font-size:14px !important;
cursor:pointer !important;
}
.voice-progress{
flex:1 !important;
height:7px !important;
border-radius:20px !important;
background:rgba(255,255,255,.13) !important;
cursor:pointer !important;
position:relative !important;
}
.voice-progress-fill{
width:0%;
height:100% !important;
background:#00e889 !important;
border-radius:20px;
}
.voice-time{
font-size:10px !important;
font-weight:bold !important;
color:#b9c7c2 !important;
direction:ltr !important;
}

/* Message Context Menu & Reaction Picker */
.message-menu{
position:absolute !important;
left:50% !important;
bottom:calc(100% + 8px) !important;
transform:translateX(-50%) !important;
width:170px !important;
padding:6px !important;
background:#0b1512 !important;
border:1px solid rgba(0,232,137,.18) !important;
border-radius:14px !important;
box-shadow:0 8px 25px rgba(0,0,0,.55) !important;
z-index:999999 !important;
display:flex !important;
flex-direction:column !important;
gap:4px !important;
}
.message-menu button{
width:100% !important;
padding:8px 12px !important;
border:0 !important;
border-radius:8px !important;
background:#18231f !important;
color:#fff !important;
font-size:13px !important;
font-weight:bold !important;
cursor:pointer !important;
text-align:right !important;
}
.message-menu button:hover{
background:#22332d !important;
}

/* Reaction Picker Popup */
.reaction-picker{
display:flex;
gap:6px;
background:#0b1512;
border:1px solid rgba(0,232,137,0.2);
padding:6px 10px;
border-radius:20px;
margin-bottom:6px;
}
.reaction-picker span{
cursor:pointer;
font-size:18px;
transition:transform 0.15s;
}
.reaction-picker span:hover{
transform:scale(1.3);
}

/* Call Screens */
#incomingCall{
position:fixed;
top:85px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
padding:14px;
background:#101815;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
box-shadow:0 15px 45px rgba(0,0,0,.5);
z-index:9000;
display:none;
align-items:center;
justify-content:space-between;
gap:12px
}
.incoming-call-info{
display:flex;
align-items:center;
gap:11px;
min-width:0
}
.incoming-name{
font-size:15px;
font-weight:bold
}
.incoming-type{
font-size:12px;
color:#9aa7a3;
margin-top:4px
}
.incoming-actions{
display:flex;
gap:9px
}
.incoming-actions button{
width:46px;
height:46px;
border:0;
border-radius:50%;
font-size:20px;
color:#fff;
cursor:pointer
}
#rejectIncoming{background:#d83b3b}
#acceptIncoming{background:#00e889;color:#00150e}

#callScreen{
position:fixed;
inset:0;
background:#020504;
z-index:10000;
display:none;
flex-direction:column;
overflow:hidden
}
.call-top{
height:85px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)
}
.call-top-info{text-align:center}
#callTitle{font-size:20px;font-weight:bold}
#callState{font-size:13px;color:#00e889;margin-top:6px}
#callDuration{font-size:12px;color:#9aa7a3;margin-top:4px}
#audioCallView{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#020504
}
#videoArea{
position:relative;
flex:1;
background:#000;
overflow:hidden;
display:none
}
#remoteVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
display:none
}
#remoteAvatar{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#07110f;
z-index:1
}
#remoteAvatar img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover
}
#localVideo{
position:absolute;
width:110px;
height:145px;
left:16px;
top:95px;
object-fit:cover;
border-radius:18px;
border:2px solid rgba(255,255,255,.7);
background:#111;
z-index:5;
display:none
}
#localAvatar{
position:absolute;
width:110px;
height:110px;
left:16px;
top:110px;
border-radius:50%;
background:#12352c;
z-index:6;
display:none;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:40px
}
.call-controls{
min-height:100px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
background:rgba(5,8,7,.98);
z-index:20
}
.call-control{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}
.call-control.accept{background:#00e889;color:#00150e}
.call-control.reject,.call-control.end{background:#d83b3b}
.call-control.active{background:#00e889;color:#00150e}
.hidden{display:none!important}
</style>
</head>

<div class="call-controls">

</div>

return timestamp.toDate().toLocaleTimeString("ar", { hour:"2-digit", minute:"2-digit" });
}catch{ return ""; }
}

function formatDuration(seconds){
seconds = Math.max(0, Math.floor(Number(seconds || 0)));
const m = Math.floor(seconds / 60);
const s = seconds % 60;
return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function requestNotificationPermission(){

function playNotificationSound(){
try{
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();
osc.type = "sine";
osc.frequency.setValueAtTime(587.33, ctx.currentTime);
gain.gain.setValueAtTime(0.1, ctx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.3);
}catch(e){}
}

async function uploadMediaToSupabase(file){
if(!file) throw new Error("لم يتم اختيار ملف.");
const extension = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : (file.type.startsWith("video/") ? "mp4" : "jpg");
const filePath = `${currentUser.uid}/${Date.now()}_${crypto.randomUUID()}.${extension}`;
const { error: uploadError } = await supabase.storage.from(SUPABASE_BUCKET).upload(filePath, file, { cacheControl:"3600", contentType:file.type, upsert:false });
if(uploadError) throw new Error("تعذر رفع الملف");
const { data: publicData } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(filePath);
return { url: publicData?.publicUrl, path: filePath, type: file.type, size: file.size, name: file.name || "" };
}

/* ================= VOICE RECORDING (FIXED & FULL) ================= */
async function toggleVoiceRecording(){
if(!voiceRecording){
try{
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
audioChunks = [];
mediaRecorder = new MediaRecorder(stream);
mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
mediaRecorder.onstop = async () => {
stream.getTracks().forEach(t => t.stop());
const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
if(audioBlob.size > 1000){
await sendVoiceMessage(audioBlob);
}
};
mediaRecorder.start();
voiceRecording = true;
voiceButton.classList.add("recording");
voiceButton.textContent = "⏹";
updateMyActivity("recording");
}catch(e){
alert("تعذر الوصول إلى الميكروفون.");
}
}else{
if(mediaRecorder && mediaRecorder.state !== "inactive"){
mediaRecorder.stop();
}
voiceRecording = false;
voiceButton.classList.remove("recording");
voiceButton.textContent = "🎤";
updateMyActivity("none");
}
}

const time = document.createElement("span");

audio.onloadedmetadata = () => { if(Number.isFinite(audio.duration)) time.textContent = formatDuration(audio.duration); };
audio.ontimeupdate = () => {
if(Number.isFinite(audio.duration) && audio.duration > 0){
fill.style.width = ((audio.currentTime / audio.duration) * 100) + "%";
time.textContent = formatDuration(audio.currentTime);
}
};
}

function renderMessages(snapshot){
const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 120;

snapshot.docChanges().forEach(change => {
const id = change.doc.id;
const data = change.doc.data();

if(change.type === "removed"){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(data.senderId !== currentUser.uid){
markRead(id, data);
if(change.type === "added" && document.hidden){
playNotificationSound();
showBrowserNotification(friendUser.name, data.text || "رسالة جديدة");
}
}

const box = document.createElement("div");
box.className = "message " + (data.senderId === currentUser.uid ? "mine" : "other");

if(data.replyTo && data.replyTo.text){
const quote = document.createElement("div");
quote.className = "message-quote";
quote.textContent = data.replyTo.text;
box.appendChild(quote);
}

if(data.type === "text"){
const textNode = document.createElement("span");
textNode.textContent = data.text || "";
box.appendChild(textNode);
if(data.edited){
const tag = document.createElement("span");
tag.className = "edited-tag";
tag.textContent = "(معدلة)";
box.appendChild(tag);
}
}else if(data.type === "voice"){
createVoiceMessage(box, data);
}else if(data.type === "image"){
createImageMessage(box, data);
}else if(data.type === "video"){
createVideoMessage(box, data);
}else if(data.type === "call"){
createCallMessage(box, data);
}

if(data.reactions && Object.keys(data.reactions).length > 0){
const reactionsBadge = document.createElement("div");
reactionsBadge.className = "message-reactions";
const uniqueEmojis = [...new Set(Object.values(data.reactions))];
reactionsBadge.textContent = uniqueEmojis.join(" ");
box.appendChild(reactionsBadge);
}

const meta = document.createElement("div");
meta.className = "message-meta";
const time = document.createElement("span");
time.className = "time";
time.textContent = formatTime(data.createdAt);
meta.appendChild(time);

const status = createStatus(data);
if(status) meta.appendChild(status);
box.appendChild(meta);

addMessageActions(box, id, data, data.senderId === currentUser.uid);

const old = messageElements.get(id);
if(old){
old.replaceWith(box);
}else{
messages.appendChild(box);
}
messageElements.set(id, box);
});

const all = messages.querySelectorAll(".message");
const empty = messages.querySelector(".empty");
if(all.length){ empty?.remove(); }
else if(!empty){
const e = document.createElement("div");
e.className = "empty";
e.innerHTML = "💬<br>ابدأ المحادثة الآن";
messages.appendChild(e);
}

if(nearBottom){
requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
}
}

let ringtoneContext = null, ringtoneTimer = null, ringtoneGain = null;
function startRingtone(){
stopRingtone();
try{
ringtoneContext = new (window.AudioContext || window.webkitAudioContext)();
ringtoneGain = ringtoneContext.createGain();
ringtoneGain.gain.value = 0.06;
ringtoneGain.connect(ringtoneContext.destination);
const playTone = () => {
if(!ringtoneContext) return;
const osc = ringtoneContext.createOscillator();
osc.frequency.value = 880;
osc.connect(ringtoneGain);
osc.start();
osc.stop(ringtoneContext.currentTime + 0.35);
};
playTone();
ringtoneTimer = setInterval(playTone, 1200);
}catch(e){}
}
function stopRingtone(){
if(ringtoneTimer) clearInterval(ringtoneTimer);
ringtoneTimer = null;
if(ringtoneContext) try{ ringtoneContext.close(); }catch{}
ringtoneContext = null;
}

async function playRemoteAudio(){
if(!remoteAudio || !remoteAudio.srcObject) return;
remoteAudio.muted = remoteAudioMuted;
try{ await remoteAudio.play(); }catch(e){}
}

async function addCandidate(candidate){
if(!peerConnection || !candidate) return;
if(peerConnection.remoteDescription){
try{ await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); }catch(e){}
}else{
pendingIceCandidates.push(candidate);
}
}

async function flushIce(){
if(!peerConnection || !peerConnection.remoteDescription) return;
const list = pendingIceCandidates.splice(0);
for(const c of list){
try{ await peerConnection.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
}
}

function createPeer(){
const pc = new RTCPeerConnection(rtcConfig);
pc.onnegotiationneeded = async () => {
try{
const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
if(activeCallId && activeCallRole === "caller"){
await updateDoc(doc(db, "calls", activeCallId), { offer:{ type: offer.type, sdp: offer.sdp } });
}
}catch(e){}
};
pc.onicecandidate = async e => {
if(!e.candidate || !activeCallId || !currentUser) return;
try{
await addDoc(collection(db, "calls", activeCallId, "candidates"), {
senderId: currentUser.uid, candidate: e.candidate.toJSON(), createdAt: serverTimestamp()
});
}catch(err){}
};
pc.ontrack = e => {
const stream = e.streams?.[0];
if(!stream) return;
remoteAudio.srcObject = stream;
const hasVideo = stream.getVideoTracks().some(t => t.readyState !== "ended");
if(hasVideo){
remoteVideo.srcObject = stream;
remoteVideo.style.display = "block";
remoteAvatar.style.display = "none";
videoArea.style.display = "block";
audioCallView.style.display = "none";
remoteVideo.play().catch(() => {});
}else{
playRemoteAudio();
}
};
pc.onconnectionstatechange = async () => {
const state = pc.connectionState;
if(state === "connected"){
callState.textContent = "متصل";
showConnectedButtons();
startCallTimer();
await playRemoteAudio();
}
if(state === "disconnected") callState.textContent = "انقطع الاتصال";
if(state === "failed"){
callState.textContent = "تعذر الاتصال";
setTimeout(() => { if(activeCallId) finishCall(); }, 1500);
}
};
return pc;
}

function startCallTimer(){
if(callTimer) return;
callTimer = setInterval(() => {
callSeconds++;
callDuration.textContent = formatDuration(callSeconds);
}, 1000);
}
function stopCallTimer(){
if(callTimer) clearInterval(callTimer);
callTimer = null;
}

async function startCall(type){
if(activeCallId) return alert("هناك مكالمة نشطة");
activeCallId = crypto.randomUUID();
activeCallType = type;
activeCallRole = "caller";
activeCallPeer = { uid: friendUser.uid, name: friendUser.name, photo: friendUser.photo };
callSeconds = 0;
pendingIceCandidates = [];
showCallScreen();
showOutgoingButtons();
callState.textContent = "جارٍ الاتصال...";

try{
localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video: type === "video" });
if(type === "video"){ localVideo.srcObject = localStream; localVideo.style.display = "block"; }
peerConnection = createPeer();
localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
const offer = await peerConnection.createOffer();
await pcSetLocalDesc(offer);
await setDoc(doc(db, "calls", activeCallId), {
callId: activeCallId, callerId: currentUser.uid, receiverId: friendUser.uid,
callType: type, status: "ringing", offer:{ type: offer.type, sdp: offer.sdp },
createdAt: serverTimestamp(), videoEnabled: type === "video"
});
listenCallerCall();
}catch(e){
alert("تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا.");
cleanupCall();
}
}

async function pcSetLocalDesc(offer){
await peerConnection.setLocalDescription(offer);
}

function listenCallerCall(){
if(unsubscribeActiveCall) unsubscribeActiveCall();
unsubscribeActiveCall = onSnapshot(doc(db, "calls", activeCallId), async snap => {
if(!snap.exists()){ cleanupCall(); return; }
const data = snap.data();
if(["cancelled", "rejected", "missed", "ended"].includes(data.status)){
stopRingtone();
callSeconds = Number(data.duration || 0);
cleanupCall();
return;
}
if(data.answer && peerConnection && !peerConnection.currentRemoteDescription){
try{
await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
await flushIce();
await playRemoteAudio();
}catch(e){}
}
if(data.status === "connected"){
stopRingtone();
callState.textContent = "متصل";
showConnectedButtons();
startCallTimer();
await playRemoteAudio();
}
});
listenCallCandidates();
}

function listenIncomingCalls(){
if(!currentUser) return;
if(unsubscribeIncomingCalls) unsubscribeIncomingCalls();
const q = query(collection(db, "calls"), where("receiverId", "==", currentUser.uid));
unsubscribeIncomingCalls = onSnapshot(q, async snapshot => {
for(const change of snapshot.docChanges()){
if(change.type !== "added" && change.type !== "modified") continue;
const id = change.doc.id;
const data = change.doc.data();
if(data.receiverId !== currentUser.uid || data.status !== "ringing" || !data.offer) continue;
if(activeCallId || handledIncomingCalls.has(id)) continue;
handledIncomingCalls.add(id);

const callerSnap = await getDoc(doc(db, "users", data.callerId));
const callerData = callerSnap.exists() ? callerSnap.data() : {};
activeCallId = id;
activeCallType = data.callType || "audio";
activeCallRole = "receiver";
activeCallPeer = { uid: data.callerId, name: callerData.name || "مستخدم Mecd", photo: callerData.photo || "" };
showIncoming();
startRingtone();
}
});
}

async function acceptIncomingCall(){
if(!activeCallId || !activeCallPeer) return;
try{
const callId = activeCallId;
const snap = await getDoc(doc(db, "calls", callId));
if(!snap.exists()){ stopRingtone(); cleanupCall(); return; }
const data = snap.data();
stopRingtone();
incomingCall.style.display = "none";
showCallScreen();

localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video: activeCallType === "video" });
if(activeCallType === "video"){ localVideo.srcObject = localStream; localVideo.style.display = "block"; }
peerConnection = createPeer();
localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
await flushIce();
const answer = await peerConnection.createAnswer();
await peerConnection.setLocalDescription(answer);
await updateDoc(doc(db, "calls", callId), {
answer:{ type: answer.type, sdp: answer.sdp }, status: "connected", receivedAt: serverTimestamp()
});
showConnectedButtons();
startCallTimer();
await playRemoteAudio();
}catch(e){
stopRingtone();
cleanupCall();
}
}

function listenCallCandidates(){
if(unsubscribeCandidates) unsubscribeCandidates();
if(!activeCallId) return;
const callId = activeCallId;
unsubscribeCandidates = onSnapshot(collection(db, "calls", callId, "candidates"), snapshot => {
snapshot.docChanges().forEach(change => {
if(change.type !== "added") return;
const data = change.doc.data();
if(data.senderId === currentUser.uid || activeCallId !== callId) return;
addCandidate(data.candidate);
});
});
}

async function rejectIncomingCall(){
stopRingtone();
if(activeCallId){
try{ await updateDoc(doc(db, "calls", activeCallId), { status: "rejected", duration: 0, endedAt: serverTimestamp() }); }catch(e){}
}
cleanupCall();
}

async function finishCall(status = null){
stopRingtone();
stopCallTimer();
if(!activeCallId){ cleanupCall(); return; }
const duration = callSeconds;
try{
await updateDoc(doc(db, "calls", activeCallId), {
status: status || (duration > 0 ? "ended" : "missed"),
duration,
endedAt: serverTimestamp()
});
}catch(e){}
cleanupCall();
}

function cleanupCall(){
stopRingtone();
stopCallTimer();
if(unsubscribeActiveCall){ unsubscribeActiveCall(); unsubscribeActiveCall = null; }
if(unsubscribeCandidates){ unsubscribeCandidates(); unsubscribeCandidates = null; }
if(localStream){ localStream.getTracks().forEach(t => { try{ t.stop(); }catch{} }); localStream = null; }
if(peerConnection){ try{ peerConnection.close(); }catch{} peerConnection = null; }
pendingIceCandidates = [];
if(remoteAudio){ remoteAudio.pause(); remoteAudio.srcObject = null; }
incomingCall.style.display = "none";
callScreen.style.display = "none";
activeCallId = null; activeCallType = null; activeCallRole = null; activeCallPeer = null; callSeconds = 0;
}

callButton.onclick = () => startCall("audio");
videoButton.onclick = () => startCall("video");
acceptIncoming.onclick = acceptIncomingCall;
rejectIncoming.onclick = rejectIncomingCall;
acceptCallButton.onclick = acceptIncomingCall;
rejectCallButton.onclick = rejectIncomingCall;
endCallButton.onclick = async () => { if(activeCallId) await finishCall(); else cleanupCall(); };

backButton.onclick = async () => {
await updateMyActivity("none");
if(activeCallId) await finishCall();
if(unsubscribeMessages) unsubscribeMessages();
if(unsubscribeFriendStatus) unsubscribeFriendStatus();
if(unsubscribeFriendActivity) unsubscribeFriendActivity();
if(unsubscribeChatMeta) unsubscribeChatMeta();
if(unsubscribeIncomingCalls) unsubscribeIncomingCalls();
stopPresence();
history.back();
};

onAuthStateChanged(auth, async user => {
if(!user){ loading.textContent = "يجب تسجيل الدخول أولاً"; return; }
currentUser = user;
try{
startPresence();
await loadFriend();
listenMessages();
listenIncomingCalls();
showApp();
}catch(e){
loading.textContent = e.message || "حدث خطأ";
}
});

</script>
