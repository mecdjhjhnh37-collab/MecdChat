<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع المطور مجد - المحادثة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #333;
            color: #00ffcc;
            font-weight: bold;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
            border: 1px solid #333;
        }
        .footer-form {
            background-color: #1f1f1f;
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 2px solid #333;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #00ffcc;
            color: #121212;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .upload-btn:hover {
            background-color: #00b386;
        }
        #status-text {
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        موقع المطور مجد - غرفة الدردشة والوسائط
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message">مرحباً بك! يمكنك إرسال فيديو قصير (بحد أقصى 700 كيلوبايت) دون مشاكل.</div>
    </div>

    <div class="footer-form">
        <label for="videoInput" class="upload-btn">اختر فيديو</label>
        <input type="file" id="videoInput" accept="video/*">
        <span id="status-text">لم يتم اختيار ملف</span>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const statusText = document.getElementById('status-text');
        const chatBox = document.getElementById('chatBox');

        const MAX_SIZE_KB = 700; // الحد الأقصى المطلوب

        videoInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // 1. التحقق من حجم الفيديو محلياً في المتصفح قبل الإرسال لتوفير الوقت
            const fileSizeKb = file.size / 1024;
            
            if (fileSizeKb > MAX_SIZE_KB) {
                alert(`خطأ: حجم الفيديو (${fileSizeKb.toFixed(1)} كيلوبايت) أكبر من الحد المسموح به (${MAX_SIZE_KB} كيلوبايت).`);
                statusText.textContent = "تم رفض الملف (الحجم كبير جداً)";
                videoInput.value = ""; // تفريغ الحقل
                return;
            }

            statusText.textContent = `جاري رفع الفيديو (${fileSizeKb.toFixed(1)} KB)...`;

            // 2. إعداد البيانات للإرسال إلى السيرفر
            const formData = new FormData();
            formData.append('video', file);

            try {
                // إرسال الطلب إلى مسار السيرفر الذي أنشأناه سابقاً
                const response = await fetch('http://localhost:3000/upload-video', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    statusText.textContent = "تم الرفع بنجاح!";
                    appendMessage(`تم إرسال الفيديو بنجاح (الحجم: ${result.fileSizeKb} KB)`, true);
                } else {
                    statusText.textContent = "فشل الرفع.";
                    alert(result.message);
                }

            } catch (error) {
                console.error('خطأ في الاتصال بالسيرفر:', error);
                statusText.textContent = "خطأ في الاتصال بالسيرفر.";
                alert("حدث خطأ أثناء الاتصال بالسيرفر.");
            }

            // تفريغ الحقل ليسمح باختيار نفس الملف مرة أخرى إذا لزم الأمر
            videoInput.value = "";
        });

        function appendMessage(text, isSuccess) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.style.borderColor = isSuccess ? '#00ffcc' : '#ff4d4d';
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>
</html>
