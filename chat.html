<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

:root{
--green:#b7ff4a;
--dark:#07100d;
--dark2:#111b18;
--dark3:#18231f;
--text:#fff;
--muted:#9aa5a0;
--bubble-other:#202b27;
--bubble-mine:#b7ff4a;
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Tahoma,sans-serif;
background:#000;
color:var(--text)
}

button,input{
font:inherit
}

button{
cursor:pointer
}

#loading{
position:fixed;
inset:0;
z-index:999999;
background:#000;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:14px;
font-size:15px
}

.loader{
width:28px;
height:28px;
border:3px solid #26312d;
border-top-color:var(--green);
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.app{
position:relative;
width:100%;
height:100dvh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
background:
radial-gradient(circle at 50% 0,#15241f 0,#07100d 38%,#050807 100%);
overflow:hidden
}

/* ================= HEADER ================= */

.header{
height:64px;
min-height:64px;
background:#000;
display:flex;
align-items:center;
gap:9px;
padding:7px 10px;
border-bottom:1px solid rgba(255,255,255,.08);
z-index:100;
box-shadow:0 1px 5px rgba(0,0,0,.4)
}

.header-btn{
width:39px;
height:39px;
border:0;
background:transparent;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
border-radius:50%
}

.header-btn:active{
background:#1c2421
}

.back-icon{
font-size:27px;
line-height:1;
transform:translateY(-1px)
}

.contact-header{
height:52px;
flex:1;
min-width:0;
display:flex;
align-items:center;
gap:10px;
border:0;
background:transparent;
color:#fff;
text-align:right;
overflow:hidden
}

.avatar{
width:44px;
height:44px;
min-width:44px;
border-radius:50%;
background:#26352f;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:21px
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.contact-info{
min-width:0;
display:flex;
flex-direction:column;
justify-content:center;
gap:2px
}

.contact-name{
font-size:16px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.contact-status{
font-size:12px;
color:#9ba49f;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.contact-status.online,
.contact-status.typing,
.contact-status.recording{
color:var(--green)
}

.header-actions{
display:flex;
align-items:center;
gap:2px
}

/* ================= CHAT ================= */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
padding:15px 12px 110px;
display:flex;
flex-direction:column;
gap:5px;
scroll-behavior:smooth;
overscroll-behavior:contain;
background:
radial-gradient(circle at 20% 15%,rgba(25,52,43,.25),transparent 35%),
radial-gradient(circle at 80% 75%,rgba(14,35,29,.22),transparent 40%)
}

.messages::-webkit-scrollbar{
width:3px
}

.messages::-webkit-scrollbar-thumb{
background:#35423d;
border-radius:10px
}

.empty{
margin:auto;
text-align:center;
color:#7d8984;
font-size:14px;
line-height:2
}

/* ================= MESSAGE ================= */

.message-row{
width:100%;
display:flex;
margin:2px 0
}

.message-row.mine{
justify-content:flex-start
}

.message-row.other{
justify-content:flex-end
}

.message{
position:relative;
max-width:min(78%,430px);
min-width:48px;
padding:7px 9px 19px;
border-radius:9px;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.45;
font-size:15px;
box-shadow:0 1px 1px rgba(0,0,0,.18);
user-select:none;
transition:transform .12s ease,background .15s ease
}

.message.mine{
background:var(--bubble-mine);
color:#081006;
border-top-left-radius:9px;
border-bottom-left-radius:2px
}

.message.other{
background:var(--bubble-other);
color:#fff;
border-top-right-radius:9px;
border-bottom-right-radius:2px
}

.message.highlight{
animation:highlightMessage 1.5s ease
}

@keyframes highlightMessage{
0%,100%{background:inherit}
30%{background:#607e37}
}

.message-text{
white-space:pre-wrap
}

.message-meta{
position:absolute;
bottom:3px;
left:8px;
display:flex;
align-items:center;
gap:4px;
direction:ltr;
height:13px
}

.message.mine .message-meta{
left:8px;
right:auto
}

.message.other .message-meta{
right:8px;
left:auto
}

.time{
font-size:9px;
opacity:.62;
white-space:nowrap
}

.message-status{
font-size:11px;
font-weight:700;
letter-spacing:-3px;
padding-right:2px
}

.message-status.sent{
color:#53615c
}

.message-status.read{
color:#1785ff
}

/* ================= MEDIA ================= */

.message.media{
padding:5px 5px 20px
}

.message-media{
display:block;
width:min(270px,65vw);
max-height:330px;
object-fit:cover;
border-radius:7px;
cursor:pointer
}

.message video{
background:#000
}

/* ================= REPLY ================= */

.message-reply{
display:flex;
gap:7px;
padding:6px 8px;
margin-bottom:5px;
border-radius:6px;
background:rgba(0,0,0,.13);
border-right:3px solid #6d8e38;
cursor:pointer;
min-width:0
}

.message.other .message-reply{
background:rgba(255,255,255,.06);
border-right-color:var(--green)
}

.reply-inner{
min-width:0;
overflow:hidden
}

.reply-name{
font-size:10px;
font-weight:700;
color:#537d24;
margin-bottom:2px
}

.message.other .reply-name{
color:var(--green)
}

.reply-text{
font-size:10px;
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* ================= REACTIONS ================= */

.message-reactions{
position:absolute;
bottom:-10px;
right:8px;
display:flex;
gap:2px;
z-index:5
}

.message.mine .message-reactions{
right:auto;
left:8px
}

.reaction-chip{
border:1px solid rgba(255,255,255,.14);
background:#101816;
color:#fff;
border-radius:12px;
padding:1px 5px;
font-size:11px;
display:flex;
align-items:center;
gap:2px;
min-height:21px
}

.reaction-chip.mine{
border-color:rgba(183,255,74,.7)
}

.reaction-count{
font-size:9px;
opacity:.85
}

.heart-pop{
position:absolute;
inset:50% auto auto 50%;
transform:translate(-50%,-50%) scale(0);
font-size:54px;
z-index:20;
pointer-events:none;
animation:heartPop .55s ease forwards
}

@keyframes heartPop{
0%{transform:translate(-50%,-50%) scale(0);opacity:0}
45%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
100%{transform:translate(-50%,-50%) scale(1);opacity:0}
}

/* ================= PIN ================= */

.pinned-banner{
display:none;
height:40px;
background:#0b1411;
border-bottom:1px solid rgba(183,255,74,.14);
align-items:center;
padding:5px 10px;
gap:8px;
z-index:50
}

.pinned-banner.show{
display:flex
}

.pinned-content{
flex:1;
min-width:0;
display:flex;
gap:7px;
align-items:center;
cursor:pointer
}

.pinned-text{
font-size:11px;
color:var(--green);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.pinned-close{
border:0;
background:transparent;
color:#aaa;
font-size:16px;
width:30px;
height:30px
}

/* ================= INPUT ================= */

.input-wrapper{
position:absolute;
left:0;
right:0;
bottom:0;
padding:8px 9px calc(8px + env(safe-area-inset-bottom));
background:linear-gradient(to top,rgba(0,0,0,.98),rgba(0,0,0,.85),transparent);
z-index:80;
pointer-events:none
}

.input-bar{
pointer-events:auto;
display:flex;
align-items:flex-end;
gap:6px;
width:100%;
padding:5px;
border-radius:25px;
background:#f1f3f2;
box-shadow:0 4px 25px rgba(0,0,0,.5)
}

.input-icon{
width:42px;
height:42px;
min-width:42px;
border:0;
background:transparent;
color:#4d5652;
border-radius:50%;
font-size:21px;
display:flex;
align-items:center;
justify-content:center
}

.input-icon:active{
background:#dfe3e1
}

#messageInput{
flex:1;
min-width:0;
min-height:42px;
max-height:110px;
resize:none;
border:0;
outline:0;
background:transparent;
color:#111;
font-size:15px;
padding:11px 4px;
line-height:20px;
direction:rtl
}

#messageInput::placeholder{
color:#7d8582
}

.send-btn{
width:42px;
height:42px;
min-width:42px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
font-size:20px;
display:none;
align-items:center;
justify-content:center
}

.send-btn.show{
display:flex
}

.voice-btn{
width:42px;
height:42px;
min-width:42px;
border:0;
border-radius:50%;
background:#111;
color:#fff;
font-size:20px;
display:flex;
align-items:center;
justify-content:center
}

.voice-btn.recording{
background:#c62828;
animation:pulse 1s infinite
}

@keyframes pulse{
50%{transform:scale(.9)}
}

/* ================= ATTACHMENT SHEET ================= */

.sheet-backdrop{
position:fixed;
inset:0;
z-index:1000;
background:rgba(0,0,0,.62);
display:flex;
align-items:flex-end;
animation:fade .18s ease
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

.attachment-sheet{
width:100%;
max-width:650px;
margin:auto;
background:#f4f5f4;
color:#161a18;
border-radius:25px 25px 0 0;
padding:12px 15px calc(18px + env(safe-area-inset-bottom));
animation:up .22s ease
}

@keyframes up{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

.sheet-handle{
width:40px;
height:4px;
background:#b7bbb9;
border-radius:10px;
margin:0 auto 18px
}

.attachment-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px 8px
}

.attachment-option{
border:0;
background:transparent;
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
font-size:11px;
color:#242825
}

.attachment-icon{
width:52px;
height:52px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
background:#dfe5e1
}

.attachment-option:active .attachment-icon{
transform:scale(.92)
}

.close-sheet{
width:100%;
height:44px;
border:0;
border-radius:14px;
background:#e1e4e2;
margin-top:18px;
font-weight:700
}

/* ================= CONTEXT MENU ================= */

.context-backdrop{
position:fixed;
inset:0;
z-index:2000;
background:rgba(0,0,0,.72);
backdrop-filter:blur(5px);
-webkit-backdrop-filter:blur(5px);
display:flex;
align-items:flex-end;
justify-content:center;
padding-bottom:0
}

.context-card{
width:100%;
max-width:650px;
background:rgba(25,33,30,.94);
border:1px solid rgba(255,255,255,.1);
border-radius:24px 24px 0 0;
padding:10px 12px calc(18px + env(safe-area-inset-bottom));
box-shadow:0 -15px 50px rgba(0,0,0,.55);
animation:contextUp .2s ease;
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px)
}

@keyframes contextUp{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

.context-preview{
max-width:80%;
margin:0 auto 12px;
display:flex;
justify-content:center
}

.context-preview .message{
pointer-events:none
}

.quick-reactions{
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.07);
border-radius:22px;
padding:8px;
margin-bottom:9px
}

.quick-reaction{
width:42px;
height:42px;
border:0;
background:transparent;
font-size:23px;
border-radius:50%
}

.quick-reaction:active{
background:rgba(255,255,255,.1);
transform:scale(1.15)
}

.context-actions{
display:flex;
flex-direction:column;
gap:4px
}

.context-action{
width:100%;
height:45px;
border:0;
border-radius:12px;
background:rgba(255,255,255,.055);
color:#fff;
display:flex;
align-items:center;
gap:13px;
padding:0 15px;
font-size:14px;
text-align:right
}

.context-action:active{
background:rgba(255,255,255,.12)
}

.context-action.delete{
color:#ff6d6d
}

/* ================= CONTACT CARD ================= */

.contact-backdrop{
position:fixed;
inset:0;
z-index:1500;
background:rgba(0,0,0,.62);
display:flex;
align-items:flex-end
}

.contact-card{
width:100%;
max-width:650px;
margin:auto;
background:#101815;
border-radius:26px 26px 0 0;
padding:12px 18px calc(20px + env(safe-area-inset-bottom));
animation:up .22s ease;
box-shadow:0 -15px 50px rgba(0,0,0,.6)
}

.contact-handle{
width:40px;
height:4px;
background:#4b5651;
border-radius:10px;
margin:0 auto 20px
}

.contact-large-avatar{
width:85px;
height:85px;
border-radius:50%;
overflow:hidden;
background:#25352e;
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
margin:0 auto 12px
}

.contact-large-avatar img{
width:100%;
height:100%;
object-fit:cover
}

.contact-card-name{
font-size:20px;
font-weight:700;
text-align:center
}

.contact-card-id{
font-size:12px;
color:#89948f;
text-align:center;
margin-top:4px
}

.contact-card-status{
font-size:12px;
color:var(--green);
text-align:center;
margin-top:5px
}

.contact-actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-top:20px
}

.contact-action{
height:60px;
border:0;
border-radius:15px;
background:#19231f;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:3px;
font-size:11px
}

.contact-action span{
font-size:20px
}

/* ================= REPLY COMPOSE ================= */

.reply-compose{
position:absolute;
left:9px;
right:9px;
bottom:68px;
height:48px;
background:#101916;
border-radius:13px;
border-right:3px solid var(--green);
display:none;
align-items:center;
gap:8px;
padding:5px 8px;
z-index:70
}

.reply-compose.show{
display:flex
}

.reply-compose-content{
flex:1;
min-width:0
}

.reply-compose-name{
font-size:10px;
color:var(--green);
font-weight:700
}

.reply-compose-text{
font-size:11px;
color:#aab3af;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.reply-cancel{
width:32px;
height:32px;
border:0;
border-radius:50%;
background:#202a26;
color:#fff
}

/* ================= TOAST ================= */

.toast{
position:fixed;
left:50%;
bottom:90px;
transform:translateX(-50%) translateY(20px);
background:#202824;
color:#fff;
padding:10px 15px;
border-radius:13px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.2s;
z-index:9999;
box-shadow:0 5px 25px rgba(0,0,0,.4)
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0)
}

/* ================= MOBILE ================= */

@media(max-width:430px){
.header{
height:60px;
min-height:60px;
padding:6px 6px
}

.avatar{
width:40px;
height:40px;
min-width:40px
}

.contact-name{
font-size:15px
}

.message{
max-width:84%;
font-size:15px
}

.messages{
padding-left:8px;
padding-right:8px
}

.header-btn{
width:37px;
height:37px
}

.header-actions{
gap:0
}
}
</style>
</head>

<div id="loading">
<div class="loader"></div>

</div>
</div>

</main>

<input id="fileInput" type="file" hidden>

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

return String(value??"")
.replace(/[&<>'"]/g,char=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[char]));

}


function createChatID(a,b){

return [a,b].sort().join("_");

}


function showToast(text){

toast.textContent=text;
toast.classList.add("show");

clearTimeout(showToast.timer);

showToast.timer=setTimeout(()=>{
toast.classList.remove("show");
},2200);

}


function formatTime(timestamp){

if(!timestamp?.toDate)return "";

try{

return timestamp.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}


function getMessagePreview(data){

if(data.type==="text")
return data.text||"رسالة";

if(data.type==="image")
return "صورة";

if(data.type==="video")
return "فيديو";

if(data.type==="voice")
return "رسالة صوتية";

if(data.type==="file")
return data.fileName||"ملف";

return "رسالة";

}


function setAvatar(element,user){

element.innerHTML="";

if(user?.photo){

const img=document.createElement("img");

img.src=user.photo;
img.alt="";
img.referrerPolicy="no-referrer";

img.onerror=()=>{
element.innerHTML="<span>👤</span>";
};

element.appendChild(img);

}else{

element.innerHTML="<span>👤</span>";

}

}

/* =========================================================
   REACTIONS
========================================================= */

const reactionList=[
"❤️",
"👍",
"😂",
"😮",
"🔥",
"😢"
];


async function toggleReaction(messageId,emoji){

if(!currentUser||!chatID)return;

try{

const ref=doc(
db,
"chats",
chatID,
"messages",
messageId
);

const snap=await getDoc(ref);

if(!snap.exists())return;

const data=snap.data();

const reactions=
Array.isArray(data.reactions)
?data.reactions
:[];

const mine=reactions.find(
r=>
r &&
r.userId===currentUser.uid &&
r.emoji===emoji
);

if(mine){

await updateDoc(
ref,
{
reactions:arrayRemove(mine)
}
);

}else{

const old=reactions.find(
r=>r &&
r.userId===currentUser.uid
);

if(old){

await updateDoc(
ref,
{
reactions:arrayRemove(old)
}
);

}

await updateDoc(
ref,
{
reactions:arrayUnion({
userId:currentUser.uid,
emoji
})
}
);

}

}catch(error){

console.error("Reaction error:",error);

}

}


/* =========================================================
   RENDER REACTIONS
========================================================= */

function renderReactions(box,data){

if(
!Array.isArray(data.reactions) ||
!data.reactions.length
)return;

const wrapper=document.createElement("div");

wrapper.className="message-reactions";

const counts={};

for(const reaction of data.reactions){

if(!reaction?.emoji)continue;

if(!counts[reaction.emoji]){

counts[reaction.emoji]={
count:0,
mine:false
};

}

counts[reaction.emoji].count++;

if(reaction.userId===currentUser.uid)
counts[reaction.emoji].mine=true;

}

for(const emoji of reactionList){

const info=counts[emoji];

if(!info)continue;

const chip=document.createElement("button");

chip.type="button";

chip.className=
"reaction-chip"+
(info.mine?" mine":"");

chip.innerHTML=
escapeHtml(emoji)+
(info.count>1
?` <span class="reaction-count">${info.count}</span>`
:"");

chip.onclick=e=>{

e.stopPropagation();

toggleReaction(data.id,emoji);

};

wrapper.appendChild(chip);

}

if(wrapper.children.length)
box.appendChild(wrapper);

}

/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function addMessageActions(element,data){

let timer=null;
let longPressed=false;

element.addEventListener(
"pointerdown",
()=>{

longPressed=false;

timer=setTimeout(()=>{

longPressed=true;

showContextMenu(data);

},500);

},
{passive:true}
);

["pointerup","pointercancel","pointerleave"]
.forEach(event=>{

element.addEventListener(
event,
()=>{
clearTimeout(timer);
}
);

});


let lastClick=0;

element.addEventListener(
"click",
e=>{

if(longPressed)return;

if(
e.target.closest("button") ||
e.target.closest(".message-reply") ||
e.target.closest("video") ||
e.target.closest("img")
)return;

const now=Date.now();

if(now-lastClick<320){

triggerHeart(element,data.id);

}

lastClick=now;

}
);

}


function triggerHeart(element,messageId){

if(element.querySelector(".heart-pop"))
return;

const heart=document.createElement("div");

heart.className="heart-pop";

heart.textContent="♥";

element.appendChild(heart);

toggleReaction(messageId,"❤️");

setTimeout(()=>{
heart.remove();
},650);

}


/* =========================================================
   SWIPE REPLY
========================================================= */

function setupSwipeReply(element,data){

let startX=0;
let currentX=0;
let active=false;

element.addEventListener(
"touchstart",
e=>{

startX=e.touches[0].clientX;
currentX=startX;
active=true;

},
{passive:true}
);

element.addEventListener(
"touchmove",
e=>{

if(!active)return;

currentX=e.touches[0].clientX;

const diff=currentX-startX;

if(
data.senderId!==currentUser.uid &&
diff>0 &&
diff<100
){

element.style.transform=
`translateX(${diff}px)`;

}else if(
data.senderId===currentUser.uid &&
diff<0 &&
diff>-100
){

element.style.transform=
`translateX(${diff}px)`;

}

},
{passive:true}
);

element.addEventListener(
"touchend",
()=>{

if(!active)return;

active=false;

const diff=currentX-startX;

if(Math.abs(diff)>65)
startReply(data);

element.style.transform="";

}
);

}

:"other"
);

const box=document.createElement("div");

box.className="message";

if(

){

box.classList.add("media");

}


/* reply */

if(data.replyTo){

const reply=document.createElement("div");

reply.className="message-reply";

reply.onclick=e=>{

e.stopPropagation();

const target=
messageElements.get(
data.replyTo.messageId
);

if(target){

target.scrollIntoView({
behavior:"smooth",
block:"center"
});

target.classList.add("highlight");

setTimeout(()=>{
target.classList.remove("highlight");
},1500);

}

};

const inner=document.createElement("div");

inner.className="reply-inner";

const name=document.createElement("div");

name.className="reply-name";

data.replyTo.senderId===currentUser.uid
?"أنت"

text.textContent=
data.replyTo.text||"رسالة";

reply.appendChild(inner);

/* text */

if(data.type==="text"){

const text=document.createElement("div");

text.textContent=data.text||"";

box.appendChild(text);

if(data.isEdited){

const edited=document.createElement("span");

edited.style.fontSize="9px";
edited.style.opacity=".55";
edited.textContent=" · معدلة";

box.appendChild(edited);

}


/* image */

else if(
data.type==="image" &&
data.url
){

const img=document.createElement("img");

img.className="message-media";

img.src=data.url;
img.alt="صورة";
img.loading="lazy";
img.referrerPolicy="no-referrer";

img.onclick=e=>{
e.stopPropagation();
window.open(data.url,"_blank","noopener");
};

box.appendChild(img);

}


/* video */

else if(
data.type==="video" &&
data.url
){

const video=document.createElement("video");

video.className="message-media";

video.src=data.url;
video.controls=true;
video.preload="metadata";
video.playsInline=true;

box.appendChild(video);

}


/* file */

else if(data.type==="file"){

const fileButton=document.createElement("button");

fileButton.type="button";

fileButton.style.cssText=
"border:0;background:rgba(0,0,0,.12);padding:10px;border-radius:10px;color:inherit;width:100%;text-align:right";

fileButton.textContent=
"📄 "+(data.fileName||"ملف");

fileButton.onclick=e=>{

e.stopPropagation();

if(data.url)
window.open(data.url,"_blank","noopener");

};

box.appendChild(fileButton);

}


/* voice */

else if(data.type==="voice" && data.url){

const audio=document.createElement("audio");

audio.controls=true;
audio.src=data.url;
audio.style.width="230px";
audio.style.maxWidth="65vw";

box.appendChild(audio);

}


/* meta */

const meta=document.createElement("div");

meta.className="message-meta";

const time=document.createElement("span");

time.className="time";

time.textContent=
formatTime(data.createdAt);

meta.appendChild(time);

if(
data.senderId===currentUser.uid
){

const status=document.createElement("span");

status.className=
"message-status "+
(
data.read
?"read"
:"sent"
);

status.textContent=
data.read
?"✓✓"
:"✓";

meta.appendChild(status);

}

box.appendChild(meta);

renderReactions(box,data);

addMessageActions(box,data);

setupSwipeReply(box,data);

row.appendChild(box);

return row;

}


/* =========================================================
   RENDER SNAPSHOT
========================================================= */

function renderMessages(snapshot){

const wasNearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<
150;

if(
messages.querySelector(".empty")
)
messages.querySelector(".empty").remove();

snapshot.docChanges().forEach(change=>{

const id=change.doc.id;

const data={
...change.doc.data(),
id
};

if(change.type==="removed"){

const old=messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}


/* deleted for me */

if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(currentUser.uid)
){

const old=messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}


/* pinned */

if(data.pinned===true){

pinnedMessageId=id;

pinnedBannerText.textContent=
(
data.senderId===currentUser.uid
?"أنت: "
:""
)+getMessagePreview(data);

pinnedBanner.classList.add("show");

}else if(
pinnedMessageId===id
){

pinnedMessageId=null;

pinnedBanner.classList.remove("show");

}


/* create */

const element=
createMessageElement(data);

const old=
messageElements.get(id);

if(old){

old.replaceWith(element);

}else{

messages.appendChild(element);

}

messageElements.set(id,element);

});


if(!messageElements.size){

messages.innerHTML=
`<div class="empty">💬<br>ابدأ المحادثة الآن</div>`;

}


if(wasNearBottom){

requestAnimationFrame(()=>{

messages.scrollTop=
messages.scrollHeight;

});

}

}


/* =========================================================
   LISTEN MESSAGES
========================================================= */

function listenMessages(){

if(!chatID)return;

if(unsubscribeMessages)
unsubscribeMessages();

const q=query(
collection(
db,
"chats",
chatID,
"messages"
),
orderBy("createdAt","asc")
);

unsubscribeMessages=
onSnapshot(
q,
snapshot=>{

renderMessages(snapshot);

markIncomingMessagesRead(snapshot);

},
error=>{

console.error(error);

showToast(
"تعذر تحميل الرسائل"
);

}
);

}


/* =========================================================
   READ STATUS
========================================================= */

async function markIncomingMessagesRead(snapshot){

if(!currentUser)return;

const batch=writeBatch(db);

let count=0;

snapshot.forEach(docSnap=>{

const data=docSnap.data();

if(
data.senderId===friendUser?.uid &&
data.receiverId===currentUser.uid &&
data.read!==true
){

batch.update(
doc(
db,
"chats",
chatID,
"messages",
docSnap.id
),
{
read:true
}
);

count++;

}

});

if(count){

try{

await batch.commit();

}catch(error){

console.error(
"Read status:",
error
);

}

}

}

   SEND
========================================================= */

messageInput.value.trim().length>0;

sendButton.classList.remove("show");

async function handleSend(){

messageInput.value.trim();

!text ||
!currentUser ||
!friendUser ||
!chatID
)return;

sendButton.disabled=true;

try{

/* edit */

if(editingMessageId){

await updateDoc(
doc(
db,
"chats",
chatID,
"messages",
editingMessageId
),
{
text,
isEdited:true,

);

else{

senderId:currentUser.uid,
receiverId:friendUser.uid,

};

senderId:replyTarget.senderId,

};

collection(
db,
"chats",
chatID,
"messages"
),

);

messageInput.value="";

cancelReply();

updateSendButton();

resizeInput();

}catch(error){

console.error(error);

showToast(
"فشل إرسال الرسالة"
);

}finally{

sendButton.disabled=false;

messageInput.focus();

}

}


sendButton.onclick=handleSend;


messageInput.addEventListener(
"input",
()=>{

updateSendButton();
resizeInput();

}
);


messageInput.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter" &&
!e.shiftKey

/* =========================================================
   MEDIA UPLOAD
========================================================= */

async function uploadMediaAndSend(file,type){

if(
!file ||
!currentUser ||
!friendUser ||
!chatID
)return;

try{

showToast("جارٍ رفع الملف...");

const safeName=
String(file.name||"file")
.replace(/[^a-zA-Z0-9._-]/g,"_");

const fileName=
`${currentUser.uid}/${Date.now()}_${safeName}`;

const result=
await supabase.storage
.from("mecd-media")
.upload(
fileName,
file,
{
upsert:false,
cacheControl:"3600"
}
);

if(result.error)
throw result.error;

const publicResult=
supabase.storage
.from("mecd-media")
.getPublicUrl(fileName);

const url=
publicResult?.data?.publicUrl;

if(!url)
throw new Error("URL unavailable");

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
{
url,
fileName:safeName,
senderId:currentUser.uid,
receiverId:friendUser.uid,
type,

async function startVoice(){

typeof window.startVoice==="function"
){

chatID,
currentUser,
friendUser,
db,
supabase
});

}

window.Voice &&
typeof window.Voice.start==="function"
){

await window.Voice.start({
chatID,
currentUser,
friendUser,
db,
supabase
});

return;

}

if(
window.VoiceRecorder &&
typeof window.VoiceRecorder.start==="function"
){

chatID,
currentUser,
friendUser,
db,
supabase
});

return;

}

showToast(
"ملف Voice غير مربوط بهذه الصفحة"
);

}catch(error){

console.error(
"Voice error:",
error
);

showToast(

);

}

}

/* =========================================================
   CLEAR CHAT
========================================================= */

async function clearChat(){

if(!currentUser||!chatID)return;

try{

const q=query(
collection(
db,
"chats",
chatID,
"messages"
),
orderBy("createdAt","asc")
);

const snap=await new Promise(
(resolve,reject)=>{

const unsub=onSnapshot(
q,
s=>{
unsub();
resolve(s);
},
reject
);

}
);

const batch=writeBatch(db);

let count=0;

snap.forEach(d=>{

const data=d.data();

if(data.senderId===currentUser.uid){

batch.delete(d.ref);

}else{

batch.update(
d.ref,
{
deletedFor:
arrayUnion(currentUser.uid)
}
);

}

count++;

});

if(count)
await batch.commit();

showToast("تم مسح المحادثة");

}catch(error){

console.error(error);

showToast("تعذر مسح المحادثة");

}

}

/* =========================================================
   FRIEND
========================================================= */

async function loadFriend(){

const params=
new URLSearchParams(
location.search
);

const friendId=
params.get("friend");

if(!friendId)
throw new Error(
"لا يوجد معرف المستخدم في الرابط"
);

if(
friendId===currentUser.uid
)
throw new Error(
"لا يمكنك فتح محادثة مع نفسك"
);

const snap=
await getDoc(
doc(db,"users",friendId)
);

if(!snap.exists())
throw new Error(
"المستخدم غير موجود"
);

const data=snap.data();

friendUser={
uid:friendId,
name:
data.name||
data.displayName||
data.username||
"مستخدم",
photo:
data.photo||
data.photoURL||
"",
online:
data.online===true,
lastSeen:
data.lastSeen||null
};

friendName.textContent=
friendUser.name;

setAvatar(
friendAvatar,
friendUser
);

chatID=
createChatID(
currentUser.uid,
friendUser.uid
);

listenFriendStatus(friendId);

}


function listenFriendStatus(friendId){

if(unsubscribeFriend)
unsubscribeFriend();

const ref=
doc(
db,
"users",
friendId
);

unsubscribeFriend=
onSnapshot(
ref,
snap=>{

if(!snap.exists())return;

const data=snap.data();

friendUser.online=
data.online===true;

friendUser.lastSeen=
data.lastSeen||null;

updateFriendStatus();

},
error=>{

console.error(
"Status error:",
error
);

}
);

}


function updateFriendStatus(){

if(!friendUser)return;

if(friendUser.online){

friendStatus.textContent=
"متصل الآن";

friendStatus.className=
"contact-status online";

return;

}

if(friendUser.lastSeen?.toDate){

const date=
friendUser.lastSeen.toDate();

friendStatus.textContent=
"آخر ظهور "+
date.toLocaleString(
"ar",
{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}else{

friendStatus.textContent=
"غير متصل";

friendStatus.className=
"contact-status";

}

}


/* =========================================================
   CURRENT USER PRESENCE
========================================================= */

async function setPresence(){

if(!currentUser)return;

const ref=
doc(
db,
"users",
currentUser.uid
);

try{

await setDoc(
ref,
{
online:true,
lastSeen:serverTimestamp()
},
{
merge:true
}
);

}catch(error){

console.error(
"Presence error:",
error
);

}

}


function updateOffline(){

if(!currentUser)return;

updateDoc(
doc(
db,
"users",
currentUser.uid
),
{
online:false,
lastSeen:serverTimestamp()
}
).catch(()=>{});

}


document.addEventListener(
"visibilitychange",
()=>{

if(document.visibilityState==="visible"){

setPresence();

}else{

updateOffline();

}

}
);

window.addEventListener(
"beforeunload",
updateOffline
);
