<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   APP
========================================================= */

.app{
    height:100vh;
    max-width:650px;
    margin:auto;

    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

header{
    height:75px;

    display:flex;
    align-items:center;

    gap:12px;

    padding:12px 15px;

    background:#050807;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    flex-shrink:0;
}

.back{
    width:45px;
    height:45px;

    border:0;
    border-radius:15px;

    background:#18231f;
    color:white;

    font-size:22px;

    cursor:pointer;
}

.avatar{
    width:48px;
    height:48px;

    border-radius:16px;

    background:#12352c;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:24px;

    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:17px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:12px;

    color:#777;

    margin-top:5px;

    transition:.2s;
}

.user-status.online{
    color:#00e889;
}

.user-status.typing{
    color:#00e889;
    font-weight:bold;
}

.call-buttons{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.call-buttons button{
    width:42px;
    height:42px;

    border:0;
    border-radius:14px;

    background:#18231f;
    color:white;

    font-size:18px;

    cursor:pointer;
}

.call-buttons button:active{
    transform:scale(.94);
}


/* =========================================================
   MESSAGES
========================================================= */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:
        20px
        15px
        150px;

    display:flex;
    flex-direction:column;

    gap:10px;
}

.empty{
    margin:auto;

    text-align:center;

    color:#72817c;
}

.message{
    max-width:78%;

    padding:12px 15px;

    border-radius:18px;

    position:relative;

    word-break:break-word;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.message.mine{
    align-self:flex-start;

    background:#00c96b;

    color:#00150e;

    border-bottom-left-radius:5px;
}

.message.other{
    align-self:flex-end;

    background:#18231f;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-right-radius:5px;
}

.time{
    display:inline-block;

    font-size:9px;

    opacity:.6;

    margin-top:5px;
}

.message-meta{
    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:5px;

    margin-top:5px;
}

.message-status{
    font-size:12px;

    line-height:1;

    font-weight:bold;

    letter-spacing:-3px;

    direction:ltr;

    display:inline-block;

    min-width:16px;
}

.message-status.sent{
    opacity:.65;
}

.message-status.read{
    color:#006dff;
    opacity:1;
}


/* =========================================================
   INPUT
========================================================= */

.input-area{
    position:fixed;

    bottom:0;
    left:50%;

    transform:translateX(-50%);

    width:100%;
    max-width:650px;

    padding:10px;

    display:flex;

    gap:8px;

    background:#050807;

    z-index:50;
}

#messageInput{
    flex:1;

    min-width:0;

    padding:14px;

    border-radius:17px;

    border:
        1px solid
        #27332f;

    background:#111916;

    color:white;

    outline:none;

    font-size:15px;
}

#messageInput:focus{
    border-color:#00e889;
}

#voiceButton,
#sendButton{
    width:50px;
    height:50px;

    border:0;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;

    flex-shrink:0;
}

#voiceButton{
    background:#18231f;
    color:white;
}

#voiceButton.recording{
    background:#d83b3b;

    animation:
        recordingPulse
        1s infinite;
}

#sendButton{
    background:#00e889;
    color:#00150e;
}

#sendButton:disabled{
    opacity:.6;
}

@keyframes recordingPulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.06);
    }

    100%{
        transform:scale(1);
    }

}


/* =========================================================
   MESSAGE MENU
========================================================= */

.message-menu{
    position:absolute;

    left:50%;
    bottom:calc(100% + 8px);

    transform:translateX(-50%);

    min-width:150px;

    padding:5px;

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    border-radius:15px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.55);

    z-index:99999;
}

.message-menu button{
    width:100%;

    padding:10px 14px;

    border:0;

    border-radius:11px;

    background:#18231f;

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================================================
   CALL MESSAGE
========================================================= */

.call-message{
    min-width:245px;
    max-width:310px;

    padding:10px 12px !important;
}

.call-box{
    display:flex;

    align-items:center;

    gap:11px;
}

.call-icon{
    width:46px;
    height:46px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,232,137,.14);

    color:#00e889;

    font-size:22px;

    flex-shrink:0;
}

.call-info{
    min-width:0;
    flex:1;
}

.call-title{
    font-size:14px;
    font-weight:bold;
}

.call-subtitle{
    font-size:11px;

    margin-top:4px;
}

.call-duration{
    font-size:11px;

    margin-top:4px;

    opacity:.75;
}

audio{
    max-width:100%;

/* =========================================================
   CALL OVERLAY
========================================================= */

    inset:0;

    background:

    justify-content:center;

.call-card{

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

.call-avatar{
    width:120px;
    height:120px;

    border-radius:32px;

    background:#12352c;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:50px;

    box-shadow:

}

.call-avatar img{
    width:100%;
    height:100%;

}

#callName{

    font-weight:bold;

#callState{
    color:#00e889;

    font-size:14px;

    margin-top:8px;

    min-height:20px;
}


/* =========================================================
   VIDEO
========================================================= */

#videoArea{
    width:100%;
    height:min(70vh,520px);

    display:none;

    position:relative;

    margin-top:15px;

    border-radius:24px;

    overflow:hidden;

    background:#000;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.55);
}

#remoteVideo{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;

    z-index:1;

    cursor:pointer;
}

#localVideo{
    position:absolute;

    width:115px;
    height:165px;

    left:15px;
    bottom:15px;

    object-fit:cover;

    border-radius:18px;

    border:
        2px solid
        #00e889;

    background:#000;

    z-index:5;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.5);

    transition:
        all .25s ease;
}


/*
   عند التبديل:
   فيديو المستخدم يصبح كبيرًا
   والطرف الآخر يصبح صغيرًا
*/

#videoArea.swapped #localVideo{
    inset:0;

    width:100%;
    height:100%;

    border:0;

    border-radius:0;

    z-index:1;
}

#videoArea.swapped #remoteVideo{
    width:115px;
    height:165px;

    left:15px;
    right:auto;

    top:auto;
    bottom:15px;

    border-radius:18px;

    border:
        2px solid
        #00e889;

    z-index:5;
}


/* =========================================================
   CALL BUTTONS
========================================================= */

.call-actions{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:16px;

    margin-top:25px;

    direction:ltr;
}

.call-actions button{
    width:62px;
    height:62px;

    border:0;

    border-radius:50%;

    font-size:24px;

    cursor:pointer;

    background:#18231f;

    color:white;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

    transition:.2s;
}

.call-actions button:active{
    transform:scale(.90);
}

.call-actions .accept{
    background:#00e889;
    color:#00150e;
}

.call-actions .reject{
    background:#e83b3b;
    color:white;
}

.call-actions .end{
    background:#e83b3b;
    color:white;
}

.call-actions .active{
    background:#00e889;
    color:#00150e;
}


/* =========================================================
   SMALL STATUS
========================================================= */

#callNotice{
    display:none;

    margin-top:12px;

    color:#888;

    font-size:12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .message{
        max-width:84%;
    }

    header{
        padding:12px;
    }

    .call-buttons button{
        width:40px;
        height:40px;
    }

    .call-message{
        min-width:225px;
        max-width:85%;
    }

    #videoArea{
        height:65vh;
        border-radius:20px;
    }

    #localVideo,
    #videoArea.swapped #remoteVideo{
        width:95px;
        height:135px;

        left:10px;
        bottom:10px;

        border-radius:15px;
    }

    #videoArea.swapped #localVideo{
        width:100%;
        height:100%;
    }

    .call-actions{
        gap:12px;
    }

    .call-actions button{
        width:56px;
        height:56px;
    }

}


/* =========================================================
   CALL TYPE
========================================================= */

.calling .call-avatar{
    animation:
        callPulse
        1.5s infinite;
}

@keyframes callPulse{

    0%{
        box-shadow:
            0 0 0
            rgba(0,232,137,.1);
    }

    50%{
        box-shadow:
            0 0 35px
            rgba(0,232,137,.35);
    }

    100%{
        box-shadow:
            0 0 0
            rgba(0,232,137,.1);
    }

}

/* =========================================================

function createChatID(
    a,
    b
){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /[&<>'"]/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            "'":"&#39;",
            '"':"&quot;"
        }[c])
    );

}


function formatDuration(
    seconds
){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(
                    seconds || 0
                )
            )
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    return (
        String(
            minutes
        ).padStart(2,"0")
        +
        ":"
        +
        String(
            secs
        ).padStart(2,"0")
    );

}


function formatTime(
    timestamp
){

    if(
        !timestamp ||
        !timestamp.toDate
    ){

        return "";

    }

    return timestamp
        .toDate()
        .toLocaleTimeString(
            "ar",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}

/* =========================================================
   PRESENCE
========================================================= */

async function updateMyPresence(
    online = true
){

    if(!currentUser)
        return;

    try{

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {
                online,

                lastSeen:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Presence:",
            error
        );

    }

}


function startPresence(){

    updateMyPresence(
        true
    );

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        setInterval(
            () => {

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    updateMyPresence(
                        true
                    );

                }

            },
            10000
        );

}


async function stopPresence(){

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        null;

    await updateMyPresence(
        false
    );

}

async function loadFriend(){

    const params =
        new URLSearchParams(
            location.search
        );

    const id =
        params.get(
            "friend"
        );


    /*
       مهم:
       إذا لم يوجد friend في الرابط
       لا نوقف الصفحة.
    */

    if(!id){

        friendUser =
            null;

        friendName.textContent =
            "Mecd Chat";

        friendStatus.textContent =
            "● متصل";

        friendAvatar.innerHTML =
            "👤";

        return;

    }


    if(
        currentUser &&
        id === currentUser.uid
    ){

        throw new Error(
            "لا يمكنك فتح محادثة مع نفسك"
        );

    }


    const userDoc =
        await getDoc(

            doc(
                db,
                "users",
                id
            )

        );


    if(!userDoc.exists()){

        throw new Error(
            "المستخدم غير موجود"
        );

    }


    const data =
        userDoc.data();


    friendUser = {

        uid:id,

        name:
            data.name ||
            "مستخدم Mecd",

        photo:
            data.photo ||
            ""

    };


    friendName.textContent =
        friendUser.name;


    if(
        friendUser.photo
    ){

        friendAvatar.innerHTML = `

            <img
                src="${escapeHtml(
                    friendUser.photo
                )}"
                alt="">

        `;

    }else{

        friendAvatar.innerHTML =
            "👤";

    }


    chatID =
        createChatID(
            currentUser.uid,
            friendUser.uid
        );


    window.chatID =
        chatID;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friendUser;


    await setDoc(

        doc(
            db,
            "chats",
            chatID
        ),

        {

            members:[
                currentUser.uid,
                friendUser.uid
            ],

            createdAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );


    listenFriendStatus();

    listenFriendTyping();

}


/* =========================================================
   FRIEND STATUS
========================================================= */

function listenFriendStatus(){

    if(
        !friendUser
    )
        return;


    if(
        unsubscribeFriendStatus
    ){

        unsubscribeFriendStatus();

    }


    unsubscribeFriendStatus =
        onSnapshot(

            doc(
                db,
                "users",
                friendUser.uid
            ),

            snap => {

                if(
                    !snap.exists()
                ){

                    setFriendOffline();

                    return;

                }


                const data =
                    snap.data();


                const last =
                    data.lastSeen
                    ?.toMillis?.() || 0;


                const online =
                    data.online === true &&
                    last > 0 &&
                    Date.now() - last < 30000;


                if(
                    !friendStatus.classList
                        .contains(
                            "typing"
                        )
                ){

                    friendStatus.textContent =
                        online
                        ? "● متصل"
                        : "● غير متصل";

                }


                friendStatus.classList.toggle(
                    "online",
                    online
                );

            },

            error => {

                console.error(
                    "Friend status:",
                    error
                );

            }

        );

}


function setFriendOffline(){

    friendStatus.textContent =
        "● غير متصل";

    friendStatus.classList.remove(
        "online"
    );

}


/* =========================================================
   TYPING + RECORDING STATUS
========================================================= */

function listenFriendTyping(){

    if(
        !friendUser ||
        !chatID
    )
        return;


    if(
        unsubscribeFriendTyping
    ){

        unsubscribeFriendTyping();

    }


    unsubscribeFriendTyping =
        onSnapshot(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                friendUser.uid
            ),

            snap => {

                if(
                    !snap.exists()
                ){

                    setFriendActivity(
                        "normal"
                    );

                    return;

                }


                const data =
                    snap.data();


                const time =
                    data.updatedAt
                    ?.toMillis?.() || 0;


                const fresh =
                    !time ||
                    Date.now() - time < 6000;


                if(
                    !fresh
                ){

                    setFriendActivity(
                        "normal"
                    );

                    return;

                }


                if(
                    data.recording === true
                ){

                    setFriendActivity(
                        "recording"
                    );

                }else if(
                    data.typing === true
                ){

                    setFriendActivity(
                        "typing"
                    );

                }else{

                    setFriendActivity(
                        "normal"
                    );

                }

            },

            error => {

                console.error(
                    "Typing:",
                    error
                );

            }

        );

}


function setFriendActivity(
    type
){

    if(
        type === "recording"
    ){

        friendStatus.textContent =
            "🎙️ يسجل...";

        friendStatus.classList.add(
            "typing"
        );

        friendStatus.classList.remove(
            "online"
        );

        return;

    }


    if(
        type === "typing"
    ){

        friendStatus.textContent =
            "يكتب...";

        friendStatus.classList.add(
            "typing"
        );

        friendStatus.classList.remove(
            "online"
        );

        return;

    }


    friendStatus.classList.remove(
        "typing"
    );

    listenFriendStatus();

}


async function updateMyActivity(
    typing,
    recording
){

    if(
        !currentUser ||
        !chatID
    )
        return;


    try{

        await setDoc(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                currentUser.uid
            ),

            {

                typing:
                    Boolean(
                        typing
                    ),

                recording:
                    Boolean(
                        recording
                    ),

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Activity:",
            error
        );

    }

}

function createStatus(
    data
){

    if(
        data.senderId !==
        currentUser.uid
    )
        return null;


    const span =
        document.createElement(
            "span"
        );


    span.className =
        "message-status " +
        (
            data.read === true
            ? "read"
            : "sent"
        );


    span.textContent =
        data.read === true
        ? "✓✓"
        : "✓";


    return span;

}


function createCallMessage(
    box,
    data
){

    box.classList.add(
        "call-message"
    );


    const callBox =
        document.createElement(
            "div"
        );

    callBox.className =
        "call-box";


    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "call-icon";


    icon.textContent =
        data.callType === "video"
        ? "📹"
        : "📞";


    const info =
        document.createElement(
            "div"
        );

    info.className =
        "call-info";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "call-title";


    const incoming =
        data.callerId !==
        currentUser.uid;


    if(
        data.callStatus ===
        "missed"
    ){

        title.textContent =
            "مكالمة لم يتم الرد عليها";

    }else if(
        data.callStatus ===
        "rejected"
    ){

        title.textContent =
            "مكالمة لم يتم الرد عليها";

    }else{

        title.textContent =
            incoming
            ? "مكالمة واردة"
            : "مكالمة صادرة";

    }


    const subtitle =
        document.createElement(
            "div"
        );

    subtitle.className =
        "call-subtitle";


    subtitle.textContent =
        data.callType === "video"
        ? "مكالمة فيديو"
        : "مكالمة صوتية";


    const duration =
        document.createElement(
            "div"
        );

    duration.className =
        "call-duration";


    duration.textContent =
        "⏱️ " +
        formatDuration(
            data.duration || 0
        );


    info.appendChild(
        title
    );

    info.appendChild(
        subtitle
    );

    info.appendChild(
        duration
    );


    callBox.appendChild(
        icon
    );

    callBox.appendChild(
        info
    );


    box.appendChild(
        callBox
    );

}

    id,
    data
){

    if(
        !currentUser ||
        data.senderId ===
        currentUser.uid ||
        data.read === true
    )
        return;


    try{

        await updateDoc(

            doc(
                db,
                "chats",
                chatID,
                "messages",
                id
            ),

            {

                read:true,

                readAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "Read:",
            error
        );

    }

}


function addMessageActions(
    element,
    id,
    mine
){

    let timer =
        null;


    const cancel =
        () => {

            clearTimeout(
                timer
            );

            timer =
                null;

        };


    element.addEventListener(
        "pointerdown",
        e => {

            if(
                e.target.closest(
                    ".message-menu"
                )
            )
                return;


            cancel();


            timer =
                setTimeout(
                    showMenu,
                    500
                );

        }
    );


    element.addEventListener(
        "pointerup",
        cancel
    );


    element.addEventListener(
        "pointercancel",
        cancel
    );


    element.addEventListener(
        "pointerleave",
        cancel
    );


    element.addEventListener(
        "contextmenu",
        e => {

            e.preventDefault();

            showMenu();

        }
    );


    function showMenu(){

        removeMenus();


        const menu =
            document.createElement(
                "div"
            );

        menu.className =
            "message-menu";


        const button =
            document.createElement(
                "button"
            );


        button.textContent =
            mine
            ? "🗑️ إلغاء الإرسال"
            : "🗑️ حذف لدي";


        button.onclick =
            async e => {

                e.stopPropagation();


                try{

                    const ref =
                        doc(
                            db,
                            "chats",
                            chatID,
                            "messages",
                            id
                        );


                    if(
                        mine
                    ){

                        await deleteDoc(
                            ref
                        );

                    }else{

                        await updateDoc(

                            ref,

                            {

                                deletedFor:
                                    arrayUnion(
                                        currentUser.uid
                                    )

                            }

                        );

                    }


                    removeMenus();

                }catch(error){

                    console.error(
                        error
                    );

                }

            };


        menu.appendChild(
            button
        );


        element.appendChild(
            menu
        );

    }

}


function removeMenus(){

    document
        .querySelectorAll(
            ".message-menu"
        )
        .forEach(
            x => x.remove()
        );

}


document.addEventListener(
    "pointerdown",
    e => {

        if(
            !e.target.closest(
                ".message-menu"
            )
        ){

            removeMenus();

        }

    }
);


function renderMessages(
    snap
){

    if(
        !renderMessages.elements
    ){

        renderMessages.elements =
            new Map();

    }


    const elements =
        renderMessages.elements;


    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight
        <
        120;


    snap.docChanges()
        .forEach(
            change => {

                const id =
                    change.doc.id;

                const data =
                    change.doc.data();


                if(
                    change.type ===
                    "added" ||
                    change.type ===
                    "modified"
                ){

                    if(
                        data.senderId !==
                        currentUser.uid
                    ){

                        markRead(
                            id,
                            data
                        );

                    }

                }


                if(
                    change.type ===
                    "removed"
                ){

                    const old =
                        elements.get(
                            id
                        );


                    if(old){

                        old.remove();

                        elements.delete(
                            id
                        );

                    }

                    return;

                }


                if(
                    Array.isArray(
                        data.deletedFor
                    ) &&
                    data.deletedFor.includes(
                        currentUser.uid
                    )
                ){

                    const old =
                        elements.get(
                            id
                        );


                    if(old){

                        old.remove();

                        elements.delete(
                            id
                        );

                    }

                    return;

                }


                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "message " +
                    (
                        data.senderId ===
                        currentUser.uid
                        ? "mine"
                        : "other"
                    );


                if(
                    data.type ===
                    "call"
                ){

                    createCallMessage(
                        box,
                        data
                    );

                }else if(
                    data.type ===
                    "voice"
                ){

                    const audio =
                        document.createElement(
                            "audio"
                        );

                    audio.controls =
                        true;

                    audio.src =
                        data.audio ||
                        "";

                    box.appendChild(
                        audio
                    );

                }else{

                    box.appendChild(

                        document.createTextNode(
                            data.text ||
                            ""
                        )

                    );

                }


                const meta =
                    document.createElement(
                        "span"
                    );

                meta.className =
                    "message-meta";


                const time =
                    document.createElement(
                        "span"
                    );

                time.className =
                    "time";


                time.textContent =
                    formatTime(
                        data.createdAt
                    );


                meta.appendChild(
                    time
                );


                const status =
                    createStatus(
                        data
                    );


                if(status)
                    meta.appendChild(
                        status
                    );


                box.appendChild(
                    meta
                );


                if(
                    data.type !==
                    "call"
                ){

                    addMessageActions(
                        box,
                        id,
                        data.senderId ===
                        currentUser.uid
                    );

                }


                const old =
                    elements.get(
                        id
                    );


                if(old){

                    old.replaceWith(
                        box
                    );

                }else{

                    messages.appendChild(
                        box
                    );

                }


                elements.set(
                    id,
                    box
                );

            }
        );


    const all =
        messages.querySelectorAll(
            ".message"
        );


    let empty =
        messages.querySelector(
            ".empty"
        );


    if(
        all.length === 0
    ){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.innerHTML =
                "💬<br>ابدأ المحادثة الآن";

            messages.appendChild(
                empty
            );

        }

    }else{

        empty?.remove();

    }


    if(
        nearBottom
    ){

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }

}


function listenMessages(){

    if(
        !chatID
    )
        return;


    const ref =
        collection(
            db,
            "chats",
            chatID,
            "messages"
        );


    const q =
        query(
            ref,
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            renderMessages,

            error => {

                console.error(
                    "Messages:",
                    error
                );

            }

        );

}

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(
        !text ||
        !currentUser ||
        !friendUser ||
        !chatID
    )
        return;


    sendButton.disabled =
        true;


    clearTimeout(
        typingTimer
    );


    await updateMyActivity(
        false,
        false
    );


    try{

        await addDoc(

            collection(
                db,
                "chats",
                chatID,
                "messages"
            ),

            {

                text,

                senderId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                type:
                    "text",

                read:false,

                createdAt:
                    serverTimestamp()

            }

        );


        messageInput.value =
            "";

        messageInput.focus();


    }catch(error){

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء إرسال الرسالة"
        );

    }


    sendButton.disabled =
        false;

}


sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    e => {

        if(
            e.key ===
            "Enter"
        ){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   VOICE RECORDING
========================================================= */

voiceButton.addEventListener(
    "click",
    async () => {

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            alert(
                "المتصفح لا يدعم التسجيل الصوتي"
            );

            return;

        }


        /*
           إذا كان يسجل:
           أوقف التسجيل.
        */

        if(
            mediaRecorder
        ){

            mediaRecorder.stop();

            return;

        }


        try{

            recordingStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({
                        audio:true
                    });


            audioChunks =
                [];


            mediaRecorder =
                new MediaRecorder(
                    recordingStream
                );


            mediaRecorder.ondataavailable =
                e => {

                    if(
                        e.data.size > 0
                    ){

                        audioChunks.push(
                            e.data
                        );

                    }

                };


            mediaRecorder.onstart =
                () => {

                    voiceButton
                        .classList
                        .add(
                            "recording"
                        );

                    voiceButton.textContent =
                        "⏹️";


                    /*
                       يظهر للطرف الآخر:
                       🎙️ يسجل...
                    */

                    updateMyActivity(
                        false,
                        true
                    );

                };


            mediaRecorder.onstop =
                async () => {

                    voiceButton
                        .classList
                        .remove(
                            "recording"
                        );

                    voiceButton.textContent =
                        "🎤";


                    if(
                        recordingStream
                    ){

                        recordingStream
                            .getTracks()
                            .forEach(
                                track =>
                                    track.stop()
                            );

                    }


                    recordingStream =
                        null;


                    /*
                       إخفاء حالة يسجل
                    */

                    await updateMyActivity(
                        false,
                        false
                    );


                    const mime =
                        mediaRecorder.mimeType ||
                        "audio/webm";


                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:mime
                            }
                        );


                    const reader =
                        new FileReader();


                    reader.onload =
                        async () => {

                            const audio =
                                reader.result;


                            /*
                               Firestore مناسب فقط
                               للتسجيلات الصغيرة.
                            */

                            if(
                                audio.length >
                                900000
                            ){

                                alert(
                                    "التسجيل طويل جدًا، حاول تسجيل مقطع أقصر."
                                );

                                mediaRecorder =
                                    null;

                                return;

                            }


                            try{

                                await addDoc(

                                    collection(
                                        db,
                                        "chats",
                                        chatID,
                                        "messages"
                                    ),

                                    {

                                        audio,

                                        senderId:
                                            currentUser.uid,

                                        receiverId:
                                            friendUser.uid,

                                        type:
                                            "voice",

                                        read:false,

                                        createdAt:
                                            serverTimestamp()

                                    }

                                );

                            }catch(error){

                                console.error(
                                    error
                                );

                                alert(
                                    "تعذر إرسال التسجيل"
                                );

                            }


                            mediaRecorder =
                                null;

                        };


                    reader.readAsDataURL(
                        blob
                    );

                };


            mediaRecorder.start();

        }catch(error){

            console.error(
                error
            );


            await updateMyActivity(
                false,
                false
            );


            alert(
                "يجب السماح باستخدام الميكروفون"
            );

        }

    }
);

   PEER
========================================================= */

function createPeer(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onicecandidate =
        async event => {

            if(
                !event.candidate ||
                !activeCallId ||
                !currentUser
            )
                return;


            try{

                await addDoc(

                    collection(
                        db,
                        "calls",
                        activeCallId,
                        "candidates"
                    ),

                    {

                        senderId:
                            currentUser.uid,

                        candidate:
                            event.candidate.toJSON()

                    }

                );

            }catch(error){

                console.error(
                    "ICE:",
                    error
                );

            }

        };


    pc.ontrack =
        event => {

            if(
                event.streams &&
                event.streams[0]
            ){

                remoteVideo.srcObject =
                    event.streams[0];


                remoteVideo.muted =
                    remoteAudioMuted;

            }

        };


    pc.onconnectionstatechange =
        async () => {

            const state =
                pc.connectionState;


            console.log(
                "WebRTC:",
                state
            );


            if(
                state ===
                "connected"
            ){

                if(
                    !activeCallConnected
                ){

                    showConnectedUI();

                    startCallTimer();

                }

            }


            if(
                state ===
                "failed"
            ){

                callState.textContent =
                    "تعذر الاتصال";

            }


            if(
                state ===
                "disconnected"
            ){

                callState.textContent =
                    "انقطع الاتصال";

            }

        };


    return pc;

}


/* =========================================================
   START CALL
========================================================= */

async function startCall(
    type
){

    if(
        !currentUser ||
        !friendUser
    ){

        alert(
            "افتح محادثة مع صديق أولاً"
        );

        return;

    }


    if(
        activeCallId
    ){

        alert(
            "لديك مكالمة نشطة حالياً"
        );

        return;

    }


    activeCallType =
        type;

    activeCallRole =
        "caller";

    activeCallPeer =
        {
            ...friendUser
        };


    activeCallId =
        crypto.randomUUID();


    showCallOverlay(
        type,
        "caller"
    );


    try{

        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        type ===
                        "video"

                });


        if(
            type ===
            "video"
        ){

            localVideo.srcObject =
                localStream;

            localVideo.muted =
                true;

            videoArea.style.display =
                "block";

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        await setDoc(
            callRef,
            {

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callerName:
                    currentUser.displayName ||
                    currentUser.email ||
                    "مستخدم Mecd",

                receiverName:
                    friendUser.name,

                callType:
                    type,

                status:
                    "ringing",

                createdAt:
                    serverTimestamp()

            }
        );


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(

            callRef,

            {

                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }

            }

        );


        listenActiveCallAsCaller();


        /*
           إذا لم يرد خلال 30 ثانية
           تصبح مكالمة فائتة.
        */

        callTimeout =
            setTimeout(
                () => {

                    if(
                        activeCallId &&
                        !activeCallConnected
                    ){

                        finishCall(
                            "missed"
                        );

                    }

                },
                30000
            );


    }catch(error){

        console.error(
            "Start call:",
            error
        );


        alert(
            "تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
        );


        await finishCall(
            "missed"
        );

    }

}


/* =========================================================
   CALLER LISTENER
========================================================= */

function listenActiveCallAsCaller(){

    if(
        unsubscribeActiveCall
    )
        unsubscribeActiveCall();


    if(
        unsubscribeActiveCandidates
    )
        unsubscribeActiveCandidates();


    const callRef =
        doc(
            db,
            "calls",
            activeCallId
        );


    unsubscribeActiveCall =
        onSnapshot(

            callRef,

            async snap => {

                if(
                    !snap.exists()
                )
                    return;


                const data =
                    snap.data();


                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection
                        .currentRemoteDescription
                ){

                    try{

                        await peerConnection
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data.answer
                                )
                            );

                    }catch(error){

                        console.error(
                            "Remote answer:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "connected" &&
                    !activeCallConnected
                ){

                    /*
                       لا نعتمد فقط على
                       connectionstate.
                    */

                    startCallTimer();

                }


                if(
                    data.status ===
                    "ended" ||
                    data.status ===
                    "rejected" ||
                    data.status ===
                    "missed"
                ){

                    cleanupCall();

                }

            }

        );


    unsubscribeActiveCandidates =
        onSnapshot(

            collection(
                db,
                "calls",
                activeCallId,
                "candidates"
            ),

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.senderId ===
                                currentUser.uid
                            )
                                return;


                            if(
                                peerConnection &&
                                data.candidate
                            ){

                                peerConnection
                                    .addIceCandidate(
                                        new RTCIceCandidate(
                                            data.candidate
                                        )
                                    )
                                    .catch(
                                        console.error
                                    );

                            }

                        }
                    );

            }

        );

}


/* =========================================================
   INCOMING CALLS
========================================================= */

function listenIncomingCalls(){

    if(
        !currentUser
    )
        return;


    if(
        unsubscribeIncomingCalls
    ){

        unsubscribeIncomingCalls();

    }


    /*
       هذا هو الإصلاح الأساسي للمشكلة A/B/C.

       لن نراقب كل المكالمات.
       فقط المكالمات التي receiverId
       يساوي المستخدم الحالي.
    */

    const callsRef =
        collection(
            db,
            "calls"
        );


    const q =
        query(

            callsRef,

            where(
                "receiverId",
                "==",
                currentUser.uid
            )

        );


    unsubscribeIncomingCalls =
        onSnapshot(

            q,

            snap => {

                snap.docChanges()
                    .forEach(
                        async change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.status !==
                                "ringing"
                            )
                                return;


                            if(
                                activeCallId
                            )
                                return;


                            /*
                               تأكيد إضافي:
                               الاتصال موجه لي أنا.
                            */

                            if(
                                data.receiverId !==
                                currentUser.uid
                            )
                                return;


                            activeCallId =
                                change.doc.id;


                            activeCallType =
                                data.callType ||
                                "audio";


                            activeCallRole =
                                "receiver";


                            /*
                               هنا نستخدم callerId
                               وليس friendUser.

                               لذلك إذا كنت في محادثة B
                               واتصل C:
                               سيظهر اسم C
                               والمكالمة ستكون C ↔ A.
                            */

                            activeCallPeer =
                                await getUserById(
                                    data.callerId
                                );


                            showCallOverlay(

                                activeCallType,

                                "receiver"

                            );


                            listenIncomingCallData();

                        }
                    );

            },

            error => {

                console.error(
                    "Incoming calls:",
                    error
                );

            }

        );

}

========================================================= */

async function acceptIncomingCall(){

    if(
        !activeCallId ||
        !activeCallPeer
    )
        return;


    try{

        acceptCallButton.style.display =
            "none";

        rejectCallButton.style.display =
            "none";


        callState.textContent =
            "جارٍ الاتصال...";


        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        const snap =
            await getDoc(
                callRef
            );


        if(
            !snap.exists()
        ){

            throw new Error(
                "المكالمة غير موجودة"
            );

        }


        const data =
            snap.data();


        if(
            data.status !==
            "ringing"
        ){

            throw new Error(
                "انتهت المكالمة"
            );

        }


        localStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        activeCallType ===
                        "video"

                });


        if(
            activeCallType ===
            "video"
        ){

            localVideo.srcObject =
                localStream;

            localVideo.muted =
                true;

            videoArea.style.display =
                "block";

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        await peerConnection
            .setRemoteDescription(

                new RTCSessionDescription(
                    data.offer
                )

            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(

            callRef,

            {

                answer:{
                    type:
                        answer.type,

                    sdp:
                        answer.sdp
                },

                status:
                    "connected"

            }

        );


        listenIncomingCandidates();


        showConnectedUI();

        startCallTimer();


    }catch(error){

        console.error(
            "Accept:",
            error
        );


        alert(
            "تعذر قبول المكالمة"
        );


        await finishCall(
            "missed"
        );

    }

}

async function addCallHistory(
    status,
    duration
){

    if(
        !activeCallId ||
        !activeCallPeer?.uid
    )
        return;


    const peerId =
        activeCallPeer.uid;


    const historyChatID =
        createChatID(
            currentUser.uid,
            peerId
        );


    try{

        await addDoc(

            collection(
                db,
                "chats",
                historyChatID,
                "messages"
            ),

            {

                type:
                    "call",

                callId:
                    activeCallId,

                callType:
                    activeCallType ||
                    "audio",

                callStatus:
                    status,

                callerId:
                    activeCallRole ===
                    "caller"
                    ? currentUser.uid
                    : peerId,

                receiverId:
                    activeCallRole ===
                    "receiver"
                    ? currentUser.uid
                    : peerId,

                senderId:
                    currentUser.uid,

                receiverIdForMessage:
                    peerId,

                duration:
                    duration || 0,

                read:false,

                createdAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "Call history:",
            error
        );

    }

}


/* =========================================================
   FINISH CALL
========================================================= */

let finishingCall =
    false;


async function finishCall(
    reason = "ended"
){

    if(
        finishingCall
    )
        return;


    if(
        !activeCallId
    ){

        cleanupCall();

        return;

    }


    finishingCall =
        true;


    const callId =
        activeCallId;


    const type =
        activeCallType;


    const role =
        activeCallRole;


    const duration =
        callSeconds;


    const peer =
        activeCallPeer
        ? {...activeCallPeer}
        : null;


    try{

        const callRef =
            doc(
                db,
                "calls",
                callId
            );


        let finalStatus =
            reason;


        if(
            activeCallConnected
        ){

            finalStatus =
                "ended";

        }else if(
            reason ===
            "ended"
        ){

            finalStatus =
                "missed";

        }


        await updateDoc(

            callRef,

            {

                status:
                    finalStatus,

                duration:
                    duration,

                endedAt:
                    serverTimestamp()

            }

        );


        /*
           حفظ نسخة history
           من نفس الطرف الذي أنهى المكالمة.
        */

        if(
            peer
        ){

            const historyChatID =
                createChatID(
                    currentUser.uid,
                    peer.uid
                );


            await addDoc(

                collection(
                    db,
                    "chats",
                    historyChatID,
                    "messages"
                ),

                {

                    type:
                        "call",

                    callId,

                    callType:
                        type ||
                        "audio",

                    callStatus:
                        finalStatus,

                    callerId:
                        role === "caller"
                        ? currentUser.uid
                        : peer.uid,

                    senderId:
                        currentUser.uid,

                    receiverId:
                        peer.uid,

                    duration,

                    read:false,

                    createdAt:
                        serverTimestamp()

                }

            );

        }

    }catch(error){

        console.error(
            "Finish call:",
            error
        );

    }


    finishingCall =
        false;


    cleanupCall();

}

/* =========================================================
   FLIP CAMERA
========================================================= */

flipCameraButton.onclick =
    async () => {

        if(
            activeCallType !==
            "video"
        )
            return;


        if(
            !localStream
        )
            return;


        const oldTrack =
            localStream
                .getVideoTracks()[0];


        if(
            !oldTrack
        )
            return;


        currentFacingMode =
            currentFacingMode ===
            "user"
            ? "environment"
            : "user";


        try{

            const newStream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        audio:false,

                        video:{
                            facingMode:
                                {
                                    ideal:
                                        currentFacingMode
                                }
                        }

                    });


            const newTrack =
                newStream
                    .getVideoTracks()[0];


            const sender =
                peerConnection
                    ?.getSenders()
                    .find(
                        s =>
                            s.track &&
                            s.track.kind ===
                            "video"
                    );


            if(
                sender
            ){

                await sender.replaceTrack(
                    newTrack
                );

            }


            oldTrack.stop();


            localStream.removeTrack(
                oldTrack
            );


            localStream.addTrack(
                newTrack
            );


            localVideo.srcObject =
                localStream;


        }catch(error){

            console.error(
                "Flip camera:",
                error
            );

            currentFacingMode =
                currentFacingMode ===
                "user"
                ? "environment"
                : "user";

        }

    };

/* =========================================================
   CLEANUP
========================================================= */

function cleanupCall(){

    clearTimeout(
        callTimeout
    );

    callTimeout =
        null;


    stopCallTimer();


    if(
        unsubscribeActiveCall
    ){

        unsubscribeActiveCall();

        unsubscribeActiveCall =
            null;

    }


    if(
        unsubscribeActiveCandidates
    ){

        unsubscribeActiveCandidates();

        unsubscribeActiveCandidates =
            null;

    }


    if(
        localStream
    ){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    localStream =
        null;


    if(
        peerConnection
    ){

        try{

            peerConnection.close();

        }catch{}

    }


    peerConnection =
        null;


    remoteVideo.srcObject =
        null;

    localVideo.srcObject =
        null;


    videoArea.classList.remove(
        "swapped"
    );


    videoArea.style.display =
        "none";


    activeCallId =
        null;

    activeCallType =
        null;

    activeCallRole =
        null;

    activeCallPeer =
        null;

    activeCallConnected =
        false;

    callSeconds =
        0;

    remoteAudioMuted =
        false;

    currentFacingMode =
        "user";


    resetCallButtons();


    callCard.classList.remove(
        "calling"
    );


    callOverlay.style.display =
        "none";


    muteButton.textContent =
        "🎤";

    speakerButton.textContent =
        "🔊";

    cameraButton.textContent =
        "📹";

    flipCameraButton.textContent =
        "🔄";


    callState.textContent =
        "جارٍ الاتصال...";

}

/* =========================================================
   PAGEHIDE
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if(
            currentUser
        ){

            updateMyPresence(
                false
            );

            updateMyActivity(
                false,
                false
            );

        }

    }
);


/* =========================================================
   INIT
========================================================= */

function init(){

    let authFinished =
        false;


    /*
       حماية من بقاء:
       جارٍ فتح الدردشة...
       للأبد.
    */

    const loadingTimeout =
        setTimeout(
            () => {

                if(
                    !authFinished
                ){

                    loading.innerHTML = `

                        <div style="
                            text-align:center;
                            line-height:2;
                        ">

                            ⚠️ تأخر تسجيل الدخول

                            <br>

                            <small style="
                                color:#777;
                            ">

                                أعد فتح الصفحة وحاول مرة أخرى.

                            </small>

                        </div>

                    `;

                }

            },
            15000
        );


    onAuthStateChanged(

        auth,

        async user => {

            authFinished =
                true;


            clearTimeout(
                loadingTimeout
            );


            if(
                !user
            ){

                loading.innerHTML = `

                    <div style="
                        text-align:center;
                        line-height:2;
                    ">

                        🔐 يجب تسجيل الدخول أولاً

                    </div>

                `;

                return;

            }


            currentUser =
                user;


            window.chatUser =
                user;


            try{

                /*
                   نعرض التطبيق أولاً
                   حتى لا يعلق إذا لم يوجد friend.
                */

                showApp();


                startPresence();


                /*
                   تحميل الصديق اختياري.
                */

                await loadFriend();


                /*
                   الرسائل فقط إذا يوجد صديق.
                */

                if(
                    chatID
                ){

                    listenMessages();

                }


                /*
                   المكالمات الواردة عالمية.
                   تعمل حتى وأنت داخل محادثة ثانية.
                */

                listenIncomingCalls();


            }catch(error){

                console.error(
                    "Init:",
                    error
                );


                /*
                   حتى لو فشل تحميل الصديق،
                   لا نخفي التطبيق.
                */

                showApp();


                friendName.textContent =
                    "Mecd Chat";


                friendStatus.textContent =
                    "● غير متصل";


                /*
                   المكالمات العالمية تبقى شغالة.
                */

                listenIncomingCalls();

            }

        },

        error => {

            authFinished =
                true;


            clearTimeout(
                loadingTimeout
            );


            showError(
                error
            );

        }

    );

}


init();


</script>

</html>
