<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat - الدردشة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
overflow:hidden;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

header{
height:75px;
padding:12px 18px;
display:flex;
align-items:center;
gap:12px;
background:rgba(5,10,8,.96);
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}

.back{
width:45px;height:45px;border:none;border-radius:14px;
background:rgba(255,255,255,.06);
color:white;font-size:24px;cursor:pointer;
display:flex;align-items:center;justify-content:center;
}

.back:active{transform:scale(.94)}

.avatar{
width:48px;height:48px;border-radius:50%;overflow:hidden;
display:flex;align-items:center;justify-content:center;
background:#12352c;font-size:24px;flex-shrink:0;
border:1px solid rgba(0,230,118,.3);
}

.avatar img{width:100%;height:100%;object-fit:cover}

.user-info{flex:1;min-width:0}

.user-name{
font-size:17px;font-weight:bold;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap;
}

.user-status{
font-size:11px;color:#7d8985;margin-top:4px;transition:.2s ease;
}

.user-status.online{color:#00e889}

.messages{
flex:1;
overflow-y:auto;
padding:20px 15px 100px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.empty{
margin:auto;text-align:center;color:#72817c;
line-height:1.8;font-size:14px;
}

.message{
max-width:78%;
padding:11px 14px;
border-radius:18px;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
overflow-wrap:anywhere;
white-space:pre-wrap;
position:relative;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
color:white;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px;
}

.time{
display:block;
font-size:9px;
opacity:.55;
margin-top:4px;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:12px;
display:flex;
gap:9px;
background:rgba(5,8,7,.97);
border-top:1px solid rgba(255,255,255,.08);
z-index:20;
}

#messageInput{
flex:1;min-width:0;
padding:14px 16px;
border-radius:17px;
border:1px solid rgba(255,255,255,.09);
outline:none;
background:#111916;
color:white;
font-family:inherit;
font-size:15px;
direction:rtl;
}

#messageInput:focus{
border-color:#00e676;
box-shadow:0 0 0 3px rgba(0,230,118,.07);
}

#messageInput::placeholder{color:#63716d}

#sendButton{
width:52px;height:52px;
border:none;border-radius:17px;
background:#00e889;color:#00150e;
font-size:22px;cursor:pointer;flex-shrink:0;
}

#sendButton:active{transform:scale(.94)}
#sendButton:disabled{opacity:.5;cursor:not-allowed}

#voiceButton,#callButton,#videoButton{
width:45px;height:45px;border:none;border-radius:15px;
background:#18231f;color:white;font-size:20px;
cursor:pointer;flex-shrink:0;
}

#voiceButton:active,#callButton:active,#videoButton:active{
transform:scale(.94)
}

.call-buttons{
display:flex;
gap:8px;
margin-right:auto;
}

.call-buttons button{
width:42px;height:42px;border:none;border-radius:14px;
background:#18231f;color:white;font-size:18px;cursor:pointer;
}

.loading{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
flex-direction:column;gap:15px;
background:#020504;color:#a8bdb6;font-size:15px;z-index:100;
}

.error-screen{
position:fixed;inset:0;
display:flex;align-items:center;justify-content:center;
flex-direction:column;
background:#020504;text-align:center;padding:30px;z-index:200;
}

.error-box{
width:100%;max-width:500px;padding:30px;border-radius:25px;
background:#0b100e;border:1px solid rgba(255,255,255,.08);
}

.error-box h2{font-size:25px;margin-bottom:15px}
.error-box p{color:#9aa7a3;line-height:1.8;font-size:14px}

.spinner{
width:35px;height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

#attachButton{
width:45px;height:45px;border:none;border-radius:15px;
background:#18231f;color:#fff;font-size:28px;line-height:1;
display:flex;align-items:center;justify-content:center;
cursor:pointer;flex:0 0 45px;
}

#attachButton:active{transform:scale(.94)}

.attach-menu{
position:absolute;
bottom:72px;
right:72px;
display:none;
flex-direction:column;
gap:7px;
padding:8px;
background:#111916;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
z-index:90;
box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.attach-menu.show{display:flex}

.attach-menu button{
border:0;background:#18231f;color:#fff;
border-radius:12px;padding:11px 14px;
font-family:inherit;font-size:14px;
white-space:nowrap;text-align:right;cursor:pointer;
}

.attach-menu button:active{transform:scale(.97)}

.message-image{
display:block;
max-width:min(270px,100%);
max-height:360px;
width:auto;height:auto;
border-radius:14px;
object-fit:cover;
}

.message.image-message{padding:7px}

.message.voice-message{
width:min(340px,84%);
max-width:84%;
min-height:66px;
padding:8px 10px;
display:block;
overflow:hidden;
}

.voice-player{
width:100%;
min-width:0;
min-height:48px;
display:flex;
align-items:center;
gap:10px;
}

.voice-play{
width:42px;height:42px;
flex:0 0 42px;
border:0;border-radius:50%;
background:rgba(255,255,255,.88);
color:#087b50;
font-size:17px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.message.other .voice-play{
background:#00c96b;
color:#00150e;
}

.voice-body{flex:1;min-width:0}

.voice-row{
display:flex;
align-items:center;
gap:8px;
width:100%;
}

.voice-progress{
flex:1;
min-width:0;
width:100%;
height:5px;
accent-color:#00e889;
cursor:pointer;
}

.voice-duration{
min-width:38px;
font-size:10px;
opacity:.75;
direction:ltr;
text-align:center;
}

.message.voice-message .time{margin-top:3px}

#recordBox{
position:fixed;
bottom:75px;
left:50%;
transform:translateX(-50%);
background:#18231f;
padding:10px 15px;
border-radius:20px;
display:flex;
gap:10px;
align-items:center;
z-index:50;
}

#recordText{color:#00e889}

#cancelRecord{
background:#ff3333;
color:white;
border:none;
border-radius:12px;
padding:6px 12px;
}

.message-menu{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:#111916;
border-radius:12px;
padding:8px;
z-index:999;
}

.message-menu button{
background:#18231f;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-size:14px;
}

.incoming-call{
position:fixed;
top:84px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
z-index:300;
background:#111916;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:12px 14px;
box-shadow:0 15px 45px rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.incoming-call-info{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.incoming-name{
font-weight:bold;font-size:15px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.incoming-type{
font-size:12px;color:#9aa7a3;margin-top:3px;
}

.incoming-actions{
display:flex;gap:8px;flex-shrink:0;
}

.incoming-actions button{
width:45px;height:45px;border:0;border-radius:50%;
font-size:20px;color:white;cursor:pointer;background:#26332e;
}

.incoming-actions button:last-child{
background:#00c96b;color:#00150e;
}

.call-avatar,.remote-call-avatar{
width:50px;height:50px;border-radius:50%;
overflow:hidden;background:#12352c;
display:flex;align-items:center;justify-content:center;
flex-shrink:0;
}

.call-avatar img,.remote-call-avatar img{
width:100%;height:100%;object-fit:cover;border-radius:50%;
}

.call-screen{
position:fixed;inset:0;z-index:400;
background:#020504;
display:flex;flex-direction:column;
}

.call-top{
height:75px;padding:14px 18px;
display:flex;align-items:center;justify-content:space-between;
background:rgba(5,10,8,.96);
border-bottom:1px solid rgba(255,255,255,.08);
}

.call-title{font-weight:bold;font-size:18px}
.call-duration{font-size:13px;color:#8e9b96}

.call-stage{
position:relative;flex:1;
display:flex;align-items:center;justify-content:center;
overflow:hidden;background:#020504;
}

.remote-video{
width:100%;height:100%;object-fit:cover;display:none;
}

.local-video{
position:absolute;
right:16px;top:16px;
width:120px;height:170px;
object-fit:cover;
border-radius:20px;
border:2px solid rgba(255,255,255,.18);
display:none;
background:#111916;
}

.remote-call-avatar{
width:110px;height:110px;font-size:48px;
}

.call-controls{
height:95px;
display:flex;
align-items:center;
justify-content:center;
gap:16px;
background:rgba(5,10,8,.98);
}

.call-controls button{
width:55px;height:55px;
border:0;border-radius:50%;
background:#18231f;color:white;
font-size:22px;cursor:pointer;
}

.call-controls .end-call{
background:#e53935;
color:white;
transform:rotate(135deg);
}

@media(max-width:480px){
header{height:70px;padding:10px 13px}

.back{width:43px;height:43px}

.avatar{
width:45px;height:45px;border-radius:15px
}

.user-name{font-size:16px}

.messages{padding:15px 12px 100px}

.message{max-width:84%;font-size:14px}

.input-area{padding:10px}

#messageInput{
font-size:14px;
padding:13px 14px
}

#sendButton{
width:50px;height:50px
}

.attach-menu{
right:58px;
bottom:68px;
max-width:calc(100vw - 75px)
}

.incoming-call{top:75px}

.local-video{
width:105px;height:150px
}

.call-controls{height:88px}
}
</style>
</head>

<body>

<div id="loading" class="loading">
<div class="spinner"></div>
<div>جارٍ فتح الدردشة...</div>
</div>

<div id="errorScreen" class="error-screen" style="display:none">
<div class="error-box">
<h2>⚠️ تعذر فتح الدردشة</h2>
<p id="errorText"></p>
</div>
</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back" type="button">→</button>

<div id="friendAvatar" class="avatar">👤</div>

<div class="user-info">
<div id="friendName" class="user-name">جارٍ التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton" type="button">📞</button>
<button id="videoButton" type="button">📹</button>
</div>

</header>

<div id="messages" class="messages">
<div class="empty">
💬
<br>
ابدأ المحادثة الآن
</div>
</div>

<div class="input-area">

<button id="attachButton" type="button" aria-label="إضافة">+</button>

<div id="attachMenu" class="attach-menu">
<button id="galleryButton" type="button">🖼️ صورة — يفتح المعرض</button>
<button id="cameraButton" type="button">📷 كاميرا — تفتح الكاميرا</button>
</div>

<input id="galleryInput" type="file" accept="image/*" hidden>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>

<button id="voiceButton" type="button">🎤</button>

<div id="recordBox" style="display:none">
<span id="recordText">يسجل الآن...</span>
<span id="recordTime">00:00</span>
<button id="cancelRecord" type="button">إلغاء</button>
</div>

<button id="sendButton" type="button">➤</button>

</div>

<div id="incomingCall" class="incoming-call" style="display:none">

<div class="incoming-call-info">
<div id="incomingAvatar" class="call-avatar">👤</div>
<div>
<div id="incomingName" class="incoming-name">مكالمة واردة</div>
<div id="incomingType" class="incoming-type">📞 مكالمة صوتية</div>
</div>
</div>

<div class="incoming-actions">
<button id="rejectIncoming" type="button">✕</button>
<button id="acceptIncoming" type="button">✓</button>
</div>

</div>

<div id="callScreen" class="call-screen" style="display:none">

<div class="call-top">
<div id="callTitle" class="call-title">مكالمة</div>
<div id="callDuration" class="call-duration">00:00</div>
</div>

<div class="call-stage">
<div id="remoteCallAvatar" class="remote-call-avatar">👤</div>
<video id="remoteVideo" class="remote-video" autoplay playsinline></video>
<video id="localVideo" class="local-video" autoplay muted playsinline></video>
</div>

<div class="call-controls">
<button id="muteCall" type="button">🎤</button>
<button id="switchVideo" type="button">📹</button>
<button id="endCall" type="button" class="end-call">📞</button>
</div>

</div>

</main>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
addDoc,
collection,
query,
where,
onSnapshot,
serverTimestamp,
deleteDoc,
orderBy
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.firebasestorage.app",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"
};

const appFirebase=initializeApp(firebaseConfig);
const auth=getAuth(appFirebase);
const db=getFirestore(appFirebase);

const $=id=>document.getElementById(id);

let me=null;
let friend=null;
let chatID=null;
let unsubscribeMessages=null;
let unsubscribeFriendStatus=null;
let presenceInterval=null;

const messagesEl=$("messages");
const messageInput=$("messageInput");
const sendButton=$("sendButton");
const loading=$("loading");
const app=$("app");
const errorScreen=$("errorScreen");
const errorText=$("errorText");

function escapeHtml(value){
return String(value??"").replace(
/[&<>'"]/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);
}

function showError(message){
console.error(message);
loading.style.display="none";
errorScreen.style.display="flex";
errorText.textContent=message;
}

function makeChatID(a,b){
return [a,b].sort().join("_");
}

function formatTime(timestamp){
try{
const date=timestamp?.toDate?timestamp.toDate():new Date();
return date.toLocaleTimeString("ar-SA",{
hour:"2-digit",
minute:"2-digit"
});
}catch{
return "";
}
}

function setAvatar(element,url){
if(!element)return;

if(url){
element.innerHTML=
`<img src="${escapeHtml(url)}" alt="">`;
}else{
element.textContent="👤";
}
}

function scrollMessages(){
requestAnimationFrame(()=>{
messagesEl.scrollTop=messagesEl.scrollHeight;
});
}

function renderMessage(id,data){

const old=document.querySelector(
`[data-message-id="${CSS.escape(id)}"]`
);

if(old)return;

const mine=data.senderId===me.uid;
const type=data.type||"text";

const el=document.createElement("div");

el.className=
"message "+
(mine?"mine ":"other ")+
(type==="voice"?"voice-message ":"")+
(type==="image"?"image-message":"");

el.dataset.messageId=id;

if(type==="voice"){

const audio=document.createElement("audio");
audio.src=data.audio||"";
audio.preload="metadata";

const player=document.createElement("div");
player.className="voice-player";

const play=document.createElement("button");
play.className="voice-play";
play.type="button";
play.textContent="▶";

const body=document.createElement("div");
body.className="voice-body";

const row=document.createElement("div");
row.className="voice-row";

const progress=document.createElement("input");
progress.className="voice-progress";
progress.type="range";
progress.min="0";
progress.max="100";
progress.value="0";

const duration=document.createElement("span");
duration.className="voice-duration";
duration.textContent="00:00";

row.append(progress,duration);
body.append(row);
player.append(play,body);
el.append(player);

audio.style.display="none";
el.append(audio);

play.addEventListener("click",()=>{
if(audio.paused){
audio.play().catch(()=>{});
play.textContent="⏸";
}else{
audio.pause();
play.textContent="▶";
}
});

audio.addEventListener("loadedmetadata",()=>{
if(Number.isFinite(audio.duration)){
duration.textContent=
formatDuration(audio.duration);
}
});

audio.addEventListener("timeupdate",()=>{
if(audio.duration){
progress.value=
String((audio.currentTime/audio.duration)*100);
}
});

audio.addEventListener("ended",()=>{
play.textContent="▶";
progress.value="0";
});

progress.addEventListener("input",()=>{
if(audio.duration){
audio.currentTime=
(Number(progress.value)/100)*audio.duration;
}
});

}else if(type==="image"){

const image=document.createElement("img");
image.className="message-image";
image.src=data.image||"";
image.alt="صورة";
el.append(image);

}else{

el.textContent=data.text||"";
}

const time=document.createElement("span");
time.className="time";
time.textContent=formatTime(data.createdAt);

el.append(time);

addMessageActions(el,id,mine);

messagesEl.append(el);
}

function formatDuration(seconds){
seconds=Math.max(0,Math.floor(Number(seconds)||0));
const m=Math.floor(seconds/60);
const s=seconds%60;
return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function addMessageActions(element,id,isMine){

if(!isMine)return;

let timer=null;

element.addEventListener("pointerdown",()=>{
timer=setTimeout(()=>{
showMessageMenu(element,id);
},600);
});

const clear=()=>{
if(timer){
clearTimeout(timer);
timer=null;
}
};

element.addEventListener("pointerup",clear);
element.addEventListener("pointerleave",clear);
element.addEventListener("pointercancel",clear);
}

function showMessageMenu(element,messageID){

document.querySelectorAll(".message-menu")
.forEach(x=>x.remove());

const menu=document.createElement("div");
menu.className="message-menu";

const deleteButton=document.createElement("button");
deleteButton.type="button";
deleteButton.textContent="🗑️ حذف";

deleteButton.addEventListener("click",async()=>{
menu.remove();

try{

await deleteDoc(
doc(
db,
"chats",
chatID,
"messages",
messageID
)
);

const message=element;
message.remove();

}catch(error){

console.error("Delete message error:",error);

alert("تعذر حذف الرسالة");

}

});

menu.append(deleteButton);
element.append(menu);
}

async function sendMessage(){

if(!me||!friend||!chatID)return;

const text=messageInput.value.trim();

if(!text)return;

sendButton.disabled=true;

try{

await addDoc(
collection(db,"chats",chatID,"messages"),
{
type:"text",
text,
senderId:me.uid,
receiverId:friend.uid,
createdAt:serverTimestamp()
}
);

await setDoc(
doc(db,"chats",chatID),
{
lastMessage:text,
lastMessageAt:serverTimestamp(),
lastSenderId:me.uid
},
{merge:true}
);

messageInput.value="";
messageInput.focus();

}catch(error){

console.error(error);
alert("تعذر إرسال الرسالة:\n"+error.message);

}finally{

sendButton.disabled=false;

}
}

function listenMessages(){

if(unsubscribeMessages){
unsubscribeMessages();
}

const ref=collection(
db,
"chats",
chatID,
"messages"
);

const q=query(
ref,
orderBy("createdAt","asc")
);

unsubscribeMessages=onSnapshot(
q,
snapshot=>{

messagesEl.innerHTML="";

if(snapshot.empty){

messagesEl.innerHTML=
`<div class="empty">💬<br>ابدأ المحادثة الآن</div>`;

return;

}

snapshot.forEach(item=>{
renderMessage(item.id,item.data());
});

scrollMessages();

},
error=>{
console.error(error);
showError("تعذر تحميل الرسائل: "+error.message);
}
);
}

async function updateMyPresence(online=true){

if(!me)return;

try{

await setDoc(
doc(db,"users",me.uid),
{
online,
lastSeen:serverTimestamp()
},
{merge:true}
);

}catch(error){
console.error("Presence error:",error);
}
}

function startPresence(){

updateMyPresence(true);

if(presenceInterval)
clearInterval(presenceInterval);

presenceInterval=setInterval(()=>{
if(document.visibilityState==="visible"){
updateMyPresence(true);
}
},10000);
}

function stopPresence(){

if(presenceInterval){
clearInterval(presenceInterval);
presenceInterval=null;
}

updateMyPresence(false);
}

function listenFriendStatus(){

if(!friend)return;

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

const ref=doc(db,"users",friend.uid);

unsubscribeFriendStatus=onSnapshot(
ref,
snap=>{

if(!snap.exists()){
$("friendStatus").textContent="● غير متصل";
$("friendStatus").classList.remove("online");
return;
}

const data=snap.data();

const lastSeen=
data.lastSeen?.toMillis?.()||0;

const online=
data.online===true &&
lastSeen>0 &&
Date.now()-lastSeen<30000;

$("friendStatus").textContent=
online?"● متصل":"● غير متصل";

$("friendStatus").classList.toggle(
"online",
online
);

},
error=>console.error(error)
);
}

async function loadFriend(){

const id=
new URLSearchParams(location.search).get("friend");

if(!id)
throw new Error("لا يوجد صديق في الرابط");

const snap=
await getDoc(doc(db,"users",id));

if(!snap.exists())
throw new Error("المستخدم غير موجود");

const data=snap.data();

friend={
uid:id,
name:data.name||"مستخدم Mecd",
photo:data.photo||data.photoURL||""
};

chatID=makeChatID(me.uid,id);

$("friendName").textContent=friend.name;
setAvatar($("friendAvatar"),friend.photo);

listenFriendStatus();

return true;
}

$("sendButton").addEventListener(
"click",
sendMessage
);

messageInput.addEventListener(
"keydown",
event=>{
if(event.key==="Enter"){
event.preventDefault();
sendMessage();
}
}
);

$("backButton").addEventListener(
"click",
()=>{
if(window.history.length>1){
history.back();
}else{
location.href="./home.html";
}
}
);

$("attachButton").addEventListener(
"click",
()=>{
$("attachMenu").classList.toggle("show");
}
);

$("galleryButton").addEventListener(
"click",
()=>{
$("attachMenu").classList.remove("show");
$("galleryInput").click();
}
);

$("cameraButton").addEventListener(
"click",
()=>{
$("attachMenu").classList.remove("show");
$("cameraInput").click();
}
);

async function sendImage(file){

if(!file||!me||!friend||!chatID)return;

if(!file.type.startsWith("image/")){
alert("الملف ليس صورة");
return;
}

if(file.size>800000){
alert("الصورة كبيرة جدًا");
return;
}

const reader=new FileReader();

reader.onload=async()=>{
try{

await addDoc(
collection(db,"chats",chatID,"messages"),
{
type:"image",
image:reader.result,
senderId:me.uid,
receiverId:friend.uid,
createdAt:serverTimestamp()
}
);

await setDoc(
doc(db,"chats",chatID),
{
lastMessage:"🖼️ صورة",
lastMessageAt:serverTimestamp(),
lastSenderId:me.uid
},
{merge:true}
);

}catch(error){

console.error(error);
alert("تعذر إرسال الصورة");

}
};

reader.readAsDataURL(file);
}

$("galleryInput").addEventListener(
"change",
event=>{
const file=event.target.files?.[0];
if(file)sendImage(file);
event.target.value="";
}
);

$("cameraInput").addEventListener(
"change",
event=>{
const file=event.target.files?.[0];
if(file)sendImage(file);
event.target.value="";
}
);

document.addEventListener(
"click",
event=>{
const menu=$("attachMenu");
const button=$("attachButton");

if(
menu.classList.contains("show") &&
!menu.contains(event.target) &&
!button.contains(event.target)
){
menu.classList.remove("show");
}
}
);

onAuthStateChanged(
auth,
async user=>{

if(!user){
showError("يجب تسجيل الدخول أولاً إلى Mecd Chat.");
return;
}

me=user;

try{

startPresence();

const success=await loadFriend();

if(!success){
stopPresence();
return;
}

listenMessages();

window.chatDB=db;
window.chatUser=me;
window.chatFriend=friend;
window.chatID=chatID;

loading.style.display="none";
app.style.display="flex";

messageInput.blur();

}catch(error){

console.error(error);

showError(
"حدث خطأ أثناء فتح الدردشة:\n"+
error.message
);

}

}
);

window.addEventListener(
"beforeunload",
()=>{
if(unsubscribeMessages)
unsubscribeMessages();

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

stopPresence();
}
);

</script>

<script type="module">

const vBtn=document.getElementById("voiceButton");
const rBox=document.getElementById("recordBox");
const rText=document.getElementById("recordText");
const rTime=document.getElementById("recordTime");
const rCancel=document.getElementById("cancelRecord");

let vRec=null;
let vStream=null;
let vChunks=[];
let vCancelled=false;
let vTimer=null;
let vStart=0;

function resetVoice(){

rBox.style.display="none";
rTime.textContent="00:00";

if(vTimer){
clearInterval(vTimer);
vTimer=null;
}

vBtn?.classList.remove("recording");
}

async function startVoice(){

if(vRec)return;

try{

vStream=
await navigator.mediaDevices.getUserMedia({
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
}
});

vChunks=[];
vCancelled=false;

let mime="audio/webm";

if(
MediaRecorder.isTypeSupported(
"audio/webm;codecs=opus"
)
){
mime="audio/webm;codecs=opus";
}

vRec=new MediaRecorder(
vStream,
{mimeType:mime}
);

vRec.ondataavailable=event=>{
if(event.data.size)
vChunks.push(event.data);
};

vRec.onstop=async()=>{

const rec=vRec;

vRec=null;

vStream?.getTracks().forEach(
track=>track.stop()
);

vStream=null;

if(vTimer){
clearInterval(vTimer);
vTimer=null;
}

rBox.style.display="none";
rTime.textContent="00:00";
vBtn?.classList.remove("recording");

if(vCancelled){
vChunks=[];
return;
}

const blob=new Blob(
vChunks,
{type:rec?.mimeType||"audio/webm"}
);

vChunks=[];

if(blob.size>700000){
alert("التسجيل طويل جدًا، سجل مقطعًا أقصر");
return;
}

const reader=new FileReader();

reader.onload=async()=>{

if(!window.chatUser||
!window.chatFriend||
!window.chatID)
return;

try{

await addDoc(
collection(
window.chatDB,
"chats",
window.chatID,
"messages"
),
{
type:"voice",
audio:reader.result,
mimeType:blob.type,
text:"🎤 تسجيل صوتي",
senderId:window.chatUser.uid,
receiverId:window.chatFriend.uid,
createdAt:serverTimestamp()
}
);

await setDoc(
doc(
window.chatDB,
"chats",
window.chatID
),
{
lastMessage:"🎤 تسجيل صوتي",
lastMessageAt:serverTimestamp(),
lastSenderId:window.chatUser.uid
},
{merge:true}
);

}catch(error){

console.error(error);
alert("تعذر إرسال التسجيل");

}

};

reader.readAsDataURL(blob);

};

vRec.start();

rBox.style.display="flex";
rText.textContent="🎤 يسجل صوت…";
vBtn.classList.add("recording");

vStart=Date.now();

vTimer=setInterval(()=>{

const seconds=
Math.floor(
(Date.now()-vStart)/1000
);

rTime.textContent=
String(Math.floor(seconds/60))
.padStart(2,"0")+
":"+
String(seconds%60)
.padStart(2,"0");

},500);

}catch(error){

console.error(error);

alert(
"اسمح للمتصفح باستخدام الميكروفون لإرسال تسجيل صوتي"
);

resetVoice();

}

}

function cancelVoice(){

if(!vRec)return;

vCancelled=true;
vRec.stop();

}

vBtn?.addEventListener(
"click",
()=>{
if(vRec){
vRec.stop();
}else{
startVoice();
}
}
);

rCancel?.addEventListener(
"click",
event=>{
event.preventDefault();
event.stopPropagation();
cancelVoice();
}
);

</script>

<script type="module">

import {
initializeApp as initializeCallApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore as getCallFirestore,
doc as callDoc,
getDoc as callGetDoc,
setDoc as callSetDoc,
updateDoc as callUpdateDoc,
collection as callCollection,
query as callQuery,
where as callWhere,
onSnapshot as callSnapshot,
serverTimestamp as callServerTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth as getCallAuth,
onAuthStateChanged as callAuthState
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const callFirebase=initializeCallApp(firebaseConfig);
const callDB=getCallFirestore(callFirebase);
const callAuth=getCallAuth(callFirebase);

let callMe=null;
let callFriend=null;
let callId=null;
let callRole=null;
let callData=null;
let peer=null;
let localStream=null;
let connected=false;
let ending=false;
let incomingUnsubscribe=null;
let callUnsubscribe=null;
let candidateUnsubscribe=null;
let callTimer=null;
let callSeconds=0;

function ensureCallUI(){

const screen=$("callScreen");

if(!screen)return;

}

function showCallScreen(type){

$("callScreen").style.display="flex";

$("callTitle").textContent=
callFriend?.name||"مكالمة";

$("callDuration").textContent="00:00";

if(type==="video"){
$("remoteVideo").style.display="block";
$("localVideo").style.display="block";
$("remoteCallAvatar").style.display="none";
}else{
$("remoteVideo").style.display="none";
$("localVideo").style.display="none";
$("remoteCallAvatar").style.display="flex";
}

}

function hideCallScreen(){

$("callScreen").style.display="none";

$("remoteVideo").srcObject=null;
$("localVideo").srcObject=null;

}

function startTimer(){

if(callTimer)
clearInterval(callTimer);

callSeconds=0;

callTimer=setInterval(()=>{

callSeconds++;

$("callDuration").textContent=
formatDuration(callSeconds);

},1000);

}

function stopTimer(){

if(callTimer){
clearInterval(callTimer);
callTimer=null;
}

}

function closePeer(){

if(peer){
try{peer.close()}catch{}
peer=null;
}

if(localStream){
localStream.getTracks().forEach(
track=>track.stop()
);
localStream=null;
}

}

async function ensureMedia(video=false){

if(localStream)return localStream;

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:video
});

$("localVideo").srcObject=localStream;

return localStream;

}

async function saveCallMessage(status,duration=0){

if(!callMe||!callFriend||!window.chatID)
return;

let text="";

if(status==="ended")
text="📞 انتهت المكالمة";
else if(status==="cancelled")
text="📞 تم إلغاء المكالمة";
else if(status==="rejected")
text="📞 تم رفض المكالمة";
else if(status==="missed")
text="📞 مكالمة فائتة";

try{

await addDoc(
collection(
callDB,
"chats",
window.chatID,
"messages"
),
{
type:"text",
text:
text+
(duration?
" • "+formatDuration(duration):
""),
senderId:callMe.uid,
receiverId:callFriend.uid,
createdAt:callServerTimestamp()
}
);

}catch(error){
console.error(error);
}

}

async function createInitialCall(type="audio"){

if(!callMe||!callFriend||ending)
return;

if(callId){
alert("هناك مكالمة قيد التشغيل");
return;
}

ending=false;
connected=false;
callRole="caller";

callId=
`${callMe.uid}_${callFriend.uid}_${Date.now()}`;

const ref=callDoc(
callDB,
"calls",
callId
);

try{

await ensureMedia(type==="video");

const offer={
type:"offer",
sdp:""
};

callData={
callerId:callMe.uid,
receiverId:callFriend.uid,
callerName:callMe.displayName||"مستخدم Mecd",
callerPhoto:callMe.photoURL||"",
receiverName:callFriend.name,
receiverPhoto:callFriend.photo||"",
callType:type,
status:"ringing",
createdAt:callServerTimestamp(),
offer
};

await callSetDoc(ref,callData);

showCallScreen(type);

startTimer();

watchCall();

}catch(error){

console.error(error);

alert(
"تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await finishCall("cancelled");

}

}

async function finishCall(status="ended",remote=false){

if(ending&&!remote)
return;

ending=true;

stopTimer();

if(callId&&!remote){

try{

await callUpdateDoc(
callDoc(callDB,"calls",callId),
{
status,
duration:callSeconds,
endedAt:callServerTimestamp()
}
);

}catch(error){
console.error(error);
}

}

closePeer();

if(callUnsubscribe){
callUnsubscribe();
callUnsubscribe=null;
}

if(candidateUnsubscribe){
candidateUnsubscribe();
candidateUnsubscribe=null;
}

hideCallScreen();

callId=null;
callData=null;
callRole=null;
connected=false;

setTimeout(()=>{
ending=false;
},300);

}

function watchCall(){

if(!callId)return;

if(callUnsubscribe)
callUnsubscribe();

callUnsubscribe=
callSnapshot(
callDoc(callDB,"calls",callId),
async snap=>{

if(!snap.exists()){

await finishCall("ended",true);
return;

}

const data=snap.data();
callData=data;

if(
["rejected","cancelled","missed","ended"]
.includes(data.status)
){

const duration=
Number(data.duration||0);

if(
data.status!=="ended" ||
duration>0
){

await saveCallMessage(
data.status,
duration
);

}

await finishCall(
data.status,
true
);

return;

}

if(data.status==="connected"){

connected=true;

if($("callTitle"))
$("callTitle").textContent=
data.callType==="video"
?"📹 مكالمة فيديو"
:"📞 مكالمة صوتية";

}

}
);

}

async function acceptIncoming(){

if(!callId||!callData||ending)
return;

const id=callId;

ending=false;
callRole="receiver";
connected=false;

$("incomingCall").style.display="none";

try{

const snap=
await callGetDoc(
callDoc(callDB,"calls",id)
);

if(
!snap.exists() ||
snap.data().status!=="ringing"
){

await finishCall("cancelled",true);
return;

}

callData={
...callData,
...snap.data()
};

await ensureMedia(
callData.callType==="video"
);

await callUpdateDoc(
callDoc(callDB,"calls",id),
{
status:"connected",
connectedAt:callServerTimestamp()
}
);

showCallScreen(callData.callType);
startTimer();
watchCall();

}catch(error){

console.error(error);

alert(
"تعذر قبول المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await finishCall("rejected");

}

}

async function rejectIncoming(){

if(!callId)return;

const id=callId;

try{

await callUpdateDoc(
callDoc(callDB,"calls",id),
{
status:"rejected",
duration:0,
endedAt:callServerTimestamp()
}
);

}catch(error){
console.error(error);
}

$("incomingCall").style.display="none";

callId=null;
callData=null;
callRole=null;
}

function renderIncoming(id,data){

if(callId||ending)return;

callId=id;
callData=data;
callRole="receiver";

$("incomingName").textContent=
data.callerName||"مستخدم Mecd";

$("incomingType").textContent=
data.callType==="video"
?"📹 مكالمة فيديو"
:"📞 مكالمة صوتية";

setAvatar(
$("incomingAvatar"),
data.callerPhoto||""
);

$("incomingCall").style.display="flex";

}

function listenIncoming(){

if(!callMe)return;

if(incomingUnsubscribe)
incomingUnsubscribe();

const q=
callQuery(
callCollection(callDB,"calls"),
callWhere(
"receiverId",
"==",
callMe.uid
),
callWhere(
"status",
"==",
"ringing"
)
);

incomingUnsubscribe=
callSnapshot(
q,
snapshot=>{

for(
const change of snapshot.docChanges()
){

const data=change.doc.data();
const id=change.doc.id;

if(change.type==="added"){

const created=
data.createdAt?.toMillis?.()||0;

if(
created &&
Date.now()-created>35000
){

callUpdateDoc(
callDoc(callDB,"calls",id),
{
status:"missed",
duration:0,
endedAt:callServerTimestamp()
}
).catch(()=>{});

continue;

}

renderIncoming(id,data);

}

}

}
);

}

$("callButton")?.addEventListener(
"click",
()=>createInitialCall("audio")
);

$("videoButton")?.addEventListener(
"click",
()=>createInitialCall("video")
);

$("acceptIncoming")?.addEventListener(
"click",
acceptIncoming
);

$("rejectIncoming")?.addEventListener(
"click",
rejectIncoming
);

$("endCall")?.addEventListener(
"click",
()=>{
finishCall(
connected?"ended":"cancelled"
);
}
);

$("muteCall")?.addEventListener(
"click",
()=>{

const tracks=
localStream?.getAudioTracks()||[];

if(!tracks.length)return;

const enabled=
!tracks[0].enabled;

tracks.forEach(
track=>track.enabled=enabled
);

$("muteCall").textContent=
enabled?"🎤":"🔇";

}
);

callAuthState(
callAuth,
async user=>{

if(!user)return;

callMe=user;

const friendId=
new URLSearchParams(
location.search
).get("friend");

if(!friendId)return;

const snap=
await callGetDoc(
callDoc(callDB,"users",friendId)
);

if(!snap.exists())return;

const data=snap.data();

callFriend={
uid:friendId,
name:data.name||"مستخدم Mecd",
photo:data.photo||data.photoURL||""
};

listenIncoming();

ensureCallUI();

}
);

window.addEventListener(
"pagehide",
()=>{
if(
callId &&
callRole==="caller" &&
!ending
){
finishCall(
connected?"ended":"cancelled"
).catch(()=>{});
}
}
);

window.addEventListener(
"beforeunload",
()=>{
if(incomingUnsubscribe)
incomingUnsubscribe();

if(callUnsubscribe)
callUnsubscribe();

if(candidateUnsubscribe)
candidateUnsubscribe();

}
);

</script>
