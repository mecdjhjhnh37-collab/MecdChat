<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#123d35 0%,#07110f 45%,#020504 100%);
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
    overflow:hidden;
}

/* =========================
   التطبيق
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   الهيدر
========================= */

.header{
    height:70px;
    flex-shrink:0;

    display:flex;
    align-items:center;
    gap:12px;

    padding:10px 15px;

    background:rgba(3,10,8,.92);
    border-bottom:1px solid rgba(0,232,137,.15);
    backdrop-filter:blur(12px);
}

.back{
    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:#101b18;
    color:#fff;

    font-size:22px;
    cursor:pointer;
}

.avatar{
    width:44px;
    height:44px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#00e889;
    color:#03100b;

    font-size:20px;
    font-weight:bold;

    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.userInfo{
    min-width:0;
    flex:1;
}

.userName{
    font-size:16px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.userStatus{
    margin-top:4px;
    color:#7e938d;
    font-size:12px;
}

/* =========================
   الرسائل
========================= */

.messages{
    flex:1;

    overflow-y:auto;

    padding:18px 12px 12px;

    display:flex;
    flex-direction:column;
    gap:9px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:4px;
}

.messages::-webkit-scrollbar-thumb{
    background:#183a31;
    border-radius:10px;
}

.empty{
    margin:auto;

    text-align:center;
    color:#78908a;

    font-size:14px;
}

/* =========================
   رسالة
========================= */

.messageRow{
    width:100%;
    display:flex;
}

.messageRow.me{
    justify-content:flex-start;
}

.messageRow.friend{
    justify-content:flex-end;
}

.message{
    max-width:78%;
    min-width:50px;

    padding:9px 12px;

    border-radius:16px;

    word-break:break-word;

    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.message.me{
    background:#075c42;
    border-bottom-left-radius:5px;
}

.message.friend{
    background:#14211e;
    border-bottom-right-radius:5px;
}

.messageText{
    font-size:15px;
    line-height:1.5;
}

.messageTime{
    margin-top:4px;

    font-size:10px;
    color:#91aaa3;

    text-align:left;
}

/* =========================
   الصوت
========================= */

.voiceMessage{
    min-width:220px;
    display:flex;
    align-items:center;
    gap:9px;
}

.playVoice{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#00e889;
    color:#03100b;

    font-size:18px;
    cursor:pointer;

    flex-shrink:0;
}

.voiceInfo{
    flex:1;
    min-width:0;
}

.voiceLabel{
    font-size:13px;
    margin-bottom:5px;
}

.voiceAudio{
    width:100%;
    height:32px;
}

/* =========================
   الإدخال
========================= */

.inputArea{
    flex-shrink:0;

    display:flex;
    align-items:center;
    gap:8px;

    padding:10px;

    background:rgba(3,10,8,.96);
    border-top:1px solid rgba(0,232,137,.12);
}

.textInput{
    flex:1;

    min-width:0;

    height:46px;

    border:1px solid #1b3831;
    outline:none;

    border-radius:23px;

    padding:0 17px;

    background:#0c1714;
    color:#fff;

    font-size:15px;
}

.textInput::placeholder{
    color:#62756f;
}

.textInput:focus{
    border-color:#00a96b;
}

.sendButton,
.voiceButton{
    width:46px;
    height:46px;

    border:0;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    flex-shrink:0;
}

.sendButton{
    background:#00e889;
    color:#03100b;

    font-size:19px;
}

.voiceButton{
    background:#10211c;
    color:#fff;

    font-size:20px;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.voiceButton.recording{
    background:#d91e35;
    transform:scale(1.08);
    box-shadow:0 0 0 7px rgba(217,30,53,.12);
}

/* =========================
   تحميل
========================= */

.loading{
    text-align:center;
    color:#6e847e;
    padding:15px;
    font-size:13px;
}

</style>
</head>

<body>

<div class="app">

    <!-- =====================
         الهيدر
    ====================== -->

    <header class="header">

        <button
            class="back"
            id="backButton"
            type="button">
            ‹
        </button>

        <div
            class="avatar"
            id="friendAvatar">
            👤
        </div>

        <div class="userInfo">

            <div
                class="userName"
                id="friendName">
                جاري التحميل...
            </div>

            <div
                class="userStatus"
                id="friendStatus">
                متصل
            </div>

        </div>

    </header>


    <!-- =====================
         الرسائل
    ====================== -->

    <main
        class="messages"
        id="messages">

        <div
            class="empty"
            id="emptyMessage">
            لا توجد رسائل بعد
        </div>

    </main>


    <!-- =====================
         الإدخال
    ====================== -->

    <div class="inputArea">

        <input
            id="textInput"
            class="textInput"
            type="text"
            autocomplete="off"
            placeholder="اكتب رسالة...">

        <button
            id="sendButton"
            class="sendButton"
            type="button">
            ➤
        </button>

        <button
            id="voiceButton"
            class="voiceButton"
            type="button">
            🎤
        </button>

    </div>

</div>


<script type="module">

/* ======================================================
   Firebase
====================================================== */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    query,
    orderBy,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ======================================================
   Firebase Config
====================================================== */

const firebaseConfig = {

    apiKey: "ضع_API_KEY_هنا",

    authDomain:
        "ضع_AUTH_DOMAIN_هنا",

    projectId:
        "ضع_PROJECT_ID_هنا",

    storageBucket:
        "ضع_STORAGE_BUCKET_هنا",

    messagingSenderId:
        "ضع_MESSAGING_SENDER_ID_هنا",

    appId:
        "ضع_APP_ID_هنا"

};


/* ======================================================
   Firebase تشغيل
====================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ======================================================
   عناصر الصفحة
====================================================== */

const messages =
    document.getElementById("messages");

const textInput =
    document.getElementById("textInput");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const friendName =
    document.getElementById("friendName");

const friendAvatar =
    document.getElementById("friendAvatar");

const friendStatus =
    document.getElementById("friendStatus");

const backButton =
    document.getElementById("backButton");

const emptyMessage =
    document.getElementById("emptyMessage");


/* ======================================================
   متغيرات المحادثة
====================================================== */

let currentUser = null;

let friend = null;

let chatID = null;

let unsubscribeMessages = null;


/* ======================================================
   الحصول على بيانات الطرف الآخر
====================================================== */

function getFriendData(){

    try{

        const saved =
            localStorage.getItem("chatFriend");

        if(saved){

            return JSON.parse(saved);

        }

    }catch(error){

        console.error(
            "خطأ قراءة بيانات الصديق:",
            error
        );

    }

    return null;

}


/* ======================================================
   إنشاء Chat ID ثابت
====================================================== */

function createChatID(uid1,uid2){

    return [uid1,uid2]
        .sort()
        .join("_");

}


/* ======================================================
   تشغيل المحادثة
====================================================== */

function startChat(){

    friend =
        getFriendData();


    if(!friend){

        friend = {

            uid:
                localStorage.getItem(
                    "friendUID"
                ),

            name:
                localStorage.getItem(
                    "friendName"
                ) || "المستخدم",

            photoURL:
                localStorage.getItem(
                    "friendPhoto"
                ) || ""

        };

    }


    if(
        !currentUser ||
        !friend ||
        !friend.uid
    ){

        console.error(
            "بيانات المحادثة غير مكتملة"
        );

        friendStatus.textContent =
            "تعذر فتح المحادثة";

        return;

    }


    chatID =
        createChatID(
            currentUser.uid,
            friend.uid
        );


    window.chatDB =
        db;

    window.chatID =
        chatID;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friend;


    friendName.textContent =
        friend.name || "المستخدم";


    if(friend.photoURL){

        friendAvatar.innerHTML = "";

        const image =
            document.createElement("img");

        image.src =
            friend.photoURL;

        image.alt =
            "";

        friendAvatar.appendChild(
            image
        );

    }


    loadMessages();

}


/* ======================================================
   تحميل الرسائل
====================================================== */

function loadMessages(){

    if(unsubscribeMessages){

        unsubscribeMessages();

    }


    const messagesRef =
        collection(
            db,
            "chats",
            chatID,
            "messages"
        );


    const messagesQuery =
        query(
            messagesRef,
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(
            messagesQuery,
            snapshot => {

                messages.innerHTML = "";

                if(snapshot.empty){

                    messages.appendChild(
                        emptyMessage
                    );

                    return;

                }


                snapshot.forEach(
                    doc => {

                        const data =
                            doc.data();

                        renderMessage(
                            data
                        );

                    }
                );


                scrollToBottom();

            },
            error => {

                console.error(
                    "خطأ تحميل الرسائل:",
                    error
                );

            }
        );

}


/* ======================================================
   عرض رسالة
====================================================== */

function renderMessage(data){

    const isMe =
        data.senderId === currentUser.uid;


    const row =
        document.createElement("div");

    row.className =
        "messageRow " +
        (isMe ? "me" : "friend");


    const bubble =
        document.createElement("div");

    bubble.className =
        "message " +
        (isMe ? "me" : "friend");


    /* ==========================
       رسالة نصية
    ========================== */

    if(data.type === "text"){

        const text =
            document.createElement("div");

        text.className =
            "messageText";

        text.textContent =
            data.text || "";

        bubble.appendChild(
            text
        );

    }


    /* ==========================
       رسالة صوتية
    ========================== */

    else if(data.type === "voice"){

        const voice =
            document.createElement("div");

        voice.className =
            "voiceMessage";


        const play =
            document.createElement("button");

        play.className =
            "playVoice";

        play.type =
            "button";

        play.textContent =
            "▶";


        const info =
            document.createElement("div");

        info.className =
            "voiceInfo";


        const label =
            document.createElement("div");

        label.className =
            "voiceLabel";

        label.textContent =
            "رسالة صوتية";


        const audio =
            document.createElement("audio");

        audio.className =
            "voiceAudio";

        audio.controls =
            true;

        audio.preload =
            "metadata";


        if(data.audio){

            audio.src =
                data.audio;

        }


        play.addEventListener(
            "click",
            () => {

                if(
                    audio.paused
                ){

                    audio.play()
                        .catch(
                            error =>
                            console.error(
                                error
                            )
                        );

                }else{

                    audio.pause();

                }

            }
        );


        audio.addEventListener(
            "play",
            () => {

                play.textContent =
                    "⏸";

            }
        );


        audio.addEventListener(
            "pause",
            () => {

                play.textContent =
                    "▶";

            }
        );


        info.appendChild(
            label
        );

        info.appendChild(
            audio
        );


        voice.appendChild(
            play
        );

        voice.appendChild(
            info
        );


        bubble.appendChild(
            voice
        );

    }


    /* ==========================
       الوقت
    ========================== */

    const time =
        document.createElement("div");

    time.className =
        "messageTime";

    time.textContent =
        formatTime(
            data.createdAt
        );


    bubble.appendChild(
        time
    );


    row.appendChild(
        bubble
    );


    messages.appendChild(
        row
    );

}


/* ======================================================
   الوقت
====================================================== */

function formatTime(timestamp){

    if(
        !timestamp ||
        !timestamp.toDate
    ){

        return "";

    }


    try{

        return timestamp
            .toDate()
            .toLocaleTimeString(
                "ar",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }catch{

        return "";

    }

}


/* ======================================================
   النزول لآخر رسالة
====================================================== */

function scrollToBottom(){

    requestAnimationFrame(
        () => {

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* ======================================================
   إرسال رسالة نصية
====================================================== */

async function sendText(){

    const text =
        textInput.value.trim();


    if(!text){

        return;

    }


    if(
        !currentUser ||
        !friend ||
        !chatID
    ){

        alert(
            "المحادثة غير جاهزة"
        );

        return;

    }


    textInput.value = "";


    try{

        await addDoc(

            collection(
                db,
                "chats",
                chatID,
                "messages"
            ),

            {

                type:
                    "text",

                text:
                    text,

                senderId:
                    currentUser.uid,

                receiverId:
                    friend.uid,

                createdAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "خطأ إرسال الرسالة:",
            error
        );


        alert(
            "تعذر إرسال الرسالة"
        );


        textInput.value =
            text;

    }

}


/* ======================================================
   زر الإرسال
====================================================== */

sendButton.addEventListener(
    "click",
    sendText
);


/* ======================================================
   Enter
====================================================== */

textInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendText();

        }

    }
);


/* ======================================================
   زر الرجوع
====================================================== */

backButton.addEventListener(
    "click",
    () => {

        history.back();

    }
);


/* ======================================================
   تسجيل الصوت
====================================================== */

let mediaRecorder = null;

let audioStream = null;

let audioChunks = [];

let isRecording = false;

let isStarting = false;

let stopRequested = false;

let sendingVoice = false;


/* ======================================================
   إعداد زر الصوت
====================================================== */

voiceButton.style.touchAction =
    "none";

voiceButton.style.userSelect =
    "none";

voiceButton.style.webkitUserSelect =
    "none";


/* ======================================================
   الضغط على الميكروفون
====================================================== */

voiceButton.addEventListener(
    "pointerdown",
    async event => {

        event.preventDefault();


        if(
            voiceButton.setPointerCapture
        ){

            try{

                voiceButton.setPointerCapture(
                    event.pointerId
                );

            }catch(e){}

        }


        if(
            isRecording ||
            isStarting ||
            sendingVoice
        ){

            return;

        }


        isStarting =
            true;

        stopRequested =
            false;


        try{

            await startRecording();

        }catch(error){

            console.error(
                "خطأ تشغيل التسجيل:",
                error
            );


            stopMicrophone();

            resetVoice();


            if(
                error.name ===
                "NotAllowedError"
            ){

                alert(
                    "⚠️ اسمح للموقع باستخدام الميكروفون"
                );

            }else{

                alert(
                    "❌ تعذر تشغيل الميكروفون"
                );

            }

        }finally{

            isStarting =
                false;

        }


        if(
            stopRequested &&
            isRecording
        ){

            stopRecording();

        }

    }
);


/* ======================================================
   رفع الإصبع
====================================================== */

voiceButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        stopRequested =
            true;


        if(isRecording){

            stopRecording();

        }

    }
);


/* ======================================================
   إلغاء اللمس
====================================================== */

voiceButton.addEventListener(
    "pointercancel",
    event => {

        event.preventDefault();

        stopRequested =
            true;

        stopRecording();

    }
);


/* ======================================================
   إذا خرج المؤشر
====================================================== */

voiceButton.addEventListener(
    "lostpointercapture",
    () => {

        if(isRecording){

            stopRequested =
                true;

            stopRecording();

        }

    }
);


/* ======================================================
   بدء التسجيل
====================================================== */

async function startRecording(){

    if(
        !window.chatDB ||
        !window.chatID ||
        !window.chatUser ||
        !window.chatFriend
    ){

        throw new Error(
            "Firebase chat variables missing"
        );

    }


    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "getUserMedia غير مدعوم"
        );

    }


    if(
        typeof MediaRecorder ===
        "undefined"
    ){

        throw new Error(
            "MediaRecorder غير مدعوم"
        );

    }


    audioStream =
        await navigator.mediaDevices.getUserMedia({

            audio:{

                echoCancellation:
                    true,

                noiseSuppression:
                    true,

                autoGainControl:
                    true

            }

        });


    let mimeType = "";


    const types = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/mp4",

        "audio/ogg;codecs=opus"

    ];


    for(
        const type of types
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            mimeType =
                type;

            break;

        }

    }


    if(mimeType){

        mediaRecorder =
            new MediaRecorder(
                audioStream,
                {
                    mimeType:
                        mimeType
                }
            );

    }else{

        mediaRecorder =
            new MediaRecorder(
                audioStream
            );

    }


    audioChunks = [];


    mediaRecorder.ondataavailable =
        event => {

            if(
                event.data &&
                event.data.size > 0
            ){

                audioChunks.push(
                    event.data
                );

            }

        };


    mediaRecorder.onstop =
        async () => {

            await finishRecording();

        };


    mediaRecorder.onerror =
        event => {

            console.error(
                "MediaRecorder error:",
                event.error
            );

        };


    mediaRecorder.start();


    isRecording =
        true;


    voiceButton.textContent =
        "🔴";


    voiceButton.classList.add(
        "recording"
    );

}


/* ======================================================
   إيقاف التسجيل
====================================================== */

function stopRecording(){

    if(!isRecording){

        return;

    }


    if(!mediaRecorder){

        return;

    }


    if(
        mediaRecorder.state ===
        "inactive"
    ){

        return;

    }


    try{

        mediaRecorder.stop();

    }catch(error){

        console.error(
            "Stop error:",
            error
        );

    }

}


/* ======================================================
   إنهاء التسجيل وإرسال الصوت
====================================================== */

async function finishRecording(){

    if(sendingVoice){

        return;

    }


    sendingVoice =
        true;


    try{

        stopMicrophone();


        if(
            audioChunks.length === 0
        ){

            throw new Error(
                "لم يتم تسجيل صوت"
            );

        }


        const mimeType =
            mediaRecorder?.mimeType ||
            "audio/webm";


        const blob =
            new Blob(
                audioChunks,
                {
                    type:
                        mimeType
                }
            );


        if(
            blob.size === 0
        ){

            throw new Error(
                "ملف الصوت فارغ"
            );

        }


        /*
         * Firestore له حد لحجم المستند.
         * نضع حدًا آمنًا للصوت.
         */

        if(
            blob.size > 700000
        ){

            alert(
                "⚠️ التسجيل طويل جدًا. سجل مقطعًا أقصر."
            );

            return;

        }


        const base64 =
            await blobToBase64(
                blob
            );


        await addDoc(

            collection(
                db,
                "chats",
                chatID,
                "messages"
            ),

            {

                type:
                    "voice",

                audio:
                    base64,

                mimeType:
                    mimeType,

                senderId:
                    currentUser.uid,

                receiverId:
                    friend.uid,

                createdAt:
                    serverTimestamp()

            }

        );


        console.log(
            "✅ تم إرسال الرسالة الصوتية"
        );

    }catch(error){

        console.error(
            "Voice error:",
            error
        );


        alert(
            "حدث خطأ أثناء إرسال الرسالة الصوتية"
        );

    }finally{

        resetVoice();

        sendingVoice =
            false;

    }

}


/* ======================================================
   Blob → Base64
====================================================== */

function blobToBase64(blob){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onloadend =
                () => {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                blob
            );

        }
    );

}


/* ======================================================
   إيقاف الميكروفون
====================================================== */

function stopMicrophone(){

    if(!audioStream){

        return;

    }


    audioStream
        .getTracks()
        .forEach(
            track => {

                try{

                    track.stop();

                }catch(e){}

            }
        );


    audioStream =
        null;

}


/* ======================================================
   إعادة زر الصوت
====================================================== */

function resetVoice(){

    stopMicrophone();


    mediaRecorder =
        null;

    audioChunks =
        [];

    isRecording =
        false;

    isStarting =
        false;

    stopRequested =
        false;


    voiceButton.textContent =
        "🎤";


    voiceButton.classList.remove(
        "recording"
    );

}


/* ======================================================
   منع قائمة الضغط المطول
====================================================== */

voiceButton.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);


/* ======================================================
   تسجيل الدخول
====================================================== */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            alert(
                "يجب تسجيل الدخول أولًا"
            );

            return;

        }


        currentUser =
            user;


        startChat();

    }
);

</script>
