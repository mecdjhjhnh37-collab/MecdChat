<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    overflow:hidden;
}

.app{
    height:100vh;
    max-width:650px;
    margin:auto;

    display:flex;
    flex-direction:column;
}

header{
    height:75px;

    display:flex;
    align-items:center;

    gap:12px;

    padding:12px 15px;

    background:#050807;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    flex-shrink:0;
}

.back{
    width:45px;
    height:45px;

    border:0;
    border-radius:15px;

    background:#18231f;

    color:white;

    font-size:22px;

    cursor:pointer;
}

.avatar{
    width:48px;
    height:48px;

    border-radius:16px;

    background:#12352c;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:24px;

    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:17px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:12px;

    color:#777;

    margin-top:5px;

    transition:.2s;
}

.user-status.online{
    color:#00e889;
}

.user-status.typing{
    color:#00e889;
    font-weight:bold;
}

.call-buttons{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.call-buttons button{
    width:42px;
    height:42px;

    border:0;
    border-radius:14px;

    background:#18231f;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.call-buttons button:active{
    transform:scale(.94);
}

.messages{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:20px 15px 150px;

    display:flex;
    flex-direction:column;

    gap:10px;
}

.empty{
    margin:auto;

    text-align:center;

    color:#72817c;
}

.message{
    max-width:78%;

    padding:12px 15px;

    border-radius:18px;

    position:relative;

    word-break:break-word;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;
}

.message.mine{
    align-self:flex-start;

    background:#00c96b;

    color:#00150e;

    border-bottom-left-radius:5px;
}

.message.other{
    align-self:flex-end;

    background:#18231f;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-right-radius:5px;
}

.time{
    display:inline-block;

    font-size:9px;

    opacity:.6;

    margin-top:5px;
}

.message-meta{
    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:5px;

    margin-top:5px;
}

.message-status{
    font-size:12px;

    line-height:1;

    font-weight:bold;

    letter-spacing:-3px;

    direction:ltr;

    display:inline-block;

    min-width:16px;

    transition:.2s;
}

.message-status.sent{
    opacity:.65;
}

.message-status.read{
    color:#006dff;
    opacity:1;
}

.message-status.pending{
    opacity:.5;
}

.input-area{
    position:fixed;

    bottom:0;

    left:50%;

    transform:
        translateX(-50%);

    width:100%;

    max-width:650px;

    padding:10px;

    display:flex;

    gap:8px;

    background:#050807;

    z-index:50;
}

#messageInput{
    flex:1;

    min-width:0;

    padding:14px;

    border-radius:17px;

    border:
        1px solid
        #27332f;

    background:#111916;

    color:white;

    outline:none;

    font-size:15px;
}

#messageInput:focus{
    border-color:#00e889;
}

#voiceButton,
#sendButton{
    width:50px;

    height:50px;

    border:0;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;

    flex-shrink:0;
}

#voiceButton{
    background:#18231f;

    color:white;
}

#sendButton{
    background:#00e889;

    color:#00150e;
}

#sendButton:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.message-menu{
    position:absolute;

    left:50%;

    bottom:calc(100% + 8px);

    transform:
        translateX(-50%);

    width:max-content;

    min-width:150px;

    max-width:
        calc(100vw - 30px);

    padding:5px;

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    border-radius:15px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.55);

    z-index:99999;

    animation:
        showMenu .18s ease;
}

.message-menu button{
    width:100%;

    min-width:140px;

    padding:10px 14px;

    border:0;

    border-radius:11px;

    background:#18231f;

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    white-space:nowrap;

    text-align:center;
}

@keyframes showMenu{

    from{
        opacity:0;

        transform:
            translate(-50%,8px);
    }

    to{
        opacity:1;

        transform:
            translate(-50%,0);
    }

}

/* ============================================================
   رسالة المكالمة
============================================================ */

.call-message{
    min-width:245px;

    max-width:310px;

    padding:10px 12px !important;

    overflow:visible;
}

.call-message.mine{
    background:#00c96b;
    color:#00150e;
}

.call-message.other{
    background:#18231f;
    color:white;
}

.call-box{
    display:flex;

    align-items:center;

    gap:11px;

    min-height:55px;
}

.call-icon{
    width:46px;
    height:46px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    font-size:22px;

    background:
        rgba(0,232,137,.14);

    color:#00e889;
}

.call-message.missed .call-icon{
    background:
        rgba(255,80,80,.15);

    color:#ff6464;
}

.call-info{
    min-width:0;

    flex:1;
}

.call-title{
    font-size:14px;

    font-weight:bold;

    line-height:1.4;
}

.call-subtitle{
    font-size:11px;

    opacity:.65;

    margin-top:4px;
}

.call-duration{
    display:inline-flex;

    align-items:center;

    gap:4px;

    font-size:11px;

    margin-top:4px;

    opacity:.75;
}

.call-direction{
    font-size:10px;

    opacity:.55;

    margin-top:3px;
}

.call-message .time{
    text-align:left;

    margin-top:6px;
}

/* ============================================================
   الهاتف
============================================================ */

@media(max-width:500px){

    .call-message{
        min-width:225px;
        max-width:85%;
    }

    .message{
        max-width:84%;
    }

    header{
        padding:12px;
    }

    .call-buttons button{
        width:40px;
        height:40px;
    }

}

</style>

</head>

<body>

<div id="loading"
     style="
     position:fixed;
     inset:0;
     display:flex;
     align-items:center;
     justify-content:center;
     background:#020504;
     color:white;
     font-size:18px;
     z-index:9999;">

    جارٍ فتح الدردشة...

</div>

<main id="app"
      class="app"
      style="display:none;">

<header>

<button id="backButton"
        class="back"
        type="button">

    →

</button>

<div id="friendAvatar"
     class="avatar">

    👤

</div>

<div class="user-info">

<div id="friendName"
     class="user-name">

    جار التحميل...

</div>

<div id="friendStatus"
     class="user-status">

    ● غير متصل

</div>

</div>

<div class="call-buttons">

<button id="callButton"
        type="button">

    📞

</button>

<button id="videoButton"
        type="button">

    📹

</button>

</div>

</header>

<div id="messages"
     class="messages">

<div class="empty">

    💬

    <br>

    ابدأ المحادثة الآن

</div>

</div>

<div class="input-area">

<input id="messageInput"
       placeholder="اكتب رسالة..."
       autocomplete="off"
       maxlength="2000">

<button id="voiceButton"
        type="button">

    🎤

</button>

<button id="sendButton"
        type="button">

    ➤

</button>

</div>

</main>

<script type="module">

// ============================================================
// Firebase
// ============================================================

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    query,
    orderBy,
    onSnapshot,
    addDoc,
    deleteDoc,
    updateDoc,
    arrayUnion,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

    apiKey:
        "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

    authDomain:
        "mecd-tools.firebaseapp.com",

    projectId:
        "mecd-tools",

    storageBucket:
        "mecd-tools.firebasestorage.app",

    messagingSenderId:
        "643005547408",

    appId:
        "1:643005547408:web:b1719060ec340dd0e0a915"

};

const firebaseApp =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(
        firebaseApp
    );

const db =
    getFirestore(
        firebaseApp
    );

window.chatDB =
    db;


// ============================================================
// العناصر
// ============================================================

const $ =
    id =>
        document.getElementById(id);

const messages =
    $("messages");

const messageInput =
    $("messageInput");

const sendButton =
    $("sendButton");

const friendName =
    $("friendName");

const friendAvatar =
    $("friendAvatar");

const friendStatus =
    $("friendStatus");

const backButton =
    $("backButton");

const callButton =
    $("callButton");

const videoButton =
    $("videoButton");

const loading =
    $("loading");

const app =
    $("app");


// ============================================================
// المتغيرات
// ============================================================

let currentUser =
    null;

let friendUser =
    null;

let chatID =
    null;

let unsubscribeMessages =
    null;

let unsubscribeFriendStatus =
    null;

let unsubscribeFriendTyping =
    null;

let presenceInterval =
    null;

let typingTimer =
    null;

let typingState =
    false;

let callModule =
    null;


// ============================================================
// تحميل نظام المكالمات
// ============================================================

async function loadCallSystem(){

    try{

        callModule =
            await import(
                "./call.js"
            );

        console.log(
            "Mecd Call system loaded"
        );

        if(
            typeof callModule.listenIncomingCalls ===
            "function"
        ){

            await callModule
                .listenIncomingCalls();

        }

    }catch(error){

        console.error(
            "Call system error:",
            error
        );

    }

}


// ============================================================
// Chat ID
// ============================================================

function createChatID(a,b){

    return [

        a,
        b

    ]
    .sort()
    .join("_");

}


// ============================================================
// إظهار التطبيق
// ============================================================

function showApp(){

    loading.style.display =
        "none";

    app.style.display =
        "flex";

}


// ============================================================
// الخطأ
// ============================================================

function showError(error){

    console.error(
        "Mecd Chat error:",
        error
    );

    loading.innerHTML =

        '<div style="text-align:center;padding:20px">' +

        '⚠️ تعذر فتح الدردشة<br>' +

        '<small style="color:#777">' +

        escapeHtml(
            error?.message ||
            "حدث خطأ"
        ) +

        '</small>' +

        '</div>';

}


// ============================================================
// حماية HTML
// ============================================================

function escapeHtml(value){

    return String(value)

        .replace(
            /[&<>'"]/g,

            c => ({

                '&':
                    '&amp;',

                '<':
                    '&lt;',

                '>':
                    '&gt;',

                "'":
                    '&#39;',

                '"':
                    '&quot;'

            }[c])

        );

}


// ============================================================
// Presence
// ============================================================

async function updateMyPresence(
    online = true
){

    if(!currentUser){

        return;

    }

    try{

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {

                online:
                    online,

                lastSeen:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Presence error:",
            error
        );

    }

}


function startPresence(){

    updateMyPresence(
        true
    );

    if(presenceInterval){

        clearInterval(
            presenceInterval
        );

    }

    presenceInterval =
        setInterval(

            () => {

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    updateMyPresence(
                        true
                    );

                }

            },

            10000

        );

}


function stopPresence(){

    if(presenceInterval){

        clearInterval(
            presenceInterval
        );

        presenceInterval =
            null;

    }

    if(currentUser){

        updateMyPresence(
            false
        );

    }

}


// ============================================================
// حالة الصديق
// ============================================================

function listenFriendStatus(){

    if(!friendUser){

        return;

    }

    if(unsubscribeFriendStatus){

        unsubscribeFriendStatus();

    }

    const ref =
        doc(
            db,
            "users",
            friendUser.uid
        );

    unsubscribeFriendStatus =
        onSnapshot(

            ref,

            snap => {

                if(
                    !snap.exists()
                ){

                    friendStatus.textContent =
                        "● غير متصل";

                    friendStatus.classList.remove(
                        "online"
                    );

                    return;

                }

                const data =
                    snap.data();

                const lastSeen =
                    data.lastSeen?.toMillis?.() ||
                    0;

                const online =
                    data.online === true &&
                    lastSeen > 0 &&
                    Date.now() -
                    lastSeen <
                    30000;

                if(
                    !friendStatus.classList.contains(
                        "typing"
                    )
                ){

                    friendStatus.textContent =
                        online
                        ?
                        "● متصل"
                        :
                        "● غير متصل";

                }

                friendStatus.classList.toggle(
                    "online",
                    online
                );

            },

            error => {

                console.error(
                    "Friend status error:",
                    error
                );

            }

        );

}


// ============================================================
// ✍️ حالة الكتابة - الاستماع
// ============================================================

function listenFriendTyping(){

    if(!friendUser){

        return;

    }

    if(unsubscribeFriendTyping){

        unsubscribeFriendTyping();

    }

    const typingRef =
        doc(

            db,

            "chats",

            chatID,

            "typing",

            friendUser.uid

        );

    unsubscribeFriendTyping =
        onSnapshot(

            typingRef,

            snap => {

                if(
                    !snap.exists()
                ){

                    setTypingUI(
                        false
                    );

                    return;

                }

                const data =
                    snap.data();

                const updated =
                    data.updatedAt?.toMillis?.() ||
                    0;

                const isFresh =
                    data.typing === true &&
                    (
                        !updated ||
                        Date.now() -
                        updated <
                        5000
                    );

                setTypingUI(
                    isFresh
                );

            },

            error => {

                console.error(
                    "Typing listener error:",
                    error
                );

            }

        );

}


// ============================================================
// ✍️ واجهة يكتب...
// ============================================================

function setTypingUI(
    typing
){

    if(typing){

        friendStatus.textContent =
            "يكتب...";

        friendStatus.classList.add(
            "typing"
        );

        friendStatus.classList.remove(
            "online"
        );

    }else{

        friendStatus.classList.remove(
            "typing"
        );

        listenFriendStatus();

    }

}


// ============================================================
// ✍️ تحديث حالة الكتابة
// ============================================================

async function updateTyping(
    typing
){

    if(
        !currentUser ||
        !chatID
    ){

        return;

    }

    if(
        typingState ===
        typing
    ){

        return;

    }

    typingState =
        typing;

    try{

        await setDoc(

            doc(

                db,

                "chats",

                chatID,

                "typing",

                currentUser.uid

            ),

            {

                typing:
                    typing,

                updatedAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Typing update error:",
            error
        );

    }

}


// ============================================================
// ✍️ عند الكتابة
// ============================================================

messageInput.addEventListener(

    "input",

    () => {

        const hasText =
            messageInput.value.trim()
                .length > 0;

        if(!hasText){

            clearTimeout(
                typingTimer
            );

            updateTyping(
                false
            );

            return;

        }

        updateTyping(
            true
        );

        clearTimeout(
            typingTimer
        );

        typingTimer =
            setTimeout(

                () => {

                    updateTyping(
                        false
                    );

                },

                1500

            );

    }

);


// ============================================================
// تحميل الصديق
// ============================================================

async function loadFriend(){

    const id =
        new URLSearchParams(
            location.search
        ).get("friend");

    if(!id){

        throw new Error(
            "لا يوجد صديق في الرابط"
        );

    }

    const userDoc =
        await getDoc(

            doc(
                db,
                "users",
                id
            )

        );

    if(
        !userDoc.exists()
    ){

        throw new Error(
            "المستخدم غير موجود"
        );

    }

    const data =
        userDoc.data();

    friendUser = {

        uid:
            id,

        name:
            data.name ||
            "مستخدم Mecd",

        photo:
            data.photo ||
            ""

    };

    friendName.textContent =
        friendUser.name;

    friendAvatar.innerHTML =
        friendUser.photo

        ?

        '<img src="' +
        escapeHtml(
            friendUser.photo
        ) +
        '" alt="صورة الحساب">'

        :

        "👤";

    chatID =
        createChatID(

            currentUser.uid,

            friendUser.uid

        );

    window.chatDB =
        db;

    window.chatID =
        chatID;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friendUser;

    await setDoc(

        doc(
            db,
            "chats",
            chatID
        ),

        {

            members:[

                currentUser.uid,
                friendUser.uid

            ],

            createdAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );

    listenFriendStatus();

    listenFriendTyping();

}


// ============================================================
// مدة المكالمة
// ============================================================

function formatCallDuration(
    seconds
){

    seconds =
        Number(
            seconds || 0
        );

    if(
        !Number.isFinite(
            seconds
        )
    ){

        seconds =
            0;

    }

    seconds =
        Math.max(
            0,
            Math.floor(
                seconds
            )
        );

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    const hours =
        Math.floor(
            minutes / 60
        );

    const finalMinutes =
        minutes % 60;

    if(hours > 0){

        return (

            String(hours)
                .padStart(2,"0")

            + ":" +

            String(finalMinutes)
                .padStart(2,"0")

            + ":" +

            String(secs)
                .padStart(2,"0")

        );

    }

    return (

        String(minutes)
            .padStart(2,"0")

        + ":" +

        String(secs)
            .padStart(2,"0")

    );

}


// ============================================================
// رسالة المكالمة
// ============================================================

function createCallMessageElement(
    box,
    data
){

    const status =
        data.callStatus ||
        "completed";

    const direction =
        data.callerId ===
        currentUser.uid

        ?

        "outgoing"

        :

        "incoming";

    const missed =
        status ===
        "missed";

    box.classList.add(
        "call-message"
    );

    if(missed){

        box.classList.add(
            "missed"
        );

    }

    const callBox =
        document.createElement(
            "div"
        );

    callBox.className =
        "call-box";

    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "call-icon";

    icon.textContent =
        "📞";

    const info =
        document.createElement(
            "div"
        );

    info.className =
        "call-info";

    const title =
        document.createElement(
            "div"
        );

    title.className =
        "call-title";

    if(missed){

        title.textContent =

            direction ===
            "incoming"

            ?

            "مكالمة واردة لم يتم الرد عليها"

            :

            "مكالمة صادرة لم يتم الرد عليها";

    }else{

        title.textContent =

            direction ===
            "incoming"

            ?

            "مكالمة واردة"

            :

            "مكالمة صادرة";

    }

    const subtitle =
        document.createElement(
            "div"
        );

    subtitle.className =
        "call-subtitle";

    subtitle.textContent =

        missed

        ?

        "لم يتم الرد"

        :

        "تم الاتصال بنجاح";

    const duration =
        document.createElement(
            "div"
        );

    duration.className =
        "call-duration";

    duration.textContent =
        "⏱️ " +
        formatCallDuration(
            data.duration
        );

    const directionText =
        document.createElement(
            "div"
        );

    directionText.className =
        "call-direction";

    directionText.textContent =

        direction ===
        "incoming"

        ?

        "↙ واردة"

        :

        "↗ صادرة";

    info.appendChild(
        title
    );

    info.appendChild(
        subtitle
    );

    info.appendChild(
        duration
    );

    info.appendChild(
        directionText
    );

    callBox.appendChild(
        icon
    );

    callBox.appendChild(
        info
    );

    box.appendChild(
        callBox
    );

}


// ============================================================
// 🔵 حالة الرسالة
// ============================================================

function createMessageStatus(
    data
){

    if(
        data.senderId !==
        currentUser.uid
    ){

        return null;

    }

    const status =
        data.read === true
        ?
        "read"
        :
        "sent";

    const statusElement =
        document.createElement(
            "span"
        );

    statusElement.className =
        "message-status " +
        status;

    statusElement.textContent =
        status ===
        "read"
        ?
        "✓✓"
        :
        "✓";

    statusElement.title =
        status ===
        "read"
        ?
        "مقروءة"
        :
        "تم الإرسال";

    return statusElement;

}


// ============================================================
// 📖 تعليم الرسالة كمقروءة
// ============================================================

async function markMessageAsRead(
    id,
    data
){

    if(
        !currentUser ||
        data.senderId ===
        currentUser.uid
    ){

        return;

    }

    if(
        data.read ===
        true
    ){

        return;

    }

    try{

        await updateDoc(

            doc(

                db,

                "chats",

                chatID,

                "messages",

                id

            ),

            {

                read:
                    true,

                readAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "Read status error:",
            error
        );

    }

}


// ============================================================
// الرسائل
// ============================================================

function renderMessages(snap){

    if(
        !renderMessages.elements
    ){

        renderMessages.elements =
            new Map();

    }

    const elements =
        renderMessages.elements;

    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight <
        120;

    function createMessageElement(
        id,
        data
    ){

        if(
            Array.isArray(
                data.deletedFor
            )
            &&
            data.deletedFor.includes(
                currentUser.uid
            )
        ){

            return null;

        }

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "message " +

            (

                data.senderId ===
                currentUser.uid

                ?

                "mine"

                :

                "other"

            );

        // ====================================================
        // 📞 مكالمة
        // ====================================================

        if(
            data.type ===
            "call"
        ){

            createCallMessageElement(
                box,
                data
            );

        }

        // ====================================================
        // 🎤 صوت
        // ====================================================

        else if(
            data.type ===
            "voice"
        ){

            const audio =
                document.createElement(
                    "audio"
                );

            audio.controls =
                true;

            audio.src =
                data.audio ||
                "";

            audio.style.width =
                "230px";

            audio.style.maxWidth =
                "100%";

            box.appendChild(
                audio
            );

            const voiceText =
                document.createElement(
                    "span"
                );

            voiceText.textContent =
                "🎤 رسالة صوتية";

            voiceText.style.display =
                "block";

            voiceText.style.fontSize =
                "12px";

            box.appendChild(
                voiceText
            );

        }

        // ====================================================
        // 💬 نص
        // ====================================================

        else{

            box.appendChild(

                document.createTextNode(

                    data.text ||
                    ""

                )

            );

        }

        // ====================================================
        // الوقت والحالة
        // ====================================================

        const meta =
            document.createElement(
                "span"
            );

        meta.className =
            "message-meta";

        const time =
            document.createElement(
                "span"
            );

        time.className =
            "time";

        if(
            data.createdAt?.toDate
        ){

            time.textContent =

                data.createdAt
                    .toDate()
                    .toLocaleTimeString(

                        "ar",

                        {

                            hour:
                                "2-digit",

                            minute:
                                "2-digit"

                        }

                    );

        }

        meta.appendChild(
            time
        );

        const status =
            createMessageStatus(
                data
            );

        if(status){

            meta.appendChild(
                status
            );

        }

        box.appendChild(
            meta
        );

        // ====================================================
        // حذف
        // ====================================================

        if(
            data.type !==
            "call"
        ){

            addMessageActions(

                box,

                id,

                data.senderId ===
                currentUser.uid

            );

        }

        return box;

    }


    snap.docChanges()
        .forEach(

            change => {

                const id =
                    change.doc.id;

                const data =
                    change.doc.data();

                // ------------------------------------------------
                // 📖 أي رسالة واردة تظهر = مقروءة
                // ------------------------------------------------

                if(
                    change.type ===
                    "added" ||
                    change.type ===
                    "modified"
                ){

                    if(
                        data.senderId !==
                        currentUser.uid
                    ){

                        markMessageAsRead(
                            id,
                            data
                        );

                    }

                }

                if(
                    change.type ===
                    "added"
                ){

                    const element =
                        createMessageElement(
                            id,
                            data
                        );

                    if(element){

                        elements.set(
                            id,
                            element
                        );

                        messages.appendChild(
                            element
                        );

                    }

                }

                else if(
                    change.type ===
                    "modified"
                ){

                    const oldElement =
                        elements.get(
                            id
                        );

                    if(
                        Array.isArray(
                            data.deletedFor
                        )
                        &&
                        data.deletedFor.includes(
                            currentUser.uid
                        )
                    ){

                        if(oldElement){

                            oldElement.remove();

                            elements.delete(
                                id
                            );

                        }

                        return;

                    }

                    const newElement =
                        createMessageElement(
                            id,
                            data
                        );

                    if(!newElement){

                        return;

                    }

                    if(oldElement){

                        oldElement.replaceWith(
                            newElement
                        );

                    }else{

                        messages.appendChild(
                            newElement
                        );

                    }

                    elements.set(
                        id,
                        newElement
                    );

                }

                else if(
                    change.type ===
                    "removed"
                ){

                    const element =
                        elements.get(
                            id
                        );

                    if(element){

                        element.remove();

                        elements.delete(
                            id
                        );

                    }

                }

            }

        );

    const realMessages =
        messages.querySelectorAll(
            ".message"
        );

    const empty =
        messages.querySelector(
            ".empty"
        );

    if(
        realMessages.length ===
        0
    ){

        if(!empty){

            const emptyBox =
                document.createElement(
                    "div"
                );

            emptyBox.className =
                "empty";

            emptyBox.innerHTML =
                "💬<br>ابدأ المحادثة الآن";

            messages.appendChild(
                emptyBox
            );

        }

    }else{

        if(empty){

            empty.remove();

        }

    }

    if(nearBottom){

        requestAnimationFrame(

            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }

        );

    }

}


// ============================================================
// استقبال الرسائل
// ============================================================

function listenMessages(){

    if(unsubscribeMessages){

        unsubscribeMessages();

    }

    const ref =
        collection(

            db,

            "chats",

            chatID,

            "messages"

        );

    const q =
        query(

            ref,

            orderBy(
                "createdAt",
                "asc"
            )

        );

    unsubscribeMessages =
        onSnapshot(

            q,

            renderMessages,

            error => {

                console.error(
                    "Messages error:",
                    error
                );

            }

        );

}


// ============================================================
// إرسال رسالة
// ============================================================

async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(
        !text ||
        !currentUser ||
        !friendUser ||
        !chatID
    ){

        return;

    }

    sendButton.disabled =
        true;

    clearTimeout(
        typingTimer
    );

    await updateTyping(
        false
    );

    try{

        await addDoc(

            collection(

                db,

                "chats",

                chatID,

                "messages"

            ),

            {

                text:
                    text,

                senderId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                type:
                    "text",

                // ==============================================
                // ✓ تم الإرسال
                // ==============================================

                read:
                    false,

                createdAt:
                    serverTimestamp()

            }

        );

        messageInput.value =
            "";

        messageInput.focus();

    }

    catch(error){

        console.error(
            "Send message error:",
            error
        );

        alert(
            "حدث خطأ أثناء إرسال الرسالة"
        );

    }

    sendButton.disabled =
        false;

}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(

    "keydown",

    e => {

        if(
            e.key ===
            "Enter"
        ){

            e.preventDefault();

            sendMessage();

        }

    }

);


// ============================================================
// حذف الرسائل
// ============================================================

function removeMenus(){

    document
        .querySelectorAll(
            ".message-menu"
        )
        .forEach(

            menu =>
                menu.remove()

        );

}


function addMessageActions(
    element,
    id,
    mine
){

    let timer =
        null;

    const cancel = () => {

        if(timer){

            clearTimeout(
                timer
            );

            timer =
                null;

        }

    };

    element.addEventListener(

        "pointerdown",

        e => {

            if(
                e.target.closest(
                    ".message-menu"
                )
            ){

                return;

            }

            cancel();

            timer =
                setTimeout(

                    showDeleteMenu,

                    500

                );

        }

    );

    element.addEventListener(
        "pointerup",
        cancel
    );

    element.addEventListener(
        "pointercancel",
        cancel
    );

    element.addEventListener(
        "pointerleave",
        cancel
    );

    element.addEventListener(

        "contextmenu",

        e => {

            e.preventDefault();

            showDeleteMenu();

        }

    );

    function showDeleteMenu(){

        removeMenus();

        const menu =
            document.createElement(
                "div"
            );

        menu.className =
            "message-menu";

        const button =
            document.createElement(
                "button"
            );

        button.textContent =

            mine

            ?

            "🗑️ إلغاء الإرسال"

            :

            "🗑️ حذف لدي";

        button.addEventListener(

            "click",

            async e => {

                e.stopPropagation();

                try{

                    const messageRef =
                        doc(

                            db,

                            "chats",

                            chatID,

                            "messages",

                            id

                        );

                    if(mine){

                        await deleteDoc(
                            messageRef
                        );

                    }else{

                        await updateDoc(

                            messageRef,

                            {

                                deletedFor:
                                    arrayUnion(
                                        currentUser.uid
                                    )

                            }

                        );

                    }

                    removeMenus();

                }

                catch(error){

                    console.error(
                        "Delete error:",
                        error
                    );

                    alert(
                        "حدث خطأ أثناء حذف الرسالة"
                    );

                }

            }

        );

        menu.appendChild(
            button
        );

        element.appendChild(
            menu
        );

    }

}


document.addEventListener(

    "pointerdown",

    e => {

        if(
            !e.target.closest(
                ".message-menu"
            )
        ){

            removeMenus();

        }

    }

);


// ============================================================
// 📞 الاتصال
// ============================================================

callButton.addEventListener(

    "click",

    async () => {

        if(!currentUser){

            alert(
                "⚠️ يجب تسجيل الدخول أولاً"
            );

            return;

        }

        if(!friendUser){

            alert(
                "⚠️ لم يتم تحميل بيانات الصديق"
            );

            return;

        }

        try{

            if(!callModule){

                callModule =
                    await import(
                        "./call.js"
                    );

            }

            if(
                typeof callModule.startCall !==
                "function"
            ){

                throw new Error(
                    "startCall غير موجودة في call.js"
                );

            }

            await callModule.startCall({

                friendId:
                    friendUser.uid,

                friendName:
                    friendUser.name,

                friendPhoto:
                    friendUser.photo

            });

        }

        catch(error){

            console.error(
                "Call error:",
                error
            );

            alert(

                "❌ تعذر بدء المكالمة\n" +

                (
                    error?.message ||
                    ""
                )

            );

        }

    }

);


// ============================================================
// فيديو
// ============================================================

videoButton.addEventListener(

    "click",

    () => {

        alert(
            "📹 مكالمة الفيديو قيد التطوير"
        );

    }

);


// ============================================================
// الرجوع
// ============================================================

backButton.addEventListener(

    "click",

    () => {

        clearTimeout(
            typingTimer
        );

        updateTyping(
            false
        );

        if(unsubscribeMessages){

            unsubscribeMessages();

        }

        if(unsubscribeFriendStatus){

            unsubscribeFriendStatus();

        }

        if(unsubscribeFriendTyping){

            unsubscribeFriendTyping();

        }

        stopPresence();

        history.back();

    }

);


// ============================================================
// Visibility
// ============================================================

document.addEventListener(

    "visibilitychange",

    () => {

        if(!currentUser){

            return;

        }

        if(
            document.visibilityState ===
            "visible"
        ){

            updateMyPresence(
                true
            );

            // إذا عاد المستخدم للمحادثة
            // يتم تحديث حالة الكتابة إذا كان هناك نص

            if(
                messageInput.value.trim()
                    .length === 0
            ){

                updateTyping(
                    false
                );

            }

        }else{

            updateMyPresence(
                false
            );

            updateTyping(
                false
            );

        }

    }

);


// ============================================================
// مغادرة الصفحة
// ============================================================

window.addEventListener(

    "pagehide",

    () => {

        if(currentUser){

            updateMyPresence(
                false
            );

            updateTyping(
                false
            );

        }

    }

);


// ============================================================
// تشغيل
// ============================================================

function init(){

    onAuthStateChanged(

        auth,

        async user => {

            if(!user){

                stopPresence();

                loading.textContent =
                    "يجب تسجيل الدخول أولاً";

                return;

            }

            currentUser =
                user;

            window.chatDB =
                db;

            window.chatUser =
                currentUser;

            try{

                startPresence();

                await loadFriend();

                listenMessages();

                await loadCallSystem();

                showApp();

            }

            catch(error){

                stopPresence();

                showError(
                    error
                );

            }

        }

    );

}


init();
