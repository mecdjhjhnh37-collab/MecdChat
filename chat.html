<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color"
content="#020504">

<title>Mecd Chat - المكالمة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
}

body{

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:
radial-gradient(
circle at 50% 10%,
#123d35 0%,
#07110f 35%,
#020504 75%
);

}

.call-page{

width:100%;
height:100vh;

display:flex;
flex-direction:column;

align-items:center;
justify-content:space-between;

padding:
25px 20px 35px;

}

.top{

width:100%;
max-width:500px;

display:flex;
align-items:center;
justify-content:space-between;

}

.back{

width:45px;
height:45px;

border:0;
border-radius:15px;

background:#18231f;

color:white;

font-size:22px;

cursor:pointer;

}

.call-type{

font-size:13px;

color:#8d9b96;

}

.person{

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

width:100%;

}

.avatar-wrap{

width:145px;
height:145px;

border-radius:45px;

padding:4px;

background:
linear-gradient(
145deg,
#00e889,
#087653,
#18231f
);

box-shadow:
0 0 50px
rgba(0,232,137,.15);

}

.avatar{

width:100%;
height:100%;

border-radius:41px;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:#12352c;

font-size:65px;

}

.avatar img{

width:100%;
height:100%;

object-fit:cover;

}

.name{

margin-top:22px;

font-size:25px;

font-weight:bold;

max-width:90%;

white-space:nowrap;
overflow:hidden;

text-overflow:ellipsis;

}

.status{

margin-top:10px;

font-size:14px;

color:#8d9b96;

}

.status.connected{

color:#00e889;

}

.timer{

margin-top:8px;

font-size:13px;

color:#68756f;

min-height:18px;

}

.pulse{

width:190px;
height:190px;

position:absolute;

border-radius:50%;

border:
1px solid
rgba(0,232,137,.08);

animation:
pulse 2s infinite;

pointer-events:none;

}

@keyframes pulse{

0%{

transform:scale(.75);

opacity:.7;

}

70%{

transform:scale(1.25);

opacity:0;

}

100%{

transform:scale(1.25);

opacity:0;

}

}

.controls{

width:100%;
max-width:500px;

display:flex;

align-items:center;
justify-content:center;

gap:18px;

}

.control{

width:58px;
height:58px;

border:0;

border-radius:20px;

background:#18231f;

color:white;

font-size:22px;

cursor:pointer;

}

.control.active{

background:#00e889;

color:#00150e;

}

.end{

width:72px;
height:72px;

border:0;

border-radius:25px;

background:#d93636;

color:white;

font-size:28px;

cursor:pointer;

box-shadow:
0 10px 30px
rgba(217,54,54,.22);

}

.loading{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

align-items:center;
justify-content:center;

background:#020504;

z-index:200;

}

.spinner{

width:45px;
height:45px;

border:
3px solid
#18231f;

border-top-color:
#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;

margin-bottom:18px;

}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

.error{

position:fixed;

inset:0;

display:none;

align-items:center;
justify-content:center;

padding:25px;

background:#020504;

z-index:300;

}

.error-box{

width:100%;
max-width:380px;

padding:25px;

text-align:center;

border-radius:25px;

background:#0b1512;

border:
1px solid
rgba(255,255,255,.08);

}

.error-box h2{

font-size:20px;

margin-bottom:12px;

}

.error-box p{

color:#89958f;

font-size:14px;

line-height:1.7;

margin-bottom:20px;

}

.error-box button{

width:100%;

padding:13px;

border:0;

border-radius:15px;

background:#00e889;

color:#00150e;

font-weight:bold;

font-size:15px;

}

@media(max-height:650px){

.call-page{

padding-top:15px;
padding-bottom:20px;

}

.avatar-wrap{

width:110px;
height:110px;

}

.avatar{

border-radius:35px;

font-size:50px;

}

.name{

margin-top:13px;

font-size:21px;

}

.control{

width:52px;
height:52px;

}

.end{

width:64px;
height:64px;

}

}

</style>

</head>

<body>


<div id="loading"
class="loading">

<div class="spinner"></div>

<div id="loadingText">
جاري تجهيز المكالمة...
</div>

</div>


<main
id="callPage"
class="call-page">


<div class="top">

<button
id="backButton"
class="back"
type="button">

→

</button>

<div class="call-type">

مكالمة صوتية

</div>

</div>


<section class="person">

<div
id="pulse"
class="pulse">
</div>


<div class="avatar-wrap">

<div
id="avatar"
class="avatar">

👤

</div>

</div>


<div
id="name"
class="name">

مستخدم Mecd

</div>


<div
id="status"
class="status">

جاري الاتصال...

</div>


<div
id="timer"
class="timer">
</div>

</section>


<div class="controls">


<button
id="muteButton"
class="control"
type="button">

🎤

</button>


<button
id="speakerButton"
class="control"
type="button">

🔊

</button>


<button
id="endButton"
class="end"
type="button">

☎

</button>


</div>

</main>


<div
id="errorBox"
class="error">

<div class="error-box">

<h2>
⚠️ تعذر الاتصال
</h2>

<p id="errorText">
حدث خطأ أثناء إنشاء المكالمة.
</p>

<button
id="errorBack"
type="button">

العودة

</button>

</div>

</div>


<audio
id="remoteAudio"
autoplay
playsinline>
</audio>


<script type="module">

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
startOutgoingCall,
acceptIncomingCall,
watchIncomingCall,
cleanupCall,
clearIncomingCall,
getCall
}
from "./call.js";


const $ =
id =>
document.getElementById(id);


const loading =
$("loading");

const loadingText =
$("loadingText");

const nameEl =
$("name");

const avatarEl =
$("avatar");

const statusEl =
$("status");

const timerEl =
$("timer");

const muteButton =
$("muteButton");

const speakerButton =
$("speakerButton");

const endButton =
$("endButton");

const backButton =
$("backButton");

const errorBox =
$("errorBox");

const errorText =
$("errorText");

const errorBack =
$("errorBack");

const remoteAudio =
$("remoteAudio");

const pulse =
$("pulse");


const params =
new URLSearchParams(
location.search
);


const callId =
params.get("callId");

const mode =
params.get("mode");

const personName =
params.get("name") ||
"مستخدم Mecd";

const personPhoto =
params.get("photo") ||
"";


let ending =
false;

let timerInterval =
null;

let seconds =
0;


/* =================================
   معلومات الشخص
================================= */

nameEl.textContent =
personName;


if(personPhoto){

avatarEl.innerHTML =
`<img src="${escapeHtml(personPhoto)}"
alt="صورة الحساب">`;

}


/* =================================
   حماية HTML
================================= */

function escapeHtml(value){

return String(value).replace(
/[&<>'"]/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);

}


/* =================================
   الحالة
================================= */

function setStatus(
text,
connected=false
){

statusEl.textContent =
text;

statusEl.classList.toggle(
"connected",
connected
);

}


/* =================================
   المؤقت
================================= */

function startTimer(){

if(timerInterval)
return;

seconds=0;

timerInterval =
setInterval(() => {

seconds++;

const minutes =
Math.floor(
seconds / 60
)
.toString()
.padStart(2,"0");

const secs =
(seconds % 60)
.toString()
.padStart(2,"0");

timerEl.textContent =
`${minutes}:${secs}`;

},1000);

}


/* =================================
   Remote Audio
================================= */

window.onRemoteStream =
stream => {

remoteAudio.srcObject =
stream;

remoteAudio.play()
.catch(error => {

console.log(
"Audio play:",
error
);

});

};


/* =================================
   اتصال ناجح
================================= */

window.onCallConnected =
() => {

console.log(
"✅ CALL CONNECTED"
);

loading.style.display =
"none";

setStatus(
"● متصل",
true
);

pulse.style.display =
"none";

startTimer();

};


/* =================================
   خطأ WebRTC
================================= */

window.onCallError =
message => {

console.error(
"CALL ERROR:",
message
);

showError(
message
);

};


/* =================================
   انتهاء المكالمة
================================= */

window.onCallEnded =
() => {

if(ending)
return;

ending=true;

setStatus(
"انتهت المكالمة"
);

if(timerInterval){

clearInterval(
timerInterval
);

timerInterval=null;

}

setTimeout(
() => history.back(),
1000
);

};


/* =================================
   الخطأ
================================= */

function showError(message){

loading.style.display =
"none";

errorText.textContent =
message ||
"حدث خطأ غير معروف.";

errorBox.style.display =
"flex";

}


/* =================================
   تنظيف
================================= */

async function finish(){

if(ending)
return;

ending=true;

if(timerInterval){

clearInterval(
timerInterval
);

timerInterval=null;

}

try{

await cleanupCall(
callId
);

await clearIncomingCall();

}catch(error){

console.error(
"Finish error:",
error
);

}

}


/* =================================
   إنهاء
================================= */

endButton.addEventListener(
"click",
async () => {

await finish();

history.back();

}
);


/* =================================
   رجوع
================================= */

backButton.addEventListener(
"click",
async () => {

await finish();

history.back();

}
);


/* =================================
   زر الميكروفون
================================= */

muteButton.addEventListener(
"click",
() => {

const stream =
window.localCallStream;

if(!stream){

alert(
"لم يتم تشغيل الميكروفون بعد"
);

return;

}

const tracks =
stream.getAudioTracks();

if(!tracks.length)
return;


const currentlyEnabled =
tracks[0].enabled;


tracks.forEach(
track => {

track.enabled =
!currentlyEnabled;

}
);


muteButton.textContent =
currentlyEnabled
? "🔇"
: "🎤";


muteButton.classList.toggle(
"active",
currentlyEnabled
);

}
);


/* =================================
   السماعة
================================= */

speakerButton.addEventListener(
"click",
() => {

const active =
speakerButton.classList.toggle(
"active"
);

speakerButton.textContent =
active
? "🔊"
: "🔈";

}
);


/* =================================
   التحقق
================================= */

if(!callId){

showError(
"رقم المكالمة غير موجود."
);

}else if(
mode !== "incoming" &&
mode !== "outgoing"
){

showError(
"نوع المكالمة غير صحيح."
);

}


/* =================================
   تشغيل
================================= */

async function start(){

if(!callId)
return;


try{

if(mode === "outgoing"){

loadingText.textContent =
"جاري الاتصال...";

setStatus(
"جاري الاتصال..."
);


await startOutgoingCall(
callId
);

}else{

loadingText.textContent =
"جاري استقبال المكالمة...";

setStatus(
"مكالمة واردة..."
);


await watchIncomingCall(
callId
);


let accepted=false;


const waitForOffer =
setInterval(
async () => {

if(accepted){
return;
}


try{

const call =
await getCall(
callId
);


if(
!call ||
call.status ===
"ended"
){

clearInterval(
waitForOffer
);

return;

}


if(call.offer){

clearInterval(
waitForOffer
);


const answer =
confirm(
`📞 مكالمة واردة من ${personName}\n\nهل تريد الرد؟`
);


if(!answer){

await cleanupCall(
callId
);

await clearIncomingCall();

history.back();

return;

}


accepted=true;


setStatus(
"جاري الاتصال..."
);


await acceptIncomingCall(
callId
);

}

}catch(error){

console.error(
"Offer wait error:",
error
);

}

},
500
);

}

}catch(error){

console.error(
"Call start error:",
error
);

showError(
error.message ||
"تعذر بدء المكالمة."
);

}

}


/* =================================
   Firebase Auth
================================= */

const auth =
getAuth();


onAuthStateChanged(
auth,
user => {

if(!user){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}


start();

}
);


/* =================================
   مغادرة الصفحة
================================= */

window.addEventListener(
"pagehide",
() => {

if(!ending){

cleanupCall(
callId
);

}

});

</script>

</body>
</html>
