<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat - الدردشة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

min-height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:

radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),

linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow:hidden;
}


/* =========================
   التطبيق
========================= */

.app{

width:100%;

max-width:650px;

height:100vh;

margin:auto;

display:flex;

flex-direction:column;

position:relative;
}


/* =========================
   الهيدر
========================= */

header{

height:75px;

padding:
12px 18px;

display:flex;

align-items:center;

gap:12px;

background:
rgba(5,10,8,.96);

border-bottom:
1px solid
rgba(255,255,255,.08);

flex-shrink:0;
}


/* زر الرجوع */

.back{

width:45px;

height:45px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.06);

color:white;

font-size:24px;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;
}

.back:active{

transform:scale(.94);
}


/* =========================
   صورة الصديق
========================= */

.avatar{

width:48px;

height:48px;

border-radius:16px;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:#12352c;

font-size:24px;

flex-shrink:0;

border:
1px solid
rgba(0,230,118,.3);
}

.avatar img{

width:100%;

height:100%;

object-fit:cover;
}


/* =========================
   معلومات الصديق
========================= */

.user-info{

flex:1;

min-width:0;
}

.user-name{

font-size:17px;

font-weight:bold;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;
}

.user-status{

font-size:11px;

color:#00e889;

margin-top:4px;
}


/* =========================
   الرسائل
========================= */

.messages{

flex:1;

overflow-y:auto;

padding:
20px 15px
100px;

display:flex;

flex-direction:column;

gap:10px;

scroll-behavior:smooth;
}


/* =========================
   لا توجد رسائل
========================= */

.empty{

margin:auto;

text-align:center;

color:#72817c;

line-height:1.8;

font-size:14px;
}


/* =========================
   الرسالة
========================= */

.message{

max-width:78%;

padding:
11px 14px;

border-radius:18px;

font-size:15px;

line-height:1.5;

word-wrap:break-word;

overflow-wrap:anywhere;

white-space:pre-wrap;
}


/* رسائلي */

.message.mine{

align-self:flex-start;

background:#00c96b;

color:#00150e;

border-bottom-left-radius:5px;
}


/* رسائل الصديق */

.message.other{

align-self:flex-end;

background:#18231f;

color:white;

border:
1px solid
rgba(255,255,255,.07);

border-bottom-right-radius:5px;
}


/* الوقت */

.time{

display:block;

font-size:9px;

opacity:.55;

margin-top:4px;
}


/* =========================
   منطقة الكتابة
========================= */

.input-area{

position:fixed;

bottom:0;

left:50%;

transform:
translateX(-50%);

width:100%;

max-width:650px;

padding:12px;

display:flex;

gap:9px;

background:
rgba(5,8,7,.97);

border-top:
1px solid
rgba(255,255,255,.08);

z-index:20;
}


/* =========================
   مربع الرسالة
========================= */

#messageInput{

flex:1;

min-width:0;

padding:
14px 16px;

border-radius:17px;

border:
1px solid
rgba(255,255,255,.09);

outline:none;

background:#111916;

color:white;

font-family:inherit;

font-size:15px;

direction:rtl;
}

#messageInput:focus{

border-color:#00e676;

box-shadow:
0 0 0 3px
rgba(0,230,118,.07);
}

#messageInput::placeholder{

color:#63716d;
}


/* =========================
   زر الإرسال
========================= */

#sendButton{

width:52px;

height:52px;

border:none;

border-radius:17px;

background:#00e889;

color:#00150e;

font-size:22px;

cursor:pointer;

flex-shrink:0;
}

#sendButton:active{

transform:scale(.94);
}

#sendButton:disabled{

opacity:.5;

cursor:not-allowed;
}


/* =========================
   التحميل
========================= */

.loading{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:15px;

background:#020504;

color:#a8bdb6;

font-size:15px;

z-index:100;
}


/* =========================
   الخطأ
========================= */

.error-screen{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

background:#020504;

text-align:center;

padding:30px;

z-index:200;
}

.error-box{

width:100%;

max-width:500px;

padding:30px;

border-radius:25px;

background:#0b100e;

border:
1px solid
rgba(255,255,255,.08);
}

.error-box h2{

font-size:25px;

margin-bottom:15px;
}

.error-box p{

color:#9aa7a3;

line-height:1.8;

font-size:14px;
}


/* =========================
   Spinner
========================= */

.spinner{

width:35px;

height:35px;

border:
4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;
}

@keyframes spin{

to{

transform:rotate(360deg);

}

}


/* =========================
   الموبايل
========================= */

@media(max-width:480px){

header{

height:70px;

padding:
10px 13px;
}

.back{

width:43px;

height:43px;
}

.avatar{

width:45px;

height:45px;

border-radius:15px;
}

.user-name{

font-size:16px;
}

.messages{

padding:
15px 12px
100px;
}

.message{

max-width:84%;

font-size:14px;
}

.input-area{

padding:10px;
}

#messageInput{

font-size:14px;

padding:
13px 14px;
}

#sendButton{

width:50px;

height:50px;
}

}

</style>

</head>


<body>


<!-- =========================
     Loading
========================= -->

<div
id="loading"
class="loading"
>

<div class="spinner"></div>

<div>
جارٍ فتح الدردشة...
</div>

</div>


<!-- =========================
     شاشة الخطأ
========================= -->

<div
id="errorScreen"
class="error-screen"
style="display:none;"
>

<div class="error-box">

<h2>
⚠️ تعذر فتح الدردشة
</h2>

<p id="errorText"></p>

</div>

</div>


<!-- =========================
     التطبيق
========================= -->

<main
id="app"
class="app"
style="display:none;"
>


<!-- =========================
     Header
========================= -->

<header>


<button
id="backButton"
class="back"
type="button"
>

→

</button>


<div
id="friendAvatar"
class="avatar"
>

👤

</div>


<div class="user-info">


<div
id="friendName"
class="user-name"
>

جارٍ التحميل...

</div>


<div class="user-status">

● متصل

</div>


</div>


</header>


<!-- =========================
     الرسائل
========================= -->

<div
id="messages"
class="messages"
>

<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>

</div>


<!-- =========================
     إدخال الرسالة
========================= -->

<div class="input-area">


<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>


<button
id="sendButton"
type="button"
>

➤

</button>


</div>


</main>


<!-- =========================
     Firebase
========================= -->

<script type="module">


/* =========================
   Firebase Imports
========================= */

import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


/* =========================
   Firebase
========================= */

const firebaseApp =
initializeApp(
firebaseConfig
);


const auth =
getAuth(
firebaseApp
);


const db =
getFirestore(
firebaseApp
);


/* =========================
   عناصر الصفحة
========================= */

const loading =
document.getElementById(
"loading"
);

const errorScreen =
document.getElementById(
"errorScreen"
);

const errorText =
document.getElementById(
"errorText"
);

const app =
document.getElementById(
"app"
);

const friendAvatar =
document.getElementById(
"friendAvatar"
);

const friendName =
document.getElementById(
"friendName"
);

const messages =
document.getElementById(
"messages"
);

const messageInput =
document.getElementById(
"messageInput"
);

const sendButton =
document.getElementById(
"sendButton"
);

const backButton =
document.getElementById(
"backButton"
);


/* =========================
   المتغيرات
========================= */

let currentUser = null;

let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;


/* =========================
   إظهار الخطأ
========================= */

function showError(text){

loading.style.display =
"none";

app.style.display =
"none";

errorText.textContent =
text;

errorScreen.style.display =
"flex";

}


/* =========================
   إنشاء Chat ID
========================= */

function createChatID(uid1,uid2){

return [
uid1,
uid2
]
.sort()
.join("_");

}


/* =========================
   جلب الصديق
========================= */

async function loadFriend(){

const params =
new URLSearchParams(
window.location.search
);


const friendUID =
params.get("friend");


/* لا يوجد UID */

if(!friendUID){

showError(
"لم يتم تحديد الصديق. افتح الدردشة من قائمة الأصدقاء."
);

return false;

}


/* لا يمكن الدردشة مع نفسك */

if(
friendUID ===
currentUser.uid
){

showError(
"لا يمكنك فتح دردشة مع نفسك."
);

return false;

}


/* =========================
   جلب المستخدم
========================= */

const friendRef =
doc(
db,
"users",
friendUID
);


const friendDoc =
await getDoc(
friendRef
);


if(!friendDoc.exists()){

showError(
"لم يتم العثور على هذا المستخدم."
);

return false;

}


const data =
friendDoc.data();


friendUser = {

uid:
friendUID,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
""

};


/* =========================
   الاسم
========================= */

friendName.textContent =
friendUser.name;


/* =========================
   الصورة
========================= */

if(
friendUser.photo
){

friendAvatar.innerHTML = `

<img
src="${friendUser.photo
.replace(/"/g,"&quot;")}"
alt=""
>

`;

}else{

friendAvatar.textContent =
"👤";

}


/* =========================
   Chat ID
========================= */

chatID =
createChatID(
currentUser.uid,
friendUser.uid
);


/* =========================
   إنشاء المحادثة
========================= */

const chatRef =
doc(
db,
"chats",
chatID
);


const chatDoc =
await getDoc(
chatRef
);


if(
!chatDoc.exists()
){

await setDoc(
chatRef,
{

members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp(),

lastMessage:
"",

lastMessageAt:
serverTimestamp()

}
);

}


return true;

}


/* =========================
   الاستماع للرسائل
========================= */

function listenMessages(){

if(
!chatID
){

return;

}


const messagesRef =
collection(
db,
"chats",
chatID,
"messages"
);


const messagesQuery =
query(
messagesRef,

orderBy(
"createdAt",
"asc"
)
);


unsubscribeMessages =
onSnapshot(

messagesQuery,

(snapshot)=>{

messages.innerHTML =
"";


if(
snapshot.empty
){

messages.innerHTML = `

<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>

`;

return;

}


/* =========================
   عرض الرسائل
========================= */

snapshot.forEach(
(messageDoc)=>{

const data =
messageDoc.data();


const message =
document.createElement(
"div"
);


message.className =
"message " +
(
data.senderId ===
currentUser.uid

?

"mine"

:

"other"

);


/* النص */

const text =
document.createTextNode(
data.text || ""
);


message.appendChild(
text
);


/* الوقت */

const time =
document.createElement(
"span"
);

time.className =
"time";


if(
data.createdAt &&
typeof data.createdAt.toDate ===
"function"
){

try{

time.textContent =
data.createdAt
.toDate()
.toLocaleTimeString(
"ar",
{

hour:
"2-digit",

minute:
"2-digit"

}
);

}catch(error){

time.textContent =
"";

}

}


message.appendChild(
time
);

messages.appendChild(
message
);

}
);


/* النزول لآخر رسالة */

requestAnimationFrame(
()=>{

messages.scrollTop =
messages.scrollHeight;

}
);

},

(error)=>{

console.error(
"Messages listener error:",
error
);

showError(
"تعذر تحميل الرسائل. تأكد من Firestore Rules."
);

}

);

}


/* =========================
   إرسال رسالة
========================= */

async function sendMessage(){

const text =
messageInput.value.trim();


if(
!text
){

return;

}


if(
!currentUser ||
!friendUser ||
!chatID
){

return;

}


sendButton.disabled =
true;


try{


/* =========================
   إضافة الرسالة
========================= */

const messagesRef =
collection(
db,
"chats",
chatID,
"messages"
);


await addDoc(

messagesRef,

{

text:

text,

senderId:

currentUser.uid,

receiverId:

friendUser.uid,

createdAt:

serverTimestamp()

}

);


/* =========================
   تحديث آخر رسالة
========================= */

await setDoc(

doc(
db,
"chats",
chatID
),

{

lastMessage:
text,

lastMessageAt:
serverTimestamp(),

lastSenderId:
currentUser.uid

},

{

merge:true

}

);


/* تنظيف */

messageInput.value =
"";

messageInput.focus();


}catch(error){

console.error(
"Send message error:",
error
);

alert(
"تعذر إرسال الرسالة:\n" +
error.message
);

}finally{

sendButton.disabled =
false;

}

}


/* =========================
   زر الإرسال
========================= */

sendButton.addEventListener(

"click",

sendMessage

);


/* =========================
   Enter
========================= */

messageInput.addEventListener(

"keydown",

(event)=>{

if(
event.key ===
"Enter"
){

event.preventDefault();

sendMessage();

}

}

);


/* =========================
   الرجوع
========================= */

backButton.addEventListener(

"click",

()=>{

if(
window.history.length > 1
){

history.back();

}else{

window.location.href =
"./home.html";

}

}

);


/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(

auth,

async(user)=>{


if(
!user
){

showError(
"يجب تسجيل الدخول أولاً إلى Mecd Chat."
);

return;

}


currentUser =
user;


try{


const success =
await loadFriend();


if(
!success
){

return;

}


/* الاستماع للرسائل */

listenMessages();


/* إظهار التطبيق */

loading.style.display =
"none";

app.style.display =
"flex";


setTimeout(
()=>{

messageInput.focus();

},
100
);


}catch(error){

console.error(
"Chat loading error:",
error
);

showError(
"حدث خطأ أثناء فتح الدردشة:\n" +
error.message
);

}

});


/* =========================
   تنظيف المستمع
========================= */

window.addEventListener(

"beforeunload",

()=>{

if(
unsubscribeMessages
){

unsubscribeMessages();

}

}

);

</script>

</body>

</html>
