<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#123d35,transparent 40%),
        linear-gradient(180deg,#07110f,#020504);
    overflow:hidden;
}

button,
input{
    font-family:inherit;
}

.app{
    height:100vh;
    max-width:650px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    background:#050807;
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
}

.back{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:#18231f;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:16px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:24px;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:12px;
    color:#777;
    margin-top:5px;
    transition:.2s;
}

.user-status.online{
    color:#00e889;
}

.user-status.typing{
    color:#00e889;
    font-weight:bold;
}

.call-buttons{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.call-buttons button{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#18231f;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.call-buttons button:active{
    transform:scale(.94);
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:20px 15px 150px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#72817c;
}

.message{
    max-width:78%;
    padding:12px 15px;
    border-radius:18px;
    position:relative;
    word-break:break-word;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.message.mine{
    align-self:flex-start;
    background:#00c96b;
    color:#00150e;
    border-bottom-left-radius:5px;
}

.message.other{
    align-self:flex-end;
    background:#18231f;
    border:1px solid rgba(255,255,255,.08);
    border-bottom-right-radius:5px;
}

.time{
    display:inline-block;
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.message-meta{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:5px;
    margin-top:5px;
}

.message-status{
    font-size:12px;
    line-height:1;
    font-weight:bold;
    letter-spacing:-3px;
    direction:ltr;
    display:inline-block;
    min-width:16px;
}

.message-status.sent{
    opacity:.65;
}

.message-status.read{
    color:#006dff;
    opacity:1;
}

.input-area{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:650px;
    padding:10px;
    display:flex;
    gap:8px;
    background:#050807;
    z-index:50;
}

#messageInput{
    flex:1;

    padding:14px;
    border-radius:17px;
    border:1px solid #27332f;
    background:#111916;
    color:white;
    outline:none;
    font-size:15px;
}

#messageInput:focus{
    border-color:#00e889;
}

#voiceButton,
#sendButton{
    width:50px;
    height:50px;
    border:0;
    border-radius:16px;
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
}

#voiceButton{
    background:#18231f;
    color:white;
}

#voiceButton.recording{

}

#sendButton{
    background:#00e889;
    color:#00150e;
}

#sendButton:disabled{
    opacity:.6;
}

.message-menu{
    position:absolute;
    left:50%;
    bottom:calc(100% + 8px);
    transform:translateX(-50%);
    min-width:150px;
    padding:5px;
    background:#0b1512;
    border:1px solid rgba(0,232,137,.18);
    border-radius:15px;

}

.message-menu button{
    width:100%;
    padding:10px 14px;

    border-radius:11px;
    background:#18231f;

    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.call-message{
    min-width:245px;
    max-width:310px;

.call-box{

    align-items:center;

}

.call-icon{

    height:46px;

    font-size:22px;

}

.call-info{
    min-width:0;

}

.call-title{

    font-weight:bold;
}

.call-subtitle{
    font-size:11px;
    opacity:.65;
    margin-top:4px;
}

.call-duration{
    font-size:11px;
    margin-top:4px;
    opacity:.75;
}

audio{

}


/* =====================================================
   نافذة المكالمة - شاشة كاملة
===================================================== */

#callOverlay{

    inset:0;
    background:

/* بطاقة الصوت */

.call-card{

    flex-direction:column;
    align-items:center;
    justify-content:center;

/* صورة المكالمة */

.call-avatar{

    height:120px;
    margin:0 auto 18px;
    border-radius:35px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:52px;
    flex-shrink:0;
    box-shadow:

}

.call-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#callName{
    font-size:23px;
    font-weight:bold;
}

#callState{
    color:#00e889;
    font-size:14px;
    margin-top:9px;
    min-height:20px;
}


/* =====================================================
   منطقة الفيديو
===================================================== */

#videoArea{
    width:100%;
    height:min(70vh,620px);
    display:none;
    position:relative;
    margin-top:20px;
    border-radius:25px;
    overflow:hidden;
    background:#000;
    box-shadow:
        0 20px 60px rgba(0,0,0,.6);
}


/* الفيديو الكبير */

#remoteVideo,
#localVideo{
    position:absolute;
    background:#000;
    object-fit:cover;
    cursor:pointer;
    transition:
        all .25s ease;
}


/* الطرف الآخر كبير */

#remoteVideo{
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
}


/* أنا صغير */

#localVideo{
    width:105px;
    height:145px;
    left:14px;
    bottom:14px;
    border-radius:17px;
    border:2px solid #00e889;
    z-index:5;
}


/* عند التبديل أنا كبير */

#remoteVideo.small-video{
    width:105px;
    height:145px;
    left:14px;
    bottom:14px;
    border-radius:17px;
    border:2px solid #00e889;
    z-index:5;
}

#localVideo.big-video{
    inset:0;
    width:100%;
    height:100%;
    border:0;
    border-radius:0;
    z-index:2;
}


/* =====================================================
   أزرار المكالمة
===================================================== */

.call-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:28px;
    flex-wrap:wrap;
}

.call-actions button{
    width:58px;
    height:58px;
    border:0;
    border-radius:20px;
    font-size:23px;
    cursor:pointer;
    background:#18231f;
    color:white;
    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.call-actions button:active{
    transform:scale(.92);
}

.call-actions .end{
    background:#d83b3b;
    color:white;
}

#acceptCallButton{
    background:#00e889 !important;
    color:#00150e !important;
}

#rejectCallButton{
    background:#d83b3b !important;
}


/* إخفاء أزرار التحكم أثناء الرنين */

.call-controls-hidden{
    display:none !important;
}


/* =====================================================
   شاشة المكالمة الواردة
===================================================== */

.incoming-label{
    color:#00e889;
    font-size:13px;
    margin-top:8px;
}


/* =====================================================
   Responsive
===================================================== */

@media(max-width:500px){

    .message{
        max-width:84%;
    }

    header{
        padding:12px;
    }

    .call-buttons button{
        width:40px;
        height:40px;
    }

    .call-message{
        min-width:225px;
        max-width:85%;
    }

    #videoArea{
        height:68vh;
        border-radius:20px;
    }

    #localVideo,
    #remoteVideo.small-video{
        width:92px;
        height:125px;
        left:10px;
        bottom:10px;
    }

    .call-actions button{
        width:56px;
        height:56px;
    }

}

</style>

<script type="module">

/* ============================================================
   Firebase
============================================================ */

import {

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

const firebaseConfig = {

    apiKey:

    authDomain:
        "mecd-tools.firebaseapp.com",

    projectId:
        "mecd-tools",

    storageBucket:
        "mecd-tools.firebasestorage.app",

    messagingSenderId:
        "643005547408",

    appId:
        "1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp =
    initializeApp(firebaseConfig);

const auth =
    getAuth(firebaseApp);

const db =
    getFirestore(firebaseApp);


/* مهم لملف voice.js */

window.chatDB = db;


/* ============================================================
   العناصر
============================================================ */

const $ = id =>
    document.getElementById(id);

const messages =
    $("messages");

const messageInput =
    $("messageInput");

const sendButton =
    $("sendButton");

const voiceButton =
    $("voiceButton");

const friendName =
    $("friendName");

const friendAvatar =
    $("friendAvatar");

const friendStatus =
    $("friendStatus");

const backButton =
    $("backButton");

const callButton =
    $("callButton");

const videoButton =
    $("videoButton");

const loading =
    $("loading");

const app =
    $("app");

const callOverlay =
    $("callOverlay");

const callAvatar =
    $("callAvatar");

const callName =
    $("callName");

const callState =
    $("callState");

const endCallButton =
    $("endCallButton");

const acceptCallButton =
    $("acceptCallButton");

const rejectCallButton =
    $("rejectCallButton");

const muteButton =
    $("muteButton");

const speakerMuteButton =
    $("speakerMuteButton");

const cameraButton =
    $("cameraButton");

const videoArea =
    $("videoArea");

const remoteVideo =
    $("remoteVideo");

const localVideo =
    $("localVideo");


/* ============================================================
   المتغيرات
============================================================ */

let currentUser = null;

let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;

let unsubscribeFriendStatus = null;

let unsubscribeFriendTyping = null;

let incomingCallUnsubscribe = null;

let presenceInterval = null;

let typingTimer = null;

let typingState = false;


/* WebRTC */

let localStream = null;

let peerConnection = null;


/* المكالمة الحالية */

let activeCallId = null;

let activeCallType = null;

let activeCallRole = null;


/* وقت المكالمة */

let callTimer = null;

let callSeconds = 0;


/* مستمعو المكالمة */

let unsubscribeActiveCall = null;

let unsubscribeActiveCandidates = null;


/* حالة الفيديو */

let videoSwapped = false;


/* ============================================================
   WebRTC
============================================================ */

const rtcConfig = {

    iceServers:[

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* ============================================================
   أدوات
============================================================ */

function createChatID(a,b){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


function escapeHtml(value){

    return String(value)
        .replace(
            /[&<>'"]/g,
            c => ({
                '&':'&amp;',
                '<':'&lt;',
                '>':'&gt;',
                "'":'&#39;',
                '"':'&quot;'
            }[c])
        );

}


function showApp(){

    loading.style.display =
        "none";

    app.style.display =
        "flex";

}


function showError(error){

    console.error(error);

    loading.innerHTML =
        `
        <div style="
        text-align:center;
        padding:20px;">
        
        ⚠️ تعذر فتح الدردشة
        
        <br>
        
        <small style="color:#777">
        ${escapeHtml(
            error?.message ||
            "حدث خطأ"
        )}
        </small>
        
        </div>
        `;

}


/* ============================================================
   Presence
============================================================ */

async function updateMyPresence(
    online=true
){

    if(!currentUser)
        return;

    try{

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {
                online,

                lastSeen:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Presence:",
            error
        );

    }

}


function startPresence(){

    updateMyPresence(true);

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        setInterval(
            () => {

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    updateMyPresence(true);

                }

            },
            10000
        );

}


function stopPresence(){

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        null;

    updateMyPresence(false);

}


/* ============================================================
   تحميل الصديق
============================================================ */

async function loadFriend(){

    const id =
        new URLSearchParams(
            location.search
        ).get("friend");

    if(!id){

        throw new Error(
            "لا يوجد صديق في الرابط"
        );

    }


    const userDoc =
        await getDoc(
            doc(
                db,
                "users",
                id
            )
        );


    if(!userDoc.exists()){

        throw new Error(
            "المستخدم غير موجود"
        );

    }


    const data =
        userDoc.data();


    friendUser = {

        uid:id,

        name:
            data.name ||
            "مستخدم Mecd",

        photo:
            data.photo ||
            ""

    };


    friendName.textContent =
        friendUser.name;


    callName.textContent =
        friendUser.name;


    if(friendUser.photo){

        const html =
            `<img src="${escapeHtml(
                friendUser.photo
            )}">`;

        friendAvatar.innerHTML =
            html;

        callAvatar.innerHTML =
            html;

    }


    chatID =
        createChatID(
            currentUser.uid,
            friendUser.uid
        );


    window.chatID =
        chatID;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friendUser;


    await setDoc(

        doc(
            db,
            "chats",
            chatID
        ),

        {
            members:[
                currentUser.uid,
                friendUser.uid
            ],

            createdAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );


    listenFriendStatus();

    listenFriendTyping();

}


/* ============================================================
   حالة الصديق
============================================================ */

function listenFriendStatus(){

    if(!friendUser)
        return;


    if(unsubscribeFriendStatus){

        unsubscribeFriendStatus();

    }


    unsubscribeFriendStatus =
        onSnapshot(

            doc(
                db,
                "users",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    setFriendOffline();

                    return;

                }


                const data =
                    snap.data();


                const last =
                    data.lastSeen
                    ?.toMillis?.() ||
                    0;


                const online =
                    data.online === true &&
                    last > 0 &&
                    Date.now() -
                    last < 30000;


                if(
                    !friendStatus.classList
                        .contains("typing")
                ){

                    friendStatus.textContent =
                        online
                        ? "● متصل"
                        : "● غير متصل";

                }


                friendStatus.classList.toggle(
                    "online",
                    online
                );

            }

        );

}


function setFriendOffline(){

    friendStatus.textContent =
        "● غير متصل";

    friendStatus.classList.remove(
        "online"
    );

}


/* ============================================================
   الكتابة
============================================================ */

function listenFriendTyping(){

    if(!friendUser)
        return;


    if(unsubscribeFriendTyping){

        unsubscribeFriendTyping();

    }


    unsubscribeFriendTyping =
        onSnapshot(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    setTypingUI(false);

                    return;

                }


                const data =
                    snap.data();


                const time =
                    data.updatedAt
                    ?.toMillis?.() ||
                    0;


                const typing =
                    data.typing === true &&
                    (
                        !time ||
                        Date.now() -
                        time < 5000
                    );


                setTypingUI(typing);

            }

        );

}


function setTypingUI(typing){

    if(typing){

        friendStatus.textContent =
            "يكتب...";

        friendStatus.classList.add(
            "typing"

/* ============================================================
   الوقت
============================================================ */

function formatTime(timestamp){

    if(!timestamp?.toDate)
        return "";

    return timestamp
        .toDate()
        .toLocaleTimeString(
            "ar",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function formatDuration(seconds){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds || 0)
            )
        );


    const m =
        Math.floor(
            seconds / 60
        );


    const s =
        seconds % 60;


    return (
        String(m).padStart(2,"0")
        +
        ":"
        +
        String(s).padStart(2,"0")
    );

}

function addMessageActions(

){

    };


    element.addEventListener(
        "pointerdown",
        e => {

            if(

                )

    );

    );


    element.addEventListener(
        "pointercancel",

/* ============================================================
   عرض الرسائل
============================================================ */

function renderMessages(snap){

    if(!renderMessages.elements){

        renderMessages.elements =
            new Map();

    }


    const elements =
        renderMessages.elements;


    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight
        < 120;


    snap.docChanges().forEach(
        change => {

            const id =
                change.doc.id;


            const data =
                change.doc.data();


            if(
                change.type === "added" ||
                change.type === "modified"
            ){

                if(
                    data.senderId !==
                    currentUser.uid
                ){

                    markRead(
                        id,
                        data
                    );

                }

            }


            if(
                change.type === "removed"
            ){

                const old =
                    elements.get(id);


                if(old){

                    old.remove();

                    elements.delete(id);

                }

                return;

            }


            if(
                Array.isArray(
                    data.deletedFor
                ) &&
                data.deletedFor.includes(
                    currentUser.uid
                )
            ){

                const old =
                    elements.get(id);


                if(old){

                    old.remove();

                    elements.delete(id);

                }

                return;

            }


            const box =
                document.createElement("div");


            box.className =
                "message " +
                (
                    data.senderId ===
                    currentUser.uid
                    ? "mine"
                    : "other"
                );


            if(data.type === "call"){

                createCallMessage(
                    box,
                    data
                );

            }else if(
                data.type === "voice"
            ){

                const audio =
                    document.createElement(
                        "audio"
                    );


                audio.controls =
                    true;


                audio.src =
                    data.audio ||
                    "";


                box.appendChild(
                    audio
                );

            }else{

                box.appendChild(
                    document.createTextNode(
                        data.text ||
                        ""
                    )
                );

            }


            const meta =
                document.createElement(
                    "span"
                );


            meta.className =
                "message-meta";


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "time";


            time.textContent =
                formatTime(
                    data.createdAt
                );


            meta.appendChild(
                time
            );


            const status =
                createStatus(
                    data
                );


            if(status)
                meta.appendChild(
                    status
                );


            box.appendChild(
                meta
            );


            if(
                data.type !==
                "call"
            ){

                addMessageActions(
                    box,
                    id,
                    data.senderId ===
                    currentUser.uid
                );

            }


            const old =
                elements.get(id);


            if(old){

                old.replaceWith(
                    box
                );

            }


            elements.set(
                id,
                box
            );


            if(!old){

                messages.appendChild(
                    box
                );

            }

        }
    );


    const all =
        messages.querySelectorAll(
            ".message"
        );


    let empty =
        messages.querySelector(
            ".empty"
        );


    if(all.length === 0){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty";


            empty.innerHTML =
                "💬<br>ابدأ المحادثة الآن";


            messages.appendChild(
                empty
            );

        }

    }else{

        empty?.remove();

    }


    if(nearBottom){

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }

}

/* ============================================================
   WebRTC Peer
============================================================ */

function createPeer(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onicecandidate =
        async event => {

            if(
                !event.candidate ||
                !activeCallId
            )
                return;


            try{

                await addDoc(

                    collection(
                        db,
                        "calls",
                        activeCallId,
                        "candidates"
                    ),

                    {
                        senderId:
                            currentUser.uid,

                        candidate:
                            event.candidate
                                .toJSON()

                    }

                );

            }catch(error){

                console.error(
                    "ICE:",
                    error
                );

            }

        };


    pc.ontrack =
        event => {

            if(event.streams[0]){

                remoteVideo.srcObject =
                    event.streams[0];

            }

        };


    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            if(
                state === "connected"
            ){

                callState.textContent =
                    "متصل • 00:00";


                showConnectedControls();


                startCallTimer();

            }


            if(
                state === "failed"
            ){

                callState.textContent =
                    "تعذر الاتصال";

            }


            if(
                state === "disconnected"
            ){

                callState.textContent =
                    "انقطع الاتصال";

            }

        };


    return pc;

}

============================================================ */

async function startCall(type){

    if(
        !currentUser ||
        !friendUser
    ){

        alert(
            "تعذر بدء المكالمة"
        );

        return;

    }


    activeCallType =
        type;


    activeCallRole =
        "caller";


    activeCallId =
        crypto.randomUUID();


    videoSwapped =
        false;


    showCallOverlay(
        type
    );


    callState.textContent =
        type === "video"
        ? "جارٍ الاتصال بمكالمة فيديو..."
        : "جارٍ الاتصال...";


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        type === "video"

                });


        if(type === "video"){

            localVideo.srcObject =
                localStream;


            videoArea.style.display =
                "block";


            localVideo.className =
                "";


            remoteVideo.className =
                "";


            remoteVideo.classList.remove(
                "small-video"
            );


            localVideo.classList.remove(
                "big-video"
            );

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        await setDoc(
            callRef,
            {

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callType:
                    type,

                status:
                    "ringing",

                createdAt:
                    serverTimestamp()

            }
        );


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(
            callRef,
            {

                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }

            }
        );


        listenCallAsCaller();

    }catch(error){

        console.error(error);

        alert(
            "تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
        );


        await finishCall(
            "missed"
        );

    }

}


/* ============================================================
   مراقبة المكالمة عند المتصل
============================================================ */

function listenCallAsCaller(){

    const callRef =
        doc(
            db,
            "calls",
            activeCallId
        );


    unsubscribeActiveCall =
        onSnapshot(
            callRef,
            async snap => {

                if(!snap.exists())
                    return;


                const data =
                    snap.data();


                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection
                        .currentRemoteDescription
                ){

                    try{

                        await peerConnection
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data.answer
                                )
                            );

                    }catch(error){

                        console.error(error);

                    }

                }


                if(
                    data.status ===
                    "connected"
                ){

                    callState.textContent =
                        "متصل • " +
                        formatDuration(
                            callSeconds
                        );

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    await saveCallHistory(
                        {
                            ...data,
                            callStatus:
                                "missed"
                        }
                    );


                    cleanupCall();

                }


                if(
                    data.status ===
                    "ended"
                ){

                    if(
                        activeCallRole ===
                        "caller"
                    ){

                        await saveCallHistory(
                            {
                                ...data,
                                callStatus:
                                    data.duration > 0
                                    ? "completed"
                                    : "missed"
                            }
                        );

                    }


                    cleanupCall();

                }

            }
        );


    unsubscribeActiveCandidates =
        onSnapshot(

            collection(
                db,
                "calls",
                activeCallId,
                "candidates"
            ),

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.senderId ===
                                currentUser.uid
                            )
                                return;


                            if(
                                peerConnection &&
                                data.candidate
                            ){

                                peerConnection
                                    .addIceCandidate(
                                        new RTCIceCandidate(
                                            data.candidate
                                        )
                                    )
                                    .catch(
                                        console.error
                                    );

                            }

                        }
                    );

            }

        );

}

        const callRef =

            );

            await getDoc(
                callRef
            );


        if(!snap.exists()){

            throw new Error(
                "المكالمة غير موجودة"
            );

        }


        const data =
            snap.data();


        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        activeCallType ===
                        "video"

                });


        if(
            activeCallType ===
            "video"
        ){

            localVideo.srcObject =
                localStream;


            videoArea.style.display =
                "block";


            localVideo.className =
                "";


            remoteVideo.className =
                "";

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        await peerConnection
            .setRemoteDescription(

                new RTCSessionDescription(
                    data.offer
                )

            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(

            callRef,

            {

                answer:{

                },

        );


        await finishCall(
            "missed"
        );

    }

}

async function rejectIncomingCall(){

    try{

            ),

            {

                status:
                    "rejected",

                callStatus:
                    "missed",

                duration:
                    0,

                endedAt:
                    serverTimestamp()

            }

        );


        await saveCallHistory({

            callerId:
                friendUser.uid,

            receiverId:
                currentUser.uid,

            callType:
                activeCallType,

            callStatus:
                "missed",

            duration:
                0

        });

    }catch(error){

        console.error(error);

    }


    cleanupCall();

}


/* ============================================================
   ICE للمستلم
============================================================ */

function listenIncomingCandidates(){

    if(
        unsubscribeActiveCandidates
    ){

        unsubscribeActiveCandidates();

    }


    unsubscribeActiveCandidates =
        onSnapshot(

            collection(
                db,
                "calls",
                activeCallId,
                "candidates"
            ),

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.senderId ===
                                currentUser.uid
                            )
                                return;


                            if(
                                peerConnection &&
                                data.candidate
                            ){

                                peerConnection
                                    .addIceCandidate(
                                        new RTCIceCandidate(
                                            data.candidate
                                        )
                                    )
                                    .catch(
                                        console.error
                                    );

                            }

                        }
                    );

            }

        );

}


/* ============================================================
   مؤقت المكالمة
============================================================ */

function startCallTimer(){

    if(callTimer)
        return;


    callSeconds = 0;


    callTimer =
        setInterval(
            () => {

                callSeconds++;


                callState.textContent =
                    "متصل • " +
                    formatDuration(
                        callSeconds
                    );

            },
            1000
        );

}


function stopCallTimer(){

    clearInterval(
        callTimer
    );

    callTimer =
        null;

}


/* ============================================================
   حفظ سجل المكالمة داخل الشات
============================================================ */

async function saveCallHistory(data){

    if(
        !chatID ||
        !activeCallId
    )
        return;


    try{

        /*
           نستعمل ID ثابت للمكالمة
           حتى لا تظهر مرتين.
        */

        const messageId =
            "call_" +
            activeCallId;


        await setDoc(

            doc(
                db,
                "chats",
                chatID,
                "messages",
                messageId
            ),

            {

                type:
                    "call",

                callId:
                    activeCallId,

                callType:
                    data.callType ||
                    activeCallType ||
                    "audio",

                callerId:
                    data.callerId ||
                    (
                        activeCallRole ===
                        "caller"
                        ? currentUser.uid
                        : friendUser.uid
                    ),

                receiverId:
                    data.receiverId ||
                    (
                        activeCallRole ===
                        "caller"
                        ? friendUser.uid
                        : currentUser.uid
                    ),

                callStatus:
                    data.callStatus ||
                    "completed",

                duration:
                    Number(
                        data.duration ||
                        callSeconds ||
                        0
                    ),

                senderId:
                    currentUser.uid,

                receiverIdMessage:
                    friendUser.uid,

                read:false,

                createdAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Call history:",
            error
        );

    }

}


/* ============================================================
   إنهاء المكالمة
============================================================ */

async function finishCall(
    forcedStatus=null
){

    const callId =
        activeCallId;


    const duration =
        callSeconds;


    if(!callId){

        cleanupCall();

        return;

    }


    try{

        const callRef =
            doc(
                db,
                "calls",
                callId
            );


        const status =
            forcedStatus ===
            "missed"
            ? "ended"
            : "ended";


        await updateDoc(

            callRef,

            {

                status,

                duration,

                endedAt:
                    serverTimestamp()

            }

        );


        /*
           المتصل ينشئ سجل المكالمة.
        */

        if(
            activeCallRole ===
            "caller"
        ){

            await saveCallHistory({

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callType:
                    activeCallType,

                callStatus:
                    duration > 0
                    ? "completed"
                    : "missed",

                duration

            });

        }

    }catch(error){

        console.error(
            "End call:",
            error
        );

    }


    cleanupCall();

}


/* ============================================================
   تنظيف المكالمة
============================================================ */

function cleanupCall(){

    stopCallTimer();


    if(
        unsubscribeActiveCall
    ){

        unsubscribeActiveCall();

        unsubscribeActiveCall =
            null;

    }


    if(
        unsubscribeActiveCandidates
    ){

        unsubscribeActiveCandidates();

        unsubscribeActiveCandidates =
            null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    try{

                        track.stop();

                    }catch(e){}

                }
            );

    }


    localStream =
        null;


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(e){}

    }


    peerConnection =
        null;


    remoteVideo.srcObject =
        null;


    localVideo.srcObject =
        null;


    activeCallId =
        null;


    activeCallType =
        null;


    activeCallRole =
        null;


    callSeconds =
        0;


    videoSwapped =
        false;


    callOverlay.style.display =
        "none";


    acceptCallButton.style.display =
        "none";


    rejectCallButton.style.display =
        "none";


    muteButton.style.display =
        "none";


    speakerMuteButton.style.display =
        "none";


    cameraButton.style.display =
        "none";


    endCallButton.style.display =
        "none";


    videoArea.style.display =
        "none";


    remoteVideo.className =
        "";


    localVideo.className =
        "";

}


/* ============================================================
   تبديل الفيديو
============================================================ */

function switchVideos(){

    if(
        activeCallType !==
        "video"
    )
        return;


    videoSwapped =
        !videoSwapped;


    if(videoSwapped){

        /*
           أنا كبير
           الطرف الآخر صغير
        */

        localVideo.classList.add(
            "big-video"
        );


        remoteVideo.classList.add(
            "small-video"
        );

    }else{

        /*
           الطرف الآخر كبير
           أنا صغير
        */

        localVideo.classList.remove(
            "big-video"
        );


        remoteVideo.classList.remove(
            "small-video"
        );

    }

}


/*
   الضغط على صورتي
*/

localVideo.addEventListener(
    "click",
    switchVideos
);


/*
   الضغط على صورة الطرف الآخر
*/

remoteVideo.addEventListener(
    "click",
    switchVideos
);


/* ============================================================
   أزرار الاتصال
============================================================ */

callButton.onclick =
    () => {

        startCall(
            "audio"
        );

    };


videoButton.onclick =
    () => {

        startCall(
            "video"
        );

    };


endCallButton.onclick =
    () => {

        finishCall();

    };


acceptCallButton.onclick =
    () => {

        acceptIncomingCall();

    };


rejectCallButton.onclick =
    () => {

        rejectIncomingCall();

    };


/* ============================================================
   🎤 كتم صوتي
============================================================ */

muteButton.onclick =
    () => {

        if(!localStream)
            return;


        const track =
            localStream
                .getAudioTracks()[0];


        if(!track)
            return;


        track.enabled =
            !track.enabled;


        muteButton.textContent =
            track.enabled
            ? "🎤"
            : "🔇";

    };


/* ============================================================
   🔊 كتم الطرف الآخر
============================================================ */

speakerMuteButton.onclick =
    () => {

        const muted =
            remoteVideo.muted;


        remoteVideo.muted =
            !muted;


        speakerMuteButton.textContent =
            remoteVideo.muted
            ? "🔈"
            : "🔊";

    };


/* ============================================================
   📹 تشغيل/إيقاف الكاميرا
============================================================ */

cameraButton.onclick =
    () => {

        if(!localStream)
            return;


        const track =
            localStream
                .getVideoTracks()[0];


        if(!track)
            return;


        track.enabled =
            !track.enabled;


        cameraButton.textContent =
            track.enabled
            ? "📹"
            : "🚫";

    };


/* ============================================================
   الرجوع
============================================================ */

backButton.onclick =
    async () => {

        await updateTyping(false);


        if(unsubscribeMessages)
            unsubscribeMessages();


        if(unsubscribeFriendStatus)
            unsubscribeFriendStatus();


        if(unsubscribeFriendTyping)
            unsubscribeFriendTyping();


        if(incomingCallUnsubscribe)
            incomingCallUnsubscribe();


        stopPresence();


        if(activeCallId){

            await finishCall();

        }


        history.back();

    };


/* ============================================================
   Visibility
============================================================ */

document.addEventListener(
    "visibilitychange",
    () => {

        if(!currentUser)
            return;


        if(
            document.visibilityState ===
            "visible"
        ){

            updateMyPresence(true);

        }else{

            updateMyPresence(false);

            updateTyping(false);

        }

    }
);


window.addEventListener(
    "pagehide",
    () => {

        if(currentUser){

            updateMyPresence(false);

            updateTyping(false);

        }

    }
);


/* ============================================================
   التشغيل
============================================================ */

function init(){

    onAuthStateChanged(
        auth,
        async user => {

            if(!user){

                loading.textContent =
                    "يجب تسجيل الدخول أولاً";

                return;

            }


            currentUser =
                user;


            window.chatUser =
                user;


            try{

                startPresence();


                await loadFriend();


                listenMessages();


                /*
                   مراقبة المكالمات الواردة
                */

                listenIncomingCalls();


                showApp();

            }catch(error){

                stopPresence();

                showError(error);

            }

        }
    );

}


init();

</script>
