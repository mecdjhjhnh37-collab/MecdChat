<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
overflow:hidden;
}


.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
}


header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}


.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:white;
font-size:22px;
cursor:pointer;
}


.avatar{
width:48px;
height:48px;
border-radius:16px;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0;
}


.avatar img{
width:100%;
height:100%;
object-fit:cover;
}


.user-info{
flex:1;
min-width:0;
}


.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}


.user-status{
font-size:12px;
color:#777;
margin-top:5px;
}


.user-status.online{
color:#00e889;
}


.call-buttons{
display:flex;
gap:8px;
}


.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:white;
font-size:18px;
cursor:pointer;
}


.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:10px;
}


.empty{
margin:auto;
text-align:center;
color:#72817c;
}


.message{
max-width:78%;
padding:12px 15px;
border-radius:18px;
position:relative;
word-break:break-word;
}


.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}


.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px;
}


.time{
display:block;
font-size:9px;
opacity:.6;
margin-top:5px;
}


.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50;
}


#messageInput{
flex:1;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:white;
outline:none;
font-size:15px;
}


#voiceButton,
#sendButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
}


#voiceButton{
background:#18231f;
color:white;
}


#sendButton{
background:#00e889;
color:#00150e;
}


/* قائمة الحذف */

.message-menu{
position:absolute;
left:8px;
bottom:52px;
background:#101815;
padding:6px;
border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.45);
z-index:9999;
width:155px;
}


.message-menu button{
width:100%;
background:#18231f;
color:#ff5c5c;
border:1px solid rgba(255,255,255,.06);
padding:11px;
border-radius:11px;
font-size:14px;
font-weight:bold;
cursor:pointer;
}


</style>

</head>


<body>


<div id="loading"
style="
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020504;
z-index:9999;
color:white;
font-size:18px;
">

جارٍ فتح الدردشة...

</div>


<main id="app" class="app" style="display:none">


<header>

<button id="backButton" class="back">
→
</button>


<div id="friendAvatar" class="avatar">
👤
</div>


<div class="user-info">

<div id="friendName" class="user-name">
جار التحميل...
</div>


<div id="friendStatus" class="user-status">
● غير متصل
</div>

</div>


<div class="call-buttons">

<button id="callButton">
📞
</button>

<button id="videoButton">
📹
</button>

</div>


</header>


<div id="messages" class="messages">

<div class="empty">
💬
<br>
ابدأ المحادثة الآن
</div>

</div>


<div class="input-area">

<input id="messageInput"
placeholder="اكتب رسالة..."
maxlength="2000">


<button id="voiceButton">
🎤
</button>


<button id="sendButton">
➤
</button>


</div>


</main>
<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
deleteDoc,
updateDoc,
arrayUnion,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:"mecd-tools.firebaseapp.com",

projectId:"mecd-tools",

storageBucket:"mecd-tools.firebasestorage.app",

messagingSenderId:"643005547408",

appId:"1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp=
initializeApp(firebaseConfig);


const auth=
getAuth(firebaseApp);


const db=
getFirestore(firebaseApp);



const $=
id=>document.getElementById(id);



const messages=$("messages");

const input=$("messageInput");

const send=$("sendButton");

const friendName=$("friendName");

const friendAvatar=$("friendAvatar");

const friendStatus=$("friendStatus");

const loading=$("loading");

const app=$("app");



let currentUser=null;

let friendUser=null;

let chatID=null;

let stopMessages=null;

let stopStatus=null;

let presenceTimer=null;



function createChatID(a,b){

return [
a,
b
]
.sort()
.join("_");

}



function showApp(){

loading.style.display="none";

app.style.display="flex";

}



async function updatePresence(value){

if(!currentUser)
return;


await setDoc(

doc(
db,
"users",
currentUser.uid
),

{

online:value,

lastSeen:serverTimestamp()

},

{
merge:true
}

);

}



function startPresence(){

updatePresence(true);


if(presenceTimer)
clearInterval(presenceTimer);


presenceTimer=setInterval(()=>{

if(
document.visibilityState==="visible"
){

updatePresence(true);

}

},10000);

}



function listenFriendStatus(){

if(stopStatus)
stopStatus();


stopStatus=

onSnapshot(

doc(
db,
"users",
friendUser.uid
),

snap=>{


if(!snap.exists()){

friendStatus.textContent=
"● غير متصل";

return;

}


let data=snap.data();


let last=
data.lastSeen?.toMillis?.()||0;


let online=

data.online===true &&

Date.now()-last<30000;



friendStatus.textContent=

online
?
"● متصل"
:
"● غير متصل";



friendStatus.classList.toggle(
"online",
online
);


}

);


setInterval(()=>{

},5000);

}



async function loadFriend(){


let id=
new URLSearchParams(
location.search
)
.get("friend");



if(!id)
throw new Error(
"لا يوجد صديق"
);



let snap=
await getDoc(

doc(
db,
"users",
id
)

);



if(!snap.exists())
throw new Error(
"المستخدم غير موجود"
);



let data=snap.data();



friendUser={

uid:id,

name:data.name||"مستخدم Mecd",

photo:data.photo||""

};



friendName.textContent=
friendUser.name;



if(friendUser.photo){

friendAvatar.innerHTML=

`
<img src="${friendUser.photo}">
`;

}



chatID=
createChatID(
currentUser.uid,
friendUser.uid
);



await setDoc(

doc(
db,
"chats",
chatID
),

{

members:[
currentUser.uid,
friendUser.uid
],

updatedAt:serverTimestamp()

},

{
merge:true
}

);



listenFriendStatus();

}





function createMessage(item,data){


let box=
document.createElement("div");



box.className=

"message "+

(
data.senderId===currentUser.uid
?
"mine"
:
"other"
);



box.dataset.id=item.id;



box.textContent=
data.text||"";



let time=
document.createElement("span");

time.className="time";


if(data.createdAt?.toDate){

time.textContent=

data.createdAt
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}



box.appendChild(time);



addDeleteMenu(
box,
item.id,
data.senderId===currentUser.uid
);



return box;

}
 }


/* =========================
   جلب الرسائل
========================= */

function listenMessages(){

if(stopMessages)
stopMessages();


messages.innerHTML="";


let ref=
collection(
db,
"chats",
chatID,
"messages"
);



let q=
query(
ref,
orderBy(
"createdAt",
"asc"
)
);



stopMessages=

onSnapshot(

q,

snap=>{


snap.docChanges().forEach(change=>{


let item=change.doc;

let data=item.data();


let old=
messages.querySelector(
`[data-id="${item.id}"]`
);



if(change.type==="removed"){

if(old)
old.remove();

return;

}



if(
Array.isArray(data.deletedFor)
&&
data.deletedFor.includes(
currentUser.uid
)
){

if(old)
old.remove();

return;

}



if(change.type==="added"){


if(!old){


messages.appendChild(

createMessage(
item,
data
)

);


messages.scrollTop=
messages.scrollHeight;


}

}



});


if(
messages.querySelectorAll(".message")
.length===0
){

messages.innerHTML=
`
<div class="empty">
💬
<br>
ابدأ المحادثة الآن
</div>
`;

}


}

);

}




/* =========================
   إرسال رسالة
========================= */

async function sendMessage(){


let text=
input.value.trim();


if(
!text ||
!chatID
)
return;



await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

text:text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

createdAt:
serverTimestamp()

}

);


input.value="";

}




send.onclick=
sendMessage;



input.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

});




/* =========================
   حذف الرسائل
========================= */

function removeMenus(){

document
.querySelectorAll(
".message-menu"
)
.forEach(
e=>e.remove()
);

}



function addDeleteMenu(
element,
id,
mine
){


let timer;


element.addEventListener(
"pointerdown",
()=>{


timer=setTimeout(()=>{


removeMenus();


let menu=
document.createElement(
"div"
);


menu.className=
"message-menu";



let btn=
document.createElement(
"button"
);



btn.textContent=

mine
?
"🗑️ إلغاء الإرسال"
:
"🗑️ حذف لدي";



btn.onclick=
async()=>{


let ref=
doc(
db,
"chats",
chatID,
"messages",
id
);



if(mine){

await deleteDoc(ref);


}else{


await updateDoc(

ref,

{

deletedFor:
arrayUnion(
currentUser.uid
)

}

);


}


removeMenus();


};



menu.appendChild(btn);


element.appendChild(menu);



},500);



});


element.addEventListener(
"pointerup",
()=>{

clearTimeout(timer);

});

}



/* =========================
   تشغيل
========================= */


onAuthStateChanged(

auth,

async user=>{


if(!user){

loading.textContent=
"يجب تسجيل الدخول";

return;

}



currentUser=user;



try{


startPresence();


await loadFriend();


listenMessages();


showApp();



}catch(e){


console.error(e);


loading.textContent=
"حدث خطأ";

}


}

);



document.addEventListener(

"visibilitychange",

()=>{


if(
currentUser
){

updatePresence(
document.visibilityState==="visible"
);

}


}

);



window.addEventListener(
"pagehide",
()=>{

updatePresence(false);

}

);



</script>


<script type="module" src="voice.js"></script>


</body>

</html>
