<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع المطور مجد - الدردشة</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --accent-color: #22c55e;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --message-bg: #334155;
            --my-message-bg: #065f46;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--chat-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #334155;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background-color: var(--bg-color);
            border: 1px solid #475569;
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-item {
            position: relative;
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            background-color: var(--message-bg);
            cursor: pointer;
        }

        .message-item.my-message {
            align-self: flex-end;
            background-color: var(--my-message-bg);
        }

        /* تعديل قائمة الرسالة لتظهر فوق الرسالة تماماً */
        .message-context-menu {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 6px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            z-index: 100;
            min-width: 100px;
        }

        .message-context-menu button {
            background: none;
            border: none;
            color: var(--text-color);
            padding: 6px 12px;
            text-align: right;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .message-context-menu button:hover {
            background-color: #334155;
        }

        /* تصميم وحجم رسائل الصوت */
        .voice-message-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 220px;
            max-width: 100%;
            padding: 4px;
        }

        .play-voice-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .voice-wave {
            flex-grow: 1;
            height: 4px;
            background: #475569;
            border-radius: 2px;
            position: relative;
        }

        .chat-input-area {
            background-color: var(--chat-bg);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid #475569;
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        .chat-input-area input[type="file"] {
            display: none;
        }

        .file-upload-btn, .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .file-upload-btn {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>موقع المطور مجد - الدردشة</h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="بحث في الرسائل...">
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <!-- رسالة نصية عادية -->
        <div class="message-item" onclick="toggleMenu(this)">
            مرحباً بك في تطبيق الدردشة!
            <div class="message-context-menu">
                <button onclick="copyText(this)">نسخ</button>
                <button onclick="deleteMessage(this)">حذف</button>
            </div>
        </div>

        <!-- رسالة صوتية بتصميم مخصص -->
        <div class="message-item my-message" onclick="toggleMenu(this)">
            <div class="voice-message-container">
                <button class="play-voice-btn">▶</button>
                <div class="voice-wave"></div>
                <span style="font-size: 0.75rem; color: var(--text-secondary);">0:15</span>
            </div>
            <div class="message-context-menu">
                <button onclick="deleteMessage(this)">حذف</button>
            </div>
        </div>
    </div>

    <!-- نموذج الإرسال مع منع إعادة التحميل -->
    <form class="chat-input-area" id="chatForm">
        <label for="fileInput" class="file-upload-btn">📁</label>
        <input type="file" id="fileInput">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا...">
        <button type="submit" class="send-btn">إرسال</button>
    </form>

    <script>
        // إظهار/إخفاء قائمة خيارات الرسالة فوقها مباشرة
        function toggleMenu(element) {
            // إغلاق أي قوائم مفتوحة أخرى أولاً
            document.querySelectorAll('.message-context-menu').forEach(menu => {
                if (menu !== element.querySelector('.message-context-menu')) {
                    menu.style.display = 'none';
                }
            });
            
            const menu = element.querySelector('.message-context-menu');
            if (menu) {
                menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
            }
        }

        // إغلاق القوائم عند النقر خارجها
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.message-item')) {
                document.querySelectorAll('.message-context-menu').forEach(menu => {
                    menu.style.display = 'none';
                });
            }
        });

        function deleteMessage(btn) {
            const messageItem = btn.closest('.message-item');
            messageItem.remove();
        }

        function copyText(btn) {
            const messageItem = btn.closest('.message-item');
            navigator.clipboard.writeText(messageItem.innerText.replace('نسخحذف', '').trim());
            alert('تم نسخ النص');
        }

        // منع إعادة تحميل الصفحة عند إرسال رسالة أو ملف ومعالجة الإضافة محلياً
        const chatForm = document.getElementById('chatForm');
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');

        chatForm.addEventListener('submit', function(e) {
            e.preventDefault(); // يمنع إعادة تحميل الدردشة من البداية

            const text = messageInput.value.trim();
            const file = fileInput.files[0];

            if (text === "" && !file) return;

            const newMessage = document.createElement('div');
            newMessage.className = 'message-item my-message';
            newMessage.setAttribute('onclick', 'toggleMenu(this)');

            if (file) {
                newMessage.innerHTML = `تم إرسال ملف: ${file.name}
                    <div class="message-context-menu">
                        <button onclick="deleteMessage(this)">حذف</button>
                    </div>`;
            } else {
                newMessage.innerHTML = `${escapeHtml(text)}
                    <div class="message-context-menu">
                        <button onclick="copyText(this)">نسخ</button>
                        <button onclick="deleteMessage(this)">حذف</button>
                    </div>`;
            }

            chatContainer.appendChild(newMessage);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // تفريغ الحقول
            messageInput.value = "";
            fileInput.value = "";
        });

        // إصلاح وتفعيل البحث الفوري
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            const messages = chatContainer.querySelectorAll('.message-item');

            messages.forEach(msg => {
                const content = msg.textContent.toLowerCase();
                if (content.includes(query)) {
                    msg.style.display = 'block';
                } else {
                    msg.style.display = 'none';
                }
            });
        });

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
