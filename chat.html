/* =========================================================
   HELPERS
========================================================= */

function createChatID(a,b){

return [a,b]
.sort()
.join("_");

}

function createCallID(){

if(
typeof crypto!=="undefined" &&
typeof crypto.randomUUID==="function"
){

return crypto.randomUUID();

}

return "call_"+
Date.now()+
"_"+Math.random()
.toString(36)
.slice(2,12);

}

function escapeHtml(value){

return String(value??"")
.replace(/[&<>'"]/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[c]));

}

function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

function formatDuration(seconds){

seconds=Math.max(
0,
Math.floor(Number(seconds||0))
);

const m=Math.floor(seconds/60);
const s=seconds%60;

return String(m).padStart(2,"0")
+":"+String(s).padStart(2,"0");

}

function setUserAvatar(element,user){

element.innerHTML=

/* =========================================================
   PRESENCE
========================================================= */

async function updateMyPresence(online=true){

if(!currentUser)
return;

try{

await setDoc(

doc(
db,
"users",
currentUser.uid
),

{
online,
lastSeen:
serverTimestamp()
},

{
merge:true
}

);

}catch(e){

console.error(
"Presence:",
e
);

}

}

function startPresence(){

updateMyPresence(true);

clearInterval(
presenceInterval
);

presenceInterval=
setInterval(
()=>{

if(
document.visibilityState===
"visible"
){

updateMyPresence(true);

}

},
10000
);

}

function stopPresence(){

clearInterval(
presenceInterval
);

presenceInterval=null;

updateMyPresence(false);

}


/* =========================================================
   FRIEND
========================================================= */

async function loadFriend(){

const friendId=
new URLSearchParams(
location.search
).get("friend");

if(!friendId)
throw new Error(
"لا يوجد صديق في الرابط"
);

if(friendId===currentUser.uid)
throw new Error(
"لا يمكنك فتح محادثة مع نفسك"
);

const snap=
await getDoc(
doc(db,"users",friendId)
);

if(!snap.exists())
throw new Error(
"المستخدم غير موجود"
);

const data=snap.data();

friendUser={

uid:friendId,

name:
data.name||
"مستخدم Mecd",

photo:
data.photo||
data.photoURL||
""

};

friendName.textContent=
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);

chatID=
createChatID(
currentUser.uid,
friendUser.uid
);

await setDoc(

doc(
db,
"chats",
chatID
),

{
members:[
currentUser.uid,
friendUser.uid
],
createdAt:
serverTimestamp()
},

{
merge:true
}

);

listenFriendStatus();
listenFriendActivity();

}

function renderFriendStatus(){

if(
friendStatus.classList.contains("typing") ||
friendStatus.classList.contains("recording")
)
return;

friendStatus.classList.remove(
"online"
);

if(friendOnline){

friendStatus.textContent=
"● متصل";

friendStatus.classList.add(
"online"
);

}else{

friendStatus.textContent=
"● غير متصل";

}

}

function listenFriendStatus(){

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

unsubscribeFriendStatus=
onSnapshot(

doc(
db,
"users",
friendUser.uid
),

snap=>{

if(!snap.exists()){

friendOnline=false;

renderFriendStatus();

return;

}

const data=snap.data();

const last=
data.lastSeen?.toMillis?.()||0;

friendOnline=
data.online===true &&
last>0 &&

);

messageElements.get(id);

);

);

});

}

}

/* =========================================================
   RINGTONE
========================================================= */

function stopRingtone(){

ringtoneRunning=false;

if(ringtoneTimer){

clearTimeout(
ringtoneTimer
);

ringtoneTimer=null;

}

ringtoneOscillators.forEach(
osc=>{

try{
osc.stop();
}catch{}

}
);

ringtoneOscillators=[];

if(ringtoneGain){

try{
ringtoneGain.disconnect();
}catch{}

ringtoneGain=null;

}

}

function ringToneOnce(mode){

if(
typeof AudioContext==="undefined" &&
typeof webkitAudioContext==="undefined"
)
return;

try{

const AudioCtx=
window.AudioContext||
window.webkitAudioContext;

if(!ringtoneContext){

ringtoneContext=
new AudioCtx();

}

if(
ringtoneContext.state==="suspended"
){

ringtoneContext.resume()
.catch(()=>{});

}

const now=
ringtoneContext.currentTime;

const gain=
ringtoneContext.createGain();

gain.connect(
ringtoneContext.destination
);

gain.gain.setValueAtTime(
0,
now
);

gain.gain.linearRampToValueAtTime(
0.07,
now+0.03
);

gain.gain.linearRampToValueAtTime(
0,
now+0.30
);

const osc=
ringtoneContext.createOscillator();

osc.type=
mode==="incoming"
?"sine"
:"triangle";

osc.frequency.setValueAtTime(
mode==="incoming"
?660
:520,
now
);

osc.frequency.setValueAtTime(
mode==="incoming"
?880
:620,
now+0.15
);

osc.connect(gain);

osc.start(now);

osc.stop(now+0.32);

ringtoneOscillators.push(
osc
);

osc.onended=()=>{

ringtoneOscillators=
ringtoneOscillators.filter(
x=>x!==osc
);

};

}catch(e){

console.warn(
"Ringtone:",
e
);

}

}

function startRingtone(mode){

stopRingtone();

ringtoneRunning=true;

const repeat=()=>{

if(!ringtoneRunning)
return;

ringToneOnce(mode);

ringtoneTimer=
setTimeout(
repeat,
mode==="incoming"
?1800
:2200
);

};

repeat();

}

document.addEventListener(
"pointerdown",
()=>{

if(
ringtoneContext &&
ringtoneContext.state===
"suspended"
){

ringtoneContext.resume()
.catch(()=>{});

}

},
{
passive:true
}
);

async function addCandidate(candidate){

if(
!candidate||
!peerConnection
)
return;

if(
peerConnection.remoteDescription &&
peerConnection.remoteDescription.type
){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.error(
"ICE:",
e
);

}

}else{

pendingIceCandidates.push(
candidate
);

}

}

async function flushIce(){

if(
!peerConnection||
!peerConnection.remoteDescription
)
return;

const list=
pendingIceCandidates.splice(0);

for(
const candidate
of list
){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.error(
"ICE queue:",
e
);

}

}

}

/* =========================================================
   CALLER LISTENER
========================================================= */

function listenCallerCall(){

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall=
onSnapshot(

doc(
db,
"calls",
activeCallId
),

async snap=>{

if(!snap.exists()){

cleanupCall();

return;

}

const data=
snap.data();

if(
[
"cancelled",
"rejected",
"missed",
"ended"
].includes(
data.status
)
){

stopRingtone();

if(
data.status==="cancelled"
){

/*
  يتم التعامل معها كفائتة.
*/
}

cleanupCall();

return;

}

if(
data.answer &&
peerConnection &&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection.setRemoteDescription(

new RTCSessionDescription(
data.answer
)

);

await flushIce();

playRemoteAudio();

}catch(e){

console.error(
"Answer:",
e
);

}

}

if(data.status==="ringing"){

callState.textContent=
data.receivedAt
?"يرن..."
:"جارٍ الاتصال...";

}

if(data.status==="connected"){

stopOutgoingTimeout();

stopRingtone();

callState.textContent=
"متصل";

showConnectedButtons();

startCallTimer();

playRemoteAudio();

}

if(
data.callType==="video" &&
activeCallType!=="video"
){

activeCallType=
"video";

setupCallVisuals();

}

if(
data.upgradeOffer &&
Number(
data.upgradeVersion||0
)>
lastHandledUpgradeOfferVersion
){

await handleUpgradeOffer(
data
);

}

if(
data.upgradeAnswer &&
peerConnection &&
Number(
data.upgradeAnswerVersion||0
)>
lastHandledUpgradeAnswerVersion
){

try{

await peerConnection.setRemoteDescription(

new RTCSessionDescription(
data.upgradeAnswer
)

);

lastHandledUpgradeAnswerVersion=
Number(
data.upgradeAnswerVersion
);

await flushIce();

playRemoteAudio();

}catch(e){

console.error(
"Upgrade answer:",
e
);

}

}

}
);

listenCallCandidates();

}


/* =========================================================
   INCOMING CALLS
========================================================= */

function listenIncomingCalls(){

if(!currentUser)
return;

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

const q=
query(

collection(
db,
"calls"
),

where(
"receiverId",
"==",
currentUser.uid
)

);

unsubscribeIncomingCalls=
onSnapshot(

q,

async snapshot=>{

for(
const change
of snapshot.docChanges()
){

if(
change.type!=="added" &&
change.type!=="modified"
)
continue;

const id=
change.doc.id;

const data=
change.doc.data();

if(
data.receiverId!==currentUser.uid||
data.status!=="ringing"||
!data.offer
)
continue;

if(activeCallId===id)
continue;

if(activeCallId)
continue;

if(
handledIncomingCalls.has(id)
)
continue;

const created=
data.createdAt?.toMillis?.()||0;

if(
created &&
Date.now()-created>30000
){

try{

await updateDoc(

doc(
db,
"calls",
id
),

{
status:"missed",
duration:0,
endedAt:
serverTimestamp()
}

);

}catch(e){

console.error(e);

}

continue;

}

handledIncomingCalls.add(id);

const callerSnap=
await getDoc(

doc(
db,
"users",
data.callerId
)

);

const callerData=
callerSnap.exists()
?callerSnap.data()
:{};

activeCallId=id;

activeCallType=
data.callType||"audio";

activeCallRole=
"receiver";

activeCallPeer={

uid:
data.callerId,

name:
callerData.name||
"مستخدم Mecd",

photo:
callerData.photo||
callerData.photoURL||
""

};

callSeconds=0;

callMessageSaved=false;

pendingIceCandidates=[];

upgradeVersion=0;

lastHandledUpgradeOfferVersion=0;

lastHandledUpgradeAnswerVersion=0;

showIncoming();

callState.textContent=
activeCallType==="video"
?"📹 مكالمة فيديو واردة"
:"📞 مكالمة صوتية واردة";

startRingtone("incoming");

listenReceiverCallStatus();

}

}

);

}


/* =========================================================
   RECEIVER STATUS
========================================================= */

function listenReceiverCallStatus(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall=
onSnapshot(

doc(
db,
"calls",
activeCallId
),

async snap=>{

if(!snap.exists()){

cleanupCall();

return;

}

const data=
snap.data();

if(
[
"cancelled",
"missed",
"rejected"
].includes(
data.status
)
){

stopRingtone();

cleanupCall();

return;

}

if(data.status==="ended"){

stopRingtone();

callSeconds=
Number(data.duration||0);

cleanupCall();

return;

data.callType==="video" &&
activeCallType!=="video"
){

setupCallVisuals();

}

if(
data.upgradeOffer &&
Number(
data.upgradeVersion||0
)>
lastHandledUpgradeOfferVersion
){

await handleUpgradeOffer(
data
);

}

}
);

listenCallCandidates();

}

/* =========================================================
   HANDLE VIDEO UPGRADE
========================================================= */

async function handleUpgradeOffer(data){

if(
!peerConnection||
!activeCallId
)
return;

const version=
Number(
data.upgradeVersion||0
);

if(
version<=
lastHandledUpgradeOfferVersion
)
return;

try{

lastHandledUpgradeOfferVersion=
version;

await peerConnection.setRemoteDescription(

new RTCSessionDescription(
data.upgradeOffer
)

);

await flushIce();

if(!localStream){

localStream=
await navigator.mediaDevices
.getUserMedia({
audio:true,
video:{
facingMode:"user"
}
});

for(
const track
of localStream.getTracks()
){

const existingSender=
track.kind==="video"
?getVideoSender()
:null;

if(
existingSender &&
track.kind==="video"
){

await existingSender.replaceTrack(
track
);

}else{

peerConnection.addTrack(
track,
localStream
);

}

}

}else{

let videoTrack=
localStream
.getVideoTracks()[0];

if(!videoTrack){

const camera=
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:"user"
}

});

videoTrack=
camera.getVideoTracks()[0];

if(!videoTrack){

throw new Error(
"لا توجد كاميرا"
);

}

localStream.addTrack(
videoTrack
);

}

const sender=
getVideoSender();

if(sender){

await sender.replaceTrack(
videoTrack
);

}else{

peerConnection.addTrack(
videoTrack,
localStream
);

}

}

activeCallType="video";

localVideo.srcObject=
localStream;

localVideo.style.display=
"block";

localAvatar.style.display=
"none";

setupCallVisuals();

const answer=
await peerConnection.createAnswer();

await peerConnection.setLocalDescription(
answer
);

await updateDoc(

doc(
db,
"calls",
activeCallId
),

{
callType:"video",

upgradeAnswer:{
type:answer.type,
sdp:answer.sdp
},

upgradeAnswerVersion:
version

}

);

callState.textContent=
"متصل • فيديو";

showConnectedButtons();

}catch(e){

console.error(
"Upgrade:",
e
);

callState.textContent=
"تعذر تشغيل الفيديو";

}

}


/* =========================================================
   SAVE CALL MESSAGE
========================================================= */

async function saveCallMessage(
status,
duration
){

if(
!activeCallId||
!activeCallPeer||
callMessageSaved
)
return;

callMessageSaved=true;

const callerId=
activeCallRole==="caller"
?currentUser.uid
:activeCallPeer.uid;

const receiverId=
activeCallRole==="caller"
?activeCallPeer.uid
:currentUser.uid;

const targetChat=
createChatID(
callerId,
receiverId
);

let finalStatus=
status;

/*
  أي cancelled يتحول إلى missed.
*/
if(finalStatus==="cancelled"){

finalStatus="missed";

}

try{

await setDoc(

doc(
db,
"chats",
targetChat,
"messages",
"call_"+activeCallId
),

{

type:"call",

callId:
activeCallId,

callType:
activeCallType||"audio",

callerId,

receiverId,

callStatus:
finalStatus,

duration:
Number(duration||0),

senderId:
callerId,

read:false,

createdAt:
serverTimestamp()

},

{
merge:true
}

);

}catch(e){

console.error(
"Call message:",
e
);

}

}


/* =========================================================
   FINISH
========================================================= */

async function finishCall(
status=null
){

const id=
activeCallId;

if(!id){

cleanupCall();

return;

}

stopOutgoingTimeout();

stopRingtone();

const duration=
callSeconds;

const finalStatus=
status||
(
duration>0
?"completed"
:"missed"
);

try{

await updateDoc(

doc(
db,
"calls",
id
),

{
status:
finalStatus==="completed"
?"ended"
:finalStatus,

duration,

callType:
activeCallType||"audio",

endedAt:
serverTimestamp()

}

);

}catch(e){

console.error(
"Finish:",
e
);

}

await saveCallMessage(
finalStatus,
duration
);

cleanupCall();

}

stopRingtone();

}

unsubscribeCandidates();

.getTracks()

);
