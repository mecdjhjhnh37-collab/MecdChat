<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة صوتية</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

}

#loading{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#020504;

    color:white;

    font-size:17px;

}

</style>

</head>

<body>

<div id="loading">

    جارٍ فتح المكالمة...

</div>


<script type="module">

import "./call.js";


setTimeout(
    () => {

        const loading =
            document.getElementById(
                "loading"
            );

        if(loading){

            loading.remove();

        }

    },
    1200
);

</script>

</body>

</html>
