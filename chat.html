/* =========================

let toneContext=null;
let outgoingToneTimer=null;
let incomingToneTimer=null;

function getToneContext(){

if(!toneContext){

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext)return null;

toneContext=new AudioContext();

}

if(toneContext.state==="suspended"){
toneContext.resume().catch(()=>{});
}

return toneContext;

}

function playTone(frequencies,duration=300,gainValue=.035){

const ctx=getToneContext();

if(!ctx)return;

try{

const now=ctx.currentTime;

const master=ctx.createGain();
master.gain.setValueAtTime(0,now);
master.gain.linearRampToValueAtTime(gainValue,now+.02);
master.gain.setValueAtTime(gainValue,now+Math.max(.03,duration/1000-.05));
master.gain.linearRampToValueAtTime(0,now+duration/1000);

master.connect(ctx.destination);

frequencies.forEach((frequency,index)=>{

const oscillator=ctx.createOscillator();

oscillator.type="sine";
oscillator.frequency.value=frequency;

oscillator.connect(master);

oscillator.start(now);
oscillator.stop(now+duration/1000+.02);

});

}catch(e){

console.warn("Tone:",e);

}

}

function escapeHtml(value){

return String(value??"")
.replace(/[&<>'"]/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));

}

function formatTime(timestamp){

if(!timestamp?.toDate)return "";

try{

return timestamp.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

function formatDuration(seconds){

seconds=Math.max(
0,
Math.floor(Number(seconds||0))
);

const m=Math.floor(seconds/60);
const s=seconds%60;

return String(m).padStart(2,"0")
+":"+String(s).padStart(2,"0");

}

const messageElements=
new Map();

function renderMessages(snapshot){

const nearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<120;

snapshot.docChanges().forEach(change=>{

const id=change.doc.id;
const data=change.doc.data();

if(change.type==="removed"){

messageElements.get(id)?.remove();

messageElements.delete(id);

return;

}

if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(currentUser.uid)
){

messageElements.get(id)?.remove();
messageElements.delete(id);

return;

}

if(
data.senderId!==currentUser.uid
){

markRead(id,data);

}

const box=
document.createElement("div");

box.className=
"message "+
(
data.senderId===currentUser.uid
?"mine"
:"other"
);

if(data.type==="call"){

createCallMessage(
box,
data
);

}else if(data.type==="voice"){

createVoiceMessage(
box,
data
);

}else{

box.appendChild(
document.createTextNode(
data.text||""
)
);

}

const meta=
document.createElement("div");

meta.className="message-meta";

const time=
document.createElement("span");

time.className="time";
time.textContent=
formatTime(data.createdAt);

meta.appendChild(time);

const status=
createStatus(data);

if(status)
meta.appendChild(status);

box.appendChild(meta);

if(data.type!=="call"){

addMessageActions(
box,
id,
data.senderId===currentUser.uid
);

}

const old=
messageElements.get(id);

if(old){

old.replaceWith(box);

}else{

messages.appendChild(box);

}

messageElements.set(
id,
box
);

});

const all=
messages.querySelectorAll(
".message"
);

const empty=
messages.querySelector(".empty");

if(all.length){

empty?.remove();

}else if(!empty){

const e=
document.createElement("div");

e.className="empty";
e.innerHTML=
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(e);

}

if(nearBottom){

requestAnimationFrame(()=>{
messages.scrollTop=
messages.scrollHeight;
});

}

}

async function addCandidate(candidate){

!peerConnection||
!candidate
)
return;

if(
peerConnection.remoteDescription
){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.error(
"ICE:",
e
);

}

}else{

pendingIceCandidates.push(
candidate
);

}

}

async function flushIce(){

if(
!peerConnection||
!peerConnection.remoteDescription
)
return;

const list=
pendingIceCandidates.splice(0);

for(
const candidate of list
){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.error(
"ICE queue:",
e
);

}

}

}


/* =========================
   PEER
========================= */

function createPeer(){

const pc=
new RTCPeerConnection(
rtcConfig
);

pc.onicecandidate=
async e=>{

if(
!e.candidate||
!activeCallId||
!currentUser
)
return;

try{

await addDoc(
collection(
db,
"calls",
activeCallId,
"candidates"
),
{
senderId:
currentUser.uid,
candidate:
e.candidate.toJSON()
}
);

}catch(error){

console.error(
"ICE save:",
error
);

}

};

pc.ontrack=e=>{

if(!e.streams?.[0])
return;

const stream=
e.streams[0];

remoteAudio.srcObject=
stream;

if(
stream.getVideoTracks().length
){

remoteVideo.srcObject=
stream;

remoteVideo.style.display=
"block";

remoteAvatar.style.display=
"none";

videoArea.style.display=
"block";

audioCallView.style.display=
"none";

remoteVideo.muted=true;

remoteVideo.play().catch(
()=>{}
);

}else{

playRemoteAudio();

}

};

pc.onconnectionstatechange=()=>{

const state=
pc.connectionState;

if(state==="connected"){

stopOutgoingTimeout();
stopAllCallTones();

callState.textContent=
"متصل • "+
formatDuration(callSeconds);

showConnectedButtons();

startCallTimer();

playRemoteAudio();

}

if(state==="connecting"){

callState.textContent=
"جارٍ الاتصال...";

}

if(state==="failed"){

callState.textContent=
"تعذر الاتصال";

stopAllCallTones();

}

if(state==="disconnected"){

callState.textContent=
"انقطع الاتصال";

stopAllCallTones();

}

if(state==="closed"){

stopAllCallTones();

}

};

return pc;

}

/* =========================
   CALLER WATCH
========================= */

function listenCallerCall(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall=
onSnapshot(
doc(db,"calls",activeCallId),
async snap=>{

if(!snap.exists()){

stopAllCallTones();
cleanupCall();

return;

}

const data=
snap.data();

if(
[
"cancelled",
"rejected",
"missed",
"ended"
].includes(data.status)
){

stopAllCallTones();

callSeconds=
Number(data.duration||0);

cleanupCall();

return;

}

if(
data.answer&&
peerConnection&&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

await flushIce();

playRemoteAudio();

}catch(e){

console.error(
"Answer:",
e
);

}

}

if(data.status==="ringing"){

callState.textContent=
data.receivedAt
?"يرن..."
:"جارٍ الاتصال...";

}

if(data.status==="connected"){

stopOutgoingTimeout();
stopAllCallTones();

callState.textContent=
"متصل";

showConnectedButtons();

startCallTimer();

playRemoteAudio();

}

if(
data.callType==="video"&&
activeCallType!=="video"
){

activeCallType="video";

setupCallVisuals();

}

if(
data.upgradeOffer&&
Number(data.upgradeVersion||0)>
lastHandledUpgradeVersion
){

await handleUpgradeOffer(data);

}

if(
data.upgradeAnswer&&
peerConnection&&
Number(data.upgradeAnswerVersion||0)>
lastHandledUpgradeVersion
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.upgradeAnswer
)
);

lastHandledUpgradeVersion=
Number(
data.upgradeAnswerVersion
);

await flushIce();

}catch(e){

console.error(
"Upgrade answer:",
e
);

}

}

}
);

listenCallCandidates();

}

   INCOMING CALL LISTENER

function listenIncomingCalls(){

if(!currentUser)
return;

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

const q=query(
collection(db,"calls"),
where(
"receiverId",
"==",
currentUser.uid
)
);

unsubscribeIncomingCalls=
onSnapshot(
q,
async snapshot=>{

for(
const change of snapshot.docChanges()
){

const id=
change.doc.id;

const data=
change.doc.data();

if(
data.receiverId!==currentUser.uid||
data.status!=="ringing"||
!data.offer
)
continue;

if(
activeCallId===id
){

continue;

}

if(activeCallId)
continue;

if(handledIncomingCalls.has(id))
continue;

const created=
data.createdAt?.toMillis?.()||0;

if(
created&&
Date.now()-created>30000
){

try{

await safeUpdate(
doc(db,"calls",id),
{
status:"missed",
duration:0,
endedAt:
serverTimestamp()
}
);

}catch(e){

console.error(e);

}

continue;

}

handledIncomingCalls.add(id);

const callerSnap=
await getDoc(
doc(db,"users",data.callerId)
);

const callerData=
callerSnap.exists()
?callerSnap.data()
:{};

activeCallId=id;

activeCallType=
data.callType==="video"
?"video"
:"audio";

activeCallRole="receiver";

activeCallPeer={
uid:data.callerId,
name:
callerData.name||
"مستخدم Mecd",
photo:
callerData.photo||
callerData.photoURL||
""
};

callSeconds=0;
callMessageSaved=false;
pendingIceCandidates=[];
lastHandledUpgradeVersion=
Number(data.upgradeVersion||0);

showIncoming();

callState.textContent=
activeCallType==="video"
?"📹 مكالمة فيديو واردة"
:"📞 مكالمة صوتية واردة";

startIncomingRing();

listenReceiverCallStatus();

}

}
);

}


/* =========================
   RECEIVER STATUS
========================= */

function listenReceiverCallStatus(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall=
onSnapshot(
doc(db,"calls",activeCallId),
async snap=>{

if(!snap.exists()){

stopAllCallTones();
cleanupCall();

return;

}

const data=
snap.data();

if(
[
"cancelled",
"missed",
"rejected"
].includes(data.status)
){

stopAllCallTones();

cleanupCall();

return;

}

if(data.status==="ended"){

stopAllCallTones();

callSeconds=
Number(data.duration||0);

cleanupCall();

return;

}

if(
data.callType==="video"&&
activeCallType!=="video"
){

activeCallType="video";

setupCallVisuals();

}

if(
data.upgradeOffer&&
Number(data.upgradeVersion||0)>
lastHandledUpgradeVersion
){

await handleUpgradeOffer(data);

}

}
);

listenCallCandidates();

}


/* =========================
   ACCEPT
========================= */

async function acceptIncomingCall(){

if(
!activeCallId||
!activeCallPeer
)
return;

const callId=
activeCallId;

try{

const snap=
await getDoc(
doc(db,"calls",callId)
);

if(!snap.exists()){

stopAllCallTones();
cleanupCall();

return;

}

const data=
snap.data();

if(data.status!=="ringing"){

stopAllCallTones();
cleanupCall();

return;

}

stopAllCallTones();

incomingCall.style.display=
"none";

showCallScreen();

callState.textContent=
"جارٍ الاتصال...";

remoteAudio.muted=false;

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:
activeCallType==="video"
});

if(
activeCallType==="video"
){

localVideo.srcObject=
localStream;

localVideo.style.display=
"block";

localAvatar.style.display=
"none";

}

peerConnection=
createPeer();

localStream.getTracks().forEach(
track=>{
peerConnection.addTrack(
track,
localStream
);
}
);

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.offer
)
);

await flushIce();

const answer=
await peerConnection.createAnswer();

await peerConnection.setLocalDescription(
answer
);

await safeUpdate(
doc(db,"calls",callId),
{
answer:{
type:answer.type,
sdp:answer.sdp
},
status:"connected",
callType:activeCallType,
receivedAt:
serverTimestamp()
}
);

showConnectedButtons();
startCallTimer();
playRemoteAudio();

}catch(e){

console.error(
"Accept:",
e
);

stopAllCallTones();

alert(
"تعذر قبول المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

try{

if(activeCallId){

await safeUpdate(
doc(db,"calls",activeCallId),
{
status:"rejected",
duration:0,
endedAt:
serverTimestamp()
}
);

await saveCallMessage(
"rejected",
0
);

}

}catch(err){

console.error(err);

}

cleanupCall();

}


/* =========================
   CANDIDATES
========================= */

function listenCallCandidates(){

if(unsubscribeCandidates)
unsubscribeCandidates();

if(!activeCallId)
return;

const callId=
activeCallId;

unsubscribeCandidates=
onSnapshot(
collection(
db,
"calls",
callId,
"candidates"
),
snapshot=>{

snapshot.docChanges().forEach(
change=>{

if(change.type!=="added")
return;

const data=
change.doc.data();

if(
data.senderId===
currentUser.uid
)
return;

addCandidate(
data.candidate
);

}
);

}
);

}


/* =========================
   REJECT
========================= */

async function rejectIncomingCall(){

const id=
activeCallId;

stopAllCallTones();

if(!id){

cleanupCall();
return;

}

try{

await safeUpdate(
doc(db,"calls",id),
{
status:"rejected",
duration:0,
endedAt:
serverTimestamp()
}
);

await saveCallMessage(
"rejected",
0,
id
);

}catch(e){

console.error(
"Reject:",
e
);

}

cleanupCall();

}


/* =========================
   CANCEL
========================= */

async function cancelOutgoingCall(
saveMessage=true
){

const id=
activeCallId;

stopAllCallTones();
stopOutgoingTimeout();

if(!id){

cleanupCall();
return;

}

try{

const snap=
await getDoc(
doc(db,"calls",id)
);

if(snap.exists()){

const data=
snap.data();

if(data.status==="ringing"){

await safeUpdate(
doc(db,"calls",id),
{
status:"missed",
duration:0,
endedAt:
serverTimestamp()
}
);

if(saveMessage){

await saveCallMessage(
"missed",
0,
id
);

}

}else if(
data.status!=="ended"&&
data.status!=="rejected"&&
data.status!=="missed"
){

await safeUpdate(
doc(db,"calls",id),
{
status:"cancelled",
duration:0,
endedAt:
serverTimestamp()
}
);

if(saveMessage){

await saveCallMessage(
"cancelled",
0,
id
);

}

}

}

}catch(e){

console.error(
"Cancel:",
e
);

}

cleanupCall();

}


/* =========================
   AUDIO -> VIDEO
   بناء اتصال فيديو جديد
========================= */

async function switchToVideo(){

if(
!activeCallId||
activeCallRole!==null&&
!peerConnection
)
return;

const oldCallId=
activeCallId;

const oldRole=
activeCallRole;

const peer=
activeCallPeer;

stopAllCallTones();

try{

switchVideoButton.disabled=true;

callState.textContent=
"جارٍ بدء مكالمة فيديو جديدة...";

/*
   ننهي الاتصال الصوتي أولًا.
*/

try{

await safeUpdate(
doc(db,"calls",oldCallId),
{
status:"ended",
duration:callSeconds,
callType:"audio",
endedAt:
serverTimestamp(),
replacedBy:"video"
}
);

}catch(e){

console.warn(
"End old audio:",
e
);

}

await saveCallMessage(
"completed",
callSeconds,
oldCallId,
"audio"
);

cleanupCall();

/*
   ثم نبدأ اتصال فيديو جديد مستقل تمامًا.
*/

if(
peer?.uid &&
currentUser
){

friendUser={
uid:peer.uid,
name:peer.name||"مستخدم Mecd",
photo:peer.photo||""
};

activeCallPeer={
uid:peer.uid,
name:peer.name||"مستخدم Mecd",
photo:peer.photo||""
};

await startCall("video");

}

}catch(e){

console.error(
"New video call:",
e
);

alert(
"تعذر بدء مكالمة الفيديو"
);

}finally{

switchVideoButton.disabled=false;

}

}


/* =========================
   SAVE CALL MESSAGE
========================= */

async function saveCallMessage(
status,
duration,
specificCallId=null,
forcedCallType=null
){

const callId=
specificCallId||
activeCallId;

if(
!callId||
!currentUser
)
return;

if(
!specificCallId &&
callMessageSaved
)
return;

if(!specificCallId)
callMessageSaved=true;

const callerId=
activeCallRole==="caller"
?currentUser.uid
:activeCallPeer?.uid;

const receiverId=
activeCallRole==="caller"
?activeCallPeer?.uid
:currentUser.uid;

if(!callerId||!receiverId)
return;

const targetChat=
createChatID(
callerId,
receiverId
);

try{

await setDoc(
doc(
db,
"chats",
targetChat,
"messages",
"call_"+callId
),
{
type:"call",
callId,
callType:
forcedCallType||
activeCallType||
"audio",
callerId,
receiverId,
callStatus:status,
duration:
Number(duration||0),
senderId:callerId,
read:false,
createdAt:
serverTimestamp()
},
{merge:true}
);

}catch(e){

console.error(
"Call message:",
e
);

}

}


/* =========================
   FINISH
========================= */

async function finishCall(status=null){

const id=
activeCallId;

if(!id){

stopAllCallTones();
cleanupCall();
return;

}

stopOutgoingTimeout();
stopAllCallTones();

const duration=
callSeconds;

const finalStatus=
status||
(duration>0
?"completed"
:"missed");

try{

await safeUpdate(
doc(db,"calls",id),
{
status:
finalStatus==="completed"
?"ended"
:finalStatus,
duration,
callType:
activeCallType||
"audio",
endedAt:
serverTimestamp()
}
);

}catch(e){

console.error(
"Finish:",
e
);

}

await saveCallMessage(
finalStatus,
duration,
id
);

cleanupCall();

}


/* =========================
   CLEANUP
========================= */

function cleanupCall(){

stopCallTimer();
stopOutgoingTimeout();
stopAllCallTones();

if(unsubscribeActiveCall){

unsubscribeActiveCall();
unsubscribeActiveCall=null;

}

if(unsubscribeCandidates){

unsubscribeCandidates();
unsubscribeCandidates=null;

}

if(localStream){

localStream.getTracks().forEach(
track=>{

try{
track.stop();
}catch{}

}
);

localStream=null;

}

if(peerConnection){

try{
peerConnection.close();
}catch{}

peerConnection=null;

}

pendingIceCandidates=[];

remoteAudio.pause();
remoteAudio.srcObject=null;

remoteVideo.srcObject=null;
localVideo.srcObject=null;

incomingCall.style.display="none";
callScreen.style.display="none";

audioCallView.style.display="flex";
videoArea.style.display="none";

remoteVideo.style.display="none";
remoteAvatar.style.display="flex";

localVideo.style.display="none";
localAvatar.style.display="none";

hideAllCallButtons();

activeCallId=null;
activeCallType=null;
activeCallRole=null;
activeCallPeer=null;

callSeconds=0;
callMessageSaved=false;

upgradeVersion=0;
lastHandledUpgradeVersion=0;

remoteAudioMuted=false;
cameraFacing="user";

muteButton.textContent="🎤";
speakerButton.textContent="🔊";
switchVideoButton.textContent="📹";

muteButton.classList.remove("active");
speakerButton.classList.remove("active");

switchVideoButton.disabled=false;

}


/* =========================
   MUTE
========================= */

muteButton.onclick=()=>{

if(!localStream)
return;

const track=
localStream.getAudioTracks()[0];

if(!track)
return;

track.enabled=!track.enabled;

muteButton.textContent=
track.enabled
?"🎤"
:"🔇";

muteButton.classList.toggle(
"active",
!track.enabled
);

};


/* =========================
   SPEAKER
========================= */

speakerButton.onclick=async()=>{

remoteAudioMuted=
!remoteAudioMuted;

remoteAudio.muted=
remoteAudioMuted;

speakerButton.textContent=
remoteAudioMuted
?"🔇"
:"🔊";

speakerButton.classList.toggle(
"active",
remoteAudioMuted
);

if(!remoteAudioMuted)
await playRemoteAudio();

};


/* =========================
   FLIP CAMERA
========================= */

flipCameraButton.onclick=async()=>{

if(
!localStream||
activeCallType!=="video"
)
return;

try{

const oldTrack=
localStream.getVideoTracks()[0];

if(!oldTrack)
return;

cameraFacing=
cameraFacing==="user"
?"environment"
:"user";

const stream=
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
ideal:cameraFacing
}
}
});

const newTrack=
stream.getVideoTracks()[0];

if(!newTrack)
throw new Error(
"لا توجد كاميرا"
);

const sender=
peerConnection?.getSenders()
.find(
s=>s.track?.kind==="video"
);

if(sender){

await sender.replaceTrack(
newTrack
);

}

oldTrack.stop();

localStream.removeTrack(
oldTrack
);

localStream.addTrack(
newTrack
);

localVideo.srcObject=
localStream;

}catch(e){

console.error(
"Flip:",
e
);

}

};


/* =========================
   BUTTONS
========================= */

callButton.onclick=()=>{
startCall("audio");
};

videoButton.onclick=()=>{
startCall("video");
};

switchVideoButton.onclick=
switchToVideo;

acceptIncoming.onclick=
acceptIncomingCall;

rejectIncoming.onclick=
rejectIncomingCall;

acceptCallButton.onclick=
acceptIncomingCall;

rejectCallButton.onclick=
rejectIncomingCall;

endCallButton.onclick=async()=>{

if(!activeCallId){

cleanupCall();
return;

}

if(
activeCallRole==="caller"
){

const snap=
await getDoc(
doc(db,"calls",activeCallId)
).catch(()=>null);

if(
snap?.exists()&&
snap.data().status==="ringing"
){

await cancelOutgoingCall(
true
);

return;

}

}

await finishCall();

};


/* =========================
   BACK
========================= */

backButton.onclick=async()=>{

await updateMyActivity("none");

if(activeCallId){

if(activeCallRole==="caller"){

await cancelOutgoingCall(true);

}else{

await finishCall();

}

}

if(unsubscribeMessages)
unsubscribeMessages();

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

if(unsubscribeActivities)
unsubscribeActivities();

stopPresence();

history.back();

};


/* =========================
   PAGE / VISIBILITY
========================= */

document.addEventListener(
"visibilitychange",
()=>{

if(!currentUser)
return;

if(
document.visibilityState==="visible"
){

updateMyPresence(true);

if(activeCallId)
playRemoteAudio();

}else if(!activeCallId){

updateMyPresence(false);
updateMyActivity("none");

}

}
);

window.addEventListener(
"pagehide",
()=>{

if(!currentUser)
return;

stopAllCallTones();

updateMyPresence(false);

if(activeCallId){

/*
   لا نعتبر إغلاق الصفحة قبولًا أو رفضًا.
   السيرفر/Firestore ومهلة 30 ثانية
   يتكفلان بحالة المكالمة.
*/

}

}
);


/* =========================
   INIT
========================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

loading.textContent=
"يجب تسجيل الدخول أولاً";

return;

}

currentUser=user;

try{

startPresence();

await loadFriend();

listenMessages();

listenIncomingCalls();

await connectVoiceJS();

showApp();

}catch(e){

console.error(
"INIT:",
e
);

loading.textContent=
e.message||
"حدث خطأ";

}

});

console.log(
"🔥 Mecd Chat - Call System Ready"
);

</script>
