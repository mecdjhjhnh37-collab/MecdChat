<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>


<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}


body{

height:100vh;

font-family:Arial,Tahoma,sans-serif;

color:white;

background:

radial-gradient(
circle at top,
#123d35,
transparent 40%
),

linear-gradient(
180deg,
#07110f,
#020504
);

overflow:hidden;

}



.app{

height:100vh;

max-width:650px;

margin:auto;

display:flex;

flex-direction:column;

}



header{

height:75px;

display:flex;

align-items:center;

gap:12px;

padding:12px 15px;

background:#050807;

border-bottom:1px solid rgba(255,255,255,.08);

}



.back{

width:45px;

height:45px;

border:0;

border-radius:15px;

background:#18231f;

color:white;

font-size:22px;

cursor:pointer;

}



.avatar{

width:48px;

height:48px;

border-radius:16px;

background:#12352c;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

font-size:24px;

}



.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



.user-info{

flex:1;

}



.user-name{

font-size:17px;

font-weight:bold;

}



.user-status{

font-size:12px;

color:#777;

margin-top:5px;

}


.user-status.online{

color:#00e889;

}



.call-buttons{

display:flex;

gap:8px;

}



.call-buttons button{

width:42px;

height:42px;

border:0;

border-radius:14px;

background:#18231f;

color:white;

font-size:18px;

cursor:pointer;

}



/* الرسائل */


.messages{

flex:1;

overflow-y:auto;

padding:20px 15px 100px;

display:flex;

flex-direction:column;

gap:10px;

}



.empty{

margin:auto;

text-align:center;

color:#72817c;

}



.message{

max-width:78%;

padding:12px 15px;

border-radius:18px;

position:relative;

word-break:break-word;

}



.message.mine{

align-self:flex-start;

background:#00c96b;

color:#00150e;

border-bottom-left-radius:5px;

}



.message.other{

align-self:flex-end;

background:#18231f;

border:1px solid rgba(255,255,255,.08);

border-bottom-right-radius:5px;

}



.time{

display:block;

font-size:9px;

opacity:.6;

margin-top:5px;

}


/* الكتابة */


.input-area{

position:fixed;

bottom:0;

left:50%;

transform:translateX(-50%);

width:100%;

max-width:650px;

padding:10px;

display:flex;

gap:8px;

background:#050807;

}



#messageInput{

flex:1;

padding:14px;

border-radius:17px;

border:1px solid #27332f;

background:#111916;

color:white;

outline:none;

font-size:15px;

}



#voiceButton,
#sendButton{

width:50px;

height:50px;

border:0;

border-radius:16px;

font-size:22px;

cursor:pointer;

}



#voiceButton{

background:#18231f;

color:white;

}



#sendButton{

background:#00e889;

color:#00150e;

}



.message-menu{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

background:#111916;

padding:8px;

border-radius:12px;

z-index:999;

}



.message-menu button{

background:#18231f;

color:white;

border:0;

padding:10px 15px;

border-radius:10px;

}



</style>

</head>
<body>


<div id="loading"
style="
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020504;
color:white;
font-size:18px;
z-index:999;
">

جارٍ فتح الدردشة...

</div>



<main
id="app"
class="app"
style="display:none;"
>


<header>


<button
id="backButton"
class="back"
type="button"
>
→
</button>



<div
id="friendAvatar"
class="avatar"
>
👤
</div>




<div class="user-info">


<div
id="friendName"
class="user-name"
>
جار التحميل...
</div>



<div
id="friendStatus"
class="user-status"
>
● غير متصل
</div>



</div>




<div class="call-buttons">


<button id="callButton">
📞
</button>


<button id="videoButton">
📹
</button>


</div>


</header>





<div
id="messages"
class="messages"
>


<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>


</div>





<div class="input-area">


<input
id="messageInput"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>



<button
id="voiceButton"
type="button"
>
🎤
</button>



<button
id="sendButton"
type="button"
>
➤
</button>



</div>



</main>





<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
deleteDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {


apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",


authDomain:
"mecd-tools.firebaseapp.com",


projectId:
"mecd-tools",


storageBucket:
"mecd-tools.firebasestorage.app",


messagingSenderId:
"643005547408",


appId:
"1:643005547408:web:b1719060ec340dd0e0a915"

};




const firebaseApp =
initializeApp(
firebaseConfig
);


const auth =
getAuth(
firebaseApp
);


const db =
getFirestore(
firebaseApp
);
const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const friendName =
document.getElementById("friendName");

const friendAvatar =
document.getElementById("friendAvatar");

const backButton =
document.getElementById("backButton");

const callButton =
document.getElementById("callButton");

const videoButton =
document.getElementById("videoButton");


let currentUser = null;

let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;




function createChatID(a,b){

return [

a,b

]
.sort()
.join("_");

}
  async function loadFriend(){


const params =
new URLSearchParams(
location.search
);


const id =
params.get("friend");


if(!id){

alert("لا يوجد صديق");

return false;

}



const userDoc =
await getDoc(
doc(
db,
"users",
id
)
);



if(!userDoc.exists()){

alert("المستخدم غير موجود");

return false;

}



const data =
userDoc.data();



friendUser={

uid:id,

name:data.name || "مستخدم Mecd",

photo:data.photo || ""

};



friendName.textContent =
friendUser.name;



if(friendUser.photo){

friendAvatar.innerHTML =
`
<img src="${friendUser.photo}">
`;

}



chatID =
createChatID(
currentUser.uid,
friendUser.uid
);



await setDoc(

doc(
db,
"chats",
chatID
),

{

members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp()

},

{
merge:true
}

);



return true;

}






function listenMessages(){


const ref =
collection(
db,
"chats",
chatID,
"messages"
);



const q =
query(
ref,
orderBy(
"createdAt",
"asc"
)
);



unsubscribeMessages =
onSnapshot(
q,
snap=>{

messages.innerHTML=""



if(snap.empty){

messages.innerHTML=
`
<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>
`;

return;

}



snap.forEach(item=>{


const data =
item.data();



const box =
document.createElement("div");


box.className =
"message " +

(
data.senderId === currentUser.uid
?
"mine"
:
"other"
);



box.appendChild(
document.createTextNode(
data.text || ""
)
);



const time =
document.createElement("span");


time.className="time";


if(
data.createdAt &&
typeof data.createdAt.toDate === "function"
){

time.textContent =
data.createdAt
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}



box.appendChild(time);


messages.appendChild(box);



addMessageActions(
box,
item.id,
data.senderId === currentUser.uid
);



});



messages.scrollTop =
messages.scrollHeight;


}

);


}





async function sendMessage(){


const text =
messageInput.value.trim();


if(!text)
return;



await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

text:text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

createdAt:
serverTimestamp()

}

);



messageInput.value="";


}




sendButton.onclick =
sendMessage;



messageInput.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){

sendMessage();

}

});






function addMessageActions(
element,
id,
mine
){


let timer;


element.addEventListener(
"pointerdown",
()=>{


timer=setTimeout(()=>{


if(confirm("حذف الرسالة؟")){


deleteMessage(id);


}


},600);


});


element.addEventListener(
"pointerup",
()=>{

clearTimeout(timer);

});


}




async function deleteMessage(id){


await deleteDoc(

doc(
db,
"chats",
chatID,
"messages",
id
)

);


}







onAuthStateChanged(
auth,
async user=>{


if(!user)
return;


currentUser=user;



const ok =
await loadFriend();



if(ok){


listenMessages();


document.getElementById(
"loading"
).style.display="none";



document.getElementById(
"app"
).style.display="flex";


}


});






backButton.onclick =
()=>{

history.back();

};



callButton.onclick =
()=>{

alert("📞 الاتصال قيد التطوير");

};



videoButton.onclick =
()=>{

alert("📹 الفيديو قيد التطوير");

};



</script>


</body>

</html>
