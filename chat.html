<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at 50% -15%,#173d34 0,#0b211b 28%,transparent 58%),
linear-gradient(180deg,#07110f 0%,#020504 100%)
}

button,input{
font-family:inherit
}

button{
-webkit-user-select:none;
user-select:none
}

.app{
height:100dvh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:linear-gradient(180deg,rgba(5,12,10,.28),rgba(2,5,4,.45))
}

/* HEADER */

header{
height:72px;
min-height:72px;
display:flex;
align-items:center;
gap:11px;
padding:10px 13px;
background:rgba(5,8,7,.96);
border-bottom:1px solid rgba(255,255,255,.07);
z-index:20
}

.back{
width:43px;
height:43px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:21px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center
}

.back:active,
.call-buttons button:active,
#attachButton:active,
#voiceButton:active,
#sendButton:active{
transform:scale(.94)
}

.avatar{
width:47px;
height:47px;
min-width:47px;
border-radius:50%;
background:#17372f;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:23px;
border:1px solid rgba(255,255,255,.08)
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.user-info{
flex:1;
min-width:0;
text-align:right
}

.user-name{
font-size:16px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:11px;
color:#777;
margin-top:4px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.call-buttons{
display:flex;
align-items:center;
gap:7px
}

.call-buttons button{
width:41px;
height:41px;
border:0;
border-radius:13px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer;
transition:.15s
}

/* PINNED */

.pinned-banner{
display:none;
height:42px;
padding:6px 13px;
align-items:center;
justify-content:space-between;
gap:8px;
background:#0a1512;
border-bottom:1px solid rgba(0,232,137,.13);
z-index:15
}

.pinned-banner.show{
display:flex
}

.pinned-banner-content{
flex:1;
min-width:0;
display:flex;
align-items:center;
gap:7px;
cursor:pointer
}

.pinned-banner-text{
color:#00e889;
font-size:11px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.pinned-banner-close{
width:28px;
height:28px;
border:0;
background:transparent;
color:#aaa;
cursor:pointer
}

/* MESSAGES */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
padding:18px 13px 145px;
display:flex;
flex-direction:column;
gap:14px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch
}

.messages::-webkit-scrollbar{
width:3px
}

.messages::-webkit-scrollbar-thumb{
background:#26352f;
border-radius:10px
}

.empty{
margin:auto;
text-align:center;
color:#65736e;
font-size:14px;
line-height:1.9
}

.message{
position:relative;
max-width:78%;
padding:10px 13px 27px;
border-radius:17px;
line-height:1.5;
word-break:break-word;
overflow-wrap:anywhere;
margin-bottom:6px;
user-select:none;
transition:transform .12s ease,background-color .3s ease;
box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px
}

.message.highlight{
background:#00e889!important;
color:#00150e!important
}

.message.image-message,
.message.video-message{
padding:7px 7px 27px!important;
width:max-content!important;
max-width:80%!important
}

.message.mine.image-message,
.message.mine.video-message{
background:#00c96b!important
}

.message-image,
.message-video{
display:block;
width:100%;
max-width:265px;
max-height:290px;
border-radius:12px;
object-fit:cover
}

.message-video{
background:#000
}

/* TIME */

.message-meta{
position:absolute;
bottom:6px;
left:11px;
display:inline-flex;
align-items:center;
gap:4px;
direction:ltr
}

.message.other .message-meta{
left:auto;
right:11px
}

.time{
font-size:9px;
opacity:.62;
white-space:nowrap
}

.message-status{
font-size:11px;
font-weight:bold
}

.message-status.read{
color:#006dff
}

/* REACTIONS */

.message-reactions{
position:absolute;
bottom:-11px;
right:9px;
z-index:5;
display:flex;
align-items:center;
flex-wrap:wrap;
gap:3px
}

.message.mine .message-reactions{
right:auto;
left:9px
}

.reaction-chip{
border:1px solid rgba(255,255,255,.13);
background:#0b1613;
border-radius:12px;
padding:2px 5px;
font-size:11px;
cursor:pointer;
display:flex;
align-items:center;
gap:2px;
color:#fff
}

.reaction-chip.mine{
border-color:rgba(0,232,137,.55);
background:rgba(0,232,137,.23)
}

.reaction-count{
font-size:9px;
opacity:.9
}

.heart-pop{
position:absolute;
bottom:8px;
right:14px;
transform:scale(0);
font-size:22px;
animation:popEffect .4s ease forwards;
pointer-events:none;
z-index:30;
background:#0b1512;
border-radius:50%;
padding:2px 4px
}

.message.mine .heart-pop{
right:auto;
left:14px
}

@keyframes popEffect{
0%{transform:scale(0);opacity:0}
50%{transform:scale(1.3);opacity:1}
100%{transform:scale(1);opacity:1}
}

/* REPLY */

.message-reply{
display:flex;
align-items:stretch;
gap:6px;
margin-bottom:6px;
padding:5px 7px;
border-radius:8px;
background:rgba(0,0,0,.15);
border-right:3px solid #00e889;
font-size:11px;
cursor:pointer
}

.message.other .message-reply{
background:rgba(255,255,255,.06)
}

.reply-content{
min-width:0;
overflow:hidden
}

.reply-name{
font-size:10px;
font-weight:bold;
color:#00e889;
margin-bottom:2px
}

.message.mine .reply-name{
color:#00150e
}

.reply-text{
opacity:.8;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* BOTTOM SHEET */

.bottom-sheet-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.67);
z-index:1000;
display:flex;
align-items:flex-end;
animation:fadeIn .18s ease
}

.bottom-sheet{
width:100%;
max-width:650px;
margin:auto auto 0;
background:#111b18;
border-top-left-radius:24px;
border-top-right-radius:24px;
padding:14px 18px 28px;
box-shadow:0 -12px 40px rgba(0,0,0,.75);
animation:slideUp .23s ease;
border-top:1px solid rgba(0,232,137,.18)
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

@keyframes slideUp{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

.sheet-reactions-bar{
display:flex;
justify-content:space-around;
align-items:center;
background:#182521;
padding:9px 12px;
border-radius:30px;
border:1px solid rgba(255,255,255,.06);
margin-bottom:12px
}

.sheet-reaction-btn{
width:42px;
height:38px;
border:0;
background:transparent;
font-size:23px;
cursor:pointer
}

.sheet-actions-list{
display:flex;
flex-direction:column;
gap:6px
}

.sheet-action-item{
width:100%;
min-height:46px;
padding:11px 14px;
background:#182521;
border:0;
border-radius:12px;
color:#fff;
font-size:14px;
font-weight:bold;
text-align:right;
display:flex;
align-items:center;
gap:12px;
cursor:pointer
}

.sheet-action-item:active{
background:#20312b;
transform:scale(.99)
}

/* ATTACH MENU */

#attachMenu{
position:fixed;
bottom:70px;
right:max(10px,calc((100vw - 650px)/2 + 10px));
width:180px;
padding:7px;
background:#0b1512;
border:1px solid rgba(0,232,137,.17);
border-radius:17px;
box-shadow:0 10px 35px rgba(0,0,0,.55);
display:none;
z-index:1000
}

#attachMenu.show{
display:block
}

.attach-option{
width:100%;
height:45px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
font-size:13px;
font-weight:bold;
cursor:pointer;
margin-bottom:5px
}

.attach-option:last-child{
margin-bottom:0
}

.attach-option:active{
background:#20312b
}

/* REPLY COMPOSE */

.reply-compose{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:7px 10px;
background:#07100d;
border-top:1px solid rgba(0,232,137,.14);
z-index:45;
display:none;
align-items:center;
gap:8px
}

.reply-compose.show{
display:flex
}

.reply-compose-content{
flex:1;
min-width:0;
padding:7px 10px;
background:#111916;
border-radius:10px;
border-right:3px solid #00e889;
overflow:hidden
}

.reply-compose-name{
font-size:10px;
font-weight:bold;
color:#00e889;
margin-bottom:2px
}

.reply-compose-text{
font-size:11px;
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.reply-cancel{
width:32px;
height:32px;
border:0;
border-radius:10px;
background:#18231f;
color:#fff;
cursor:pointer
}

/* INPUT */

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
min-height:70px;
padding:9px 10px;
display:flex;
align-items:center;
gap:7px;
background:#050807;
border-top:1px solid rgba(255,255,255,.05);
z-index:50
}

#messageInput{
flex:1;
min-width:0;
height:50px;
padding:0 14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;
font-size:15px;
direction:rtl
}

#messageInput::placeholder{
color:#68746f
}

#messageInput:focus{
border-color:#00e889
}

#voiceButton,
#sendButton,
#attachButton{
width:49px;
height:49px;
min-width:49px;
border:0;
border-radius:16px;
font-size:21px;
cursor:pointer;
transition:.15s
}

#attachButton{
background:#18231f;
color:#fff;
font-size:25px
}

#voiceButton{
background:#18231f;
color:#fff
}

#sendButton{
background:#00e889;
color:#00150e;
font-size:22px
}

#sendButton:disabled{
opacity:.5;
cursor:not-allowed
}

.hidden-file{
display:none!important
}

/* LOADING */

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:12px;
background:#020504;
color:#fff;
font-size:17px;
z-index:999999
}

.loading-spinner{
width:30px;
height:30px;
border:3px solid #1a2b25;
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

@media(max-width:420px){
header{
height:68px;
min-height:68px;
padding:8px 10px
}

.avatar{
width:44px;
height:44px;
min-width:44px
}

.call-buttons button{
width:39px;
height:39px
}

.message{
max-width:82%
}

.input-area{
padding:8px
}

#voiceButton,
#sendButton,
#attachButton{
width:46px;
height:46px;
min-width:46px
}

#messageInput{
height:46px
}
}
</style>
</head>

<header>

<button id="backButton" class="back" type="button" aria-label="رجوع">→</button>

</button>

<input

</button>

</div>

</main>

const firebaseConfig = {

/* =========================
   ELEMENTS
========================= */

const $ = id => document.getElementById(id);

const app = $("app");

const galleryInput = $("galleryInput");

const backButton = $("backButton");

const videoButton = $("videoButton");


/* =========================
   STATE
========================= */

let currentUser = null;
let friendUser = null;
let chatID = null;

let unsubscribeFriend = null;

];


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>'"]/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));

}


function createChatID(a,b){

return [a,b].sort().join("_");

}


function getMessagePreview(data){

if(data.type === "text")
return data.text || "رسالة";

if(data.type === "image")
return "📷 صورة";

if(data.type === "video")
return "🎥 فيديو";

if(data.type === "voice")
return "🎤 رسالة صوتية";

return "رسالة";

}


function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString("ar",{
hour:"2-digit",
minute:"2-digit"
});

}catch{

return "";

}

}


/* =========================
   AVATAR
========================= */

function setUserAvatar(element,user){

element.innerHTML = "";

if(user?.photo){

const img = document.createElement("img");

img.src = user.photo;
img.alt = "";
img.referrerPolicy = "no-referrer";

img.onerror = ()=>{
element.textContent = "👤";
};

element.appendChild(img);

}else{

element.textContent = "👤";

}

}


/* =========================
   FRIEND STATUS
========================= */

function updateFriendStatus(data){

if(!data){

friendStatus.textContent = "● غير متصل";
friendStatus.className = "user-status";

return;

}

if(data.typing === true){

friendStatus.textContent = "● يكتب الآن...";
friendStatus.className = "user-status typing";
return;

}

if(data.recording === true){

friendStatus.textContent = "● يسجل رسالة صوتية...";
friendStatus.className = "user-status recording";
return;

}

if(data.online === true){

friendStatus.textContent = "● متصل";
friendStatus.className = "user-status online";
return;

}

if(data.lastSeen){

let date = null;

try{

if(typeof data.lastSeen.toDate === "function"){
date = data.lastSeen.toDate();
}

}catch{}

if(date){

friendStatus.textContent =
"● آخر ظهور " +
date.toLocaleString("ar",{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
});

}else{

friendStatus.textContent = "● غير متصل";

}

}else{

friendStatus.textContent = "● غير متصل";

}

}


/* =========================
   LOAD FRIEND
========================= */

async function loadFriend(){

const params =
new URLSearchParams(location.search);

const friendId =
params.get("friend");

if(!friendId)
throw new Error("لا يوجد صديق في الرابط");

const snap =
await getDoc(
doc(db,"users",friendId)
);

if(!snap.exists())
throw new Error("المستخدم غير موجود");

const data = snap.data();

friendUser = {
uid:friendId,
name:data.name || data.displayName || "مستخدم",
photo:data.photo || data.photoURL || "",
online:data.online === true,
lastSeen:data.lastSeen || null,
typing:data.typing === true,
recording:data.recording === true
};

friendName.textContent =
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);

updateFriendStatus(friendUser);

chatID =
createChatID(
currentUser.uid,
friendUser.uid
);

listenFriendStatus(friendId);

}


/* =========================
   FRIEND STATUS LISTENER
========================= */

function listenFriendStatus(friendId){

if(unsubscribeFriend)
unsubscribeFriend();

unsubscribeFriend =
onSnapshot(
doc(db,"users",friendId),
snap=>{

if(!snap.exists())
return;

const data = snap.data();

friendUser = {
...friendUser,
...data

/* =========================
   REACTIONS
========================= */

async function toggleReaction(messageId,emoji){

if(
!currentUser ||
!chatID ||
!messageId ||
!emoji
)
return;

try{

const messageRef =
doc(
db,
"chats",
chatID,
"messages",
messageId
);

const snap =
await getDoc(messageRef);

if(!snap.exists())
return;

const data = snap.data();

const reactions =
Array.isArray(data.reactions)
? data.reactions
: [];

const mine =
reactions.some(
r=>
r &&
r.userId === currentUser.uid &&
r.emoji === emoji
);

if(mine){

await updateDoc(
messageRef,
{
reactions:
arrayRemove({
userId:currentUser.uid,
emoji
})
}
);

}else{

const oldMine =
reactions.find(
r=>
r &&
r.userId === currentUser.uid
);

if(oldMine){

await updateDoc(
messageRef,
{
reactions:
arrayRemove(oldMine)
}
);

}

await updateDoc(
messageRef,
{
reactions:
arrayUnion({
userId:currentUser.uid,
emoji
})
}
);

}

}catch(e){

console.error(e);

}

}


function renderReactions(box,data){

if(
!Array.isArray(data.reactions) ||
!data.reactions.length
)
return;

const wrapper =
document.createElement("div");

wrapper.className =
"message-reactions";

const counts = {};

data.reactions.forEach(reaction=>{

if(
!reaction ||
!reaction.emoji
)
return;

if(!counts[reaction.emoji]){

counts[reaction.emoji] = {
count:0,
mine:false
};

}

counts[reaction.emoji].count++;

if(
reaction.userId === currentUser.uid
){

counts[reaction.emoji].mine = true;

}

});

reactionList.forEach(emoji=>{

const info = counts[emoji];

if(!info)
return;

const chip =
document.createElement("button");

chip.type = "button";

chip.className =
"reaction-chip" +
(info.mine ? " mine" : "");

chip.textContent = emoji;

if(info.count > 1){

const count =
document.createElement("span");

count.className =
"reaction-count";

count.textContent =
info.count;

chip.appendChild(count);

}

chip.onclick = e=>{

e.stopPropagation();

toggleReaction(
data.id,
emoji
);

};

wrapper.appendChild(chip);

});

if(wrapper.children.length)
box.appendChild(wrapper);

}

/* =========================
   SWIPE REPLY
========================= */

function setupSwipeToReply(element,data){

let startX = 0;
let currentX = 0;
let swiping = false;

element.addEventListener(
"touchstart",
e=>{

if(!e.touches.length)
return;

startX =
e.touches[0].clientX;

currentX = startX;

swiping = true;

},
{passive:true}
);

element.addEventListener(
"touchmove",
e=>{

if(!swiping || !e.touches.length)
return;

currentX =
e.touches[0].clientX;

const diff =
currentX - startX;

if(
data.senderId !== currentUser.uid &&
diff > 0 &&
diff < 120
){

element.style.transform =
`translateX(${diff}px)`;

}else if(
data.senderId === currentUser.uid &&
diff < 0 &&
diff > -120
){

element.style.transform =
`translateX(${diff}px)`;

}

},
{passive:true}
);

element.addEventListener(
"touchend",
()=>{

if(!swiping)
return;

swiping = false;

const diff =
currentX - startX;

if(Math.abs(diff) > 75)
startReply(data);

element.style.transform =
"translateX(0)";

}
);

}


/* =========================
   MESSAGE ACTIONS
========================= */

function addMessageActions(element,data){

let timer = null;
let isLongPress = false;
let lastClickTime = 0;

element.addEventListener(
"pointerdown",
e=>{

if(
e.pointerType === "mouse" &&
e.button !== 0
)
return;

isLongPress = false;

timer =
setTimeout(()=>{

isLongPress = true;

showBottomSheetMenu(data);

},500);

}
);

const clear =
()=>{
if(timer){
clearTimeout(timer);
timer = null;
}
};

element.addEventListener("pointerup",clear);
element.addEventListener("pointercancel",clear);
element.addEventListener("pointerleave",clear);

element.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

clear();

showBottomSheetMenu(data);

}
);

element.addEventListener(
"click",
e=>{

if(isLongPress)
return;

if(
e.target.closest("button") ||
e.target.closest(".message-reply") ||
e.target.closest("video")
)
return;

const now =
Date.now();

if(
now - lastClickTime < 320 &&
now - lastClickTime > 0
){

triggerHeartReaction(
element,
data.id
);

e.preventDefault();

}

lastClickTime = now;

}
);

setupSwipeToReply(
element,
data
);

}

/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(snapshot){

const empty =
messages.querySelector(".empty");

if(empty)
empty.remove();

const nearBottom =
messages.scrollHeight -
messages.scrollTop -
messages.clientHeight < 150;

snapshot.docChanges().forEach(change=>{

const id =
change.doc.id;

const data = {
...change.doc.data(),
id
};


/* REMOVED */

if(change.type === "removed"){

const old =
messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}


/* DELETED FOR ME */

if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(
currentUser.uid
)
){

const old =
messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}


/* PIN */

if(data.pinned === true){

pinnedBannerText.textContent =
(data.senderId === currentUser.uid
? "أنت: "
: "") +
getMessagePreview(data);

pinnedBanner.classList.add("show");

}


/* MESSAGE */

const box =
document.createElement("div");

let boxClass =
"message " +
(
data.senderId === currentUser.uid
? "mine"
: "other"
);

if(data.type === "image")
boxClass += " image-message";

if(data.type === "video")
boxClass += " video-message";

box.className = boxClass;


/* REPLY */

if(data.replyTo){

const replyBox =
document.createElement("div");

replyBox.className =
"message-reply";

replyBox.onclick =
e=>{

e.stopPropagation();

const targetEl =
messageElements.get(
data.replyTo.messageId
);

if(targetEl){

targetEl.scrollIntoView({
behavior:"smooth",
block:"center"
});

targetEl.classList.add(
"highlight"
);

setTimeout(
()=>targetEl.classList.remove("highlight"),
1500
);

}

};

const replyContent =
document.createElement("div");

replyContent.className =
"reply-content";

const replyName =
document.createElement("div");

replyName.className =
"reply-name";

replyName.textContent =
data.replyTo.senderId === currentUser.uid
? "أنت"
: data.replyTo.senderName || "المستخدم";

const replyText =
document.createElement("div");

replyText.className =
"reply-text";

replyText.textContent =
data.replyTo.text || "رسالة";

replyContent.append(
replyName,
replyText
);

replyBox.appendChild(
replyContent
);

box.appendChild(
replyBox
);

}


/* TEXT */

if(data.type === "text"){

box.appendChild(
document.createTextNode(
data.text || ""
)
);

if(data.isEdited){

const edited =
document.createElement("span");

edited.style.fontSize =
"9px";

edited.style.opacity =
".6";

edited.textContent =
" (معدلة)";

box.appendChild(
edited
);

}

}


/* IMAGE */

else if(
data.type === "image" &&
data.url
){

const img =
document.createElement("img");

img.className =
"message-image";

img.src =
data.url;

img.alt = "صورة";

img.loading = "lazy";

img.onclick = e=>{
e.stopPropagation();
};

box.appendChild(img);

}


/* VIDEO */

else if(
data.type === "video" &&
data.url
){

const vid =
document.createElement("video");

vid.className =
"message-video";

vid.src =
data.url;

vid.controls = true;

vid.preload = "metadata";

box.appendChild(vid);

}


/* META */

const meta =
document.createElement("div");

meta.className =
"message-meta";

const time =
document.createElement("span");

time.className =
"time";

time.textContent =
formatTime(data.createdAt);

meta.appendChild(time);

if(
data.senderId === currentUser.uid
){

const status =
document.createElement("span");

status.className =
"message-status " +
(data.read === true
? "read"
: "");

status.textContent =
data.read === true
? "✓✓"
: "✓";

meta.appendChild(status);

}

box.appendChild(meta);


/* REACTIONS */

renderReactions(
box,
data
);


/* ACTIONS */

addMessageActions(
box,
data
);


/* REPLACE / ADD */

const old =
messageElements.get(id);

if(old){

old.replaceWith(box);

}else{

messages.appendChild(box);

}

messageElements.set(
id,
box
);

});


if(nearBottom){

requestAnimationFrame(
()=>{
messages.scrollTop =
messages.scrollHeight;
}
);

}

}

/* =========================
   UPLOAD MEDIA
========================= */

async function uploadMediaAndSend(
file,
type
){

if(
!file ||
!currentUser ||
!friendUser ||
!chatID
)
return;

const maxSize =
type === "video"
? 50 * 1024 * 1024
: 15 * 1024 * 1024;

if(file.size > maxSize){

alert(
type === "video"
? "حجم الفيديو كبير جدًا"
: "حجم الصورة كبير جدًا"
);

return;

}

try{

const safeName =
file.name
.replace(/[^\w.\-() ]/g,"_")
.slice(-100);

const fileName =
`${currentUser.uid}/${Date.now()}_${safeName}`;

const {
data,
error
} =
await supabase
.storage
.from("mecd-media")
.upload(
fileName,
file,
{
upsert:false,
contentType:file.type
}
);

if(error)
throw error;

const {
data:publicURLData
} =
supabase
.storage
.from("mecd-media")
.getPublicUrl(
fileName
);

const mediaUrl =
publicURLData?.publicUrl;

if(!mediaUrl)
throw new Error(
"لم يتم إنشاء رابط الملف"
);

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
{

url:mediaUrl,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type,

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

}
);

}catch(e){

console.error(e);

alert(
"فشل رفع الملف"
);

}

}
