<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat - الدردشة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
}

header{
height:75px;
padding:12px 18px;
display:flex;
align-items:center;
gap:12px;
background:rgba(5,10,8,.95);
border-bottom:1px solid rgba(255,255,255,.08);
}

.back{
width:45px;
height:45px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.06);
color:white;
font-size:24px;
cursor:pointer;
}

.avatar{
width:48px;
height:48px;
border-radius:16px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#12352c;
font-size:24px;
flex-shrink:0;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:17px;
font-weight:bold;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.user-status{
font-size:11px;
color:#00e889;
margin-top:4px;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px 15px 100px;
display:flex;
flex-direction:column;
gap:10px;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
}

.message{
max-width:78%;
padding:11px 14px;
border-radius:18px;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
color:white;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px;
}

.time{
display:block;
font-size:9px;
opacity:.55;
margin-top:4px;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:12px;
display:flex;
gap:9px;
background:rgba(5,8,7,.96);
border-top:1px solid rgba(255,255,255,.08);
}

#messageInput{
flex:1;
min-width:0;
padding:14px 16px;
border-radius:17px;
border:1px solid rgba(255,255,255,.09);
outline:none;
background:#111916;
color:white;
font-family:inherit;
font-size:15px;
}

#messageInput::placeholder{
color:#63716d;
}

#sendButton{
width:52px;
height:52px;
border:none;
border-radius:17px;
background:#00e889;
color:#00150e;
font-size:22px;
cursor:pointer;
}

#sendButton:active{
transform:scale(.94);
}

#sendButton:disabled{
opacity:.5;
}

.loading,
.error-screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
background:#020504;
text-align:center;
padding:30px;
z-index:100;
}

.error-box{
max-width:500px;
padding:30px;
border-radius:25px;
background:#0b100e;
border:1px solid rgba(255,255,255,.08);
}

.error-box h2{
font-size:25px;
margin-bottom:15px;
}

.error-box p{
color:#9aa7a3;
line-height:1.8;
}

.spinner{
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ فتح الدردشة...
</div>

</div>


<div id="errorScreen" class="error-screen" style="display:none;">

<div class="error-box">

<h2>⚠️ تعذر فتح الدردشة</h2>

<p id="errorText"></p>

</div>

</div>


<main id="app" class="app" style="display:none;">

<header>

<button id="backButton" class="back">
→
</button>

<div id="friendAvatar" class="avatar">
👤
</div>

<div class="user-info">

<div id="friendName" class="user-name">
جارٍ التحميل...
</div>

<div class="user-status">
● متصل
</div>

</div>

</header>


<div id="messages" class="messages">

<div class="empty">
💬<br>
ابدأ المحادثة الآن
</div>

</div>


<div class="input-area">

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
>

<button id="sendButton">
➤
</button>

</div>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* =========================
   العناصر
========================= */

const loading =
document.getElementById("loading");

const errorScreen =
document.getElementById("errorScreen");

const errorText =
document.getElementById("errorText");

const app =
document.getElementById("app");

const friendAvatar =
document.getElementById("friendAvatar");

const friendName =
document.getElementById("friendName");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const backButton =
document.getElementById("backButton");


/* =========================
   المتغيرات
========================= */

let currentUser = null;
let friendUser = null;
let chatID = null;


/* =========================
   تنظيف النص
========================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   إظهار الخطأ
========================= */

function showError(message){

loading.style.display = "none";

app.style.display = "none";

errorText.textContent = message;

errorScreen.style.display = "flex";

}


/* =========================
   ID المحادثة
========================= */

function createChatID(uid1,uid2){

return [
uid1,
uid2
]
.sort()
.join("_");

}


/* =========================
   قراءة الصديق
========================= */

async function loadFriend(){

const params =
new URLSearchParams(
window.location.search
);

const friendUID =
params.get("friend");


if(!friendUID){

showError(
"لم يتم تحديد الصديق."
);

return false;

}


if(friendUID === currentUser.uid){

showError(
"لا يمكنك فتح دردشة مع نفسك."
);

return false;

}


/* جلب بيانات الصديق */

const friendRef =
doc(
db,
"users",
friendUID
);

const friendDoc =
await getDoc(friendRef);


if(!friendDoc.exists()){

showError(
"لم يتم العثور على هذا المستخدم."
);

return false;

}


const data =
friendDoc.data();


friendUser = {

uid:friendUID,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
""

};


/* عرض البيانات */

friendName.textContent =
friendUser.name;


if(friendUser.photo){

friendAvatar.innerHTML = `

<img
src="${escapeHTML(friendUser.photo)}"
alt="صورة المستخدم"
>

`;

}else{

friendAvatar.textContent = "👤";

}


/* إنشاء Chat ID */

chatID =
createChatID(
currentUser.uid,
friendUser.uid
);


/* إنشاء المحادثة */

const chatRef =
doc(
db,
"chats",
chatID
);

const chatDoc =
await getDoc(chatRef);


if(!chatDoc.exists()){

await setDoc(
chatRef,
{

members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp(),

lastMessage:
"",

lastMessageAt:
serverTimestamp()

}
);

}


return true;

}


/* =========================
   تحميل الرسائل
========================= */

function listenMessages(){

const messagesRef =
collection(
db,
"chats",
chatID,
"messages"
);


const messagesQuery =
query(
messagesRef,
orderBy(
"createdAt",
"asc"
)
);


onSnapshot(
messagesQuery,

(snapshot)=>{

messages.innerHTML = "";


if(snapshot.empty){

messages.innerHTML = `

<div class="empty">

💬<br>

ابدأ المحادثة الآن

</div>

`;

return;

}


snapshot.forEach(
(messageDoc)=>{

const data =
messageDoc.data();

const message =
document.createElement("div");

message.className =
"message " +
(
data.senderId === currentUser.uid
?
"mine"
:
"other"
);


const text =
escapeHTML(
data.text
);


let time = "";

if(data.createdAt){

try{

time =
data.createdAt
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch(e){}

}


message.innerHTML = `

${text}

<span class="time">
${time}
</span>

`;


messages.appendChild(message);

}
);


messages.scrollTop =
messages.scrollHeight;

},

(error)=>{

console.error(
"Messages error:",
error
);

showError(
"ليس لديك صلاحية قراءة هذه المحادثة. تأكد من وضع Firestore Rules التي أعطيتك إياها."
);

}

);

}


/* =========================
   إرسال رسالة
========================= */

async function sendMessage(){

const text =
messageInput.value.trim();


if(!text){
return;
}


if(!currentUser || !chatID){
return;
}


sendButton.disabled = true;


try{

const messagesRef =
collection(
db,
"chats",
chatID,
"messages"
);


await addDoc(
messagesRef,
{

text:text,

senderId:
currentUser.uid,

createdAt:
serverTimestamp()

}
);


/* تحديث آخر رسالة */

await setDoc(

doc(
db,
"chats",
chatID
),

{

lastMessage:text,

lastMessageAt:
serverTimestamp()

},

{

merge:true

}

);


messageInput.value = "";

messageInput.focus();


}catch(error){

console.error(
"Send message error:",
error
);

alert(
"تعذر إرسال الرسالة: " +
error.message
);

}finally{

sendButton.disabled = false;

}

}


/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

showError(
"يجب تسجيل الدخول أولاً من Mecd Tools."
);

return;

}


currentUser = user;


try{

const success =
await loadFriend();


if(!success){
return;
}


listenMessages();


loading.style.display =
"none";

app.style.display =
"flex";

messageInput.focus();


}catch(error){

console.error(
"Chat loading error:",
error
);

showError(
"حدث خطأ أثناء فتح الدردشة. تأكد من Firestore Rules."
);

}

}

);


/* =========================
   زر الإرسال
========================= */

sendButton.addEventListener(
"click",
sendMessage
);


/* =========================
   Enter
========================= */

messageInput.addEventListener(

"keydown",

(event)=>{

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

}

);


/* =========================
   رجوع
========================= */

backButton.addEventListener(

"click",

()=>{

history.back();

}

);

</script>

</body>
</html>
