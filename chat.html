<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<meta name="mobile-web-app-capable" content="yes">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35 0%,transparent 42%),
linear-gradient(180deg,#07110f,#020504);
font-size:16px
}

button,input{
font:inherit
}

button{
-webkit-user-select:none;
user-select:none
}

.app{
width:100%;
height:100dvh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:rgba(2,5,4,.45)
}

/* ================= HEADER ================= */

header{
height:70px;
min-height:70px;
display:flex;
align-items:center;
gap:10px;
padding:8px 12px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
z-index:50
}

.back{
width:42px;
height:42px;
border:0;
border-radius:13px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer;
flex-shrink:0
}

.back:active,
.call-buttons button:active,
.attach-button:active,
.send-button:active{
transform:scale(.94)
}

.avatar{
width:46px;
height:46px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:23px;
flex-shrink:0;
cursor:pointer
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.user-info{
flex:1;
min-width:0;
cursor:pointer
}

.user-name{
font-size:16px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:11px;
color:#7d8985;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.call-buttons{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0
}

.call-buttons button{
width:39px;
height:39px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
font-size:17px;
cursor:pointer
}

.more-button{
width:38px!important;
font-size:21px!important
}

/* ================= PINNED ================= */

.pinned-banner{
display:none;
align-items:center;
gap:9px;
padding:8px 13px;
background:#0b1613;
border-bottom:1px solid rgba(0,232,137,.15);
z-index:40
}

.pinned-banner.show{
display:flex
}

.pinned-banner-content{
flex:1;
min-width:0;
display:flex;
align-items:center;
gap:8px;
cursor:pointer
}

.pinned-banner-text{
color:#00e889;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.pinned-banner-close{
background:none;
border:0;
color:#aaa;
font-size:14px;
cursor:pointer
}

/* ================= MESSAGES ================= */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:18px 13px 125px;
display:flex;
flex-direction:column;
gap:13px;
scroll-behavior:smooth;
overscroll-behavior:contain
}

.messages::-webkit-scrollbar{
width:4px
}

.messages::-webkit-scrollbar-thumb{
background:#26332e;
border-radius:10px
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
font-size:14px
}

.message{
position:relative;
max-width:78%;
min-width:70px;
padding:9px 12px 24px 12px;
border-radius:17px;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.5;
user-select:none;
-webkit-user-select:none;
transition:transform .12s ease,background-color .2s ease;
box-shadow:0 2px 7px rgba(0,0,0,.12);
touch-action: pan-y;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
color:#fff;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px
}

.message.highlight{
background:#00e889!important;
color:#00150e!important
}

.message-text{
white-space:pre-wrap;
display:block;
margin-bottom:2px;
}

/* ================= TIME / TICKS ================= */

.message-meta{
position:absolute;
bottom:4px;
left:10px;
display:flex;
align-items:center;
gap:3px;
direction:ltr;
pointer-events: none;
}

.message.other .message-meta{
left:auto;
right:10px
}

.time{
font-size:9px;
opacity:.72;
white-space:nowrap
}

.message-status{
font-size:10px;
font-weight:bold;
line-height:1
}

.message-status.read{
color:#0047bb
}

/* ================= MEDIA ================= */

.message.image-message,
.message.video-message{
padding:7px 7px 24px!important;
width:max-content;
max-width:82%;
background:#18231f!important
}

.message.mine.image-message,
.message.mine.video-message{
background:#00c96b!important
}

.message-image,
.message-video{
display:block;
width:auto;
max-width:270px;
max-height:310px;
border-radius:12px;
object-fit:cover;
cursor:pointer
}

/* ================= REPLY ================= */

.message-reply{
display:flex;
gap:7px;
margin-bottom:5px;
padding:4px 6px;
border-radius:8px;
background:rgba(0,0,0,.15);
border-right:3px solid #00e889;
font-size:11px;
cursor:pointer;
min-width:0
}

.message.other .message-reply{
background:rgba(255,255,255,.06)
}

.reply-content{
min-width:0;
overflow:hidden
}

.reply-name{
font-weight:bold;
font-size:10px;
color:#00e889;
margin-bottom:1px
}

.message.mine .reply-name{
color:#003d27
}

.reply-text{
opacity:.78;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* ================= REACTIONS ================= */

.message-reactions{
position:absolute;
bottom:-10px;
right:9px;
display:flex;
align-items:center;
flex-wrap:wrap;
gap:3px;
z-index:5
}

.message.mine .message-reactions{
right:auto;
left:9px
}

.reaction-chip{
display:flex;
align-items:center;
gap:2px;
border:1px solid rgba(255,255,255,.12);
background:#0b1613;
border-radius:12px;
padding:1px 5px;
font-size:11px;
color:#fff;
cursor:pointer
}

.reaction-chip.mine{
border-color:rgba(0,232,137,.55);
background:rgba(0,232,137,.25)
}

.reaction-count{
font-size:9px;
opacity:.9
}

.heart-pop{
position:absolute;
bottom:8px;
right:15px;
font-size:22px;
animation:heartPop .45s ease forwards;
pointer-events:none;
z-index:30
}

.message.mine .heart-pop{
right:auto;
left:15px
}

@keyframes heartPop{
0%{transform:scale(0);opacity:0}
55%{transform:scale(1.35);opacity:1}
100%{transform:scale(1);opacity:1}
}

/* ================= INPUT ================= */

.input-area{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:9px 9px calc(9px + env(safe-area-inset-bottom));
display:flex;
align-items:center;
gap:7px;
background:#050807;
border-top:1px solid rgba(255,255,255,.07);
z-index:80
}

.message-input-wrap{
flex:1;
min-width:0;
height:49px;
display:flex;
align-items:center;
gap:5px;
padding:4px 7px;
background:#111916;
border:1px solid #27332f;
border-radius:18px
}

.message-input-wrap:focus-within{
border-color:#00e889
}

#messageInput{
flex:1;
min-width:0;
height:40px;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:15px
}

#messageInput::placeholder{
color:#77817d
}

.emoji-button{
width:34px;
height:34px;
border:0;
background:transparent;
color:#9ba5a1;
font-size:21px;
cursor:pointer
}

.attach-button,
.send-button,
.voice-button{
width:48px;
height:48px;
border:0;
border-radius:16px;
cursor:pointer;
flex-shrink:0
}

.attach-button{
background:#18231f;
color:#fff;
font-size:24px
}

.send-button{
background:#00e889;
color:#00150e;
font-size:21px
}

.voice-button{
background:#18231f;
color:#fff;
font-size:21px
}

.voice-button.recording{
background:#d93636;
color:#fff;
animation:pulse .9s infinite
}

@keyframes pulse{
50%{transform:scale(.92)}
}

/* ================= ATTACHMENT SHEET ================= */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:1000;
display:none
}

.overlay.show{
display:block
}

.attachment-sheet{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
background:#111b18;
border-radius:24px 24px 0 0;
padding:14px 17px calc(22px + env(safe-area-inset-bottom));
box-shadow:0 -12px 40px rgba(0,0,0,.7);
animation:sheetUp .22s ease
}

@keyframes sheetUp{
from{transform:translate(-50%,100%)}
to{transform:translate(-50%,0)}
}

.sheet-handle{
width:42px;
height:4px;
background:#53615c;
border-radius:5px;
margin:0 auto 20px
}

.attachment-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.attachment-option{
border:0;
background:transparent;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
gap:7px;
font-size:11px;
cursor:pointer
}

.attachment-icon{
width:53px;
height:53px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:23px
}

.icon-document{background:#2879d9}
.icon-camera{background:#b53bd0}
.icon-gallery{background:#e88b24}
.icon-location{background:#dc4b4b}
.icon-search{background:#12a96c}

/* ================= CONTEXT MENU ================= */

.context-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
z-index:2000;
display:none;
align-items:center;
justify-content:center;
padding:15px
}

.context-overlay.show{
display:flex
}

.context-box{
width:min(390px,100%);
background:rgba(20,30,27,.94);
border:1px solid rgba(255,255,255,.1);
border-radius:22px;
padding:12px;
box-shadow:0 20px 60px rgba(0,0,0,.8);
backdrop-filter:blur(18px);
animation:contextIn .18s ease
}

@keyframes contextIn{
from{transform:scale(.94);opacity:0}
to{transform:scale(1);opacity:1}
}

.context-preview{
padding:8px 4px 12px
}

.context-reactions{
display:flex;
justify-content:space-around;
padding:9px;
background:rgba(255,255,255,.05);
border-radius:17px;
margin-bottom:9px
}

.context-reaction{
border:0;
background:transparent;
font-size:23px;
cursor:pointer;
transition:.15s
}

.context-reaction:active{
transform:scale(1.3)
}

.context-actions{
display:flex;
flex-direction:column;
gap:5px
}

.context-action{
width:100%;
height:44px;
border:0;
border-radius:12px;
background:rgba(255,255,255,.055);
color:#fff;
display:flex;
align-items:center;
gap:12px;
padding:0 13px;
text-align:right;
font-size:14px;
cursor:pointer
}

.context-action:active{
background:rgba(0,232,137,.14)
}

/* ================= PROFILE CARD ================= */

.profile-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:1500;
display:none;
align-items:flex-end
}

.profile-overlay.show{
display:flex
}

.profile-card{
width:100%;
max-width:650px;
margin:auto;
background:#111b18;
border-radius:25px 25px 0 0;
padding:14px 18px calc(24px + env(safe-area-inset-bottom));
animation:sheetUp .22s ease;
box-shadow:0 -15px 50px rgba(0,0,0,.7)
}

.profile-handle{
width:42px;
height:4px;
background:#52605b;
border-radius:5px;
margin:0 auto 18px
}

.profile-top{
display:flex;
align-items:center;
gap:14px;
padding-bottom:18px;
border-bottom:1px solid rgba(255,255,255,.08)
}

.profile-avatar{
width:70px;
height:70px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
overflow:hidden;
flex-shrink:0
}

.profile-avatar img{
width:100%;
height:100%;
object-fit:cover
}

.profile-name{
font-size:19px;
font-weight:bold
}

.profile-status{
font-size:12px;
color:#00e889;
margin-top:5px
}

.profile-actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:15px
}

.profile-action{
height:58px;
border:0;
border-radius:14px;
background:#182521;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
font-size:11px;
cursor:pointer
}

.profile-action span{
font-size:20px
}

/* ================= EMOJI ================= */

.emoji-panel{
position:absolute;
bottom:67px;
right:9px;
width:280px;
max-width:calc(100% - 18px);
background:#111b18;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:10px;
display:none;
z-index:100
}

.emoji-panel.show{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:4px
}

.emoji-panel button{
height:32px;
border:0;
background:transparent;
font-size:20px;
cursor:pointer
}

/* ================= CALL & VIDEO SCREENS ================= */

#incomingCall{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%) translateY(-150px);
width:92%;
max-width:400px;
background:rgba(17,27,24,0.95);
backdrop-filter:blur(12px);
border:1px solid rgba(0,232,137,0.3);
border-radius:20px;
padding:15px 20px;
display:none;
align-items:center;
justify-content:space-between;
z-index:99999;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
transition:transform 0.3s ease;
}
#incomingCall.show{
transform:translateX(-50%) translateY(0);
display:flex;
}
.incoming-call-info{
display:flex;
align-items:center;
gap:12px;
min-width:0;
}
.call-avatar{
width:50px;
height:50px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
overflow:hidden;
flex-shrink:0;
}
.call-avatar img{width:100%;height:100%;object-fit:cover;}
.incoming-name{font-weight:bold;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.incoming-type{font-size:12px;color:#00e889;margin-top:3px;}
.incoming-actions{display:flex;gap:10px;}

#callScreen{
position:fixed;
inset:0;
background:#07110f;
z-index:99998;
display:none;
flex-direction:column;
justify-content:space-between;
padding:30px 20px calc(30px + env(safe-area-inset-bottom));
}
.call-top{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
margin-top:20px;
}
.call-top-info{display:flex;flex-direction:column;align-items:center;gap:6px;}
#callTitle{font-size:20px;font-weight:bold;}
#callState{font-size:13px;color:#00e889;}
#callDuration{font-size:12px;color:#9ba5a1;margin-top:4px;}

#audioCallView{
flex:1;
display:flex;
align-items:center;
justify-content:center;
}
#videoArea{
position:absolute;
inset:0;
background:#000;
display:none;
z-index:-1;
}
#remoteVideo{
width:100%;
height:100%;
object-fit:cover;
display:none;
}
#remoteAvatar{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:80px;
background:#07110f;
}
#localVideo{
position:absolute;
bottom:120px;
left:20px;
width:100px;
height:140px;
border-radius:12px;
object-fit:cover;
background:#111b18;
display:none;
border:1px solid rgba(255,255,255,0.2);
z-index:5;
}

.call-controls{
display:flex;
align-items:center;
justify-content:center;
gap:15px;
margin-bottom:10px;
z-index:10;
}
.call-control{
width:56px;
height:56px;
border-radius:50%;
border:0;
background:#18231f;
color:#fff;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 4px 15px rgba(0,0,0,0.3);
}
.call-control.accept{background:#00c96b;color:#00150e;}
.call-control.reject, .call-control.end{background:#d93636;color:#fff;}
.call-control.active{background:#fff;color:#000;}
.call-control.hidden{display:none !important;}

/* ================= FILE ================= */

.hidden-file{
display:none!important
}

/* ================= LOADING ================= */

#loading{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#020504;
color:#fff;
z-index:999999;
gap:14px
}

.loading-spinner{
width:32px;
height:32px;
border:3px solid rgba(255,255,255,.12);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.error-box{
padding:25px;
text-align:center;
color:#fff
}

.error-box button{
margin-top:15px;
padding:10px 18px;
border:0;
border-radius:12px;
background:#00e889;
color:#00150e;
font-weight:bold
}
</style>
</head>

<body>

<div id="loading">
<div class="loading-spinner"></div>
<div id="loadingText">جارٍ فتح الدردشة...</div>
</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back" type="button" aria-label="رجوع">→</button>

<div id="friendAvatar" class="avatar" aria-label="صورة المستخدم">👤</div>

<div id="userInfo" class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton" type="button" aria-label="مكالمة صوتية">📞</button>
<button id="videoButton" type="button" aria-label="مكالمة فيديو">📹</button>
<button id="moreButton" class="more-button" type="button" aria-label="المزيد">⋮</button>
</div>

</header>

<div id="pinnedBanner" class="pinned-banner">
<div id="pinnedBannerClick" class="pinned-banner-content">
<span>📌</span>
<span id="pinnedBannerText" class="pinned-banner-text">رسالة مثبتة</span>
</div>
<button id="pinnedBannerClose" class="pinned-banner-close" type="button">✕</button>
</div>

<div id="messages" class="messages">
<div class="empty">💬<br>ابدأ المحادثة الآن</div>
</div>

<!-- Emoji -->
<div id="emojiPanel" class="emoji-panel"></div>

<!-- Reply -->
<div id="replyCompose" style="
position:absolute;
bottom:68px;
left:0;
width:100%;
padding:7px 10px;
background:#07100d;
border-top:1px solid rgba(0,232,137,.14);
z-index:70;
display:none;
align-items:center;
gap:8px
">

<div style="
flex:1;
min-width:0;
padding:7px 10px;
background:#111916;
border-radius:10px;
border-right:3px solid #00e889;
overflow:hidden
">

<div id="replyComposeName" style="
font-size:10px;
font-weight:bold;
color:#00e889;
margin-bottom:2px
">الرد على الرسالة</div>

<div id="replyComposeText" style="
font-size:11px;
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
"></div>

</div>

<button id="replyCancel" type="button" style="
width:32px;
height:32px;
border:0;
border-radius:10px;
background:#18231f;
color:#fff
">✕</button>

</div>

<!-- Input -->

<div class="input-area">

<div class="message-input-wrap">

<button id="attachButton" class="attach-button" type="button" style="width:36px;height:36px;background:transparent;font-size:20px;border-radius:50%;">＋</button>

<button id="emojiButton" class="emoji-button" type="button">☺</button>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>

</div>

<button id="voiceButton" class="voice-button" type="button" title="تسجيل صوتي">🎤</button>

<button id="sendButton" class="send-button" type="button">➤</button>

</div>

</main>

<!-- Attachment Sheet -->

<div id="attachmentOverlay" class="overlay">

<div id="attachmentSheet" class="attachment-sheet">

<div class="sheet-handle"></div>

async function updateMyPresence(online = true){

try{
await setDoc(doc(db, "users", currentUser.uid), {
online,
lastSeen: serverTimestamp()
}, { merge:true });
}catch(e){ console.error("Presence:", e); }
}

}
}, 10000);

}

function renderFriendStatus(){
friendStatus.classList.remove("online", "typing", "recording");
if(friendRecording){
friendStatus.textContent = "🎤 يسجل صوت...";
friendStatus.classList.add("recording");
profileStatus.textContent = "يسجل صوت...";
return;
}
if(friendTyping){
friendStatus.textContent = "يكتب...";
friendStatus.classList.add("typing");
profileStatus.textContent = "يكتب...";
return;
}
if(friendOnline){
friendStatus.textContent = "● متصل الآن";
friendStatus.classList.add("online");
profileStatus.textContent = "متصل الآن";
}else{
friendStatus.textContent = "● غير متصل";

}
}

function listenFriendActivity(){

if(!snap.exists()){
friendTyping = false;
friendRecording = false;
renderFriendStatus();
return;
}

const updated = data.updatedAt?.toMillis?.() || 0;
const fresh = !updated || Date.now() - updated < 5000;
friendRecording = fresh && data.recording === true;
friendTyping = fresh && data.typing === true && !friendRecording;
renderFriendStatus();
});
}

let ringtoneContext = null;
let ringtoneTimer = null;
function startRingtone(){
stopRingtone();
try{
ringtoneContext = new (window.AudioContext || window.webkitAudioContext)();
const gain = ringtoneContext.createGain();
gain.gain.value = 0.05;
gain.connect(ringtoneContext.destination);
const playTone = () => {
if(!ringtoneContext) return;
const osc = ringtoneContext.createOscillator();
osc.frequency.value = 440;
osc.connect(gain);
osc.start();
osc.stop(ringtoneContext.currentTime + 0.3);
};
playTone();
ringtoneTimer = setInterval(playTone, 1000);
}catch(e){}
}
function stopRingtone(){
if(ringtoneTimer) clearInterval(ringtoneTimer);
ringtoneTimer = null;
if(ringtoneContext) try{ ringtoneContext.close(); }catch{}
ringtoneContext = null;
}

async function playRemoteAudio(){
if(!remoteAudio || !remoteAudio.srcObject) return;
remoteAudio.muted = remoteAudioMuted;
try{ await remoteAudio.play(); }catch(e){}
}

async function flushPendingCandidates(){
if(!peerConnection || !peerConnection.remoteDescription) return;
while(pendingCandidates.length > 0){
const candidate = pendingCandidates.shift();
try{
await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
}catch(e){ console.error("Error adding pending ice candidate", e); }
}
}

function createPeer(){
if (peerConnection) {
try { peerConnection.close(); } catch(e){}
peerConnection = null;
}
const pc = new RTCPeerConnection(rtcConfig);
pc.onicecandidate = async e => {
if(!e.candidate || !activeCallId || !currentUser) return;
try {
await addDoc(collection(db, "calls", activeCallId, "candidates"), {
senderId: currentUser.uid,
candidate: e.candidate.toJSON(),
createdAt: serverTimestamp()
});
}catch(err){}
};
pc.ontrack = e => {
const stream = e.streams?.[0];
if(!stream) return;
remoteAudio.srcObject = stream;
const hasVideo = stream.getVideoTracks().some(t => t.readyState !== "ended");
if(hasVideo){
remoteVideo.srcObject = stream;
remoteVideo.style.display = "block";
remoteAvatar.style.display = "none";
videoArea.style.display = "block";
audioCallView.style.display = "none";
remoteVideo.play().catch(()=>{});
}else{
playRemoteAudio();
}
};
pc.onconnectionstatechange = () => {
if(pc.connectionState === "connected"){
stopOutgoingTimeout();
callState.textContent = "متصل";
showConnectedButtons();
startCallTimer();
playRemoteAudio();
}else if(pc.connectionState === "failed" || pc.connectionState === "disconnected"){
callState.textContent = "انقطع الاتصال";
setTimeout(() => { if(activeCallId) finishCall(); }, 1500);
}
};
peerConnection = pc;
return pc;
}

async function startCall(type){
if(activeCallId) return;
activeCallId = crypto.randomUUID();
activeCallType = type;
activeCallRole = "caller";
activeCallPeer = { uid: friendUser.uid, name: friendUser.name, photo: friendUser.photo };
callSeconds = 0;
showCallScreen();
showOutgoingButtons();
callState.textContent = "جارٍ الاتصال...";

try{
localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === "video" });
if(type === "video"){
localVideo.srcObject = localStream;
localVideo.style.display = "block";
}
const pc = createPeer();
if(type === "audio") pc.addTransceiver("video", { direction: "sendrecv" });
localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

const offer = await pc.createOffer();
await pc.setLocalDescription(offer);

await setDoc(doc(db, "calls", activeCallId), {
callId: activeCallId,
callerId: currentUser.uid,
receiverId: friendUser.uid,
callType: type,
status: "ringing",
offer: { type: offer.type, sdp: offer.sdp },
createdAt: serverTimestamp()
});

listenCallerCall();
startOutgoingTimeout();
}catch(e){
alert("تعذر الوصول للميكروفون أو الكاميرا");
cleanupCall();
}
}

function listenCallerCall(){
if(unsubscribeActiveCall) unsubscribeActiveCall();
unsubscribeActiveCall = onSnapshot(doc(db, "calls", activeCallId), async snap => {
if(!snap.exists()){ cleanupCall(); return; }
const data = snap.data();
if(["cancelled", "rejected", "missed", "ended", "completed"].includes(data.status)){
stopRingtone();
cleanupCall();
return;
}
if(data.answer && peerConnection && !peerConnection.currentRemoteDescription){
await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
await flushPendingCandidates();
playRemoteAudio();
}
if(data.status === "connected"){
stopOutgoingTimeout();
stopRingtone();
callState.textContent = "متصل";
showConnectedButtons();
startCallTimer();
}
});
listenCallCandidates();
}

function listenIncomingCalls(){
if(!currentUser) return;
if(unsubscribeIncomingCalls) unsubscribeIncomingCalls();
const q = query(collection(db, "calls"), where("receiverId", "==", currentUser.uid));
unsubscribeIncomingCalls = onSnapshot(q, snapshot => {
snapshot.docChanges().forEach(async change => {
if(change.type !== "added") return;
const id = change.doc.id;
const data = change.doc.data();
if(data.status !== "ringing" || !data.offer || activeCallId || handledIncomingCalls.has(id)) return;
handledIncomingCalls.add(id);

const callerSnap = await getDoc(doc(db, "users", data.callerId));
const callerData = callerSnap.exists() ? callerSnap.data() : {};

activeCallId = id;
activeCallType = data.callType || "audio";
activeCallRole = "receiver";
activeCallPeer = { uid: data.callerId, name: callerData.name || "مستخدم", photo: callerData.photo || "" };

showIncoming();
startRingtone();
listenReceiverCallStatus();
});
});
}

function listenReceiverCallStatus(){
if(unsubscribeActiveCall) unsubscribeActiveCall();
unsubscribeActiveCall = onSnapshot(doc(db, "calls", activeCallId), snap => {
if(!snap.exists()){
stopRingtone();
cleanupCall();
return;
}
const data = snap.data();
if(["cancelled", "rejected", "missed", "ended", "completed"].includes(data.status)){
stopRingtone();
cleanupCall();
}
});
listenCallCandidates();
}

async function acceptIncomingCall(){
if(!activeCallId) return;
stopRingtone();
incomingCall.classList.remove("show");
showCallScreen();
try{
localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: activeCallType === "video" });
if(activeCallType === "video"){
localVideo.srcObject = localStream;
localVideo.style.display = "block";
}
const pc = createPeer();
localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

const snap = await getDoc(doc(db, "calls", activeCallId));
if(!snap.exists()) { cleanupCall(); return; }
await pc.setRemoteDescription(new RTCSessionDescription(snap.data().offer));
await flushPendingCandidates();

const answer = await pc.createAnswer();
await pc.setLocalDescription(answer);

await updateDoc(doc(db, "calls", activeCallId), {
answer: { type: answer.type, sdp: answer.sdp },
status: "connected",
receivedAt: serverTimestamp()
});
showConnectedButtons();
startCallTimer();
playRemoteAudio();
}catch(e){ cleanupCall(); }
}

async function rejectIncomingCall(){
if(activeCallId) await updateDoc(doc(db, "calls", activeCallId), { status: "rejected", endedAt: serverTimestamp() });
incomingCall.classList.remove("show");
cleanupCall();
}

function listenCallCandidates(){
if(unsubscribeCandidates) unsubscribeCandidates();
unsubscribeCandidates = onSnapshot(collection(db, "calls", activeCallId, "candidates"), async snapshot => {
snapshot.docChanges().forEach(async change => {
if(change.type === "added" && change.doc.data().senderId !== currentUser.uid){
const candidate = change.doc.data().candidate;
if(!peerConnection || !peerConnection.remoteDescription){
pendingCandidates.push(candidate);
}else{
try{
await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
}catch(e){}
}
}
});
});
}

function startCallTimer(){
if(callTimer) return;
callTimer = setInterval(() => {
callSeconds++;
callDuration.textContent = formatDuration(callSeconds);
}, 1000);
}

function startOutgoingTimeout(){
callTimeout = setTimeout(() => { if(activeCallId && activeCallRole === "caller") finishCall("missed"); }, 30000);
}

function stopOutgoingTimeout(){
clearTimeout(callTimeout);
callTimeout = null;
}

async function finishCall(status = "completed"){
if(activeCallId){
try{
await updateDoc(doc(db, "calls", activeCallId), {
status: status === "completed" ? "ended" : status,
duration: callSeconds,
endedAt: serverTimestamp()
});
}catch(e){}
}
cleanupCall();
}

function cleanupCall(){
stopRingtone();
clearInterval(callTimer);
callTimer = null;
stopOutgoingTimeout();
if(unsubscribeActiveCall){ unsubscribeActiveCall(); unsubscribeActiveCall = null; }
if(unsubscribeCandidates){ unsubscribeCandidates(); unsubscribeCandidates = null; }

if(localStream){
localStream.getTracks().forEach(t => t.stop());
localStream = null;
}
if(peerConnection){
try { peerConnection.close(); } catch(e){}
peerConnection = null;
}

pendingCandidates = [];
activeCallId = null;
activeCallType = null;
activeCallRole = null;
activeCallPeer = null;

if(localVideo){ localVideo.srcObject = null; localVideo.style.display = "none"; }
if(remoteVideo){ remoteVideo.srcObject = null; remoteVideo.style.display = "none"; }
if(remoteAudio){ remoteAudio.srcObject = null; remoteAudio.muted = false; }
remoteAudioMuted = false;

incomingCall.classList.remove("show");
callScreen.style.display = "none";
hideAllCallButtons();
callSeconds = 0;
}

async function toggleReaction(messageId, emoji){
if(!currentUser || !chatID) return;
try{
const ref = doc(db, "chats", chatID, "messages", messageId);
const snap = await getDoc(ref);
if(!snap.exists()) return;
const data = snap.data();
const reactions = Array.isArray(data.reactions) ? data.reactions : [];
const mine = reactions.find(r => r && r.userId === currentUser.uid && r.emoji === emoji);
if(mine){
await updateDoc(ref, { reactions: arrayRemove(mine) });
return;
}
const oldMine = reactions.find(r => r && r.userId === currentUser.uid);
if(oldMine) await updateDoc(ref, { reactions: arrayRemove(oldMine) });
await updateDoc(ref, { reactions: arrayUnion({ userId: currentUser.uid, emoji }) });
}catch(e){ console.error("Reaction:", e); }
}

function renderReactions(box, data){
if(!Array.isArray(data.reactions)) return;
const counts = {};
data.reactions.forEach(r => {
if(!r?.emoji) return;
if(!counts[r.emoji]) counts[r.emoji] = { count: 0, mine: false };
counts[r.emoji].count++;
if(r.userId === currentUser.uid) counts[r.emoji].mine = true;
});

const wrapper = document.createElement("div");
wrapper.className = "message-reactions";
reactionList.forEach(emoji => {
const info = counts[emoji];
if(!info) return;
const chip = document.createElement("button");
chip.type = "button";
chip.className = "reaction-chip" + (info.mine ? " mine" : "");
chip.textContent = emoji;
if(info.count > 1){
const count = document.createElement("span");
count.className = "reaction-count";
count.textContent = info.count;
chip.appendChild(count);
}
chip.onclick = e => { e.stopPropagation(); toggleReaction(data.id, emoji); };
wrapper.appendChild(chip);
});
if(wrapper.children.length) box.appendChild(wrapper);
}

function setupSwipeToReply(element, data){
let startX = 0;
let currentX = 0;
let isSwiping = false;

element.addEventListener("touchstart", e => {
startX = e.touches[0].clientX;
isSwiping = true;
}, { passive: true });

element.addEventListener("touchmove", e => {
if(!isSwiping) return;
currentX = e.touches[0].clientX;
let diff = currentX - startX;
if(diff > 0 && diff < 100){
element.style.transform = `translateX(${diff}px)`;
}
}, { passive: true });

element.addEventListener("touchend", () => {
if(!isSwiping) return;
isSwiping = false;
let diff = currentX - startX;
element.style.transform = "translateX(0px)";
if(diff > 60){
startReply(data);
}
});
}

function addMessageActions(element, data){
let pressTimer = null;
let longPressed = false;
element.addEventListener("pointerdown", e => {
if(e.button !== undefined && e.button !== 0) return;
longPressed = false;
pressTimer = setTimeout(() => { longPressed = true; showContextMenu(data); }, 520);
});
const clearPress = () => { if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
element.addEventListener("pointerup", clearPress);
element.addEventListener("pointercancel", clearPress);
element.addEventListener("contextmenu", e => { e.preventDefault(); clearPress(); showContextMenu(data); });

let lastTap = 0;
element.addEventListener("click", e => {
if(longPressed) return;
if(e.target.closest("button") || e.target.closest("audio") || e.target.closest("video") || e.target.closest(".message-reply")) return;
const now = Date.now();
if(now - lastTap < 320){
triggerHeartReaction(element, data.id);
}
lastTap = now;
});
}

function listenMessages(){
if(!chatID) return;
if(unsubscribeMessages) unsubscribeMessages();
const q = query(collection(db, "chats", chatID, "messages"), orderBy("createdAt", "asc"));
unsubscribeMessages = onSnapshot(q, snapshot => {
const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 140;

if(snapshot.empty && messageElements.size === 0){
messages.innerHTML = `<div class="empty">💬<br>ابدأ المحادثة الآن</div>`;
}

snapshot.docChanges().forEach(change => {
const id = change.doc.id;
const data = { ...change.doc.data(), id };

if(change.type === "removed"){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

const newElement = renderMessage(data);
const old = messageElements.get(id);
if(old){
old.replaceWith(newElement);
}else{
messages.querySelector(".empty")?.remove();
messages.appendChild(newElement);
}
messageElements.set(id, newElement);
});

if(nearBottom){
requestAnimationFrame(() => { messages.scrollTop = messages.scrollHeight; });
}
}, e => console.error("Messages:", e));
}

async function handleSendMessage(){

sendButton.disabled = true;

try{

await updateDoc(doc(db, "chats", chatID, "messages", editingMessageId), {
text, isEdited: true, editedAt: serverTimestamp()
});
editingMessageId = null;
sendButton.textContent = "➤";
messageInput.value = "";
cancelReply();
return;
}

const messageData = {
text,
senderId: currentUser.uid,
receiverId: friendUser.uid,
type: "text",
read: false,
deletedFor: [],
createdAt: serverTimestamp()
};

if(replyTarget){
messageData.replyTo = {
messageId: replyTarget.id,

};

messageInput.value = "";
cancelReply();
}catch(e){
console.error("Send:", e);
alert("تعذر إرسال الرسالة.");

async function uploadFile(file, pathPrefix = "media"){
const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
const filePath = `${pathPrefix}/${currentUser.uid}/${Date.now()}_${safeName}`;
const { error } = await supabase.storage.from(SUPABASE_BUCKET).upload(filePath, file, { upsert: false, contentType: file.type || undefined });
if(error) throw error;
const { data } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(filePath);
return data.publicUrl;
}

async function uploadMediaAndSend(file, type){
if(!file || !currentUser || !friendUser || !chatID) return;
if(file.size > 30 * 1024 * 1024){ alert("حجم الملف كبير جداً (أقصى حد 30MB)"); return; }
try{
setLoading("جارٍ رفع الملف...");
loading.style.display = "flex";
const url = await uploadFile(file, type);
const data = {
url,
senderId: currentUser.uid,
receiverId: friendUser.uid,
type,
read: false,
deletedFor: [],
fileName: file.name || "",
createdAt: serverTimestamp()
};
if(replyTarget){
data.replyTo = { messageId: replyTarget.id, senderId: replyTarget.senderId, senderName: replyTarget.senderName, text: replyTarget.text };
}
await addDoc(collection(db, "chats", chatID, "messages"), data);
cancelReply();
}catch(e){
console.error("Upload:", e);
alert("فشل رفع الملف.");
}finally{
loading.style.display = "none";
}
}
