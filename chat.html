<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat - الدردشة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
overflow:hidden;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

/* =========================
   الهيدر
========================= */

.chat-header{

height:78px;
flex-shrink:0;

display:flex;
align-items:center;
gap:12px;

padding:10px 15px;

background:rgba(5,15,12,.92);

border-bottom:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

}

.back-button{

width:45px;
height:45px;

border:none;
border-radius:14px;

background:rgba(255,255,255,.06);

color:white;

font-size:24px;

cursor:pointer;

}

.back-button:active{
transform:scale(.94);
}

.friend-avatar{

width:50px;
height:50px;

border-radius:16px;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:rgba(0,230,118,.10);

border:1px solid rgba(0,230,118,.16);

font-size:25px;

flex-shrink:0;

}

.friend-avatar img{

width:100%;
height:100%;
object-fit:cover;

}

.friend-info{

flex:1;
min-width:0;

}

.friend-name{

font-size:17px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

}

.friend-id{

margin-top:4px;

font-size:11px;

color:#00e889;

}

/* =========================
   الرسائل
========================= */

.messages{

flex:1;

overflow-y:auto;

padding:20px 15px 15px;

display:flex;
flex-direction:column;

gap:9px;

scroll-behavior:smooth;

}

.messages::-webkit-scrollbar{
width:4px;
}

.messages::-webkit-scrollbar-thumb{
background:#18372d;
border-radius:10px;
}

.empty-chat{

margin:auto;

text-align:center;

color:#71817b;

font-size:14px;

line-height:1.8;

padding:30px;

}

.empty-chat-icon{

font-size:45px;

margin-bottom:12px;

}

/* الرسالة */

.message{

display:flex;

width:100%;

}

.message.me{
justify-content:flex-start;
}

.message.friend{
justify-content:flex-end;
}

.message-bubble{

max-width:78%;

padding:11px 14px;

border-radius:18px;

font-size:15px;

line-height:1.6;

word-break:break-word;

}

.message.me .message-bubble{

background:#00e889;

color:#00150e;

border-bottom-left-radius:5px;

}

.message.friend .message-bubble{

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.07);

color:white;

border-bottom-right-radius:5px;

}

.message-time{

font-size:9px;

margin-top:4px;

opacity:.6;

text-align:left;

}

/* =========================
   الإدخال
========================= */

.input-area{

flex-shrink:0;

padding:10px 12px 15px;

background:rgba(5,15,12,.95);

border-top:1px solid rgba(255,255,255,.07);

}

.input-box{

display:flex;

align-items:center;

gap:8px;

padding:7px;

border-radius:20px;

background:rgba(255,255,255,.055);

border:1px solid rgba(255,255,255,.08);

}

#messageInput{

flex:1;

min-width:0;

border:none;
outline:none;

background:transparent;

color:white;

font-family:inherit;

font-size:15px;

padding:11px 10px;

}

#messageInput::placeholder{
color:#687872;
}

#sendButton{

width:46px;
height:46px;

border:none;

border-radius:15px;

background:#00e889;

color:#00150e;

font-size:20px;

cursor:pointer;

flex-shrink:0;

}

#sendButton:active{
transform:scale(.94);
}

#sendButton:disabled{

opacity:.5;

cursor:not-allowed;

}

/* =========================
   تحميل
========================= */

.loading{

position:fixed;

inset:0;

z-index:9999;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

gap:18px;

background:
linear-gradient(180deg,#07110f,#020504);

color:#a8bdb6;

}

.spinner{

width:35px;
height:35px;

border:4px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

/* =========================
   خطأ
========================= */

.error-screen{

display:none;

position:fixed;

inset:0;

z-index:9998;

align-items:center;
justify-content:center;

padding:25px;

text-align:center;

background:#020504;

}

.error-box{

padding:25px;

border-radius:22px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.08);

}

.error-box h2{

margin-bottom:10px;

}

.error-box p{

color:#9ba7a4;

line-height:1.7;

font-size:14px;

}

</style>

</head>

<body>


<!-- =========================
     Loading
========================= -->

<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ فتح الدردشة...
</div>

</div>


<!-- =========================
     خطأ
========================= -->

<div id="errorScreen" class="error-screen">

<div class="error-box">

<h2>⚠️ تعذر فتح الدردشة</h2>

<p id="errorText">
حدث خطأ أثناء فتح المحادثة.
</p>

</div>

</div>


<!-- =========================
     التطبيق
========================= -->

<main id="app" class="app" style="display:none;">


<!-- Header -->

<header class="chat-header">

<button
id="backButton"
class="back-button"
>
→
</button>


<div
id="friendAvatar"
class="friend-avatar"
>
👤
</div>


<div class="friend-info">

<div
id="friendName"
class="friend-name"
>
مستخدم Mecd
</div>

<div
id="friendId"
class="friend-id"
>
ID: ------
</div>

</div>

</header>


<!-- الرسائل -->

<section
id="messages"
class="messages"
>

<div
id="emptyChat"
class="empty-chat"
>

<div class="empty-chat-icon">
💬
</div>

<div>
ابدأ أول رسالة مع صديقك 👋
</div>

</div>

</section>


<!-- إدخال الرسالة -->

<div class="input-area">

<div class="input-box">

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
>

<button
id="sendButton"
>
➤
</button>

</div>

</div>


</main>


<script type="module">


/* =========================
   Firebase
========================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);


/* =========================
   العناصر
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const errorScreen =
document.getElementById("errorScreen");

const errorText =
document.getElementById("errorText");

const friendAvatar =
document.getElementById("friendAvatar");

const friendName =
document.getElementById("friendName");

const friendId =
document.getElementById("friendId");

const messages =
document.getElementById("messages");

const emptyChat =
document.getElementById("emptyChat");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const backButton =
document.getElementById("backButton");


/* =========================
   المتغيرات
========================= */

let currentUser = null;

let currentUserData = null;

let selectedFriend = null;

let unsubscribeMessages = null;


/* =========================
   قراءة بيانات الصديق
   من الرابط
========================= */

const params =
new URLSearchParams(
window.location.search
);


const friendUID =
params.get("uid") || "";


const friendNameFromURL =
params.get("name") ||
"مستخدم Mecd";


const friendChatIDFromURL =
params.get("id") ||
"";


/* =========================
   حماية النص
========================= */

function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   إظهار الخطأ
========================= */

function showError(message){

loading.style.display = "none";

app.style.display = "none";

errorText.textContent = message;

errorScreen.style.display = "flex";

}


/* =========================
   Chat ID للمحادثة
========================= */

function createChatID(uid1,uid2){

return [uid1,uid2]
.sort()
.join("_");

}


/* =========================
   تحميل بيانات المستخدم
========================= */

async function loadCurrentUser(){

const userRef =
doc(
db,
"users",
currentUser.uid
);

const snapshot =
await getDoc(userRef);

if(snapshot.exists()){

currentUserData =
snapshot.data();

}else{

currentUserData = {};

}

}


/* =========================
   تحميل الصديق
========================= */

async function loadFriend(){

if(!friendUID){

throw new Error(
"لم يتم تحديد الصديق."
);

}


/* نقرأ بيانات الصديق من Firebase */

const friendRef =
doc(
db,
"users",
friendUID
);

const snapshot =
await getDoc(friendRef);


if(!snapshot.exists()){

/*
إذا لم نتمكن من قراءة بياناته،
نستخدم البيانات الموجودة في الرابط.
*/

selectedFriend = {

uid:friendUID,

name:
friendNameFromURL,

chatID:
friendChatIDFromURL,

photo:""

};

return;

}


const data =
snapshot.data();


selectedFriend = {

uid:friendUID,

name:
data.name ||
friendNameFromURL ||
"مستخدم Mecd",

chatID:
data.chatID ||
friendChatIDFromURL ||
"",

photo:
data.photo ||
data.photoURL ||
""

};


/* الاسم */

friendName.textContent =
selectedFriend.name;


/* ID */

friendId.textContent =
"ID: " +
(
selectedFriend.chatID ||
"------"
);


/* الصورة */

if(selectedFriend.photo){

friendAvatar.innerHTML = `

<img
src="${escapeHTML(selectedFriend.photo)}"
alt="صورة الصديق"
>

`;

}else{

friendAvatar.textContent =
"👤";

}

}


/* =========================
   فتح المحادثة
========================= */

function listenToMessages(){

const chatID =
createChatID(
currentUser.uid,
selectedFriend.uid
);


const messagesRef =
collection(
db,
"chats",
chatID,
"messages"
);


const messagesQuery =
query(
messagesRef,
orderBy(
"createdAt",
"asc"
)
);


/* الاستماع المباشر */

unsubscribeMessages =
onSnapshot(

messagesQuery,

(snapshot)=>{

messages.innerHTML = "";


if(snapshot.empty){

messages.appendChild(
emptyChat
);

emptyChat.style.display =
"block";

return;

}


emptyChat.style.display =
"none";


snapshot.forEach(

(messageDoc)=>{

const data =
messageDoc.data();


const isMe =
data.senderId ===
currentUser.uid;


const messageElement =
document.createElement("div");


messageElement.className =
"message " +
(
isMe
? "me"
: "friend"
);


const bubble =
document.createElement("div");


bubble.className =
"message-bubble";


/*
استخدام textContent
حتى لا يتم تنفيذ HTML
داخل الرسائل.
*/

bubble.textContent =
data.text ||
"";


const time =
document.createElement("div");


time.className =
"message-time";


time.textContent =
formatTime(
data.createdAt
);


bubble.appendChild(
time
);

messageElement.appendChild(
bubble
);

messages.appendChild(
messageElement
);

}

);


scrollToBottom();

},

(error)=>{

console.error(
"Messages listener error:",
error
);

if(error.code ===
"permission-denied"){

showError(
"ليس لديك صلاحية قراءة هذه المحادثة. تأكد من Firestore Rules."
);

}else{

showError(
"حدث خطأ أثناء تحميل الرسائل."
);

}

}

);

}


/* =========================
   الوقت
========================= */

function formatTime(timestamp){

if(!timestamp){

return "";

}

try{

const date =
timestamp.toDate();


return date.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}


/* =========================
   النزول لآخر رسالة
========================= */

function scrollToBottom(){

setTimeout(

()=>{

messages.scrollTop =
messages.scrollHeight;

},

50

);

}


/* =========================
   إرسال رسالة
========================= */

async function sendMessage(){

const text =
messageInput.value.trim();


if(!text){

return;

}


if(!currentUser ||
!selectedFriend){

return;

}


if(text.length > 2000){

alert(
"الرسالة طويلة جدًا."
);

return;

}


sendButton.disabled =
true;


try{

const chatID =
createChatID(
currentUser.uid,
selectedFriend.uid
);


/* إنشاء مستند المحادثة */

const chatRef =
doc(
db,
"chats",
chatID
);


await setDoc(

chatRef,

{

users:[

currentUser.uid,

selectedFriend.uid

],

updatedAt:
serverTimestamp(),

lastMessage:
text

},

{

merge:true

}

);


/* إضافة الرسالة */

const messagesRef =
collection(
db,
"chats",
chatID,
"messages"
);


await addDoc(

messagesRef,

{

text:text,

senderId:
currentUser.uid,

senderName:
currentUserData?.name ||
currentUser.displayName ||
"مستخدم Mecd",

senderPhoto:
currentUserData?.photo ||
currentUser.photoURL ||
"",

createdAt:
serverTimestamp()

}

);


/* تنظيف الحقل */

messageInput.value =
"";

messageInput.focus();

scrollToBottom();


}catch(error){

console.error(
"Send message error:",
error
);

if(error.code ===
"permission-denied"){

alert(
"ليس لديك صلاحية إرسال الرسائل. تأكد من Firestore Rules."
);

}else{

alert(
"حدث خطأ أثناء إرسال الرسالة."
);

}

}finally{

sendButton.disabled =
false;

}

}


/* =========================
   زر الإرسال
========================= */

sendButton.addEventListener(

"click",

sendMessage

);


/* =========================
   Enter لإرسال الرسالة
========================= */

messageInput.addEventListener(

"keydown",

(event)=>{

if(
event.key === "Enter"
){

event.preventDefault();

sendMessage();

}

}

);


/* =========================
   الرجوع
========================= */

backButton.addEventListener(

"click",

()=>{

window.location.href =
"./friends.html";

}

);


/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.replace(
"https://mecdjhjhnh37-collab.github.io/MecdChat/"
);

return;

}


currentUser =
user;


try{

await loadCurrentUser();

await loadFriend();

loading.style.display =
"none";

app.style.display =
"flex";


listenToMessages();


messageInput.focus();


}catch(error){

console.error(
"Chat loading error:",
error
);

showError(
error.message ||
"حدث خطأ أثناء فتح الدردشة."
);

}

}

);


/* =========================
   تنظيف الاستماع
========================= */

window.addEventListener(

"beforeunload",

()=>{

if(unsubscribeMessages){

unsubscribeMessages();

}

}

);

</script>

</body>
</html>
