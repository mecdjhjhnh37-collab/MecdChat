<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);

}

button,
input{
font-family:inherit;
}

button{

}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10;
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer;
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0;
}

.avatar img,
.call-avatar img,
#remoteAvatar img,
#localAvatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
}

.user-status.online,
.user-status.typing{
color:#00e889;
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0;
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer;
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
}

.message{
max-width:78%;
padding:10px 13px;
border-radius:18px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
user-select:none;
line-height:1.5;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px;
}

.time{
display:block;
font-size:9px;
opacity:.6;
margin-top:5px;
}

.message-meta{
display:flex;
align-items:center;
gap:5px;
margin-top:5px;
}

.message-status{
font-size:12px;
font-weight:bold;
direction:ltr;
}

.message-status.read{
color:#006dff;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50;
border-top:1px solid rgba(255,255,255,.05);
}

#messageInput{
flex:1;
min-width:0;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;

}

#messageInput::placeholder{
color:#72817c;
}

#messageInput:focus{
border-color:#00e889;
}

#voiceButton,
#sendButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
flex-shrink:0;
}

#voiceButton{
background:#18231f;
color:#fff;
}

#voiceButton.recording{
background:#d83b3b;
}

#sendButton{
background:#00e889;
color:#00150e;
}

#sendButton:disabled{
opacity:.6;
cursor:not-allowed;
}

#voiceButton:disabled,
.call-buttons button:disabled,
.incoming-actions button:disabled,
.call-control:disabled{

cursor:not-allowed;
}

/* VOICE MESSAGE */

.voice-message{
min-width:220px;
padding:8px 10px;
}

.voice-message-box{

align-items:center;
gap:9px;

.voice-icon{

height:40px;
border-radius:50%;

align-items:center;

background:rgba(0,232,137,.14);
font-size:19px;

.voice-player{

.voice-player audio{

height:38px;

}

.voice-label{

.call-box{

justify-content:center;

.call-duration{

padding:5px;

}

.incoming-name{

.incoming-type{

.call-avatar{
width:52px;
height:52px;
border-radius:50%;

align-items:center;
justify-content:center;
overflow:hidden;

flex-shrink:0;

.incoming-actions{

gap:9px;

height:46px;
border:0;
border-radius:50%;

color:#fff;
cursor:pointer;
}

#rejectIncoming{
background:#d83b3b;
}

#acceptIncoming{
background:#00e889;
color:#00150e;

/* CALL SCREEN */

#callScreen{
position:fixed;
inset:0;
background:#020504;
z-index:10000;

.call-top{

padding:15px;

justify-content:center;

.hidden{

</style>

/* =========================

const $=id=>document.getElementById(id);

/* =========================

let currentUser=null;

/* =========================
   HELPERS
========================= */

function createChatID(a,b){
return [a,b].sort().join("_");
}

function escapeHtml(value){
return String(value??"")
.replace(/[&<>'"]/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));
}

function formatTime(timestamp){

if(!timestamp?.toDate)return "";

try{

return timestamp.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{
return "";
}

}

function formatDuration(seconds){

seconds=Math.max(0,Math.floor(Number(seconds||0)));

const m=Math.floor(seconds/60);
const s=seconds%60;

return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");

}

function setUserAvatar(element,user){

if(!element)return;

if(user?.photo){

element.innerHTML="";

const img=document.createElement("img");
img.src=user.photo;
img.alt="";
img.referrerPolicy="no-referrer";

img.onerror=()=>{
element.innerHTML="👤";
};

element.appendChild(img);

}else{

element.innerHTML="👤";

}

}

function showApp(){

loading.style.display="none";
app.style.display="flex";

}

function isTerminalStatus(status){

return [
"cancelled",
"rejected",
"missed",
"ended"
].includes(status);

}

function stopAllCallListeners(){

if(unsubscribeActiveCall){
unsubscribeActiveCall();
unsubscribeActiveCall=null;
}

if(unsubscribeCandidates){
unsubscribeCandidates();
unsubscribeCandidates=null;
}

}

function stopCallMedia(){

if(localStream){

localStream.getTracks().forEach(track=>{
try{
track.stop();
}catch{}
});

localStream=null;

}

if(peerConnection){

try{
peerConnection.ontrack=null;
peerConnection.onicecandidate=null;
peerConnection.onconnectionstatechange=null;
peerConnection.close();
}catch{}

peerConnection=null;

}

try{
remoteAudio.pause();
}catch{}

remoteAudio.srcObject=null;
remoteVideo.srcObject=null;
localVideo.srcObject=null;

}


/* =========================
   PRESENCE
========================= */

async function updateMyPresence(online=true){

if(!currentUser)return;

try{

await setDoc(
doc(db,"users",currentUser.uid),
{
online,
lastSeen:serverTimestamp()
},
{merge:true}
);

}catch(e){

console.error("Presence:",e);

}

}

function startPresence(){

updateMyPresence(true);

clearInterval(presenceInterval);

presenceInterval=setInterval(()=>{

if(document.visibilityState==="visible"){
updateMyPresence(true);
}

},10000);

}

function stopPresence(){

clearInterval(presenceInterval);
presenceInterval=null;

if(currentUser){
updateMyPresence(false);
}

}


/* =========================
   LOAD FRIEND
========================= */

async function loadFriend(){

const friendId=
new URLSearchParams(location.search).get("friend");

if(!friendId){
throw new Error("لا يوجد صديق في الرابط");
}

if(friendId===currentUser.uid){
throw new Error("لا يمكنك فتح محادثة مع نفسك");
}

const snap=
await getDoc(doc(db,"users",friendId));

if(!snap.exists()){
throw new Error("المستخدم غير موجود");
}

const data=snap.data();

friendUser={
uid:friendId,
name:data.name||"مستخدم Mecd",
photo:data.photo||data.photoURL||""
};

friendName.textContent=friendUser.name;

setUserAvatar(friendAvatar,friendUser);

chatID=createChatID(
currentUser.uid,
friendUser.uid
);

await setDoc(
doc(db,"chats",chatID),
{
members:[currentUser.uid,friendUser.uid],
createdAt:serverTimestamp()
},
{merge:true}
);

listenFriendStatus();
listenTyping();

}


/* =========================
   FRIEND STATUS
========================= */

function renderFriendStatus(){

if(friendStatus.classList.contains("typing"))
return;

friendStatus.classList.remove("online");

if(friendOnline){

friendStatus.textContent="● متصل";
friendStatus.classList.add("online");

}else{

friendStatus.textContent="● غير متصل";

}

}

function listenFriendStatus(){

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

unsubscribeFriendStatus=
onSnapshot(

/* =========================
   RENDER MESSAGES
========================= */

const messageElements=new Map();

function renderMessages(snapshot){

const nearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<120;

snapshot.docChanges().forEach(change=>{

const id=change.doc.id;
const data=change.doc.data();

if(change.type==="removed"){

messageElements.get(id)?.remove();
messageElements.delete(id);

return;

}

if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(currentUser.uid)
){

messageElements.get(id)?.remove();
messageElements.delete(id);

return;

}

if(data.senderId!==currentUser.uid){
markRead(id,data);
}

const box=document.createElement("div");

box.className=
"message "+
(
data.senderId===currentUser.uid
?"mine"
:"other"
);

if(data.type==="call"){

createCallMessage(box,data);

}else if(data.type==="voice"){

createVoiceMessage(box,data);

}else{

box.appendChild(
document.createTextNode(data.text||"")
);

}

const meta=document.createElement("div");
meta.className="message-meta";

const time=document.createElement("span");
time.className="time";
time.textContent=formatTime(data.createdAt);

meta.appendChild(time);

const status=createStatus(data);

if(status)
meta.appendChild(status);

box.appendChild(meta);

if(data.type!=="call"){

addMessageActions(
box,
id,
data.senderId===currentUser.uid
);

}

const old=messageElements.get(id);

if(old){

old.replaceWith(box);

}else{

messages.appendChild(box);

}

messageElements.set(id,box);

});

const all=messages.querySelectorAll(".message");
const empty=messages.querySelector(".empty");

if(all.length){

empty?.remove();

}else if(!empty){

const e=document.createElement("div");

e.className="empty";
e.innerHTML="💬<br>ابدأ المحادثة الآن";

messages.appendChild(e);

}

if(nearBottom){

requestAnimationFrame(()=>{
messages.scrollTop=messages.scrollHeight;
});

}

}

/* =========================
   ICE
========================= */

async function addCandidate(candidate){

if(
!peerConnection||
!candidate
)
return;

if(peerConnection.remoteDescription){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.error("ICE:",e);

}

}else{

pendingIceCandidates.push(candidate);

}

}

async function flushIce(){

if(
!peerConnection||
!peerConnection.remoteDescription
)
return;

const list=pendingIceCandidates.splice(0);

for(const candidate of list){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.error("ICE queue:",e);

}

}

}


/* =========================
   PEER
========================= */

function createPeer(){

const pc=new RTCPeerConnection(rtcConfig);

pc.onicecandidate=async e=>{

if(
!e.candidate||
!activeCallId||
!currentUser
)
return;

try{

await addDoc(
collection(
db,
"calls",
activeCallId,
"candidates"
),
{
senderId:currentUser.uid,
candidate:e.candidate.toJSON(),
createdAt:serverTimestamp()
}
);

}catch(error){

console.error("ICE save:",error);

}

};

pc.ontrack=e=>{

if(!e.streams?.[0])
return;

const stream=e.streams[0];

if(stream.getVideoTracks().length){

remoteVideo.srcObject=stream;
remoteVideo.style.display="block";
remoteAvatar.style.display="none";
videoArea.style.display="block";
audioCallView.style.display="none";

remoteVideo.muted=true;

remoteVideo.play().catch(()=>{});

}

if(stream.getAudioTracks().length){

remoteAudio.srcObject=stream;
remoteAudio.muted=remoteAudioMuted;

playRemoteAudio();

}

};

pc.onconnectionstatechange=()=>{

const state=pc.connectionState;

if(state==="connected"){

stopOutgoingTimeout();

callState.textContent="متصل";

showConnectedButtons();
startCallTimer();
playRemoteAudio();

}

if(state==="connecting"){

callState.textContent="جارٍ الاتصال...";

}

if(state==="disconnected"){

callState.textContent="انقطع الاتصال";

}

if(state==="failed"){

callState.textContent="تعذر الاتصال";

}

if(state==="closed"){

callState.textContent="انتهت المكالمة";

}

};

return pc;

}

/* =========================
   START CALL
========================= */

async function startCall(type){

if(activeCallId)
return;

if(
!currentUser||
!friendUser
){

alert("تعذر بدء المكالمة");
return;

}

activeCallId=crypto.randomUUID();

activeCallType=
type==="video"
?"video"
:"audio";

activeCallRole="caller";

activeCallPeer={
uid:friendUser.uid,
name:friendUser.name,
photo:friendUser.photo
};

callSeconds=0;
callMessageSaved=false;
pendingIceCandidates=[];

upgradeVersion=0;
lastHandledUpgradeVersion=0;
lastHandledUpgradeAnswerVersion=0;

callButton.disabled=true;
videoButton.disabled=true;

showCallScreen();
showOutgoingButtons();

callState.textContent="جارٍ الاتصال...";

try{

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error("getUserMedia غير متاح");

}

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:activeCallType==="video"
});

if(activeCallType==="video"){

localVideo.srcObject=localStream;
localVideo.style.display="block";
localAvatar.style.display="none";

}

peerConnection=createPeer();

localStream.getTracks().forEach(track=>{
peerConnection.addTrack(track,localStream);
});

const offer=
await peerConnection.createOffer();

await peerConnection.setLocalDescription(offer);

await setDoc(
doc(db,"calls",activeCallId),
{
callerId:currentUser.uid,
receiverId:friendUser.uid,
callType:activeCallType,
status:"ringing",
offer:{
type:offer.type,
sdp:offer.sdp
},
createdAt:serverTimestamp(),
upgradeVersion:0,
upgradeAnswerVersion:0
}
);

listenCallerCall();
startOutgoingTimeout();

}catch(e){

console.error("Start call:",e);

alert(
"تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await cancelOutgoingCall(false);

}

}


/* =========================
   CALLER WATCH
========================= */

function listenCallerCall(){

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall=
onSnapshot(
doc(db,"calls",activeCallId),
async snap=>{

if(!snap.exists()){

cleanupCall();
return;

}

const data=snap.data();

if(isTerminalStatus(data.status)){

callSeconds=Number(data.duration||0);
cleanupCall();
return;

}

if(
data.answer &&
peerConnection &&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(data.answer)
);

await flushIce();
await playRemoteAudio();

}catch(e){

console.error("Answer:",e);

}

}

if(data.status==="ringing"){

callState.textContent=
data.receivedAt
?"يرن"
:"جارٍ الاتصال...";

}

if(data.status==="connected"){

stopOutgoingTimeout();

callState.textContent="متصل";

showConnectedButtons();
startCallTimer();
playRemoteAudio();

}

if(
data.callType==="video" &&
activeCallType!=="video"
){

activeCallType="video";
setupCallVisuals();

}

if(
data.upgradeOffer &&
Number(data.upgradeVersion||0)>
lastHandledUpgradeVersion
){

await handleUpgradeOffer(data);

}

if(
data.upgradeAnswer &&
peerConnection &&
Number(data.upgradeAnswerVersion||0)>
lastHandledUpgradeAnswerVersion
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(data.upgradeAnswer)
);

lastHandledUpgradeAnswerVersion=
Number(data.upgradeAnswerVersion);

await flushIce();

activeCallType="video";

setupCallVisuals();

callState.textContent="متصل • فيديو";

showConnectedButtons();

}catch(e){

console.error("Upgrade answer:",e);

}

}

},
e=>console.error("Caller listener:",e)
);

listenCallCandidates();

}


/* =========================
   INCOMING CALL LISTENER
========================= */

function listenIncomingCalls(){

if(!currentUser)
return;

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

const q=query(
collection(db,"calls"),
where("receiverId","==",currentUser.uid)
);

unsubscribeIncomingCalls=
onSnapshot(
q,
async snapshot=>{

for(const change of snapshot.docChanges()){

if(change.type==="removed")
continue;

const id=change.doc.id;
const data=change.doc.data();

if(
data.receiverId!==currentUser.uid||
!data.offer
)
continue;

if(
activeCallId===id &&
isTerminalStatus(data.status)
){

cleanupCall();
continue;

}

if(data.status!=="ringing")
continue;

if(activeCallId)
continue;

if(handledIncomingCalls.has(id))
continue;

const created=data.createdAt?.toMillis?.()||0;

if(
created &&
Date.now()-created>30000
){

try{

await updateDoc(
doc(db,"calls",id),
{
status:"missed",
duration:0,
endedAt:serverTimestamp()
}
);

}catch(e){

console.error("Expired incoming:",e);

}

continue;

}

handledIncomingCalls.add(id);

const callerSnap=
await getDoc(
doc(db,"users",data.callerId)
);

const callerData=
callerSnap.exists()
?callerSnap.data()
:{};

activeCallId=id;

activeCallType=
data.callType==="video"
?"video"
:"audio";

activeCallRole="receiver";

activeCallPeer={
uid:data.callerId,
name:callerData.name||"مستخدم Mecd",
photo:
callerData.photo||
callerData.photoURL||
""
};

callSeconds=0;
callMessageSaved=false;
pendingIceCandidates=[];

upgradeVersion=
Number(data.upgradeVersion||0);

lastHandledUpgradeVersion=0;
lastHandledUpgradeAnswerVersion=0;

showIncoming();

callState.textContent=
activeCallType==="video"
?"📹 مكالمة فيديو واردة"
:"📞 مكالمة صوتية واردة";

listenReceiverCallStatus();

}

},
e=>console.error("Incoming calls:",e)
);

}


/* =========================
   RECEIVER STATUS
========================= */

function listenReceiverCallStatus(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall=
onSnapshot(
doc(db,"calls",activeCallId),
async snap=>{

if(!snap.exists()){

cleanupCall();
return;

}

const data=snap.data();

if(isTerminalStatus(data.status)){

cleanupCall();
return;

}

if(
data.callType==="video" &&
activeCallType!=="video"
){

activeCallType="video";
setupCallVisuals();

}

if(
data.upgradeOffer &&
Number(data.upgradeVersion||0)>
lastHandledUpgradeVersion
){

await handleUpgradeOffer(data);

}

},
e=>console.error("Receiver call status:",e)
);

listenCallCandidates();

}


/* =========================
   ACCEPT

async function acceptIncomingCall(){

acceptingCall||

!activeCallPeer
)

acceptingCall=true;

){

}

incomingCall.style.display="none";

remoteAudio.muted=false;

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

throw new Error("getUserMedia غير متاح");

}

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:activeCallType==="video"
});

if(activeCallType==="video"){

localVideo.srcObject=localStream;
localVideo.style.display="block";
localAvatar.style.display="none";

}

peerConnection=createPeer();

localStream.getTracks().forEach(track=>{
peerConnection.addTrack(track,localStream);
});

await peerConnection.setRemoteDescription(
new RTCSessionDescription(data.offer)
);

await flushIce();

const answer=
await peerConnection.createAnswer();

await peerConnection.setLocalDescription(answer);

const accepted=
await runTransaction(
db,
async transaction=>{

const ref=doc(db,"calls",callId);

const current=await transaction.get(ref);

if(!current.exists())
return false;

const currentData=current.data();

if(currentData.status!=="ringing")
return false;

transaction.update(
ref,
{
answer:{
type:answer.type,
sdp:answer.sdp
},
status:"connected",
callType:activeCallType,
receivedAt:serverTimestamp()
}
);

return true;

}
);

if(!accepted){

cleanupCall();
return;

}

showConnectedButtons();
startCallTimer();
playRemoteAudio();

}catch(e){

console.error("Accept:",e);

alert(
"تعذر قبول المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

try{

if(activeCallId){

const snap=
await getDoc(doc(db,"calls",activeCallId));

if(
snap.exists() &&
snap.data().status==="ringing"
){

await updateDoc(
doc(db,"calls",activeCallId),
{
status:"rejected",
duration:0,
endedAt:serverTimestamp()
}
);

await saveCallMessage("rejected",0);

}

}

}catch(err){

console.error("Accept cleanup:",err);

}

cleanupCall();

}finally{

acceptingCall=false;

}

}


/* =========================
   CANDIDATES
========================= */

function listenCallCandidates(){

if(unsubscribeCandidates)
unsubscribeCandidates();

if(!activeCallId)
return;

const callId=activeCallId;

unsubscribeCandidates=
onSnapshot(
collection(db,"calls",callId,"candidates"),
snapshot=>{

if(activeCallId!==callId)
return;

snapshot.docChanges().forEach(change=>{

if(change.type!=="added")
return;

const data=change.doc.data();

if(data.senderId===currentUser.uid)
return;

addCandidate(data.candidate);

});

},
e=>console.error("Candidates:",e)
);

}


/* =========================
   REJECT
========================= */

async function rejectIncomingCall(){

const id=activeCallId;

if(!id){

cleanupCall();
return;

}

rejectIncoming.disabled=true;

try{

const snap=
await getDoc(doc(db,"calls",id));

if(!snap.exists()){

cleanupCall();
return;

}

if(snap.data().status==="ringing"){

await updateDoc(
doc(db,"calls",id),
{
status:"rejected",
duration:0,
endedAt:serverTimestamp()
}
);

await saveCallMessage("rejected",0);

}

}catch(e){

console.error("Reject:",e);

}finally{

rejectIncoming.disabled=false;
cleanupCall();

}

}


/* =========================
   CANCEL
========================= */

async function cancelOutgoingCall(saveMessage=true){

const id=activeCallId;

if(!id){

cleanupCall();
return;

}

try{

const snap=
await getDoc(doc(db,"calls",id));

if(snap.exists()){

const data=snap.data();

if(data.status==="ringing"){

await updateDoc(
doc(db,"calls",id),
{
status:"cancelled",
duration:0,
endedAt:serverTimestamp()
}
);

if(saveMessage){

await saveCallMessage("cancelled",0);

}

}

}

}catch(e){

console.error("Cancel:",e);

}

cleanupCall();

}


/* =========================
   AUDIO -> VIDEO
========================= */

async function switchToVideo(){

if(
switchingVideo||
!activeCallId||
!peerConnection||
!localStream||
activeCallType!=="audio"
)
return;

switchingVideo=true;
switchVideoButton.disabled=true;

try{

callState.textContent="جارٍ تشغيل الفيديو...";

const camera=
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
ideal:"user"
}
}
});

const track=camera.getVideoTracks()[0];

if(!track){

camera.getTracks().forEach(x=>x.stop());

throw new Error("لا توجد كاميرا");

}

const sender=
peerConnection
.getSenders()
.find(s=>s.track?.kind==="video");

if(sender){

await sender.replaceTrack(track);

}else{

peerConnection.addTrack(track,localStream);

}

localStream.addTrack(track);

activeCallType="video";

localVideo.srcObject=localStream;
localVideo.style.display="block";
localAvatar.style.display="none";

setupCallVisuals();

const version=Date.now();

upgradeVersion=version;
lastHandledUpgradeAnswerVersion=0;

const offer=
await peerConnection.createOffer();

await peerConnection.setLocalDescription(offer);

await updateDoc(
doc(db,"calls",activeCallId),
{
callType:"video",
upgradeOffer:{
type:offer.type,
sdp:offer.sdp
},
upgradeVersion:version,
upgradeBy:currentUser.uid
}
);

callState.textContent=
"جارٍ تحويل المكالمة إلى فيديو...";

}catch(e){

console.error("Switch video:",e);

alert("تعذر تشغيل الكاميرا");

}

finally{

switchVideoButton.disabled=false;
switchingVideo=false;

}

}


/* =========================
   HANDLE UPGRADE
========================= */

async function handleUpgradeOffer(data){

if(
!peerConnection||
!activeCallId||
!data.upgradeOffer
)
return;

const version=
Number(data.upgradeVersion||0);

if(version<=lastHandledUpgradeVersion)
return;

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(data.upgradeOffer)
);

lastHandledUpgradeVersion=version;

if(!localStream){

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:true
});

localStream.getTracks().forEach(track=>{
peerConnection.addTrack(track,localStream);
});

}else if(!localStream.getVideoTracks().length){

const camera=
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
ideal:"user"
}
}
});

const track=camera.getVideoTracks()[0];

if(!track)
throw new Error("لا توجد كاميرا");

const sender=
peerConnection
.getSenders()
.find(s=>s.track?.kind==="video");

if(sender){

await sender.replaceTrack(track);

}else{

peerConnection.addTrack(track,localStream);

}

localStream.addTrack(track);

}

activeCallType="video";

localVideo.srcObject=localStream;
localVideo.style.display="block";
localAvatar.style.display="none";

setupCallVisuals();

const answer=
await peerConnection.createAnswer();

await peerConnection.setLocalDescription(answer);

await updateDoc(
doc(db,"calls",activeCallId),
{
callType:"video",
upgradeAnswer:{
type:answer.type,
sdp:answer.sdp
},
upgradeAnswerVersion:version,
upgradeBy:currentUser.uid
}
);

callState.textContent="متصل • فيديو";

showConnectedButtons();

}catch(e){

console.error("Upgrade:",e);

callState.textContent="تعذر تشغيل الفيديو";

}

}


/* =========================
   SAVE CALL MESSAGE
========================= */

async function saveCallMessage(status,duration){

if(
!activeCallId||
!activeCallPeer||
callMessageSaved
)
return;

callMessageSaved=true;

const callerId=
activeCallRole==="caller"
?currentUser.uid
:activeCallPeer.uid;

const receiverId=
activeCallRole==="caller"
?activeCallPeer.uid
:currentUser.uid;

const targetChat=
createChatID(callerId,receiverId);

try{

await setDoc(
doc(
db,
"chats",
targetChat,
"messages",
"call_"+activeCallId
),
{
type:"call",
callId:activeCallId,
callType:activeCallType||"audio",
callerId,
receiverId,
callStatus:status,
duration:Number(duration||0),
senderId:callerId,
read:false,
createdAt:serverTimestamp()
},
{merge:true}
);

}catch(e){

callMessageSaved=false;

console.error("Call message:",e);

}

}


/* =========================
   FINISH
========================= */

async function finishCall(status=null){

if(endingCall)
return;

endingCall=true;

const id=activeCallId;

if(!id){

endingCall=false;
cleanupCall();
return;

}

stopOutgoingTimeout();

const duration=callSeconds;

const finalStatus=
status||
(
duration>0
?"completed"
:"missed"
);

try{

const snap=
await getDoc(doc(db,"calls",id));

if(snap.exists()){

const data=snap.data();

if(!isTerminalStatus(data.status)){

await updateDoc(
doc(db,"calls",id),
{
status:
finalStatus==="completed"
?"ended"
:finalStatus,
duration,
callType:activeCallType||"audio",
endedAt:serverTimestamp()
}
);

}

}

}catch(e){

console.error("Finish:",e);

}

await saveCallMessage(finalStatus,duration);

cleanupCall();

endingCall=false;

}


/* =========================
   CLEANUP
========================= */

function cleanupCall(){

stopCallTimer();
stopOutgoingTimeout();

stopAllCallListeners();
stopCallMedia();

pendingIceCandidates=[];

incomingCall.style.display="none";
callScreen.style.display="none";

audioCallView.style.display="flex";
videoArea.style.display="none";

remoteVideo.style.display="none";
remoteAvatar.style.display="flex";

localVideo.style.display="none";
localAvatar.style.display="none";

hideAllCallButtons();

activeCallId=null;
activeCallType=null;
activeCallRole=null;
activeCallPeer=null;

callSeconds=0;
callMessageSaved=false;

upgradeVersion=0;
lastHandledUpgradeVersion=0;
lastHandledUpgradeAnswerVersion=0;

remoteAudioMuted=false;
cameraFacing="user";

muteButton.textContent="🎤";
speakerButton.textContent="🔊";
switchVideoButton.textContent="📹";

muteButton.classList.remove("active");
speakerButton.classList.remove("active");
switchVideoButton.disabled=false;

acceptIncoming.disabled=false;
rejectIncoming.disabled=false;

callButton.disabled=false;
videoButton.disabled=false;

}


/* =========================
   MUTE
========================= */

muteButton.onclick=()=>{

if(!localStream)
return;

const track=
localStream.getAudioTracks()[0];

if(!track)
return;

track.enabled=!track.enabled;

muteButton.textContent=
track.enabled
?"🎤"
:"🔇";

muteButton.classList.toggle(
"active",
!track.enabled
);

};


/* =========================
   SPEAKER
========================= */

speakerButton.onclick=async()=>{

remoteAudioMuted=!remoteAudioMuted;

remoteAudio.muted=remoteAudioMuted;

speakerButton.textContent=
remoteAudioMuted
?"🔇"
:"🔊";

speakerButton.classList.toggle(
"active",
remoteAudioMuted
);

if(!remoteAudioMuted){

await playRemoteAudio();

}

};


/* =========================
   FLIP CAMERA
========================= */

flipCameraButton.onclick=async()=>{

if(
!localStream||
activeCallType!=="video"
)
return;

try{

const oldTrack=
localStream.getVideoTracks()[0];

if(!oldTrack)
return;

cameraFacing=
cameraFacing==="user"
?"environment"
:"user";

const stream=
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:{
ideal:cameraFacing
}
}
});

const newTrack=stream.getVideoTracks()[0];

if(!newTrack)
throw new Error("لا توجد كاميرا");

const sender=
peerConnection?.getSenders()
.find(s=>s.track?.kind==="video");

if(sender){

await sender.replaceTrack(newTrack);

}

oldTrack.stop();

localStream.removeTrack(oldTrack);
localStream.addTrack(newTrack);

localVideo.srcObject=localStream;

}catch(e){

console.error("Flip:",e);

cameraFacing=
cameraFacing==="user"
?"environment"
:"user";

}

};


/* =========================
   BUTTONS
========================= */

callButton.onclick=()=>{

if(!activeCallId)
startCall("audio");

};

videoButton.onclick=()=>{

if(!activeCallId)
startCall("video");

};

switchVideoButton.onclick=switchToVideo;

acceptIncoming.onclick=async()=>{

if(acceptingCall)
return;

acceptIncoming.disabled=true;

await acceptIncomingCall();

if(activeCallId)
acceptIncoming.disabled=false;

};

rejectIncoming.onclick=rejectIncomingCall;
acceptCallButton.onclick=acceptIncomingCall;
rejectCallButton.onclick=rejectIncomingCall;

endCallButton.onclick=async()=>{

if(!activeCallId)
return;

if(activeCallRole==="caller"){

const snap=
await getDoc(
doc(db,"calls",activeCallId)
).catch(()=>null);

if(
snap?.exists() &&
snap.data().status==="ringing"
){

await cancelOutgoingCall();
return;

}

}

await finishCall();

};


/* =========================
   BACK
========================= */

backButton.onclick=async()=>{

await updateMyActivity("none");

if(activeCallId){

if(activeCallRole==="caller"){

await cancelOutgoingCall();

}else{

await finishCall();

}

}

if(unsubscribeMessages){

unsubscribeMessages();
unsubscribeMessages=null;

}

if(unsubscribeFriendStatus){

unsubscribeFriendStatus();
unsubscribeFriendStatus=null;

}

if(unsubscribeIncomingCalls){

unsubscribeIncomingCalls();
unsubscribeIncomingCalls=null;

}

if(unsubscribeTyping){

unsubscribeTyping();
unsubscribeTyping=null;

}

stopPresence();

history.back();

};


/* =========================
   PAGE / VISIBILITY
========================= */

document.addEventListener(
"visibilitychange",
()=>{

if(!currentUser)
return;

if(document.visibilityState==="visible"){

updateMyPresence(true);

if(activeCallId){
playRemoteAudio();
}

}else if(!activeCallId){

updateMyPresence(false);
updateMyActivity("none");

}

});

window.addEventListener(
"pagehide",
()=>{

if(!currentUser)
return;

updateMyPresence(false);

});


/* =========================
   BEFORE UNLOAD
========================= */

window.addEventListener(
"beforeunload",
()=>{

if(currentUser&&!activeCallId){

updateMyPresence(false);

}

});


/* =========================
   INIT
========================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

loading.textContent="يجب تسجيل الدخول أولاً";
return;

}

currentUser=user;

try{

startPresence();

await loadFriend();

listenMessages();

listenIncomingCalls();

await connectVoiceJS();

showApp();

}catch(e){

console.error("Init:",e);

loading.textContent=
e.message||
"حدث خطأ";

}

});

console.log("🔥 Mecd Chat - Calls FIXED");

</script>
