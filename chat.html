<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<meta name="mobile-web-app-capable" content="yes">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35 0%,transparent 42%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
overflow:hidden;
}

button,
input{
font-family:inherit;
}

button{
-webkit-user-select:none;
user-select:none;
}

.app{
width:100%;
height:100dvh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:rgba(2,5,4,.18);
overflow:hidden;
}

/* ================= HEADER ================= */

header{
height:72px;
min-height:72px;
display:flex;
align-items:center;
gap:10px;
padding:9px 12px;
background:rgba(5,8,7,.96);
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:100;
box-shadow:0 2px 15px rgba(0,0,0,.18);
}

.back{
width:43px;
height:43px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:23px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.15s;
flex-shrink:0;
}

.back:active{
transform:scale(.92);
background:#20312b;
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:23px;
flex-shrink:0;
border:1px solid rgba(255,255,255,.08);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
display:block;
}

.user-info{
flex:1;
min-width:0;
text-align:right;
}

.user-name{
font-size:16px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
line-height:1.3;
}

.user-status{
font-size:11px;
color:#777;
margin-top:3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
transition:.2s;
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889;
}

.call-buttons{
display:flex;
gap:6px;
flex-shrink:0;
}

.call-buttons button{
width:40px;
height:40px;
border:0;
border-radius:13px;
background:#18231f;
color:#fff;
font-size:17px;
cursor:pointer;
transition:.15s;
}

.call-buttons button:active{
transform:scale(.92);
}

/* ================= PINNED ================= */

.pinned-banner{
background:#0b1613;
border-bottom:1px solid rgba(0,232,137,.15);
padding:7px 13px;
display:none;
align-items:center;
justify-content:space-between;
gap:10px;
font-size:11px;
z-index:80;
min-height:38px;
}

.pinned-banner.show{
display:flex;
}

.pinned-banner-content{
flex:1;
display:flex;
align-items:center;
gap:7px;
cursor:pointer;
min-width:0;
}

.pinned-banner-text{
color:#00e889;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.pinned-banner-close{
background:none;
border:0;
color:#aaa;
font-size:13px;
cursor:pointer;
padding:5px;
}

/* ================= MESSAGES ================= */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
padding:18px 12px 145px;
display:flex;
flex-direction:column;
gap:13px;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
}

.messages::-webkit-scrollbar{
width:4px;
}

.messages::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.12);
border-radius:10px;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
font-size:14px;
padding:20px;
}

/* ================= MESSAGE ================= */

.message{
max-width:78%;
padding:9px 12px 25px;
border-radius:17px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.55;
margin-bottom:4px;
transition:transform .12s ease-out,background-color .3s ease;
user-select:none;
-webkit-user-select:none;
}

.message.mine{
align-self:flex-start;
background:#65b86b;
color:#071108;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#5b5e67;
color:#fff;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px;
}

.message.highlight{
background:#00e889!important;
color:#000!important;
box-shadow:0 0 0 2px rgba(0,232,137,.35);
}

.message-text{
white-space:pre-wrap;
}

/* ================= TIME ================= */

.time{
display:inline-block;
font-size:9px;
opacity:.7;
margin-top:4px;
direction:ltr;
}

.message-meta{
display:inline-flex;
align-items:center;
gap:4px;
position:absolute;
bottom:5px;
left:10px;
}

.message.other .message-meta{
left:auto;
right:10px;
}

.message-status{
font-size:10px;
font-weight:bold;
direction:ltr;
}

.message-status.read{
color:#1684ff;
}

/* ================= MEDIA ================= */

.message.image-message,
.message.video-message{
padding:7px 7px 27px!important;
width:max-content!important;
max-width:82%!important;
background:#18231f!important;
border:1px solid rgba(255,255,255,.08);
}

.message.mine.image-message,
.message.mine.video-message{
background:#4d9f58!important;
}

.message-image,
.message-video{
display:block;
width:100%;
max-width:270px;
max-height:300px;
border-radius:12px;
object-fit:cover;
cursor:pointer;
}

.message-video{
background:#000;
}

/* ================= REPLY ================= */

.message-reply{
display:flex;
align-items:stretch;
gap:6px;
margin-bottom:6px;
padding:5px 7px;
border-radius:8px;
background:rgba(0,0,0,.16);
border-right:3px solid #00e889;
font-size:10px;
cursor:pointer;
min-width:0;
}

.message.other .message-reply{
background:rgba(255,255,255,.07);
}

.reply-content{
min-width:0;
overflow:hidden;
}

.reply-name{
font-weight:bold;
font-size:10px;
color:#00e889;
margin-bottom:2px;
}

.message.mine .reply-name{
color:#063c24;
}

.reply-text{
opacity:.82;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* ================= REACTIONS ================= */

.message-reactions{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:3px;
position:absolute;
bottom:-11px;
right:9px;
z-index:5;
}

.message.mine .message-reactions{
right:auto;
left:9px;
}

.reaction-chip{
border:1px solid rgba(255,255,255,.12);
background:#0b1613;
border-radius:12px;
padding:2px 5px;
font-size:11px;
cursor:pointer;
display:flex;
align-items:center;
gap:2px;
color:#fff;
min-height:21px;
}

.reaction-chip.mine{
border-color:rgba(0,232,137,.55);
background:rgba(0,232,137,.25);
}

.reaction-count{
font-size:9px;
opacity:.9;
}

.heart-pop{
position:absolute;
bottom:8px;
right:15px;
transform:scale(0);
font-size:22px;
animation:popEffect .4s ease forwards;
pointer-events:none;
z-index:30;
background:#0b1512;
border-radius:50%;
padding:2px 4px;
}

.message.mine .heart-pop{
right:auto;
left:15px;
}

@keyframes popEffect{
0%{
transform:scale(0);
opacity:0;
}
50%{
transform:scale(1.3);
opacity:1;
}
100%{
transform:scale(1);
opacity:1;
}
}

/* ================= BOTTOM SHEET ================= */

.bottom-sheet-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.66);
z-index:2000;
display:flex;
align-items:flex-end;
animation:fadeIn .18s ease;
}

@keyframes fadeIn{
from{opacity:0}
to{opacity:1}
}

.bottom-sheet{
width:100%;
max-width:650px;
margin:0 auto;
background:#111b18;
border-top-left-radius:24px;
border-top-right-radius:24px;
padding:15px 16px 28px;
box-shadow:0 -10px 40px rgba(0,0,0,.8);
animation:slideUp .23s ease;
display:flex;
flex-direction:column;
gap:14px;
border-top:1px solid rgba(0,232,137,.2);
}

@keyframes slideUp{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

.sheet-reactions-bar{
display:flex;
justify-content:space-around;
background:#182521;
padding:9px 10px;
border-radius:30px;
font-size:23px;
border:1px solid rgba(255,255,255,.06);
}

.sheet-reaction-btn{
background:none;
border:none;
cursor:pointer;
font-size:23px;
transition:transform .15s;
padding:4px;
}

.sheet-reaction-btn:active{
transform:scale(1.3);
}

.sheet-actions-list{
display:flex;
flex-direction:column;
gap:6px;
}

.sheet-action-item{
width:100%;
padding:12px 15px;
background:#182521;
border:0;
border-radius:12px;
color:#fff;
font-size:14px;
font-weight:bold;
text-align:right;
display:flex;
align-items:center;
gap:11px;
cursor:pointer;
min-height:46px;
}

.sheet-action-item:active{
background:#20312b;
}

/* ================= ATTACH MENU ================= */

#attachMenu{
position:fixed;
bottom:78px;
right:max(10px,calc((100% - 650px)/2 + 10px));
width:180px;
padding:7px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:17px;
box-shadow:0 10px 35px rgba(0,0,0,.55);
display:none;
z-index:1500;
}

#attachMenu.show{
display:block;
}

.attach-option{
width:100%;
height:44px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
font-size:13px;
font-weight:bold;
cursor:pointer;
margin-bottom:5px;
}

.attach-option:last-child{
margin-bottom:0;
}

.attach-option:active{
background:#20312b;
}

/* ================= REPLY COMPOSE ================= */

.reply-compose{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:6px 10px;
background:#07100d;
border-top:1px solid rgba(0,232,137,.14);
z-index:120;
display:none;
align-items:center;
gap:8px;
}

.reply-compose.show{
display:flex;
}

.reply-compose-content{
flex:1;
min-width:0;
padding:6px 9px;
background:#111916;
border-radius:10px;
border-right:3px solid #00e889;
overflow:hidden;
}

.reply-compose-name{
font-size:10px;
font-weight:bold;
color:#00e889;
margin-bottom:2px;
}

.reply-compose-text{
font-size:10px;
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.reply-cancel{
width:32px;
height:32px;
border:0;
border-radius:10px;
background:#18231f;
color:#fff;
cursor:pointer;
}

/* ================= INPUT ================= */

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:8px 9px calc(8px + env(safe-area-inset-bottom));
display:flex;
gap:7px;
background:rgba(5,8,7,.98);
border-top:1px solid rgba(255,255,255,.06);
z-index:110;
}

#messageInput{
flex:1;
min-width:0;
height:48px;
padding:0 14px;
border-radius:16px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;
font-size:14px;
}

#messageInput::placeholder{
color:#66736e;
}

#messageInput:focus{
border-color:#00e889;
}

#voiceButton,
#sendButton,
#attachButton{
width:48px;
height:48px;
border:0;
border-radius:15px;
font-size:21px;
cursor:pointer;
flex-shrink:0;
transition:.15s;
}

#attachButton{
background:#18231f;
color:#fff;
font-size:25px;
}

#voiceButton{
background:#18231f;
color:#fff;
}

#sendButton{
background:#00e889;
color:#00150e;
font-size:21px;
font-weight:bold;
}

#voiceButton:active,
#sendButton:active,
#attachButton:active{
transform:scale(.92);
}

button:disabled{
opacity:.55;
cursor:not-allowed;
}

/* ================= LOADING ================= */

#loading{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#020504;
color:#fff;
font-size:16px;
z-index:999999;
gap:14px;
}

.loading-spinner{
width:32px;
height:32px;
border:3px solid rgba(255,255,255,.12);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.hidden-file{
display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:480px){

header{
height:68px;
min-height:68px;
padding:8px 9px;
gap:8px;
}

.back{
width:40px;
height:40px;
border-radius:13px;
}

.avatar{
width:45px;
height:45px;
}

.user-name{
font-size:15px;
}

.user-status{
font-size:10px;
}

.call-buttons{
gap:4px;
}

.call-buttons button{
width:38px;
height:38px;
font-size:16px;
border-radius:12px;
}

.messages{
padding:15px 9px 140px;
gap:12px;
}

.message{
max-width:84%;
font-size:14px;
}

.message-image,
.message-video{
max-width:245px;
max-height:270px;
}

.input-area{
padding-left:7px;
padding-right:7px;
}

#messageInput{
font-size:14px;
}

#voiceButton,
#sendButton,
#attachButton{
width:45px;
height:45px;
border-radius:14px;
}

#attachMenu{
right:8px;
bottom:72px;
}

.reply-compose{
bottom:61px;
}

}

/* منع تحديد النص أثناء السحب على الرسائل */
.message *{
-webkit-user-select:none;
user-select:none;
}
</style>
</head>

<body>

<div id="loading">
<div class="loading-spinner"></div>
<div id="loadingText">جارٍ فتح الدردشة...</div>
</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back" type="button" aria-label="رجوع">→</button>

<div id="friendAvatar" class="avatar">👤</div>

<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton" type="button" aria-label="مكالمة صوتية">📞</button>
<button id="videoButton" type="button" aria-label="مكالمة فيديو">📹</button>
</div>

</header>

<div id="pinnedBanner" class="pinned-banner">

<div id="pinnedBannerClick" class="pinned-banner-content">
<span>📌</span>
<span id="pinnedBannerText" class="pinned-banner-text">رسالة مثبتة</span>
</div>

<button id="pinnedBannerClose" class="pinned-banner-close" type="button">✕</button>

</div>

<div id="messages" class="messages">

<div id="emptyMessage" class="empty">
💬<br>
ابدأ المحادثة الآن
</div>

</div>

<div id="attachMenu">

<button id="galleryButton" class="attach-option" type="button">
<span>🖼️</span>
<span>صورة أو فيديو</span>
</button>

<button id="cameraButton" class="attach-option" type="button">
<span>📷</span>
<span>كاميرا</span>
</button>

</div>

<input
id="galleryInput"
class="hidden-file"
type="file"
accept="image/*,video/*"
>

<input
id="cameraInput"
class="hidden-file"
type="file"
accept="image/*,video/*"
capture="environment"
>

<div id="replyCompose" class="reply-compose">

<div class="reply-compose-content">

<div id="replyComposeName" class="reply-compose-name">
الرد على الرسالة
</div>

<div id="replyComposeText" class="reply-compose-text"></div>

</div>

<button id="replyCancel" class="reply-cancel" type="button">
✕
</button>

</div>

<div class="input-area">

<button id="attachButton" type="button" aria-label="إرفاق">
＋
</button>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>

<button id="voiceButton" type="button" aria-label="رسالة صوتية">
🎤
</button>

<button id="sendButton" type="button" aria-label="إرسال">
➤
</button>

</div>

</main>

/* =========================================================

========================================================= */

function escapeHtml(value){
return String(value ?? "").replace(
/[&<>'"]/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);
}

function createChatID(a,b){
return [a,b].sort().join("_");
}

function getMessagePreview(data){

if(data.type === "text"){
return data.text || "رسالة";
}

if(data.type === "image"){
return "📷 صورة";
}

if(data.type === "video"){
return "🎥 فيديو";
}

if(data.type === "voice"){
return "🎤 رسالة صوتية";
}

return "رسالة";
}

function formatTime(timestamp){

if(!timestamp){
return "";
}

try{

if(typeof timestamp.toDate === "function"){

return timestamp.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

return "";

}catch{

return "";

}

}

function setUserAvatar(element,user){

if(user?.photo){

element.textContent = "👤";

async function toggleReaction(messageId,emoji){

if(
!currentUser ||
!chatID ||
!messageId ||
!emoji
){
return;
}

try{

const messageRef =
doc(
db,
"chats",
chatID,
"messages",
messageId
);

const snap = await getDoc(messageRef);

if(!snap.exists()){
return;
}

const data = snap.data();

const reactions =
Array.isArray(data.reactions)
? data.reactions
: [];

const mine = reactions.some(
r =>
r &&
r.userId === currentUser.uid &&
r.emoji === emoji
);

if(mine){

await updateDoc(
messageRef,
{
reactions:arrayRemove({
userId:currentUser.uid,
emoji
})
}
);

}else{

const oldMine =
reactions.find(
r =>
r &&
r.userId === currentUser.uid
);

if(oldMine){

await updateDoc(
messageRef,
{
reactions:arrayRemove(oldMine)
}
);

}

await updateDoc(
messageRef,
{
reactions:arrayUnion({
userId:currentUser.uid,
emoji
})
}
);

}

}catch(error){

console.error(
"Reaction error:",
error
);

}

}

/* =========================================================

========================================================= */

function setupSwipeToReply(
element,
data
){

let startX = 0;
let currentX = 0;
let isSwiping = false;

element.addEventListener(
"touchstart",
e=>{

if(!e.touches.length){
return;
}

startX =
e.touches[0].clientX;

currentX =
startX;

isSwiping = true;

},
{
passive:true
}
);

element.addEventListener(
"touchmove",
e=>{

if(!isSwiping ||
!e.touches.length
){
return;
}

currentX =
e.touches[0].clientX;

const diff =
currentX - startX;

if(
data.senderId !== currentUser.uid &&
diff > 0 &&
diff < 120
){

element.style.transform =
`translateX(${diff}px)`;

}else if(
data.senderId === currentUser.uid &&
diff < 0 &&
diff > -120
){

element.style.transform =
`translateX(${diff}px)`;

}

},
{
passive:true
}
);

element.addEventListener(
"touchend",
()=>{

if(!isSwiping){
return;
}

isSwiping = false;

const diff =
currentX - startX;

if(
Math.abs(diff) > 75
){

startReply(data);

}

element.style.transform =
"translateX(0)";

}
);

}

);

e=>{

data

);

/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(snapshot){

const wasEmpty =
messageElements.size === 0;

const distance =
messages.scrollHeight -
messages.scrollTop -
messages.clientHeight;

const nearBottom =
distance < 150;

snapshot.docChanges().forEach(
change=>{

const id =
change.doc.id;

const data = {
...change.doc.data(),
id
};

/* removed */

if(change.type === "removed"){

const old =
messageElements.get(id);

if(old){
old.remove();
}

messageElements.delete(id);

return;

}

/* deleted for me */

if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(
currentUser.uid
)
){

const old =
messageElements.get(id);

if(old){
old.remove();
}

messageElements.delete(id);

return;

}

/* render */

const newElement =
buildMessageElement(
data
);

const old =
messageElements.get(id);

if(old){

old.replaceWith(
newElement
);

}else{

messages.appendChild(
newElement
);

}

messageElements.set(
id,
newElement
);

}
);

/* empty */

emptyMessage.style.display =
messageElements.size
? "none"
: "block";

/* pinned */

updatePinnedBanner();

/* scroll */

if(
nearBottom ||
wasEmpty
){

requestAnimationFrame(
()=>{
messages.scrollTop =
messages.scrollHeight;
}
);

}

}

function formatLastSeen(timestamp){

if(!timestamp){
return "آخر ظهور غير معروف";
}

try{

const date =
typeof timestamp.toDate === "function"
? timestamp.toDate()
: null;

if(!date){
return "آخر ظهور غير معروف";
}

const diff =
Date.now() - date.getTime();

if(diff < 60000){

return "آخر ظهور الآن";

}

const today =
new Date();

const sameDay =
date.toDateString() ===
today.toDateString();

if(sameDay){

return (
"آخر ظهور اليوم " +
date.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
)
);

}

return (
"آخر ظهور " +
date.toLocaleDateString(
"ar"
) +
" " +
date.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
)
);

}catch{

return "آخر ظهور غير معروف";

}

}

const lastSeen =
data?.lastSeen;

let isOnline =

if(age > 70000){

if(isOnline){

friendStatus.className =
"user-status online";

}else{

"● غير متصل";

try{

sendButton.disabled = true;

const safeName =
file.name
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const fileName =
`${currentUser.uid}/${Date.now()}_${safeName}`;

const upload =
await supabase
.storage
.from("mecd-media")
.upload(
fileName,
file,
{
upsert:false
}
);

if(upload.error){

throw upload.error;

}

const publicData =
supabase
.storage
.from("mecd-media")
.getPublicUrl(
fileName
);

const mediaUrl =
publicData.data.publicUrl;

const messageData = {

url:mediaUrl,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type,

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

};

if(replyTarget){

messageData.replyTo = {

messageId:
replyTarget.id,

senderId:
replyTarget.senderId,

senderName:
replyTarget.senderName,

text:
replyTarget.text

};

}

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
messageData
);

cancelReply();

}catch(error){

console.error(
"Upload error:",
error
);

alert(
"فشل رفع الملف. تأكد من إعدادات Supabase Storage."
);

}finally{

sendButton.disabled = false;

messageInput.focus();

}

}

/* =========================================================
   FILE INPUTS
========================================================= */

galleryInput.addEventListener(
"change",
e=>{

const file =
e.target.files?.[0];

if(!file){
return;
}

const type =
file.type.startsWith("video/")
? "video"
: "image";

uploadMediaAndSend(
file,
type
);

galleryInput.value = "";

}
);

cameraInput.addEventListener(
"change",
e=>{

const file =
e.target.files?.[0];

if(!file){
return;
}

const type =
file.type.startsWith("video/")
? "video"
: "image";

uploadMediaAndSend(
file,
type
);

cameraInput.value = "";

}
);

/* =========================================================
   SEND MESSAGE
========================================================= */

async function handleSendMessage(){

const text =
messageInput.value.trim();

if(
!text ||
!currentUser ||
!friendUser ||
!chatID
){
return;
}

sendButton.disabled = true;

try{

/* EDIT */

if(editingMessageId){

await updateDoc(
doc(
db,
"chats",
chatID,
"messages",
editingMessageId
),
{
text,
isEdited:true
}
);

editingMessageId =
null;

sendButton.textContent =
"➤";

}

/* NEW MESSAGE */

else{

const messageData = {

text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type:"text",

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

};

if(replyTarget){

messageData.replyTo = {

messageId:
replyTarget.id,

senderId:
replyTarget.senderId,

senderName:
replyTarget.senderName,

text:
replyTarget.text

};

}

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
messageData
);

}

messageInput.value = "";

cancelReply();

}catch(error){

console.error(
"Send message error:",
error
);

alert(
"تعذر إرسال الرسالة."
);

}finally{

sendButton.disabled = false;

messageInput.focus();

}

}

sendButton.addEventListener(
"click",
handleSendMessage
);

messageInput.addEventListener(
"keydown",
e=>{

if(
e.key === "Enter" &&
!e.shiftKey
){

e.preventDefault();

handleSendMessage();

}

}
);

/* =========================================================
   VOICE BUTTON
========================================================= */

/*
   مهم:
   لم يتم تغيير رابط أو ملف Voice الخاص بك.
   الزر يبقى موجودًا حتى يتم ربطه بملف Voice الموجود
   عندك كما هو.
*/

voiceButton.addEventListener(
"click",
()=>{

/*
  إذا كان ملف Voice عندك يستمع لحدث مخصص:
  window.dispatchEvent(new CustomEvent("mecd:startVoice"));

  تم ترك الزر بدون استدعاء رابط مجهول
  حتى لا يتم تخريب ملف Voice الموجود عندك.
*/

window.dispatchEvent(
new CustomEvent(
"mecd:voiceButton"
)
);

}
);

/* =========================================================
   PINNED CLICK
========================================================= */

pinnedBannerClick.addEventListener(
"click",
()=>{

let pinned = null;

for(
const element of messageElements.values()
){

if(
element._messageData?.pinned === true
){

pinned =
element._messageData;

break;

}

}

if(!pinned){
return;
}

const target =
messageElements.get(
pinned.id
);

if(target){

target.scrollIntoView({
behavior:"smooth",
block:"center"
});

target.classList.add(
"highlight"
);

setTimeout(
()=>{
target.classList.remove(
"highlight"
);
},
1500
);

}

}
);

pinnedBannerClose.addEventListener(
"click",
e=>{

e.stopPropagation();

pinnedBanner.classList.remove(
"show"
);

}
);

/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
"click",
()=>{

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages = null;

}

if(unsubscribeFriend){

unsubscribeFriend();

unsubscribeFriend = null;

}

history.back();

}
);

/* =========================================================
   CALL BUTTONS
   لا يتم تغيير نظام Voice الموجود عندك
========================================================= */

callButton.addEventListener(
"click",
()=>{

window.dispatchEvent(
new CustomEvent(
"mecd:audioCall",
{
detail:{
friend:friendUser,
chatID
}
}
)
);

}
);

videoButton.addEventListener(
"click",
()=>{

window.dispatchEvent(
new CustomEvent(
"mecd:videoCall",
{
detail:{
friend:friendUser,
chatID
}
}
)
);

}
);

/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}

currentUser =
user;

try{

await loadFriend();

listenMessages();

listenFriendPresence();

startPresence();

showApp();

}catch(error){

console.error(
"Chat startup error:",
error
);

showError(
error?.message ||
"حدث خطأ أثناء فتح الدردشة."
);

}

}
);

</script>
