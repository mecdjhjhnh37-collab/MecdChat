<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#075e54">
<title>Mecd Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#efeae2;
    color:#111;
}

button,input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    max-width:650px;
    margin:auto;
    position:relative;
    display:flex;
    flex-direction:column;
    background:#efeae2;
    overflow:hidden;
}

/* ================= HEADER ================= */

header{
    height:64px;
    min-height:64px;
    background:#075e54;
    color:white;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 9px;
    z-index:20;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
}

.back{
    width:42px;
    height:42px;
    background:transparent;
    color:white;
    border-radius:50%;
    font-size:25px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.avatar{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    overflow:hidden;
    background:#d7ddd9;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#66736e;
    font-size:23px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    min-width:0;
    flex:1;
    padding-right:2px;
}

.user-name{
    color:white;
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    margin-top:2px;
    color:rgba(255,255,255,.82);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status.online,
.user-status.typing,
.user-status.recording{
    color:#d7ffd9;
}

.call-buttons{
    display:flex;
    align-items:center;
    gap:2px;
}

.call-buttons button{
    width:42px;
    height:42px;
    background:transparent;
    color:white;
    font-size:20px;
    border-radius:50%;
}

/* ================= PINNED ================= */

.pinned-banner{
    display:none;
    min-height:45px;
    padding:6px 12px;
    background:#f7f7f7;
    border-bottom:1px solid #ddd;
    align-items:center;
    gap:8px;
    z-index:15;
}

.pinned-banner.show{
    display:flex;
}

.pinned-banner-content{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
}

.pinned-banner-text{
    color:#555;
    font-size:12px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.pinned-banner-close{
    background:transparent;
    color:#777;
    font-size:16px;
    padding:5px;
}

/* ================= MESSAGES ================= */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:10px 9px 78px;
    display:flex;
    flex-direction:column;
    gap:3px;
    background-color:#efeae2;

    background-image:
        radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);
    background-size:4px 4px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:4px;
}

.messages::-webkit-scrollbar-thumb{
    background:rgba(0,0,0,.2);
    border-radius:5px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#777;
    line-height:1.8;
    font-size:14px;
}

/* ================= MESSAGE BUBBLE ================= */

.message{
    position:relative;
    max-width:82%;
    width:max-content;
    min-width:60px;
    padding:7px 9px 20px;
    margin:2px 0 5px;
    border-radius:8px;
    line-height:1.45;
    font-size:14px;
    word-break:break-word;
    overflow-wrap:anywhere;
    user-select:none;
    box-shadow:0 1px 1px rgba(0,0,0,.12);
    transition:transform .12s ease,background .2s ease;
}

.message.mine{
    align-self:flex-start;
    background:#d9fdd3;
    color:#111;
    border-top-left-radius:3px;
}

.message.other{
    align-self:flex-end;
    background:#fff;
    color:#111;
    border-top-right-radius:3px;
}

.message.mine::before{
    content:"";
    position:absolute;
    top:0;
    left:-7px;
    border-top:8px solid #d9fdd3;
    border-left:8px solid transparent;
}

.message.other::before{
    content:"";
    position:absolute;
    top:0;
    right:-7px;
    border-top:8px solid #fff;
    border-right:8px solid transparent;
}

.message.highlight{
    background:#fff3a3 !important;
}

/* ================= TIME ================= */

.message-meta{
    position:absolute;
    bottom:3px;
    left:7px;
    display:flex;
    align-items:center;
    gap:3px;
    direction:ltr;
}

.message.other .message-meta{
    left:auto;
    right:7px;
}

.time{
    color:#667;
    font-size:9px;
    white-space:nowrap;
}

.message-status{
    font-size:11px;
    color:#869096;
    font-weight:bold;
}

.message-status.read{
    color:#53bdeb;
}

/* ================= REPLY ================= */

.message-reply{
    display:flex;
    min-width:130px;
    max-width:240px;
    margin-bottom:5px;
    padding:5px 7px;
    background:rgba(0,0,0,.07);
    border-right:3px solid #25d366;
    border-radius:5px;
    cursor:pointer;
    overflow:hidden;
}

.message.mine .message-reply{
    border-right-color:#128c7e;
}

.reply-content{
    min-width:0;
    overflow:hidden;
}

.reply-name{
    color:#128c7e;
    font-size:10px;
    font-weight:bold;
    margin-bottom:2px;
}

.message.mine .reply-name{
    color:#075e54;
}

.reply-text{
    color:#555;
    font-size:10px;
    opacity:.9;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= MEDIA ================= */

.message.image-message,
.message.video-message{
    padding:4px 4px 21px;
    background:#fff;
    max-width:75%;
}

.message.mine.image-message,
.message.mine.video-message{
    background:#d9fdd3;
}

.message-image,
.message-video{
    display:block;
    width:auto;
    max-width:260px;
    max-height:300px;
    border-radius:6px;
    object-fit:cover;
    cursor:pointer;
}

/* ================= REACTIONS ================= */

.message-reactions{
    position:absolute;
    bottom:-10px;
    right:7px;
    display:flex;
    gap:2px;
    z-index:4;
}

.message.mine .message-reactions{
    right:auto;
    left:7px;
}

.reaction-chip{
    display:flex;
    align-items:center;
    gap:2px;
    padding:2px 5px;
    border:1px solid #ddd;
    background:#fff;
    border-radius:12px;
    font-size:11px;
    box-shadow:0 1px 2px rgba(0,0,0,.12);
}

.reaction-chip.mine{
    border-color:#25d366;
    background:#f0fff0;
}

.reaction-count{
    color:#555;
    font-size:9px;
}

/* ================= HEART ================= */

.heart-pop{
    position:absolute;
    bottom:8px;
    right:14px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    animation:heartPop .55s ease forwards;
    z-index:30;
}

.message.mine .heart-pop{
    right:auto;
    left:14px;
}

@keyframes heartPop{
    0%{transform:scale(0);opacity:0}
    45%{transform:scale(1.3);opacity:1}
    100%{transform:scale(1);opacity:1}
}

/* ================= ATTACH MENU ================= */

#attachMenu{
    position:absolute;
    bottom:65px;
    right:8px;
    width:205px;
    padding:7px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.25);
    display:none;
    z-index:100;
}

#attachMenu.show{
    display:block;
}

.attach-option{
    width:100%;
    height:46px;
    background:white;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 12px;
    border-radius:8px;
    color:#222;
    font-size:14px;
    text-align:right;
}

.attach-option:hover{
    background:#f2f2f2;
}

/* ================= REPLY COMPOSE ================= */

.reply-compose{
    position:absolute;
    bottom:58px;
    right:0;
    left:0;
    min-height:54px;
    padding:6px 9px;
    background:#f0f0f0;
    border-top:1px solid #ddd;
    display:none;
    align-items:center;
    gap:7px;
    z-index:45;
}

.reply-compose.show{
    display:flex;
}

.reply-compose-content{
    flex:1;
    min-width:0;
    padding:5px 8px;
    background:#fff;
    border-right:3px solid #25d366;
    border-radius:6px;
    overflow:hidden;
}

.reply-compose-name{
    color:#128c7e;
    font-size:11px;
    font-weight:bold;
}

.reply-compose-text{
    color:#666;
    font-size:11px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.reply-cancel{
    width:34px;
    height:34px;
    background:transparent;
    color:#555;
    font-size:18px;
}

/* ================= INPUT ================= */

.input-area{
    position:absolute;
    right:0;
    bottom:0;
    left:0;
    min-height:58px;
    padding:5px 7px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    gap:5px;
    z-index:40;
}

#messageInput{
    flex:1;
    min-width:0;
    height:46px;
    padding:0 16px;
    background:#fff;
    border:0;
    border-radius:23px;
    outline:none;
    color:#111;
    font-size:14px;
    direction:rtl;
}

#messageInput::placeholder{
    color:#777;
}

#messageInput:focus{
    outline:none;
}

#voiceButton,
#sendButton,
#attachButton{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
}

#attachButton{
    background:transparent;
    color:#54656f;
    font-size:27px;
}

#voiceButton{
    background:#25d366;
    color:white;
}

#sendButton{
    background:#25d366;
    color:white;
    display:none;
}

.input-area.has-text #sendButton{
    display:flex;
}

.input-area.has-text #voiceButton{
    display:none;
}

/* ================= BOTTOM SHEET ================= */

.bottom-sheet-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:1000;
    display:flex;
    align-items:flex-end;
}

.bottom-sheet{
    width:100%;
    max-width:650px;
    margin:auto;
    background:#fff;
    border-radius:18px 18px 0 0;
    padding:10px 10px 25px;
    animation:sheetUp .2s ease;
}

@keyframes sheetUp{
    from{transform:translateY(100%)}
    to{transform:translateY(0)}
}

.sheet-reactions-bar{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:7px;
    margin-bottom:8px;
    background:#f5f5f5;
    border-radius:30px;
}

.sheet-reaction-btn{
    width:42px;
    height:42px;
    background:transparent;
    font-size:23px;
    border-radius:50%;
}

.sheet-reaction-btn:active{
    background:#ddd;
}

.sheet-actions-list{
    display:flex;
    flex-direction:column;
}

.sheet-action-item{
    width:100%;
    min-height:48px;
    padding:0 14px;
    background:white;
    display:flex;
    align-items:center;
    gap:12px;
    color:#222;
    text-align:right;
    font-size:14px;
    border-bottom:1px solid #eee;
}

.sheet-action-item:last-child{
    border-bottom:0;
}

.sheet-action-item:active{
    background:#f1f1f1;
}

.hidden-file{
    display:none !important;
}

/* ================= MOBILE ================= */

@media(max-width:650px){
    .app{
        max-width:none;
    }

    .messages{
        padding-left:7px;
        padding-right:7px;
    }

    .message{
        max-width:86%;
    }

    .message-image,
    .message-video{
        max-width:250px;
    }
}
</style>
</head>

<body>

style="
position:fixed;

align-items:center;

background:#075e54;

font-size:17px;

">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>

</div>

</main>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    addDoc,
    collection,
    query,
    orderBy,
    onSnapshot,
    deleteDoc,
    serverTimestamp,
    arrayUnion,
    arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
    createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
    apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",
    authDomain: "mecd-tools.firebaseapp.com",
    projectId: "mecd-tools",
    storageBucket: "mecd-tools.firebasestorage.app",
    messagingSenderId: "643005547408",
    appId: "1:643005547408:web:b1719060ec340dd0e0a915"
};

const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getFirestore(firebaseApp);


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://aqukohedqmtjuspjbkmn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_jODiQ8WSON3ouLqvLlQcZA_2Q6GwF_l";

const supabase =
createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id => document.getElementById(id);

const loading = $("loading");
const app = $("app");
const messages = $("messages");

const messageInput = $("messageInput");
const inputArea = $("inputArea");

const sendButton = $("sendButton");
const voiceButton = $("voiceButton");
const attachButton = $("attachButton");

const attachMenu = $("attachMenu");
const galleryButton = $("galleryButton");
const cameraButton = $("cameraButton");

const galleryInput = $("galleryInput");
const cameraInput = $("cameraInput");

const friendName = $("friendName");
const friendAvatar = $("friendAvatar");
const friendStatus = $("friendStatus");

const backButton = $("backButton");

const pinnedBanner = $("pinnedBanner");
const pinnedBannerText = $("pinnedBannerText");
const pinnedBannerClick = $("pinnedBannerClick");
const pinnedBannerClose = $("pinnedBannerClose");

const replyCompose = $("replyCompose");
const replyComposeName = $("replyComposeName");
const replyComposeText = $("replyComposeText");
const replyCancel = $("replyCancel");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;
let unsubscribeFriend = null;

let replyTarget = null;
let editingMessageId = null;

const messageElements = new Map();


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
    .replace(/[&<>'"]/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#39;",
        '"':"&quot;"
    }[char]));

}


function createChatID(a,b){

    return [a,b].sort().join("_");

}


function getMessagePreview(data){

    if(data.type === "text")
        return data.text || "رسالة";

    if(data.type === "image")
        return "📷 صورة";

    if(data.type === "video")
        return "🎥 فيديو";

    if(data.type === "voice")
        return "🎤 رسالة صوتية";

    return "رسالة";

}


function formatTime(timestamp){

    if(!timestamp || !timestamp.toDate)
        return "";

    try{

        return timestamp
        .toDate()
        .toLocaleTimeString("ar",{
            hour:"2-digit",
            minute:"2-digit"
        });

    }catch{

        return "";

    }

}


function setUserAvatar(element,user){

    element.innerHTML = "";

    if(user && user.photo){

        const img = document.createElement("img");

        img.src = user.photo;
        img.alt = "";

        img.onerror = () => {
            element.textContent = "👤";
        };

        element.appendChild(img);

    }else{

        element.textContent = "👤";

    }

}


/* =========================================================
   FRIEND STATUS
========================================================= */

function listenFriendStatus(){

    if(!friendUser)
        return;

    if(unsubscribeFriend)
        unsubscribeFriend();

    const userRef =
        doc(db,"users",friendUser.uid);

    unsubscribeFriend =
    onSnapshot(userRef,snap => {

        if(!snap.exists())
            return;

        const data = snap.data();

        const online =
            data.online === true ||
            data.isOnline === true;

        if(online){

            friendStatus.textContent =
                "● متصل";

            friendStatus.className =
                "user-status online";

        }else if(data.lastSeen){

            let last = "";

            try{

                last =
                data.lastSeen.toDate()
                .toLocaleTimeString("ar",{
                    hour:"2-digit",
                    minute:"2-digit"
                });

            }catch{}

            friendStatus.textContent =
                last
                ? "آخر ظهور اليوم " + last
                : "غير متصل";

            friendStatus.className =
                "user-status";

        }else{

            friendStatus.textContent =
                "● غير متصل";

            friendStatus.className =
                "user-status";

        }

    });

}


/* =========================================================
   REPLY
========================================================= */

function startReply(data){

    editingMessageId = null;

    sendButton.textContent = "➤";

    replyTarget = {

        id:data.id,

        senderId:data.senderId,

        senderName:
            data.senderId === currentUser.uid
            ? "أنت"
            : friendUser?.name || "المستخدم",

        text:getMessagePreview(data)

    };

    replyComposeName.textContent =
        "الرد على " + replyTarget.senderName;

    replyComposeText.textContent =
        replyTarget.text;

    replyCompose.classList.add("show");

    messageInput.focus();

}


function cancelReply(){

    replyTarget = null;

    replyCompose.classList.remove("show");

}


replyCancel.onclick = event => {

    event.stopPropagation();

    cancelReply();

};


/* =========================================================
   REACTIONS
========================================================= */

const reactionList =
["❤️","👍","🔥","😂","😮"];


async function toggleReaction(messageId,emoji){

    if(!currentUser || !chatID)
        return;

    try{

        const ref =
            doc(
                db,
                "chats",
                chatID,
                "messages",
                messageId
            );

        const snap = await getDoc(ref);

        if(!snap.exists())
            return;

        const data = snap.data();

        const reactions =
            Array.isArray(data.reactions)
            ? data.reactions
            : [];

        const mine =
            reactions.find(
                r =>
                    r &&
                    r.userId === currentUser.uid
            );

        if(mine){

            if(mine.emoji === emoji){

                await updateDoc(ref,{
                    reactions:
                        arrayRemove(mine)
                });

            }else{

                await updateDoc(ref,{
                    reactions:
                        arrayRemove(mine)
                });

                await updateDoc(ref,{
                    reactions:
                        arrayUnion({
                            userId:currentUser.uid,
                            emoji
                        })
                });

            }

        }else{

            await updateDoc(ref,{
                reactions:
                    arrayUnion({
                        userId:currentUser.uid,
                        emoji
                    })
            });

        }

    }catch(error){

        console.error(
            "Reaction error:",
            error
        );

    }

}


function renderReactions(box,data){

    if(!Array.isArray(data.reactions))
        return;

    if(!data.reactions.length)
        return;

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message-reactions";

    const counts = {};

    data.reactions.forEach(reaction => {

        if(!reaction || !reaction.emoji)
            return;

        if(!counts[reaction.emoji]){

            counts[reaction.emoji] = {
                count:0,
                mine:false
            };

        }

        counts[reaction.emoji].count++;

        if(
            reaction.userId ===
            currentUser.uid
        ){

            counts[reaction.emoji].mine = true;

        }

    });

    reactionList.forEach(emoji => {

        const info = counts[emoji];

        if(!info)
            return;

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "reaction-chip" +
            (info.mine ? " mine" : "");

        button.innerHTML =
            escapeHtml(emoji) +
            (
                info.count > 1
                ? ` <span class="reaction-count">${info.count}</span>`
                : ""
            );

        button.onclick = event => {

            event.stopPropagation();

            toggleReaction(
                data.id,
                emoji
            );

        };

        wrapper.appendChild(button);

    });

    if(wrapper.children.length)
        box.appendChild(wrapper);

}

function setupSwipeToReply(
    element,
    data
){

    let startX = 0;
    let currentX = 0;
    let active = false;

    element.addEventListener(
        "touchstart",
        event => {

            startX =
                event.touches[0].clientX;

            currentX = startX;

            active = true;

        },
        {passive:true}
    );


    element.addEventListener(
        "touchmove",
        event => {

            if(!active)
                return;

            currentX =
                event.touches[0].clientX;

            const diff =
                currentX - startX;

            if(
                data.senderId !==
                currentUser.uid &&
                diff > 0 &&
                diff < 110
            ){

                element.style.transform =
                    `translateX(${diff}px)`;

            }

            if(
                data.senderId ===
                currentUser.uid &&
                diff < 0 &&
                diff > -110
            ){

                element.style.transform =
                    `translateX(${diff}px)`;

            }

        },
        {passive:true}
    );


    element.addEventListener(
        "touchend",
        () => {

            if(!active)
                return;

            active = false;

            const diff =
                currentX - startX;

            if(Math.abs(diff) > 70)
                startReply(data);

            element.style.transform =
                "translateX(0)";

        }
    );

}


function addMessageActions(
    element,
    data
){

    let timer = null;
    let longPress = false;
    let lastTap = 0;


    element.addEventListener(
        "pointerdown",
        () => {

            longPress = false;

            timer =
                setTimeout(() => {

                    longPress = true;

                    showBottomSheetMenu(data);

                },500);

        }
    );


    const cancelTimer = () => {

        if(timer){

            clearTimeout(timer);
            timer = null;

        }

    };


    element.addEventListener(
        "pointerup",
        cancelTimer
    );

    element.addEventListener(
        "pointercancel",
        cancelTimer
    );

    element.addEventListener(
        "pointerleave",
        cancelTimer
    );


    element.addEventListener(
        "contextmenu",
        event => {

            event.preventDefault();

            showBottomSheetMenu(data);

        }
    );


    element.addEventListener(
        "click",
        event => {

            if(longPress)
                return;

            if(
                event.target.closest("button") ||
                event.target.closest(".message-reply") ||
                event.target.closest("video")
            )
                return;

            const now =
                Date.now();

            if(
                now - lastTap < 300 &&
                now - lastTap > 0
            ){

                triggerHeartReaction(
                    element,
                    data.id
                );

                event.preventDefault();

            }

            lastTap = now;

        }
    );


    setupSwipeToReply(
        element,
        data
    );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(data){

    const box =
        document.createElement("div");

    let className =
        "message " +
        (
            data.senderId ===
            currentUser.uid
            ? "mine"
            : "other"
        );

    if(data.type === "image")
        className += " image-message";

    if(data.type === "video")
        className += " video-message";

    box.className = className;


    /* REPLY */

    if(data.replyTo){

        const replyBox =
            document.createElement("div");

        replyBox.className =
            "message-reply";

        replyBox.onclick =
            event => {

                event.stopPropagation();

                const target =
                    messageElements.get(
                        data.replyTo.messageId
                    );

                if(target){

                    target.scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });

                    target.classList.add(
                        "highlight"
                    );

                    setTimeout(
                        () =>
                        target.classList.remove(
                            "highlight"
                        ),
                        1500
                    );

                }

            };


        const content =
            document.createElement("div");

        content.className =
            "reply-content";


        const name =
            document.createElement("div");

        name.className =
            "reply-name";

        name.textContent =
            data.replyTo.senderId ===
            currentUser.uid
            ? "أنت"
            : data.replyTo.senderName ||
              "المستخدم";


        const text =
            document.createElement("div");

        text.className =
            "reply-text";

        text.textContent =
            data.replyTo.text ||
            "رسالة";


        content.append(
            name,
            text
        );

        replyBox.appendChild(content);

        box.appendChild(replyBox);

    }


    /* TEXT */

    if(data.type === "text"){

        const text =
            document.createTextNode(
                data.text || ""
            );

        box.appendChild(text);


        if(data.isEdited){

            const edited =
                document.createElement("span");

            edited.style.fontSize =
                "9px";

            edited.style.opacity =
                ".55";

            edited.textContent =
                " (معدلة)";

            box.appendChild(edited);

        }

    }


    /* IMAGE */

    else if(
        data.type === "image" &&
        data.url
    ){

        const img =
            document.createElement("img");

        img.className =
            "message-image";

        img.src = data.url;

        img.alt = "صورة";

        img.loading = "lazy";

        img.onclick =
            () => window.open(
                data.url,
                "_blank",
                "noopener,noreferrer"
            );

        box.appendChild(img);

    }


    /* VIDEO */

    else if(
        data.type === "video" &&
        data.url
    ){

        const video =
            document.createElement("video");

        video.className =
            "message-video";

        video.src = data.url;

        video.controls = true;

        video.playsInline = true;

        box.appendChild(video);

    }


    /* VOICE */

    else if(
        data.type === "voice" &&
        data.url
    ){

        const audio =
            document.createElement("audio");

        audio.controls = true;

        audio.preload = "metadata";

        audio.src = data.url;

        audio.style.width = "230px";
        audio.style.maxWidth = "100%";

        box.appendChild(audio);

    }


    /* META */

    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";


    const time =
        document.createElement("span");

    time.className = "time";

    time.textContent =
        formatTime(data.createdAt);

    meta.appendChild(time);


    if(
        data.senderId ===
        currentUser.uid
    ){

        const status =
            document.createElement("span");

        status.className =
            "message-status " +
            (
                data.read === true
                ? "read"
                : ""
            );

        status.textContent =
            data.read === true
            ? "✓✓"
            : "✓";

        meta.appendChild(status);

    }


    box.appendChild(meta);

    renderReactions(
        box,
        data
    );

    addMessageActions(
        box,
        data
    );

    return box;

}


/* =========================================================
   SNAPSHOT
========================================================= */

function renderMessages(snapshot){

    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight
        < 150;


    if(
        snapshot.empty &&
        messageElements.size === 0
    ){

        messages.innerHTML = "";

        const empty =
            document.createElement("div");

        empty.className =
            "empty";

        empty.innerHTML =
            "💬<br>ابدأ المحادثة الآن";

        messages.appendChild(empty);

    }


    snapshot.docChanges()
    .forEach(change => {

        const id =
            change.doc.id;

        const data =
            {
                ...change.doc.data(),
                id
            };


        if(change.type === "removed"){

            const old =
                messageElements.get(id);

            if(old)
                old.remove();

            messageElements.delete(id);

            return;

        }


        if(
            Array.isArray(data.deletedFor) &&
            data.deletedFor.includes(
                currentUser.uid
            )
        ){

            const old =
                messageElements.get(id);

            if(old)
                old.remove();

            messageElements.delete(id);

            return;

        }


        const old =
            messageElements.get(id);

        const element =
            renderMessage(data);


        if(old){

            old.replaceWith(element);

        }else{

            messages.appendChild(element);

        }

        messageElements.set(
            id,
            element
        );


        /* PIN */

        if(data.pinned === true){

            pinnedBannerText.textContent =
                (
                    data.senderId ===
                    currentUser.uid
                    ? "أنت: "
                    : ""
                ) +
                getMessagePreview(data);

            pinnedBanner.classList.add(
                "show"
            );

        }

    });


    if(nearBottom){

        requestAnimationFrame(() => {

            messages.scrollTop =
                messages.scrollHeight;

        });

    }

}

function listenMessages(){

    if(!chatID)
        return;

    if(unsubscribeMessages)
        unsubscribeMessages();

    messageElements.clear();

    const q =
        query(
            collection(
                db,
                "chats",
                chatID,
                "messages"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );

    unsubscribeMessages =
        onSnapshot(
            q,
            renderMessages,
            error => {

                console.error(
                    "Messages listener:",
                    error
                );

            }
        );

}

async function uploadMediaAndSend(
    file,
    type
){

    if(
        !file ||
        !currentUser ||
        !friendUser ||
        !chatID
    )
        return;


    if(file.size > 50 * 1024 * 1024){

        alert(
            "حجم الملف كبير جداً"
        );

        return;

    }


    try{

        const safeName =
            file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

        const fileName =
            `${currentUser.uid}/${Date.now()}_${safeName}`;


        const result =
            await supabase
            .storage
            .from("mecd-media")
            .upload(
                fileName,
                file,
                {
                    upsert:false
                }
            );


        if(result.error)
            throw result.error;


        const publicResult =
            supabase
            .storage
            .from("mecd-media")
            .getPublicUrl(
                fileName
            );


        const mediaUrl =
            publicResult
            ?.data
            ?.publicUrl;


        if(!mediaUrl)
            throw new Error(
                "لم يتم الحصول على الرابط"
            );


        const message = {

            url:mediaUrl,

            senderId:
                currentUser.uid,

            receiverId:
                friendUser.uid,

            type,

            read:false,

            deletedFor:[],

            createdAt:
                serverTimestamp()

        };


        if(replyTarget){

            message.replyTo = {

                messageId:
                    replyTarget.id,

                senderId:
                    replyTarget.senderId,

                senderName:
                    replyTarget.senderName,

                text:
                    replyTarget.text

            };

        }


        await addDoc(
            collection(
                db,
                "chats",
                chatID,
                "messages"
            ),
            message
        );


        cancelReply();


    }catch(error){

        console.error(
            "Upload error:",
            error
        );

        alert(
            "فشل رفع الملف"
        );

    }

}

async function loadFriend(){

        );

        params.get("friend");


    if(!friendId)
        throw new Error(
            "لا يوجد صديق في الرابط"
        );


    if(
        friendId ===
        currentUser.uid
    )
        throw new Error(
            "لا يمكنك فتح محادثة مع نفسك"
        );


    const snap =
        await getDoc(
            doc(
                db,
                "users",
                friendId
            )
        );


    if(!snap.exists())
        throw new Error(
            "المستخدم غير موجود"
        );


    const data =
        snap.data();


    friendUser = {

        uid:friendId,

        name:
            data.name ||
            data.displayName ||
            "مستخدم",

        photo:
            data.photo ||
            data.photoURL ||
            ""

    };


    friendName.textContent =
        friendUser.name;


    setUserAvatar(
        friendAvatar,
        friendUser
    );


    chatID =
        createChatID(
            currentUser.uid,
            friendUser.uid
        );


    listenFriendStatus();

}

            updateInputState();

        }catch(error){

            console.error(error);

            loading.textContent =
                error.message ||
                "حدث خطأ أثناء فتح الدردشة";

        }

    }
);

</script>

</body>
</html>
