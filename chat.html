<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
overflow:hidden
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}

.avatar,
.call-avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0
}

.avatar img,
.call-avatar img,
.local-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.user-status.recording{
font-weight:bold
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer
}

/* شريط الرسالة المثبتة */
#pinnedBanner{
background:#0b1512;
border-bottom:1px solid rgba(0,232,137,.18);
padding:8px 15px;
display:none;
align-items:center;
justify-content:space-between;
font-size:13px;
cursor:pointer;
z-index:9
}

#pinnedBanner .pin-content{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#00e889;
flex:1;
margin-left:10px
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:10px
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8
}

.message{
max-width:78%;
padding:10px 13px;
border-radius:18px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
user-select:none;
line-height:1.5;
align-self:flex-start;
min-width:0;
overflow:visible !important;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px
}

/* اقتباس الرد داخل الرسالة */
.reply-quote{
background:rgba(0,0,0,.15);
border-right:3px solid #00e889;
padding:4px 8px;
border-radius:6px;
font-size:11px;
margin-bottom:6px;
opacity:.9;
cursor:pointer
}

.message.other .reply-quote{
background:rgba(255,255,255,.05);
border-right-color:#00c96b
}

/* تفاعلات الرسائل */
.reactions-badge{
position:absolute;
bottom:-10px;
right:10px;
background:#0b1512;
border:1px solid rgba(0,232,137,.3);
border-radius:12px;
padding:2px 6px;
font-size:12px;
display:flex;
gap:3px;
box-shadow:0 2px 6px rgba(0,0,0,.4);
z-index:2
}

.message.mine .reactions-badge{
right:auto;
left:10px;
background:#00150e;
color:#fff
}

.time{
display:block;
font-size:9px;
opacity:.6;
margin-top:5px
}

.message-meta{
display:flex;
align-items:center;
gap:5px;
margin-top:5px
}

.message-status{
font-size:12px;
font-weight:bold;
direction:ltr
}

.message-status.read{
color:#006dff
}

/* معاينة الرد فوق حقل الكتابة */
#replyPreviewBar{
background:#0b1512;
border-top:1px solid rgba(0,232,137,.18);
padding:8px 15px;
display:none;
align-items:center;
justify-content:space-between;
font-size:12px;
z-index:49
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50
}

#messageInput{
flex:1;
min-width:0;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;
font-size:15px
}

#messageInput:focus{
border-color:#00e889
}

#voiceButton,
#sendButton,
#attachButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
flex-shrink:0
}

#attachButton{
background:#18231f;
color:#fff;
font-size:28px;
transition:.15s
}

#attachButton:active{
transform:scale(.92)
}

#voiceButton{
background:#18231f;
color:#fff;
transition:.18s
}

#voiceButton.recording{
background:#321817;
color:#ff5555;
transform:scale(1.05)
}

#sendButton{
background:#00e889;
color:#00150e
}

#sendButton:disabled{
opacity:.6
}

#attachMenu{
position:fixed;
bottom:70px;
right:10px;
width:175px;
padding:7px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:17px;
box-shadow:0 10px 35px rgba(0,0,0,.55);
display:none;
z-index:1000
}

#attachMenu.show{
display:block
}

.attach-option{
width:100%;
height:45px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
font-size:14px;
font-weight:bold;
cursor:pointer;
margin-bottom:5px
}

.attach-option:last-child{
margin-bottom:0
}

.attach-option:active{
transform:scale(.98)
}

.attach-icon{
font-size:20px;
width:28px;
text-align:center
}

.hidden-file{
display:none!important
}

/* قائمة خيارات الرسالة والتفاعلات */
.message-menu{
position:absolute !important;
left:50% !important;
bottom:calc(100% + 8px) !important;
transform:translateX(-50%) !important;
width:180px !important;
padding:5px !important;
background:#0b1512 !important;
border:1px solid rgba(0,232,137,.18) !important;
border-radius:15px !important;
box-shadow:0 8px 25px rgba(0,0,0,.55) !important;
z-index:999999 !important;
display:block !important;
}

.reactions-picker{
display:flex;
justify-content:space-around;
padding:8px 4px;
background:#121e1a;
border-radius:10px;
margin-bottom:6px;
cursor:pointer;
font-size:18px
}

.message-menu button{
width:100% !important;
height:auto !important;
min-height:36px !important;
padding:8px 12px !important;
border:0 !important;
border-radius:9px !important;
background:#18231f !important;
color:#fff !important;
font-size:13px !important;
font-weight:bold !important;
cursor:pointer !important;
display:block !important;
margin-bottom:4px;
text-align:right
}

.message-menu button:hover{
background:#22332d !important;
}

.image-message,
.video-message{
padding:6px !important;
width:max-content !important;
max-width:82vw !important;
overflow:visible !important;
display:flex !important;
flex-direction:column !important;
align-items:flex-start !important;
box-sizing:border-box !important;
}

.message-image,
.message-video{
display:block !important;
width:auto !important;
height:auto !important;
max-width:100% !important;
max-height:360px !important;
border-radius:14px !important;
object-fit:contain !important;
cursor:pointer !important;
}

/* تخصيص الرسائل الصوتية القادمة من voice.js */
.voice-message{
align-self:flex-start !important;
display:block !important;
width:330px !important;
max-width:calc(100% - 20px) !important;
min-width:250px !important;
padding:8px 10px 7px !important;
border-radius:18px !important;
position:relative !important;
background:linear-gradient(135deg,#162923,#0d1714) !important;
border:1px solid rgba(0,232,137,.16) !important;
box-shadow:0 5px 18px rgba(0,0,0,.16);
}

.message.mine.voice-message{
background:linear-gradient(135deg,#087e50,#00a866) !important;
color:#fff;
}

top:85px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));

background:#101815;
border:1px solid rgba(255,255,255,.1);

align-items:center;
justify-content:space-between;

align-items:center;
gap:11px;

.incoming-name{
font-size:15px;
font-weight:bold

.incoming-type{
font-size:12px;
color:#9aa7a3;
margin-top:4px
}

.incoming-actions{
display:flex;
gap:9px

.incoming-actions button{
width:46px;
height:46px;
border:0;
border-radius:50%;
font-size:20px;
color:#fff;
cursor:pointer
}

#rejectIncoming{
background:#d83b3b

#acceptIncoming{
background:#00e889;
color:#00150e
}

#callScreen{
position:fixed;
inset:0;
background:#020504;
z-index:10000;
display:none;
flex-direction:column;
overflow:hidden

.call-top{
height:85px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)

.call-top-info{
text-align:center
}

#callTitle{
font-size:20px;
font-weight:bold
}

#callState{
font-size:13px;
color:#00e889;
margin-top:6px
}

#callDuration{
font-size:12px;
color:#9aa7a3;
margin-top:4px
}

#audioCallView{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#020504

#videoArea{
position:relative;
flex:1;
background:#000;
overflow:hidden;
display:none

#remoteVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
display:none
}

#remoteAvatar{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#07110f;
z-index:1

#remoteAvatar img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover

#localVideo{
position:absolute;
width:110px;
height:145px;
left:16px;
top:95px;
object-fit:cover;
border-radius:18px;
border:2px solid rgba(255,255,255,.7);
background:#111;
z-index:5;
display:none

#localAvatar{
position:absolute;
width:110px;
height:110px;
left:16px;
top:110px;
border-radius:50%;
background:#12352c;
z-index:6;
display:none;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:40px

.call-controls{
min-height:100px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
background:rgba(5,8,7,.98);

.call-control{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#18231f;
color:#fff;
font-size:22px;

.call-control.accept{
background:#00e889;
color:#00150e

.call-control.reject,
.call-control.end{

.call-control.active{

color:#00150e
}

}

function escapeHtml(value){
return String(value ?? "").replace(/[&<>'"]/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));
}

function formatTime(timestamp){
if(!timestamp?.toDate) return "";
try{
return timestamp.toDate().toLocaleTimeString("ar", { hour:"2-digit", minute:"2-digit" });
}catch{ return ""; }
}

function formatDuration(seconds){
seconds = Math.max(0, Math.floor(Number(seconds || 0)));
const m = Math.floor(seconds / 60);
const s = seconds % 60;
return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

function showApp(){
loading.style.display = "none";
app.style.display = "flex";
requestNotificationPermission();
}

function requestNotificationPermission(){
if("Notification" in window && Notification.permission !== "granted"){
Notification.requestPermission();
}
}

function showExternalNotification(title, body){
if("Notification" in window && Notification.permission === "granted" && document.hidden){
try{
new Notification(title, { body, icon: friendUser?.photo || "" });
}catch(e){console.warn(e);}
}
}

async function updateMyPresence(online = true){
if(!currentUser) return;
try{
await setDoc(doc(db, "users", currentUser.uid), {
online,
lastSeen: serverTimestamp()
}, { merge:true });
}catch(e){console.error(e);}
}

function startPresence(){
updateMyPresence(true);
clearInterval(presenceInterval);
presenceInterval = setInterval(() => {
if(document.visibilityState === "visible"){
updateMyPresence(true);
}
}, 10000);
}

function stopPresence(){
clearInterval(presenceInterval);
presenceInterval = null;
updateMyPresence(false);
}

async function loadFriend(){
const friendId = new URLSearchParams(location.search).get("friend");
if(!friendId) throw new Error("لا يوجد صديق في الرابط");
if(friendId === currentUser.uid) throw new Error("لا يمكنك فتح محادثة مع نفسك");

const snap = await getDoc(doc(db, "users", friendId));
if(!snap.exists()) throw new Error("المستخدم غير موجود");

const data = snap.data();
friendUser = {
uid: friendId,
name: data.name || "مستخدم Mecd",
photo: data.photo || data.photoURL || ""
};

friendName.textContent = friendUser.name;
setUserAvatar(friendAvatar, friendUser);

chatID = createChatID(currentUser.uid, friendUser.uid);

await setDoc(doc(db, "chats", chatID), {
members: [currentUser.uid, friendUser.uid],
createdAt: serverTimestamp()
}, { merge:true });

listenFriendStatus();
listenFriendActivity();
listenChatMeta();
}

function renderFriendStatus(){
friendStatus.classList.remove("online", "typing", "recording");

if(friendRecording){
friendStatus.textContent = "🎤 يسجل صوت...";
friendStatus.classList.add("recording");
return;
}
if(friendTyping){
friendStatus.textContent = "يكتب...";
friendStatus.classList.add("typing");
return;
}
if(friendOnline){
friendStatus.textContent = "● متصل";
friendStatus.classList.add("online");
}else{
if(lastSeenTime){
const diffMins = Math.floor((Date.now() - lastSeenTime) / 60000);
if(diffMins < 1){
friendStatus.textContent = "● آخر ظهور منذ لحظات";
}else if(diffMins < 60){
friendStatus.textContent = `● آخر ظهور منذ ${diffMins} دقيقة`;
}else{
const date = new Date(lastSeenTime);
friendStatus.textContent = `● آخر ظهور ${date.toLocaleTimeString("ar", {hour:"2-digit", minute:"2-digit"})}`;
}
}else{
friendStatus.textContent = "● غير متصل";
}
}
}

function listenFriendStatus(){
if(unsubscribeFriendStatus) unsubscribeFriendStatus();
unsubscribeFriendStatus = onSnapshot(doc(db, "users", friendUser.uid), snap => {
if(!snap.exists()){
friendOnline = false;
renderFriendStatus();
return;
}
const data = snap.data();
const last = data.lastSeen?.toMillis?.() || 0;
lastSeenTime = last;
friendOnline = (data.online === true && last > 0 && Date.now() - last < 30000);
renderFriendStatus();
});
}

function listenFriendActivity(){
if(unsubscribeFriendActivity) unsubscribeFriendActivity();
unsubscribeFriendActivity = onSnapshot(doc(db, "chats", chatID, "typing", friendUser.uid), snap => {
if(!snap.exists()){
friendTyping = false;
friendRecording = false;
renderFriendStatus();
return;
}
const data = snap.data();
const updated = data.updatedAt?.toMillis?.() || 0;
const fresh = (!updated || Date.now() - updated < 5000);
friendRecording = fresh && data.recording === true;
friendTyping = fresh && data.typing === true && !friendRecording;
renderFriendStatus();
});
}

function listenChatMeta(){
if(unsubscribeChatMeta) unsubscribeChatMeta();
unsubscribeChatMeta = onSnapshot(doc(db, "chats", chatID), snap => {
if(!snap.exists()) return;
const data = snap.data();
if(data.pinnedMessage){
pinnedText.textContent = data.pinnedMessage.text || "مرفق وسائط مثبت";
pinnedBanner.style.display = "flex";
pinnedBanner.onclick = () => {
const el = messageElements.get(data.pinnedMessage.id);
if(el){
el.scrollIntoView({ behavior: "smooth", block: "center" });
el.style.transition = "background .5s";
el.style.background = "rgba(0,232,137,.3)";
setTimeout(() => el.style.background = "", 1500);
}
};
}else{
pinnedBanner.style.display = "none";
}
});
}

unpinBtn.onclick = async e => {
e.stopPropagation();
await updateDoc(doc(db, "chats", chatID), { pinnedMessage: null });
};

async function updateMyActivity(type){
if(!currentUser || !chatID) return;
try{
await setDoc(doc(db, "chats", chatID, "typing", currentUser.uid), {
typing: type === "typing",
recording: type === "recording",
updatedAt: serverTimestamp()
}, { merge:true });
}catch(e){console.error(e);}
}

messageInput.addEventListener("input", () => {
clearTimeout(typingTimer);
if(!messageInput.value.trim()){
typingState = false;
updateMyActivity("none");
return;
}
if(!typingState){
typingState = true;
updateMyActivity("typing");
}
typingTimer = setTimeout(() => {
typingState = false;
updateMyActivity("none");
}, 1200);
});

// **إعادة ربط voice.js بدقة وتمرير المتغيرات المطلوبة**
async function connectVoiceJS(){
try{
window.chatDB = db;
window.chatID = chatID;
window.chatUser = currentUser;
window.chatFriend = friendUser;
await import("./voice.js");
}catch(e){console.warn("voice.js not loaded:", e);}

const voiceObserver = new MutationObserver(() => {
const recording = voiceButton.classList.contains("recording");
if(recording === voiceRecording) return;
voiceRecording = recording;
if(recording){
typingState = false;
updateMyActivity("recording");
}else{
updateMyActivity(messageInput.value.trim() ? "typing" : "none");
}
});
voiceObserver.observe(voiceButton, { attributes:true });

attachButton.onclick = e => {
e.stopPropagation();
attachMenu.classList.toggle("show");
};

document.addEventListener("pointerdown", e => {
if(!e.target.closest("#attachMenu") && !e.target.closest("#attachButton")){

});

galleryButton.onclick = () => {

cameraButton.onclick = () => {

cameraInput.value = "";

};

async function uploadMediaToSupabase(file){
if(!file) throw new Error("لم يتم اختيار ملف.");
const extension = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : (file.type.startsWith("video/") ? "mp4" : "jpg");
const filePath = `${currentUser.uid}/${Date.now()}_${crypto.randomUUID()}.${extension}`;
const { error: uploadError } = await supabase.storage.from(SUPABASE_BUCKET).upload(filePath, file, { cacheControl:"3600", contentType:file.type, upsert:false });
if(uploadError) throw new Error("تعذر رفع الملف");
const { data: publicData } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(filePath);
return { url: publicData.publicUrl, path: filePath, type: file.type, size: file.size, name: file.name || "" };
}

async function sendMediaFile(file){
if(!file || !currentUser || !friendUser || !chatID) return;
sendButton.disabled = true;
try{
const isVideo = file.type.startsWith("video/");
const media = await uploadMediaToSupabase(file);
const fileType = isVideo ? "video" : "image";

const payload = {
type: fileType,
[fileType]: media.url,
storagePath: media.path,
storageBucket: SUPABASE_BUCKET,
fileName: media.name,
mimeType: media.type,
fileSize: Number(media.size || 0),
senderId: currentUser.uid,
receiverId: friendUser.uid,
read: false,
deletedFor: [],
reactions: {},
createdAt: serverTimestamp()
};

if(replyingToMessage){
payload.replyTo = {
id: replyingToMessage.id,
text: replyingToMessage.text || (replyingToMessage.type === "image" ? "📷 صورة" : "🎥 فيديو"),
senderName: replyingToMessage.senderId === currentUser.uid ? "أنت" : friendUser.name
};
cancelReply();
}

await addDoc(collection(db, "chats", chatID, "messages"), payload);
await setDoc(doc(db, "chats", chatID), {
lastMessage: fileType === "video" ? "🎥 فيديو" : "📷 صورة",
lastMessageAt: serverTimestamp(),
lastSenderId: currentUser.uid
}, { merge:true });
}catch(e){
alert(e.message || "تعذر إرسال الملف");
}finally{
sendButton.disabled = false;
}
}

galleryInput.addEventListener("change", async () => {
const file = galleryInput.files?.[0];
if(file) await sendMediaFile(file);
galleryInput.value = "";
});

cameraInput.addEventListener("change", async () => {
const file = cameraInput.files?.[0];
if(file) await sendMediaFile(file);
cameraInput.value = "";
});

function createStatus(data){
if(data.senderId !== currentUser.uid) return null;
const status = document.createElement("span");
status.className = "message-status " + (data.read === true ? "read" : "sent");
status.textContent = data.read === true ? "✓✓" : "✓";
return status;
}

async function markRead(id, data){
if(data.senderId === currentUser.uid || data.read === true) return;
try{
await updateDoc(doc(db, "chats", chatID, "messages", id), {
read: true,
readAt: serverTimestamp()
});
}catch(e){console.error(e);}
}

function cancelReply(){
replyingToMessage = null;
replyPreviewBar.style.display = "none";
}
cancelReplyBtn.onclick = cancelReply;

function removeMenus(){
document.querySelectorAll(".message-menu").forEach(x => x.remove());
}

async function deleteMessageForMe(id){
if(!currentUser || !chatID || !id) return;
try{
await updateDoc(doc(db, "chats", chatID, "messages", id), {
deletedFor: arrayUnion(currentUser.uid)
});
const element = messageElements.get(id);
if(element){
element.remove();
messageElements.delete(id);
}
}catch(e){
alert("تعذر حذف الرسالة");
}
}

async function deleteMessageForEveryone(id){
if(!currentUser || !chatID || !id) return;
try{
await deleteDoc(doc(db, "chats", chatID, "messages", id));
}catch(e){
alert("تعذر حذف الرسالة");
}
}

function showMessageMenu(element, id, mine, messageType, currentText, fullMessageData){
removeMenus();
const menu = document.createElement("div");
menu.className = "message-menu";

const picker = document.createElement("div");
picker.className = "reactions-picker";
["❤️", "👍", "🔥", "😂", "😮"].forEach(emoji => {
const btn = document.createElement("span");
btn.textContent = emoji;
btn.style.cursor = "pointer";
btn.onclick = async e => {
e.stopPropagation();
removeMenus();
const currentReactions = fullMessageData.reactions || {};
currentReactions[currentUser.uid] = emoji;
await updateDoc(doc(db, "chats", chatID, "messages", id), { reactions: currentReactions });
};
picker.appendChild(btn);
});
menu.appendChild(picker);

const replyBtn = document.createElement("button");
replyBtn.textContent = "↩️ رد";
replyBtn.onclick = e => {
e.stopPropagation();
removeMenus();
replyingToMessage = { id, text: currentText, type: messageType, senderId: fullMessageData.senderId };
replyingToName.textContent = fullMessageData.senderId === currentUser.uid ? "أنت" : friendUser.name;
replyingToText.textContent = currentText || (messageType === "image" ? "صورة" : "ملف");
replyPreviewBar.style.display = "flex";
messageInput.focus();
};
menu.appendChild(replyBtn);

const pinBtn = document.createElement("button");
pinBtn.textContent = "📌 تثبيت الرسالة";
pinBtn.onclick = async e => {
e.stopPropagation();
removeMenus();
await updateDoc(doc(db, "chats", chatID), {
pinnedMessage: { id, text: currentText || "ملف مرفق" }
});
};
menu.appendChild(pinBtn);

if (mine && messageType === "text") {
const editBtn = document.createElement("button");
editBtn.textContent = "✏️ تعديل";
editBtn.onclick = async e => {
e.stopPropagation();
removeMenus();
const newText = prompt("تعديل الرسالة:", currentText);
if (newText !== null && newText.trim() !== "" && newText.trim() !== currentText) {
try {
await updateDoc(doc(db, "chats", chatID, "messages", id), {
text: newText.trim(),
isEdited: true
});
} catch (err) {
alert("تعذر تعديل الرسالة");
}
}
};
menu.appendChild(editBtn);
}

const deleteBtn = document.createElement("button");
deleteBtn.textContent = mine ? "🗑️ حذف للجميع" : "🗑️ حذف لدي";
deleteBtn.onclick = async e => {
e.stopPropagation();
if(mine) await deleteMessageForEveryone(id);
else await deleteMessageForMe(id);
removeMenus();
};
menu.appendChild(deleteBtn);

element.appendChild(menu);
}

function addMessageActions(element, id, mine, messageType, text, data){
let timer = null;
const cancel = () => clearTimeout(timer);
element.addEventListener("pointerdown", e => {
if(e.target.closest(".message-menu")) return;
timer = setTimeout(() => {
showMessageMenu(element, id, mine, messageType, text, data);
}, 500);
});
element.addEventListener("pointerup", cancel);
element.addEventListener("pointercancel", cancel);
element.addEventListener("contextmenu", e => {
e.preventDefault();
showMessageMenu(element, id, mine, messageType, text, data);
});
}

document.addEventListener("pointerdown", e => {
if(!e.target.closest(".message-menu")) removeMenus();
});

const messageElements = new Map();

function renderMessages(snapshot){
const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 120;

snapshot.docChanges().forEach(change => {
const id = change.doc.id;
const data = change.doc.data();

if(change.type === "removed"){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(data.senderId !== currentUser.uid){
markRead(id, data);
if(change.type === "added" && !data.read){
showExternalNotification(friendUser.name, data.text || "أرسل لك مرفقاً جديداً");
}
}

const box = document.createElement("div");
box.className = "message " + (data.senderId === currentUser.uid ? "mine" : "other");

if(data.replyTo){
const quote = document.createElement("div");
quote.className = "reply-quote";
quote.innerHTML = `<strong>${escapeHtml(data.replyTo.senderName)}</strong><br>${escapeHtml(data.replyTo.text)}`;
box.appendChild(quote);
}

if(data.type === "text"){
box.innerHTML += escapeHtml(data.text || "");
if(data.isEdited){
box.innerHTML += ' <span style="font-size:9px; opacity:0.6;">(معدلة)</span>';
}
}else if(data.type === "image"){
const img = document.createElement("img");
img.className = "message-image";
img.src = data.image || "";
box.appendChild(img);
}else if(data.type === "video"){
const vid = document.createElement("video");
vid.className = "message-video";
vid.src = data.video || "";
vid.controls = true;
box.appendChild(vid);
}

if(data.reactions && Object.keys(data.reactions).length > 0){
const badge = document.createElement("div");
badge.className = "reactions-badge";
const uniqueEmojis = [...new Set(Object.values(data.reactions))];
badge.textContent = uniqueEmojis.join(" ");
box.appendChild(badge);
}

const meta = document.createElement("div");
meta.className = "message-meta";
const time = document.createElement("span");
time.className = "time";
time.textContent = formatTime(data.createdAt);
meta.appendChild(time);

const status = createStatus(data);
if(status) meta.appendChild(status);
box.appendChild(meta);

addMessageActions(box, id, data.senderId === currentUser.uid, data.type, data.text, data);

const old = messageElements.get(id);
if(old){
old.replaceWith(box);
}else{
messages.appendChild(box);
}
messageElements.set(id, box);
});

const all = messages.querySelectorAll(".message");
const empty = messages.querySelector(".empty");
if(all.length) empty?.remove();

if(nearBottom){
requestAnimationFrame(() => {
messages.scrollTop = messages.scrollHeight;
});
}
}

function listenMessages(){
if(!chatID) return;
const q = query(collection(db, "chats", chatID, "messages"), orderBy("createdAt", "asc"));
if(unsubscribeMessages) unsubscribeMessages();
unsubscribeMessages = onSnapshot(q, renderMessages, e => console.error(e));
}

async function sendMessage(){
const text = messageInput.value.trim();
if(!text || !currentUser || !friendUser || !chatID) return;
sendButton.disabled = true;

try{
const payload = {
text,
senderId: currentUser.uid,
receiverId: friendUser.uid,
type: "text",
read: false,
deletedFor: [],
reactions: {},
createdAt: serverTimestamp()
};

if(replyingToMessage){
payload.replyTo = {
id: replyingToMessage.id,
text: replyingToMessage.text,
senderName: replyingToMessage.senderId === currentUser.uid ? "أنت" : friendUser.name
};
cancelReply();
}

await addDoc(collection(db, "chats", chatID, "messages"), payload);
await setDoc(doc(db, "chats", chatID), {
lastMessage: text,
lastMessageAt: serverTimestamp(),
lastSenderId: currentUser.uid
}, { merge:true });

messageInput.value = "";
updateMyActivity("none");
}catch(e){
alert("حدث خطأ أثناء إرسال الرسالة");
}finally{
sendButton.disabled = false;
messageInput.focus();
}
}

sendButton.onclick = sendMessage;
messageInput.addEventListener("keydown", e => {
if(e.key === "Enter"){
e.preventDefault();
sendMessage();
}
});

backButton.onclick = async () => {
await updateMyActivity("none");
if(unsubscribeMessages) unsubscribeMessages();
if(unsubscribeFriendStatus) unsubscribeFriendStatus();
if(unsubscribeFriendActivity) unsubscribeFriendActivity();
if(unsubscribeIncomingCalls) unsubscribeIncomingCalls();
if(unsubscribeChatMeta) unsubscribeChatMeta();
stopPresence();
history.back();
};

document.addEventListener("visibilitychange", () => {
if(!currentUser) return;
if(document.visibilityState === "visible"){
updateMyPresence(true);
}else{
updateMyPresence(false);
updateMyActivity("none");
}
});

window.addEventListener("pagehide", () => {
if(!currentUser) updateMyPresence(false);
});

onAuthStateChanged(auth, async user => {
if(!user){
loading.textContent = "يجب تسجيل الدخول أولاً";
return;
}
currentUser = user;
try{
startPresence();
await loadFriend();
listenMessages();
await connectVoiceJS(); // تشغيل واستدعاء ملف voice.js المعالج للملفات الصوتية
showApp();
}catch(e){
loading.textContent = e.message || "حدث خطأ";
}
});
