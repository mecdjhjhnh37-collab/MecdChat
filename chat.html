<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<meta name="mobile-web-app-capable" content="yes">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35 0%,transparent 42%),
linear-gradient(180deg,#07110f,#020504);
font-size:16px
}

button,input{
font:inherit
}

button{
-webkit-user-select:none;
user-select:none
}

.app{
width:100%;
height:100dvh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:rgba(2,5,4,.45)
}

/* ================= HEADER ================= */

header{
height:70px;
min-height:70px;
display:flex;
align-items:center;
gap:10px;
padding:8px 12px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
z-index:50
}

.back{
width:42px;
height:42px;
border:0;
border-radius:13px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer;
flex-shrink:0
}

.back:active,
.call-buttons button:active,
.attach-button:active,
.send-button:active{
transform:scale(.94)
}

.avatar{
width:46px;
height:46px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:23px;
flex-shrink:0;
cursor:pointer
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.user-info{
flex:1;
min-width:0;
cursor:pointer
}

.user-name{
font-size:16px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:11px;
color:#7d8985;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.call-buttons{
display:flex;
align-items:center;
gap:6px;
flex-shrink:0
}

.call-buttons button{
width:39px;
height:39px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
font-size:17px;
cursor:pointer
}

.more-button{
width:38px!important;
font-size:21px!important
}

/* ================= PINNED ================= */

.pinned-banner{
display:none;
align-items:center;
gap:9px;
padding:8px 13px;
background:#0b1613;
border-bottom:1px solid rgba(0,232,137,.15);
z-index:40
}

.pinned-banner.show{
display:flex
}

.pinned-banner-content{
flex:1;
min-width:0;
display:flex;
align-items:center;
gap:8px;
cursor:pointer
}

.pinned-banner-text{
color:#00e889;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.pinned-banner-close{
background:none;
border:0;
color:#aaa;
font-size:14px;
cursor:pointer
}

/* ================= MESSAGES ================= */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:18px 13px 125px;
display:flex;
flex-direction:column;
gap:13px;
scroll-behavior:smooth;
overscroll-behavior:contain
}

.messages::-webkit-scrollbar{
width:4px
}

.messages::-webkit-scrollbar-thumb{
background:#26332e;
border-radius:10px
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
font-size:14px
}

.message{
position:relative;
max-width:78%;
min-width:45px;
padding:9px 12px 25px;
border-radius:17px;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.5;
user-select:none;
-webkit-user-select:none;
transition:transform .12s ease,background-color .2s ease;
box-shadow:0 2px 7px rgba(0,0,0,.12)
}

/* رسائل المستخدم */
.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

/* رسائل الطرف الآخر */
.message.other{
align-self:flex-end;
background:#18231f;
color:#fff;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px
}

.message.highlight{
background:#00e889!important;
color:#00150e!important
}

.message-text{
white-space:pre-wrap
}

/* ================= TIME / TICKS ================= */

.message-meta{
position:absolute;
bottom:5px;
left:10px;
display:flex;
align-items:center;
gap:4px;
direction:ltr
}

.message.other .message-meta{
left:auto;
right:10px
}

.time{
font-size:9px;
opacity:.62;
white-space:nowrap
}

.message-status{
font-size:10px;
font-weight:bold;
line-height:1
}

.message-status.read{
color:#006dff
}

/* ================= MEDIA ================= */

.message.image-message,
.message.video-message{
padding:7px 7px 27px!important;
width:max-content;
max-width:82%;
background:#18231f!important
}

.message.mine.image-message,
.message.mine.video-message{
background:#00c96b!important
}

.message-image,
.message-video{
display:block;
width:auto;
max-width:270px;
max-height:310px;
border-radius:12px;
object-fit:cover;
cursor:pointer
}

/* ================= REPLY ================= */

.message-reply{
display:flex;
gap:7px;
margin-bottom:7px;
padding:5px 7px;
border-radius:9px;
background:rgba(0,0,0,.15);
border-right:3px solid #00e889;
font-size:11px;
cursor:pointer;
min-width:0
}

.message.other .message-reply{
background:rgba(255,255,255,.06)
}

.reply-content{
min-width:0;
overflow:hidden
}

.reply-name{
font-weight:bold;
font-size:10px;
color:#00e889;
margin-bottom:2px
}

.message.mine .reply-name{
color:#003d27
}

.reply-text{
opacity:.78;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* ================= REACTIONS ================= */

.message-reactions{
position:absolute;
bottom:-10px;
right:9px;
display:flex;
align-items:center;
flex-wrap:wrap;
gap:3px;
z-index:5
}

.message.mine .message-reactions{
right:auto;
left:9px
}

.reaction-chip{
display:flex;
align-items:center;
gap:2px;
border:1px solid rgba(255,255,255,.12);
background:#0b1613;
border-radius:12px;
padding:1px 5px;
font-size:11px;
color:#fff;
cursor:pointer
}

.reaction-chip.mine{
border-color:rgba(0,232,137,.55);
background:rgba(0,232,137,.25)
}

.reaction-count{
font-size:9px;
opacity:.9
}

.heart-pop{
position:absolute;
bottom:8px;
right:15px;
font-size:22px;
animation:heartPop .45s ease forwards;
pointer-events:none;
z-index:30
}

.message.mine .heart-pop{
right:auto;
left:15px
}

@keyframes heartPop{
0%{transform:scale(0);opacity:0}
55%{transform:scale(1.35);opacity:1}
100%{transform:scale(1);opacity:1}
}

/* ================= INPUT ================= */

.input-area{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:9px 9px calc(9px + env(safe-area-inset-bottom));
display:flex;
align-items:center;
gap:7px;
background:#050807;
border-top:1px solid rgba(255,255,255,.07);
z-index:80
}

.message-input-wrap{
flex:1;
min-width:0;
height:49px;
display:flex;
align-items:center;
gap:5px;
padding:4px 7px;
background:#111916;
border:1px solid #27332f;
border-radius:18px
}

.message-input-wrap:focus-within{
border-color:#00e889
}

#messageInput{
flex:1;
min-width:0;
height:40px;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:15px
}

#messageInput::placeholder{
color:#77817d
}

.emoji-button{
width:34px;
height:34px;
border:0;
background:transparent;
color:#9ba5a1;
font-size:21px;
cursor:pointer
}

.attach-button,
.send-button,
.voice-button{
width:48px;
height:48px;
border:0;
border-radius:16px;
cursor:pointer;
flex-shrink:0
}

.attach-button{
background:#18231f;
color:#fff;
font-size:24px
}

.send-button{
background:#00e889;
color:#00150e;
font-size:21px
}

.voice-button{
background:#18231f;
color:#fff;
font-size:21px
}

.voice-button.recording{
background:#d93636;
color:#fff;
animation:pulse .9s infinite
}

@keyframes pulse{
50%{transform:scale(.92)}
}

/* ================= ATTACHMENT SHEET ================= */

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:1000;
display:none
}

.overlay.show{
display:block
}

.attachment-sheet{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
background:#111b18;
border-radius:24px 24px 0 0;
padding:14px 17px calc(22px + env(safe-area-inset-bottom));
box-shadow:0 -12px 40px rgba(0,0,0,.7);
animation:sheetUp .22s ease
}

@keyframes sheetUp{
from{transform:translate(-50%,100%)}
to{transform:translate(-50%,0)}
}

.sheet-handle{
width:42px;
height:4px;
background:#53615c;
border-radius:5px;
margin:0 auto 20px
}

.attachment-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:13px
}

.attachment-option{
border:0;
background:transparent;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
gap:7px;
font-size:11px;
cursor:pointer
}

.attachment-icon{
width:53px;
height:53px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:23px
}

.icon-document{background:#2879d9}
.icon-camera{background:#b53bd0}
.icon-gallery{background:#e88b24}
.icon-audio{background:#12a96c}
.icon-location{background:#dc4b4b}
.icon-contact{background:#5b6bd6}

/* ================= CONTEXT MENU ================= */

.context-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
z-index:2000;
display:none;
align-items:center;
justify-content:center;
padding:15px
}

.context-overlay.show{
display:flex
}

.context-box{
width:min(390px,100%);
background:rgba(20,30,27,.94);
border:1px solid rgba(255,255,255,.1);
border-radius:22px;
padding:12px;
box-shadow:0 20px 60px rgba(0,0,0,.8);
backdrop-filter:blur(18px);
animation:contextIn .18s ease
}

@keyframes contextIn{
from{transform:scale(.94);opacity:0}
to{transform:scale(1);opacity:1}
}

.context-preview{
padding:8px 4px 12px
}

.context-reactions{
display:flex;
justify-content:space-around;
padding:9px;
background:rgba(255,255,255,.05);
border-radius:17px;
margin-bottom:9px
}

.context-reaction{
border:0;
background:transparent;
font-size:23px;
cursor:pointer;
transition:.15s
}

.context-reaction:active{
transform:scale(1.3)
}

.context-actions{
display:flex;
flex-direction:column;
gap:5px
}

.context-action{
width:100%;
height:44px;
border:0;
border-radius:12px;
background:rgba(255,255,255,.055);
color:#fff;
display:flex;
align-items:center;
gap:12px;
padding:0 13px;
text-align:right;
font-size:14px;
cursor:pointer
}

.context-action:active{
background:rgba(0,232,137,.14)
}

/* ================= PROFILE CARD ================= */

.profile-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
z-index:1500;
display:none;
align-items:flex-end
}

.profile-overlay.show{
display:flex
}

.profile-card{
width:100%;
max-width:650px;
margin:auto;
background:#111b18;
border-radius:25px 25px 0 0;
padding:14px 18px calc(24px + env(safe-area-inset-bottom));
animation:sheetUp .22s ease;
box-shadow:0 -15px 50px rgba(0,0,0,.7)
}

.profile-handle{
width:42px;
height:4px;
background:#52605b;
border-radius:5px;
margin:0 auto 18px
}

.profile-top{
display:flex;
align-items:center;
gap:14px;
padding-bottom:18px;
border-bottom:1px solid rgba(255,255,255,.08)
}

.profile-avatar{
width:70px;
height:70px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
overflow:hidden;
flex-shrink:0
}

.profile-avatar img{
width:100%;
height:100%;
object-fit:cover
}

.profile-name{
font-size:19px;
font-weight:bold
}

.profile-status{
font-size:12px;
color:#00e889;
margin-top:5px
}

.profile-actions{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
margin-top:15px
}

.profile-action{
height:58px;
border:0;
border-radius:14px;
background:#182521;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
font-size:11px;
cursor:pointer
}

.profile-action span{
font-size:20px
}

/* ================= EMOJI ================= */

.emoji-panel{
position:absolute;
bottom:67px;
right:9px;
width:280px;
max-width:calc(100% - 18px);
background:#111b18;
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:10px;
display:none;
z-index:100
}

.emoji-panel.show{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:4px
}

.emoji-panel button{
height:32px;
border:0;
background:transparent;
font-size:20px;
cursor:pointer
}

/* ================= FILE ================= */

.hidden-file{
display:none!important
}

/* ================= LOADING ================= */

#loading{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#020504;
color:#fff;
z-index:999999;
gap:14px
}

.loading-spinner{
width:32px;
height:32px;
border:3px solid rgba(255,255,255,.12);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

/* ================= ERROR ================= */

.error-box{
padding:25px;
text-align:center;
color:#fff
}

.error-box button{
margin-top:15px;
padding:10px 18px;
border:0;
border-radius:12px;
background:#00e889;
color:#00150e;
font-weight:bold
}
</style>
</head>

<!-- Input -->

</main>

<button id="audioButton" class="attachment-option" type="button">

</button>

<button id="locationButton" class="attachment-option" type="button">
<span class="attachment-icon icon-location">📍</span>

<button id="contactButton" class="attachment-option" type="button">

</div>

</div>

</div>

<input id="galleryInput" class="hidden-file" type="file" accept="image/*,video/*">

<!-- Context Menu -->

</div>

</div>

<!-- Profile -->

</div>

</div>

<div class="profile-actions">

<button id="profileCall" class="profile-action" type="button">
<span>☎</span>
مكالمة
</button>

<button id="profileVideo" class="profile-action" type="button">
<span>▣</span>
فيديو
</button>

<button id="profileSearch" class="profile-action" type="button">

بحث
</button>

</div>

</div>

</div>

function createChatID(a,b){
return [a,b].sort().join("_");
}

function escapeHtml(value){
return String(value??"")
.replace(/[&<>'"]/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));
}

function getMessagePreview(data){

if(data.type==="text")
return data.text||"رسالة";

if(data.type==="image")
return "📷 صورة";

if(data.type==="video")
return "🎥 فيديو";

if(data.type==="voice")
return "🎤 رسالة صوتية";

if(data.type==="document")
return "📄 مستند";

if(data.type==="location")
return "📍 الموقع";

if(data.type==="contact")
return "👤 جهة اتصال";

return "رسالة";
}

function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

async function loadFriend(){

const params=new URLSearchParams(location.search);

const friendId=params.get("friend");

if(!friendId)
throw new Error("لا يوجد معرف المستخدم في الرابط.");

if(!currentUser)
throw new Error("لم يتم تسجيل الدخول.");

if(friendId===currentUser.uid)
throw new Error("لا يمكن فتح محادثة مع نفسك.");

const friendRef=doc(db,"users",friendId);

const snap=await getDoc(friendRef);

if(!snap.exists())
throw new Error("المستخدم غير موجود.");

const data=snap.data();

friendUser={
uid:friendId,
name:data.name||data.displayName||"مستخدم",
photo:data.photo||data.photoURL||"",
status:data.status||"",
lastSeen:data.lastSeen||null
};

friendName.textContent=friendUser.name;

setAvatar(friendAvatar,friendUser);

profileName.textContent=friendUser.name;

setAvatar(profileAvatar,friendUser);

chatID=createChatID(
currentUser.uid,
friendUser.uid
);

updateFriendStatus(data);

listenFriendStatus(friendId);

}


/* =========================================================
   ONLINE / OFFLINE / LAST SEEN
========================================================= */

function formatLastSeen(value){

if(!value)
return "آخر ظهور غير معروف";

let date=null;

try{

if(value.toDate)
date=value.toDate();
else
date=new Date(value);

}catch{
return "آخر ظهور غير معروف";
}

if(!date||Number.isNaN(date.getTime()))
return "آخر ظهور غير معروف";

return "آخر ظهور "+date.toLocaleString(
"ar",
{
day:"2-digit",
month:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);
}

function updateFriendStatus(data){

if(data.online===true||data.isOnline===true){

friendStatus.textContent="● متصل الآن";
friendStatus.className="user-status online";

}else{

friendStatus.textContent=
"● "+formatLastSeen(data.lastSeen);

friendStatus.className="user-status";

}

profileStatus.textContent=
friendStatus.textContent.replace("● ","");

}

function listenFriendStatus(friendId){

if(unsubscribeFriend)
unsubscribeFriend();

unsubscribeFriend=onSnapshot(
doc(db,"users",friendId),
snap=>{

if(!snap.exists())
return;

const data=snap.data();

friendUser.name=
data.name||
data.displayName||
friendUser.name;

friendUser.photo=
data.photo||
data.photoURL||
friendUser.photo;

friendName.textContent=friendUser.name;

setAvatar(friendAvatar,friendUser);

updateFriendStatus(data);

}
);

}

/* =========================================================
   REACTIONS
========================================================= */

async function toggleReaction(messageId,emoji){

if(!currentUser||!chatID)
return;

try{

const ref=doc(
db,
"chats",
chatID,
"messages",
messageId
);

const snap=await getDoc(ref);

if(!snap.exists())
return;

const data=snap.data();

const reactions=
Array.isArray(data.reactions)
?data.reactions
:[];

const mine=reactions.find(
r=>
r &&
r.userId===currentUser.uid &&
r.emoji===emoji
);

if(mine){

await updateDoc(
ref,
{
reactions:arrayRemove(mine)
}
);

return;

}

const oldMine=reactions.find(
r=>r&&r.userId===currentUser.uid
);

if(oldMine){

await updateDoc(
ref,
{
reactions:arrayRemove(oldMine)
}
);

}

await updateDoc(
ref,
{
reactions:arrayUnion({
userId:currentUser.uid,
emoji:emoji
})
}
);

}catch(error){

console.error("Reaction error:",error);

}

}

function renderReactions(box,data){

if(!Array.isArray(data.reactions))
return;

const counts={};

data.reactions.forEach(reaction=>{

if(!reaction?.emoji)
return;

if(!counts[reaction.emoji]){

counts[reaction.emoji]={
count:0,
mine:false
};

}

counts[reaction.emoji].count++;

if(
reaction.userId===currentUser.uid
){

counts[reaction.emoji].mine=true;

}

});

const wrapper=document.createElement("div");

wrapper.className="message-reactions";

reactionList.forEach(emoji=>{

const info=counts[emoji];

if(!info)
return;

const chip=document.createElement("button");

chip.type="button";

chip.className=
"reaction-chip"+
(info.mine?" mine":"");

chip.textContent=emoji;

if(info.count>1){

const count=document.createElement("span");

count.className="reaction-count";

count.textContent=info.count;

chip.appendChild(count);

}

chip.onclick=e=>{

e.stopPropagation();

toggleReaction(
data.id,
emoji
);

};

wrapper.appendChild(chip);

});

if(wrapper.children.length)
box.appendChild(wrapper);

}

text.textContent=data.text||"";

else if(data.type==="image"&&data.url){

img.loading="lazy";

video.src=data.url;

audio.preload="metadata";

audio.src=data.url;

audio.style.width="220px";

else if(data.type==="document"&&data.url){

link.href=data.url;

link.target="_blank";

link.rel="noopener noreferrer";

link.style.color="inherit";
link.style.textDecoration="none";
link.style.fontWeight="bold";

box.appendChild(link);

else if(data.type==="location"&&data.lat!=null&&data.lng!=null){

locationButton.type="button";

locationButton.textContent="📍 فتح الموقع";

else if(data.type==="contact"){

const contact=document.createElement("div");

contact.textContent=
"👤 "+(data.contactName||"جهة اتصال");

box.appendChild(contact);

/* Meta */

meta.className="message-meta";

const time=document.createElement("span");

time.className="time";

formatTime(data.createdAt);

meta.appendChild(time);

(data.read===true?"read":"");

data.read===true
?"✓✓"
:"✓";

}

box.appendChild(meta);

renderReactions(box,data);

addMessageActions(box,data);

return box;

}


/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function addMessageActions(element,data){

let pressTimer=null;
let longPressed=false;
let startX=0;
let currentX=0;

element.addEventListener(
"pointerdown",
e=>{

if(e.button!==undefined&&e.button!==0)
return;

longPressed=false;

pressTimer=setTimeout(()=>{

longPressed=true;

showContextMenu(data);

},520);

}
);

const clearPress=()=>{

if(pressTimer){

clearTimeout(pressTimer);

pressTimer=null;

}

};

element.addEventListener("pointerup",clearPress);

element.addEventListener("pointercancel",clearPress);

element.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

clearPress();

showContextMenu(data);

}
);


/* Double tap */

let lastTap=0;

element.addEventListener(
"click",
e=>{

if(longPressed)
return;

if(
e.target.closest("button")||
e.target.closest("audio")||
e.target.closest("video")||
e.target.closest(".message-reply")
)
return;

const now=Date.now();

if(now-lastTap<320){

triggerHeartReaction(
element,
data.id
);

}

lastTap=now;

}
);


/* Swipe reply */

element.addEventListener(
"touchstart",
e=>{

startX=e.touches[0].clientX;
currentX=startX;

},
{passive:true}
);

element.addEventListener(
"touchmove",
e=>{

currentX=e.touches[0].clientX;

const diff=currentX-startX;

if(
data.senderId!==currentUser.uid &&
diff>0 &&
diff<120
){

element.style.transform=
`translateX(${diff}px)`;

}

else if(
data.senderId===currentUser.uid &&
diff<0 &&
diff>-120
){

element.style.transform=
`translateX(${diff}px)`;

}

},
{passive:true}
);

element.addEventListener(
"touchend",
()=>{

const diff=currentX-startX;

element.style.transform="translateX(0)";

if(Math.abs(diff)>75){

startReply(data);

}

}
);

}

/* =========================================================
   FIRESTORE LISTENER
========================================================= */

function listenMessages(){

if(!chatID)
return;

if(unsubscribeMessages)
unsubscribeMessages();

const q=query(
collection(
db,
"chats",
chatID,
"messages"
),
orderBy("createdAt","asc")
);

unsubscribeMessages=onSnapshot(
q,
snapshot=>{

const nearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<140;

if(
snapshot.empty &&
messageElements.size===0
){

messages.innerHTML=`
<div class="empty">
💬<br>
ابدأ المحادثة الآن
</div>
`;

}

snapshot.docChanges().forEach(change=>{

const id=change.doc.id;

const data={
...change.doc.data(),
id
};

if(change.type==="removed"){

const old=
messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}

if(
Array.isArray(data.deletedFor)&&
data.deletedFor.includes(
currentUser.uid
)
){

const old=
messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}

const newElement=
renderMessage(data);

const old=
messageElements.get(id);

if(old){

old.replaceWith(newElement);

}else{

const empty=
messages.querySelector(".empty");

if(empty)
empty.remove();

messages.appendChild(newElement);

}

messageElements.set(
id,
newElement
);

});

updatePinnedBanner();

if(nearBottom){

requestAnimationFrame(
()=>{
messages.scrollTop=
messages.scrollHeight;
}
);

}

},
error=>{

console.error(
"Messages listener:",
error
);

}
);

}

/* =========================================================
   MEDIA UPLOAD
========================================================= */

async function uploadFile(file,pathPrefix="media"){

const safeName=
file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const filePath=
`${pathPrefix}/${currentUser.uid}/${Date.now()}_${safeName}`;

const result=
await supabase
.storage
.from("mecd-media")
.upload(
filePath,
file,
{
upsert:false,
contentType:file.type||undefined
}
);

if(result.error)
throw result.error;

const publicResult=
supabase
.storage
.from("mecd-media")
.getPublicUrl(filePath);

return publicResult.data.publicUrl;

}

async function uploadMediaAndSend(file,type){

if(
!file||
!currentUser||
!friendUser||
!chatID
)
return;

if(file.size>30*1024*1024){

alert("حجم الملف كبير جداً. الحد الأقصى 30MB.");

return;

}

try{

setLoading("جارٍ رفع الملف...");

loading.style.display="flex";

const url=
await uploadFile(
file,
type
);

const data={

url:url,

senderId:currentUser.uid,

receiverId:friendUser.uid,

type:type,

read:false,

deletedFor:[],

fileName:file.name||"",

createdAt:serverTimestamp()

};

if(replyTarget){

data.replyTo={
messageId:replyTarget.id,
senderId:replyTarget.senderId,
senderName:replyTarget.senderName,
text:replyTarget.text
};

}

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
data
);

cancelReply();

}catch(error){

console.error(
"Upload error:",
error
);

alert(
"فشل رفع الملف. تأكد من إعدادات Storage في Supabase."
);

}finally{

loading.style.display="none";

}

}

galleryInput.onchange=e=>{

const file=e.target.files?.[0];

if(!file)
return;

const type=
file.type.startsWith("video")
?"video"
:"image";

uploadMediaAndSend(
file,
type
);

galleryInput.value="";

};

cameraInput.onchange=e=>{

const file=e.target.files?.[0];

if(!file)
return;

const type=

};


/* =========================================================
   VOICE RECORDING
========================================================= */

async function startVoiceRecording(){

if(mediaRecorder){

stopVoiceRecording();

return;

}

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

alert(
"المتصفح لا يدعم تسجيل الصوت."
);

return;

}

try{

mediaStream=
await navigator.mediaDevices.getUserMedia({
audio:true
});

audioChunks=[];

let options={};

if(
MediaRecorder.isTypeSupported(
"audio/webm;codecs=opus"
)
){

options.mimeType=
"audio/webm;codecs=opus";

}

mediaRecorder=
new MediaRecorder(
mediaStream,
options
);

mediaRecorder.ondataavailable=e=>{

if(e.data&&e.data.size>0)
audioChunks.push(e.data);

};

mediaRecorder.onstop=async()=>{

const mime=
mediaRecorder?.mimeType||
"audio/webm";

const blob=
new Blob(
audioChunks,
{
type:mime
}
);

if(mediaStream){

mediaStream
.getTracks()
.forEach(track=>track.stop());

}

mediaStream=null;

mediaRecorder=null;

voiceButton.classList.remove(
"recording"
);

voiceButton.textContent="🎤";

if(blob.size===0)
return;

try{

setLoading("جارٍ إرسال التسجيل...");

loading.style.display="flex";

const file=new File(
[blob],
`voice_${Date.now()}.webm`,
{
type:mime
}
);

const url=
await uploadFile(
file,
"voice"
);

const data={

url:url,

senderId:currentUser.uid,

receiverId:friendUser.uid,

type:"voice",

read:false,

deletedFor:[],

createdAt:serverTimestamp()

};

if(replyTarget){

data.replyTo={
messageId:replyTarget.id,
senderId:replyTarget.senderId,
senderName:replyTarget.senderName,
text:replyTarget.text
};

}

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
data
);

cancelReply();

}catch(error){

console.error(
"Voice upload error:",
error
);

alert(
"فشل إرسال الرسالة الصوتية."
);

}finally{

loading.style.display="none";

}

};

mediaRecorder.start();

voiceButton.classList.add(
"recording"
);

voiceButton.textContent="■";

}catch(error){

console.error(
"Microphone error:",
error
);

alert(
"لم يتم السماح باستخدام الميكروفون."
);

mediaRecorder=null;

if(mediaStream){

mediaStream
.getTracks()
.forEach(track=>track.stop());

mediaStream=null;

}

}

}

function stopVoiceRecording(){

if(mediaRecorder){

mediaRecorder.stop();

}

}


/* اضغط مرة للتسجيل ومرة ثانية للإيقاف */

voiceButton.onclick=()=>{

if(mediaRecorder)
stopVoiceRecording();
else
startVoiceRecording();

};

}
);

},

},
{

timeout:10000,

}
);

}
