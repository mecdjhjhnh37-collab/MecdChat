<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع المطور مجد - محادثة واتساب</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b141a;
            color: #e9edef;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .whatsapp-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #111b21;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @media (min-width: 768px) {
            .whatsapp-container {
                height: 90vh;
                border-radius: 10px;
                overflow: hidden;
            }
        }

        /* رأس الصفحة (Header) */
        .chat-header {
            background-color: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222d34;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .user-details h3 {
            font-size: 1rem;
            color: #e9edef;
        }

        .user-details span {
            font-size: 0.75rem;
            color: #8696a0;
        }

        .chat-actions {
            display: flex;
            gap: 20px;
            color: #8696a0;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* منطقة عرض الرسائل (Chat Body) */
        .chat-body {
            flex: 1;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat;
            background-color: #0b141a;
            background-blend-mode: overlay;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 7.5px;
            font-size: 0.9rem;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }

        .message.received {
            background-color: #202c33;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .message.sent {
            background-color: #005c4b;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .message .time {
            font-size: 0.65rem;
            color: #8696a0;
            float: left;
            margin-top: 5px;
            margin-left: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .message.sent .time {
            color: #79c7b9;
        }

        .message .time .fa-check-double {
            color: #53bdeb; /* علامة الصح الزرقاء */
            font-size: 0.7rem;
        }

        /* شريط إدخال الرسائل (Footer) */
        .chat-footer {
            background-color: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-footer i {
            color: #8696a0;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .chat-footer input {
            flex: 1;
            background-color: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            color: #e9edef;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-footer input::placeholder {
            color: #8696a0;
        }
    </style>
</head>
<body>

    <div class="whatsapp-container">
        <!-- رأس المحادثة -->
        <div class="chat-header">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-code"></i></div>
                <div class="user-details">
                    <h3>المطور مجد</h3>
                    <span>متصل الآن</span>
                </div>
            </div>
            <div class="chat-actions">
                <i class="fa-solid fa-video"></i>
                <i class="fa-solid fa-phone"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </div>

        <!-- جسم المحادثة (الرسائل) -->
        <div class="chat-body" id="chatBody">
            <div class="message received">
                أهلاً بك! تم إعداد واجهة واتساب بنجاح كامل.
                <span class="time">03:45 م</span>
            </div>
            <div class="message sent">
                ممتاز جداً، التصميم مطابق تماماً ويدعم الوضع الداكن.
                <span class="time">03:46 م <i class="fa-solid fa-check-double"></i></span>
            </div>
        </div>

        <!-- شريط الإرسال -->
        <div class="chat-footer">
            <i class="fa-regular fa-face-smile"></i>
            <i class="fa-solid fa-paperclip"></i>
            <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeypress="checkEnter(event)">
            <i class="fa-solid fa-microphone" id="sendBtn" onclick="sendMessage()"></i>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBody = document.getElementById('chatBody');
            const text = input.value.trim();

            if (text !== "") {
                // إنشاء عنصر الرسالة المرسلة
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', 'sent');
                
                // جلب الوقت الحالي
                const now = new Date();
                let hours = now.getHours();
                let minutes = now.getMinutes();
                const ampm = hours >= 12 ? 'م' : 'ص';
                hours = hours % 12;
                hours = hours ? hours : 12;
                minutes = minutes < 10 ? '0' + minutes : minutes;
                const timeString = `${hours}:${minutes} ${ampm}`;

                messageDiv.innerHTML = `
                    ${text}
                    <span class="time">${timeString} <i class="fa-solid fa-check-double"></i></span>
                `;

                chatBody.appendChild(messageDiv);
                input.value = "";
                
                // التلقيم التلقائي للأسفل لآخر رسالة
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        }

        // إرسال الرسالة عبر ضغط زر Enter من لوحة المفاتيح
        function checkEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
