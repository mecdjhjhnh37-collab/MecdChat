<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat - الدردشة</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
overflow:hidden;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

header{
height:75px;
padding:12px 18px;
display:flex;
align-items:center;
gap:12px;
background:rgba(5,10,8,.96);
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}

.back{
width:45px;
height:45px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.06);
color:white;
font-size:24px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.back:active{transform:scale(.94)}

.avatar{
width:48px;
height:48px;
border-radius:50%;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#12352c;
font-size:24px;
flex-shrink:0;
border:1px solid rgba(0,230,118,.3);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:17px;
font-weight:bold;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.user-status{
font-size:11px;
color:#7d8985;
margin-top:4px;
transition:.2s ease;
}

.user-status.online{color:#00e889}

.user-status.typing,
.user-status.recording{
color:#00e889;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px 15px 100px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
font-size:14px;
}

.message{
max-width:78%;
padding:11px 14px;
border-radius:18px;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
overflow-wrap:anywhere;
white-space:pre-wrap;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
color:white;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px;
}

.time{
display:block;
font-size:9px;
opacity:.55;
margin-top:4px;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:12px;
display:flex;
gap:9px;
background:rgba(5,8,7,.97);
border-top:1px solid rgba(255,255,255,.08);
z-index:20;
}

#messageInput{
flex:1;
min-width:0;
padding:14px 16px;
border-radius:17px;
border:1px solid rgba(255,255,255,.09);
outline:none;
background:#111916;
color:white;
font-family:inherit;
font-size:15px;
direction:rtl;
}

#messageInput:focus{
border-color:#00e676;
box-shadow:0 0 0 3px rgba(0,230,118,.07);
}

#messageInput::placeholder{color:#63716d}

#sendButton{
width:52px;
height:52px;
border:none;
border-radius:17px;
background:#00e889;
color:#00150e;
font-size:22px;
cursor:pointer;
flex-shrink:0;
}

#sendButton:active{transform:scale(.94)}

#sendButton:disabled{
opacity:.5;
cursor:not-allowed;
}

.loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
background:#020504;
color:#a8bdb6;
font-size:15px;
z-index:100;
}

.error-screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:#020504;
text-align:center;
padding:30px;
z-index:200;
}

.error-box{
width:100%;
max-width:500px;
padding:30px;
border-radius:25px;
background:#0b100e;
border:1px solid rgba(255,255,255,.08);
}

.error-box h2{
font-size:25px;
margin-bottom:15px;
}

.error-box p{
color:#9aa7a3;
line-height:1.8;
font-size:14px;
}

.spinner{
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

#voiceButton,
#callButton,
#videoButton{
width:45px;
height:45px;
border:none;
border-radius:15px;
background:#18231f;
color:white;
font-size:20px;
cursor:pointer;
flex-shrink:0;
}

#voiceButton:active,
#callButton:active,
#videoButton:active{
transform:scale(.94);
}

.call-buttons{
display:flex;
gap:8px;
margin-right:auto;
}

.call-buttons button{
width:42px;
height:42px;
border:none;
border-radius:14px;
background:#18231f;
color:white;
font-size:18px;
cursor:pointer;
}

/* ===== Attachment button ===== */
#attachButton{
width:45px;
height:45px;
border:none;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:28px;
line-height:1;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex:0 0 45px;
}

#attachButton:active{transform:scale(.94)}

.attach-menu{
position:absolute;
bottom:72px;
right:72px;
display:none;
flex-direction:column;
gap:7px;
padding:8px;
background:#111916;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
z-index:90;
box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.attach-menu.show{display:flex}

.attach-menu button{
border:0;
background:#18231f;
color:#fff;
border-radius:12px;
padding:11px 14px;
font-family:inherit;
font-size:14px;
white-space:nowrap;
text-align:right;
cursor:pointer;
}

.attach-menu button:active{transform:scale(.97)}

.message-image{
display:block;
max-width:min(270px,100%);
max-height:360px;
width:auto;
height:auto;
border-radius:14px;
object-fit:cover;
}

.message-video{
display:block;
max-width:min(320px,100%);
max-height:420px;
width:auto;
height:auto;
border-radius:14px;
background:#000;
}

.media-message{padding:7px}

.reply-box{
padding:7px 9px;
margin-bottom:7px;
border-right:3px solid rgba(0,0,0,.25);
background:rgba(0,0,0,.12);
border-radius:9px;
font-size:11px;
opacity:.9;
max-width:100%;
overflow:hidden;
}

.reply-box strong{
display:block;
font-size:10px;
margin-bottom:2px;
}

.edited-mark{
font-size:9px;
opacity:.55;
margin-right:5px;
}

.reactions{
display:flex;
gap:4px;
flex-wrap:wrap;
margin-top:5px;
}

.reaction-btn{
border:1px solid rgba(255,255,255,.12);
background:rgba(0,0,0,.12);
color:inherit;
border-radius:12px;
padding:2px 7px;
font-size:12px;
cursor:pointer;
}

.pinned-mark{
font-size:10px;
opacity:.7;
margin-top:4px;
}

#clearChatButton{
width:42px;
height:42px;
border:none;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer;
flex-shrink:0;
}

#clearChatButton:active{transform:scale(.94)}

.reply-preview{
position:absolute;
bottom:72px;
left:12px;
right:12px;
max-width:calc(100% - 24px);
display:none;
align-items:center;
justify-content:space-between;
gap:10px;
padding:9px 12px;
background:#111916;
border:1px solid rgba(0,232,137,.2);
border-radius:14px;
z-index:25;
}

.reply-preview.show{display:flex}

.reply-preview-text{
min-width:0;
font-size:12px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.reply-preview-close{
border:0;
background:transparent;
color:#fff;
font-size:18px;
cursor:pointer;
}

.message-menu{max-width:230px}

.message-menu button{
display:block;
width:100%;
margin:2px 0;
}

.message.image-message{padding:7px}

/* ===== Voice message ===== */
.message.voice-message{
width:min(340px,84%);
max-width:84%;
min-height:66px;
padding:8px 10px;
display:block;
overflow:hidden;
}

.voice-player{
width:100%;
min-width:0;
min-height:48px;
display:flex;
align-items:center;
gap:10px;
}

.voice-play{
width:42px;
height:42px;
flex:0 0 42px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.88);
color:#087b50;
font-size:17px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.message.other .voice-play{
background:#00c96b;
color:#00150e;
}

.voice-body{
flex:1;
min-width:0;
}

.voice-row{
display:flex;
align-items:center;
gap:8px;
width:100%;
}

.voice-progress{
flex:1;
min-width:0;
width:100%;
height:5px;
accent-color:#00e889;
cursor:pointer;
}

.voice-duration{
min-width:38px;
font-size:10px;
opacity:.75;
direction:ltr;
text-align:center;
}

.message.voice-message .time{margin-top:3px}

@media(max-width:480px){

.attach-menu{
right:58px;
bottom:68px;
max-width:calc(100vw - 75px)
}

header{
height:70px;
padding:10px 13px;
}

.back{
width:43px;
height:43px;
}

.avatar{
width:45px;
height:45px;
border-radius:15px;
}

.user-name{font-size:16px}

.messages{
padding:15px 12px 100px;
}

.message{
max-width:84%;
font-size:14px;
}

.input-area{padding:10px}

#messageInput{
font-size:14px;
padding:13px 14px;
}

#sendButton{
width:50px;
height:50px;
}

}

#recordBox{
position:fixed;
bottom:75px;
left:50%;
transform:translateX(-50%);
background:#18231f;
padding:10px 15px;
border-radius:20px;
display:flex;
gap:10px;
align-items:center;
z-index:50;
}

#recordText{color:#00e889}

#cancelRecord{
background:#ff3333;
color:white;
border:none;
border-radius:12px;
padding:6px 12px;
}

.message-menu{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:#111916;
border-radius:12px;
padding:8px;
z-index:999;
}

.message-menu button{
background:#18231f;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-size:14px;
}

.message-menu button:active{transform:scale(.95)}

.incoming-call{
position:fixed;
top:84px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
z-index:300;
background:#111916;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:12px 14px;
box-shadow:0 15px 45px rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.incoming-call-info{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.incoming-name{
font-weight:bold;
font-size:15px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.incoming-type{
font-size:12px;
color:#9aa7a3;
margin-top:3px;
}

.incoming-actions{
display:flex;
gap:8px;
flex-shrink:0;
}

.incoming-actions button{
width:45px;
height:45px;
border:0;
border-radius:50%;
cursor:pointer;
font-size:18px;
}

.incoming-actions .accept{
background:#00e889;
color:#00150e;
}

.incoming-actions .reject{
background:#ff3b30;
color:white;
}

.call-screen{
position:fixed;
inset:0;
background:#020504;
z-index:400;
display:none;
flex-direction:column;
}

.call-header{
height:70px;
padding:10px 15px;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,.08);
background:#07100d;
}

.call-title{
font-size:15px;
font-weight:bold;
}

.call-state{
font-size:11px;
color:#00e889;
margin-top:3px;
}

.call-stage{
flex:1;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#000;
}

.remote-video{
width:100%;
height:100%;
object-fit:contain;
background:#000;
}

.local-video{
position:absolute;
right:15px;
top:15px;
width:120px;
height:170px;
object-fit:cover;
border-radius:15px;
background:#111;
display:none;
border:1px solid rgba(255,255,255,.15);
}

.audio-avatar{
width:110px;
height:110px;
border-radius:50%;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#12352c;
font-size:50px;
border:1px solid rgba(0,230,118,.3);
}

.audio-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.call-controls{
height:90px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
background:#07100d;
}

.call-controls button{
width:52px;
height:52px;
border:0;
border-radius:50%;
background:#18231f;
color:white;
font-size:20px;
cursor:pointer;
}

.call-controls .end{
background:#ff3b30;
}

.video-request-box{
position:absolute;
bottom:100px;
left:50%;
transform:translateX(-50%);
width:min(420px,calc(100% - 30px));
padding:12px;
border-radius:15px;
background:#111916;
border:1px solid rgba(0,232,137,.2);
display:none;
z-index:20;
}

.video-request-text{
font-size:13px;
line-height:1.6;
margin-bottom:9px;
}

.video-request-actions{
display:flex;
gap:8px;
}

.video-request-actions button{
flex:1;
height:40px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
cursor:pointer;
}

.video-request-actions .accept-video{
background:#00e889;
color:#00150e;
}
</style>
</head>

<body>

<div id="loading" class="loading">
<div class="spinner"></div>
<div>جارٍ فتح الدردشة...</div>
</div>

<div id="errorScreen" class="error-screen" style="display:none">
<div class="error-box">
<h2>حدث خطأ</h2>
<p id="errorText">تعذر فتح الدردشة.</p>
</div>
</div>

<div class="app">

<header>

<button class="back" id="backButton">→</button>

<div class="avatar" id="friendAvatar">
👤
</div>

<div class="user-info">
<div class="user-name" id="friendName">جار التحميل...</div>
<div class="user-status" id="friendStatus">● غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton" title="مكالمة صوتية">📞</button>
<button id="videoButton" title="مكالمة فيديو">📹</button>

</header>

<div id="messages" class="messages">
<div class="empty" id="emptyMessage">
💬<br>
ابدأ المحادثة الآن
</div>
</div>

<div class="input-area">

<button id="attachButton">＋</button>

<div class="attach-menu" id="attachMenu">
<button id="imageButton">🖼️ صورة أو فيديو</button>
<button id="cameraButton">📷 كاميرا / تسجيل</button>
</div>

<input
type="file"
id="mediaInput"
accept="image/*,video/*"
multiple
hidden
>

<button id="voiceButton" title="تسجيل صوت">🎤</button>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
>

</div>

<div id="replyPreviewText" class="reply-preview-text"></div>

</div>

</div>

<div id="recordBox" style="display:none">
<span id="recordText">🎤 يسجل صوت…</span>
<span id="recordTime">00:00</span>

</div>

<div>

</div>

<div>
<div class="call-title" id="callTitle">مستخدم Mecd</div>

</div>
</div>

<div class="call-stage">

<video
id="remoteVideo"
class="remote-video"
autoplay
playsinline
></video>

<video
id="localVideo"
class="local-video"
autoplay
playsinline
muted
></video>

👤
</div>

📹 طلب تحويل المكالمة إلى فيديو

<div class="video-request-actions">

<button id="rejectVideoRequest">رفض</button>
</div>

</div>

</div>

<div class="call-controls">

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
addDoc,
collection,
query,
where,
onSnapshot,
updateDoc,
serverTimestamp,
deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_AUTH_DOMAIN",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_STORAGE_BUCKET",
messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
appId:"YOUR_APP_ID"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=id=>document.getElementById(id);

let me=null;
let friend=null;
let chatID=null;

let unsubscribeMessages=null;
let unsubscribeFriendStatus=null;
let unsubscribeFriendActivity=null;

let friendOnline=false;
let friendTyping=false;
let friendRecording=false;

let replyTo=null;

function renderFriendStatus(){

friendStatus.classList.remove(
"online",
"typing",
"recording"
);

if(friendRecording){

friendStatus.textContent=
"🎤 يسجل صوت...";

friendStatus.classList.add(
"recording"
);

return;

}

if(friendTyping){

friendStatus.textContent=
"يكتب...";

friendStatus.classList.add(
"typing"
);

return;

}

if(friendOnline){

friendStatus.textContent=
"● متصل";

friendStatus.classList.add(
"online"
);

}else{

friendStatus.textContent=
"● غير متصل";

}

}

function listenFriendStatus(){

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

unsubscribeFriendStatus=
onSnapshot(
doc(db,"users",friend.uid),
snap=>{

if(!snap.exists()){

friendOnline=false;
renderFriendStatus();

return;

}

const data=snap.data();

const last=
data.lastSeen?.toMillis?.() || 0;

friendOnline=
data.online===true &&
last>0 &&
Date.now()-last<30000;

renderFriendStatus();

}
);

}

function listenFriendActivity(){

if(unsubscribeFriendActivity)
unsubscribeFriendActivity();

unsubscribeFriendActivity=
onSnapshot(
doc(
db,
"chats",
chatID,
"typing",
friend.uid
),
snap=>{

if(!snap.exists()){

friendTyping=false;
friendRecording=false;

renderFriendStatus();

return;

}

const data=snap.data();

const updated=
data.updatedAt?.toMillis?.() || 0;

const fresh=
!updated ||
Date.now()-updated<5000;

friendRecording=
fresh &&
data.recording===true;

friendTyping=
fresh &&
data.typing===true &&
!friendRecording;

renderFriendStatus();

}
);

}

function setAvatar(el,url){

if(!el)return;

if(url){

el.innerHTML=
`<img src="${url}" alt="avatar">`;

}else{

el.textContent="👤";

}

}

function makeChatID(a,b){

return[a,b].sort().join("_");

}

function formatTime(timestamp){

if(!timestamp)return"";

const d=timestamp.toDate?
timestamp.toDate():
new Date(timestamp);

return d.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

function safeText(text){

return String(text??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

class="reaction-btn"

async function handleUpgradeOffer(d){

if(
role!=="receiver"||
!pc||
!d.upgradeOffer
)return;

if(
lastUpgradeOffer===
d.upgradeOffer.sdp
)return;

lastUpgradeOffer=
d.upgradeOffer.sdp;

try{

await ensureMedia(true);

if(
localStream
){

localStream
.getTracks()
.forEach(track=>{

const sender=
pc.getSenders()
.find(
s=>s.track?.kind===track.kind
);

if(sender){

sender.replaceTrack(track);

}else{

pc.addTrack(
track,
localStream
);

}

});

}

await pc.setRemoteDescription(
new RTCSessionDescription(
d.upgradeOffer
)
);

const answer=
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await updateDoc(
doc(db,"calls",callId),
{
upgradeAnswer:{
type:answer.type,
sdp:answer.sdp
},
videoAccepted:true,
callType:"video"
}
);

callData.videoAccepted=true;
callData.callType="video";

showVideoStage();

state("● متصل • فيديو");

}catch(e){

console.error("upgrade offer",e);

}

}

return;

}

const d=snap.data();

callData={
...(callData||{}),
...d
};

if(
["rejected","cancelled","missed","ended"]
.includes(d.status)
){

const duration=
Number(d.duration||0);

callSeconds=duration;

connected=
d.status==="ended"&&
duration>0;

await saveCallMessage(
d.status,
duration
);

await finishCall(
d.status,
true
);

return;

}

if(
role==="receiver"&&
d.status==="ringing"
){

toneStart("incoming");

}

if(d.status==="connected"){

stopAllTones();

connected=true;

const start=
d.connectedAt?.toMillis?.()||
Date.now();

if(!callStartedAt)
startTimer(start);

state(
d.videoAccepted===true||
d.callType==="video"?
"● متصل • فيديو":
"● متصل"
);

}

if(
d.answer?.sdp&&
role==="caller"&&
pc&&
!pc.currentRemoteDescription
){

try{

await pc.setRemoteDescription(
new RTCSessionDescription(
d.answer
)
);

await flushCandidates();

connected=true;

stopAllTones();

if(!callStartedAt)
startTimer(
d.connectedAt?.toMillis?.()||
Date.now()
);

}catch(e){

console.error("answer",e);

}

}

if(
d.videoRequestStatus==="pending"
)
await handleVideoRequest(d);

if(
d.videoRequestStatus==="rejected"&&
role==="caller"
)
state("تم رفض طلب الفيديو");

if(
d.videoRequestStatus==="accepted"&&
role==="caller"
)
await callerStartUpgrade(d);

if(
d.upgradeOffer&&
d.upgradeOffer.sdp!==lastUpgradeOffer&&
role==="receiver"
)
await handleUpgradeOffer(d);

if(
d.upgradeAnswer&&
d.upgradeAnswer.sdp!==lastUpgradeAnswer&&
role==="caller"&&
pc
){

lastUpgradeAnswer=
d.upgradeAnswer.sdp;

try{

await pc.setRemoteDescription(
new RTCSessionDescription(
d.upgradeAnswer
)
);

await flushCandidates();

callData.videoAccepted=true;
callData.callType="video";

showVideoStage();

state("● متصل • فيديو");

}catch(e){

console.error(
"upgrade answer",
e
);

}

}

if(
d.callType==="video"||
d.videoAccepted===true
){

if(
localStream?.getVideoTracks().length
)
$("localVideo").style.display=
"block";

showVideoStage();

}

}
);

}

async function acceptIncoming(){

if(
!callId||
!callData||
ending
)return;

const id=callId;

ending=false;
role="receiver";
connected=false;

stopAllTones();

$("incomingCall").style.display=
"none";

try{

const snap=
await getDoc(
doc(db,"calls",id)
);

if(
!snap.exists()||
snap.data().status!=="ringing"
){

await finishCall(
"cancelled",
true
);

return;

}

callData={
...callData,
...snap.data()
};

createPeer();

await ensureMedia(
callData.callType==="video"
);

localStream
.getTracks()
.forEach(
track=>pc.addTrack(
track,
localStream
)
);

await pc.setRemoteDescription(
new RTCSessionDescription(
callData.offer
)
);

await flushCandidates();

const answer=
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await updateDoc(
doc(db,"calls",id),
{
answer:{
type:answer.type,
sdp:answer.sdp
},
status:"connected",
connectedAt:serverTimestamp()
}
);

showCallScreen(
callData.callType
);

startTimer();

watchCall();

watchCandidates();

}catch(e){

console.error(
"accept",
e
);

alert(
"تعذر قبول المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await finishCall(
"rejected"
).catch(()=>{});

}

}

async function rejectIncoming(){

if(!callId)return;

stopAllTones();

const id=callId;

try{

await updateDoc(
doc(db,"calls",id),
{
status:"rejected",
duration:0,
endedAt:serverTimestamp()
}
);

await saveCallMessage(
"rejected",
0
);

}catch(e){

console.error(e);

}

hideIncoming();

callId=null;
callData=null;
role=null;

}

function hideIncoming(){

$("incomingCall").style.display=
"none";

}

function renderIncoming(id,d){

if(callId||ending)return;

callId=id;
callData=d;
role="receiver";
connected=false;

$("incomingName").textContent=
d.callerName||
"مستخدم Mecd";

$("incomingType").textContent=
d.callType==="video"?
"📹 مكالمة فيديو":
"📞 مكالمة صوتية";

setAvatar(
$("incomingAvatar"),
d.callerPhoto||""
);

$("incomingCall").style.display=
"flex";

toneStart("incoming");

}

function listenIncoming(){

if(!me)return;

stopIncomingWatch?.();

const q=query(
collection(db,"calls"),
where("receiverId","==",me.uid),
where("status","==","ringing")
);

stopIncomingWatch=
onSnapshot(
q,
snap=>{

for(
const ch of snap.docChanges()
){

const d=ch.doc.data();
const id=ch.doc.id;

if(ch.type==="added"){

const created=
d.createdAt?.toMillis?.()||0;

if(
created&&
Date.now()-created>35000
){

updateDoc(
doc(db,"calls",id),
{
status:"missed",
duration:0,
endedAt:serverTimestamp()
}
).catch(()=>{});

continue;

}

renderIncoming(id,d);

}

}

if(
callId&&
role==="receiver"
){

const x=
snap.docs.find(
x=>x.id===callId
);

if(
!x&&
$("incomingCall").style.display!=="none"
){

hideIncoming();

callId=null;
callData=null;
role=null;

stopAllTones();

}

}

}
);

}

$("acceptVideoRequest")?.addEventListener(
"click",
acceptVideoRequest
);

$("rejectVideoRequest")?.addEventListener(
"click",
rejectVideoRequest
);

async function init(){

onAuthStateChanged(
auth,
async user=>{

if(!user)return;

me=user;

const fid=
new URLSearchParams(
location.search
).get("friend");

if(!fid)return;

try{

const f=
await getDoc(
doc(db,"users",fid)
);

if(!f.exists()){

$("errorText").textContent=
"لم يتم العثور على المستخدم.";

$("loading").style.display="none";

$("errorScreen").style.display=
"flex";

return;

}

const d=f.data();

friend={
uid:fid,
name:d.name||"مستخدم Mecd",
photo:d.photo||d.photoURL||""
};

chatID=
makeChatID(
me.uid,
friend.uid
);

$("friendName").textContent=
friend.name;

setAvatar(
$("friendAvatar"),
friend.photo
);

listenFriendStatus();
listenFriendActivity();
listenMessages();
listenIncoming();

ensureCallUI();

$("loading").style.display="none";

window.MecdCall={
start:createInitialCall,
requestVideo:startVideoUpgrade
};

}catch(e){

console.error(e);

$("loading").style.display="none";

$("errorText").textContent=
"تعذر فتح الدردشة.";

$("errorScreen").style.display=
"flex";

}

}
);

}

$("callButton")?.addEventListener(
"click",
()=>createInitialCall("audio")
);

$("videoButton")?.addEventListener(
"click",
()=>createInitialCall("video")
);

$("switchVideo")?.addEventListener(
"click",
startVideoUpgrade
);

$("acceptIncoming")?.addEventListener(
"click",
acceptIncoming
);

$("rejectIncoming")?.addEventListener(
"click",
rejectIncoming
);

$("endCall")?.addEventListener(
"click",
()=>finishCall(
connected?"ended":"cancelled"
)
);

$("muteCall")?.addEventListener(
"click",
()=>{

const tracks=
localStream?.getAudioTracks()||[];

if(!tracks.length)return;

const enabled=
!tracks[0].enabled;

tracks.forEach(
t=>t.enabled=enabled
);

$("muteCall").textContent=
enabled?"🎤":"🔇";

}
);

window.addEventListener(
"pagehide",
()=>{

if(
callId&&
role==="caller"&&
!ending
){

finishCall(
connected?"ended":"cancelled"
).catch(()=>{});

}

}
);

window.addEventListener(
"beforeunload",
()=>stopAllTones()
);

init();

</script>

<script type="module">

const vBtn=
document.getElementById(
"voiceButton"
);

const rBox=
document.getElementById(
"recordBox"
);

const rText=
document.getElementById(
"recordText"
);

const rTime=
document.getElementById(
"recordTime"
);

const rCancel=
document.getElementById(
"cancelRecord"
);

let vRec=null;
let vStream=null;
let vChunks=[];
let vCancelled=false;
let vTimer=null;
let vStart=0;

function resetVoice(){

rBox.style.display="none";

rTime.textContent="00:00";

vBtn?.classList.remove(
"recording"
);

clearInterval(vTimer);

vTimer=null;

}

async function startVoice(){

if(vRec)return;

try{

vStream=
await navigator.mediaDevices.getUserMedia(
{
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
}
}
);

vChunks=[];
vCancelled=false;

vRec=
new MediaRecorder(vStream);

vRec.ondataavailable=
e=>{

if(e.data.size)
vChunks.push(e.data);

};

vRec.onstop=
async()=>{

const rec=vRec;

vRec=null;

vStream?.getTracks().forEach(
t=>t.stop()
);

vStream=null;

clearInterval(vTimer);

vTimer=null;

rBox.style.display="none";

rTime.textContent="00:00";

vBtn?.classList.remove(
"recording"
);

if(vCancelled){

vChunks=[];

await setRecordingStatus(
false
);

return;

}

const blob=
new Blob(
vChunks,
{
type:
rec?.mimeType||
"audio/webm"
}
);

vChunks=[];

await setRecordingStatus(false);

if(blob.size>700000){

alert(
"التسجيل طويل جدًا، سجل مقطعًا أقصر"
);

return;

}

const reader=
new FileReader();

reader.onload=
async()=>{

if(
!me||
!friend||
!chatID
)return;

try{

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
{
type:"voice",
audio:reader.result,
mimeType:blob.type,
text:"🎤 تسجيل صوتي",
senderId:me.uid,
receiverId:friend.uid,
createdAt:serverTimestamp()
}
);

await setDoc(
doc(db,"chats",chatID),
{
lastMessage:"🎤 تسجيل صوتي",
lastMessageAt:serverTimestamp(),
lastSenderId:me.uid
},
{merge:true}
);

}catch(e){

console.error(e);

alert(
"تعذر إرسال التسجيل"
);

}

};

reader.readAsDataURL(blob);

};

vRec.start();

await setRecordingStatus(true);

rBox.style.display="flex";

rText.textContent=
"🎤 يسجل صوت…";

vBtn.classList.add(
"recording"
);

vStart=Date.now();

vTimer=setInterval(
()=>{

const s=
Math.floor(
(Date.now()-vStart)/1000
);

rTime.textContent=
String(
Math.floor(s/60)
).padStart(2,"0")+
":"+
String(
s%60
).padStart(2,"0");

},
500
);

}catch(e){

alert(
"اسمح للمتصفح باستخدام الميكروفون لإرسال تسجيل صوتي"
);

resetVoice();

await setRecordingStatus(
false
);

}

}

function cancelVoice(){

if(!vRec)return;

vCancelled=true;

vRec.stop();

}

vBtn?.addEventListener(
"click",
()=>vRec?
vRec.stop():
startVoice()
);

rCancel?.addEventListener(
"click",
e=>{

e.preventDefault();
e.stopPropagation();

cancelVoice();

}
);

</script>

</body>
</html>
