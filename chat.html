<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
overflow:hidden
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}

.avatar,
.call-avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0
}

.avatar img,
.call-avatar img,
.local-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.user-status.recording{
font-weight:bold
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer
}

/* شريط الرسالة المثبتة بالأعلى */
.pinned-banner{
background:#0b1613;
border-bottom:1px solid rgba(0,232,137,.15);
padding:8px 15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
font-size:12px;
z-index:8;
display:none;
}
.pinned-banner.show{
display:flex;
}
.pinned-banner-content{
flex:1;
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
min-width:0;
}
.pinned-banner-text{
color:#00e889;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.pinned-banner-close{
background:none;
border:0;
color:#aaa;
font-size:14px;
cursor:pointer;
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:18px;
scroll-behavior: smooth;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8
}

.message{
max-width:78%;
padding:10px 13px 25px 13px; /* مساحة بالأسفل للتفاعلات لجعلها جوا الفقاعة */
border-radius:18px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
user-select:none;
line-height:1.5;
min-width:0;
overflow:visible !important;
transition: transform 0.15s ease-out, background-color 0.5s ease;
margin-bottom: 6px;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px
}

.message.highlight {
background-color: #00e889 !important;
color: #000 !important;
transition: background-color 0.2s ease;
}

.heart-pop {
position: absolute;
bottom: 5px;
right: 15px;
transform: scale(0);
font-size: 22px;
animation: popEffect 0.4s ease forwards;
pointer-events: none;
z-index: 30;
background: #0b1512;
border-radius: 50%;
padding: 2px 4px;
box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.message.mine .heart-pop {
right: auto;
left: 15px;
}

@keyframes popEffect {
0% { transform: scale(0); opacity: 0; }
50% { transform: scale(1.3); opacity: 1; }
100% { transform: scale(1); opacity: 1; }
}

.time{
display:inline-block;
font-size:9px;
opacity:.6;
margin-top:5px;
margin-left: 5px;
}

.message-meta{
display:inline-flex;
align-items:center;
gap:5px;
margin-top:5px;
position: absolute;
bottom: 5px;
left: 13px;
}
.message.other .message-meta {
left: auto;
right: 13px;
}

.message-status{
font-size:12px;
font-weight:bold;
direction:ltr
}

.message-status.read{
color:#006dff
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50
}

#messageInput{
flex:1;
min-width:0;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;
font-size:15px
}

#messageInput:focus{
border-color:#00e889
}

#voiceButton,
#sendButton,
#attachButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
flex-shrink:0
}

#attachButton{
background:#18231f;
color:#fff;
font-size:28px;
transition:.15s
}

#attachButton:active{
transform:scale(.92)
}

#voiceButton{
background:#18231f;
color:#fff;
transition:.18s
}

#voiceButton.recording{
background:#321817;
color:#ff5555;
transform:scale(1.05)
}

#sendButton{
background:#00e889;
color:#00150e
}

#sendButton:disabled{
opacity:.6
}

#attachMenu{
position:fixed;
bottom:70px;
right:10px;
width:175px;
padding:7px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:17px;
box-shadow:0 10px 35px rgba(0,0,0,.55);
display:none;
z-index:1000
}

#attachMenu.show{
display:block
}

.attach-option{
width:100%;
height:45px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
font-size:14px;
font-weight:bold;
cursor:pointer;
margin-bottom:5px
}

.attach-option:last-child{
margin-bottom:0
}

.attach-option:active{
transform:scale(.98)
}

.attach-icon{
font-size:20px;
width:28px;
text-align:center
}

.hidden-file{
display:none!important
}

.image-message,
.video-message{
padding:6px 6px 25px 6px !important;
width:max-content !important;
max-width:82vw !important;
overflow:visible !important;
display:flex !important;
flex-direction:column !important;
align-items:flex-start !important;
box-sizing:border-box !important;
flex:0 0 auto !important;
}

.message-image,
.message-video{
display:block !important;
width:auto !important;
height:auto !important;
max-width:100% !important;
max-height:360px !important;
border-radius:14px !important;
object-fit:contain !important;
cursor:pointer !important;
user-select:none !important;
flex:0 0 auto !important;
}

.voice-message{
display:block !important;
width:330px !important;
max-width:calc(100% - 20px) !important;
min-width:250px !important;
height:auto !important;
min-height:76px !important;
padding:8px 10px 28px 10px !important;
border-radius:18px !important;
position:relative !important;
overflow:visible !important;
flex:none !important;
box-sizing:border-box !important;
background:linear-gradient(135deg,#162923,#0d1714) !important;
border:1px solid rgba(0,232,137,.16) !important;
box-shadow:0 5px 18px rgba(0,0,0,.16);
line-height:normal !important;
white-space:normal !important
}

.message.mine.voice-message{
align-self:flex-start !important;
background:linear-gradient(135deg,#087e50,#00a866) !important;
color:#fff;
border:1px solid rgba(255,255,255,.08) !important
}

.message.other.voice-message{
align-self:flex-end !important;
background:linear-gradient(135deg,#162923,#0d1714) !important
}

.voice-message-box{
display:flex !important;
align-items:center !important;
gap:9px !important;
direction:rtl !important;
width:100% !important;
height:auto !important;
min-height:48px !important;
flex:none !important;
overflow:hidden !important;
border-radius:inherit;
}

.voice-icon{
width:43px !important;
height:43px !important;
min-width:43px !important;
max-width:43px !important;
border-radius:50% !important;
display:flex !important;
align-items:center !important;
justify-content:center !important;
background:rgba(0,232,137,.13) !important;
color:#00e889 !important;
font-size:18px !important;
flex:none !important;
box-shadow:0 0 0 1px rgba(0,232,137,.08),0 4px 14px rgba(0,0,0,.18)
}

.voice-message.mine .voice-icon{
background:rgba(255,255,255,.16) !important;
color:#fff !important;
box-shadow:none
}

.voice-player{
display:block !important;
flex:1 1 auto !important;
width:auto !important;
min-width:0 !important;
height:auto !important
}

.voice-controls{
display:flex !important;
align-items:center !important;
gap:8px !important;
width:100% !important;
height:38px !important;
min-height:38px !important
}

.voice-play{
width:38px !important;
height:38px !important;
min-width:38px !important;
max-width:38px !important;
border:0 !important;
border-radius:50% !important;
background:#00e889 !important;
color:#00150e !important;
display:flex !important;
align-items:center !important;
justify-content:center !important;
font-size:14px !important;
cursor:pointer !important;
flex:none !important;
box-shadow:0 4px 12px rgba(0,232,137,.18);
transition:transform .15s,background .15s
}

.voice-play:active{
transform:scale(.90)
}

.voice-message.mine .voice-play{
background:#fff !important;
color:#087e50 !important
}

.voice-progress{
flex:1 1 auto !important;
width:auto !important;
min-width:30px !important;
height:7px !important;
min-height:7px !important;
max-height:7px !important;
border-radius:20px !important;
background:rgba(255,255,255,.13) !important;
overflow:hidden !important;
cursor:pointer !important;
position:relative !important;
box-shadow:inset 0 1px 2px rgba(0,0,0,.15)
}

.voice-progress-fill{
width:0%;
height:100% !important;
background:linear-gradient(90deg,#00c96b,#00e889) !important;
border-radius:20px;
transition:width .05s linear
}

.voice-message.mine .voice-progress{
background:rgba(0,0,0,.18) !important
}

.voice-message.mine .voice-progress-fill{
background:#fff !important
}

.voice-time{
font-size:10px !important;
font-weight:bold !important;
color:#b9c7c2 !important;
width:39px !important;
min-width:39px !important;
max-width:39px !important;
text-align:center !important;
direction:ltr !important;
flex:none !important
}

.voice-message.mine .voice-time{
color:rgba(255,255,255,.85) !important
}

.voice-label{
font-size:9px !important;
color:#84938e !important;
margin-top:4px !important;
margin-right:52px !important;
height:11px !important;
display:flex !important;
align-items:center !important;
gap:4px !important
}

.voice-label::before{
content:"";
width:5px;
height:5px;
min-width:5px;
border-radius:50%;
background:#00e889;
display:inline-block
}

.voice-message.mine .voice-label{
color:rgba(255,255,255,.7) !important
}

.voice-message.mine .voice-label::before{
background:#fff
}

.voice-audio{
display:none !important;
width:0 !important;
height:0 !important
}

.call-message{
min-width:245px;
max-width:310px
}

.call-box{
display:flex;
align-items:center;
gap:11px
}

.call-icon{
width:46px;
height:46px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,232,137,.14);
color:#00e889;
font-size:22px;
flex-shrink:0
}

.call-info{
flex:1;
min-width:0
}

.call-title{
font-size:14px;
font-weight:bold
}

.call-subtitle{
font-size:11px;
opacity:.65;
margin-top:4px
}

.call-duration{
font-size:11px;
opacity:.7;
margin-top:4px
}

.call-message.missed .call-icon{
background:rgba(216,59,59,.15);
color:#ff5555
}

.call-message.rejected .call-icon,
.call-message.cancelled .call-icon{
background:rgba(255,255,255,.08);
color:#aaa
}

.message-reply{
display:flex;
align-items:stretch;
gap:7px;
margin-bottom:8px;
padding:7px 8px;
border-radius:10px;
background:rgba(0,0,0,.13);
border-right:3px solid #00e889;
font-size:11px;
max-width:100%;
overflow:hidden;
cursor:pointer;
transition: background 0.2s;
}

.message-reply:hover{
background:rgba(0,0,0,.25);
}

.message.other .message-reply{
background:rgba(255,255,255,.05)
}

.message.other .message-reply:hover{
background:rgba(255,255,255,.1);
}

.reply-line{
width:3px;
min-width:3px;
border-radius:5px;
background:#00e889
}

.reply-content{
min-width:0;
overflow:hidden
}

.reply-name{
font-weight:bold;
font-size:10px;
margin-bottom:2px;
color:#00e889
}

.message.mine .reply-name{
color:#fff
}

.reply-text{
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* التفاعلات داخل فقاعة الرسالة في الأسفل */
.message-reactions{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:4px;
position: absolute;
bottom: -10px;
right: 12px;
z-index: 5;
}
.message.mine .message-reactions {
right: auto;
left: 12px;
}

.reaction-chip{
border:1px solid rgba(255,255,255,.12);
background:#0b1613;
border-radius:12px;
padding:2px 6px;
font-size:11px;
line-height:16px;
cursor:pointer;
display:flex;
align-items:center;
gap:3px;
color:#fff;
box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

.reaction-chip.mine{
border-color:rgba(0,232,137,.55);
background:rgba(0,232,137,.25)
}

.reaction-count{
font-size:9px;
opacity:.9
}

.reply-compose{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:7px 10px;
background:#07100d;
border-top:1px solid rgba(0,232,137,.14);
z-index:45;
display:none;
align-items:center;
gap:8px
}

.reply-compose.show{
display:flex
}

.reply-compose-content{
flex:1;
min-width:0;
padding:7px 10px;
background:#111916;
border-radius:10px;
border-right:3px solid #00e889;
overflow:hidden
}

.reply-compose-name{
font-size:10px;
font-weight:bold;
color:#00e889;
margin-bottom:2px
}

.reply-compose-text{
font-size:11px;
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.reply-cancel{
width:32px;
height:32px;
border:0;
border-radius:10px;
background:#18231f;
color:#fff;
font-size:16px;
cursor:pointer
}

.message-menu{
position:absolute !important;
left:50% !important;
bottom:calc(100% + 8px) !important;
transform:translateX(-50%) !important;
width:190px !important;
min-width:190px !important;
max-width:190px !important;
height:auto !important;
min-height:0 !important;
padding:5px !important;
background:#0b1512 !important;
border:1px solid rgba(0,232,137,.18) !important;
border-radius:15px !important;
box-shadow:0 8px 25px rgba(0,0,0,.55) !important;
z-index:999999 !important;
display:block !important;
flex:none !important;
white-space:normal !important;
}

.message-menu button{
width:100% !important;
min-width:0 !important;
height:auto !important;
min-height:40px !important;
padding:10px 14px !important;
border:0 !important;
border-radius:11px !important;
background:#18231f !important;
color:#fff !important;
font-size:13px !important;
font-weight:bold !important;
cursor:pointer !important;
display:block !important;
margin-bottom:4px;
}

.message-menu button:last-child{
margin-bottom:0;
}

.message-menu button:hover{
background:#22332d !important;
}

#incomingCall{
position:fixed;
top:85px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
padding:14px;
background:#101815;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
box-shadow:0 15px 45px rgba(0,0,0,.5);
z-index:9000;
display:none;
align-items:center;
justify-content:space-between;
gap:12px
}

.incoming-call-info{
display:flex;
align-items:center;
gap:11px;
min-width:0
}

.incoming-name{
font-size:15px;
font-weight:bold
}

.incoming-type{
font-size:12px;
color:#9aa7a3;
margin-top:4px
}

.call-avatar{
width:52px;
height:52px
}

.incoming-actions{
display:flex;
gap:9px
}

.incoming-actions button{
width:46px;
height:46px;
border:0;
border-radius:50%;
font-size:20px;
color:#fff;
cursor:pointer
}

#rejectIncoming{
background:#d83b3b
}

#acceptIncoming{
background:#00e889;
color:#00150e
}

#callScreen{
position:fixed;
inset:0;
background:#020504;
z-index:10000;
display:none;
flex-direction:column;
overflow:hidden
}

.call-top{
height:85px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)
}

.call-top-info{
text-align:center
}

#callTitle{
font-size:20px;
font-weight:bold
}

#callState{
font-size:13px;
color:#00e889;
margin-top:6px
}

#callDuration{
font-size:12px;
color:#9aa7a3;
margin-top:4px
}

#audioCallView{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#020504
}

#videoArea{
position:relative;
flex:1;
background:#000;
overflow:hidden;
display:none
}

#remoteVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
display:none
}

#remoteAvatar{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#07110f;
z-index:1
}

#remoteAvatar img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover
}

#remoteAvatarEmoji{
font-size:70px
}

#localVideo{
position:absolute;
width:110px;
height:145px;
left:16px;
top:95px;
object-fit:cover;
border-radius:18px;
border:2px solid rgba(255,255,255,.7);
background:#111;
z-index:5;
display:none
}

#localAvatar{
position:absolute;
width:110px;
height:110px;
left:16px;
top:110px;
border-radius:50%;
background:#12352c;
z-index:6;
display:none;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:40px
}

.call-controls{
min-height:100px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
background:rgba(5,8,7,.98);
z-index:20
}

.call-control{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}

.call-control.accept{
background:#00e889;
color:#00150e
}

.call-control.reject,
.call-control.end{
background:#d83b3b
}

.call-control.active{
background:#00e889;
color:#00150e
}

.hidden{
display:none!important
}
</style>
</head>

<body>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020504;color:white;font-size:18px;z-index:999999">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>
<button id="backButton" class="back" type="button">→</button>
<div id="friendAvatar" class="avatar">👤</div>
<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>
<div class="call-buttons">
<button id="callButton" type="button">📞</button>
<button id="videoButton" type="button">📹</button>
</div>
</header>

<!-- شريط الرسالة المثبتة -->
<div id="pinnedBanner" class="pinned-banner">
<div class="pinned-banner-content" id="pinnedBannerClick">
<span>📌</span>
<span id="pinnedBannerText" class="pinned-banner-text">رسالة مثبتة</span>

<script type="module">

const videoButton = $("videoButton");

const pinnedBannerText = $("pinnedBannerText");
const pinnedBannerClick = $("pinnedBannerClick");
const pinnedBannerClose = $("pinnedBannerClose");

let currentUser = null;

let editingMessageId = null; // متغير لحفظ الرسالة قيد التعديل حالياً
let currentPinnedMessageId = null;

function getMessagePreview(data){
if(data.type === "text") return data.text || "رسالة";
if(data.type === "image") return "📷 صورة";
if(data.type === "video") return "🎥 فيديو";
if(data.type === "voice") return "🎤 رسالة صوتية";
if(data.type === "call") return "📞 مكالمة";
return "رسالة";
}

function startReply(data){
editingMessageId = null; // إلغاء وضع التعديل إن كان مفعلاً
sendButton.textContent = "➤";
replyTarget = {
id: data.id,
senderId: data.senderId,
senderName: data.senderId === currentUser.uid ? "أنت" : friendUser?.name || "المستخدم",
text: getMessagePreview(data)
};
replyComposeName.textContent = "الرد على " + replyTarget.senderName;
replyComposeText.textContent = replyTarget.text;
replyCompose.classList.add("show");
messageInput.focus();
}

function cancelReply(){
replyTarget = null;
replyCompose.classList.remove("show");
}

replyCancel.onclick = e => {
e.stopPropagation();
cancelReply();
};

const reactionList = ["❤️", "👍", "🔥", "😂", "😮"];

async function toggleReaction(messageId, emoji){
if(!currentUser || !chatID || !messageId || !emoji) return;
try{
const messageRef = doc(db, "chats", chatID, "messages", messageId);
const snap = await getDoc(messageRef);
if(!snap.exists()) return;
const data = snap.data();
const reactions = Array.isArray(data.reactions) ? data.reactions : [];
const mine = reactions.some(r => r && r.userId === currentUser.uid && r.emoji === emoji);

if(mine){
await updateDoc(messageRef, { reactions: arrayRemove({ userId: currentUser.uid, emoji }) });
}else{
const oldMine = reactions.find(r => r && r.userId === currentUser.uid);
if(oldMine){
await updateDoc(messageRef, { reactions: arrayRemove(oldMine) });
}
await updateDoc(messageRef, { reactions: arrayUnion({ userId: currentUser.uid, emoji }) });
}
}catch(e){
console.error("Reaction:", e);
}
}

function renderReactions(box, data){
if(!Array.isArray(data.reactions) || !data.reactions.length) return;
const wrapper = document.createElement("div");
wrapper.className = "message-reactions";
const counts = {};

data.reactions.forEach(reaction => {
if(!reaction || !reaction.emoji) return;
if(!counts[reaction.emoji]){
counts[reaction.emoji] = { count: 0, mine: false };
}
counts[reaction.emoji].count++;
if(reaction.userId === currentUser.uid){
counts[reaction.emoji].mine = true;
}
});

reactionList.forEach(emoji => {
const info = counts[emoji];
if(!info) return;
const chip = document.createElement("button");
chip.type = "button";
chip.className = "reaction-chip" + (info.mine ? " mine" : "");
chip.innerHTML = escapeHtml(emoji) + (info.count > 1 ? ` <span class="reaction-count">${info.count}</span>` : "");
chip.onclick = e => {
e.stopPropagation();
toggleReaction(data.id, emoji);
};
wrapper.appendChild(chip);
});

if(wrapper.children.length) box.appendChild(wrapper);
}

function createChatID(a, b){
return [a, b].sort().join("_");
}

function escapeHtml(value){
return String(value ?? "").replace(/[&<>'"]/g, c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));
}

function formatTime(timestamp){
if(!timestamp?.toDate) return "";
try{
return timestamp.toDate().toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
}catch{
return "";
}
}

function setUserAvatar(element, user){
if(user?.photo){
element.innerHTML = `<img src="${escapeHtml(user.photo)}" alt="">`;
}else{
element.innerHTML = "👤";
}
}

function showApp(){
loading.style.display = "none";
app.style.display = "flex";
}

async function updateMyPresence(online = true){
if(!currentUser) return;
try{
await setDoc(doc(db, "users", currentUser.uid), {
online,
lastSeen: serverTimestamp()
}, { merge: true });
}catch(e){}
}

function startPresence(){
updateMyPresence(true);
clearInterval(presenceInterval);
presenceInterval = setInterval(() => {
if(document.visibilityState === "visible") updateMyPresence(true);
}, 10000);
}

async function loadFriend(){
const friendId = new URLSearchParams(location.search).get("friend");
if(!friendId) throw new Error("لا يوجد صديق في الرابط");
const snap = await getDoc(doc(db, "users", friendId));
if(!snap.exists()) throw new Error("المستخدم غير موجود");
const data = snap.data();
friendUser = {
uid: friendId,
name: data.name || "مستخدم Mecd",
photo: data.photo || data.photoURL || ""
};
friendName.textContent = friendUser.name;
setUserAvatar(friendAvatar, friendUser);
chatID = createChatID(currentUser.uid, friendUser.uid);
}

attachButton.onclick = e => {
e.stopPropagation();
attachMenu.classList.toggle("show");
};

document.addEventListener("pointerdown", e => {
if(!e.target.closest("#attachMenu") && !e.target.closest("#attachButton")){
attachMenu.classList.remove("show");
}
if(!e.target.closest(".message-menu") && !e.target.closest(".message")){
removeMenus();
}
});

galleryButton.onclick = () => {
attachMenu.classList.remove("show");
galleryInput.click();
};

cameraButton.onclick = () => {
attachMenu.classList.remove("show");
cameraInput.click();
};

const messageElements = new Map();

function removeMenus(){
document.querySelectorAll(".message-menu").forEach(x => x.remove());
}

function showMessageMenu(element, data){
removeMenus();
const id = data.id;
const mine = data.senderId === currentUser.uid;
const messageType = data.type;
const currentText = data.text || "";

const menu = document.createElement("div");
menu.className = "message-menu";

const pinButton = document.createElement("button");
pinButton.type = "button";
pinButton.textContent = data.pinned ? "📌 إلغاء التثبيت" : "📌 تثبيت الرسالة";
pinButton.onclick = async e => {
e.stopPropagation();
await togglePinMessage(id, data.pinned === true);
removeMenus();
};
menu.appendChild(pinButton);

if(mine && messageType === "text"){
const editBtn = document.createElement("button");
editBtn.type = "button";
editBtn.textContent = "✏️ تعديل";
editBtn.onclick = e => {
e.stopPropagation();
removeMenus();
// تفعيل وضع التعديل ونقل النص لخانة الكتابة
editingMessageId = id;
messageInput.value = currentText;
sendButton.textContent = "✓";
cancelReply(); // إلغاء الرد إن كان مفعلاً
messageInput.focus();
};
menu.appendChild(editBtn);
}

const button = document.createElement("button");
button.type = "button";
button.textContent = mine ? "🗑️ إلغاء الإرسال" : "🗑️ حذف لدي";
button.onclick = async e => {
e.stopPropagation();
if(mine) await deleteDoc(doc(db, "chats", chatID, "messages", id));
else await updateDoc(doc(db, "chats", chatID, "messages", id), { deletedFor: arrayUnion(currentUser.uid) });
removeMenus();
};
menu.appendChild(button);
element.appendChild(menu);
}

async function togglePinMessage(id, currentlyPinned){
if(!currentUser || !chatID || !id) return;
try{
const messageRef = doc(db, "chats", chatID, "messages", id);
if(currentlyPinned){
await updateDoc(messageRef, { pinned: false });
}else{
await updateDoc(messageRef, { pinned: true });
}
}catch(e){}
}

function scrollToMessage(targetMessageId){
const targetEl = messageElements.get(targetMessageId);
if(targetEl){
targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
targetEl.classList.add("highlight");
setTimeout(() => targetEl.classList.remove("highlight"), 1500);
}
}

// 1. منطق السحب للرد (Swipe to Reply)
function setupSwipeToReply(element, data){
let startX = 0;
let currentX = 0;
let isSwiping = false;

element.addEventListener("touchstart", e => {
startX = e.touches[0].clientX;
isSwiping = true;
});

element.addEventListener("touchmove", e => {
if(!isSwiping) return;
currentX = e.touches[0].clientX;
let diffX = currentX - startX;
// السحب لليمين للرسائل الأخرى، ولليسار لرسائلك
if(data.senderId !== currentUser.uid && diffX > 0 && diffX < 100){
element.style.transform = `translateX(${diffX}px)`;
}else if(data.senderId === currentUser.uid && diffX < 0 && diffX > -100){
element.style.transform = `translateX(${diffX}px)`;
}
});

element.addEventListener("touchend", () => {
if(!isSwiping) return;
isSwiping = false;
let diffX = currentX - startX;
if(Math.abs(diffX) > 50){
startReply(data);
}
element.style.transform = "translateX(0px)";
});
}

function addMessageActions(element, data){
let timer = null;
element.addEventListener("pointerdown", () => {
timer = setTimeout(() => showMessageMenu(element, data), 500);
});
element.addEventListener("pointerup", () => clearTimeout(timer));
element.addEventListener("contextmenu", e => {
e.preventDefault();
showMessageMenu(element, data);
});

let lastClickTime = 0;
element.addEventListener("click", e => {
if(e.target.closest(".message-menu") || e.target.closest("button") || e.target.closest(".message-reply")) return;
const currentTime = new Date().getTime();
if(currentTime - lastClickTime < 300 && currentTime - lastClickTime > 0){
triggerHeartReaction(element, data.id);
e.preventDefault();
}
lastClickTime = currentTime;
});

setupSwipeToReply(element, data);
}

function triggerHeartReaction(element, messageId){
if(element.querySelector('.heart-pop')) return;
const heart = document.createElement('div');
heart.className = 'heart-pop';
heart.innerHTML = '❤️';
element.appendChild(heart);
toggleReaction(messageId, '❤️');
setTimeout(() => heart.remove(), 900);
}

function renderMessages(snapshot){
const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 120;

snapshot.docChanges().forEach(change => {
const id = change.doc.id;
const data = { ...change.doc.data(), id };

if(change.type === "removed"){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

// 3. تحديث شريط الرسائل المثبتة بالأعلى
if(data.pinned === true){
currentPinnedMessageId = id;
pinnedBannerText.textContent = (data.senderId === currentUser.uid ? "أنت: " : "") + getMessagePreview(data);
pinnedBanner.classList.add("show");
}else if(currentPinnedMessageId === id && !data.pinned){
currentPinnedMessageId = null;
pinnedBanner.classList.remove("show");
}

const box = document.createElement("div");
box.className = "message " + (data.senderId === currentUser.uid ? "mine" : "other");

if(data.replyTo){
const replyBox = document.createElement("div");
replyBox.className = "message-reply";
replyBox.onclick = e => {
e.stopPropagation();
scrollToMessage(data.replyTo.messageId);
};
const replyLine = document.createElement("div");
replyLine.className = "reply-line";
const replyContent = document.createElement("div");
replyContent.className = "reply-content";
const replyName = document.createElement("div");
replyName.className = "reply-name";
replyName.textContent = data.replyTo.senderId === currentUser.uid ? "أنت" : (data.replyTo.senderName || "المستخدم");
const replyText = document.createElement("div");
replyText.className = "reply-text";
replyText.textContent = data.replyTo.text || "رسالة";
replyContent.append(replyName, replyText);
replyBox.append(replyLine, replyContent);
box.appendChild(replyBox);
}

if(data.type === "text"){
box.appendChild(document.createTextNode(data.text || ""));
if(data.isEdited){
const edited = document.createElement("span");
edited.style.fontSize = "9px";
edited.style.opacity = "0.6";
edited.textContent = " (معدلة)";
box.appendChild(edited);
}
}

const meta = document.createElement("div");
meta.className = "message-meta";
const time = document.createElement("span");
time.className = "time";
time.textContent = formatTime(data.createdAt);
meta.appendChild(time);

if(data.senderId === currentUser.uid){
const status = document.createElement("span");
status.className = "message-status " + (data.read === true ? "read" : "");
status.textContent = data.read === true ? "✓✓" : "✓";
meta.appendChild(status);
}
box.appendChild(meta);

renderReactions(box, data);
addMessageActions(box, data);

const old = messageElements.get(id);
if(old) old.replaceWith(box);
else messages.appendChild(box);
messageElements.set(id, box);
});

if(nearBottom){
requestAnimationFrame(() => messages.scrollTop = messages.scrollHeight);
}
}

pinnedBannerClick.onclick = () => {
if(currentPinnedMessageId) scrollToMessage(currentPinnedMessageId);
};

pinnedBannerClose.onclick = async () => {
if(currentPinnedMessageId){
await togglePinMessage(currentPinnedMessageId, true);
}
};

function listenMessages(){
if(!chatID) return;
const q = query(collection(db, "chats", chatID, "messages"), orderBy("createdAt", "asc"));
if(unsubscribeMessages) unsubscribeMessages();
unsubscribeMessages = onSnapshot(q, renderMessages);
}

// 4. إرسال أو تعديل الرسالة مباشرة عبر خانة الكتابة الأساسية
async function handleSendMessage(){
const text = messageInput.value.trim();
if(!text || !currentUser || !friendUser || !chatID) return;
sendButton.disabled = true;

try{
if(editingMessageId){
// وضع التعديل نشط
await updateDoc(doc(db, "chats", chatID, "messages", editingMessageId), {
text: text,
isEdited: true
});
editingMessageId = null;
sendButton.textContent = "➤";
}else{
// إرسال رسالة جديدة
const messageData = {
text,
senderId: currentUser.uid,
receiverId: friendUser.uid,
type: "text",
read: false,
deletedFor: [],
createdAt: serverTimestamp()
};

if(replyTarget){
messageData.replyTo = {
messageId: replyTarget.id,
senderId: replyTarget.senderId,
senderName: replyTarget.senderName,
text: replyTarget.text
};
}

await addDoc(collection(db, "chats", chatID, "messages"), messageData);
await setDoc(doc(db, "chats", chatID), {
lastMessage: text,
lastMessageAt: serverTimestamp(),
lastSenderId: currentUser.uid
}, { merge: true });
}

messageInput.value = "";
cancelReply();
}catch(e){
console.error(e);
}finally{
sendButton.disabled = false;
messageInput.focus();
}
}

sendButton.onclick = handleSendMessage;
messageInput.addEventListener("keydown", e => {
if(e.key === "Enter"){
e.preventDefault();
handleSendMessage();
}
});

backButton.onclick = async () => {
if(unsubscribeMessages) unsubscribeMessages();
if(unsubscribeFriendStatus) unsubscribeFriendStatus();
history.back();
};

onAuthStateChanged(auth, async user => {
if(!user) return;
currentUser = user;
try{
startPresence();
await loadFriend();
listenMessages();
showApp();
}catch(e){
loading.textContent = e.message;
}
});
</script>
