<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat - الدردشة</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
overflow:hidden;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

header{
height:75px;
padding:12px 18px;
display:flex;
align-items:center;
gap:12px;
background:rgba(5,10,8,.96);
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
}

.back{
width:45px;
height:45px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.06);
color:white;
font-size:24px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.back:active{
transform:scale(.94);
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#12352c;
font-size:24px;
flex-shrink:0;
border:1px solid rgba(0,230,118,.3);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:17px;
font-weight:bold;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.user-status{
font-size:11px;
color:#7d8985;
margin-top:4px;
transition:.2s ease;
}

.user-status.online{
color:#00e889;
}

.messages{
flex:1;
overflow-y:auto;
padding:20px 15px 110px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
font-size:14px;
}

.message{
position:relative;
max-width:78%;
padding:11px 14px;
border-radius:18px;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
overflow-wrap:anywhere;
white-space:pre-wrap;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
color:white;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px;
}

.time{
display:block;
font-size:9px;
opacity:.55;
margin-top:4px;
}

.message.image-message,
.message.video-message{
padding:7px;
max-width:92%;
overflow:hidden;
}

.message-image{
display:block;
width:auto !important;
height:auto !important;
max-width:min(100%,500px) !important;
max-height:none !important;
object-fit:contain !important;
border-radius:14px;
cursor:pointer;
}

.message-video{
display:block;
width:auto !important;
height:auto !important;
max-width:min(100%,500px) !important;
max-height:none !important;
object-fit:contain !important;
border-radius:14px;
background:#000;
cursor:pointer;
}

.media-wrapper{
position:relative;
display:inline-block;
max-width:100%;
line-height:0;
}

.media-wrapper img,
.media-wrapper video{
display:block;
}

.media-loading{
display:flex;
align-items:center;
justify-content:center;
gap:9px;
min-width:180px;
min-height:80px;
padding:14px;
border-radius:14px;
background:rgba(0,0,0,.18);
}

.media-progress{
width:150px;
height:6px;
}

.media-progress-label{
font-size:12px;
opacity:.85;
}

.reply-preview{
padding:7px 9px;
margin-bottom:6px;
border-right:3px solid #00e889;
background:rgba(0,232,137,.08);
border-radius:8px;
font-size:12px;
opacity:.9;
}

.pinned-badge{
font-size:11px;
opacity:.85;
margin-bottom:4px;
}

.message-actions-badge{
display:flex;
gap:4px;
flex-wrap:wrap;
margin-top:5px;
font-size:13px;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:12px;
display:flex;
gap:9px;
background:rgba(5,8,7,.97);
border-top:1px solid rgba(255,255,255,.08);
z-index:20;
}

#messageInput{
flex:1;
min-width:0;
padding:14px 16px;
border-radius:17px;
border:1px solid rgba(255,255,255,.09);
outline:none;
background:#111916;
color:white;
font-family:inherit;
font-size:15px;
direction:rtl;
}

#messageInput:focus{
border-color:#00e676;
box-shadow:0 0 0 3px rgba(0,230,118,.07);
}

#messageInput::placeholder{
color:#63716d;
}

#sendButton{
width:52px;
height:52px;
border:none;
border-radius:17px;
background:#00e889;
color:#00150e;
font-size:22px;
cursor:pointer;
flex-shrink:0;
}

#sendButton:active{
transform:scale(.94);
}

#sendButton:disabled{
opacity:.5;
cursor:not-allowed;
}

#voiceButton,
#callButton,
#videoButton{
width:45px;
height:45px;
border:none;
border-radius:15px;
background:#18231f;
color:white;
font-size:20px;
cursor:pointer;
flex-shrink:0;
}

#voiceButton:active,
#callButton:active,
#videoButton:active{
transform:scale(.94);
}

.call-buttons{
display:flex;
gap:8px;
margin-right:auto;
}

#attachButton{
width:45px;
height:45px;
border:none;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:28px;
line-height:1;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex:0 0 45px;
}

#attachButton:active{
transform:scale(.94);
}

.attach-menu{
position:absolute;
bottom:72px;
right:72px;
display:none;
flex-direction:column;
gap:7px;
padding:8px;
background:#111916;
border:1px solid rgba(255,255,255,.08);
border-radius:16px;
z-index:90;
box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.attach-menu.show{
display:flex;
}

.attach-menu button{
border:0;
background:#18231f;
color:#fff;
border-radius:12px;
padding:11px 14px;
font-family:inherit;
font-size:14px;
white-space:nowrap;
text-align:right;
cursor:pointer;
}

.attach-menu button:active{
transform:scale(.97);
}

#recordBox{
position:fixed;
bottom:75px;
left:50%;
transform:translateX(-50%);
background:#18231f;
padding:10px 15px;
border-radius:20px;
display:flex;
gap:10px;
align-items:center;
z-index:50;
}

#recordText{
color:#00e889;
}

#cancelRecord{
background:#ff3333;
color:white;
border:none;
border-radius:12px;
padding:6px 12px;
}

.message-menu{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:#111916;
border-radius:12px;
padding:8px;
z-index:999;
}

.message-menu button{
background:#18231f;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-size:14px;
}

.message-menu button:active{
transform:scale(.95);
}

.loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
background:#020504;
color:#a8bdb6;
font-size:15px;
z-index:100;
}

.error-screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:#020504;
text-align:center;
padding:30px;
z-index:200;
}

.error-box{
width:100%;
max-width:500px;
padding:30px;
border-radius:25px;
background:#0b100e;
border:1px solid rgba(255,255,255,.08);
}

.error-box h2{
font-size:25px;
margin-bottom:15px;
}

.error-box p{
color:#9aa7a3;
line-height:1.8;
font-size:14px;
}

.spinner{
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

.incoming-call{
position:fixed;
top:84px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
z-index:300;
background:#111916;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:12px 14px;
box-shadow:0 15px 45px rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.incoming-call-info{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.incoming-name{
font-weight:bold;
font-size:15px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.incoming-type{
font-size:12px;
color:#9aa7a3;
margin-top:3px;
}

.incoming-actions{
display:flex;
gap:8px;
flex-shrink:0;
}

.incoming-actions button{
width:45px;
height:45px;
border:0;
border-radius:50%;
font-size:20px;
color:white;
cursor:pointer;
background:#26332e;
}

.incoming-actions button:last-child{
background:#00c96b;
color:#00150e;
}

.call-avatar,
.remote-call-avatar{
width:50px;
height:50px;
border-radius:50%;
overflow:hidden;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
}

.call-avatar img,
.remote-call-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

.call-screen{
position:fixed;
inset:0;
z-index:400;
background:#020504;
display:flex;
flex-direction:column;
}

.call-top{
height:75px;
padding:14px 18px;
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(5,10,8,.96);
border-bottom:1px solid rgba(255,255,255,.08);
}

.call-title{
font-weight:bold;
font-size:18px;
}

.call-duration{
font-size:13px;
color:#8e9b96;
}

.call-stage{
position:relative;
flex:1;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
background:#020504;
}

.remote-video{
width:100%;
height:100%;
object-fit:contain;
display:none;
background:#000;
}

.local-video{
position:absolute;
right:16px;
top:16px;
width:120px;
height:170px;
object-fit:cover;
border-radius:20px;
border:2px solid rgba(255,255,255,.18);
display:none;
background:#111916;
}

.remote-call-avatar{
width:110px;
height:110px;
font-size:48px;
}

.call-controls{
height:95px;
display:flex;
align-items:center;
justify-content:center;
gap:16px;
background:rgba(5,10,8,.98);
}

.call-controls button{
width:55px;
height:55px;
border:0;
border-radius:50%;
background:#18231f;
color:white;
font-size:22px;
cursor:pointer;
}

.call-controls .end-call{
background:#e53935;
color:white;
transform:rotate(135deg);
}

@media(max-width:480px){

.attach-menu{
right:58px;
bottom:68px;
max-width:calc(100vw - 75px);
}

header{
height:70px;
padding:10px 13px;
}

.back{
width:43px;
height:43px;
}

.avatar{
width:45px;
height:45px;
border-radius:15px;
}

.user-name{
font-size:16px;
}

.messages{
padding:15px 12px 105px;
}

.message{
max-width:84%;
font-size:14px;
}

.message.image-message,
.message.video-message{
max-width:94%;
}

.input-area{
padding:10px;
}

#messageInput{
font-size:14px;
padding:13px 14px;
}

#sendButton{
width:50px;
height:50px;
}

.local-video{
width:105px;
height:150px;
}

.call-controls{
height:88px;
}

.incoming-call{
top:75px;
}

}

</style>
</head>

<body>

<div id="loading" class="loading">
<div class="spinner"></div>
<div>جارٍ فتح الدردشة...</div>
</div>

<div id="errorScreen" class="error-screen" style="display:none;">
<div class="error-box">
<h2>⚠️ تعذر فتح الدردشة</h2>
<p id="errorText"></p>
</div>
</div>

<main id="app" class="app" style="display:none;">

<header>

<button id="backButton" class="back" type="button">→</button>

<div id="friendAvatar" class="avatar">👤</div>

<div class="user-info">
<div id="friendName" class="user-name">جارٍ التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton">📞</button>
<button id="videoButton">📹</button>
</div>

</header>

<div id="messages" class="messages">

<div class="empty">
💬
<br>
ابدأ المحادثة الآن
</div>

</div>

<div class="input-area">

<button id="attachButton" type="button">+</button>

<div id="attachMenu" class="attach-menu">
<button id="galleryButton" type="button">🖼️ صورة / فيديو</button>
<button id="cameraButton" type="button">📷 كاميرا</button>
<button id="fileButton" type="button">📎 ملف</button>
</div>

<input id="galleryInput" type="file" accept="image/*,video/*" hidden>
<input id="cameraInput" type="file" accept="image/*,video/*" capture="environment" hidden>
<input id="fileInput" type="file" accept="*/*" hidden>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>

<button id="voiceButton" type="button">🎤</button>

<div id="recordBox" style="display:none;">
<span id="recordText">يسجل الآن...</span>
<span id="recordTime">00:00</span>
<button id="cancelRecord">إلغاء</button>
</div>

<button id="sendButton" type="button">➤</button>

</div>

<div id="incomingCall" class="incoming-call" style="display:none;">

<div class="incoming-call-info">
<div id="incomingAvatar" class="call-avatar">👤</div>

<div>
<div id="incomingName" class="incoming-name">مكالمة واردة</div>
<div id="incomingType" class="incoming-type">📞 مكالمة صوتية</div>
</div>

</div>

<div class="incoming-actions">
<button id="rejectIncoming" type="button">✕</button>
<button id="acceptIncoming" type="button">✓</button>
</div>

</div>

<div id="callScreen" class="call-screen" style="display:none;">

<div class="call-top">
<div id="callTitle" class="call-title">مكالمة</div>
<div id="callDuration" class="call-duration">00:00</div>
</div>

<div class="call-stage">

<div id="remoteCallAvatar" class="remote-call-avatar">👤</div>

<video
id="remoteVideo"
class="remote-video"
autoplay
playsinline
controls>
</video>

<video
id="localVideo"
class="local-video"
autoplay
muted
playsinline>
</video>

</div>

<div class="call-controls">
<button id="muteCall" type="button">🎤</button>
<button id="switchVideo" type="button">📹</button>
<button id="endCall" type="button" class="end-call">📞</button>
</div>

</div>

</main>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
doc,
addDoc,
setDoc,
getDoc,
updateDoc,
deleteDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"YOUR_API_KEY",
authDomain:"YOUR_PROJECT.firebaseapp.com",
projectId:"YOUR_PROJECT_ID",
storageBucket:"YOUR_PROJECT.appspot.com",
messagingSenderId:"YOUR_SENDER_ID",
appId:"YOUR_APP_ID"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

const MAX_FILE_SIZE = 500 * 1024 * 1024;

let currentUser = null;
let friendId = null;
let messagesUnsubscribe = null;

const loading = document.getElementById("loading");
const errorScreen = document.getElementById("errorScreen");
const errorText = document.getElementById("errorText");
const app = document.getElementById("app");

const messages = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

const attachButton = document.getElementById("attachButton");
const attachMenu = document.getElementById("attachMenu");

const galleryButton = document.getElementById("galleryButton");
const cameraButton = document.getElementById("cameraButton");
const fileButton = document.getElementById("fileButton");

const galleryInput = document.getElementById("galleryInput");
const cameraInput = document.getElementById("cameraInput");
const fileInput = document.getElementById("fileInput");

function showError(message){
loading.style.display="none";
app.style.display="none";
errorText.textContent=message;
errorScreen.style.display="flex";
}

function escapeHTML(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function formatTime(timestamp){

if(!timestamp) return "";

try{

const date =
timestamp.toDate
? timestamp.toDate()
: new Date(timestamp);

return date.toLocaleTimeString("ar",{
hour:"2-digit",
minute:"2-digit"
});

}catch{
return "";
}

}

function scrollMessages(){
requestAnimationFrame(()=>{
messages.scrollTop = messages.scrollHeight;
});
}

function clearEmpty(){
const empty = messages.querySelector(".empty");
if(empty) empty.remove();
}

function addTextMessage(data,id){

clearEmpty();

const box = document.createElement("div");

box.className =
"message " +
(data.senderId === currentUser.uid ? "mine" : "other");

box.dataset.id=id;

const text = document.createElement("div");
text.textContent = data.text || "";

box.appendChild(text);

const time = document.createElement("span");
time.className="time";
time.textContent=formatTime(data.createdAt);

box.appendChild(time);

messages.appendChild(box);

}

function addMediaMessage(data,id){

clearEmpty();

const box=document.createElement("div");

box.className =
"message " +
(data.senderId === currentUser.uid ? "mine" : "other") +
(data.type==="video" ? " video-message" : " image-message");

box.dataset.id=id;

const wrapper=document.createElement("div");
wrapper.className="media-wrapper";

if(data.type==="video"){

const video=document.createElement("video");

video.className="message-video";

video.controls=true;
video.playsInline=true;
video.preload="metadata";
video.src=data.url;

video.addEventListener("loadedmetadata",()=>{
video.style.width =
Math.min(video.videoWidth || 500,500)+"px";

video.style.height =
"auto";

});

wrapper.appendChild(video);

}else{

const img=document.createElement("img");

img.className="message-image";
img.src=data.url;
img.alt="صورة";

img.addEventListener("load",()=>{

const naturalWidth=img.naturalWidth;
const naturalHeight=img.naturalHeight;

if(naturalWidth && naturalHeight){

img.style.width =
Math.min(naturalWidth,500)+"px";

img.style.height="auto";

}

});

img.addEventListener("click",()=>{

const win=window.open();

if(win){

win.document.write(`
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{
margin:0;
width:100%;
height:100%;
background:#000;
display:flex;
align-items:center;
justify-content:center;
overflow:auto;
}
img{
display:block;
width:auto;
height:auto;
max-width:none;
max-height:none;
}
</style>
</head>
<body>
<img src="${escapeHTML(data.url)}">
</body>
</html>
`);

win.document.close();

}

});

wrapper.appendChild(img);

}

box.appendChild(wrapper);

const time=document.createElement("span");
time.className="time";
time.textContent=formatTime(data.createdAt);

box.appendChild(time);

messages.appendChild(box);

}

function addFileMessage(data,id){

clearEmpty();

const box=document.createElement("div");

box.className =
"message " +
(data.senderId === currentUser.uid ? "mine" : "other");

const link=document.createElement("a");

link.href=data.url;
link.target="_blank";
link.rel="noopener";
link.textContent="📎 "+(data.name || "ملف");

link.style.color="inherit";
link.style.textDecoration="none";

box.appendChild(link);

const time=document.createElement("span");

time.className="time";
time.textContent=formatTime(data.createdAt);

box.appendChild(time);

messages.appendChild(box);

}

function renderMessage(data,id){

if(data.type==="image" || data.type==="video"){
addMediaMessage(data,id);
return;
}

if(data.type==="file"){
addFileMessage(data,id);
return;
}

addTextMessage(data,id);

}

async function sendText(){

const text=messageInput.value.trim();

if(!text || !currentUser || !friendId) return;

messageInput.value="";
sendButton.disabled=true;

try{

await addDoc(
collection(
db,
"chats",
getChatId(currentUser.uid,friendId),
"messages"
),
{
senderId:currentUser.uid,
receiverId:friendId,
type:"text",
text:text,
createdAt:serverTimestamp(),
edited:false,
pinned:false,
reactions:{}
}
);

}catch(error){

console.error(error);
messageInput.value=text;

}finally{

sendButton.disabled=false;
messageInput.focus();

}

}

function getChatId(a,b){
return [a,b].sort().join("_");
}

async function sendMedia(file){

if(!file || !currentUser || !friendId) return;

if(file.size > MAX_FILE_SIZE){

alert(
"الملف أكبر من الحد المسموح.\nالحد الأقصى هو 500 MB."
);

return;

}

const type =
file.type.startsWith("video/")
? "video"
: file.type.startsWith("image/")
? "image"
: "file";

const localURL=URL.createObjectURL(file);

clearEmpty();

const temp=document.createElement("div");

temp.className="message mine";

temp.innerHTML=`
<div class="media-loading">
<div class="spinner"></div>
<div>
<div>جارٍ تجهيز الملف...</div>
<div class="media-progress-label">0%</div>
</div>
</div>
`;

messages.appendChild(temp);
scrollMessages();

const progress=temp.querySelector(".media-progress-label");

try{

/*
  ملاحظة:
  Firebase Storage يجب أن يكون مستخدمًا هنا لرفع الملفات فعليًا.
  هذا الكود لا يحوّل الصورة أو الفيديو إلى حجم أصغر.
*/

if(type==="image" || type==="video"){

const wrapper=document.createElement("div");
wrapper.className="media-wrapper";

if(type==="video"){

const video=document.createElement("video");

video.className="message-video";
video.controls=true;
video.playsInline=true;
video.preload="metadata";
video.src=localURL;

video.addEventListener("loadedmetadata",()=>{
video.style.width =
Math.min(video.videoWidth || 500,500)+"px";
video.style.height="auto";
});

wrapper.appendChild(video);

}else{

const img=document.createElement("img");

img.className="message-image";
img.src=localURL;

img.onload=()=>{

img.style.width =
Math.min(img.naturalWidth || 500,500)+"px";

img.style.height="auto";

};

wrapper.appendChild(img);

}

temp.innerHTML="";
temp.appendChild(wrapper);

const time=document.createElement("span");
time.className="time";
time.textContent="جاهز للإرسال";

temp.appendChild(time);

}else{

temp.innerHTML=
"📎 "+escapeHTML(file.name);

}

if(progress) progress.textContent="100%";

}catch(error){

console.error(error);

temp.remove();

alert("حدث خطأ أثناء تجهيز الملف.");

}

}

attachButton.addEventListener("click",()=>{
attachMenu.classList.toggle("show");
});

galleryButton.addEventListener("click",()=>{
attachMenu.classList.remove("show");
galleryInput.click();
});

cameraButton.addEventListener("click",()=>{
attachMenu.classList.remove("show");
cameraInput.click();
});

fileButton.addEventListener("click",()=>{
attachMenu.classList.remove("show");
fileInput.click();
});

galleryInput.addEventListener("change",()=>{
if(galleryInput.files[0]){
sendMedia(galleryInput.files[0]);
}
galleryInput.value="";
});

cameraInput.addEventListener("change",()=>{
if(cameraInput.files[0]){
sendMedia(cameraInput.files[0]);
}
cameraInput.value="";
});

fileInput.addEventListener("change",()=>{
if(fileInput.files[0]){
sendMedia(fileInput.files[0]);
}
fileInput.value="";
});

sendButton.addEventListener("click",sendText);

messageInput.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
e.preventDefault();
sendText();
}

});

document.addEventListener("click",(e)=>{

if(
!attachMenu.contains(e.target) &&
e.target!==attachButton
){
attachMenu.classList.remove("show");
}

});

async function loadMessages(){

if(messagesUnsubscribe){
messagesUnsubscribe();
messagesUnsubscribe=null;
}

const chatId=getChatId(currentUser.uid,friendId);

const q=query(
collection(db,"chats",chatId,"messages"),
orderBy("createdAt","asc")
);

messagesUnsubscribe=onSnapshot(
q,
snapshot=>{

messages.innerHTML="";

if(snapshot.empty){

messages.innerHTML=`
<div class="empty">
💬
<br>
ابدأ المحادثة الآن
</div>
`;

return;

}

snapshot.forEach(item=>{

renderMessage(
item.data(),
item.id
);

});

scrollMessages();

},
error=>{

console.error(error);

showError(
"تعذر تحميل الرسائل. تأكد من صلاحيات Firebase."
);

}
);

}

onAuthStateChanged(auth,async user=>{

if(!user){

showError("يجب تسجيل الدخول أولاً.");
return;

}

currentUser=user;

const params=new URLSearchParams(location.search);

friendId =
params.get("friendId") ||
params.get("uid") ||
localStorage.getItem("friendId");

if(!friendId){

showError("لم يتم تحديد صاحب المحادثة.");

return;

}

try{

const friendSnap=
await getDoc(doc(db,"users",friendId));

if(friendSnap.exists()){

const data=friendSnap.data();

document.getElementById("friendName").textContent =
data.name ||
data.displayName ||
"مستخدم";

if(data.photoURL){

document.getElementById("friendAvatar").innerHTML=
`<img src="${escapeHTML(data.photoURL)}" alt="">`;

}

}else{

document.getElementById("friendName").textContent=
"مستخدم";

}

loading.style.display="none";
app.style.display="flex";

await loadMessages();

}catch(error){

console.error(error);

showError(
"حدث خطأ أثناء فتح المحادثة."
);

}

});

document.getElementById("backButton")
.addEventListener("click",()=>{
history.back();
});

</script>
