<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111b21">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent
}

html,body{
width:100%;
height:100%
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#0b141a;
color:#e9edef;
overflow:hidden
}

button,input{
font:inherit
}

button{
-webkit-tap-highlight-color:transparent
}

.app{
height:100dvh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:#0b141a;
overflow:hidden
}

/* ================= HEADER ================= */

header{
height:62px;
min-height:62px;
background:#202c33;
display:flex;
align-items:center;
padding:0 8px;
gap:8px;
z-index:20;
box-shadow:0 1px 3px rgba(0,0,0,.25)
}

.back,
.header-action{
width:42px;
height:42px;
border:0;
background:transparent;
color:#d9e1e5;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:24px;
flex-shrink:0
}

.header-action{
font-size:20px
}

.contact-info{
display:flex;
align-items:center;
gap:10px;
flex:1;
min-width:0;
cursor:pointer
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#667781;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:21px;
flex-shrink:0
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:16px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#f5f6f6
}

.user-status{
font-size:12px;
margin-top:3px;
color:#aebac1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status.online{
color:#aebac1
}

.call-buttons{
display:flex;
align-items:center;
gap:1px
}

/* ================= MESSAGES ================= */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:12px 8px 92px;
display:flex;
flex-direction:column;
gap:3px;
background:
radial-gradient(circle at center,rgba(20,33,39,.55),transparent 70%),
#0b141a;
scroll-behavior:smooth
}

.messages::-webkit-scrollbar{
width:5px
}

.messages::-webkit-scrollbar-thumb{
background:#33434d;
border-radius:10px
}

.empty{
margin:auto;
text-align:center;
color:#8696a0;
line-height:1.9;
font-size:14px
}

.message{
position:relative;
max-width:82%;
min-width:85px;
padding:7px 8px 22px;
border-radius:8px;
font-size:15px;
line-height:1.45;
word-break:break-word;
overflow-wrap:anywhere;
user-select:none;
touch-action:pan-y;
animation:messageIn .12s ease-out
}

@keyframes messageIn{
from{
opacity:.4;
transform:translateY(3px)
}
to{
opacity:1;
transform:translateY(0)
}
}

.message.mine{
align-self:flex-start;
background:#005c4b;
color:#e9edef;
border-top-left-radius:0
}

.message.other{
align-self:flex-end;
background:#202c33;
color:#e9edef;
border-top-right-radius:0
}

.message.highlight{
animation:highlightMessage 1.5s ease
}

@keyframes highlightMessage{
0%,100%{
filter:none
}
40%{
filter:brightness(1.5)
}
}

.message.deleted{
font-style:italic;
color:#8696a0;
min-width:150px
}

.message.image-message,
.message.video-message,
.message.voice-message{
padding:5px 5px 22px
}

.message-image,
.message-video{
display:block;
max-width:270px;
width:100%;
max-height:330px;
border-radius:6px;
object-fit:cover;
background:#111
}

.message-video{
background:#000
}

/* ================= REPLY ================= */

.message-reply{
border-right:4px solid #00a884;
padding:5px 7px;
margin-bottom:6px;
border-radius:4px;
background:rgba(0,0,0,.18);
cursor:pointer;
min-width:150px
}

.message.other .message-reply{
background:rgba(255,255,255,.05)
}

.reply-name{
font-size:11px;
font-weight:bold;
color:#00a884;
margin-bottom:2px
}

.reply-text{
font-size:11px;
color:#aebac1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:230px
}

/* ================= META ================= */

.message-meta{
position:absolute;
bottom:4px;
left:7px;
display:flex;
align-items:center;
gap:3px;
direction:ltr
}

.message.other .message-meta{
left:auto;
right:7px
}

.time{
font-size:10px;
color:#aebac1;
white-space:nowrap
}

.message.mine .time{
color:rgba(233,237,239,.72)
}

.message-status{
font-size:12px;
letter-spacing:-3px;
font-weight:bold;
color:#8696a0
}

.message-status.read{
color:#53bdeb
}

/* ================= REACTIONS ================= */

.message-reactions{
position:absolute;
bottom:-12px;
left:6px;
display:flex;
gap:2px;
z-index:3
}

.message.mine .message-reactions{
left:auto;
right:6px
}

.reaction-chip{
border:1px solid #40515b;
background:#202c33;
border-radius:14px;
padding:1px 5px;
color:white;
font-size:11px;
cursor:pointer;
min-width:28px
}

.reaction-chip.mine{
border-color:#00a884
}

.reaction-count{
font-size:9px
}

/* ================= VOICE ================= */

.voice-box{
display:flex;
align-items:center;
gap:8px;
min-width:220px;
direction:ltr
}

.voice-play{
width:34px;
height:34px;
border:0;
border-radius:50%;
background:#00a884;
color:white;
cursor:pointer;
font-size:14px;
flex-shrink:0
}

.voice-wave{
flex:1;
height:4px;
background:rgba(255,255,255,.25);
border-radius:10px;
position:relative;
overflow:hidden
}

.voice-wave::after{
content:"";
position:absolute;
height:100%;
width:35%;
left:0;
top:0;
background:#d9e1e5;
border-radius:10px
}

.voice-duration{
font-size:10px;
color:#aebac1;
min-width:30px
}

/* ================= PIN ================= */

.pinned-banner{
display:none;
align-items:center;
gap:9px;
padding:8px 12px;
background:#111b21;
border-bottom:1px solid #2a3942;
font-size:12px;
z-index:15
}

.pinned-banner.show{
display:flex
}

.pinned-banner-content{
flex:1;
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
min-width:0
}

.pinned-banner-text{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#aebac1
}

.pinned-banner-close{
border:0;
background:transparent;
color:#aebac1;
font-size:18px;
cursor:pointer
}

/* ================= INPUT ================= */

.input-area{
position:absolute;
bottom:0;
right:0;
left:0;
min-height:68px;
padding:8px;
display:flex;
align-items:center;
gap:7px;
background:#0b141a;
z-index:50
}

.input-box{
flex:1;
min-width:0;
height:50px;
border-radius:25px;
background:#202c33;
display:flex;
align-items:center;
padding:0 6px
}

.input-icon{
width:40px;
height:40px;
border:0;
background:transparent;
color:#8696a0;
font-size:22px;
border-radius:50%;
cursor:pointer;
flex-shrink:0
}

#messageInput{
flex:1;
min-width:0;
height:44px;
border:0;
outline:0;
background:transparent;
color:#e9edef;
font-size:15px;
padding:0 5px
}

#messageInput::placeholder{
color:#8696a0
}

#sendButton,
#voiceButton{
width:50px;
height:50px;
border:0;
border-radius:50%;
background:#00a884;
color:#fff;
font-size:21px;
cursor:pointer;
flex-shrink:0
}

#voiceButton.recording{
background:#d64045;
animation:pulse 1s infinite
}

@keyframes pulse{
50%{
transform:scale(1.08)
}
}

/* ================= REPLY COMPOSE ================= */

.reply-compose{
display:none;
position:absolute;
bottom:67px;
right:0;
left:0;
padding:7px 10px;
background:#202c33;
border-bottom:1px solid #33434d;
align-items:center;
gap:8px;
z-index:45
}

.reply-compose.show{
display:flex
}

.reply-compose-content{
flex:1;
min-width:0;
padding:5px 9px;
border-right:4px solid #00a884;
background:#182229;
border-radius:4px
}

.reply-compose-name{
font-size:11px;
font-weight:bold;
color:#00a884
}

.reply-compose-text{
font-size:11px;
color:#aebac1;
margin-top:2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.reply-cancel{
width:35px;
height:35px;
border:0;
background:transparent;
color:#8696a0;
font-size:20px;
cursor:pointer
}

/* ================= ATTACH SHEET ================= */

.attach-backdrop,
.bottom-sheet-backdrop,
.contact-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:1000;
display:flex;
align-items:flex-end
}

.attach-sheet,
.bottom-sheet,
.contact-sheet{
width:100%;
max-width:650px;
margin:auto;
background:#202c33;
border-radius:20px 20px 0 0;
padding:16px 16px 28px;
animation:slideUp .2s ease
}

@keyframes slideUp{
from{
transform:translateY(100%)
}
to{
transform:translateY(0)
}
}

.sheet-handle{
width:40px;
height:4px;
border-radius:5px;
background:#667781;
margin:0 auto 18px
}

.attach-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px 10px
}

.attach-option{
border:0;
background:transparent;
color:#e9edef;
display:flex;
flex-direction:column;
align-items:center;
gap:7px;
font-size:12px;
cursor:pointer
}

.attach-circle{
width:56px;
height:56px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
background:#33434d
}

/* ================= CONTEXT MENU ================= */

.bottom-sheet-backdrop{
align-items:center;
justify-content:center;
padding:15px
}

.bottom-sheet{
border-radius:16px;
padding:12px;
max-width:380px;
animation:fadeScale .15s ease
}

@keyframes fadeScale{
from{
opacity:0;
transform:scale(.95)
}
to{
opacity:1;
transform:scale(1)
}
}

.sheet-reactions-bar{
display:flex;
justify-content:space-around;
padding:8px;
background:#111b21;
border-radius:30px;
margin-bottom:10px
}

.sheet-reaction-btn{
border:0;
background:transparent;
font-size:24px;
cursor:pointer;
padding:4px
}

.sheet-actions-list{
display:flex;
flex-direction:column
}

.sheet-action-item{
width:100%;
border:0;
background:transparent;
color:#e9edef;
padding:13px;
display:flex;
align-items:center;
gap:12px;
text-align:right;
font-size:14px;
cursor:pointer;
border-radius:8px
}

.sheet-action-item:hover{
background:#2a3942
}

.sheet-action-item.danger{
color:#ff6b6b
}

/* ================= CONTACT SHEET ================= */

.contact-sheet{
padding-bottom:35px
}

.contact-profile{
display:flex;
align-items:center;
gap:14px;
padding:10px 5px 20px
}

.contact-big-avatar{
width:72px;
height:72px;
border-radius:50%;
background:#667781;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
font-size:34px
}

.contact-big-avatar img{
width:100%;
height:100%;
object-fit:cover
}

.contact-big-name{
font-size:19px;
font-weight:bold
}

.contact-big-status{
font-size:13px;
color:#8696a0;
margin-top:5px
}

.contact-actions{
display:flex;
gap:10px
}

.contact-action{
flex:1;
border:0;
background:#111b21;
border-radius:12px;
padding:13px;
color:#00a884;
cursor:pointer;
font-size:14px
}

/* ================= EDIT MODE ================= */

.editing{
outline:2px solid #00a884
}

.hidden-file{
display:none!important
}

.hidden{
display:none!important
}

@media(max-width:450px){
.message{
max-width:88%
}

.message-image,
.message-video{
max-width:240px
}
}
</style>
</head>

<body>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b141a;color:#e9edef;font-size:16px;z-index:999999">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back" type="button" aria-label="رجوع">←</button>

<div id="contactInfo" class="contact-info">

<div class="call-buttons">
<button id="videoButton" class="header-action" type="button" aria-label="مكالمة فيديو">⌕</button>

</div>

</header>

<div id="pinnedBanner" class="pinned-banner">

</div>

</div>

<input
id="messageInput"

>

</div>

<input
id="galleryInput"

accept="image/*,video/*"
>

<input
id="cameraInput"
class="hidden-file"

accept="image/*,video/*"

>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

} from "https://esm.sh/@supabase/supabase-js@2";


/* ================= FIREBASE ================= */

const firebaseConfig = {

apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain: "mecd-tools.firebaseapp.com",

projectId: "mecd-tools",

storageBucket: "mecd-tools.firebasestorage.app",

messagingSenderId: "643005547408",

appId: "1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getFirestore(firebaseApp);


/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://aqukohedqmtjuspjbkmn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_jODiQ8WSON3ouLqvLlQcZA_2Q6GwF_l";

const supabase = createClient(

SUPABASE_PUBLISHABLE_KEY
);


/* ================= ELEMENTS ================= */

const $ = id => document.getElementById(id);

const loading = $("loading");
const app = $("app");

const messages = $("messages");

const messageInput = $("messageInput");

const sendButton = $("sendButton");
const voiceButton = $("voiceButton");

const attachButton = $("attachButton");

const galleryInput = $("galleryInput");
const cameraInput = $("cameraInput");

const friendName = $("friendName");
const friendAvatar = $("friendAvatar");
const friendStatus = $("friendStatus");

const backButton = $("backButton");

const contactInfo = $("contactInfo");

const pinnedBanner = $("pinnedBanner");
const pinnedBannerText = $("pinnedBannerText");
const pinnedBannerClick = $("pinnedBannerClick");
const pinnedBannerClose = $("pinnedBannerClose");

const replyCompose = $("replyCompose");
const replyComposeName = $("replyComposeName");
const replyComposeText = $("replyComposeText");
const replyCancel = $("replyCancel");

const callButton = $("callButton");
const videoButton = $("videoButton");
const menuButton = $("menuButton");


/* ================= VARIABLES ================= */

let currentUser = null;

let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;
let unsubscribeFriend = null;

let replyTarget = null;

let editingMessageId = null;

let mediaRecorder = null;
let audioChunks = [];

let recordingStartedAt = 0;

const messageElements = new Map();

const reactionList = [
"❤️",
"👍",
"🔥",
"😂",
"😮"
];


/* ================= HELPERS ================= */

function createChatID(a,b){

return [a,b]
.sort()
.join("_");

}


function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>'"]/g,c=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

"'":"&#39;",

'"':"&quot;"

}[c]));

}


function formatTime(timestamp){

if(!timestamp?.toDate){

return "";

}

try{

return timestamp
.toDate()
.toLocaleTimeString("ar",{

hour:"2-digit",

minute:"2-digit"

});

}catch{

return "";

}

}


function formatLastSeen(timestamp){

if(!timestamp?.toDate){

return "غير متصل";

}

try{

const date = timestamp.toDate();

const now = new Date();

const diff = now-date;

if(diff < 60000){

return "آخر ظهور الآن";

}

if(diff < 3600000){

return "آخر ظهور منذ " +
Math.floor(diff/60000) +
" دقيقة";

}

const today =
date.toDateString() ===
now.toDateString();

if(today){

return "آخر ظهور اليوم " +
date.toLocaleTimeString("ar",{
hour:"2-digit",
minute:"2-digit"
});

}

return "آخر ظهور " +
date.toLocaleDateString("ar");

}catch{

return "غير متصل";

}

}


function getMessagePreview(data){

if(data.deletedForEveryone){

return "تم حذف هذه الرسالة";

}

if(data.type === "text"){

return data.text || "رسالة";

}

if(data.type === "image"){

return "📷 صورة";

}

if(data.type === "video"){

return "🎥 فيديو";

}

if(data.type === "voice"){

return "🎤 رسالة صوتية";

}

return "رسالة";

}


function scrollToBottom(){

requestAnimationFrame(()=>{

messages.scrollTop =
messages.scrollHeight;

});

}


function isNearBottom(){

return (
messages.scrollHeight -
messages.scrollTop -
messages.clientHeight
< 150
);

}


function setUserAvatar(element,user){

element.innerHTML = "";

if(user?.photo){

const img =
document.createElement("img");

img.src = user.photo;

img.alt = "";

element.appendChild(img);

}else{

element.textContent = "👤";

}

}


/* ================= PRESENCE ================= */

async function updateMyPresence(online){

if(!currentUser){

return;

}

try{

const userRef =
doc(db,"users",currentUser.uid);

await updateDoc(userRef,{

online:online,

lastSeen:serverTimestamp()

});

}catch(e){

console.error("Presence error:",e);

}

}


function listenFriendPresence(){

if(!friendUser){

return;

}

if(unsubscribeFriend){

unsubscribeFriend();

}

unsubscribeFriend =
onSnapshot(

doc(db,"users",friendUser.uid),

snap=>{

if(!snap.exists()){

return;

}

const data = snap.data();

friendUser = {

...friendUser,

name:
data.name ||
friendUser.name,

photo:
data.photo ||
data.photoURL ||
friendUser.photo,

online:
data.online === true,

lastSeen:
data.lastSeen

};

friendName.textContent =
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);

if(data.online === true){

friendStatus.textContent =
"متصل الآن";

friendStatus.className =
"user-status online";

}else{

friendStatus.textContent =
formatLastSeen(data.lastSeen);

friendStatus.className =
"user-status";

}

}

);

}


/* ================= LOAD FRIEND ================= */

async function loadFriend(){

const friendId =
new URLSearchParams(
location.search
).get("friend");

async function toggleReaction(
messageId,
emoji
){

if(
!currentUser ||
!chatID ||
!messageId
){

return;

}


try{

const messageRef =
doc(
db,
"chats",
chatID,
"messages",
messageId
);


const snap =
await getDoc(messageRef);


if(!snap.exists()){

return;

}


const data =
snap.data();


const reactions =
Array.isArray(data.reactions)

? data.reactions

: [];


const myReaction =
reactions.find(

r=>

r?.userId ===
currentUser.uid

);


if(
myReaction &&
myReaction.emoji === emoji
){

await updateDoc(
messageRef,
{

reactions:
arrayRemove(myReaction)

}
);

}else{

if(myReaction){

await updateDoc(
messageRef,
{

reactions:
arrayRemove(myReaction)

}
);

}

await updateDoc(
messageRef,
{

reactions:
arrayUnion({

userId:
currentUser.uid,

emoji:emoji

})

}
);

}

}catch(e){

console.error(e);

}

}

/* ================= MESSAGE ACTIONS ================= */

function setupSwipeToReply(
element,
data
){

let startX = 0;

let currentX = 0;

let active = false;


element.addEventListener(

"touchstart",

e=>{

startX =
e.touches[0].clientX;

currentX =
startX;

active = true;

},

{passive:true}

);


element.addEventListener(

"touchmove",

e=>{

if(!active){

return;

}


currentX =
e.touches[0].clientX;


const diff =
currentX-startX;


const allowed =
data.senderId === currentUser.uid

? diff < 0

: diff > 0;


if(
allowed &&
Math.abs(diff) < 100
){

element.style.transform =
`translateX(${diff}px)`;

}

},

{passive:true}

);


element.addEventListener(

"touchend",

()=>{

if(!active){

return;

}


active = false;


const diff =
currentX-startX;


element.style.transform =
"translateX(0)";


if(
Math.abs(diff) > 65
){

startReply(data);

}

}

);

}


function addMessageActions(
element,
data
){

let timer = null;

let longPress = false;


element.addEventListener(
"pointerdown",
()=>{

longPress = false;


timer =
setTimeout(()=>{

longPress = true;

showBottomSheetMenu(
data
);

},550);

}
);


function clear(){

if(timer){

clearTimeout(timer);

timer = null;

}

}


element.addEventListener(
"pointerup",
clear
);

element.addEventListener(
"pointercancel",
clear
);

element.addEventListener(
"pointerleave",
clear
);


element.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

showBottomSheetMenu(
data
);

}
);


let lastClick = 0;


element.addEventListener(
"click",
e=>{

if(longPress){

return;

}


if(
e.target.closest("button") ||
e.target.closest(".message-reply")
){

return;

}


const now =
Date.now();


if(
now-lastClick < 300
){

toggleReaction(
data.id,
"❤️"
);

}


lastClick = now;

}
);


setupSwipeToReply(
element,
data
);

}

function createVoiceElement(
data
){

const container =
document.createElement("div");


container.className =
"voice-box";


const audio =
document.createElement("audio");


audio.src =
data.url;


audio.preload =
"metadata";


const play =
document.createElement("button");


play.type = "button";


play.className =
"voice-play";


play.textContent =
"▶";


const wave =
document.createElement("div");


wave.className =
"voice-wave";


const duration =
document.createElement("span");


duration.className =
"voice-duration";


duration.textContent =
"0:00";


play.onclick =
async()=>{

if(audio.paused){

try{

await audio.play();

play.textContent =
"❚❚";

}catch(e){

console.error(e);

}

}else{

audio.pause();

play.textContent =
"▶";

}

};


audio.onloadedmetadata =
()=>{

const sec =
Math.floor(
audio.duration || 0
);


duration.textContent =
Math.floor(sec/60) +
":" +
String(sec%60)
.padStart(2,"0");

};


audio.onended =
()=>{

play.textContent =
"▶";

};


container.append(
play,
wave,
duration,
audio
);


return container;

}

!chatID

const batch =
writeBatch(db);


let changed = false;


snapshot.forEach(docSnap=>{

const data =
docSnap.data();


if(

!data.deletedForEveryone
){

docSnap.ref,

delivered:true

}
);

}

});

}catch(e){

}

}

}

/* ================= UPLOAD ================= */

async function uploadFile(file){

if(
!file ||
!currentUser ||
!chatID
){

throw new Error(
"ملف غير صالح"
);

}


const safeName =
(file.name || "file")
.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);


const filePath =
`${chatID}/${currentUser.uid}/${Date.now()}_${safeName}`;


const {

error

} =
await supabase.storage

.from("mecd-media")

.upload(

filePath,

file,

{

upsert:false,

contentType:
file.type

}

);


if(error){

throw error;

}


const {

data

} =
supabase.storage

.from("mecd-media")

.getPublicUrl(
filePath
);


if(
!data?.publicUrl
){

throw new Error(
"لم يتم الحصول على رابط الملف"
);

}


return data.publicUrl;

}


async function uploadMediaAndSend(
file,
type
){

if(

){

try{

await uploadFile(file);

{

senderId:

friendUser.uid,

type:type,

read:false,

delivered:false,

deletedFor:[],

pinned:false,

reactions:[],

createdAt:
serverTimestamp()

}

);

}catch(e){

console.error(e);

alert(
"فشل رفع الملف"
);

}

}

try{

const stream =
await navigator.mediaDevices.getUserMedia({

audio:true

});


audioChunks = [];


let mimeType =
"";


const types = [

"audio/webm;codecs=opus",

"audio/webm",

"audio/mp4"

];


for(
const type of types
){

if(
window.MediaRecorder &&
MediaRecorder.isTypeSupported(type)
){

mimeType = type;

break;

}

}


mediaRecorder =
mimeType

? new MediaRecorder(
stream,
{mimeType}
)

: new MediaRecorder(
stream
);


mediaRecorder.ondataavailable =
e=>{

if(
e.data.size > 0
){

audioChunks.push(
e.data
);

}

};


mediaRecorder.onstop =
async()=>{

stream
.getTracks()
.forEach(track=>
track.stop()
);


if(!audioChunks.length){

return;

}


const type =
mediaRecorder.mimeType ||
"audio/webm";


const blob =
new Blob(
audioChunks,
{type}
);


const file =
new File(

[blob],

`voice_${Date.now()}.webm`,

{

type:type

}

);


try{

const url =
await uploadFile(file);


await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

url:url,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type:"voice",

read:false,

delivered:false,

deletedFor:[],

pinned:false,

reactions:[],

createdAt:
serverTimestamp()

}

);

}catch(e){

console.error(e);

alert(
"فشل إرسال الرسالة الصوتية"
);

}

};


recordingStartedAt =
Date.now();


mediaRecorder.start();


voiceButton.classList.add(
"recording"
);


voiceButton.textContent =
"■";


}catch(e){

console.error(e);

alert(
"يجب السماح بالوصول إلى الميكروفون"
);

}

}


function stopVoiceRecording(){

if(
!mediaRecorder ||
mediaRecorder.state !== "recording"
){

return;

}


mediaRecorder.stop();


voiceButton.classList.remove(
"recording"
);


voiceButton.textContent =
"🎤";

}


voiceButton.addEventListener(
"click",
()=>{

if(
mediaRecorder &&
mediaRecorder.state === "recording"
){

stopVoiceRecording();

}else{

startVoiceRecording();

}

}
);

/* ================= CONTACT INFO ================= */

function removeContactSheet(){

const old =
document.querySelector(
".contact-backdrop"
);

if(old){

old.remove();

}

}


function showContactSheet(){

removeContactSheet();


const backdrop =
document.createElement("div");


backdrop.className =
"contact-backdrop";


backdrop.onclick =
removeContactSheet;


const sheet =
document.createElement("div");


sheet.className =
"contact-sheet";


sheet.onclick =
e=>e.stopPropagation();


const handle =
document.createElement("div");


handle.className =
"sheet-handle";


const profile =
document.createElement("div");


profile.className =
"contact-profile";


const avatar =
document.createElement("div");


avatar.className =
"contact-big-avatar";


if(friendUser?.photo){

const img =
document.createElement("img");


img.src =
friendUser.photo;


avatar.appendChild(img);

}else{

avatar.textContent =
"👤";

}


const info =
document.createElement("div");


const name =
document.createElement("div");


name.className =
"contact-big-name";


name.textContent =
friendUser?.name ||
"مستخدم";


const status =
document.createElement("div");


status.className =
"contact-big-status";


status.textContent =
friendUser?.online

? "متصل الآن"

: formatLastSeen(
friendUser?.lastSeen
);


info.append(
name,
status
);


profile.append(
avatar,
info
);


const actions =
document.createElement("div");


actions.className =
"contact-actions";


const call =
document.createElement("button");


call.className =
"contact-action";


call.textContent =
"☎ اتصال";


call.onclick =
()=>{

alert(
"ميزة الاتصال سيتم ربطها لاحقاً"
);

};


const video =
document.createElement("button");


video.className =
"contact-action";


video.textContent =
"⌕ فيديو";


video.onclick =
()=>{

alert(
"ميزة مكالمة الفيديو سيتم ربطها لاحقاً"
);

};


actions.append(
call,
video
);


sheet.append(
handle,
profile,
actions
);


backdrop.appendChild(
sheet
);


document.body.appendChild(
backdrop
);

}


contactInfo.onclick =
showContactSheet;

/* ================= PRESENCE EVENTS ================= */

document.addEventListener(
"visibilitychange",
()=>{

if(!currentUser){

return;

}


if(
document.visibilityState === "visible"
){

updateMyPresence(true);

}else{

updateMyPresence(false);

}

}
);

"pagehide",
()=>{

updateMyPresence(false);

}
);

async user=>{

if(!user){

loading.textContent =
"يجب تسجيل الدخول أولاً";

return;

}


currentUser = user;


try{

await updateMyPresence(true);


await loadFriend();


listenMessages();


loading.style.display =
"none";


app.style.display =
"flex";


scrollToBottom();


}catch(e){

loading.textContent =
e.message ||
"حدث خطأ أثناء فتح الدردشة";

}

}

);

</script>
