<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);

overflow:hidden
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:white;
font-size:22px;
cursor:pointer
}

.avatar{
width:48px;
height:48px;
border-radius:16px;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px
}

.user-status.online{
color:#00e889
}

.call-buttons{
display:flex;
gap:8px
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:white;
font-size:18px;
cursor:pointer
}

.messages{
flex:1;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:10px
}

.empty{
margin:auto;
text-align:center;
color:#72817c
}

.message{
max-width:78%;
padding:12px 15px;
border-radius:18px;
position:relative;
word-break:break-word
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px
}

.time{
display:block;
font-size:9px;
opacity:.6;
margin-top:5px
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50
}

#messageInput{
flex:1;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:white;
outline:none
}

#voiceButton,
#sendButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px
}

#voiceButton{
background:#18231f;
color:white
}

#sendButton{
background:#00e889;
color:#00150e
}

.message-menu{
position:absolute;
left:10px;
bottom:55px;
background:#101815;
padding:8px;
border-radius:16px;
box-shadow:0 8px 25px #000;
z-index:9999;
width:150px
}

.message-menu button{
width:100%;
background:#18231f;
color:white;
border:0;
padding:12px;
border-radius:10px;
cursor:pointer
}

</style>

</head>

<body>

<div id="loading"
style="
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020504;
color:white;
font-size:18px;
z-index:9999">

جارٍ فتح الدردشة...

</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back">
→
</button>

<div id="friendAvatar" class="avatar">
👤
</div>

<div class="user-info">

<div id="friendName" class="user-name">
جار التحميل...
</div>

<div id="friendStatus" class="user-status">
● غير متصل
</div>

</div>

<div class="call-buttons">

<button id="callButton">
📞
</button>

<button id="videoButton">
📹
</button>

</div>

</header>


<div id="messages" class="messages">

<div class="empty">
💬
<br>
ابدأ المحادثة الآن
</div>

</div>


<div class="input-area">

<input id="messageInput"
placeholder="اكتب رسالة..."
maxlength="2000">

<button id="voiceButton">
🎤
</button>

<button id="sendButton">
➤
</button>

</div>

</main>
<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
deleteDoc,
updateDoc,
arrayUnion,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp=
initializeApp(firebaseConfig);


const auth=
getAuth(firebaseApp);


const db=
getFirestore(firebaseApp);


const $=
id=>document.getElementById(id);


const messages=$("messages");
const messageInput=$("messageInput");
const sendButton=$("sendButton");
const friendName=$("friendName");
const friendAvatar=$("friendAvatar");
const friendStatus=$("friendStatus");
const loading=$("loading");
const app=$("app");
const backButton=$("backButton");
const callButton=$("callButton");
const videoButton=$("videoButton");


let currentUser=null;
let friendUser=null;
let chatID=null;

let unsubscribeMessages=null;
let unsubscribeFriendStatus=null;

let presenceInterval=null;


/* إنشاء ID للمحادثة */

function createChatID(a,b){

return [
a,
b
]
.sort()
.join("_");

}


/* إظهار التطبيق */

function showApp(){

loading.style.display="none";

app.style.display="flex";

}


/* حماية النص */

function escapeHtml(value){

return String(value).replace(
/[&<>'"]/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[c])
);

}


/* حالة المستخدم */

async function updateMyPresence(
online=true
){

if(!currentUser)return;


await setDoc(

doc(
db,
"users",
currentUser.uid
),

{

online:online,

lastSeen:
serverTimestamp()

},

{
merge:true
}

);

}


/* تشغيل الحالة */

function startPresence(){

updateMyPresence(true);


presenceInterval=
setInterval(()=>{

if(
document.visibilityState==="visible"
){

updateMyPresence(true);

}

},10000);

}


/* تحميل الصديق */

async function loadFriend(){

const id=
new URLSearchParams(
location.search
)
.get("friend");


if(!id){

throw new Error(
"لا يوجد صديق"
);

}


const snap=
await getDoc(

doc(
db,
"users",
id
)

);


if(!snap.exists()){

throw new Error(
"المستخدم غير موجود"
);

}


const data=
snap.data();


friendUser={

uid:id,

name:
data.name||
"مستخدم Mecd",

photo:
data.photo||
""

};


friendName.textContent=
friendUser.name;


friendAvatar.innerHTML=

friendUser.photo

?

'<img src="'+
escapeHtml(friendUser.photo)+
'">'

:

"👤";


chatID=
createChatID(
currentUser.uid,
friendUser.uid
);


await setDoc(

doc(
db,
"chats",
chatID
),

{

members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp()

},

{
merge:true
}

);


listenFriendStatus();

}


/* مراقبة حالة الصديق */

function listenFriendStatus(){

unsubscribeFriendStatus=

onSnapshot(

doc(
db,
"users",
friendUser.uid
),

snap=>{

if(!snap.exists())return;


const data=
snap.data();


const online=
data.online===true;


friendStatus.textContent=

online
?
"● متصل"
:
"● غير متصل";


friendStatus.classList.toggle(
"online",
online
);


}

);

}


/* قراءة الرسائل */

function listenMessages(){

const ref=
collection(
db,
"chats",
chatID,
"messages"
);


const q=
query(
ref,
orderBy(
"createdAt",
"asc"
)
);


unsubscribeMessages=

onSnapshot(

q,

snap=>{


messages.innerHTML="";


snap.forEach(item=>{


const data=
item.data();


if(
data.deletedFor &&
data.deletedFor.includes(
currentUser.uid
)
){

return;

}


const box=
document.createElement("div");


box.className=

"message "+
(
data.senderId===currentUser.uid
?
"mine"
:
"other"
);


box.dataset.id=
item.id;


box.textContent=
data.text||"";


const time=
document.createElement("span");


time.className="time";


if(data.createdAt){

time.textContent=
data.createdAt
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


box.appendChild(time);


messages.appendChild(box);


addMessageActions(
box,
item.id,
data.senderId===currentUser.uid
);


});


messages.scrollTop=
messages.scrollHeight;


}

);

}
 /* إرسال رسالة */

async function sendMessage(){

const text=
messageInput.value.trim();


if(
!text ||
!currentUser ||
!friendUser ||
!chatID
){

return;

}


sendButton.disabled=true;


try{

await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

text:text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

createdAt:
serverTimestamp()

}

);


messageInput.value="";


}catch(error){

console.error(
"Send error:",
error
);


alert(
"حدث خطأ أثناء الإرسال"
);


}finally{

sendButton.disabled=false;

}

}


/* زر الإرسال */

sendButton.addEventListener(
"click",
sendMessage
);


messageInput.addEventListener(

"keydown",

e=>{

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

}

);



/* حذف الرسائل */

function addMessageActions(
element,
id,
mine
){

let timer;


element.addEventListener(

"pointerdown",

()=>{


timer=setTimeout(async()=>{


const ok=
confirm(
mine
?
"حذف الرسالة؟"
:
"حذف لدي؟"
);


if(!ok)return;



const ref=
doc(
db,
"chats",
chatID,
"messages",
id
);



if(mine){

await deleteDoc(ref);


}else{


await updateDoc(

ref,

{

deletedFor:
arrayUnion(
currentUser.uid
)

}

);


}


},600);


}

);



element.addEventListener(

"pointerup",

()=>{

clearTimeout(timer);

}

);


}



/* تشغيل التطبيق */

function init(){

onAuthStateChanged(

auth,

async user=>{


if(!user){

loading.textContent=
"يجب تسجيل الدخول أولاً";

return;

}



currentUser=user;



try{


startPresence();


await loadFriend();


listenMessages();


showApp();



}catch(error){


console.error(error);


loading.innerHTML=

"⚠️ خطأ: "+
error.message;


}



}

);


}



/* تحديث الحالة */

document.addEventListener(

"visibilitychange",

()=>{


if(!currentUser)return;


if(
document.visibilityState==="visible"
){

updateMyPresence(true);


}else{

updateMyPresence(false);

}


}

);



/* زر الرجوع */

backButton.onclick=()=>{


if(unsubscribeMessages){

unsubscribeMessages();

}


if(unsubscribeFriendStatus){

unsubscribeFriendStatus();

}


updateMyPresence(false);


history.back();


};



/* الاتصال */

callButton.onclick=()=>{

alert(
"📞 الاتصال قيد التطوير"
);

};



/* الفيديو */

videoButton.onclick=()=>{

alert(
"📹 الفيديو قيد التطوير"
);

};



window.addEventListener(

"pagehide",

()=>{

if(currentUser){

updateMyPresence(false);

}

}

);



init();


</script>


<script type="module" src="voice.js"></script>


</body>

</html>
