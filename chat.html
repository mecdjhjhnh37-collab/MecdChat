<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
overflow:hidden
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}

.avatar,
.call-avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0
}

.avatar img,
.call-avatar img,
.local-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer
}

.pinned-banner{
background:#0b1613;
border-bottom:1px solid rgba(0,232,137,.15);
padding:8px 15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
font-size:12px;
z-index:8;
display:none;
}
.pinned-banner.show{
display:flex;
}
.pinned-banner-content{
flex:1;
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
min-width:0;
}
.pinned-banner-text{
color:#00e889;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.pinned-banner-close{
background:none;
border:0;
color:#aaa;
font-size:14px;
cursor:pointer;
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:16px;
scroll-behavior: smooth;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8
}

.message{
max-width:78%;
padding:10px 13px 26px 13px;
border-radius:18px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.5;
margin-bottom: 6px;
transition: transform 0.1s ease-out, background-color 0.4s ease;
user-select: none;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px
}

.message.highlight {
background-color: #00e889 !important;
color: #000 !important;
}

.heart-pop {
position: absolute;
bottom: 8px;
right: 15px;
transform: scale(0);
font-size: 22px;
animation: popEffect 0.4s ease forwards;
pointer-events: none;
z-index: 30;
background: #0b1512;
border-radius: 50%;
padding: 2px 4px;
}

.message.mine .heart-pop {
right: auto;
left: 15px;
}

@keyframes popEffect {
0% { transform: scale(0); opacity: 0; }
50% { transform: scale(1.3); opacity: 1; }
100% { transform: scale(1); opacity: 1; }
}

.time{
display:inline-block;
font-size:9px;
opacity:.6;
margin-top:5px;
}

.message-meta{
display:inline-flex;
align-items:center;
gap:4px;
position: absolute;
bottom: 6px;
left: 12px;
}
.message.other .message-meta {
left: auto;
right: 12px;
}

.message-status{
font-size:11px;
font-weight:bold;
direction:ltr
}

.message-status.read{
color:#006dff
}

.message.image-message, .message.video-message {
padding: 8px 8px 28px 8px !important;
width: max-content !important;
max-width: 80% !important;
background: #18231f !important;
border: 1px solid rgba(255,255,255,.08);
}
.message.mine.image-message, .message.mine.video-message {
background: #00c96b !important;
}

.message-image,
.message-video{
display: block;
width: 100%;
max-width: 260px;
max-height: 280px;
border-radius: 12px;
object-fit: cover;
cursor: pointer;
}

/* لوحة الخيارات السفلية (Bottom Sheet Menu مثل الواتساب) */
.bottom-sheet-backdrop {
position: fixed;
inset: 0;
background: rgba(0, 0, 0, 0.65);
z-index: 1000;
display: flex;
align-items: flex-end;
animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}

.bottom-sheet {
width: 100%;
max-width: 650px;
margin: 0 auto;
background: #111b18;
border-top-left-radius: 24px;
border-top-right-radius: 24px;
padding: 16px 20px 30px;
box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
animation: slideUp 0.25s ease;
display: flex;
flex-direction: column;
gap: 16px;
border-top: 1px solid rgba(0,232,137,0.2);
}

@keyframes slideUp {
from { transform: translateY(100%); }
to { transform: translateY(0); }
}

.sheet-reactions-bar {
display: flex;
justify-content: space-around;
background: #182521;
padding: 10px 14px;
border-radius: 30px;
font-size: 24px;
border: 1px solid rgba(255,255,255,0.06);
}

.sheet-reaction-btn {
background: none;
border: none;
cursor: pointer;
font-size: 24px;
transition: transform 0.2s;
}
.sheet-reaction-btn:hover {
transform: scale(1.2);
}

.sheet-actions-list {
display: flex;
flex-direction: column;
gap: 6px;
}

.sheet-action-item {
width: 100%;
padding: 12px 16px;
background: #182521;
border: none;
border-radius: 12px;
color: #fff;
font-size: 14px;
font-weight: bold;
text-align: right;
display: flex;
align-items: center;
gap: 12px;
cursor: pointer;
}
.sheet-action-item:hover {
background: #20312b;
}

.message-reactions{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:3px;
position: absolute;
bottom: -11px;
right: 10px;
z-index: 5;
}
.message.mine .message-reactions {
right: auto;
left: 10px;
}

.reaction-chip{
border:1px solid rgba(255,255,255,.12);
background:#0b1613;
border-radius:12px;
padding:1px 5px;
font-size:11px;
cursor:pointer;
display:flex;
align-items:center;
gap:2px;
color:#fff;
}
.reaction-chip.mine{
border-color:rgba(0,232,137,.55);
background:rgba(0,232,137,.25)
}
.reaction-count{
font-size:9px;
opacity:.9
}

.message-reply{
display:flex;
align-items:stretch;
gap:6px;
margin-bottom:6px;
padding:5px 7px;
border-radius:8px;
background:rgba(0,0,0,.15);
border-right:3px solid #00e889;
font-size:11px;
cursor:pointer;
}
.message.other .message-reply{
background:rgba(255,255,255,.06)
}
.reply-content{
min-width:0;
overflow:hidden
}
.reply-name{
font-weight:bold;
font-size:10px;
color:#00e889;
margin-bottom:2px
}
.message.mine .reply-name{
color:#00150e
}
.reply-text{
opacity:.8;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50
}

#messageInput{
flex:1;
min-width:0;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:#fff;
outline:none;
font-size:15px
}
#messageInput:focus{
border-color:#00e889
}

#voiceButton,
#sendButton,
#attachButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
flex-shrink:0
}
#attachButton{ background:#18231f; color:#fff; font-size:26px; }
#voiceButton{ background:#18231f; color:#fff; }
#sendButton{ background:#00e889; color:#00150e; }

#attachMenu{
position:fixed;
bottom:70px;
right:10px;
width:175px;
padding:7px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:17px;
box-shadow:0 10px 35px rgba(0,0,0,.55);
display:none;
z-index:1000
}
#attachMenu.show{ display:block; }
.attach-option{
width:100%;
height:45px;
border:0;
border-radius:12px;
background:#18231f;
color:#fff;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
font-size:14px;
font-weight:bold;
cursor:pointer;
margin-bottom:5px
}

.reply-compose{
position:fixed;
bottom:70px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:7px 10px;
background:#07100d;
border-top:1px solid rgba(0,232,137,.14);
z-index:45;
display:none;
align-items:center;
gap:8px
}
.reply-compose.show{ display:flex; }
.reply-compose-content{
flex:1;
min-width:0;
padding:7px 10px;
background:#111916;
border-radius:10px;
border-right:3px solid #00e889;
overflow:hidden
}
.reply-compose-name{ font-size:10px; font-weight:bold; color:#00e889; margin-bottom:2px; }
.reply-compose-text{ font-size:11px; opacity:.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.reply-cancel{ width:32px; height:32px; border:0; border-radius:10px; background:#18231f; color:#fff; cursor:pointer; }

.hidden-file{ display:none!important; }
</style>
</head>

<body>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020504;color:white;font-size:18px;z-index:999999">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>
<button id="backButton" class="back" type="button">→</button>
<div id="friendAvatar" class="avatar">👤</div>
<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>
<div class="call-buttons">
<button id="callButton" type="button">📞</button>
<button id="videoButton" type="button">📹</button>
</div>
</header>

<div id="pinnedBanner" class="pinned-banner">
<div class="pinned-banner-content" id="pinnedBannerClick">
<span>📌</span>
<span id="pinnedBannerText" class="pinned-banner-text">رسالة مثبتة</span>
</div>
<button id="pinnedBannerClose" class="pinned-banner-close" type="button">✕</button>
</div>

<div id="messages" class="messages">
<div class="empty">💬<br>ابدأ المحادثة الآن</div>
</div>

<div id="attachMenu">
<button id="galleryButton" class="attach-option" type="button"><span>🖼️</span>صورة أو فيديو</button>
<button id="cameraButton" class="attach-option" type="button"><span>📷</span>كاميرا</button>
</div>

<input id="galleryInput" class="hidden-file" type="file" accept="image/*,video/*">
<input id="cameraInput" class="hidden-file" type="file" accept="image/*,video/*" capture="environment">

<div id="replyCompose" class="reply-compose">
<div class="reply-compose-content">
<div id="replyComposeName" class="reply-compose-name">رد على الرسالة</div>
<div id="replyComposeText" class="reply-compose-text"></div>
</div>
<button id="replyCancel" class="reply-cancel" type="button">✕</button>
</div>

<div class="input-area">
<button id="attachButton" type="button">＋</button>
<input id="messageInput" type="text" placeholder="اكتب رسالة..." autocomplete="off" maxlength="2000">
<button id="voiceButton" type="button">🎤</button>
<button id="sendButton" type="button">➤</button>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query, orderBy, onSnapshot, deleteDoc, serverTimestamp, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const firebaseConfig = {
apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",
authDomain: "mecd-tools.firebaseapp.com",
projectId: "mecd-tools",
storageBucket: "mecd-tools.firebasestorage.app",
messagingSenderId: "643005547408",
appId: "1:643005547408:web:b1719060ec340dd0e0a915"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const SUPABASE_URL = "https://aqukohedqmtjuspjbkmn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jODiQ8WSON3ouLqvLlQcZA_2Q6GwF_l";
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = id => document.getElementById(id);

const loading = $("loading");
const app = $("app");
const messages = $("messages");
const messageInput = $("messageInput");
const sendButton = $("sendButton");
const attachButton = $("attachButton");
const attachMenu = $("attachMenu");
const galleryButton = $("galleryButton");
const cameraButton = $("cameraButton");
const galleryInput = $("galleryInput");
const cameraInput = $("cameraInput");
const friendName = $("friendName");
const friendAvatar = $("friendAvatar");
const friendStatus = $("friendStatus");
const backButton = $("backButton");

const pinnedBanner = $("pinnedBanner");
const pinnedBannerText = $("pinnedBannerText");
const pinnedBannerClick = $("pinnedBannerClick");
const pinnedBannerClose = $("pinnedBannerClose");

const replyCompose = $("replyCompose");
const replyComposeName = $("replyComposeName");
const replyComposeText = $("replyComposeText");
const replyCancel = $("replyCancel");

let currentUser = null;
let friendUser = null;
let chatID = null;
let unsubscribeMessages = null;
let replyTarget = null;
let editingMessageId = null;
const messageElements = new Map();

function getMessagePreview(data){
if(data.type === "text") return data.text || "رسالة";
if(data.type === "image") return "📷 صورة";
if(data.type === "video") return "🎥 فيديو";
if(data.type === "voice") return "🎤 رسالة صوتية";
return "رسالة";
}

function startReply(data){
editingMessageId = null;
sendButton.textContent = "➤";
replyTarget = {
id: data.id,
senderId: data.senderId,
senderName: data.senderId === currentUser.uid ? "أنت" : friendUser?.name || "المستخدم",
text: getMessagePreview(data)
};
replyComposeName.textContent = "الرد على " + replyTarget.senderName;
replyComposeText.textContent = replyTarget.text;
replyCompose.classList.add("show");
messageInput.focus();
}

function cancelReply(){
replyTarget = null;
replyCompose.classList.remove("show");
}

replyCancel.onclick = e => { e.stopPropagation(); cancelReply(); };

const reactionList = ["❤️", "👍", "🔥", "😂", "😮"];

async function toggleReaction(messageId, emoji){
if(!currentUser || !chatID || !messageId || !emoji) return;
try{
const messageRef = doc(db, "chats", chatID, "messages", messageId);
const snap = await getDoc(messageRef);
if(!snap.exists()) return;
const data = snap.data();
const reactions = Array.isArray(data.reactions) ? data.reactions : [];
const mine = reactions.some(r => r && r.userId === currentUser.uid && r.emoji === emoji);

if(mine){
await updateDoc(messageRef, { reactions: arrayRemove({ userId: currentUser.uid, emoji }) });
}else{
const oldMine = reactions.find(r => r && r.userId === currentUser.uid);
if(oldMine){ await updateDoc(messageRef, { reactions: arrayRemove(oldMine) }); }
await updateDoc(messageRef, { reactions: arrayUnion({ userId: currentUser.uid, emoji }) });
}
}catch(e){}
}

function renderReactions(box, data){
if(!Array.isArray(data.reactions) || !data.reactions.length) return;
const wrapper = document.createElement("div");
wrapper.className = "message-reactions";
const counts = {};

data.reactions.forEach(reaction => {
if(!reaction || !reaction.emoji) return;
if(!counts[reaction.emoji]){ counts[reaction.emoji] = { count: 0, mine: false }; }
counts[reaction.emoji].count++;
if(reaction.userId === currentUser.uid){ counts[reaction.emoji].mine = true; }
});

reactionList.forEach(emoji => {
const info = counts[emoji];
if(!info) return;
const chip = document.createElement("button");
chip.type = "button";
chip.className = "reaction-chip" + (info.mine ? " mine" : "");
chip.innerHTML = escapeHtml(emoji) + (info.count > 1 ? ` <span class="reaction-count">${info.count}</span>` : "");
chip.onclick = e => { e.stopPropagation(); toggleReaction(data.id, emoji); };
wrapper.appendChild(chip);
});

if(wrapper.children.length) box.appendChild(wrapper);
}

function createChatID(a, b){ return [a, b].sort().join("_"); }
function escapeHtml(value){ return String(value ?? "").replace(/[&<>'"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" }[c])); }
function formatTime(timestamp){
if(!timestamp?.toDate) return "";
try{ return timestamp.toDate().toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" }); }catch{ return ""; }
}

function setUserAvatar(element, user){
if(user?.photo){ element.innerHTML = `<img src="${escapeHtml(user.photo)}" alt="">`; }
else{ element.innerHTML = "👤"; }
}

async function loadFriend(){
const friendId = new URLSearchParams(location.search).get("friend");
if(!friendId) throw new Error("لا يوجد صديق في الرابط");
const snap = await getDoc(doc(db, "users", friendId));
if(!snap.exists()) throw new Error("المستخدم غير موجود");
const data = snap.data();
friendUser = { uid: friendId, name: data.name || "مستخدم", photo: data.photo || data.photoURL || "" };
friendName.textContent = friendUser.name;
setUserAvatar(friendAvatar, friendUser);
chatID = createChatID(currentUser.uid, friendUser.uid);
}

attachButton.onclick = e => { e.stopPropagation(); attachMenu.classList.toggle("show"); };
document.addEventListener("pointerdown", e => {
if(!e.target.closest("#attachMenu") && !e.target.closest("#attachButton")) attachMenu.classList.remove("show");
});

galleryButton.onclick = () => { attachMenu.classList.remove("show"); galleryInput.click(); };
cameraButton.onclick = () => { attachMenu.classList.remove("show"); cameraInput.click(); };

function removeBottomSheet(){
const existing = document.querySelector(".bottom-sheet-backdrop");
if(existing) existing.remove();
}

function showBottomSheetMenu(data){
removeBottomSheet();
const mine = data.senderId === currentUser.uid;

const backdrop = document.createElement("div");
backdrop.className = "bottom-sheet-backdrop";
backdrop.onclick = () => removeBottomSheet();

const sheet = document.createElement("div");
sheet.className = "bottom-sheet";
sheet.onclick = e => e.stopPropagation();

const reactionsBar = document.createElement("div");
reactionsBar.className = "sheet-reactions-bar";
reactionList.forEach(emoji => {
const btn = document.createElement("button");
btn.type = "button";
btn.className = "sheet-reaction-btn";
btn.textContent = emoji;
btn.onclick = () => {
toggleReaction(data.id, emoji);
removeBottomSheet();
};
reactionsBar.appendChild(btn);
});
sheet.appendChild(reactionsBar);

const actionsList = document.createElement("div");
actionsList.className = "sheet-actions-list";

const replyBtn = document.createElement("button");
replyBtn.type = "button";
replyBtn.className = "sheet-action-item";
replyBtn.innerHTML = "<span>↩️</span> رد";
replyBtn.onclick = () => {
removeBottomSheet();
startReply(data);
};
actionsList.appendChild(replyBtn);

const pinBtn = document.createElement("button");
pinBtn.type = "button";
pinBtn.className = "sheet-action-item";
pinBtn.innerHTML = data.pinned ? "<span>📌</span> إلغاء التثبيت" : "<span>📌</span> تثبيت الرسالة";
pinBtn.onclick = async () => {
await updateDoc(doc(db, "chats", chatID, "messages", data.id), { pinned: !data.pinned });
removeBottomSheet();
};
actionsList.appendChild(pinBtn);

if(mine && data.type === "text"){
const editBtn = document.createElement("button");
editBtn.type = "button";
editBtn.className = "sheet-action-item";
editBtn.innerHTML = "<span>✏️</span> تعديل";
editBtn.onclick = () => {
removeBottomSheet();
editingMessageId = data.id;
messageInput.value = data.text || "";
sendButton.textContent = "✓";
cancelReply();
messageInput.focus();
};
actionsList.appendChild(editBtn);
}

const delBtn = document.createElement("button");
delBtn.type = "button";
delBtn.className = "sheet-action-item";
delBtn.innerHTML = "<span>🗑️</span> " + (mine ? "إلغاء الإرسال" : "حذف لدي");
delBtn.onclick = async () => {
if(mine) await deleteDoc(doc(db, "chats", chatID, "messages", data.id));
else await updateDoc(doc(db, "chats", chatID, "messages", data.id), { deletedFor: arrayUnion(currentUser.uid) });
removeBottomSheet();
};
actionsList.appendChild(delBtn);

sheet.appendChild(actionsList);
backdrop.appendChild(sheet);
document.body.appendChild(backdrop);
}

function setupSwipeToReply(element, data){
let startX = 0;
let currentX = 0;
let isSwiping = false;

element.addEventListener("touchstart", e => {
startX = e.touches[0].clientX;
isSwiping = true;
});

element.addEventListener("touchmove", e => {
if(!isSwiping) return;
currentX = e.touches[0].clientX;
let diffX = currentX - startX;
if(data.senderId !== currentUser.uid && diffX > 0 && diffX < 130){
element.style.transform = `translateX(${diffX}px)`;
}else if(data.senderId === currentUser.uid && diffX < 0 && diffX > -130){
element.style.transform = `translateX(${diffX}px)`;
}
});

element.addEventListener("touchend", () => {
if(!isSwiping) return;
isSwiping = false;
let diffX = currentX - startX;
if(Math.abs(diffX) > 85){
startReply(data);
}
element.style.transform = "translateX(0px)";
});
}

function addMessageActions(element, data){
let timer = null;
let isLongPress = false;

// الضغط المطول لإظهار القائمة السفلية
element.addEventListener("pointerdown", () => {
isLongPress = false;
timer = setTimeout(() => {
isLongPress = true;
showBottomSheetMenu(data);
}, 500);
});

element.addEventListener("pointerup", () => clearTimeout(timer));
element.addEventListener("pointercancel", () => clearTimeout(timer));
element.addEventListener("contextmenu", e => { e.preventDefault(); showBottomSheetMenu(data); });

let lastClickTime = 0;
// النقر المفرد لا يفعل شيئاً أبداً، بينما النقر المزدوج (Double Click) يضع تفاعل قلب ❤️
element.addEventListener("click", e => {
if(isLongPress) return;
if(e.target.closest("button") || e.target.closest(".message-reply")) return;
const currentTime = new Date().getTime();
if(currentTime - lastClickTime < 300 && currentTime - lastClickTime > 0){
triggerHeartReaction(element, data.id);
e.preventDefault();
}
lastClickTime = currentTime;
});

setupSwipeToReply(element, data);
}

function triggerHeartReaction(element, messageId){
if(element.querySelector('.heart-pop')) return;
const heart = document.createElement('div');
heart.className = 'heart-pop';
heart.innerHTML = '❤️';
element.appendChild(heart);
toggleReaction(messageId, '❤️');
setTimeout(() => heart.remove(), 900);
}

function renderMessages(snapshot){
const nearBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 120;

snapshot.docChanges().forEach(change => {
const id = change.doc.id;
const data = { ...change.doc.data(), id };

if(change.type === "removed"){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)){
const old = messageElements.get(id);
if(old) old.remove();
messageElements.delete(id);
return;
}

if(data.pinned === true){
pinnedBannerText.textContent = (data.senderId === currentUser.uid ? "أنت: " : "") + getMessagePreview(data);
pinnedBanner.classList.add("show");
}

const box = document.createElement("div");
let boxClass = "message " + (data.senderId === currentUser.uid ? "mine" : "other");

if(data.type === "image") boxClass += " image-message";
if(data.type === "video") boxClass += " video-message";
box.className = boxClass;

if(data.replyTo){
const replyBox = document.createElement("div");
replyBox.className = "message-reply";
replyBox.onclick = e => {
e.stopPropagation();
const targetEl = messageElements.get(data.replyTo.messageId);
if(targetEl){
targetEl.scrollIntoView({ behavior: "smooth", block: "center" });
targetEl.classList.add("highlight");
setTimeout(() => targetEl.classList.remove("highlight"), 1500);
}
};
const replyContent = document.createElement("div");
replyContent.className = "reply-content";
const replyName = document.createElement("div");
replyName.className = "reply-name";
replyName.textContent = data.replyTo.senderId === currentUser.uid ? "أنت" : (data.replyTo.senderName || "المستخدم");
const replyText = document.createElement("div");
replyText.className = "reply-text";
replyText.textContent = data.replyTo.text || "رسالة";
replyContent.append(replyName, replyText);
replyBox.appendChild(replyContent);
box.appendChild(replyBox);
}

if(data.type === "text"){
box.appendChild(document.createTextNode(data.text || ""));
if(data.isEdited){
const edited = document.createElement("span");
edited.style.fontSize = "9px";
edited.style.opacity = "0.6";
edited.textContent = " (معدلة)";
box.appendChild(edited);
}
}else if(data.type === "image" && data.url){
const img = document.createElement("img");
img.className = "message-image";
img.src = data.url;
box.appendChild(img);
}else if(data.type === "video" && data.url){
const vid = document.createElement("video");
vid.className = "message-video";
vid.src = data.url;
vid.controls = true;
box.appendChild(vid);
}

const meta = document.createElement("div");
meta.className = "message-meta";
const time = document.createElement("span");
time.className = "time";
time.textContent = formatTime(data.createdAt);
meta.appendChild(time);

if(data.senderId === currentUser.uid){
const status = document.createElement("span");
status.className = "message-status " + (data.read === true ? "read" : "");
status.textContent = data.read === true ? "✓✓" : "✓";
meta.appendChild(status);
}
box.appendChild(meta);

renderReactions(box, data);
addMessageActions(box, data);

const old = messageElements.get(id);
if(old) old.replaceWith(box);
else messages.appendChild(box);
messageElements.set(id, box);
});

if(nearBottom){
requestAnimationFrame(() => messages.scrollTop = messages.scrollHeight);
}
}

function listenMessages(){
if(!chatID) return;
const q = query(collection(db, "chats", chatID, "messages"), orderBy("createdAt", "asc"));
if(unsubscribeMessages) unsubscribeMessages();
unsubscribeMessages = onSnapshot(q, renderMessages);
}

async function handleSendMessage(){
const text = messageInput.value.trim();
if(!text || !currentUser || !friendUser || !chatID) return;
sendButton.disabled = true;

try{
if(editingMessageId){
await updateDoc(doc(db, "chats", chatID, "messages", editingMessageId), { text: text, isEdited: true });
editingMessageId = null;
sendButton.textContent = "➤";
}else{
const messageData = {
text,
senderId: currentUser.uid,
receiverId: friendUser.uid,
type: "text",
read: false,
deletedFor: [],
createdAt: serverTimestamp()
};

if(replyTarget){
messageData.replyTo = {
messageId: replyTarget.id,
senderId: replyTarget.senderId,
senderName: replyTarget.senderName,
text: replyTarget.text
};
}

await addDoc(collection(db, "chats", chatID, "messages"), messageData);
}

messageInput.value = "";
cancelReply();
}catch(e){
}finally{
sendButton.disabled = false;
messageInput.focus();
}
}

sendButton.onclick = handleSendMessage;
messageInput.addEventListener("keydown", e => {
if(e.key === "Enter"){ e.preventDefault(); handleSendMessage(); }
});

backButton.onclick = async () => {
if(unsubscribeMessages) unsubscribeMessages();
history.back();
};

async function uploadMediaAndSend(file, type){
if(!currentUser || !friendUser || !chatID) return;
try{
const fileName = `${Date.now()}_${file.name}`;
const { data, error } = await supabase.storage.from("mecd-media").upload(fileName, file);
if(error) throw error;
const { data: publicURLData } = supabase.storage.from("mecd-media").getPublicUrl(fileName);
const mediaUrl = publicURLData.publicUrl;

await addDoc(collection(db, "chats", chatID, "messages"), {
url: mediaUrl,
senderId: currentUser.uid,
receiverId: friendUser.uid,
type: type,
read: false,
deletedFor: [],
createdAt: serverTimestamp()
});
}catch(e){
alert("فشل رفع الملف");
}
}

galleryInput.onchange = e => {
const file = e.target.files[0];
if(!file) return;
const type = file.type.startsWith("video") ? "video" : "image";
uploadMediaAndSend(file, type);
galleryInput.value = "";
};

cameraInput.onchange = e => {
const file = e.target.files[0];
if(!file) return;
const type = file.type.startsWith("video") ? "video" : "image";
uploadMediaAndSend(file, type);
cameraInput.value = "";
};

onAuthStateChanged(auth, async user => {
if(!user) return;
currentUser = user;
try{
await loadFriend();
listenMessages();
loading.style.display = "none";
app.style.display = "flex";
}catch(e){
loading.textContent = e.message;
}
});
</script>
