<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    overflow:hidden;
}


/* =========================================================
   APP
========================================================= */

.app{

    height:100vh;

    max-width:650px;

    margin:auto;

    display:flex;

    flex-direction:column;

    position:relative;

}


/* =========================================================
   HEADER
========================================================= */

header{

    height:75px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px 15px;

    background:#050807;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    flex-shrink:0;

    z-index:10;

}

.back{

    width:45px;
    height:45px;

    border:0;

    border-radius:15px;

    background:#18231f;

    color:white;

    font-size:22px;

    cursor:pointer;

}

.avatar{

    width:48px;
    height:48px;

    border-radius:16px;

    background:#12352c;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    font-size:24px;

    flex-shrink:0;

}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.user-info{

    flex:1;

    min-width:0;

}

.user-name{

    font-size:17px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.user-status{

    font-size:12px;

    color:#777;

    margin-top:5px;

    transition:.2s;

}

.user-status.online{

    color:#00e889;

}

.user-status.typing{

    color:#00e889;

    font-weight:bold;

}

.call-buttons{

    display:flex;

    gap:8px;

    flex-shrink:0;

}

.call-buttons button{

    width:42px;
    height:42px;

    border:0;

    border-radius:14px;

    background:#18231f;

    color:white;

    font-size:18px;

    cursor:pointer;

}

.call-buttons button:active{

    transform:scale(.94);

}


/* =========================================================
   MESSAGES
========================================================= */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        20px
        15px
        150px;

    display:flex;

    flex-direction:column;

    gap:10px;

}

.empty{

    margin:auto;

    text-align:center;

    color:#72817c;

}

.message{

    max-width:78%;

    padding:12px 15px;

    border-radius:18px;

    position:relative;

    word-break:break-word;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

}

.message.mine{

    align-self:flex-start;

    background:#00c96b;

    color:#00150e;

    border-bottom-left-radius:5px;

}

.message.other{

    align-self:flex-end;

    background:#18231f;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-right-radius:5px;

}

.time{

    display:inline-block;

    font-size:9px;

    opacity:.6;

    margin-top:5px;

}

.message-meta{

    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:5px;

    margin-top:5px;

}

.message-status{

    font-size:12px;

    line-height:1;

    font-weight:bold;

    letter-spacing:-3px;

    direction:ltr;

    display:inline-block;

    min-width:16px;

}

.message-status.sent{

    opacity:.65;

}

.message-status.read{

    color:#006dff;

    opacity:1;

}


/* =========================================================
   INPUT
========================================================= */

.input-area{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:650px;

    padding:10px;

    display:flex;

    gap:8px;

    background:#050807;

    z-index:50;

}

#messageInput{

    flex:1;

    min-width:0;

    padding:14px;

    border-radius:17px;

    border:
        1px solid
        #27332f;

    background:#111916;

    color:white;

    outline:none;

    font-size:15px;

}

#messageInput:focus{

    border-color:#00e889;

}

#voiceButton,
#sendButton{

    width:50px;
    height:50px;

    border:0;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;

    flex-shrink:0;

}

#voiceButton{

    background:#18231f;

    color:white;

}

#voiceButton.recording{

    background:#d83b3b;

}

#sendButton{

    background:#00e889;

    color:#00150e;

}

#sendButton:disabled{

    opacity:.6;

}


/* =========================================================
   MESSAGE MENU
========================================================= */

.message-menu{

    position:absolute;

    left:50%;

    bottom:
        calc(100% + 8px);

    transform:translateX(-50%);

    min-width:150px;

    padding:5px;

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    border-radius:15px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.55);

    z-index:99999;

}

.message-menu button{

    width:100%;

    padding:10px 14px;

    border:0;

    border-radius:11px;

    background:#18231f;

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

}


/* =========================================================
   VOICE
========================================================= */

audio{

    max-width:100%;

}


/* =========================================================
   CALL MESSAGE
========================================================= */

.call-message{

    min-width:245px;

    max-width:310px;

    padding:10px 12px !important;

}

.call-box{

    display:flex;

    align-items:center;

    gap:11px;

}

.call-icon{

    width:46px;
    height:46px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,232,137,.14);

    color:#00e889;

    font-size:22px;

    flex-shrink:0;

}

.call-info{

    min-width:0;

    flex:1;

}

.call-title{

    font-size:14px;

    font-weight:bold;

}

.call-subtitle{

    font-size:11px;

    opacity:.65;

    margin-top:4px;

}

.call-duration{

    font-size:11px;

    margin-top:4px;

    opacity:.75;

}


/* =========================================================
   CALL OVERLAY
========================================================= */

#callOverlay{

    position:fixed;

    inset:0;

    background:#020504;

    z-index:100000;

    display:none;

    flex-direction:column;

    overflow:hidden;

}


/* =========================================================
   CALL TOP
========================================================= */

.call-top{

    position:absolute;

    top:0;

    left:0;

    right:0;

    height:95px;

    padding:
        22px
        18px;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:20;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.7),
            transparent
        );

}

.call-top-info{

    text-align:center;

}

#callName{

    font-size:20px;

    font-weight:bold;

    text-shadow:
        0 2px 10px
        rgba(0,0,0,.8);

}

#callState{

    color:#00e889;

    font-size:13px;

    margin-top:6px;

}


/* =========================================================
   AUDIO CALL
========================================================= */

#audioCallView{

    flex:1;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:15px;

}

#audioCallAvatar{

    width:120px;
    height:120px;

    border-radius:35px;

    background:#12352c;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    font-size:50px;

    box-shadow:
        0 10px 50px
        rgba(0,0,0,.5);

}

#audioCallAvatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}


/* =========================================================
   VIDEO
========================================================= */

#videoArea{

    position:absolute;

    inset:0;

    display:none;

    background:#000;

    overflow:hidden;

}


/* الطرف الآخر - الشاشة الكبيرة */

#remoteVideo{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    background:#000;

    z-index:3;

    transition:
        all .3s ease;

}


/* صور الطرف الآخر عند عدم وجود فيديو */

#remoteAvatar{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#07110f;

    z-index:2;

}

#remoteAvatar img{

    width:150px;
    height:150px;

    border-radius:40px;

    object-fit:cover;

}

#remoteAvatarEmoji{

    font-size:70px;

}


/* فيديو المستخدم - صغير */

#localVideo{

    position:absolute;

    width:115px;

    height:160px;

    left:16px;

    top:105px;

    object-fit:cover;

    border-radius:18px;

    border:
        2px solid
        rgba(255,255,255,.7);

    background:#111;

    z-index:7;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.6);

    transition:
        all .3s ease;

    cursor:pointer;

}


/* =========================================================
   SWAP VIDEO
========================================================= */

/*
   الوضع الطبيعي:
   الآخر كبير
   أنا صغير
*/

#videoArea.swapped #remoteVideo{

    position:absolute;

    width:115px;

    height:160px;

    left:16px;

    top:105px;

    right:auto;

    bottom:auto;

    border-radius:18px;

    z-index:7;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.6);

}


/*
   أنا كبير
   الطرف الآخر صغير
*/

#videoArea.swapped #localVideo{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    left:0;

    top:0;

    border:0;

    border-radius:0;

    z-index:3;

    box-shadow:none;

}


/* =========================================================
   LOCAL AVATAR
========================================================= */

#localAvatar{

    position:absolute;

    left:16px;

    top:105px;

    width:115px;

    height:160px;

    border-radius:18px;

    background:#12352c;

    z-index:6;

    display:none;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    font-size:40px;

    cursor:pointer;

    transition:.3s;

}

#localAvatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}


/*
   عند التبديل صورة المستخدم تصبح كبيرة
*/

#videoArea.swapped #localAvatar{

    inset:0;

    width:100%;

    height:100%;

    left:0;

    top:0;

    border-radius:0;

    z-index:3;

}


/* =========================================================
   CALL CONTROLS
========================================================= */

.call-controls{

    position:absolute;

    left:0;

    right:0;

    bottom:0;

    min-height:115px;

    padding:
        15px
        15px
        calc(15px + env(safe-area-inset-bottom));

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    z-index:30;

    background:
        linear-gradient(
            0deg,
            rgba(0,0,0,.85),
            transparent
        );

}

.call-control{

    width:58px;
    height:58px;

    border:0;

    border-radius:50%;

    background:
        rgba(35,45,42,.95);

    color:white;

    font-size:23px;

    cursor:pointer;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.35);

}

.call-control:active{

    transform:scale(.92);

}

.call-control.accept{

    background:#00e889;

    color:#00150e;

}

.call-control.reject,
.call-control.end{

    background:#d83b3b;

    color:white;

}

.call-control.active{

    background:#00e889;

    color:#00150e;

}


/* =========================================================
   INCOMING
========================================================= */

#incomingInfo{

    position:absolute;

    top:50%;

    left:50%;

    transform:
        translate(-50%,-50%);

    display:none;

    flex-direction:column;

    align-items:center;

    text-align:center;

    z-index:15;

}

#incomingAvatar{

    width:110px;

    height:110px;

    border-radius:32px;

    background:#12352c;

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    font-size:45px;

    margin-bottom:18px;

}

#incomingAvatar img{

    width:100%;

    height:100%;

    object-fit:cover;

}

#incomingText{

    font-size:15px;

    color:#ddd;

}


/* =========================================================
   DARK
========================================================= */

.call-dark{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.2),
            transparent 30%,
            transparent 65%,
            rgba(0,0,0,.4)
        );

    z-index:10;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .message{

        max-width:84%;

    }

    header{

        padding:12px;

    }

    .call-buttons button{

        width:40px;
        height:40px;

    }

    .call-message{

        min-width:225px;

        max-width:85%;

    }

    #localVideo,
    #localAvatar{

        width:100px;

        height:140px;

        left:12px;

        top:90px;

    }

    #videoArea.swapped #remoteVideo{

        width:100px;

        height:140px;

        left:12px;

        top:90px;

    }

}


/* =========================================================
   HIDDEN
========================================================= */

.hidden{

    display:none !important;

}

</style>

</head>

/* ============================================================

function createChatID(
    a,
    b
){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


function escapeHtml(
    value
){

    return String(value)
        .replace(
            /[&<>'"]/g,
            c => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

            }[c])
        );

}

function formatTime(
    timestamp
){

    if(
        !timestamp?.toDate
    ){

        return "";

    }

    return timestamp
        .toDate()
        .toLocaleTimeString(
            "ar",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function formatDuration(
    seconds
){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(
                    seconds || 0
                )
            )
        );

    const m =
        Math.floor(
            seconds / 60
        );

    const s =
        seconds % 60;

    return (

        String(m)
            .padStart(2,"0")

        +

        ":"

        +

        String(s)
            .padStart(2,"0")

    );

}

============================================================ */

function listenFriendStatus(){

    if(
        !friendUser
    )
        return;


    if(
        unsubscribeFriendStatus
    ){

        unsubscribeFriendStatus();

    }


    unsubscribeFriendStatus =
        onSnapshot(

            doc(
                db,
                "users",
                friendUser.uid
            ),

            snap => {

                if(
                    !snap.exists()
                ){

                    friendStatus.textContent =
                        "● غير متصل";

                    return;

                }


                const data =
                    snap.data();


                const last =
                    data.lastSeen
                    ?.toMillis?.() ||
                    0;


                const online =
                    data.online === true &&
                    last > 0 &&
                    Date.now() -
                    last <
                    30000;


                if(
                    !friendStatus.classList
                        .contains("typing")
                ){

                    friendStatus.textContent =
                        online
                        ? "● متصل"
                        : "● غير متصل";

                }


                friendStatus.classList.toggle(
                    "online",
                    online
                );

            }

        );

}


/* ============================================================
   FRIEND ACTIVITY
============================================================ */

function listenFriendActivity(){

    if(
        !friendUser ||
        !chatID
    )
        return;


    if(
        unsubscribeFriendActivity
    ){

        unsubscribeFriendActivity();

    }


    unsubscribeFriendActivity =
        onSnapshot(

            doc(
                db,
                "chats",
                chatID,
                "typing",
                friendUser.uid
            ),

            snap => {

                if(
                    !snap.exists()
                ){

                    return;

                }


                const data =
                    snap.data();


                const time =
                    data.updatedAt
                    ?.toMillis?.() ||
                    0;


                const fresh =
                    !time ||
                    Date.now() -
                    time < 6000;


                if(
                    !fresh
                ){

                    return;

                }


                if(
                    data.recording === true
                ){

                    setFriendActivity(
                        "recording"
                    );

                }

                else if(
                    data.typing === true
                ){

                    setFriendActivity(
                        "typing"
                    );

                }

            }

        );

}

function addMessageActions(

    id,
    mine
){

        null;


    const cancel =
        () => {

            clearTimeout(
                timer
            );

            timer =
                null;

        };


    element.addEventListener(
        "pointerdown",
        e => {

            if(
                e.target.closest(
                    ".message-menu"
                )
            )
                return;


            cancel();


            timer =
                setTimeout(
                    showMenu,
                    500
                );

        }
    );


    element.addEventListener(
        "pointerup",
        cancel
    );


    element.addEventListener(
        "pointercancel",
        cancel
    );


    element.addEventListener(
        "pointerleave",
        cancel
    );


    element.addEventListener(
        "contextmenu",
        e => {

            e.preventDefault();

            showMenu();

        }
    );


    function showMenu(){

        removeMenus();


        const menu =
            document.createElement(
                "div"
            );

            };


        menu.appendChild(

        );

        element.appendChild(

        );

    }

}


/* ============================================================
   RENDER MESSAGES
============================================================ */

function renderMessages(
    snap
){

    if(
        !renderMessages.elements
    ){

        renderMessages.elements =
            new Map();

    }


    const elements =
        renderMessages.elements;


    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight
        <
        120;


    snap.docChanges()
        .forEach(
            change => {

                const id =
                    change.doc.id;

                const data =
                    change.doc.data();


                if(
                    change.type ===
                    "added" ||
                    change.type ===
                    "modified"
                ){

                    if(
                        data.senderId !==
                        currentUser.uid
                    ){

                        markRead(
                            id,
                            data
                        );

                    }

                }


                if(
                    change.type ===
                    "removed"
                ){

                    const old =
                        elements.get(id);


                    if(old){

                        old.remove();

                        elements.delete(id);

                    }

                    return;

                }


                if(
                    Array.isArray(
                        data.deletedFor
                    ) &&
                    data.deletedFor.includes(
                        currentUser.uid
                    )
                ){

                    const old =
                        elements.get(id);


                    if(old){

                        old.remove();

                        elements.delete(id);

                    }

                    return;

                }


                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "message " +
                    (
                        data.senderId ===
                        currentUser.uid
                        ? "mine"
                        : "other"
                    );


                if(
                    data.type ===
                    "call"
                ){

                    createCallMessage(
                        box,
                        data
                    );

                }

                else if(
                    data.type ===
                    "voice"
                ){

                    const audio =
                        document.createElement(
                            "audio"
                        );


                    audio.controls =
                        true;


                    audio.preload =
                        "metadata";


                    audio.src =
                        data.audio ||
                        "";


                    box.appendChild(
                        audio
                    );

                }

                else{

                    box.appendChild(

                        document.createTextNode(
                            data.text ||
                            ""
                        )

                    );

                }


                const meta =
                    document.createElement(
                        "span"
                    );


                meta.className =
                    "message-meta";


                const time =
                    document.createElement(
                        "span"
                    );


                time.className =
                    "time";


                time.textContent =
                    formatTime(
                        data.createdAt
                    );


                meta.appendChild(time);


                const status =
                    createStatus(
                        data
                    );


                if(status){

                    meta.appendChild(
                        status
                    );

                }


                box.appendChild(
                    meta
                );


                if(
                    data.type !==
                    "call"
                ){

                    addMessageActions(
                        box,
                        id,
                        data.senderId ===
                        currentUser.uid
                    );

                }


                const old =
                    elements.get(id);


                if(old){

                    old.replaceWith(
                        box
                    );

                }


                elements.set(
                    id,
                    box
                );


                if(!old){

                    messages.appendChild(
                        box
                    );

                }

            }
        );


    const all =
        messages.querySelectorAll(
            ".message"
        );


    let empty =
        messages.querySelector(
            ".empty"
        );


    if(
        all.length === 0
    ){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.innerHTML =
                "💬<br>ابدأ المحادثة الآن";

            messages.appendChild(
                empty
            );

        }

    }else{

        empty?.remove();

    }


    if(nearBottom){

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }

}

/* ============================================================
   CREATE PEER
============================================================ */

function createPeer(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onicecandidate =
        async event => {

            if(
                !event.candidate ||
                !activeCallId ||
                !currentUser
            )
                return;


            try{

                await addDoc(

                    collection(
                        db,
                        "calls",
                        activeCallId,
                        "candidates"
                    ),

                    {

                        senderId:
                            currentUser.uid,

                        candidate:
                            event.candidate
                                .toJSON()

                    }

                );

            }catch(error){

                console.error(
                    "ICE:",
                    error
                );

            }

        };


    pc.ontrack =
        event => {

            if(
                event.streams &&
                event.streams[0]
            ){

                remoteVideo.srcObject =
                    event.streams[0];


                remoteVideo.style.display =
                    "block";


                remoteAvatar.style.display =
                    "none";


                remoteVideo.play()
                    .catch(
                        () => {}
                    );

            }

        };


    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            console.log(
                "RTC:",
                state
            );


            if(
                state ===
                "connected"
            ){

                callState.textContent =
                    "متصل • 00:00";

                startCallTimer();

                showConnectedButtons();

            }


            if(
                state ===
                "failed"
            ){

                callState.textContent =
                    "تعذر الاتصال";

            }


            if(
                state ===
                "disconnected"
            ){

                callState.textContent =
                    "انقطع الاتصال";

            }

        };


    return pc;

}

function startOutgoingTimeout(){

    clearTimeout(

    );


    callTimeout =
        setTimeout(

                if(

                    "caller"
                ){

                    const id =
                        activeCallId;


                    try{

                        await updateDoc(

                            doc(
                                db,
                                "calls",
                                id
                            ),

                            {

                                status:
                                    "missed",

                                duration:0,

                                endedAt:
                                    serverTimestamp()

                            }

                        );

                    }catch(error){

                        console.error(
                            "30s timeout:",
                            error
                        );

                    }


                    await saveCallMessage(
                        "missed",
                        0
                    );


                    cleanupCall();

                }

            },
            30000
        );

}


function stopOutgoingTimeout(){

    clearTimeout(
        callTimeout
    );

    callTimeout =
        null;

}


/* ============================================================
   START CALL
============================================================ */

async function startCall(
    type
){

    if(
        activeCallId
    )
        return;


    if(
        !currentUser ||
        !friendUser
    ){

        alert(
            "تعذر بدء المكالمة"
        );

        return;

    }


    activeCallId =
        crypto.randomUUID();


    activeCallType =
        type;


    activeCallRole =
        "caller";


    activeCallPeer = {

        uid:
            friendUser.uid,

        name:
            friendUser.name,

        photo:
            friendUser.photo

    };


    callMessageSaved =
        false;


    callSeconds =
        0;


    showCallOverlay();


    callState.textContent =
        "جارٍ الاتصال...";


    showOutgoingButtons();


    incomingInfo.style.display =
        "none";


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        type ===
                        "video"

                });


        if(
            type ===
            "video"
        ){

            cameraFacing =
                "user";


            localVideo.srcObject =
                localStream;


            localVideo.style.display =
                "block";


            localAvatar.style.display =
                "none";


            videoArea.classList.remove(
                "swapped"
            );

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        await setDoc(

            callRef,

            {

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callType:
                    type,

                status:
                    "ringing",

                createdAt:
                    serverTimestamp(),

                receivedAt:
                    null

            }

        );


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(

            callRef,

            {

                offer:{

                    type:
                        offer.type,

                    sdp:
                        offer.sdp

                }

            }

        );


        listenActiveCallAsCaller();

        startOutgoingTimeout();


    }catch(error){

        console.error(
            "Start call:",
            error
        );


        alert(
            "تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
        );


        await cancelOutgoingCall();

    }

}


/* ============================================================
   CALLER LISTENER
============================================================ */

function listenActiveCallAsCaller(){

    if(
        unsubscribeActiveCall
    ){

        unsubscribeActiveCall();

    }


    unsubscribeActiveCall =
        onSnapshot(

            doc(
                db,
                "calls",
                activeCallId
            ),

            async snap => {

                if(
                    !snap.exists()
                ){

                    cleanupCall();

                    return;

                }


                const data =
                    snap.data();


                /*
                   عندما يستلم الهاتف الآخر الطلب
                   يصبح عند المتصل: يرن
                */

                if(
                    data.receivedAt &&
                    data.status ===
                    "ringing"
                ){

                    callState.textContent =
                        "يرن";

                }


                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection.currentRemoteDescription
                ){

                    try{

                        await peerConnection
                            .setRemoteDescription(

                                new RTCSessionDescription(
                                    data.answer
                                )

                            );

                    }catch(error){

                        console.error(
                            "Answer:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "connected"
                ){

                    stopOutgoingTimeout();

                    callState.textContent =
                        "متصل • " +
                        formatDuration(
                            callSeconds
                        );

                    showConnectedButtons();

                    startCallTimer();

                }


                /*
                   الطرف الآخر رفض أو أنهى أو
                   المتصل ألغى المكالمة
                */

                if(
                    data.status ===
                    "ended" ||
                    data.status ===
                    "rejected" ||
                    data.status ===
                    "missed" ||
                    data.status ===
                    "cancelled"
                ){

                    if(
                        typeof data.duration ===
                        "number"
                    ){

                        callSeconds =
                            data.duration;

                    }


                    cleanupCall();

                }

            }

        );


    unsubscribeCallerCandidates =
        onSnapshot(

            collection(
                db,
                "calls",
                activeCallId,
                "candidates"
            ),

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.senderId ===
                                currentUser.uid
                            )
                                return;


                            if(
                                peerConnection &&
                                data.candidate
                            ){

                                peerConnection
                                    .addIceCandidate(

                                        new RTCIceCandidate(
                                            data.candidate
                                        )

                                    )
                                    .catch(
                                        console.error
                                    );

                            }

                        }
                    );

            }

        );

}


/* ============================================================
   INCOMING CALLS
============================================================ */

function listenIncomingCalls(){

    if(
        !currentUser
    )
        return;


    if(
        unsubscribeIncomingCalls
    ){

        unsubscribeIncomingCalls();

    }


    const callsRef =
        collection(
            db,
            "calls"
        );


    /*
       مهم جدًا:
       هذا المستخدم هو receiver فقط.
       لذلك C لن يرى A -> B.
    */

    const q =
        query(

            callsRef,

            where(
                "receiverId",
                "==",
                currentUser.uid
            )

        );


    unsubscribeIncomingCalls =
        onSnapshot(

            q,

            async snap => {

                for(
                    const change
                    of snap.docChanges()
                ){

                    const data =
                        change.doc.data();

                    const changedId =
                        change.doc.id;


                    if(
                        data.receiverId !==
                        currentUser.uid
                    )
                        continue;


                    /*
                       إذا كانت هذه مكالمة نحن نعرضها
                       ثم ألغى المتصل الطلب
                    */

                    if(
                        activeCallId ===
                        changedId
                    ){

                        if(
                            data.status !==
                            "ringing" &&
                            data.status !==
                            "connected"
                        ){

                            cleanupCall();

                            continue;

                        }

                    }


                    if(
                        change.type !==
                        "added" &&
                        change.type !==
                        "modified"
                    )
                        continue;


                    if(
                        data.status !==
                        "ringing"
                    )
                        continue;


                    if(
                        activeCallId
                    )
                        continue;


                    const created =
                        data.createdAt
                        ?.toMillis?.() ||
                        0;


                    if(
                        created &&
                        Date.now() -
                        created >
                        30000
                    ){

                        try{

                            await updateDoc(

                                doc(
                                    db,
                                    "calls",
                                    changedId
                                ),

                                {

                                    status:
                                        "missed",

                                    duration:0,

                                    endedAt:
                                        serverTimestamp()

                                }

                            );

                        }catch(e){

                            console.error(e);

                        }

                        continue;

                    }


                    const callerDoc =
                        await getDoc(

                            doc(
                                db,
                                "users",
                                data.callerId
                            )

                        );


                    let caller = {

                        uid:
                            data.callerId,

                        name:
                            "مستخدم Mecd",

                        photo:
                            ""

                    };


                    if(
                        callerDoc.exists()
                    ){

                        const callerData =
                            callerDoc.data();


                        caller.name =
                            callerData.name ||
                            "مستخدم Mecd";


                        caller.photo =
                            callerData.photo ||
                            "";

                    }


                    /*
                       تسجيل أن الطلب وصل للهاتف
                       حتى يرى المتصل "يرن"
                    */

                    try{

                        await updateDoc(

                            doc(
                                db,
                                "calls",
                                changedId
                            ),

                            {

                                receivedAt:
                                    serverTimestamp()

                            }

                        );

                    }catch(error){

                        console.error(
                            "receivedAt:",
                            error
                        );

                    }


                    activeCallId =
                        changedId;


                    activeCallType =
                        data.callType ||
                        "audio";


                    activeCallRole =
                        "receiver";


                    activeCallPeer =
                        caller;


                    callSeconds =
                        0;


                    callMessageSaved =
                        false;


                    showCallOverlay();


                    callState.textContent =
                        activeCallType ===
                        "video"

                        ? "📹 مكالمة فيديو واردة"

                        : "📞 مكالمة صوتية واردة";


                    incomingInfo.style.display =
                        "flex";


                    incomingText.textContent =
                        activeCallType ===
                        "video"

                        ? "مكالمة فيديو واردة"

                        : "مكالمة صوتية واردة";


                    showIncomingButtons();


                    /*
                       نراقب المكالمة من جهاز المستلم
                       حتى إذا ضغط المتصل إنهاء تختفي فورًا.
                    */

                    listenReceiverCallStatus();

                }

            },

            error => {

                console.error(
                    "Incoming calls:",
                    error
                );

            }

        );

}


/* ============================================================
   RECEIVER CALL STATUS
============================================================ */

function listenReceiverCallStatus(){

    if(
        !activeCallId
    )
        return;


    if(
        unsubscribeActiveCall
    ){

        unsubscribeActiveCall();

    }


    unsubscribeActiveCall =
        onSnapshot(

            doc(
                db,
                "calls",
                activeCallId
            ),

            snap => {

                if(
                    !snap.exists()
                ){

                    cleanupCall();

                    return;

                }


                const data =
                    snap.data();


                /*
                   المتصل ألغى المكالمة قبل القبول
                */

                if(
                    data.status ===
                    "cancelled" ||
                    data.status ===
                    "missed" ||
                    data.status ===
                    "rejected"
                ){

                    cleanupCall();

                    return;

                }


                /*
                   المتصل أو المستلم أنهى مكالمة
                   كانت متصلة
                */

                if(
                    data.status ===
                    "ended"
                ){

                    cleanupCall();

                }

            }

        );

}


/* ============================================================
   ACCEPT
============================================================ */

async function acceptIncomingCall(){

    if(
        !activeCallId ||
        !activeCallPeer
    )
        return;


    acceptCallButton.classList.add(
        "hidden"
    );

    rejectCallButton.classList.add(
        "hidden"
    );


    incomingInfo.style.display =
        "none";


    callState.textContent =
        "جارٍ الاتصال...";


    try{

        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        const snap =
            await getDoc(
                callRef
            );


        if(
            !snap.exists()
        ){

            throw new Error(
                "المكالمة غير موجودة"
            );

        }


        const data =
            snap.data();


        if(
            data.status !==
            "ringing"
        ){

            cleanupCall();

            return;

        }


        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        activeCallType ===
                        "video"

                });


        if(
            activeCallType ===
            "video"
        ){

            cameraFacing =
                "user";


            localVideo.srcObject =
                localStream;


            localVideo.style.display =
                "block";


            localAvatar.style.display =
                "none";


            videoArea.classList.remove(
                "swapped"
            );

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        if(
            !data.offer
        ){

            throw new Error(
                "لم تصل بيانات الاتصال"
            );

        }


        await peerConnection
            .setRemoteDescription(

                new RTCSessionDescription(
                    data.offer
                )

            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(

            callRef,

            {

                answer:{

                    type:
                        answer.type,

                    sdp:
                        answer.sdp

                },

                status:
                    "connected"

            }

        );


        callState.textContent =
            "متصل • 00:00";


        showConnectedButtons();


        startCallTimer();


        listenReceiverCandidates();


    }catch(error){

        console.error(
            "Accept:",
            error
        );


        alert(
            "تعذر قبول المكالمة"
        );


        await finishCall(
            "missed"
        );

    }

}

/* ============================================================
   REJECT
============================================================ */

async function rejectIncomingCall(){

    if(
        !activeCallId
    ){

        cleanupCall();

        return;

    }


    const id =
        activeCallId;


    try{

        await updateDoc(

            doc(
                db,

                id

            {

        );

    cleanupCall();

}

        );

}


/* ============================================================
   TIMER
============================================================ */

function startCallTimer(){

    if(
        callTimer
    )
        return;


    callTimer =
        setInterval(
            () => {

                callSeconds++;


                callState.textContent =
                    "متصل • " +
                    formatDuration(
                        callSeconds
                    );

            },
            1000
        );

}


function stopCallTimer(){

    if(
        callTimer
    ){

        clearInterval(
            callTimer
        );

    }


    callTimer =
        null;

}


/* ============================================================
   SAVE CALL MESSAGE
============================================================ */

async function saveCallMessage(
    status,
    duration
){

    if(
        !activeCallId ||
        !activeCallPeer
    )
        return;


    if(
        callMessageSaved
    )
        return;


    callMessageSaved =
        true;


    const callerId =
        activeCallRole ===
        "caller"

        ? currentUser.uid

        : activeCallPeer.uid;


    const receiverId =
        activeCallRole ===
        "caller"

        ? activeCallPeer.uid

        : currentUser.uid;


    const callChatID =
        createChatID(
            callerId,
            receiverId
        );


    try{

        await setDoc(

            doc(
                db,
                "chats",
                callChatID,
                "messages",
                "call_" +
                activeCallId
            ),

            {

                type:
                    "call",

                callId:
                    activeCallId,

                callType:
                    activeCallType,

                callerId,

                receiverId,

                callStatus:
                    status,

                duration:
                    duration || 0,

                senderId:
                    callerId,

                read:false,

                createdAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Call message:",
            error
        );

    }

}


/* ============================================================
   FINISH CONNECTED CALL
============================================================ */

async function finishCall(
    forcedStatus = null
){

    const callId =
        activeCallId;


    if(!callId){

        cleanupCall();

        return;

    }


    stopOutgoingTimeout();


    const duration =
        callSeconds;


    let status =
        forcedStatus;


    if(
        !status
    ){

        status =
            duration > 0
            ? "completed"
            : "missed";

    }


    try{

        await updateDoc(

            doc(
                db,
                "calls",
                callId
            ),

            {

                status:
                    status ===
                    "completed"

                    ? "ended"

                    : status,

                duration,

                endedAt:
                    serverTimestamp()

            }

        );

    }catch(error){

        console.error(
            "End call:",
            error
        );

    }


    await saveCallMessage(
        status,
        duration
    );


    cleanupCall();

}


/* ============================================================
   CLEANUP
============================================================ */

function cleanupCall(){

    stopCallTimer();

    stopOutgoingTimeout();


    if(
        unsubscribeActiveCall
    ){

        unsubscribeActiveCall();

        unsubscribeActiveCall =
            null;

    }


    if(
        unsubscribeCallerCandidates
    ){

        unsubscribeCallerCandidates();

        unsubscribeCallerCandidates =
            null;

    }


    if(
        unsubscribeReceiverCandidates
    ){

        unsubscribeReceiverCandidates();

        unsubscribeReceiverCandidates =
            null;

    }


    if(
        localStream
    ){

        localStream
            .getTracks()
            .forEach(
                track => {

                    try{

                        track.stop();

                    }catch(e){}

                }
            );

    }


    localStream =
        null;


    if(
        peerConnection
    ){

        try{

            peerConnection.close();

        }catch(e){}

    }


    peerConnection =
        null;


    remoteVideo.srcObject =
        null;


    localVideo.srcObject =
        null;


    remoteVideo.style.display =
        "block";


    remoteAvatar.style.display =
        "flex";


    localVideo.style.display =
        "block";


    localAvatar.style.display =
        "none";


    videoArea.classList.remove(
        "swapped"
    );


    hideAllCallButtons();


    incomingInfo.style.display =
        "none";


    callOverlay.style.display =
        "none";


    activeCallId =
        null;


    activeCallType =
        null;


    activeCallRole =
        null;


    activeCallPeer =
        null;


    callSeconds =
        0;


    callMessageSaved =
        false;


    remoteAudioMuted =
        false;


    muteButton.textContent =
        "🎤";


    speakerButton.textContent =
        "🔊";


    flipCameraButton.textContent =
        "🔄";


    muteButton.classList.remove(
        "active"
    );

    speakerButton.classList.remove(
        "active"
    );

}

/* ============================================================
   FLIP CAMERA
============================================================ */

async function flipCamera(){

    if(
        !localStream ||
        activeCallType !==
        "video"
    )
        return;


    try{

        const oldTrack =
            localStream
                .getVideoTracks()[0];


        if(
            !oldTrack
        )
            return;


        cameraFacing =
            cameraFacing ===
            "user"

            ? "environment"

            : "user";


        const newStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:false,

                    video:{

                        facingMode:{
                            ideal:
                                cameraFacing
                        }

                    }

                });


        const newTrack =
            newStream
                .getVideoTracks()[0];


        const sender =
            peerConnection
                ?.getSenders()
                .find(
                    s =>
                        s.track?.kind ===
                        "video"
                );


        if(sender){

            await sender.replaceTrack(
                newTrack
            );

        }


        oldTrack.stop();


        localStream.removeTrack(
            oldTrack
        );


        localStream.addTrack(
            newTrack
        );


        localVideo.srcObject =
            localStream;


    }catch(error){

        console.error(
            "Flip camera:",
            error
        );

    }

}


flipCameraButton.onclick =
    flipCamera;

   - بعد الاتصال = إنهاء المكالمة
*/

endCallButton.onclick =
    async () => {

        if(
            activeCallRole ===
            "caller"
        ){

            const callSnap =
                activeCallId
                ? await getDoc(
                    doc(
                        db,
                        "calls",
                        activeCallId
                    )
                )
                : null;


            const status =
                callSnap?.exists()
                ? callSnap.data().status
                : null;


            if(
                status === "ringing"
            ){

                await cancelOutgoingCall();

                return;

            }

        }


        await finishCall();

    };


/* ============================================================
   BACK
============================================================ */

backButton.onclick =
    async () => {

        await updateMyActivity(
            "none"
        );


        if(
            unsubscribeMessages
        ){

            unsubscribeMessages();

        }


        if(
            unsubscribeFriendStatus
        ){

            unsubscribeFriendStatus();

        }


        if(
            unsubscribeFriendActivity
        ){

            unsubscribeFriendActivity();

        }


        if(
            activeCallId
        ){

            if(
                activeCallRole ===
                "caller"
            ){

                await cancelOutgoingCall();

            }else{

                await finishCall();

            }

        }


        stopPresence();


        history.back();

    };


/* ============================================================
   VISIBILITY
============================================================ */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            !currentUser
        )
            return;


        if(
            document.visibilityState ===
            "visible"
        ){

            updateMyPresence(
                true
            );

        }else{

            if(
                !activeCallId
            ){

                updateMyPresence(
                    false
                );

                updateMyActivity(
                    "none"
                );

            }

        }

    }
);


window.addEventListener(
    "pagehide",
    () => {

        if(
            currentUser
        ){

            updateMyPresence(
                false
            );

            if(
                !activeCallId
            ){

                updateMyActivity(
                    "none"
                );

            }

        }

    }
);


/* ============================================================
   INIT
============================================================ */

function init(){

    onAuthStateChanged(

        auth,

        async user => {

            if(!user){

                loading.innerHTML =
                    "يجب تسجيل الدخول أولاً";

                return;

            }


            currentUser =
                user;


            window.chatUser =
                user;


            try{

                startPresence();


                await loadFriend();


                listenMessages();


                /*
                   استقبال المكالمات للمستخدم الحالي فقط.
                */

                listenIncomingCalls();


                /*
                   voice.js بعد تجهيز المتغيرات.
                */

                connectVoiceJS();


                showApp();


            }catch(error){

                console.error(
                    error
                );


                stopPresence();


                showError(
                    error
                );

            }

        }

    );

}


init();


console.log(
    "🔥 Mecd Chat loaded - Calls v2"
);

</script>
