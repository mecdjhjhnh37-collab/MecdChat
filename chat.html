<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#075E54">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%;
}

body{
font-family:Arial,Tahoma,sans-serif;
background:#0b141a;
color:#e9edef;
overflow:hidden;
}

button,input{
font-family:inherit;
}

button{
-webkit-tap-highlight-color:transparent;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:#efeae2;
overflow:hidden;
}

/* ================= HEADER ================= */

header{
height:64px;
min-height:64px;
background:#075e54;
display:flex;
align-items:center;
padding:7px 10px;
gap:8px;
z-index:20;
box-shadow:0 1px 3px rgba(0,0,0,.25);
}

.back{
width:38px;
height:44px;
border:0;
background:transparent;
color:#fff;
font-size:27px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.avatar{
width:45px;
height:45px;
min-width:45px;
border-radius:50%;
background:#128c7e;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:22px;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.user-info{
flex:1;
min-width:0;
color:#fff;
}

.user-name{
font-size:16px;
font-weight:500;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.user-status{
font-size:12px;
margin-top:3px;
color:rgba(255,255,255,.8);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#fff;
}

.call-buttons{
display:flex;
align-items:center;
gap:2px;
}

.call-buttons button{
width:38px;
height:44px;
border:0;
background:transparent;
color:#fff;
font-size:21px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

/* ================= CHAT BACKGROUND ================= */

.messages{
position:relative;
flex:1;
min-height:0;
overflow-y:auto;
padding:14px 9px 145px;
display:flex;
flex-direction:column;
gap:4px;
scroll-behavior:smooth;
background-color:#efeae2;
background-image:
radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);
background-size:7px 7px;
}

.messages::-webkit-scrollbar{
width:4px;
}

.messages::-webkit-scrollbar-thumb{
background:rgba(0,0,0,.18);
border-radius:10px;
}

/* ================= EMPTY ================= */

.empty{
margin:auto;
text-align:center;
color:#667781;
line-height:1.8;
font-size:14px;
background:rgba(255,255,255,.65);
padding:13px 20px;
border-radius:10px;
}

/* ================= MESSAGE ================= */

.message{
position:relative;
max-width:82%;
min-width:45px;
padding:7px 9px 19px;
border-radius:7px;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.45;
font-size:14px;
user-select:none;
box-shadow:0 1px 1px rgba(0,0,0,.12);
transition:transform .12s ease,background .2s ease;
}

.message.mine{
align-self:flex-start;
background:#d9fdd3;
color:#111;
border-top-left-radius:0;
}

.message.other{
align-self:flex-end;
background:#fff;
color:#111;
border-top-right-radius:0;
}

.message.highlight{
background:#fff3a6!important;
}

.message-text{
white-space:pre-wrap;
}

.time{
position:absolute;
bottom:4px;
left:8px;
font-size:9px;
color:#667781;
direction:ltr;
white-space:nowrap;
}

.message.mine .time{
left:30px;
}

.message-status{
position:absolute;
bottom:3px;
left:8px;
font-size:13px;
font-weight:bold;
direction:ltr;
color:#667781;
}

.message-status.read{
color:#53bdeb;
}

.message.mine .message-status{
left:8px;
}

/* ================= MEDIA ================= */

.message.image-message,
.message.video-message{
padding:4px 4px 21px;
max-width:82%;
background:#fff;
}

.message.mine.image-message,
.message.mine.video-message{
background:#d9fdd3;
}

.message-image,
.message-video{
display:block;
width:100%;
max-width:280px;
max-height:320px;
object-fit:cover;
border-radius:5px;
cursor:pointer;
}

.message.video-message video{
background:#000;
}

/* ================= REPLY ================= */

.message-reply{
display:flex;
gap:7px;
margin-bottom:5px;
padding:5px 7px;
border-radius:5px;
background:rgba(0,0,0,.07);
border-right:3px solid #25d366;
cursor:pointer;
overflow:hidden;
}

.message.other .message-reply{
background:#f1f2f3;
}

.reply-content{
min-width:0;
overflow:hidden;
}

.reply-name{
font-size:10px;
font-weight:bold;
color:#128c7e;
margin-bottom:2px;
}

.reply-text{
font-size:10px;
color:#667781;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* ================= REACTIONS ================= */

.message-reactions{
position:absolute;
bottom:-9px;
right:7px;
display:flex;
gap:2px;
z-index:5;
}

.message.mine .message-reactions{
right:auto;
left:7px;
}

.reaction-chip{
border:1px solid #ddd;
background:#fff;
border-radius:12px;
padding:1px 5px;
font-size:11px;
display:flex;
align-items:center;
gap:2px;
cursor:pointer;
box-shadow:0 1px 2px rgba(0,0,0,.15);
}

.reaction-chip.mine{
border-color:#25d366;
}

.reaction-count{
font-size:9px;
color:#667781;
}

/* ================= PIN ================= */

.pinned-banner{
display:none;
background:#fff;
color:#333;
border-bottom:1px solid #ddd;
padding:7px 12px;
align-items:center;
gap:8px;
z-index:15;
}

.pinned-banner.show{
display:flex;
}

.pinned-banner-content{
display:flex;
align-items:center;
gap:7px;
flex:1;
min-width:0;
cursor:pointer;
}

.pinned-banner-text{
font-size:12px;
color:#667781;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.pinned-banner-close{
border:0;
background:transparent;
font-size:15px;
color:#667781;
cursor:pointer;
}

/* ================= BOTTOM INPUT ================= */

.input-area{
position:absolute;
bottom:0;
left:0;
right:0;
padding:7px 7px 8px;
background:#efeae2;
display:flex;
align-items:flex-end;
gap:6px;
z-index:30;
}

.message-input-wrap{
flex:1;
min-width:0;
display:flex;
align-items:center;
background:#fff;
border-radius:24px;
min-height:48px;
padding:0 4px;
}

#attachButton{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:transparent;
color:#54656f;
font-size:25px;
cursor:pointer;
}

#messageInput{
flex:1;
min-width:0;
height:44px;
border:0;
outline:none;
background:transparent;
font-size:15px;
color:#111;
padding:0 5px;
}

#messageInput::placeholder{
color:#8696a0;
}

#voiceButton,
#sendButton{
width:48px;
height:48px;
min-width:48px;
border:0;
border-radius:50%;
font-size:21px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

#voiceButton{
background:#25d366;
color:#fff;
}

#sendButton{
background:#25d366;
color:#fff;
display:none;
}

#sendButton.show{
display:flex;
}

#voiceButton.hide{
display:none;
}

/* ================= ATTACH MENU ================= */

#attachMenu{
position:absolute;
bottom:67px;
right:8px;
width:205px;
padding:6px;
background:#fff;
border-radius:12px;
box-shadow:0 5px 25px rgba(0,0,0,.25);
display:none;
z-index:100;
}

#attachMenu.show{
display:block;
}

.attach-option{
width:100%;
height:46px;
border:0;
border-radius:8px;
background:#fff;
color:#333;
display:flex;
align-items:center;
gap:12px;
padding:0 13px;
font-size:14px;
cursor:pointer;
}

.attach-option:hover{
background:#f0f2f5;
}

/* ================= REPLY COMPOSE ================= */

.reply-compose{
position:absolute;
bottom:64px;
left:0;
right:0;
padding:6px 9px;
background:#f0f2f5;
border-top:1px solid #ddd;
display:none;
align-items:center;
gap:7px;
z-index:29;
}

.reply-compose.show{
display:flex;
}

.reply-compose-content{
flex:1;
min-width:0;
background:#fff;
border-right:3px solid #25d366;
padding:6px 9px;
border-radius:5px;
overflow:hidden;
}

.reply-compose-name{
font-size:11px;
font-weight:bold;
color:#128c7e;
margin-bottom:2px;
}

.reply-compose-text{
font-size:11px;
color:#667781;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.reply-cancel{
width:32px;
height:32px;
border:0;
background:transparent;
font-size:18px;
color:#667781;
cursor:pointer;
}

/* ================= BOTTOM SHEET ================= */

.bottom-sheet-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:1000;
display:flex;
align-items:flex-end;
}

.bottom-sheet{
width:100%;
max-width:650px;
margin:auto;
background:#fff;
border-radius:18px 18px 0 0;
padding:10px 10px 22px;
box-shadow:0 -5px 25px rgba(0,0,0,.25);
animation:sheetUp .2s ease;
}

@keyframes sheetUp{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

.sheet-reactions-bar{
display:flex;
justify-content:space-around;
align-items:center;
padding:8px;
margin-bottom:7px;
background:#f0f2f5;
border-radius:15px;
}

.sheet-reaction-btn{
border:0;
background:transparent;
font-size:25px;
cursor:pointer;
padding:5px 9px;
}

.sheet-actions-list{
display:flex;
flex-direction:column;
gap:2px;
}

.sheet-action-item{
width:100%;
height:47px;
border:0;
background:#fff;
border-radius:8px;
display:flex;
align-items:center;
gap:12px;
padding:0 14px;
font-size:14px;
color:#222;
cursor:pointer;
text-align:right;
}

.sheet-action-item:hover{
background:#f0f2f5;
}

/* ================= LOADING ================= */

#loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#075e54;
color:#fff;
font-size:17px;
z-index:999999;
}

/* ================= FILE ================= */

.hidden-file{
display:none!important;
}

/* ================= MOBILE ================= */

@media(max-width:650px){
.app{
max-width:none;
}

.message{
max-width:86%;
}

.message-image,
.message-video{
max-width:270px;
}
}
</style>
</head>

<body>

<div id="loading">جارٍ فتح الدردشة...</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back" type="button" aria-label="رجوع">→</button>

<div id="friendAvatar" class="avatar">👤</div>

<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton" type="button" aria-label="مكالمة">📞</button>
<button id="videoButton" type="button" aria-label="فيديو">📹</button>
<button id="moreButton" type="button" aria-label="المزيد">⋮</button>
</div>

</header>

<div id="pinnedBanner" class="pinned-banner">

<div id="pinnedBannerClick" class="pinned-banner-content">
<span>📌</span>
<span id="pinnedBannerText" class="pinned-banner-text">رسالة مثبتة</span>
</div>

<button id="pinnedBannerClose" class="pinned-banner-close" type="button">✕</button>

</div>

<div id="messages" class="messages">

<div class="empty">
💬<br>
ابدأ المحادثة الآن
</div>

</div>

<div id="attachMenu">

<button id="galleryButton" class="attach-option" type="button">
<span>🖼️</span>
<span>صورة أو فيديو</span>
</button>

<button id="cameraButton" class="attach-option" type="button">
<span>📷</span>
<span>الكاميرا</span>
</button>

</div>

<input id="galleryInput" class="hidden-file" type="file" accept="image/*,video/*">

<input id="cameraInput" class="hidden-file" type="file" accept="image/*,video/*" capture="environment">

<div id="replyCompose" class="reply-compose">

<div class="reply-compose-content">
<div id="replyComposeName" class="reply-compose-name">الرد على الرسالة</div>
<div id="replyComposeText" class="reply-compose-text"></div>
</div>

<button id="replyCancel" class="reply-cancel" type="button">✕</button>

</div>

<div class="input-area">

<div class="message-input-wrap">

<button id="attachButton" type="button" aria-label="إرفاق">📎</button>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة"
autocomplete="off"
maxlength="2000"
>

</div>

<button id="voiceButton" type="button" aria-label="رسالة صوتية">🎤</button>

<button id="sendButton" type="button" aria-label="إرسال">➤</button>

</div>

</main>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
addDoc,
collection,
query,
orderBy,
onSnapshot,
deleteDoc,
serverTimestamp,
arrayUnion,
arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
createClient
} from "https://esm.sh/@supabase/supabase-js@2";


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {
apiKey:"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",
authDomain:"mecd-tools.firebaseapp.com",
projectId:"mecd-tools",
storageBucket:"mecd-tools.firebasestorage.app",
messagingSenderId:"643005547408",
appId:"1:643005547408:web:b1719060ec340dd0e0a915"
};

const firebaseApp = initializeApp(firebaseConfig);

const auth = getAuth(firebaseApp);

const db = getFirestore(firebaseApp);


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://aqukohedqmtjuspjbkmn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_jODiQ8WSON3ouLqvLlQcZA_2Q6GwF_l";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id => document.getElementById(id);

const loading = $("loading");
const app = $("app");

const messages = $("messages");
const messageInput = $("messageInput");

const sendButton = $("sendButton");
const voiceButton = $("voiceButton");

const attachButton = $("attachButton");
const attachMenu = $("attachMenu");

const galleryButton = $("galleryButton");
const cameraButton = $("cameraButton");

const galleryInput = $("galleryInput");
const cameraInput = $("cameraInput");

const friendName = $("friendName");
const friendAvatar = $("friendAvatar");
const friendStatus = $("friendStatus");

const backButton = $("backButton");
const moreButton = $("moreButton");

const pinnedBanner = $("pinnedBanner");
const pinnedBannerText = $("pinnedBannerText");
const pinnedBannerClick = $("pinnedBannerClick");
const pinnedBannerClose = $("pinnedBannerClose");

const replyCompose = $("replyCompose");
const replyComposeName = $("replyComposeName");
const replyComposeText = $("replyComposeText");
const replyCancel = $("replyCancel");


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;
let unsubscribeFriend = null;

let replyTarget = null;
let editingMessageId = null;

const messageElements = new Map();


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>'"]/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[c]));

}


function createChatID(a,b){

return [a,b].sort().join("_");

}


function getMessagePreview(data){

if(data.type === "text")
return data.text || "رسالة";

if(data.type === "image")
return "📷 صورة";

if(data.type === "video")
return "🎥 فيديو";

if(data.type === "voice")
return "🎤 رسالة صوتية";

return "رسالة";

}


function formatTime(timestamp){

if(!timestamp || !timestamp.toDate)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString("ar",{
hour:"2-digit",
minute:"2-digit"
});

}catch{

return "";

}

}


function setUserAvatar(element,user){

element.innerHTML = "";

if(user?.photo){

const img = document.createElement("img");

img.src = user.photo;
img.alt = "";

img.onerror = ()=>{
element.textContent = "👤";
};

element.appendChild(img);

}else{

element.textContent = "👤";

}

}


/* =========================================================
   REPLY
========================================================= */

function startReply(data){

editingMessageId = null;

sendButton.textContent = "➤";

replyTarget = {

id:data.id,

senderId:data.senderId,

senderName:
data.senderId === currentUser.uid
? "أنت"
: friendUser?.name || "المستخدم",

text:getMessagePreview(data)

};

replyComposeName.textContent =
"الرد على " + replyTarget.senderName;

replyComposeText.textContent =
replyTarget.text;

replyCompose.classList.add("show");

messageInput.focus();

}


function cancelReply(){

replyTarget = null;

replyCompose.classList.remove("show");

}


replyCancel.onclick = e=>{

e.stopPropagation();

cancelReply();

};


/* =========================================================
   REACTIONS
========================================================= */

const reactionList=[
"❤️",
"👍",
"🔥",
"😂",
"😮"
];


async function toggleReaction(messageId,emoji){

if(
!currentUser ||
!chatID ||
!messageId ||
!emoji
)return;

try{

const ref =
doc(
db,
"chats",
chatID,
"messages",
messageId
);

const snap = await getDoc(ref);

if(!snap.exists())
return;

const data=snap.data();

const reactions=
Array.isArray(data.reactions)
?data.reactions
:[];

const mine=
reactions.find(
r=>
r &&
r.userId===currentUser.uid &&
r.emoji===emoji
);

if(mine){

await updateDoc(ref,{

reactions:
arrayRemove(mine)

});

}else{

const oldMine=
reactions.find(
r=>
r &&
r.userId===currentUser.uid
);

if(oldMine){

await updateDoc(ref,{

reactions:
arrayRemove(oldMine)

});

}

await updateDoc(ref,{

reactions:
arrayUnion({

userId:currentUser.uid,
emoji

})

});

}

}catch(error){

console.error("Reaction error:",error);

}

}


/* =========================================================
   RENDER REACTIONS
========================================================= */

function renderReactions(box,data){

if(
!Array.isArray(data.reactions) ||
!data.reactions.length
)return;

const wrapper=
document.createElement("div");

wrapper.className="message-reactions";

const counts={};

data.reactions.forEach(reaction=>{

if(
!reaction ||
!reaction.emoji
)return;

if(!counts[reaction.emoji]){

counts[reaction.emoji]={
count:0,
mine:false
};

}

counts[reaction.emoji].count++;

if(
reaction.userId===currentUser.uid
){

counts[reaction.emoji].mine=true;

}

});


reactionList.forEach(emoji=>{

const info=counts[emoji];

if(!info)
return;

const chip=
document.createElement("button");

chip.type="button";

chip.className=
"reaction-chip"+
(info.mine?" mine":"");

chip.textContent=
emoji+
(info.count>1
?" "+info.count
:"");

chip.onclick=e=>{

e.stopPropagation();

toggleReaction(
data.id,
emoji
);

};

wrapper.appendChild(chip);

});


if(wrapper.children.length)
box.appendChild(wrapper);

}


/* =========================================================
   REPLY COMPOSER
========================================================= */

function renderReply(box,data){

if(!data.replyTo)
return;

const replyBox=
document.createElement("div");

replyBox.className="message-reply";

replyBox.onclick=e=>{

e.stopPropagation();

const target=
messageElements.get(
data.replyTo.messageId
);

if(target){

target.scrollIntoView({
behavior:"smooth",
block:"center"
});

target.classList.add("highlight");

setTimeout(
()=>target.classList.remove("highlight"),
1500
);

}

};


const content=
document.createElement("div");

content.className="reply-content";


const name=
document.createElement("div");

name.className="reply-name";

name.textContent=
data.replyTo.senderId===currentUser.uid
?"أنت"
:(data.replyTo.senderName||"المستخدم");


const text=
document.createElement("div");

text.className="reply-text";

text.textContent=
data.replyTo.text||"رسالة";


content.append(name,text);

replyBox.appendChild(content);

box.appendChild(replyBox);

}


/* =========================================================
   MESSAGE ACTIONS
========================================================= */

function removeBottomSheet(){

const old=
document.querySelector(
".bottom-sheet-backdrop"
);

if(old)

/* =========================================================
   MESSAGE EVENTS
========================================================= */

function setupSwipeToReply(element,data){

let startX=0;
let currentX=0;
let active=false;


element.addEventListener(
"touchstart",
e=>{

startX=
e.touches[0].clientX;

currentX=startX;

active=true;

},
{passive:true}
);


element.addEventListener(
"touchmove",
e=>{

if(!active)
return;

currentX=
e.touches[0].clientX;

const diff=
currentX-startX;

if(
data.senderId!==currentUser.uid &&
diff>0 &&
diff<110
){

element.style.transform=
`translateX(${diff}px)`;

}else if(
data.senderId===currentUser.uid &&
diff<0 &&
diff>-110
){

element.style.transform=
`translateX(${diff}px)`;

}

},
{passive:true}
);


element.addEventListener(
"touchend",
()=>{

if(!active)
return;

active=false;

const diff=
currentX-startX;

if(Math.abs(diff)>70)
startReply(data);

element.style.transform="translateX(0)";

}
);

}


function triggerHeartReaction(element,id){

if(element.querySelector(".heart-pop"))
return;

toggleReaction(id,"❤️");

}


/* long press */

function addMessageActions(element,data){

let timer=null;
let longPress=false;
let lastTap=0;


element.addEventListener(
"pointerdown",
()=>{

longPress=false;

timer=setTimeout(
()=>{

longPress=true;

showBottomSheetMenu(data);

},
500
);

}
);


element.addEventListener(
"pointerup",
()=>{

clearTimeout(timer);

}
);


element.addEventListener(
"pointercancel",
()=>{

clearTimeout(timer);

}
);


element.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

showBottomSheetMenu(data);

}
);


element.addEventListener(
"click",
e=>{

if(longPress)
return;

if(
e.target.closest("button") ||
e.target.closest(".message-reply") ||
e.target.closest("video")
)
return;

const now=Date.now();

if(
now-lastTap<320 &&
now-lastTap>0
){

triggerHeartReaction(
element,
data.id
);

e.preventDefault();

}

lastTap=now;

}
);


setupSwipeToReply(
element,
data
);

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(change){

const id=change.doc.id;

const data={
...change.doc.data(),
id
};


if(change.type==="removed"){

const old=
messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}


if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(
currentUser.uid
)
){

const old=
messageElements.get(id);

if(old)
old.remove();

messageElements.delete(id);

return;

}


const old=
messageElements.get(id);


/* pinned */

if(data.pinned===true){

pinnedBannerText.textContent=
(data.senderId===currentUser.uid
?"أنت: "
:"")+
getMessagePreview(data);

pinnedBanner.classList.add("show");

}


/* box */

const box=
document.createElement("div");

box.className=
"message "+
(
data.senderId===currentUser.uid
?"mine"
:"other"
);


if(data.type==="image")
box.classList.add("image-message");

if(data.type==="video")
box.classList.add("video-message");


/* reply */

renderReply(box,data);


/* content */

if(data.type==="text"){

const text=
document.createElement("div");

text.className="message-text";

text.textContent=
data.text||"";

box.appendChild(text);


if(data.isEdited){

const edited=
document.createElement("span");

edited.style.fontSize="9px";
edited.style.color="#667781";
edited.textContent=" (معدلة)";

box.appendChild(edited);

}

}


else if(
data.type==="image" &&
data.url
){

const img=
document.createElement("img");

img.className="message-image";

img.src=data.url;

img.alt="صورة";

img.loading="lazy";

img.onclick=e=>{
e.stopPropagation();
window.open(data.url,"_blank");
};

box.appendChild(img);

}


else if(
data.type==="video" &&
data.url
){

const video=
document.createElement("video");

video.className="message-video";

video.src=data.url;

video.controls=true;

video.preload="metadata";

box.appendChild(video);

}


/* time */

const time=
document.createElement("span");

time.className="time";

time.textContent=
formatTime(data.createdAt);

box.appendChild(time);


/* status */

if(
data.senderId===currentUser.uid
){

const status=
document.createElement("span");

status.className=
"message-status "+
(
data.read===true
?"read"
:""
);

status.textContent=
data.read===true
?"✓✓"
:"✓";

box.appendChild(status);

}


/* reactions */

renderReactions(
box,
data
);


/* actions */

addMessageActions(
box,
data
);


/* replace */

if(old){

old.replaceWith(box);

}else{

messages.appendChild(box);

}

messageElements.set(id,box);

}


/* =========================================================
   SNAPSHOT
========================================================= */

function renderMessages(snapshot){

const nearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<
140;


if(
snapshot.docChanges().length &&
messages.querySelector(".empty")
){

messages.querySelector(".empty").remove();

}


snapshot.docChanges().forEach(
renderMessage
);


if(!snapshot.size){

if(!messages.querySelector(".empty")){

const empty=
document.createElement("div");

empty.className="empty";

empty.innerHTML=
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(empty);

}

}else{

const empty=
messages.querySelector(".empty");

if(empty)
empty.remove();

}


if(nearBottom){

requestAnimationFrame(
()=>{

messages.scrollTop=
messages.scrollHeight;

}
);

}

}


/* =========================================================
   LISTEN MESSAGES
========================================================= */

function listenMessages(){

if(!chatID)
return;


if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}


const q=
query(
collection(
db,
"chats",
chatID,
"messages"
),
orderBy(
"createdAt",
"asc"
)
);


unsubscribeMessages=
onSnapshot(
q,
renderMessages,
error=>{
console.error(
"Messages listener:",
error
);
}
);

}


/* =========================================================
   FRIEND STATUS
========================================================= */

function listenFriend(){

if(
!friendUser ||
!friendUser.uid
)
return;


if(unsubscribeFriend){

unsubscribeFriend();

unsubscribeFriend=null;

}


unsubscribeFriend=
onSnapshot(
doc(db,"users",friendUser.uid),
snap=>{

if(!snap.exists())
return;

const data=snap.data();


friendUser={
...friendUser,
...data,
uid:friendUser.uid,
name:data.name||friendUser.name||"مستخدم",
photo:data.photo||data.photoURL||friendUser.photo||""
};


friendName.textContent=
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);


/*
  يدعم أكثر من طريقة لتخزين الحالة:
  online / isOnline / status
*/

const online=
data.online===true ||
data.isOnline===true ||
data.status==="online";


if(online){

friendStatus.textContent=
"متصل الآن";

friendStatus.className=
"user-status online";

}else if(data.lastSeen){

let date=null;

try{

if(
typeof data.lastSeen.toDate==="function"
){

date=data.lastSeen.toDate();

}else{

date=new Date(data.lastSeen);

}

}catch{}

if(date && !isNaN(date.getTime())){

friendStatus.textContent=
"آخر ظهور "+
date.toLocaleString(
"ar",
{
hour:"2-digit",
minute:"2-digit",
day:"numeric",
month:"short"
}
);

}else{

friendStatus.textContent=
"غير متصل";

}

friendStatus.className=
"user-status";

}else{

friendStatus.textContent=
"غير متصل";

friendStatus.className=
"user-status";

}

},
error=>{
console.error(
"Friend listener:",
error
);
}
);

}

);

"لا يوجد مستخدم في الرابط"

);

};

friendUser.name;

);

);

/* =========================================================
   SEND TEXT
========================================================= */

async function handleSendMessage(){

const text=
messageInput.value.trim();


if(
!text ||
!currentUser ||
!friendUser ||
!chatID
)
return;


sendButton.disabled=true;


try{

if(editingMessageId){

await updateDoc(
doc(
db,
"chats",
chatID,
"messages",
editingMessageId
),
{
text:text,
isEdited:true
}
);


editingMessageId=null;

sendButton.textContent="➤";

}else{

const messageData={

text:text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type:"text",

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

};


if(replyTarget){

messageData.replyTo={

messageId:
replyTarget.id,

senderId:
replyTarget.senderId,

senderName:
replyTarget.senderName,

text:
replyTarget.text

};

}


await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
messageData
);

}


messageInput.value="";

cancelReply();

}catch(error){

"Send error:",
error
);

alert(
"تعذر إرسال الرسالة"
);

}finally{

sendButton.disabled=false;

updateInputButtons();

messageInput.focus();

}

}

async function uploadMediaAndSend(file,type){

if(
!file ||
!currentUser ||
!friendUser ||
!chatID
)
return;


const maxSize=
type==="video"
?50*1024*1024
:15*1024*1024;


if(file.size>maxSize){

alert(
type==="video"
?"الفيديو أكبر من 50MB"
:"الصورة أكبر من 15MB"
);

return;

}


try{

const safeName=
file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const fileName=
`${currentUser.uid}/${Date.now()}_${safeName}`;


const result=
await supabase
.storage
.from("mecd-media")
.upload(
fileName,
file,
{
upsert:false
}
);


if(result.error)
throw result.error;


const publicResult=
supabase
.storage
.from("mecd-media")
.getPublicUrl(fileName);


const mediaUrl=
publicResult.data.publicUrl;


const messageData={

url:mediaUrl,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type:type,

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

};


if(replyTarget){

messageData.replyTo={

messageId:
replyTarget.id,

senderId:
replyTarget.senderId,

senderName:
replyTarget.senderName,

text:
replyTarget.text

};

}


await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
messageData
);


cancelReply();


}catch(error){

console.error(
"Upload error:",
error
);

alert(
"فشل رفع الملف"
);

}

}

const file=
e.target.files?.[0];

if(!file)
return;

const type=
file.type.startsWith("video/")

uploadMediaAndSend(
file,
type

galleryInput.value="";

};


/* camera */

e.target.files?.[0];

if(!file)
return;

const type=
file.type.startsWith("video/")

);

};
