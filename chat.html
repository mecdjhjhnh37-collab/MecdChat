<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

content="width=device-width, initial-scale=1.0">

content="#050807">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,
body{
width:100%;
height:100%;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(
circle at top,
#123d35,
transparent 40%
),
linear-gradient(
180deg,
#07110f,
#020504
);

overflow:hidden;
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10;
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:white;
font-size:22px;
cursor:pointer;
}

.avatar{
width:48px;
height:48px;
border-radius:16px;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
transition:.2s;
}

.user-status.online{
color:#00e889;
}

.user-status.typing{
color:#00e889;
font-weight:bold;
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0;
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:white;
font-size:18px;
cursor:pointer;
}

.call-buttons button:active{
transform:scale(.94);
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:10px;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
}

.message{
max-width:78%;
padding:12px 15px;
border-radius:18px;
position:relative;
word-break:break-word;
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);
border-bottom-right-radius:5px;
}

.time{
display:inline-block;
font-size:9px;
opacity:.6;
margin-top:5px;
}

.message-meta{
display:flex;
align-items:center;
justify-content:flex-start;
gap:5px;
margin-top:5px;
}

.message-status{
font-size:12px;
line-height:1;
font-weight:bold;
letter-spacing:-3px;
direction:ltr;
display:inline-block;
min-width:16px;
}

.message-status.sent{
opacity:.65;
}

.message-status.read{
color:#006dff;
opacity:1;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:10px;
display:flex;
gap:8px;
background:#050807;
z-index:50;
}

#messageInput{
flex:1;
min-width:0;
padding:14px;
border-radius:17px;
border:1px solid #27332f;
background:#111916;
color:white;
outline:none;
font-size:15px;
}

#messageInput:focus{
border-color:#00e889;
}

#voiceButton,
#sendButton{
width:50px;
height:50px;
border:0;
border-radius:16px;
font-size:22px;
cursor:pointer;
flex-shrink:0;
}

#voiceButton{
background:#18231f;
color:white;
}

#voiceButton.recording{
background:#d83b3b;
}

#sendButton{
background:#00e889;
color:#00150e;
}

#sendButton:disabled{
opacity:.6;
}

.message-menu{
position:absolute;
left:50%;
bottom:calc(100% + 8px);
transform:translateX(-50%);

padding:5px;
background:#0b1512;
border:1px solid rgba(0,232,137,.18);
border-radius:15px;
box-shadow:0 8px 25px rgba(0,0,0,.55);
z-index:99999;
}

.message-menu button{
width:100%;
padding:10px 14px;
border:0;
border-radius:11px;
background:#18231f;
color:white;
font-size:13px;
font-weight:bold;
cursor:pointer;

audio{
max-width:100%;
}

.call-message{

max-width:310px;

align-items:center;
gap:11px;

.call-icon{

height:46px;
border-radius:15px;

align-items:center;
justify-content:center;

color:#00e889;
font-size:22px;
flex-shrink:0;
}

.call-info{

.call-title{
font-size:14px;

.call-subtitle{

}

.call-duration{
font-size:11px;
margin-top:4px;

}

#callOverlay{
position:fixed;
inset:0;
background:#020504;
z-index:100000;
display:none;
flex-direction:column;
overflow:hidden;
}

.call-top{
position:absolute;
top:0;
left:0;
right:0;
height:95px;
padding:22px 18px;
display:flex;
align-items:center;
justify-content:center;
z-index:20;

180deg,
rgba(0,0,0,.7),
transparent

.call-top-info{

}

#callName{

font-weight:bold;

}

#callState{

#audioCallView{

#audioCallAvatar{

height:120px;

align-items:center;
justify-content:center;
overflow:hidden;
font-size:50px;

}

#audioCallAvatar img{
width:100%;
height:100%;
object-fit:cover;
}

#videoArea{
position:absolute;
inset:0;
display:none;
background:#000;
overflow:hidden;
}

#remoteVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
z-index:3;

}

#remoteAvatar{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#07110f;
z-index:2;
}

#remoteAvatar img{
width:150px;
height:150px;
border-radius:40px;
object-fit:cover;
}

#remoteAvatarEmoji{
font-size:70px;
}

#localVideo{
position:absolute;
width:115px;
height:160px;
left:16px;
top:105px;
object-fit:cover;
border-radius:18px;
border:2px solid rgba(255,255,255,.7);
background:#111;
z-index:7;
box-shadow:0 8px 25px rgba(0,0,0,.6);
transition:all .3s ease;
cursor:pointer;
}

#videoArea.swapped #remoteVideo{
position:absolute;
width:115px;
height:160px;
left:16px;
top:105px;
right:auto;
bottom:auto;
border-radius:18px;
z-index:7;
box-shadow:0 8px 25px rgba(0,0,0,.6);
}

#videoArea.swapped #localVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
left:0;
top:0;
border:0;
border-radius:0;
z-index:3;
box-shadow:none;
}

#localAvatar{
position:absolute;
left:16px;
top:105px;
width:115px;
height:160px;
border-radius:18px;
background:#12352c;
z-index:6;
display:none;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:40px;
cursor:pointer;
transition:.3s;
}

#localAvatar img{
width:100%;
height:100%;
object-fit:cover;
}

#videoArea.swapped #localAvatar{
inset:0;
width:100%;
height:100%;
left:0;
top:0;
border-radius:0;
z-index:3;
}

.call-controls{
position:absolute;
left:0;
right:0;
bottom:0;
min-height:115px;
padding:15px 15px calc(15px + env(safe-area-inset-bottom));
display:flex;
align-items:center;
justify-content:center;
gap:12px;
z-index:30;
background:linear-gradient(
0deg,
rgba(0,0,0,.85),
transparent
);
}

.call-control{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:rgba(35,45,42,.95);
color:white;
font-size:23px;
cursor:pointer;
box-shadow:0 5px 18px rgba(0,0,0,.35);
}

.call-control:active{
transform:scale(.92);
}

.call-control.accept{
background:#00e889;
color:#00150e;
}

.call-control.reject,
.call-control.end{
background:#d83b3b;
color:white;
}

.call-control.active{
background:#00e889;
color:#00150e;
}

#incomingInfo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:none;
flex-direction:column;
align-items:center;
text-align:center;
z-index:15;
}

#incomingAvatar{
width:110px;
height:110px;
border-radius:32px;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:45px;
margin-bottom:18px;
}

#incomingAvatar img{
width:100%;
height:100%;
object-fit:cover;
}

#incomingText{
font-size:15px;
color:#ddd;
}

.call-dark{
position:absolute;
inset:0;
pointer-events:none;
background:linear-gradient(
180deg,
rgba(0,0,0,.2),
transparent 30%,
transparent 65%,
rgba(0,0,0,.4)
);
z-index:10;
}

.hidden{
display:none !important;
}

@media(max-width:500px){

.message{
max-width:84%;
}

header{
padding:12px;
}

.call-buttons button{
width:40px;
height:40px;
}

.call-message{
min-width:225px;
max-width:85%;
}

#localVideo,
#localAvatar{
width:100px;
height:140px;
left:12px;
top:90px;
}

#videoArea.swapped #remoteVideo{
width:100px;
height:140px;
left:12px;
top:90px;
}

}

</style>
</head>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,

addDoc,

orderBy,

serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);

window.chatDB = db;


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
document.getElementById(id);

const loading = $("loading");
const app = $("app");
const messages = $("messages");
const messageInput = $("messageInput");
const sendButton = $("sendButton");
const voiceButton = $("voiceButton");

const friendName = $("friendName");
const friendAvatar = $("friendAvatar");
const friendStatus = $("friendStatus");
const backButton = $("backButton");

const callButton = $("callButton");
const videoButton = $("videoButton");

const callOverlay = $("callOverlay");
const callName = $("callName");
const callState = $("callState");

const audioCallView = $("audioCallView");
const audioCallAvatar = $("audioCallAvatar");

const videoArea = $("videoArea");
const remoteVideo = $("remoteVideo");
const localVideo = $("localVideo");

const remoteAvatar = $("remoteAvatar");
const localAvatar = $("localAvatar");

const incomingInfo = $("incomingInfo");
const incomingAvatar = $("incomingAvatar");
const incomingText = $("incomingText");

const muteButton = $("muteButton");
const speakerButton = $("speakerButton");
const flipCameraButton = $("flipCameraButton");

const acceptCallButton = $("acceptCallButton");
const rejectCallButton = $("rejectCallButton");
const endCallButton = $("endCallButton");


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let friendUser = null;
let chatID = null;

let unsubscribeMessages = null;
let unsubscribeFriendStatus = null;
let unsubscribeFriendActivity = null;
let unsubscribeIncomingCalls = null;

let unsubscribeActiveCall = null;
let unsubscribeCallerCandidates = null;
let unsubscribeReceiverCandidates = null;

let presenceInterval = null;
let typingTimer = null;
let typingState = false;
let voiceRecording = false;

let localStream = null;
let peerConnection = null;

let activeCallId = null;
let activeCallType = null;
let activeCallRole = null;
let activeCallPeer = null;

let callSeconds = 0;
let callTimer = null;
let callTimeout = null;

let remoteAudioMuted = false;
let cameraFacing = "user";

let callMessageSaved = false;

/*
   مهم:
   ICE الذي يصل قبل RemoteDescription
   يتم وضعه هنا.
*/

let pendingIceCandidates = [];


/* =========================================================
   RTC
========================================================= */

const rtcConfig = {

iceServers:[

{
urls:"stun:stun.l.google.com:19302"
},

{
urls:"stun:stun1.l.google.com:19302"
}

]

};


/* =========================================================
   HELPERS
========================================================= */

function createChatID(a,b){

return [a,b]
.sort()
.join("_");

}


function escapeHtml(value){

return String(value)
.replace(
/[&<>'"]/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);

}


function showApp(){

loading.style.display = "none";
app.style.display = "flex";

}


function showError(error){

console.error(error);

loading.innerHTML =

`<div
style="
text-align:center;
padding:20px;">

⚠️ تعذر فتح الدردشة

<br>

<small style="color:#777">

${escapeHtml(
error?.message || "حدث خطأ"
)}

</small>

</div>`;

}


function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

return timestamp
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


function formatDuration(seconds){

seconds =
Math.max(
0,
Math.floor(
Number(seconds || 0)
)
);

const m =
Math.floor(seconds / 60);

const s =
seconds % 60;

return (
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0")
);

}


/* =========================================================
   PRESENCE
========================================================= */

async function updateMyPresence(online=true){

if(!currentUser)
return;

try{

await setDoc(

doc(
db,
"users",
currentUser.uid
),

{
online,
lastSeen:serverTimestamp()
},

{
merge:true
}

);

}catch(error){

console.error(
"Presence:",
error
);

}

}


function startPresence(){

updateMyPresence(true);

clearInterval(
presenceInterval
);

presenceInterval =
setInterval(
()=>{

if(
document.visibilityState ===
"visible"
){

updateMyPresence(true);

}

},
10000
);

}


function stopPresence(){

clearInterval(
presenceInterval
);

presenceInterval = null;

updateMyPresence(false);

}


/* =========================================================
   FRIEND
========================================================= */

async function loadFriend(){

const id =
new URLSearchParams(
location.search
).get("friend");

if(!id){

throw new Error(
"لا يوجد صديق في الرابط"
);

}

const userDoc =
await getDoc(
doc(db,"users",id)
);

if(!userDoc.exists()){

throw new Error(
"المستخدم غير موجود"
);

}

const data =
userDoc.data();

friendUser = {

uid:id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
""

};

friendName.textContent =
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);

chatID =
createChatID(
currentUser.uid,
friendUser.uid
);

window.chatID = chatID;
window.chatUser = currentUser;
window.chatFriend = friendUser;

await setDoc(

doc(
db,
"chats",
chatID
),

{
members:[
currentUser.uid,
friendUser.uid
],
createdAt:serverTimestamp()
},

{
merge:true
}

);

listenFriendStatus();
listenFriendActivity();

}


/* =========================================================
   AVATAR
========================================================= */

function setUserAvatar(element,user){

if(user?.photo){

element.innerHTML =

`<img
src="${escapeHtml(user.photo)}"
alt="">`;

}else{

element.innerHTML = "👤";

}

}


/* =========================================================
   FRIEND STATUS
========================================================= */

function listenFriendStatus(){

if(!friendUser)
return;

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

unsubscribeFriendStatus =
onSnapshot(

doc(
db,
"users",
friendUser.uid
),

snap=>{

if(!snap.exists()){

friendStatus.textContent =
"● غير متصل";

return;

}

const data =
snap.data();

const last =
data.lastSeen?.toMillis?.() || 0;

const online =
data.online === true &&
last > 0 &&
Date.now() - last < 30000;

if(
!friendStatus.classList
.contains("typing")
){

friendStatus.textContent =
online
? "● متصل"
: "● غير متصل";

}

friendStatus.classList.toggle(
"online",
online
);

}

);

}


/* =========================================================
   FRIEND ACTIVITY
========================================================= */

function listenFriendActivity(){

if(!friendUser || !chatID)
return;

if(unsubscribeFriendActivity)
unsubscribeFriendActivity();

unsubscribeFriendActivity =
onSnapshot(

doc(
db,
"chats",
chatID,
"typing",
friendUser.uid
),

snap=>{

if(!snap.exists())
return;

/* =========================================================
   RENDER
========================================================= */

function renderMessages(snap){

if(!renderMessages.elements)
renderMessages.elements =
new Map();

const elements =
renderMessages.elements;

const nearBottom =
messages.scrollHeight -
messages.scrollTop -
messages.clientHeight <
120;

snap.docChanges()
.forEach(
change=>{

const id =
change.doc.id;

const data =
change.doc.data();

if(
change.type === "added" ||
change.type === "modified"
){

if(
data.senderId !==
currentUser.uid
){

markRead(
id,
data
);

}

}

if(change.type === "removed"){

const old =
elements.get(id);

if(old){

old.remove();
elements.delete(id);

}

return;

}

if(
Array.isArray(data.deletedFor) &&
data.deletedFor.includes(
currentUser.uid
)
){

const old =
elements.get(id);

if(old){

old.remove();
elements.delete(id);

}

return;

}

const box =
document.createElement("div");

box.className =
"message " +
(
data.senderId ===
currentUser.uid
? "mine"
: "other"
);

if(data.type === "call"){

createCallMessage(
box,
data
);

}

else if(data.type === "voice"){

const audio =
document.createElement("audio");

audio.controls = true;
audio.preload = "metadata";
audio.src = data.audio || "";

box.appendChild(audio);

}

else{

box.appendChild(
document.createTextNode(
data.text || ""
)
);

}

const meta =
document.createElement("span");

meta.className =
"message-meta";

const time =
document.createElement("span");

time.className =
"time";

time.textContent =
formatTime(
data.createdAt
);

meta.appendChild(time);

const status =
createStatus(data);

if(status)
meta.appendChild(status);

box.appendChild(meta);

if(data.type !== "call"){

addMessageActions(
box,
id,
data.senderId ===
currentUser.uid
);

}

const old =
elements.get(id);

if(old){

old.replaceWith(box);

}else{

messages.appendChild(box);

}

elements.set(id,box);

}
);

const all =
messages.querySelectorAll(
".message"
);

let empty =
messages.querySelector(".empty");

if(all.length === 0){

if(!empty){

empty =
document.createElement("div");

empty.className =
"empty";

empty.innerHTML =
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(empty);

}

}else{

empty?.remove();

}

if(nearBottom){

requestAnimationFrame(
()=>{

messages.scrollTop =
messages.scrollHeight;

}
);

}

}

/* =========================================================
   ICE QUEUE
========================================================= */

async function addCandidateSafely(
candidate
){

if(
!peerConnection ||
!candidate
)
return;

if(
peerConnection.remoteDescription
){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(error){

console.error(
"ICE add:",
error
);

}

}else{

pendingIceCandidates.push(candidate);

}

}


async function flushPendingIce(){

if(
!peerConnection ||
!peerConnection.remoteDescription
)
return;

const list =
pendingIceCandidates.splice(
0
);

for(
const candidate
of list
){

try{

await peerConnection.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(error){

console.error(
"ICE queued:",
error
);

}

}

}

function createPeer(){

const pc =
new RTCPeerConnection(
rtcConfig
);

pc.onicecandidate =
async event=>{

if(
!event.candidate ||
!activeCallId ||
!currentUser
)
return;

try{

await addDoc(

collection(
db,
"calls",
activeCallId,
"candidates"
),

{
senderId:
currentUser.uid,

candidate:
event.candidate.toJSON()
}

);

}catch(error){

console.error(
"ICE:",
error
);

}

};


pc.ontrack =
event=>{

if(
event.streams &&
event.streams[0]
){

remoteVideo.srcObject =
event.streams[0];

remoteVideo.style.display =
"block";

remoteAvatar.style.display =
"none";

remoteVideo
.play()
.catch(
()=>{}
);

}

};


pc.onconnectionstatechange =
()=>{

const state =
pc.connectionState;

console.log(
"RTC:",
state
);

if(state === "connected"){

stopOutgoingTimeout();

callState.textContent =
"متصل • " +
formatDuration(
callSeconds
);

showConnectedButtons();

startCallTimer();

}

if(state === "connecting"){

callState.textContent =
"جارٍ الاتصال...";

}

if(state === "failed"){

callState.textContent =
"تعذر الاتصال";

}

if(state === "disconnected"){

callState.textContent =
"انقطع الاتصال";

}

};

return pc;

}

========================================================= */

async function startCall(type){

if(activeCallId)
return;

if(
!currentUser ||
!friendUser
){

alert(
"تعذر بدء المكالمة"
);

return;

}

activeCallId =
crypto.randomUUID();

activeCallType =
type;

activeCallRole =
"caller";

activeCallPeer = {

uid:
friendUser.uid,

name:
friendUser.name,

photo:
friendUser.photo

};

callMessageSaved = false;
callSeconds = 0;
pendingIceCandidates = [];

showCallOverlay();

callState.textContent =
"جارٍ الاتصال...";

showOutgoingButtons();

incomingInfo.style.display =
"none";

try{

/*
   أولاً نفتح الميكروفون/الكاميرا.
*/

localStream =
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:
type === "video"

});


if(type === "video"){

cameraFacing = "user";

localVideo.srcObject =
localStream;

localVideo.style.display =
"block";

localAvatar.style.display =
"none";

remoteVideo.style.display =
"block";

remoteAvatar.style.display =
"flex";

videoArea.classList.remove(
"swapped"
);

}


/*
   إنشاء Peer.
*/

peerConnection =
createPeer();


localStream
.getTracks()
.forEach(
track=>{

peerConnection.addTrack(
track,
localStream
);

}
);


/*
   الإصلاح المهم:
   إنشاء Offer أولاً.
*/

const offer =
await peerConnection
.createOffer();


await peerConnection
.setLocalDescription(
offer
);


/*
   الآن فقط ننشئ مستند المكالمة.
   المستلم سيجد offer جاهزًا.
*/

await setDoc(

doc(
db,
"calls",
activeCallId
),

{

callerId:
currentUser.uid,

receiverId:
friendUser.uid,

callType:
type,

status:
"ringing",

offer:{
type:
offer.type,

sdp:
offer.sdp
},

createdAt:
serverTimestamp(),

receivedAt:null

}

);


/*
   بعد وجود المكالمة نراقب الرد.
*/

listenActiveCallAsCaller();

startOutgoingTimeout();

}catch(error){

console.error(
"Start call:",
error
);

alert(
"تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await cancelOutgoingCall();

}

}


/* =========================================================
   CALLER LISTENER
========================================================= */

function listenActiveCallAsCaller(){

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall =
onSnapshot(

doc(
db,
"calls",
activeCallId
),

async snap=>{

if(!snap.exists()){

cleanupCall();

return;

}

const data =
snap.data();

if(
data.receivedAt &&
data.status ===
"ringing"
){

callState.textContent =
"يرن";

}


if(
data.answer &&
peerConnection &&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection
.setRemoteDescription(

new RTCSessionDescription(
data.answer
)

);

await flushPendingIce();

}catch(error){

console.error(
"Answer:",
error
);

}

}


if(data.status === "connected"){

stopOutgoingTimeout();

showConnectedButtons();

callState.textContent =
"متصل • " +
formatDuration(
callSeconds
);

startCallTimer();

}


if(
data.status === "ended" ||
data.status === "rejected" ||
data.status === "missed" ||
data.status === "cancelled"
){

if(
typeof data.duration ===
"number"
){

callSeconds =
data.duration;

}

cleanupCall();

}

}
);


/*
   مستمع ICE للمتصل.
*/

if(unsubscribeCallerCandidates)
unsubscribeCallerCandidates();

unsubscribeCallerCandidates =
onSnapshot(

collection(
db,
"calls",
activeCallId,
"candidates"
),

snap=>{

snap.docChanges()
.forEach(
change=>{

if(
change.type !== "added"
)
return;

const data =
change.doc.data();

if(
data.senderId ===
currentUser.uid
)
return;

addCandidateSafely(
data.candidate
);

}
);

}
);

}

function listenIncomingCalls(){

if(!currentUser)
return;

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

const callsRef =
collection(
db,
"calls"
);

const q =
query(

callsRef,

where(
"receiverId",
"==",
currentUser.uid
)

);

unsubscribeIncomingCalls =
onSnapshot(

q,

async snap=>{

for(
const change
of snap.docChanges()
){

const data =
change.doc.data();

const changedId =
change.doc.id;

if(
data.receiverId !==
currentUser.uid
)
continue;


/*
   لا نعيد فتح المكالمة نفسها.
*/

if(
activeCallId ===
changedId
){

if(
data.status !== "ringing" &&
data.status !== "connected"
){

cleanupCall();

}

continue;

}


if(
change.type !== "added" &&
change.type !== "modified"
)
continue;


if(
data.status !== "ringing"
)
continue;


if(activeCallId)
continue;


/*
   يجب أن يكون Offer موجودًا.
*/

if(!data.offer){

console.log(
"⏳ المكالمة وصلت قبل offer..."
);

continue;

}


const created =
data.createdAt
?.toMillis?.() || 0;

if(
created &&
Date.now() -
created >
30000
){

try{

await updateDoc(

doc(
db,
"calls",
changedId
),

{
status:"missed",
duration:0,
endedAt:
serverTimestamp()
}

);

}catch(error){

console.error(error);

}

continue;

}


const callerDoc =
await getDoc(

doc(
db,
"users",
data.callerId
)

);


let caller = {

uid:
data.callerId,

name:
"مستخدم Mecd",

photo:
""

};


if(callerDoc.exists()){

const callerData =
callerDoc.data();

caller.name =
callerData.name ||
"مستخدم Mecd";

caller.photo =
callerData.photo ||
"";

}


try{

await updateDoc(

doc(
db,
"calls",
changedId
),

{
receivedAt:
serverTimestamp()
}

);

}catch(error){

console.error(
"receivedAt:",
error
);

}


activeCallId =
changedId;

activeCallType =
data.callType ||
"audio";

activeCallRole =
"receiver";

activeCallPeer =
caller;

callSeconds = 0;

callMessageSaved = false;

pendingIceCandidates = [];

showCallOverlay();

callState.textContent =
activeCallType === "video"
? "📹 مكالمة فيديو واردة"
: "📞 مكالمة صوتية واردة";

incomingInfo.style.display =
"flex";

incomingText.textContent =
activeCallType === "video"
? "مكالمة فيديو واردة"
: "مكالمة صوتية واردة";

showIncomingButtons();

listenReceiverCallStatus();

}

},

error=>{

console.error(
"Incoming:",
error
);

}

);

}


/* =========================================================
   RECEIVER CALL STATUS
========================================================= */

function listenReceiverCallStatus(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall =
onSnapshot(

doc(
db,
"calls",
activeCallId
),

snap=>{

if(!snap.exists()){

cleanupCall();

return;

}

const data =
snap.data();

if(
data.status === "cancelled" ||
data.status === "missed" ||
data.status === "rejected"
){

cleanupCall();

return;

}

if(
data.status === "ended"
){

cleanupCall();

}

}

);

}


/* =========================================================
   ACCEPT
========================================================= */

async function acceptIncomingCall(){

if(
!activeCallId ||
!activeCallPeer
)
return;

acceptCallButton.classList.add(
"hidden"
);

rejectCallButton.classList.add(
"hidden"
);

incomingInfo.style.display =
"none";

callState.textContent =
"جارٍ الاتصال...";

try{

const callRef =
doc(
db,
"calls",
activeCallId
);

const snap =
await getDoc(callRef);

if(!snap.exists()){

throw new Error(
"المكالمة غير موجودة"
);

}

const data =
snap.data();

if(
data.status !== "ringing"
){

cleanupCall();

return;

}

if(!data.offer){

throw new Error(
"Offer غير موجود"
);

}


/*
   فتح الأجهزة.
*/

localStream =
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:
activeCallType === "video"

});


if(activeCallType === "video"){

cameraFacing = "user";

localVideo.srcObject =
localStream;

localVideo.style.display =
"block";

localAvatar.style.display =
"none";

remoteVideo.style.display =
"block";

remoteAvatar.style.display =
"flex";

videoArea.classList.remove(
"swapped"
);

}


/*
   إنشاء Peer.
*/

peerConnection =
createPeer();


localStream
.getTracks()
.forEach(
track=>{

peerConnection.addTrack(
track,
localStream
);

}
);


/*
   استقبال Offer.
*/

await peerConnection
.setRemoteDescription(

new RTCSessionDescription(
data.offer
)

);


/*
   أضف ICE الذي وصل مبكرًا.
*/

await flushPendingIce();


/*
   إنشاء Answer.
*/

const answer =
await peerConnection
.createAnswer();


await peerConnection
.setLocalDescription(
answer
);


/*
   تحديث المكالمة.
*/

await updateDoc(

callRef,

{

answer:{
type:
answer.type,

sdp:
answer.sdp
},

status:
"connected"

}

);


callState.textContent =
"متصل • 00:00";

showConnectedButtons();

startCallTimer();

listenReceiverCandidates();

}catch(error){

console.error(
"Accept:",
error
);

alert(
"تعذر قبول المكالمة"
);

await finishCall(
"missed"
);

}

}


/* =========================================================
   RECEIVER ICE
========================================================= */

function listenReceiverCandidates(){

if(unsubscribeReceiverCandidates)
unsubscribeReceiverCandidates();

unsubscribeReceiverCandidates =
onSnapshot(

collection(
db,
"calls",
activeCallId,
"candidates"
),

snap=>{

snap.docChanges()
.forEach(
change=>{

if(
change.type !== "added"
)
return;

const data =
change.doc.data();

if(
data.senderId ===
currentUser.uid
)
return;

addCandidateSafely(
data.candidate
);

}
);

}

);

}


/* =========================================================
   REJECT
========================================================= */

async function rejectIncomingCall(){

if(!activeCallId){

cleanupCall();

return;

}

const id =
activeCallId;

try{

await updateDoc(

doc(
db,
"calls",
id
),

{

status:
"rejected",

duration:0,

endedAt:
serverTimestamp()

}

);

await saveCallMessage(
"missed",
0
);

}catch(error){

console.error(
"Reject:",
error
);

}

cleanupCall();

}


/* =========================================================
   CANCEL
========================================================= */

async function cancelOutgoingCall(){

const id =
activeCallId;

if(!id){

cleanupCall();

return;

}

try{

await updateDoc(

doc(
db,
"calls",
id
),

{

status:
"cancelled",

duration:0,

endedAt:
serverTimestamp()

}

);

await saveCallMessage(
"missed",
0
);

}catch(error){

console.error(
"Cancel:",
error
);

}

cleanupCall();

}


/* =========================================================
   TIMER
========================================================= */

function startCallTimer(){

if(callTimer)
return;

callTimer =
setInterval(
()=>{

callSeconds++;

callState.textContent =
"متصل • " +
formatDuration(
callSeconds
);

},
1000
);

}


function stopCallTimer(){

if(callTimer){

clearInterval(
callTimer
);

}

callTimer = null;

}


/* =========================================================
   SAVE CALL MESSAGE
========================================================= */

async function saveCallMessage(
status,
duration
){

if(
!activeCallId ||
!activeCallPeer
)
return;

if(callMessageSaved)
return;

callMessageSaved = true;

const callerId =
activeCallRole === "caller"
? currentUser.uid
: activeCallPeer.uid;

const receiverId =
activeCallRole === "caller"
? activeCallPeer.uid
: currentUser.uid;

const callChatID =
createChatID(
callerId,
receiverId
);

try{

await setDoc(

doc(
db,
"chats",
callChatID,
"messages",
"call_" +
activeCallId
),

{

type:"call",

callId:
activeCallId,

callType:
activeCallType,

callerId,

receiverId,

callStatus:
status,

duration:
duration || 0,

senderId:
callerId,

read:false,

createdAt:
serverTimestamp()

},

{
merge:true
}

);

}catch(error){

console.error(
"Call message:",
error
);

}

}


/* =========================================================
   FINISH CALL
========================================================= */

async function finishCall(
forcedStatus=null
){

const callId =
activeCallId;

if(!callId){

cleanupCall();

return;

}

stopOutgoingTimeout();

const duration =
callSeconds;

let status =
forcedStatus;

if(!status){

status =
duration > 0
? "completed"
: "missed";

}

try{

await updateDoc(

doc(
db,
"calls",
callId
),

{

status:
status === "completed"
? "ended"
: status,

duration,

endedAt:
serverTimestamp()

}

);

}catch(error){

console.error(
"End call:",
error
);

}

await saveCallMessage(
status,
duration
);

cleanupCall();

}


/* =========================================================
   CLEANUP
========================================================= */

function cleanupCall(){

stopCallTimer();
stopOutgoingTimeout();

if(unsubscribeActiveCall){

unsubscribeActiveCall();

unsubscribeActiveCall =
null;

}

if(unsubscribeCallerCandidates){

unsubscribeCallerCandidates();

unsubscribeCallerCandidates =
null;

}

if(unsubscribeReceiverCandidates){

unsubscribeReceiverCandidates();

unsubscribeReceiverCandidates =
null;

}


if(localStream){

localStream
.getTracks()
.forEach(
track=>{

try{
track.stop();
}catch(e){}

}
);

}

localStream = null;


if(peerConnection){

try{

peerConnection.close();

}catch(e){}

}

peerConnection = null;

pendingIceCandidates = [];


remoteVideo.srcObject = null;
localVideo.srcObject = null;

remoteVideo.style.display =
"block";

remoteAvatar.style.display =
"flex";

localVideo.style.display =
"block";

localAvatar.style.display =
"none";

videoArea.classList.remove(
"swapped"
);


hideAllCallButtons();

incomingInfo.style.display =
"none";

callOverlay.style.display =
"none";


activeCallId = null;
activeCallType = null;
activeCallRole = null;
activeCallPeer = null;

callSeconds = 0;

callMessageSaved = false;

remoteAudioMuted = false;


muteButton.textContent =
"🎤";

speakerButton.textContent =
"🔊";

flipCameraButton.textContent =
"🔄";

muteButton.classList.remove(
"active"
);

speakerButton.classList.remove(
"active"
);

}


/* =========================================================
   MUTE
========================================================= */

muteButton.onclick =
()=>{

if(!localStream)
return;

const track =
localStream
.getAudioTracks()[0];

if(!track)
return;

track.enabled =
!track.enabled;

muteButton.textContent =
track.enabled
? "🎤"
: "🔇";

muteButton.classList.toggle(
"active",
!track.enabled
);

};


/* =========================================================
   REMOTE AUDIO
========================================================= */

speakerButton.onclick =
()=>{

remoteAudioMuted =
!remoteAudioMuted;

remoteVideo.muted =
remoteAudioMuted;

speakerButton.textContent =
remoteAudioMuted
? "🔇"
: "🔊";

speakerButton.classList.toggle(
"active",
remoteAudioMuted
);

};


/* =========================================================
   FLIP CAMERA
========================================================= */

async function flipCamera(){

if(
!localStream ||
activeCallType !== "video"
)
return;

try{

const oldTrack =
localStream
.getVideoTracks()[0];

if(!oldTrack)
return;

cameraFacing =
cameraFacing === "user"
? "environment"
: "user";

const newStream =
await navigator.mediaDevices
.getUserMedia({

audio:false,

video:{
facingMode:{
ideal:
cameraFacing
}
}

});

const newTrack =
newStream
.getVideoTracks()[0];

const sender =
peerConnection
?.getSenders()
.find(
s=>
s.track?.kind === "video"
);

if(sender){

await sender.replaceTrack(
newTrack
);

}

oldTrack.stop();

localStream.removeTrack(
oldTrack
);

localStream.addTrack(
newTrack
);

localVideo.srcObject =
localStream;

}catch(error){

console.error(
"Flip:",
error
);

}

}


flipCameraButton.onclick =
flipCamera;


/* =========================================================
   VIDEO SWAP
========================================================= */

function toggleVideo(){

if(
activeCallType !== "video"
)
return;

videoArea.classList.toggle(
"swapped"
);

}


localVideo.addEventListener(
"click",
e=>{

e.stopPropagation();
toggleVideo();

}
);

remoteVideo.addEventListener(
"click",
e=>{

e.stopPropagation();
toggleVideo();

}
);

localAvatar.addEventListener(
"click",
e=>{

e.stopPropagation();
toggleVideo();

}
);

remoteAvatar.addEventListener(
"click",
e=>{

e.stopPropagation();
toggleVideo();

}
);


/* =========================================================
   CALL BUTTONS
========================================================= */

callButton.onclick =
()=>{

console.log(
"📞 بدء مكالمة صوتية"
);

startCall("audio");

};


videoButton.onclick =
()=>{

console.log(
"📹 بدء مكالمة فيديو"
);

startCall("video");

};


acceptCallButton.onclick =
acceptIncomingCall;

rejectCallButton.onclick =
rejectIncomingCall;


/* =========================================================
   END BUTTON
========================================================= */

endCallButton.onclick =
async()=>{

if(
activeCallRole === "caller"
){

let status = null;

if(activeCallId){

try{

const snap =
await getDoc(

doc(
db,
"calls",
activeCallId
)

);

if(snap.exists()){

status =
snap.data().status;

}

}catch(error){

console.error(error);

}

}

if(status === "ringing"){

await cancelOutgoingCall();

return;

}

}

await finishCall();

};


/* =========================================================
   BACK
========================================================= */

backButton.onclick =
async()=>{

await updateMyActivity(
"none"
);

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages =
null;

}

if(unsubscribeFriendStatus){

unsubscribeFriendStatus();

unsubscribeFriendStatus =
null;

}

if(unsubscribeFriendActivity){

unsubscribeFriendActivity();

unsubscribeFriendActivity =
null;

}


if(activeCallId){

if(
activeCallRole === "caller"
){

await cancelOutgoingCall();

}else{

await finishCall();

}

}

stopPresence();

history.back();

};


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
"visibilitychange",
()=>{

if(!currentUser)
return;

if(
document.visibilityState ===
"visible"
){

updateMyPresence(true);

}else{

if(!activeCallId){

updateMyPresence(false);

updateMyActivity(
"none"
);

}

}

}
);


window.addEventListener(
"pagehide",
()=>{

if(currentUser){

updateMyPresence(false);

if(!activeCallId){

updateMyActivity(
"none"
);

}

}

}
);


/* =========================================================
   INIT
========================================================= */

function init(){

onAuthStateChanged(

auth,

async user=>{

if(!user){

loading.innerHTML =
"يجب تسجيل الدخول أولاً";

return;

}

currentUser = user;

window.chatUser = user;

try{

startPresence();

await loadFriend();

listenMessages();

listenIncomingCalls();

connectVoiceJS();

showApp();

}catch(error){

console.error(error);

stopPresence();

showError(error);

}

}

);

}


init();

console.log(
"🔥 Mecd Chat loaded - Calls FIXED v3"
);

</script>
