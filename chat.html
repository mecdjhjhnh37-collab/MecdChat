<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    min-height:100vh;

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    overflow:hidden;
}


/* =====================================================
   APP
===================================================== */

.app{

    height:100vh;

    max-width:650px;

    margin:auto;

    display:flex;

    flex-direction:column;

}


header{

    height:75px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px 15px;

    background:#050807;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    flex-shrink:0;

}


.back{

    width:45px;
    height:45px;

    border:0;

    border-radius:15px;

    background:#18231f;

    color:white;

    font-size:22px;

    cursor:pointer;

}


.avatar{

    width:48px;
    height:48px;

    border-radius:16px;

    background:#12352c;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:24px;

    flex-shrink:0;

}


.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}


.user-info{

    flex:1;

    min-width:0;

}


.user-name{

    font-size:17px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.user-status{

    font-size:12px;

    color:#777;

    margin-top:5px;

}


.user-status.online{

    color:#00e889;

}


.user-status.typing{

    color:#00e889;

    font-weight:bold;

}


.call-buttons{

    display:flex;

    gap:8px;

    flex-shrink:0;

}


.call-buttons button{

    width:42px;
    height:42px;

    border:0;

    border-radius:14px;

    background:#18231f;

    color:white;

    font-size:18px;

    cursor:pointer;

}


.call-buttons button:active{

    transform:scale(.94);

}


/* =====================================================
   MESSAGES
===================================================== */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        20px
        15px
        150px;

    display:flex;

    flex-direction:column;

    gap:10px;

}


.empty{

    margin:auto;

    text-align:center;

    color:#72817c;

}


.message{

    max-width:78%;

    padding:12px 15px;

    border-radius:18px;

    position:relative;

    word-break:break-word;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

}


.message.mine{

    align-self:flex-start;

    background:#00c96b;

    color:#00150e;

    border-bottom-left-radius:5px;

}


.message.other{

    align-self:flex-end;

    background:#18231f;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-right-radius:5px;

}


.time{

    display:inline-block;

    font-size:9px;

    opacity:.6;

    margin-top:5px;

}


.message-meta{

    display:flex;

    align-items:center;

    justify-content:flex-start;

    gap:5px;

    margin-top:5px;

}


.message-status{

    font-size:12px;

    line-height:1;

    font-weight:bold;

    letter-spacing:-3px;

    direction:ltr;

    display:inline-block;

    min-width:16px;

}


.message-status.sent{

    opacity:.65;

}


.message-status.read{

    color:#006dff;

    opacity:1;

}


/* =====================================================
   INPUT
===================================================== */

.input-area{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:650px;

    padding:10px;

    display:flex;

    gap:8px;

    background:#050807;

    z-index:50;

}


#messageInput{

    flex:1;

    min-width:0;

    padding:14px;

    border-radius:17px;

    border:
        1px solid
        #27332f;

    background:#111916;

    color:white;

    outline:none;

    font-size:15px;

}


#messageInput:focus{

    border-color:#00e889;

}


#voiceButton,
#sendButton{

    width:50px;

    height:50px;

    border:0;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;

    flex-shrink:0;

}


#voiceButton{

    background:#18231f;

    color:white;

}


#voiceButton.recording{

    background:#d83b3b;

}


#sendButton{

    background:#00e889;

    color:#00150e;

}


#sendButton:disabled{

    opacity:.6;

}


/* =====================================================
   MESSAGE MENU
===================================================== */

.message-menu{

    position:absolute;

    left:50%;

    bottom:calc(100% + 8px);

    transform:translateX(-50%);

    min-width:150px;

    padding:5px;

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    border-radius:15px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.55);

    z-index:99999;

}


.message-menu button{

    width:100%;

    padding:10px 14px;

    border:0;

    border-radius:11px;

    background:#18231f;

    color:white;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   CALL MESSAGE
===================================================== */

.call-message{

    min-width:245px;

    max-width:310px;

    padding:10px 12px !important;

}


.call-box{

    display:flex;

    align-items:center;

    gap:11px;

}


.call-icon{

    width:46px;
    height:46px;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,232,137,.14);

    color:#00e889;

    font-size:22px;

    flex-shrink:0;

}


.call-info{

    min-width:0;

    flex:1;

}


.call-title{

    font-size:14px;

    font-weight:bold;

}


.call-subtitle{

    font-size:11px;

    opacity:.65;

    margin-top:4px;

}


.call-duration{

    font-size:11px;

    margin-top:4px;

    opacity:.75;

}


audio{

    max-width:100%;

}


/* =====================================================
   CALL OVERLAY
===================================================== */

#callOverlay{

    position:fixed;

    inset:0;

    background:#020504;

    z-index:100000;

    display:none;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:0;

}


.call-screen{

    position:relative;

    width:100%;

    height:100%;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #123d35,
            #020504 65%

}


.call-header{

    position:absolute;

    top:0;

    left:0;

    right:0;

    z-index:20;

    padding:
        25px
        20px
        15px;

    text-align:center;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.65),
            transparent

}


#callName{

    font-size:21px;

    font-weight:bold;

}


#callState{

    color:#00e889;

    font-size:13px;

    margin-top:8px;

}


/* =====================================================
   AUDIO CALL AVATAR
===================================================== */

.audio-call-view{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

}


.call-avatar{

    width:130px;
    height:130px;

    border-radius:38px;

    background:#12352c;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:55px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.5);

}


.call-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}


/* =====================================================
   VIDEO
===================================================== */

#videoArea{

    position:absolute;

    inset:0;

    display:none;

    background:#000;

}


#remoteVideo{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    object-fit:cover;

    background:#000;

    transition:
        all .25s ease;

    z-index:1;

}


#localVideo{

    position:absolute;

    width:120px;

    height:170px;

    left:18px;

    top:25px;

    object-fit:cover;

    border-radius:18px;

    border:
        2px solid
        rgba(255,255,255,.7);

    background:#111;

    z-index:5;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.5);

    cursor:pointer;

    transition:
        all .3s ease;

}


/* وضع الصورة الصغيرة */

#videoArea.local-small
#localVideo{

    width:120px;
    height:170px;

    left:18px;
    top:25px;

    z-index:5;

}


/* وضع الصورة الكبيرة */

#videoArea.local-large
#localVideo{

    inset:0;

    width:100%;
    height:100%;

    border:0;

    border-radius:0;

    z-index:10;

}


/* الطرف الآخر يصبح صغيرًا */

#videoArea.local-large
#remoteVideo{

    width:120px;
    height:170px;

    left:18px;
    top:25px;

    right:auto;
    bottom:auto;

    border-radius:18px;

    z-index:5;

}


/* الضغط على الطرف الآخر يعيد الوضع */

#remoteVideo{

    cursor:pointer;

}


/* =====================================================
   CALL CONTROLS
===================================================== */

.call-controls{

    position:absolute;

    bottom:0;

    left:0;

    right:0;

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    padding:
        25px
        20px
        35px;

    background:
        linear-gradient(
            0deg,
            rgba(0,0,0,.75),
            transparent
        );

}


.call-control{

    width:62px;
    height:62px;

    border:0;

    border-radius:50%;

    background:
        rgba(30,40,37,.92);

    color:white;

    font-size:24px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

    transition:.15s;

}


.call-control:active{

    transform:scale(.90);

}


.call-control.end{

    width:68px;
    height:68px;

    background:#e53935;

    transform:rotate(135deg);

}


.call-control.accept{

    background:#00c96b;

    color:#00150e;

}


.call-control.reject{

    background:#e53935;

}


/* =====================================================
   INCOMING
===================================================== */

#incomingLabel{

    display:none;

    position:absolute;

    top:70px;

    left:0;

    right:0;

    text-align:center;

    color:#fff;

    font-size:14px;

    z-index:25;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:500px){

    .message{

        max-width:84%;

    }

    header{

        padding:12px;

    }

    .call-buttons button{

        width:40px;
        height:40px;

    }

    .call-message{

        min-width:225px;

        max-width:85%;

    }

    #localVideo,
    #videoArea.local-small #localVideo,
    #videoArea.local-large #remoteVideo{

        width:105px;

        height:145px;

        left:14px;

        top:20px;

        border-radius:16px;

    }

    .call-control{

        width:58px;
        height:58px;

    }

    .call-control.end{

        width:64px;
        height:64px;

    }

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

    display:none !important;

}

</style>

</head>

<script type="module">

/* =====================================================
   BASIC
===================================================== */

function createChatID(a,b){

    return [
        a,
        b
    ]
    .sort()
    .join("_");

}


function escapeHtml(value){

    return String(value)
        .replace(
            /[&<>'"]/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"
            }[c])
        );

}


function showApp(){

    loading.style.display =
        "none";

    app.style.display =
        "flex";

}


function showError(error){

    console.error(error);

    loading.innerHTML =

        `<div
        style="
        text-align:center;
        padding:20px;
        ">

        ⚠️ تعذر فتح الدردشة

        <br>

        <small
        style="color:#777">

        ${escapeHtml(
            error?.message ||
            "حدث خطأ"
        )}

        </small>

        </div>`;

}


/* =====================================================
   PRESENCE
===================================================== */

async function updateMyPresence(
    online = true
){

    if(!currentUser)
        return;

    try{

        await setDoc(

            doc(
                db,
                "users",
                currentUser.uid
            ),

            {
                online,

                lastSeen:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Presence:",
            error
        );

    }

}


function startPresence(){

    updateMyPresence(
        true
    );

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        setInterval(
            () => {

                if(
                    document.visibilityState ===
                    "visible"
                ){

                    updateMyPresence(
                        true
                    );

                }

            },
            10000
        );

}


function stopPresence(){

    clearInterval(
        presenceInterval
    );

    presenceInterval =
        null;

    updateMyPresence(
        false
    );

}


/* =====================================================
   FRIEND
===================================================== */

async function loadFriend(){

    const id =
        new URLSearchParams(
            location.search
        ).get("friend");


    if(!id){

        throw new Error(
            "لا يوجد صديق في الرابط"
        );

    }


    const userDoc =
        await getDoc(

            doc(
                db,
                "users",
                id
            )

        );


    if(!userDoc.exists()){

        throw new Error(
            "المستخدم غير موجود"
        );

    }


    const data =
        userDoc.data();


    friendUser = {

        uid:id,

        name:
            data.name ||
            "مستخدم Mecd",

        photo:
            data.photo ||
            ""

    };


    friendName.textContent =
        friendUser.name;


    callName.textContent =
        friendUser.name;


    if(friendUser.photo){

        const image =
            document.createElement(
                "img"
            );

        image.src =
            friendUser.photo;

        image.alt =
            friendUser.name;

        friendAvatar.innerHTML =
            "";

        friendAvatar.appendChild(
            image
        );


        const callImage =
            document.createElement(
                "img"
            );

        callImage.src =
            friendUser.photo;

        callImage.alt =
            friendUser.name;

        callAvatar.innerHTML =
            "";

        callAvatar.appendChild(
            callImage
        );

    }


    chatID =
        createChatID(
            currentUser.uid,
            friendUser.uid
        );


    window.chatDB =
        db;

    window.chatUser =
        currentUser;

    window.chatFriend =
        friendUser;

    window.chatID =
        chatID;


    await setDoc(

        doc(
            db,
            "chats",
            chatID
        ),

        {
            members:[
                currentUser.uid,
                friendUser.uid
            ],

            createdAt:
                serverTimestamp()

        },

        {
            merge:true
        }

    );


    listenFriendStatus();

    listenFriendTyping();

}


/* =====================================================
   FRIEND STATUS
===================================================== */

function listenFriendStatus(){

    if(!friendUser)
        return;


    if(unsubscribeFriendStatus)
        unsubscribeFriendStatus();


    unsubscribeFriendStatus =
        onSnapshot(

            doc(
                db,
                "users",
                friendUser.uid
            ),

            snap => {

                if(!snap.exists()){

                    friendStatus.textContent =
                        "● غير متصل";

                    return;

                }


                const data =
                    snap.data();


                const last =
                    data.lastSeen
                    ?.toMillis?.() || 0;


                const online =
                    data.online === true &&
                    last > 0 &&
                    Date.now() -
                    last <
                    30000;


                if(
                    !friendStatus.classList
                        .contains(
                            "typing"
                        )
                ){

                    friendStatus.textContent =
                        online
                        ? "● متصل"
                        : "● غير متصل";

                }


                friendStatus.classList.toggle(
                    "online",
                    online
                );

            }

        );

}

function listenFriendTyping(){

    if(!friendUser)

    if(unsubscribeFriendTyping)

    unsubscribeFriendTyping =
        onSnapshot(

            doc(

            ),

/* =====================================================
   TIME
===================================================== */

function formatTime(
    timestamp
){

    if(!timestamp?.toDate)
        return "";

    return timestamp
        .toDate()
        .toLocaleTimeString(
            "ar",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

}


function formatDuration(
    seconds
){

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(
                    seconds || 0
                )
            )
        );


    const m =
        Math.floor(
            seconds / 60
        );


    const s =
        seconds % 60;


    return (

        String(m)
            .padStart(2,"0")

        + ":"

        +

        String(s)
            .padStart(2,"0")

    );

}

function addMessageActions(
    element,
    id,
    mine
){

    let timer =
        null;


    const cancel =
        () => {

            clearTimeout(
                timer
            );

            timer =
                null;

        };


    element.addEventListener(
        "pointerdown",
        e => {

            if(
                e.target.closest(
                    ".message-menu"
                )
            )
                return;


            cancel();


            timer =
                setTimeout(
                    showMenu,
                    500
                );

        }
    );


    element.addEventListener(
        "pointerup",
        cancel
    );


    element.addEventListener(
        "pointercancel",
        cancel
    );


    element.addEventListener(
        "pointerleave",
        cancel
    );


    element.addEventListener(
        "contextmenu",
        e => {

            e.preventDefault();

            showMenu();

        }
    );


    function showMenu(){

        removeMenus();


        const menu =
            document.createElement(
                "div"
            );


        menu.className =
            "message-menu";


        const button =
            document.createElement(
                "button"
            );

            async e => {

                try{

                    const ref =
                        doc(
                            db,
                            "chats",
                            chatID,
                            "messages",
                            id
                        );


                    if(mine){

                        await deleteDoc(
                            ref
                        );

                    }else{

                        await updateDoc(
                            ref,
                            {
                                deletedFor:
                                    arrayUnion(
                                        currentUser.uid
                                    )
                            }
                        );

                    removeMenus();

                }catch(error){

                    console.error(
                        error
                    );

                    alert(
                        "حدث خطأ أثناء حذف الرسالة"
                    );

                }

            };


        menu.appendChild(
            button
        );


        element.appendChild(
            menu
        );

    }

    document
        .querySelectorAll(
            ".message-menu"
        )

            x =>

}


document.addEventListener(

/* =====================================================
   RENDER MESSAGES
===================================================== */

const messageElements =
    new Map();


function renderMessages(
    snap
){

    const nearBottom =
        messages.scrollHeight -
        messages.scrollTop -
        messages.clientHeight
        < 120;


    snap.docChanges()
        .forEach(
            change => {

                const id =
                    change.doc.id;


                const data =
                    change.doc.data();


                if(
                    change.type ===
                    "removed"
                ){

                    const old =
                        messageElements.get(
                            id
                        );


                    if(old){

                        old.remove();

                        messageElements.delete(
                            id
                        );

                    }

                    return;

                }


                if(
                    Array.isArray(
                        data.deletedFor
                    ) &&
                    data.deletedFor.includes(
                        currentUser.uid
                    )
                ){

                    const old =
                        messageElements.get(
                            id
                        );


                    if(old){

                        old.remove();

                        messageElements.delete(
                            id
                        );

                    }

                    return;

                }


                if(
                    data.senderId !==
                    currentUser.uid
                ){

                    markRead(
                        id,
                        data
                    );

                }


                const box =
                    document.createElement(
                        "div"
                    );


                box.className =
                    "message " +

                    (
                        data.senderId ===
                        currentUser.uid
                        ? "mine"
                        : "other"
                    );


                if(
                    data.type ===
                    "call"
                ){

                    createCallMessage(
                        box,
                        data
                    );

                }

                else if(
                    data.type ===
                    "voice"
                ){

                    const audio =
                        document.createElement(
                            "audio"
                        );


                    audio.controls =
                        true;


                    audio.src =
                        data.audio ||
                        "";


                    box.appendChild(
                        audio
                    );

                }

                else{

                    box.appendChild(
                        document.createTextNode(
                            data.text ||
                            ""
                        )
                    );

                }


                const meta =
                    document.createElement(
                        "span"
                    );


                meta.className =
                    "message-meta";


                const time =
                    document.createElement(
                        "span"
                    );


                time.className =
                    "time";


                time.textContent =
                    formatTime(
                        data.createdAt
                    );


                meta.appendChild(
                    time
                );


                const status =
                    createStatus(
                        data
                    );


                if(status)
                    meta.appendChild(
                        status
                    );


                box.appendChild(
                    meta
                );


                if(
                    data.type !==
                    "call"
                ){

                    addMessageActions(
                        box,
                        id,
                        data.senderId ===
                        currentUser.uid
                    );

                }


                const old =
                    messageElements.get(
                        id
                    );


                if(old){

                    old.replaceWith(
                        box
                    );

                }


                messageElements.set(
                    id,
                    box
                );


                if(!old){

                    messages.appendChild(
                        box
                    );

                }

            }
        );


    const all =
        messages.querySelectorAll(
            ".message"
        );


    let empty =
        messages.querySelector(
            ".empty"
        );


    if(all.length === 0){

        if(!empty){

            empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            empty.innerHTML =
                "💬<br>ابدأ المحادثة الآن";

            messages.appendChild(
                empty
            );

        }

    }else{

        empty?.remove();

    }


    if(nearBottom){

        requestAnimationFrame(
            () => {

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    }

}

/* =====================================================
   PEER
===================================================== */

function createPeer(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    pc.onicecandidate =
        async event => {

            if(
                !event.candidate ||
                !activeCallId
            )
                return;


            try{

                await addDoc(

                    collection(
                        db,
                        "calls",
                        activeCallId,
                        "candidates"
                    ),

                    {

                        senderId:
                            currentUser.uid,

                        candidate:
                            event.candidate
                                .toJSON()

                    }

                );

            }catch(error){

                console.error(
                    "ICE:",
                    error
                );

            }

        };


    pc.ontrack =
        event => {

            if(
                event.streams &&
                event.streams[0]
            ){

                remoteVideo.srcObject =
                    event.streams[0];


                remoteAudioElement =
                    remoteVideo;


                remoteVideo.play()
                    .catch(
                        () => {}
                    );

            }

        };


    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            console.log(
                "RTC:",
                state
            );


            if(
                state ===
                "connected"
            ){

                callState.textContent =
                    "متصل";


                startCallTimer();

            }


            if(
                state ===
                "failed"
            ){

                callState.textContent =
                    "فشل الاتصال";

            }


            if(
                state ===
                "disconnected"
            ){

                callState.textContent =
                    "انقطع الاتصال";

            }

        };


    return pc;

}


/* =====================================================
   ICE LISTENER
===================================================== */

function listenCandidates(){

    if(!activeCallId)
        return;


    onSnapshot(

        collection(
            db,
            "calls",
            activeCallId,
            "candidates"
        ),

        snap => {

            snap.docChanges()
                .forEach(
                    change => {

                        if(
                            change.type !==
                            "added"
                        )
                            return;


                        const data =
                            change.doc.data();


                        if(
                            data.senderId ===
                            currentUser.uid
                        )
                            return;


                        if(
                            peerConnection &&
                            data.candidate
                        ){

                            peerConnection
                                .addIceCandidate(

                                    new RTCIceCandidate(
                                        data.candidate
                                    )

                                )
                                .catch(
                                    error =>
                                        console.error(
                                            "ICE add:",
                                            error
                                        )
                                );

                        }

                    }
                );

        }

    );

}


/* =====================================================
   START CALL
===================================================== */

async function startCall(
    type
){

    if(
        activeCallId ||
        !currentUser ||
        !friendUser
    )
        return;


    activeCallType =
        type;


    activeCallRole =
        "caller";


    activeCallId =
        crypto.randomUUID();


    localMuted =
        false;


    remoteMuted =
        false;


    cameraEnabled =
        true;


    showCallScreen(
        type,
        false
    );


    callState.textContent =
        "جارٍ الاتصال...";


    muteButton.textContent =
        "🎤";


    remoteMuteButton.textContent =
        "🔊";


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        type ===
                        "video"

                });


        if(type === "video"){

            localVideo.srcObject =
                localStream;

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        await setDoc(

            callRef,

            {

                callerId:
                    currentUser.uid,

                receiverId:
                    friendUser.uid,

                callType:
                    type,

                status:
                    "ringing",

                createdAt:
                    serverTimestamp()

            }

        );


        listenCandidates();


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(

            callRef,

            {

                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }

            }

        );


        listenCallerCall();

    }catch(error){

        console.error(
            "Start call:",
            error
        );


        alert(
            "تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
        );


        await finishCall(
            "cancelled"
        );

    }

}


/* =====================================================
   CALLER LISTENER
===================================================== */

function listenCallerCall(){

    if(!activeCallId)
        return;


    onSnapshot(

        doc(
            db,
            "calls",
            activeCallId
        ),

        async snap => {

            if(!snap.exists())
                return;


            const data =
                snap.data();


            if(
                data.answer &&
                peerConnection &&
                !peerConnection.currentRemoteDescription
            ){

                try{

                    await peerConnection
                        .setRemoteDescription(

                            new RTCSessionDescription(
                                data.answer
                            )

                        );


                }catch(error){

                    console.error(
                        "Remote answer:",
                        error
                    );

                }

            }


            if(
                data.status ===
                "connected"
            ){

                callState.textContent =
                    "متصل";

                startCallTimer();

            }


            if(
                data.status ===
                "rejected"
            ){

                callState.textContent =
                    "تم رفض المكالمة";

                setTimeout(
                    () =>
                        cleanupCall(),
                    700
                );

            }


            if(
                data.status ===
                "missed"
            ){

                callState.textContent =
                    "لم يتم الرد على المكالمة";

                setTimeout(
                    () =>
                        cleanupCall(),
                    700
                );

            }


            if(
                data.status ===
                "ended"
            ){

                cleanupCall();

            }

        }

    );

}


/* =====================================================
   INCOMING CALLS
===================================================== */

/*
   الإصلاح المهم هنا:

   لا نراقب كل calls.

   نراقب فقط:
   receiverId == currentUser.uid

   لذلك:
   A -> B

   B يرى الاتصال.

   C لا يرى الاتصال.
*/

function listenIncomingCalls(){

    if(!currentUser)
        return;


    if(incomingCallUnsubscribe)
        incomingCallUnsubscribe();


    const callsRef =
        collection(
            db,
            "calls"
        );


    const q =
        query(

            callsRef,

            where(
                "receiverId",
                "==",
                currentUser.uid
            )

        );


    incomingCallUnsubscribe =
        onSnapshot(

            q,

            snap => {

                snap.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            )
                                return;


                            const data =
                                change.doc.data();


                            if(
                                data.status !==
                                "ringing"
                            )
                                return;


                            if(
                                activeCallId
                            )
                                return;


                            /*
                               حماية إضافية:
                               لا نستقبل مكالمة
                               من نفس المستخدم.
                            */

                            if(
                                data.callerId ===
                                currentUser.uid
                            )
                                return;


                            activeCallId =
                                change.doc.id;


                            activeCallType =
                                data.callType ||
                                "audio";


                            activeCallRole =
                                "receiver";


                            localMuted =
                                false;


                            remoteMuted =
                                false;


                            cameraEnabled =
                                true;


                            showCallScreen(
                                activeCallType,
                                true
                            );


                            callState.textContent =
                                activeCallType ===
                                "video"
                                ? "📹 مكالمة فيديو واردة"
                                : "📞 مكالمة صوتية واردة";

                        }
                    );

            },

            error => {

                console.error(
                    "Incoming calls:",
                    error
                );

            }

        );

}


/* =====================================================
   ACCEPT
===================================================== */

async function acceptIncomingCall(){

    if(
        !activeCallId ||
        !friendUser
    )
        return;


    acceptCallButton.classList.add(
        "hidden"
    );


    try{

        const callRef =
            doc(
                db,
                "calls",
                activeCallId
            );


        const snap =
            await getDoc(
                callRef
            );


        if(!snap.exists()){

            throw new Error(
                "المكالمة غير موجودة"
            );

        }


        const data =
            snap.data();


        if(
            data.receiverId !==
            currentUser.uid
        ){

            throw new Error(
                "هذه المكالمة ليست لك"
            );

        }


        if(
            data.status !==
            "ringing"
        ){

            throw new Error(
                "المكالمة انتهت"
            );

        }


        activeCallType =
            data.callType ||
            "audio";


        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        activeCallType ===
                        "video"

                });


        if(
            activeCallType ===
            "video"
        ){

            localVideo.srcObject =
                localStream;

            videoArea.style.display =
                "block";

        }


        peerConnection =
            createPeer();


        localStream
            .getTracks()
            .forEach(
                track =>
                    peerConnection.addTrack(
                        track,
                        localStream
                    )
            );


        await peerConnection
            .setRemoteDescription(

                new RTCSessionDescription(
                    data.offer
                )

            );


        listenCandidates();


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(

            callRef,

            {

                answer:{

                    type:
                        answer.type,

                    sdp:
                        answer.sdp

                },

                status:
                    "connected",

                connectedAt:
                    serverTimestamp()

            }

        );


        callState.textContent =
            "متصل";


        muteButton.classList.remove(
            "hidden"
        );


        remoteMuteButton.classList.remove(
            "hidden"
        );


        if(
            activeCallType ===
            "video"
        ){

            cameraButton.classList.remove(
                "hidden"
            );

        }


        startCallTimer();

    }catch(error){

        console.error(
            "Accept:",
            error
        );


        alert(
            "تعذر قبول المكالمة"
        );


        await finishCall(
            "rejected"
        );

    }

}


/* =====================================================
   REJECT
===================================================== */

async function rejectIncomingCall(){

    if(
        !activeCallId ||
        activeCallRole !==
        "receiver"
    )
        return;


    try{

        await updateDoc(

            doc(
                db,
                "calls",
                activeCallId
            ),

            {

                status:
                    "rejected",

                endedAt:
                    serverTimestamp(),

                duration:
                    0

            }

        );


        await createCallLog(
            "missed"
        );


    }catch(error){

        console.error(
            "Reject:",
            error
        );

    }


    cleanupCall();

}


/* =====================================================
   CREATE CALL MESSAGE
===================================================== */

async function createCallLog(
    status
){

    if(
        !currentUser ||
        !friendUser ||
        !chatID ||
        !activeCallId
    )
        return;


    /*
       ID ثابت لمنع إنشاء نفس
       رسالة المكالمة أكثر من مرة.
    */

    const messageId =
        "call_" +
        activeCallId;


    try{

        await setDoc(

            doc(
                db,
                "chats",
                chatID,
                "messages",
                messageId
            ),

            {

                type:
                    "call",

                callId:
                    activeCallId,

                callType:
                    activeCallType ||
                    "audio",

                callStatus:
                    status,

                callerId:
                    activeCallRole ===
                    "caller"
                    ? currentUser.uid
                    : friendUser.uid,

                receiverId:
                    activeCallRole ===
                    "caller"
                    ? friendUser.uid
                    : currentUser.uid,

                senderId:
                    currentUser.uid,

                duration:
                    callSeconds || 0,

                read:false,

                createdAt:
                    serverTimestamp()

            },

            {
                merge:true
            }

        );

    }catch(error){

        console.error(
            "Call log:",
            error
        );

    }

}


/* =====================================================
   TIMER
===================================================== */

function startCallTimer(){

    if(callTimer)
        return;


    callSeconds =
        0;


    callTimer =
        setInterval(
            () => {

                callSeconds++;


                callState.textContent =
                    "متصل • " +
                    formatDuration(
                        callSeconds
                    );

            },
            1000
        );

}


function stopCallTimer(){

    clearInterval(
        callTimer
    );

    callTimer =
        null;

}


/* =====================================================
   FINISH CALL
===================================================== */

async function finishCall(
    reason = "ended"
){

    const callId =
        activeCallId;


    const role =
        activeCallRole;


    const duration =
        callSeconds;


    if(callId){

        try{

            const callRef =
                doc(
                    db,
                    "calls",
                    callId
                );


            const snap =
                await getDoc(
                    callRef
                );


            if(snap.exists()){

                const data =
                    snap.data();


                let status =
                    reason;


                if(
                    reason ===
                    "ended"
                ){

                    status =
                        data.status ===
                        "connected"
                        ? "ended"
                        : "missed";

                }


                await updateDoc(

                    callRef,

                    {

                        status,

                        duration,

                        endedAt:
                            serverTimestamp()

                    }

                );


                /*
                   فقط الطرف الذي أنهى المكالمة
                   ينشئ سجل المكالمة.
                */

                if(
                    status ===
                    "missed"
                ){

                    await createCallLog(
                        "missed"
                    );

                }

                else if(
                    status ===
                    "ended"
                ){

                    await createCallLog(
                        "ended"
                    );

                }

            }

        }catch(error){

            console.error(
                "Finish call:",
                error
            );

        }

    }


    cleanupCall();

}


/* =====================================================
   CLEANUP
===================================================== */

function cleanupCall(){

    stopCallTimer();


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    try{

                        track.stop();

                    }catch(e){}

                }
            );

    }


    localStream =
        null;


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(e){}

    }


    peerConnection =
        null;


    remoteVideo.srcObject =
        null;


    localVideo.srcObject =
        null;


    activeCallId =
        null;


    activeCallType =
        null;


    activeCallRole =
        null;


    localMuted =
        false;


    remoteMuted =
        false;


    cameraEnabled =
        true;


    callOverlay.style.display =
        "none";


    videoArea.style.display =
        "none";


    videoArea.classList.remove(
        "local-large"
    );


    videoArea.classList.add(
        "local-small"
    );


    resetCallButtons();


    muteButton.textContent =
        "🎤";


    remoteMuteButton.textContent =
        "🔊";


    cameraButton.textContent =
        "📹";

}

        track.enabled =
            !track.enabled;


        localMuted =
            !track.enabled;


        muteButton.textContent =
            track.enabled
            ? "🎤"
            : "🔇";

    };

===================================================== */

        remoteMuted =
            !remoteMuted;


        remoteVideo.muted =
            remoteMuted;

            remoteMuted
            ? "🔇"
            : "🔊";

    };


/* =====================================================
   CAMERA
===================================================== */

cameraButton.onclick =

        if(!localStream)
            return;


        const track =
            localStream
                .getVideoTracks()[0];

);


remoteVideo.addEventListener(

                )

            );

            );

            videoArea.classList.remove(

            );

            );

        }

    }
);


/* =====================================================
   CALL BUTTONS
===================================================== */

callButton.onclick =
    () => {

        if(activeCallId)
            return;

        startCall(
            "audio"
        );

    };


videoButton.onclick =
    () => {

        if(activeCallId)

    };


acceptCallButton.onclick =

/*
   إذا كان المستلم يضغط إنهاء أثناء الرنين
   = رفض.
   إذا كان الاتصال بدأ
   = إنهاء.
*/

endCallButton.onclick =

        if(
            activeCallRole ===
            "receiver"
        ){

            const callId =
                activeCallId;


            if(callId){

                try{

                    await updateDoc(

                        doc(

                        ),

===================================================== */

    () => {

        if(

            "visible"
        ){

            updateMyPresence(
                true
            );

        }else{

            updateMyPresence(
                false
            );

            updateTyping(
                false
            );

        }

    }
);


/* =====================================================
   INIT
===================================================== */

function init(){

    onAuthStateChanged(

        auth,

        async user => {

            if(!user){

                loading.textContent =
                    "يجب تسجيل الدخول أولاً";

                return;

            }


            currentUser =
                user;


            window.chatUser =
                user;


            try{

                startPresence();


                await loadFriend();


                listenMessages();


                /*
                   هنا يتم إصلاح مشكلة A/B/C:
                   مراقبة المكالمات الموجهة لهذا المستخدم فقط.
                */

                listenIncomingCalls();


                showApp();


                messageInput.blur();

            }catch(error){

                stopPresence();

                showError(
                    error
                );

            }

        }

    );

}


init();
