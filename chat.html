<!DOCTYPE html>

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
overflow:hidden
}

button,
input{
font-family:inherit
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative
}

header{
height:75px;
display:flex;
align-items:center;
gap:12px;
padding:12px 15px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10
}

.back{
width:45px;
height:45px;
border:0;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer
}

.avatar,
.call-avatar{
width:48px;
height:48px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:24px;
flex-shrink:0
}

.avatar img,
.call-avatar img,
.local-avatar img{
width:100%;
height:100%;
object-fit:cover;

}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:17px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:12px;
color:#777;
margin-top:5px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.call-buttons{
display:flex;
gap:8px;
flex-shrink:0
}

.call-buttons button{
width:42px;
height:42px;
border:0;
border-radius:14px;
background:#18231f;
color:#fff;
font-size:18px;
cursor:pointer
}

.pinned-banner{
background:#0b1613;
border-bottom:1px solid rgba(0,232,137,.15);
padding:8px 15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
font-size:12px;
z-index:8;

}

.pinned-banner.show{
display:flex
}

.pinned-banner-content{
flex:1;
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
min-width:0
}

.pinned-banner-text{
color:#00e889;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.pinned-banner-close{

border:0;
color:#aaa;
font-size:14px;
cursor:pointer;

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 15px 150px;
display:flex;
flex-direction:column;
gap:16px;
scroll-behavior:smooth;

.empty{

text-align:center;

}

.message{

padding:10px 13px 26px;
border-radius:18px;
position:relative;

line-height:1.5;
margin-bottom:6px;

-webkit-user-select:none;

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px
}

.message.other{
align-self:flex-end;
background:#18231f;
border:1px solid rgba(255,255,255,.08);

}

.message.highlight{

.heart-pop{

bottom:8px;
right:15px;
transform:scale(0);
font-size:22px;
animation:popEffect .4s ease forwards;
pointer-events:none;
z-index:30;
background:#0b1512;
border-radius:50%;
padding:2px 4px
}

.message.mine .heart-pop{
right:auto;
left:15px
}

@keyframes popEffect{

0%{
transform:scale(0);
opacity:0
}

50%{
transform:scale(1.3);
opacity:1
}

100%{
transform:scale(1);
opacity:1

}

.time{
display:inline-block;
font-size:9px;
opacity:.6
}

.message-meta{
display:inline-flex;
align-items:center;
gap:4px;
position:absolute;
bottom:6px;
left:12px
}

.message.other .message-meta{
left:auto;
right:12px
}

.message-status{
font-size:11px;
font-weight:bold;
direction:ltr
}

.message-status.read{
color:#006dff
}

.message.image-message,
.message.video-message{
padding:8px 8px 28px!important;
width:max-content!important;
max-width:80%!important;
background:#18231f!important;
border:1px solid rgba(255,255,255,.08)
}

.message.mine.image-message,
.message.mine.video-message{

.message-image,
.message-video{

width:100%;
max-width:260px;
max-height:280px;
border-radius:12px;
object-fit:cover;
cursor:pointer

.bottom-sheet-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:1000;
display:flex;
align-items:flex-end;
animation:fadeIn .2s ease
}

@keyframes fadeIn{

from{
opacity:0
}

to{
opacity:1
}

}

.bottom-sheet{

max-width:650px;
margin:0 auto;
background:#111b18;
border-top-left-radius:24px;
border-top-right-radius:24px;
padding:16px 20px 30px;

flex-direction:column;
gap:16px;
border-top:1px solid rgba(0,232,137,.2)

@keyframes slideUp{

from{
transform:translateY(100%)

to{

.sheet-reactions-bar{

justify-content:space-around;
background:#182521;
padding:10px 14px;
border-radius:30px;
font-size:24px;

.sheet-reaction-btn{

border:none;

.sheet-reaction-btn:hover{

.sheet-actions-list{

gap:6px

.sheet-action-item{

padding:12px 16px;

border:none;

font-size:14px;
font-weight:bold;
text-align:right;

align-items:center;
gap:12px;
cursor:pointer

.sheet-action-item:hover{
background:#20312b

.message-reactions{

.message.mine .message-reactions{

.reply-name{

.reply-text{

.input-area{

bottom:0;
left:50%;

width:100%;
max-width:650px;
padding:10px;
display:flex;

#messageInput{

min-width:0;

function escapeHtml(value){

return String(value ?? "")
.replace(/[&<>'"]/g,function(character){

const map = {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

};

return map[character];

});

}



function createChatID(a,b){

return [a,b]
.sort()
.join("_");

function getMessagePreview(data){

if(data.type === "text"){
return data.text || "رسالة";
}

if(data.type === "image"){
return "📷 صورة";
}

if(data.type === "video"){
return "🎥 فيديو";
}

if(data.type === "voice"){
return "🎤 رسالة صوتية";
}

return "رسالة";

}



function formatTime(timestamp){

if(!timestamp?.toDate){
return "";
}

try{

return timestamp
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch(error){

return "";

}

}

cancelEdit();

replyTarget = {

senderId:data.senderId,

senderName:

:

async function toggleReaction(
messageId,
emoji
){

if(
!currentUser ||
!chatID ||
!messageId ||
!emoji
){
return;
}

try{

const messageRef =
doc(
db,
"chats",
chatID,
"messages",
messageId
);


const snapshot =
await getDoc(messageRef);


if(!snapshot.exists()){
return;
}


const data =
snapshot.data();


const reactions =
Array.isArray(data.reactions)

?

data.reactions

:

[];


const existingReaction =
reactions.find(function(reaction){

return (
reaction &&
reaction.userId === currentUser.uid
);

});


const sameReaction =
reactions.find(function(reaction){

return (

reaction &&
reaction.userId === currentUser.uid &&
reaction.emoji === emoji

);

});


if(sameReaction){

await updateDoc(
messageRef,
{

reactions:
arrayRemove(sameReaction)

}
);

}else{

if(existingReaction){

await updateDoc(
messageRef,
{

reactions:
arrayRemove(existingReaction)

}
);

}


await updateDoc(
messageRef,
{

reactions:
arrayUnion({

userId:
currentUser.uid,

emoji:
emoji

})

}
);

}

}catch(error){

console.error(
"Reaction error:",
error
);

}

}



function renderReactions(
box,
data
){

if(
!Array.isArray(data.reactions) ||
!data.reactions.length
){
return;
}


const wrapper =
document.createElement("div");


wrapper.className =
"message-reactions";


const counts =
{};


data.reactions.forEach(function(reaction){

if(
!reaction ||
!reaction.emoji
){
return;
}


if(!counts[reaction.emoji]){

counts[reaction.emoji] = {

count:0,

mine:false

};

}


counts[reaction.emoji].count++;


if(
reaction.userId === currentUser.uid
){

counts[reaction.emoji].mine =
true;

}

});


reactionList.forEach(function(emoji){

const info =
counts[emoji];


if(!info){
return;
}


const chip =
document.createElement("button");


chip.type =
"button";


chip.className =
"reaction-chip" +
(info.mine ? " mine" : "");


chip.textContent =
emoji +
(info.count > 1 ? " " + info.count : "");


chip.onclick =
function(event){

event.stopPropagation();

toggleReaction(
data.id,
emoji
);

};


wrapper.appendChild(chip);

});


if(wrapper.children.length){

box.appendChild(wrapper);

}

}



function removeBottomSheet(){

const existing =
document.querySelector(
".bottom-sheet-backdrop"
);


if(existing){

existing.remove();

}

}



function showBottomSheetMenu(data){

removeBottomSheet();


const mine =
data.senderId === currentUser.uid;


const backdrop =

function setupSwipeToReply(
element,
data
){

let startX = 0;

let currentX = 0;

let active = false;


element.addEventListener(
"touchstart",
function(event){

if(
event.touches.length !== 1
){
return;
}


startX =
event.touches[0].clientX;


currentX =
startX;


active =
true;

},
{passive:true}
);



element.addEventListener(
"touchmove",
function(event){

if(!active){
return;
}


currentX =
event.touches[0].clientX;


const difference =
currentX - startX;


let allowed =
false;


if(
data.senderId === currentUser.uid
){

allowed =
difference < 0 &&
difference > -130;

}else{

allowed =
difference > 0 &&
difference < 130;

}


if(allowed){

element.style.transform =
`translateX(${difference}px)`;

}

},
{passive:true}
);



element.addEventListener(
"touchend",
function(){

if(!active){
return;
}


active =
false;


const difference =
currentX - startX;


if(
Math.abs(difference) > 85
){

startReply(data);

}


element.style.transform =
"translateX(0px)";

}
);



element.addEventListener(
"touchcancel",
function(){

active =
false;


element.style.transform =
"translateX(0px)";

}
);

}

function addMessageActions(
element,
data
){

let timer =
null;


let longPress =
false;


let moved =
false;


let startX =
0;


let startY =
0;



element.addEventListener(
"pointerdown",
function(event){

if(
event.target.closest("button")
){
return;
}


longPress =
false;


moved =
false;


startX =
event.clientX;


startY =
event.clientY;


timer =
setTimeout(
function(){

if(!moved){

longPress =
true;

showBottomSheetMenu(data);

}

},
550
);

}
);



element.addEventListener(
"pointermove",
function(event){

const distanceX =
Math.abs(
event.clientX - startX
);


const distanceY =
Math.abs(
event.clientY - startY
);


if(
distanceX > 10 ||
distanceY > 10
){

moved =
true;

clearTimeout(timer);

}

}
);



element.addEventListener(
"pointerup",
function(){

clearTimeout(timer);

}
);



element.addEventListener(
"pointercancel",
function(){

clearTimeout(timer);

}
);



element.addEventListener(
"contextmenu",
function(event){

event.preventDefault();

showBottomSheetMenu(data);

}
);



let lastClickTime =
0;


element.addEventListener(
"click",
function(event){

if(longPress){
return;
}


if(
event.target.closest("button") ||
event.target.closest(".message-reply")
){
return;
}


const now =
Date.now();


if(
now - lastClickTime < 350 &&
now - lastClickTime > 0
){

triggerHeartReaction(
element,
data.id
);

lastClickTime =
0;

}else{

lastClickTime =
now;

}

}
);


setupSwipeToReply(
element,
data
);

}

function renderMessages(snapshot){

const nearBottom =

messages.scrollHeight -
messages.scrollTop -
messages.clientHeight

<

150;



snapshot.docChanges().forEach(
function(change){


const id =
change.doc.id;


const data = {

...change.doc.data(),

id:id

};



if(
change.type === "removed"
){

const oldElement =
messageElements.get(id);


if(oldElement){

oldElement.remove();

}


messageElements.delete(id);


if(
pinnedMessage &&
pinnedMessage.id === id
){

pinnedMessage =
null;

}


return;

}



if(

Array.isArray(
data.deletedFor
)

&&

data.deletedFor.includes(
currentUser.uid
)

){

const oldElement =
messageElements.get(id);


if(oldElement){

oldElement.remove();

}


messageElements.delete(id);


if(
pinnedMessage &&
pinnedMessage.id === id
){

pinnedMessage =
null;

}


return;

}



removeEmptyMessage();



const box =
createMessageElement(data);


const oldElement =
messageElements.get(id);


if(oldElement){

oldElement.replaceWith(
box
);

}else{

messages.appendChild(
box
);

}


messageElements.set(
id,
box
);

}
);



let latestPinned =
null;


snapshot.docs.forEach(
function(documentSnapshot){

const data = {

...documentSnapshot.data(),

id:documentSnapshot.id

};


if(

data.pinned === true

&&

!(

Array.isArray(data.deletedFor)

&&

data.deletedFor.includes(
currentUser.uid
)

)

){

latestPinned =
data;

}

}
);


pinnedMessage =
latestPinned;


updatePinnedBanner();


if(
messageElements.size === 0
){

showEmptyMessage();

}



if(nearBottom){

scrollToBottom();

}

}

async function uploadMediaAndSend(
file,
type
){

if(
!currentUser ||
!friendUser ||
!chatID ||
!file
){
return;
}


const maximumSize =
50 * 1024 * 1024;


if(
file.size > maximumSize
){

alert(
"حجم الملف كبير جداً. الحد الأقصى 50MB."
);

return;

}


sendButton.disabled =
true;


attachButton.disabled =
true;


try{


const extension =
file.name.includes(".")

?

file.name.split(".").pop()

:

(
type === "video"

?

"mp4"

:

"jpg"
);


const safeExtension =
String(extension)
.replace(/[^a-zA-Z0-9]/g,"")
.toLowerCase();


const fileName =

`${chatID}/${currentUser.uid}/${Date.now()}_${crypto.randomUUID()}.${safeExtension}`;



const uploadResult =
await supabase.storage

.from("mecd-media")

.upload(

fileName,

file,

{

contentType:
file.type,

upsert:false

}

);



if(uploadResult.error){

throw uploadResult.error;

}



const publicResult =
supabase.storage

.from("mecd-media")

.getPublicUrl(
fileName
);



const mediaUrl =
publicResult.data?.publicUrl;


if(!mediaUrl){

throw new Error(
"لم يتم إنشاء رابط الملف"
);

}



await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

url:
mediaUrl,

storagePath:
fileName,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type:
type,

read:
false,

deletedFor:
[],

createdAt:
serverTimestamp()

}

);


}catch(error){

console.error(
"Upload error:",
error
);


alert(
"فشل رفع الملف"
);

}

finally{

sendButton.disabled =
false;


attachButton.disabled =
false;

}

}

async function loadFriend(){

location.search
);


const friendId =
parameters.get("friend");

throw new Error(
"لا يوجد معرف الصديق في الرابط"
);

}


if(
friendId === currentUser.uid
){

throw new Error(
"لا يمكنك فتح محادثة مع نفسك"
);

}


const snapshot =
await getDoc(

doc(
db,
"users",
friendId
)

);


if(!snapshot.exists()){

throw new Error(
"المستخدم غير موجود"
);

}


const data =
snapshot.data();


friendUser = {

uid:
friendId,

name:
data.name ||
data.displayName ||
"مستخدم",

photo:
data.photo ||
data.photoURL ||
""

};


friendName.textContent =
friendUser.name;

friendAvatar,
friendUser
);


chatID =
createChatID(

currentUser.uid,

friendUser.uid

);


friendStatus.textContent =
"● غير متصل";

}
