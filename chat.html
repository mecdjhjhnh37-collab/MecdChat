<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
content="#050807">

<title>Mecd Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    overflow:hidden;
}

/* =========================
   APP
========================= */

.app{

    width:100%;
    height:100vh;

    max-width:650px;

    margin:auto;

    display:flex;
    flex-direction:column;

}

/* =========================
   HEADER
========================= */

header{

    height:75px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:10px 14px;

    background:#050807;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    flex-shrink:0;

}

.back{

    width:44px;
    height:44px;

    border:0;

    border-radius:14px;

    background:#18231f;

    color:white;

    font-size:21px;

    cursor:pointer;

}

.avatar{

    width:48px;
    height:48px;

    border-radius:16px;

    background:#12352c;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:24px;

    flex-shrink:0;

}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.user-info{

    flex:1;

    min-width:0;

}

.user-name{

    font-size:17px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.user-status{

    margin-top:4px;

    font-size:12px;

    color:#777;

}

.user-status.online{

    color:#00e889;

}

.user-status.typing{

    color:#00e889;

    font-weight:bold;

}

.call-buttons{

    display:flex;

    gap:7px;

}

.call-buttons button{

    width:42px;
    height:42px;

    border:0;

    border-radius:14px;

    background:#18231f;

    color:white;

    font-size:18px;

    cursor:pointer;

}

.call-buttons button:active{

    transform:scale(.92);

}

/* =========================
   MESSAGES
========================= */

.messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:
        20px
        14px
        150px;

    display:flex;

    flex-direction:column;

    gap:10px;

}

.empty{

    margin:auto;

    text-align:center;

    color:#72817c;

}

.message{

    max-width:78%;

    padding:12px 15px;

    border-radius:18px;

    position:relative;

    word-break:break-word;

    user-select:none;

    -webkit-user-select:none;

}

.message.mine{

    align-self:flex-start;

    background:#00c96b;

    color:#00150e;

    border-bottom-left-radius:5px;

}

.message.other{

    align-self:flex-end;

    background:#18231f;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-right-radius:5px;

}

.time{

    display:inline-block;

    font-size:9px;

    opacity:.6;

    margin-top:5px;

}

.message-meta{

    display:flex;

    align-items:center;

    gap:5px;

}

.message-status{

    direction:ltr;

    font-size:12px;

    letter-spacing:-3px;

}

.message-status.sent{

    opacity:.6;

}

.message-status.read{

    color:#168cff;

}

/* =========================
   INPUT
========================= */

.input-area{

    position:fixed;

    bottom:0;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:650px;

    padding:10px;

    display:flex;

    gap:8px;

    background:#050807;

    z-index:50;

}

#messageInput{

    flex:1;

    min-width:0;

    padding:14px;

    border-radius:17px;

    border:

        #27332f;

    background:#111916;

    color:white;

    outline:none;

    font-size:15px;

}

#messageInput:focus{

    border-color:#00e889;

}

#voiceButton,
#sendButton{

    width:50px;
    height:50px;

    border:0;

    border-radius:16px;

    font-size:22px;

    cursor:pointer;

}

#voiceButton{

    background:#18231f;

    color:white;

}

#voiceButton.recording{

}

#sendButton{

    background:#00e889;

    color:#00150e;

}

/* =========================
   CALL MESSAGE
========================= */

.call-message{

    min-width:240px;

    max-width:310px;

}

.call-box{

    display:flex;

    align-items:center;

    gap:11px;

}

.call-icon{

    width:45px;
    height:45px;

    display:flex;

.call-info{

.call-title{

    font-weight:bold;

}

.call-subtitle,

/* =========================
   CALL OVERLAY
========================= */

#callOverlay{

    position:fixed;

    inset:0;

    z-index:100000;

    display:none;

            #123d35,

    overflow:hidden;

}

.call-screen{

    width:100%;
    height:100%;

    margin:auto;

    position:relative;

    display:flex;

    flex-direction:column;

/* =========================
   AUDIO CALL
========================= */

.audio-call{

    flex:1;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

}

.audio-avatar{

    width:125px;
    height:125px;

    border-radius:34px;

    background:#12352c;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:52px;

    box-shadow:
        0 0 50px

}

.audio-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

#callName{

    margin-top:20px;

    font-size:24px;

    font-weight:bold;

}

#callState{

    margin-top:8px;

    color:#00e889;

    font-size:14px;

}

/* =========================
   VIDEO
========================= */

#videoArea{

    position:absolute;

    inset:0;

    display:none;

    background:#000;

    overflow:hidden;

}

#remoteVideo{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;

    cursor:pointer;

}

#localVideo{

    position:absolute;

    width:115px;
    height:165px;

    left:16px;
    bottom:125px;

    object-fit:cover;

    border-radius:18px;

    border:2px solid #00e889;

    background:#111;

    z-index:5;

    cursor:pointer;

    transition:
        all .25s ease;

}

/*
الصورة الكبيرة
*/

#localVideo.local-big{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    border-radius:0;

    z-index:2;

}

/*
عندما تكون صورة الطرف الآخر صغيرة
*/

#remoteVideo.remote-small{

    width:115px;
    height:165px;

    top:auto;
    right:16px;
    bottom:125px;

    left:auto;

    border-radius:18px;

    border:2px solid #00e889;

    z-index:5;

}

/* =========================
   VIDEO TOP
========================= */

.video-top{

    position:absolute;

    top:18px;

    left:16px;

    right:16px;

    z-index:20;

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.video-person{

    background:
        rgba(0,0,0,.38);

    backdrop-filter:blur(8px);

    padding:9px 13px;

    border-radius:14px;

    font-size:13px;

}

/* =========================
   CALL CONTROLS
========================= */

.call-controls{

    position:absolute;

    bottom:30px;

    left:0;
    right:0;

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

}

.call-control{

    width:58px;
    height:58px;

    border:0;

    border-radius:50%;

    background:#18231f;

    color:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.3);

}

.call-control:active{

    transform:scale(.9);

}

.call-control.active{

    background:#00e889;

    color:#00150e;

}

.call-control.muted{

    background:#d83b3b;

}

.call-control.end{

    background:#e53935;

    width:64px;
    height:64px;

}

.call-control.accept{

    background:#00e889;

    color:#00150e;

    width:64px;
    height:64px;

}

/* =========================
   INCOMING
========================= */

#incomingInfo{

    position:absolute;

    top:30px;

    left:20px;
    right:20px;

    z-index:50;

    text-align:center;

    display:none;

}

.incoming-label{

    display:inline-block;

    padding:9px 15px;

    border-radius:20px;

    background:
        rgba(0,232,137,.12);

    color:#00e889;

    font-size:13px;

}

/* =========================
   MESSAGE MENU
========================= */

.message-menu{

    position:absolute;

    left:50%;

    bottom:
        calc(100% + 8px);

    transform:translateX(-50%);

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    border-radius:14px;

    padding:5px;

    z-index:9999;

}

.message-menu button{

    border:0;

    padding:10px 15px;

    border-radius:10px;

    background:#18231f;

    color:white;

}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .message{

        max-width:84%;

    }

    #localVideo,
    #remoteVideo.remote-small{

        width:105px;
        height:145px;

        bottom:120px;

    }

}

</style>

"1:643005547408:web:b1719060ec340dd0e0a915"

};


const firebaseApp =

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* ============================================================
   ELEMENTS
============================================================ */

const $ =
id =>
document.getElementById(id);


const loading =
$("loading");

const app =
$("app");

const messages =
$("messages");

const messageInput =
$("messageInput");

const sendButton =
$("sendButton");

const voiceButton =
$("voiceButton");

const friendName =
$("friendName");

const friendAvatar =
$("friendAvatar");

const friendStatus =
$("friendStatus");

const backButton =
$("backButton");

const callButton =
$("callButton");

const videoButton =
$("videoButton");

const callOverlay =
$("callOverlay");

const audioCall =
$("audioCall");

const callAvatar =
$("callAvatar");

const callName =
$("callName");

const callState =
$("callState");

const videoArea =
$("videoArea");

const remoteVideo =
$("remoteVideo");

const localVideo =
$("localVideo");

const videoPerson =
$("videoPerson");

const videoTimer =

$("incomingInfo");

$("endCallButton");


/* ============================================================
   VARIABLES
============================================================ */

let currentUser =
null;

let friendUser =
null;

let chatID =
null;


let unsubscribeMessages =
null;

let unsubscribeFriendStatus =
null;

let unsubscribeFriendTyping =
null;

let incomingCallUnsubscribe =
null;

let activeCallUnsubscribe =
null;

let activeCandidateUnsubscribe =
null;


let localStream =
null;

let peerConnection =
null;


let activeCallId =
null;

let activeCallType =
null;

let activeCallerId =
null;

let activeOtherUser =
null;


let callSeconds =
0;

let callTimer =
null;


let mediaRecorder =
null;

let audioChunks =
[];


let typingTimer =
null;

let typingState =
false;


/*
هذا المتغير مهم جدًا:

إذا كنت داخل محادثة B
واتصل C بك

تبقى friendUser = B

لكن activeOtherUser = C

وبالتالي المكالمة تذهب إلى C
وليس B.
*/


/* ============================================================
   RTC
============================================================ */

const rtcConfig={

iceServers:[

{

},

/* ============================================================
   HELPERS
============================================================ */

function createChatID(a,b){

return [
a,
b
]
.sort()
.join("_");

}


function escapeHtml(value){

return String(value)
.replace(
/[&<>'"]/g,
c => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[c])
);

}


function formatDuration(seconds){

seconds =
Math.max(
0,
Math.floor(
Number(seconds || 0)
)
);

const m =
Math.floor(
seconds / 60
);

const s =
seconds % 60;

return (
String(m).padStart(2,"0")
+
":"
+
String(s).padStart(2,"0")
);

}


function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

return timestamp
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


function getUserAvatarHTML(user){

if(user?.photo){

return `
<img
src="${escapeHtml(user.photo)}"
alt="">
`;

}

return "👤";

}


/* ============================================================
   SHOW APP
============================================================ */

function showApp(){

loading.style.display =
"none";

app.style.display =
"flex";

}


/* ============================================================
   PRESENCE
============================================================ */

let presenceInterval =
null;


async function updateMyPresence(
online=true
){

if(!currentUser)
return;

try{

await setDoc(

doc(
db,
"users",
currentUser.uid
),

{
online,
lastSeen:
serverTimestamp()
},

{
merge:true
}

);

}catch(e){

console.error(
"presence",
e
);

}

}


function startPresence(){

updateMyPresence(true);

clearInterval(
presenceInterval
);

presenceInterval =
setInterval(
()=>{

if(
document.visibilityState ===
"visible"
){

updateMyPresence(true);

}

},
10000
);

}


function stopPresence(){

clearInterval(
presenceInterval
);

presenceInterval =
null;

updateMyPresence(false);

}


/* ============================================================
   LOAD CURRENT CHAT FRIEND
============================================================ */

async function loadFriend(){

const id =
new URLSearchParams(
location.search
).get("friend");


if(!id){

throw new Error(
"لا يوجد صديق في الرابط"
);

}


const snap =
await getDoc(
doc(
db,
"users",
id
)
);


if(!snap.exists()){

throw new Error(
"المستخدم غير موجود"
);

}


const data =
snap.data();


friendUser={

uid:id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
""

};


friendName.textContent =
friendUser.name;

friendAvatar.innerHTML =
getUserAvatarHTML(
friendUser
);


chatID =
createChatID(
currentUser.uid,
friendUser.uid
);


await setDoc(

doc(
db,
"chats",
chatID
),

{
members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp()

},

{
merge:true
}

);


listenFriendStatus();

listenFriendTyping();

}


/* ============================================================
   FRIEND STATUS
============================================================ */

function listenFriendStatus(){

if(!friendUser)
return;


if(unsubscribeFriendStatus){

unsubscribeFriendStatus();

}


unsubscribeFriendStatus =
onSnapshot(

doc(
db,
"users",
friendUser.uid
),

snap=>{

if(!snap.exists())
return;


const data =
snap.data();

const last =
data.lastSeen
?.toMillis?.() || 0;


const online =
data.online === true &&
last > 0 &&
Date.now()-last < 30000;


if(
!friendStatus.classList
.contains("typing")
){

friendStatus.textContent =
online
? "● متصل"
: "● غير متصل";

}


friendStatus.classList.toggle(
"online",
online
);

}

);

}


/* ============================================================
   TYPING
============================================================ */

function listenFriendTyping(){

if(!friendUser)
return;


if(unsubscribeFriendTyping){

unsubscribeFriendTyping();

}


unsubscribeFriendTyping =
onSnapshot(

doc(
db,
"chats",
chatID,
"typing",
friendUser.uid
),

snap=>{

if(!snap.exists()){

setTypingUI(false);

return;

}


const data =
snap.data();

const time =
data.updatedAt
?.toMillis?.() || 0;


const typing =
data.typing === true &&
(
!time ||
Date.now()-time < 5000
);


setTypingUI(typing);

}

);

}


function setTypingUI(
typing
){

if(typing){

friendStatus.textContent =
"يكتب...";

friendStatus.classList.add(
"typing"
);

friendStatus.classList.remove(
"online"
);

}else{

friendStatus.classList.remove(
"typing"
);

listenFriendStatus();

async function markRead(
id,
data
){

if(
!currentUser ||
data.senderId === currentUser.uid ||

)
return;

}

}

function renderMessages(
snap
){

if(!renderMessages.elements){

renderMessages.elements =
new Map();

}


const elements =
renderMessages.elements;


const nearBottom =
messages.scrollHeight -
messages.scrollTop -
messages.clientHeight
<120;


snap.docChanges()
.forEach(
change=>{

const id =
change.doc.id;

const data =
change.doc.data();


if(
change.type === "added" ||
change.type === "modified"
){

if(
data.senderId !==
currentUser.uid
){

markRead(
id,
data
);

}

}


if(
change.type === "removed"
){

const old =
elements.get(id);

if(old){

old.remove();

elements.delete(id);

}

return;

}


if(
Array.isArray(
data.deletedFor
) &&
data.deletedFor.includes(
currentUser.uid
)
){

const old =
elements.get(id);

if(old){

old.remove();

elements.delete(id);

}

return;

}


const box =
document.createElement(
"div"
);

box.className =
"message "
+
(
data.senderId ===
currentUser.uid
? "mine"
: "other"
);


if(data.type === "call"){

createCallMessage(
box,
data
);

}else if(
data.type === "voice"
){

const audio =
document.createElement(
"audio"
);

audio.controls =
true;

audio.src =
data.audio || "";

box.appendChild(audio);

}else{

box.appendChild(
document.createTextNode(
data.text || ""
)
);

}


const meta =
document.createElement(
"div"
);

meta.className =
"message-meta";


const time =
document.createElement(
"span"
);

time.className =
"time";

time.textContent =
formatTime(
data.createdAt
);

meta.appendChild(time);


const status =
createStatus(data);

if(status)
meta.appendChild(status);


box.appendChild(meta);


const old =
elements.get(id);


if(old){

old.replaceWith(box);

}else{

messages.appendChild(box);

}


elements.set(id,box);

}

);


const all =
messages.querySelectorAll(
".message"
);


let empty =
messages.querySelector(
".empty"
);


if(all.length === 0){

if(!empty){

empty =
document.createElement(
"div"
);

empty.className =
"empty";

empty.innerHTML =
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(empty);

}

}else{

empty?.remove();

}


if(nearBottom){

requestAnimationFrame(
()=>{

messages.scrollTop =
messages.scrollHeight;

}
);

}

}

collection(

function createPeer(){

const pc =
new RTCPeerConnection(
rtcConfig
);


pc.onicecandidate =
async event=>{

if(
!event.candidate ||
!activeCallId
)
return;


try{

await addDoc(

collection(
db,
"calls",
activeCallId,
"candidates"
),

{

senderId:
currentUser.uid,

candidate:
event.candidate.toJSON()

}

);

}catch(e){

console.error(
"ICE",
e
);

}

};


pc.ontrack =
event=>{

if(
event.streams &&
event.streams[0]
){

remoteVideo.srcObject =
event.streams[0];

}

};


pc.onconnectionstatechange =
()=>{

const state =
pc.connectionState;


if(state === "connected"){

callState.textContent =
"متصل";

startCallTimer();

}


if(
state === "failed" ||
state === "disconnected"
){

callState.textContent =
"انقطع الاتصال";

}

};


return pc;

}

/* ============================================================
   OUTGOING CALL LISTENER
============================================================ */

function listenOutgoingCall(){

if(activeCallUnsubscribe)
activeCallUnsubscribe();


activeCallUnsubscribe =
onSnapshot(

doc(
db,
"calls",
activeCallId
),

async snap=>{

if(!snap.exists())
return;


const data =
snap.data();


if(
data.answer &&
peerConnection &&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection
.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

}catch(e){

console.error(e);

}

}


if(data.status === "connected"){

callState.textContent =
"متصل";

startCallTimer();

}


if(data.status === "rejected"){

callState.textContent =
"تم رفض المكالمة";


setTimeout(
()=>finishCall(
"rejected",
false
),
800
);

}


if(data.status === "missed"){

callState.textContent =
"لم يتم الرد";

}


if(data.status === "ended"){

finishCall(
"ended",
false
);

}

}

);


activeCandidateUnsubscribe =
onSnapshot(

collection(
db,
"calls",
activeCallId,
"candidates"
),

snap=>{

snap.docChanges()
.forEach(
change=>{

if(
change.type !==
"added"
)
return;


const data =
change.doc.data();


if(
data.senderId ===
currentUser.uid
)
return;


if(
peerConnection &&
data.candidate
){

peerConnection
.addIceCandidate(
new RTCIceCandidate(
data.candidate
)
)
.catch(console.error);

}

}
);

}

);

}


/* ============================================================
   GLOBAL INCOMING CALLS
============================================================ */

/*
مهم جدًا:

لا نستخدم friendUser هنا.

نستمع فقط للمكالمات التي:

receiverId = currentUser.uid

وهذا يعني:

A -> B

لن تصل المكالمة إلى C.

إذا كنت A داخل محادثة B
واتصل C بـ A

receiverId = A

فتظهر عند A
ويظهر اسم C.

وبالتالي لا يتم ربط المكالمة مع B.
*/

function listenIncomingCalls(){

if(!currentUser)
return;


if(incomingCallUnsubscribe)
incomingCallUnsubscribe();


const callsRef =
collection(
db,
"calls"
);


incomingCallUnsubscribe =
onSnapshot(

query(
callsRef,
orderBy(
"createdAt",
"desc"
)
),

snap=>{

snap.docChanges()
.forEach(
async change=>{

if(
change.type !==
"added"
)
return;


const data =
change.doc.data();


/*
المتلقي فقط
*/

if(
data.receiverId !==
currentUser.uid
)
return;


/*
لا نعرض مكالمة قديمة
*/

const created =
data.createdAt
?.toMillis?.() || 0;


if(
created &&
Date.now()-created > 30000
)
return;


/*
لا نظهر مكالمة انتهت
*/

if(
data.status !==
"ringing"
)
return;


/*
إذا لدينا مكالمة حالية
لا نستبدلها
*/

if(activeCallId)
return;


/*
جيب بيانات الشخص الذي اتصل
*/

let caller = {

uid:
data.callerId,

name:
"مستخدم Mecd",

photo:
""

};


try{

const callerSnap =
await getDoc(

doc(
db,
"users",
data.callerId
)

);


if(callerSnap.exists()){

const callerData =
callerSnap.data();


caller.name =
callerData.name ||
"مستخدم Mecd";


caller.photo =
callerData.photo ||
"";

}

}catch(e){

console.error(
"caller profile",
e
);

}


/*
هنا أهم نقطة:

activeOtherUser = المتصل الحقيقي

وليس الشخص الموجود في المحادثة.
*/

activeCallId =
change.doc.id;

activeCallerId =
data.callerId;

activeOtherUser =
caller;

showCallUI(
data.callType || "audio",
true,
caller
);


/*
استقبال مرشحات ICE
*/

listenIncomingCandidates();

}

);

}

currentUser.uid
){

);

}

data.status !==
"ringing"
){

);

}

/*
الصوت/الفيديو من الجهاز الحالي
*/

);

);

)

);

.setLocalDescription(

);

answer.sdp
},

/* ============================================================

============================================================ */

function startCallTimer(){

if(callTimer)
return;


callSeconds =
0;


callTimer =
setInterval(
()=>{

callSeconds++;


const value =
formatDuration(
callSeconds
);


videoTimer.textContent =
value;


if(
callState.textContent ===
"متصل"
){

callState.textContent =
"متصل • "
+
value;

}

},
1000
);

}


function stopCallTimer(){

clearInterval(
callTimer
);

callTimer =
null;

}


/* ============================================================
   FINISH CALL
============================================================ */

async function finishCall(
reason="ended",
writeStatus=true
){

const id =
activeCallId;


const duration =
callSeconds;


stopCallTimer();


if(writeStatus && id){

try{

const ref =
doc(
db,
"calls",
id
);


const snap =
await getDoc(ref);


if(snap.exists()){

const data =
snap.data();


/*
المكالمة التي لم يجب عليها الطرف الآخر
*/

let status =
reason;


if(
reason === "ended" &&
duration === 0
){

status =
"missed";

}


await updateDoc(
ref,
{

status,

duration,

endedAt:
serverTimestamp()

}
);

}

}catch(e){

console.error(e);

}

}


/*
أوقف الكاميرا والمايك
*/

if(localStream){

localStream
.getTracks()
.forEach(
track =>
track.stop()
);

}


localStream =
null;


if(peerConnection){

peerConnection.close();

}


peerConnection =
null;


if(activeCallUnsubscribe){

activeCallUnsubscribe();

activeCallUnsubscribe =
null;

}


if(activeCandidateUnsubscribe){

activeCandidateUnsubscribe();

activeCandidateUnsubscribe =
null;

}


remoteVideo.srcObject =
null;

localVideo.srcObject =
null;


/*
إرجاع الفيديو للوضع الطبيعي
*/

localVideo.classList.remove(
"local-big"
);

remoteVideo.classList.remove(
"remote-small"
);


activeCallId =
null;

activeCallerId =
null;

activeOtherUser =
null;

activeCallType =
null;


muteMeButton.textContent =
"🎤";

muteOtherButton.textContent =
"🔊";


hideCallUI();

}

============================================================ */

endCallButton.onclick =
async()=>{

await finishCall(
"ended",
true
);

};


/* ============================================================
   MUTE MY MICROPHONE
============================================================ */

muteMeButton.onclick =
()=>{

if(!localStream)
return;


const track =
localStream
.getAudioTracks()[0];


if(!track)
return;


track.enabled =
!track.enabled;


if(track.enabled){

muteMeButton.textContent =
"🎤";

muteMeButton.classList.remove(
"muted"
);

}else{

muteMeButton.textContent =
"🔇";

muteMeButton.classList.add(
"muted"
);

}

};


/* ============================================================
   MUTE OTHER PERSON
============================================================ */

let remoteMuted =
false;


muteOtherButton.onclick =
()=>{

remoteMuted =
!remoteMuted;


remoteVideo.muted =
remoteMuted;


if(remoteMuted){

muteOtherButton.textContent =
"🔇";

muteOtherButton.classList.add(
"muted"
);

}else{

muteOtherButton.textContent =
"🔊";

muteOtherButton.classList.remove(
"muted"
);

}

};


/* ============================================================
   CAMERA FLIP
============================================================ */

let facingMode =
"user";


flipCameraButton.onclick =
async()=>{

if(!localStream)
return;


const videoTrack =
localStream
.getVideoTracks()[0];


if(!videoTrack)
return;


facingMode =
facingMode ===
"user"
? "environment"
: "user";


try{

const newStream =
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:{

facingMode:

{
ideal:
facingMode
}

}

});


const newVideoTrack =
newStream
.getVideoTracks()[0];


const sender =
peerConnection
?.getSenders()
.find(
s =>
s.track &&
s.track.kind ===
"video"
);


if(sender){

await sender.replaceTrack(
newVideoTrack
);

}


/*
أوقف الفيديو القديم فقط
*/

videoTrack.stop();


/*
احتفظ بمسار الصوت القديم
*/

const audioTrack =
localStream
.getAudioTracks()[0];


localStream =
new MediaStream();


if(audioTrack){

localStream.addTrack(
audioTrack
);

}


localStream.addTrack(
newVideoTrack
);


localVideo.srcObject =
localStream;


}catch(e){

console.error(
"flip camera",
e
);

alert(
"تعذر قلب الكاميرا"
);

}

};


/* ============================================================
   SWITCH VIDEO BIG / SMALL
============================================================ */

let localIsBig =
false;


function toggleVideoPosition(){

if(
activeCallType !==
"video"
)
return;


localIsBig =
!localIsBig;


if(localIsBig){

/*
أنا كبير
*/

localVideo.classList.add(
"local-big"
);

remoteVideo.classList.add(
"remote-small"
);

}else{

/*
الطرف الآخر كبير
*/

localVideo.classList.remove(
"local-big"
);

remoteVideo.classList.remove(
"remote-small"
);

}

}


localVideo.onclick =
e=>{

e.stopPropagation();

toggleVideoPosition();

};


remoteVideo.onclick =
e=>{

e.stopPropagation();

toggleVideoPosition();

};


/* ============================================================
   CALL BUTTONS
============================================================ */

callButton.onclick =
()=>{

startCall(
"audio"
);

};


videoButton.onclick =
()=>{

startCall(
"video"
);

};


acceptCallButton.onclick =
acceptIncomingCall;


rejectCallButton.onclick =
rejectIncomingCall;


/* ============================================================
   BACK
============================================================ */

backButton.onclick =
async()=>{

await updateTyping(false);


if(activeCallId){

await finishCall(
"ended",
true
);

}


if(unsubscribeMessages)
unsubscribeMessages();


if(unsubscribeFriendStatus)
unsubscribeFriendStatus();


if(unsubscribeFriendTyping)
unsubscribeFriendTyping();


stopPresence();


history.back();

};


/* ============================================================
   VISIBILITY
============================================================ */

document.addEventListener(
"visibilitychange",
()=>{

if(!currentUser)
return;


if(
document.visibilityState ===
"visible"
){

updateMyPresence(true);

}else{

/*
لا نغلق المكالمة هنا.

لأن المستخدم ممكن يخرج من الشاشة
والمكالمة تبقى فعالة.
*/

updateMyPresence(false);

updateTyping(false);

}

}
);


/* ============================================================
   PAGE HIDE
============================================================ */

window.addEventListener(
"pagehide",
()=>{

if(currentUser){

updateMyPresence(false);

updateTyping(false);

}

}
);


/* ============================================================
   INIT
============================================================ */

function init(){

onAuthStateChanged(
auth,
async user=>{

if(!user){

loading.textContent =
"يجب تسجيل الدخول أولاً";

return;

}


currentUser =
user;


try{

startPresence();


await loadFriend();


listenMessages();


/*
مراقبة المكالمات من جميع المحادثات.

لكن الفلترة داخل الدالة تمنع
ظهور مكالمات الأشخاص الآخرين.
*/

listenIncomingCalls();


showApp();


}catch(e){

console.error(e);


loading.innerHTML = `

<div
style="
text-align:center;
padding:20px;
">

⚠️ تعذر فتح الدردشة

<br><br>

<small
style="color:#777">

${escapeHtml(
e.message ||
"حدث خطأ"
)}

</small>

</div>

`;

}

}
);

}


init();

</script>

</body>

</html>
