<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat - الدردشة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

min-height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:

radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),

linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow:hidden;
}

.app{

width:100%;

max-width:650px;

height:100vh;

margin:auto;

display:flex;

flex-direction:column;

position:relative;
}

header{

height:75px;

padding:
12px 18px;

display:flex;

align-items:center;

gap:12px;

background:#050807;

border-bottom:
1px solid
rgba(255,255,255,.08);

flex-shrink:0;

position:relative;

z-index:100;
}

.back{

width:45px;

height:45px;

border:none;

border-radius:14px;

background:
rgba(255,255,255,.06);

color:white;

font-size:24px;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;
}

.back:active{

transform:scale(.94);
}

.avatar{

width:48px;

height:48px;

border-radius:50%;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:#12352c;

font-size:24px;

flex-shrink:0;

border:
1px solid
rgba(0,230,118,.3);
}

.avatar img{

width:100%;

height:100%;

object-fit:cover;
}

.user-info{

flex:1;

min-width:0;
}

.user-name{

font-size:17px;

font-weight:bold;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;
}

.user-status{

font-size:11px;

color:#7d8985;

margin-top:4px;

transition:.2s ease;
}

.user-status.online{

color:#00e889;
}

.messages{

flex:1;

overflow-y:auto;

padding:
20px 15px
100px;

display:flex;

flex-direction:column;

gap:10px;

scroll-behavior:smooth;
}

.empty{

margin:auto;

text-align:center;

color:#72817c;

line-height:1.8;

font-size:14px;
}

.message{

max-width:78%;

padding:
11px 14px;

border-radius:18px;

font-size:15px;

line-height:1.5;

word-wrap:break-word;

overflow-wrap:anywhere;

white-space:pre-wrap;
}

.message.mine{

align-self:flex-start;

background:#00c96b;

color:#00150e;

border-bottom-left-radius:5px;
}

.message.other{

align-self:flex-end;

background:#18231f;

color:white;

border:
1px solid
rgba(255,255,255,.07);

border-bottom-right-radius:5px;
}

.time{

display:block;

font-size:9px;

opacity:.55;

margin-top:4px;
}

.input-area{

position:fixed;

bottom:0;

left:50%;

transform:
translateX(-50%);

width:100%;

max-width:650px;

padding:12px;

display:flex;

gap:9px;

background:
rgba(5,8,7,.97);

border-top:
1px solid
rgba(255,255,255,.08);

z-index:20;
}

#messageInput{

flex:1;

min-width:0;

padding:
14px 16px;

border-radius:17px;

border:
1px solid
rgba(255,255,255,.09);

outline:none;

background:#111916;

color:white;

font-family:inherit;

font-size:15px;

direction:rtl;
}

#messageInput:focus{

border-color:#00e676;

box-shadow:
0 0 0 3px
rgba(0,230,118,.07);
}

#messageInput::placeholder{

color:#63716d;
}

#sendButton{

width:52px;

height:52px;

border:none;

border-radius:17px;

background:#00e889;

color:#00150e;

font-size:22px;

cursor:pointer;

flex-shrink:0;
}

#sendButton:active{

transform:scale(.94);
}

#sendButton:disabled{

opacity:.5;

cursor:not-allowed;
}

.loading{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:15px;

background:#020504;

color:#a8bdb6;

font-size:15px;

z-index:100;
}

.error-screen{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

background:#020504;

text-align:center;

padding:30px;

z-index:200;
}

.error-box{

width:100%;

max-width:500px;

padding:30px;

border-radius:25px;

background:#0b100e;

border:
1px solid
rgba(255,255,255,.08);
}

.error-box h2{

font-size:25px;

margin-bottom:15px;
}

.error-box p{

color:#9aa7a3;

line-height:1.8;

font-size:14px;
}

.spinner{

width:35px;

height:35px;

border:
4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;
}

@keyframes spin{

to{

transform:rotate(360deg);

}

}

#voiceButton,
#callButton,
#videoButton{

width:45px;

height:45px;

border:none;

border-radius:15px;

background:#18231f;

color:white;

font-size:20px;

cursor:pointer;

flex-shrink:0;

}

#voiceButton:active,
#callButton:active,
#videoButton:active{

transform:scale(.94);

}

.call-buttons{

display:flex;

gap:4px;

margin-right:auto;

align-items:center;

}

.call-buttons button{

width:42px;

height:42px;

border:none;

border-radius:50%;

background:transparent;

color:white;

font-size:19px;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

}

.call-buttons button:active{

background:rgba(255,255,255,.08);

transform:scale(.94);

}

/* زر المزيد مثل واتساب */

#moreButton{

width:42px;

height:42px;

border:none;

border-radius:50%;

background:transparent;

color:#fff;

font-size:30px;

line-height:1;

cursor:pointer;

display:flex;

align-items:center;

justify-content:center;

font-family:Arial,Tahoma,sans-serif;

}

#moreButton:active{

background:rgba(255,255,255,.08);

transform:scale(.94);

}

/* قائمة الثلاث نقاط */

.top-more-menu{

position:absolute;

top:62px;

left:10px;

min-width:180px;

background:#23302c;

border:
1px solid
rgba(255,255,255,.08);

border-radius:10px;

box-shadow:
0 8px 30px
rgba(0,0,0,.5);

padding:6px;

z-index:2000;

}

.top-more-menu button{

display:block;

width:100%;

padding:12px 14px;

background:transparent;

border:none;

color:#fff;

text-align:right;

font-family:inherit;

font-size:14px;

border-radius:7px;

cursor:pointer;
}

.top-more-menu button:hover{

background:
rgba(255,255,255,.08);
}

.top-more-menu button:active{

background:
rgba(255,255,255,.12);
}

/* ===== Attachment button ===== */

#attachButton{

width:45px;

height:45px;

border:none;

border-radius:15px;

background:#18231f;

color:#fff;

font-size:28px;

line-height:1;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

flex:0 0 45px;
}

#attachButton:active{

transform:scale(.94);
}

.attach-menu{

position:absolute;

bottom:72px;

right:72px;

display:none;

flex-direction:column;

gap:7px;

padding:8px;

background:#111916;

border:1px solid rgba(255,255,255,.08);

border-radius:16px;

z-index:90;

box-shadow:
0 15px 35px
rgba(0,0,0,.45);
}

.attach-menu.show{

display:flex
}

.attach-menu button{

border:0;

background:#18231f;

color:#fff;

border-radius:12px;

padding:11px 14px;

font-family:inherit;

font-size:14px;

white-space:nowrap;

text-align:right;

cursor:pointer;
}

.attach-menu button:active{

transform:scale(.97)
}

.message-image{

display:block;

max-width:min(270px,100%);

max-height:360px;

width:auto;

height:auto;

border-radius:14px;

object-fit:cover;
}

.message-video{

display:block;

max-width:min(320px,100%);

max-height:420px;

width:auto;

height:auto;

border-radius:14px;

background:#000;
}

.media-message{

padding:7px;
}

.reply-box{

padding:7px 9px;

margin-bottom:7px;

border-right:
3px solid
rgba(0,0,0,.25);

background:
rgba(0,0,0,.12);

border-radius:9px;

font-size:11px;

opacity:.9;

max-width:100%;

overflow:hidden;
}

.reply-box strong{

display:block;

font-size:10px;

margin-bottom:2px;
}

.edited-mark{

font-size:9px;

opacity:.55;

margin-right:5px;
}

.reactions{

display:flex;

gap:4px;

flex-wrap:wrap;

margin-top:5px;
}

.reaction-btn{

border:
1px solid
rgba(255,255,255,.12);

background:
rgba(0,0,0,.12);

color:inherit;

border-radius:12px;

padding:2px 7px;

font-size:12px;

cursor:pointer;
}

.pinned-mark{

font-size:10px;

opacity:.7;

margin-top:4px;
}

#clearChatButton{

width:100%;

height:auto;

border:none;

border-radius:8px;

background:transparent;

color:#fff;

font-size:14px;

cursor:pointer;

flex-shrink:0;

padding:12px 14px;

text-align:right;
}

#clearChatButton:hover{

background:rgba(255,255,255,.08);
}

.reply-preview{

position:absolute;

bottom:72px;

left:12px;

right:12px;

max-width:calc(100% - 24px);

display:none;

align-items:center;

justify-content:space-between;

gap:10px;

padding:9px 12px;

background:#111916;

border:
1px solid
rgba(0,232,137,.2);

border-radius:14px;

z-index:25;
}

.reply-preview.show{

display:flex;
}

.reply-preview-text{

min-width:0;

font-size:12px;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;
}

.reply-preview-close{

border:0;

background:transparent;

color:#fff;

font-size:18px;

cursor:pointer;
}

.message-menu{

max-width:230px;
}

.message-menu button{

display:block;

width:100%;

margin:2px 0;
}

.message.image-message{

padding:7px;
}

/* ===== Voice message fixed layout ===== */

.message.voice-message{

width:min(340px,84%);

max-width:84%;

min-height:66px;

padding:8px 10px;

display:block;

overflow:hidden;
}

.voice-player{

width:100%;

min-width:0;

min-height:48px;

display:flex;

align-items:center;

gap:10px;
}

.voice-play{

width:42px;

height:42px;

flex:0 0 42px;

border:0;

border-radius:50%;

background:
rgba(255,255,255,.88);

color:#087b50;

font-size:17px;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;
}

.message.other .voice-play{

background:#00c96b;

color:#00150e;
}

.voice-body{

flex:1;

min-width:0;
}

.voice-row{

display:flex;

align-items:center;

gap:8px;

width:100%;
}

.voice-progress{

flex:1;

min-width:0;

width:100%;

height:5px;

accent-color:#00e889;

cursor:pointer;
}

.voice-duration{

min-width:38px;

font-size:10px;

opacity:.75;

direction:ltr;

text-align:center;
}

.message.voice-message .time{

margin-top:3px;
}

@media(max-width:480px){

.attach-menu{

right:58px;

bottom:68px;

max-width:calc(100vw - 75px)
}

header{

height:70px;

padding:
10px 13px;
}

.back{

width:43px;

height:43px;
}

.avatar{

width:45px;

height:45px;

border-radius:50%;
}

.user-name{

font-size:16px;
}

.messages{

padding:
15px 12px
100px;
}

.message{

max-width:84%;

font-size:14px;
}

.input-area{

padding:10px;
}

#messageInput{

font-size:14px;

padding:
13px 14px;
}

#sendButton{

width:50px;

height:50px;
}

#moreButton{

width:40px;

height:40px;

font-size:28px;
}

.call-buttons{

gap:1px;
}

.call-buttons button{

width:38px;

height:38px;
}

.top-more-menu{

top:59px;

left:8px;
}

}

#recordBox{

position:fixed;

bottom:75px;

left:50%;

transform:translateX(-50%);

background:#18231f;

padding:10px 15px;

border-radius:20px;

display:flex;

gap:10px;

align-items:center;

z-index:50;
}

#recordText{

color:#00e889;
}

#cancelRecord{

background:#ff3333;

color:white;

border:none;

border-radius:12px;

padding:6px 12px;
}

.message-menu{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

background:#111916;

border-radius:12px;

padding:8px;

z-index:999;
}

.message-menu button{

background:#18231f;

color:white;

border:none;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

font-size:14px;
}

.message-menu button:active{

transform:scale(.95);
}

.incoming-call{

position:fixed;

top:84px;

left:50%;

transform:translateX(-50%);

width:min(620px,calc(100% - 24px));

z-index:300;

background:#111916;

border:
1px solid
rgba(255,255,255,.1);

border-radius:20px;

padding:12px 14px;

box-shadow:
0 15px 45px
rgba(0,0,0,.45);

display:flex;

align-items:center;

justify-content:space-between;

gap:12px;
}

.incoming-call-info{

display:flex;

align-items:center;

gap:10px;

min-width:0;
}

.incoming-name{

font-weight:bold;

font-size:15px;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;
}

.incoming-type{

font-size:12px;

color:#9aa7a3;

margin-top:3px;
}

.incoming-actions{

display:flex;

gap:8px;

flex-shrink:0;
}

.incoming-actions button{

width:45px;

height:45px;

border:0;

border-radius:50%;

cursor:pointer;
}

.incoming-actions button:active{

transform:scale(.94);
}

.incoming-accept{

background:#00c96b;

color:#00150e;
}

.incoming-reject{

background:#ff3b30;

color:#fff;
}

.call-screen{

position:fixed;

inset:0;

background:#020504;

z-index:500;

display:none;

flex-direction:column;

align-items:center;

justify-content:center;

}

.call-screen.show{

display:flex;
}

.call-avatar{

width:90px;

height:90px;

border-radius:50%;

background:#12352c;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

font-size:40px;
}

.call-avatar img{

width:100%;

height:100%;

object-fit:cover;
}

.call-name{

font-size:22px;

font-weight:bold;

margin-top:15px;
}

.call-state{

font-size:13px;

color:#89958f;

margin-top:7px;
}

.call-timer{

font-size:13px;

color:#00e889;

margin-top:7px;
}

.call-controls{

display:flex;

gap:15px;

margin-top:45px;
}

.call-controls button{

width:58px;

height:58px;

border:0;

border-radius:50%;

background:#18231f;

color:#fff;

font-size:22px;

cursor:pointer;
}

.call-controls .end{

background:#ff3b30;

}

.video-stage{

position:absolute;

inset:0;

background:#000;

display:none;
}

.video-stage.show{

display:block;
}

#remoteVideo{

width:100%;

height:100%;

object-fit:cover;
}

#localVideo{

position:absolute;

top:20px;

right:20px;

width:120px;

height:170px;

object-fit:cover;

border-radius:15px;

border:2px solid rgba(255,255,255,.2);

display:none;

z-index:5;
}

.video-stage-controls{

position:absolute;

bottom:30px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:15px;

z-index:10;
}

.video-stage-controls button{

width:55px;

height:55px;

border:0;

border-radius:50%;

background:#18231f;

color:#fff;

font-size:20px;
}

#remoteAudioCall{

display:none;
}

.video-request{

position:fixed;

bottom:100px;

left:50%;

transform:translateX(-50%);

width:min(400px,calc(100% - 30px));

background:#111916;

border:
1px solid
rgba(255,255,255,.1);

border-radius:18px;

padding:15px;

z-index:700;

display:none;

}

.video-request-text{

font-size:13px;

line-height:1.6;

margin-bottom:12px;
}

.video-request-actions{

display:flex;

gap:8px;
}

.video-request-actions button{

flex:1;

height:42px;

border:0;

border-radius:12px;

font-family:inherit;

cursor:pointer;
}

#acceptVideoRequest{

background:#00c96b;

color:#00150e;
}

#rejectVideoRequest{

background:#18231f;

color:#fff;
}

</style>

</head>

<body>

<div
id="loading"
class="loading"
>

<div class="spinner"></div>

<div>
جارٍ فتح الدردشة...
</div>

</div>


<main
id="app"
class="app"
style="display:none"
>

<header>

<button
id="backButton"
class="back"
type="button"
>
←
</button>


<div
id="friendAvatar"
class="avatar"
>
👤
</div>


<div class="user-info">

<div
id="friendName"
class="user-name"
>
جارٍ التحميل...
</div>

<div
id="friendStatus"
class="user-status"
>
● غير متصل
</div>

</div>


<div class="call-buttons">

<button
id="callButton"
type="button"
aria-label="مكالمة صوتية"
title="مكالمة صوتية"
>
</button>

<button
id="videoButton"
type="button"
aria-label="مكالمة فيديو"
title="مكالمة فيديو"
>
</button>

<button
id="moreButton"
type="button"
aria-label="المزيد"
title="المزيد"
>
⋮
</button>

</div>


<div
id="topMoreMenu"
class="top-more-menu"
hidden
>

<button
id="clearChatButton"
type="button"
>
مسح المحادثة
</button>

<button
id="searchChatButton"
type="button"
>
بحث
</button>

</div>

</header>


<div
id="messages"
class="messages"
>

<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>

</div>


<div
id="attachMenu"
class="attach-menu"
>

<button
id="galleryButton"
type="button"
>
🖼️ صورة أو فيديو
</button>

<button
id="cameraButton"
type="button"
>
📷 كاميرا
</button>

</div>


<input
id="galleryInput"
type="file"
accept="image/*,video/*"
style="display:none"
>

<input
id="cameraInput"
type="file"
accept="image/*,video/*"
capture="environment"
style="display:none"
>


<div
id="replyPreview"
class="reply-preview"
>

<div
id="replyPreviewText"
class="reply-preview-text"
>
</div>

<button
id="replyPreviewClose"
class="reply-preview-close"
type="button"
>
×
</button>

</div>


<div
id="recordBox"
style="display:none"
>

<span id="recordText">
🎤 يسجل صوت…
</span>

<span id="recordTime">
00:00
</span>

<button
id="cancelRecord"
type="button"
>
إلغاء
</button>

</div>


<div class="input-area">

<button
id="attachButton"
type="button"
aria-label="إرفاق"
>
＋
</button>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>

<button
id="voiceButton"
type="button"
aria-label="تسجيل صوت"
>
🎤
</button>

<button
id="sendButton"
type="button"
>
➤
</button>

</div>

</main>


<div
id="incomingCall"
class="incoming-call"
style="display:none"
>

<div class="incoming-call-info">

<div
id="incomingAvatar"
class="call-avatar"
>
👤
</div>

<div>

<div
id="incomingName"
class="incoming-name"
>
مكالمة
</div>

<div
id="incomingType"
class="incoming-type"
>
مكالمة صوتية
</div>

</div>

</div>

<div class="incoming-actions">

<button
id="acceptIncoming"
class="incoming-accept"
type="button"
>
✓
</button>

<button
id="rejectIncoming"
class="incoming-reject"
type="button"
>
×
</button>

</div>

</div>


<div
id="callScreen"
class="call-screen"
>

<div
id="videoStage"
class="video-stage"
>

function escapeHtml(value){

return String(value??"").replace(
/[&<>'"]/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);

}


function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

function listenFriendStatus(){

if(!friendUser)
return;

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

const ref=
doc(db,"users",friendUser.uid);

unsubscribeFriendStatus=
onSnapshot(
ref,
snap=>{

if(!snap.exists()){

friendStatus.textContent="● غير متصل";

friendStatus.classList.remove("online");

return;

}

const data=snap.data();

const lastSeen=
data.lastSeen?.toMillis?.()||0;

const online=
data.online===true&&
lastSeen>0&&
Date.now()-lastSeen<30000;

if(online){

friendStatus.textContent="● متصل";

}else{

friendStatus.textContent=
data.lastSeen?.toDate
?
"آخر ظهور "+data.lastSeen.toDate().toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
)
:
"● غير متصل";

}

friendStatus.classList.toggle(
"online",
online
);

},
error=>{
console.error(
"Friend status error:",
error
);
}
);

}

async function toggleReaction(
messageId,
emoji
){

if(
!currentUser||
!chatID||
!messageId||
!emoji
)
return;

try{

const messageRef=
doc(
db,
"chats",
chatID,
"messages",
messageId
);

const snap=
await getDoc(messageRef);

if(!snap.exists())
return;

const data=snap.data();

const reactions=
Array.isArray(data.reactions)
?
data.reactions
:
[];

const mine=
reactions.some(
r=>
r&&
r.userId===currentUser.uid&&
r.emoji===emoji
);

if(mine){

await updateDoc(
messageRef,
{
reactions:
arrayRemove(
{
userId:currentUser.uid,
emoji
}
)
}
);

}else{

const oldMine=
reactions.find(
r=>
r&&
r.userId===currentUser.uid
);

if(oldMine){

await updateDoc(
messageRef,
{
reactions:
arrayRemove(oldMine)
}
);

}

await updateDoc(
messageRef,
{
reactions:
arrayUnion(
{
userId:currentUser.uid,
emoji
}
)
}
);

}

}catch(error){

console.error(
"Reaction error:",
error
);

}

}

const wrapper=

data.reactions.forEach(
reaction=>{

if(
!reaction||
!reaction.emoji
)
return;

if(!counts[reaction.emoji]){

counts[reaction.emoji]={
count:0,
mine:false
};

}

counts[reaction.emoji].count++;

if(
reaction.userId===
currentUser.uid
){

counts[reaction.emoji].mine=true;

}

}
);

reactionList.forEach(
emoji=>{

const info=counts[emoji];

if(!info)
return;

const button=
document.createElement("button");

button.type="button";

button.className=
"reaction-btn";

button.innerHTML=
escapeHtml(emoji)+
(info.count>1
?
` ${info.count}`
:
"");

button.onclick=
e=>{

e.stopPropagation();

toggleReaction(
data.id,
emoji
);

};

wrapper.appendChild(button);

}
);

box.appendChild(wrapper);

}

function formatSeconds(value){

if(!Number.isFinite(value))
return "00:00";

const seconds=
Math.max(
0,
Math.floor(value)
);

return String(
Math.floor(seconds/60)
).padStart(2,"0")
+
":"
+
String(
seconds%60
).padStart(2,"0");

}

function addMessageActions(
messageElement,
data
){

let pressTimer=null;

let longPress=false;

messageElement.addEventListener(
"pointerdown",
e=>{

if(
e.target.closest(
"button,input,video"
)
)
return;

longPress=false;

pressTimer=
setTimeout(
()=>{

longPress=true;

showMessageMenu(
messageElement,
data
);

},
500
);

}
);

messageElement.addEventListener(
"pointerup",
()=>{

clearTimeout(
pressTimer
);

}
);

messageElement.addEventListener(
"pointercancel",
()=>{

clearTimeout(
pressTimer
);

}
);

messageElement.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

showMessageMenu(
messageElement,
data
);

}
);


let lastTap=0;

messageElement.addEventListener(
"click",
e=>{

if(longPress)
return;

if(
e.target.closest(
"button,input,video,.reply-box,.message-menu"
)
)
return;

const now=Date.now();

if(
now-lastTap<
300&&
now-lastTap>0
){

toggleReaction(
data.id,
"❤️"
);

}

lastTap=now;

}
);

}


function renderMessages(
snapshot
){

const nearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<
120;


messages
.querySelectorAll(
".message"
)
.forEach(
el=>el.remove()
);


const docs=
snapshot.docs.filter(
docSnap=>{

const data=docSnap.data();

return !(
Array.isArray(data.deletedFor)&&
data.deletedFor.includes(
currentUser.uid
)
);

}
);


const empty=
messages.querySelector(".empty");

if(empty)
empty.remove();


if(!docs.length){

const emptyBox=
document.createElement("div");

emptyBox.className="empty";

emptyBox.innerHTML=
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(
emptyBox
);

return;

}


docs.forEach(
docSnap=>{

const data={
...docSnap.data(),
id:docSnap.id
};

messages.appendChild(
renderMessage(data)
);

}
);


if(nearBottom){

requestAnimationFrame(
()=>messages.scrollTop=
messages.scrollHeight
);

}

}

async function sendMessage(){

const text=
messageInput.value.trim();

if(
!text||
!currentUser||
!friendUser||
!chatID
)
return;

sendButton.disabled=true;

try{

if(editingMessageId){

await updateDoc(
doc(
db,
"chats",
chatID,
"messages",
editingMessageId
),
{
text,
isEdited:true
}
);

editingMessageId=null;

sendButton.textContent="➤";

}else{

const data={

text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type:"text",

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

};

if(replyTarget){

data.replyTo={

messageId:
replyTarget.id,

senderId:
replyTarget.senderId,

senderName:
replyTarget.senderName,

text:
replyTarget.text

};

}

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
data
);

await setDoc(
doc(
db,
"chats",
chatID
),
{
lastMessage:text,

lastMessageAt:
serverTimestamp(),

lastSenderId:
currentUser.uid
},
{
merge:true
}
);

}

messageInput.value="";

cancelReply();

}catch(error){

console.error(
"Send message error:",
error
);

alert(
"تعذر إرسال الرسالة:\n"+
error.message
);

}finally{

sendButton.disabled=false;

}

}

"click",

async function clearMyChat(){

if(
!currentUser||
!chatID
)
return;

const confirmed=
confirm(
"هل تريد حذف الرسائل من جهازك؟"
);

if(!confirmed)
return;

try{

const q=
query(
collection(
db,
"chats",
chatID,
"messages"
)
);

const snap=
await new Promise(
(resolve,reject)=>{

const unsub=
onSnapshot(
q,
s=>{
unsub();
resolve(s);
},
reject
);

}
);

const tasks=[];

snap.docs.forEach(
messageDoc=>{

const data=
messageDoc.data();

if(
Array.isArray(data.deletedFor)&&
data.deletedFor.includes(
currentUser.uid
)
)
return;

if(
data.senderId===
currentUser.uid
){

tasks.push(
deleteDoc(messageDoc.ref)
);

}else{

tasks.push(
updateDoc(
messageDoc.ref,
{
deletedFor:
arrayUnion(
currentUser.uid
)
}
)
);

}

}
);

await Promise.all(tasks);

}catch(error){

console.error(
"Clear chat error:",
error
);

alert(
"تعذر مسح المحادثة"
);

}

}

async function ensureMedia(
needVideo=false
){

if(!navigator.mediaDevices?.getUserMedia){

throw new Error(
"المتصفح لا يدعم المكالمات"
);

}

if(!localStream){

localStream=
await navigator.mediaDevices.getUserMedia(
{
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
},
video:needVideo
}
);

}else{

if(
needVideo&&
!localStream.getVideoTracks().length
){

const cam=
await navigator.mediaDevices.getUserMedia(
{
video:{
facingMode:"user"
}
}
);

localStream.addTrack(
cam.getVideoTracks()[0]
);

}

}

if(pc){

for(
const track of localStream.getTracks()
){

const sender=
pc.getSenders().find(
s=>s.track?.kind===track.kind
);

if(!sender){

pc.addTrack(
track,
localStream
);

}else if(
track.kind==="video"&&
sender.track!==track
){

await sender.replaceTrack(track);

}

}

}

if(
localStream.getVideoTracks().length
){

$("localVideo").srcObject=
localStream;

$("localVideo").style.display=
"block";

}

}


async function flushCandidates(){

if(
!pc?.remoteDescription
)
return;

const list=
pendingCandidates.splice(0);

for(
const candidate of list
){

try{

await pc.addIceCandidate(
candidate
);

}catch(error){

console.warn(
"ICE queued",
error
);

}

}

}


async function addRemoteCandidate(
candidate,
id
){

if(
!candidate||
addedCandidates.has(id)
)
return;

addedCandidates.add(id);

if(
!pc?.remoteDescription
){

pendingCandidates.push(
candidate
);

return;

}

try{

await pc.addIceCandidate(
candidate
);

}catch(error){

console.warn(
"ICE",
error
);

}

}


function createPeer(){

pc=
new RTCPeerConnection(
rtcConfig
);

pc.onicecandidate=
async event=>{

if(
!event.candidate||
!callId||
!me
)
return;

try{

await addDoc(
collection(
db,
"calls",
callId,
"candidates"
),
{

senderId:
me.uid,

candidate:
event.candidate.toJSON(),

createdAt:
serverTimestamp()

}
);

}catch(error){

console.error(
"ICE save",
error
);

}

};


pc.ontrack=
event=>{

const stream=
event.streams?.[0]||
remoteStream||
new MediaStream();

remoteStream=stream;

if(
event.track.kind==="audio"
){

const audio=
$("remoteAudioCall");

audio.srcObject=stream;

audio.muted=remoteMuted;

audio.play().catch(
()=>{}
);

}

if(
event.track.kind==="video"
){

const video=
$("remoteVideo");

video.srcObject=stream;

video.muted=true;

showVideoStage();

video.play().catch(
()=>{}
);

}

};


pc.onconnectionstatechange=
()=>{

if(!pc)
return;

if(
pc.connectionState==="connected"
){

connected=true;

if(!callStartedAt)
startTimer();

state(
callData?.videoAccepted===true||
callData?.callType==="video"
?
"● متصل • فيديو"
:
"● متصل"
);

}

if(
["failed","closed"].includes(
pc.connectionState
)&&
!ending
){

finishCall(
"ended"
).catch(
()=>{}
);

}

};

return pc;

}

async function finishCall(
status="ended",
remote=false
){

if(ending&&
!remote)
return;

ending=true;

stopTimer();

try{

if(
callId&&
!remote
){

await updateDoc(
doc(
db,
"calls",
callId
),
{

status,

duration:callSeconds,

endedAt:
serverTimestamp()

}
);

}

}catch(error){

console.error(
"Finish call error:",
error
);

}


try{

await saveCallMessage(
status,
callSeconds
);

}catch(error){

console.error(
error
);

}


stopCallWatch?.();

stopIncomingWatch?.();

if(pc){

pc.close();

pc=null;

}

if(localStream){

localStream
.getTracks()
.forEach(
track=>track.stop()
);

localStream=null;

}

remoteStream=null;

pendingCandidates=[];

addedCandidates.clear();

connected=false;

hideCallScreen();

hideIncoming();

callId=null;

callData=null;

role=null;

ending=false;

}

){

)

);

);

);

async function watchCandidates(){

if(!callId)
return;

const q=
query(
collection(
db,
"calls",
callId,
"candidates"
)
);

onSnapshot(
q,
snap=>{

snap.docChanges().forEach(
change=>{

if(change.type!=="added")

const data=
change.doc.data();

if(
data.senderId===
me?.uid
)
return;

addRemoteCandidate(
new RTCIceCandidate(
data.candidate
),
change.doc.id
);

}
);

}
);

}

async function handleUpgradeOffer(
d
){

if(
!pc||
role!=="receiver"
||
!d.upgradeOffer||
lastUpgradeOffer===
d.upgradeOffer.sdp
)
return;

lastUpgradeOffer=
d.upgradeOffer.sdp;

try{

await ensureMedia(true);

await pc.setRemoteDescription(
new RTCSessionDescription(
d.upgradeOffer
)
);

await flushCandidates();

const answer=
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await updateDoc(
doc(
db,
"calls",
callId
),
{

upgradeAnswer:{
type:answer.type,
sdp:answer.sdp
},

videoAccepted:true,

callType:"video"

}
);

callData.callType="video";

showVideoStage();

state(
"● متصل • فيديو"
);

);

}

}

d
){

async function watchCall(){

if(!callId)
return;

stopCallWatch?.();

stopCallWatch=
onSnapshot(
doc(
db,
"calls",
callId
),
async snap=>{

if(!snap.exists()){

await finishCall(
"ended",
true
);

return;

}

const d=snap.data();

callData={
...(callData||{}),
...d
};


if(
[
"rejected",
"cancelled",
"missed",
"ended"
].includes(
d.status
)
){

const duration=
Number(
d.duration||0
);

callSeconds=
duration;

connected=
d.status==="ended"&&
duration>0;

await finishCall(
d.status,
true
);

return;

}


if(
d.status==="connected"
){

connected=true;

const start=
d.connectedAt?.toMillis?.()||
Date.now();

if(!callStartedAt)
startTimer(start);

state(
d.videoAccepted===true||
d.callType==="video"
?
"● متصل • فيديو"
:
"● متصل"
);

}


if(
d.answer?.sdp&&
role==="caller"&&
pc&&
!pc.currentRemoteDescription
){

try{

await pc.setRemoteDescription(
new RTCSessionDescription(
d.answer
)
);

await flushCandidates();

connected=true;

if(!callStartedAt)
startTimer(
d.connectedAt?.toMillis?.()||
Date.now()
);

}catch(error){

console.error(
"answer",
error
);

}

}


if(
d.videoRequestStatus==="pending"
)
await handleVideoRequest(d);


if(
d.videoRequestStatus==="rejected"&&
role==="caller"
){

state(
"تم رفض طلب الفيديو"
);

}


if(
d.videoRequestStatus==="accepted"&&
role==="caller"
){

await callerStartUpgrade(d);

}


if(
d.upgradeOffer&&
d.upgradeOffer.sdp!==lastUpgradeOffer&&
role==="receiver"
){

await handleUpgradeOffer(d);

}


if(
d.upgradeAnswer&&
d.upgradeAnswer.sdp!==lastUpgradeAnswer&&
role==="caller"&&
pc
){

lastUpgradeAnswer=
d.upgradeAnswer.sdp;

try{

await pc.setRemoteDescription(
new RTCSessionDescription(
d.upgradeAnswer
)
);

await flushCandidates();

callData.videoAccepted=true;

callData.callType="video";

showVideoStage();

state(
"● متصل • فيديو"
);

}catch(error){

console.error(
"upgrade answer",
error
);

}

}


if(
d.callType==="video"||
d.videoAccepted===true
){

if(
localStream?.getVideoTracks().length
){

$("localVideo").style.display=
"block";

}

showVideoStage();

}

}
);


}

);

){

);

callData.offer
)
);

const answer=
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await updateDoc(
doc(
db,
"calls",
id
),
{

answer:{
type:answer.type,
sdp:answer.sdp
},

status:"connected",

connectedAt:
serverTimestamp()

}
);

showCallScreen(
callData.callType
);

startTimer();

watchCall();

watchCandidates();

}catch(error){

console.error(
"accept",
error
);

alert(
"تعذر قبول المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await finishCall(
"rejected"
).catch(
()=>{}
);

}

}


async function rejectIncoming(){

if(!callId)
return;

stopAllTones();

const id=callId;

try{

await updateDoc(
doc(
db,
"calls",
id
),
{

status:"rejected",

duration:0,

endedAt:
serverTimestamp()

}
);

}catch(error){

console.error(error);

}

hideIncoming();

callId=null;

callData=null;

role=null;

}


function hideIncoming(){

$("incomingCall").style.display=
"none";

}


function renderIncoming(
id,
data
){

if(
callId||
ending
)
return;

callId=id;

callData=data;

role="receiver";

connected=false;

$("incomingName").textContent=
data.callerName||
"مستخدم Mecd";

$("incomingType").textContent=
data.callType==="video"
?
"مكالمة فيديو"
:
"مكالمة صوتية";

setAvatar(
$("incomingAvatar"),
data.callerPhoto||
""
);

$("incomingCall").style.display=
"flex";

toneStart("incoming");

}


function listenIncoming(){

if(!me)
return;

stopIncomingWatch?.();

const q=
query(
collection(db,"calls"),
where(
"receiverId",
"==",
me.uid
),
where(
"status",
"==",
"ringing"
)
);

stopIncomingWatch=
onSnapshot(
q,
snap=>{

for(
const change of
snap.docChanges()
){

const data=
change.doc.data();

const id=
change.doc.id;

if(
change.type==="added"
){

const created=
data.createdAt?.toMillis?.()||
0;

if(
created&&
Date.now()-created>35000
){

updateDoc(
doc(
db,
"calls",
id
),
{

status:"missed",

duration:0,

endedAt:
serverTimestamp()

}
).catch(
()=>{}
);

continue;

}

renderIncoming(
id,
data
);

}

}

if(
callId&&
role==="receiver"
){

const exists=
snap.docs.some(
docSnap=>
docSnap.id===callId
);

if(
!exists&&
$("incomingCall").style.display!=="none"
){

hideIncoming();

callId=null;

callData=null;

role=null;

stopAllTones();

}

}

}
);

}


$("callButton")?.addEventListener(
"click",
()=>createInitialCall(
"audio"
)
);


$("videoButton")?.addEventListener(
"click",
()=>createInitialCall(
"video"
)
);


$("switchVideo")?.addEventListener(
"click",
startVideoUpgrade
);


$("acceptVideoRequest")?.addEventListener(
"click",
acceptVideoRequest
);


$("rejectVideoRequest")?.addEventListener(
"click",
rejectVideoRequest
);


$("acceptIncoming")?.addEventListener(
"click",
acceptIncoming
);


$("rejectIncoming")?.addEventListener(
"click",
rejectIncoming
);


$("endCall")?.addEventListener(
"click",
()=>finishCall(
connected
?
"ended"
:
"cancelled"
)
);


$("endCallNormal")?.addEventListener(
"click",
()=>finishCall(
connected
?
"ended"
:
"cancelled"
)
);


$("muteCall")?.addEventListener(
"click",
()=>{

const tracks=
localStream?.getAudioTracks()||
[];

if(!tracks.length)
return;

const enabled=
!tracks[0].enabled;

tracks.forEach(
track=>
track.enabled=enabled
);

$("muteCall").textContent=
enabled
?
"🎤"
:
"🔇";

}
);


$("muteCallNormal")?.addEventListener(
"click",
()=>{

const tracks=
localStream?.getAudioTracks()||
[];

if(!tracks.length)
return;

const enabled=
!tracks[0].enabled;

tracks.forEach(
track=>
track.enabled=enabled
);

$("muteCallNormal").textContent=
enabled
?
"🎤"
:
"🔇";

}
);


window.addEventListener(
"pagehide",
()=>{

if(
callId&&
role==="caller"&&
!ending
){

finishCall(
connected
?
"ended"
:
"cancelled"
).catch(
()=>{}
);

}

}
);


window.addEventListener(
"beforeunload",
()=>{

stopAllTones();

}
);


async function init(){

onAuthStateChanged(
auth,
async user=>{

if(!user)
return;

me=user;

const fid=
new URLSearchParams(
location.search
).get("friend");

if(!fid)
return;

const f=
await getDoc(
doc(db,"users",fid)
);

if(!f.exists())
return;

const data=f.data();

friend={

uid:fid,

name:
data.name||
"مستخدم Mecd",

photo:
data.photo||
data.photoURL||
""

};

listenIncoming();

ensureCallUI();

window.MecdCall={

start:createInitialCall,

requestVideo:
startVideoUpgrade

};

}
);

}


init();

</script>


<script type="module">

const vBtn=
document.getElementById(
"voiceButton"
);

const rBox=
document.getElementById(
"recordBox"
);

const rText=
document.getElementById(
"recordText"
);

const rTime=
document.getElementById(
"recordTime"
);

const rCancel=
document.getElementById(
"cancelRecord"
);


let vRec=null;

let vStream=null;

let vChunks=[];

let vCancelled=false;

let vTimer=null;

let vStart=0;


function resetVoice(){

rBox.style.display=
"none";

rTime.textContent=
"00:00";

vBtn?.classList.remove(
"recording"
);

clearInterval(
vTimer
);

vTimer=null;

}


async function startVoice(){

if(vRec)
return;

try{

vStream=
await navigator.mediaDevices.getUserMedia(
{
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
}
}
);

vChunks=[];

vCancelled=false;

vRec=
new MediaRecorder(
vStream
);

vRec.ondataavailable=
event=>{

if(event.data.size)
vChunks.push(
event.data
);

};


vRec.onstop=
async()=>{

const rec=vRec;

vRec=null;

vStream
?.getTracks()
.forEach(
track=>
track.stop()
);

vStream=null;

clearInterval(
vTimer
);

vTimer=null;

rBox.style.display=
"none";

rTime.textContent=
"00:00";

vBtn?.classList.remove(
"recording"
);


if(vCancelled){

vChunks=[];

return;

}


const blob=
new Blob(
vChunks,
{
type:
rec?.mimeType||
"audio/webm"
}
);

vChunks=[];


if(
blob.size>700000
){

alert(
"التسجيل طويل جدًا، سجل مقطعًا أقصر"
);

return;

}


const reader=
new FileReader();


reader.onload=
async()=>{

if(
!me||
!friend||
!chatID
)
return;

try{

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
{

type:"voice",

audio:
reader.result,

mimeType:
blob.type,

text:
"🎤 تسجيل صوتي",

senderId:
me.uid,

receiverId:
friend.uid,

createdAt:
serverTimestamp(),

deletedFor:[]

}
);

await setDoc(
doc(
db,
"chats",
chatID
),
{

lastMessage:
"🎤 تسجيل صوتي",

lastMessageAt:
serverTimestamp(),

lastSenderId:
me.uid

},
{
merge:true
}
);

}catch(error){

console.error(
error
);

alert(
"تعذر إرسال التسجيل"
);

}

};


reader.readAsDataURL(
blob
);

};


vRec.start();

rBox.style.display=
"flex";

rText.textContent=
"🎤 يسجل صوت…";

vBtn.classList.add(
"recording"
);

vStart=Date.now();

vTimer=
setInterval(
()=>{

const seconds=
Math.floor(
(Date.now()-vStart)/1000
);

rTime.textContent=
String(
Math.floor(seconds/60)
).padStart(2,"0")
+
":"
+
String(
seconds%60
).padStart(2,"0");

},
500
);

}catch(error){

console.error(
error
);

alert(
"اسمح للمتصفح باستخدام الميكروفون لإرسال تسجيل صوتي"
);

resetVoice();

}

}


function cancelVoice(){

if(!vRec)
return;

vCancelled=true;

vRec.stop();

}


vBtn?.addEventListener(
"click",
()=>{

if(vRec)
vRec.stop();

else
startVoice();

}
);


rCancel?.addEventListener(
"click",
event=>{

event.preventDefault();

event.stopPropagation();

cancelVoice();

}
);

</script>

</body>

</html>
