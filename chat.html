/* ======================================================
RINGTONE
====================================================== */

let ringtoneContext = null;
let ringtoneTimer = null;
let ringtoneGain = null;

function startRingtone(){

stopRingtone();

try{

ringtoneContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

ringtoneGain =
ringtoneContext.createGain();

ringtoneGain.gain.value = .06;

ringtoneGain.connect(
ringtoneContext.destination
);

const playTone = () => {

if(!ringtoneContext)
return;

const osc =
ringtoneContext.createOscillator();

osc.type = "sine";
osc.frequency.value = 880;

osc.connect(ringtoneGain);

osc.start();

osc.stop(
ringtoneContext.currentTime + .35
);

};

playTone();

ringtoneTimer =
setInterval(
playTone,
1200
);

}catch(e){

console.warn(
"Ringtone:",
e
);

}

}

function stopRingtone(){

if(ringtoneTimer){

clearInterval(ringtoneTimer);
ringtoneTimer = null;

}

if(ringtoneContext){

try{
ringtoneContext.close();
}catch{}

ringtoneContext = null;

}

ringtoneGain = null;

}


/* ======================================================
HELPERS
====================================================== */

function createChatID(a,b){

return [
a,
b
]
.sort()
.join("_");

}

function escapeHtml(value){

return String(value ?? "")
.replace(
/[&<>'"]/g,
c => ({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[c])
);

}

function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

function formatDuration(seconds){

seconds =
Math.max(
0,
Math.floor(
Number(seconds || 0)
)
);

const m =
Math.floor(seconds / 60);

const s =
seconds % 60;

return (
String(m).padStart(2,"0") +
":" +
String(s).padStart(2,"0")
);

}

/* ======================================================
PRESENCE
====================================================== */

async function updateMyPresence(online = true){

if(!currentUser)
return;

try{

await setDoc(
doc(
db,
"users",
currentUser.uid
),
{
online,
lastSeen:
serverTimestamp()
},
{
merge:true
}
);

}catch(e){

console.error(
"Presence:",
e
);

}

}

function startPresence(){

updateMyPresence(true);

clearInterval(
presenceInterval
);

presenceInterval =
setInterval(
() => {

if(
document.visibilityState ===
"visible"
){

updateMyPresence(true);

}

},
10000
);

}

function stopPresence(){

clearInterval(
presenceInterval
);

presenceInterval = null;

updateMyPresence(false);

}


/* ======================================================
FRIEND
====================================================== */

async function loadFriend(){

const friendId =
new URLSearchParams(
location.search
).get("friend");

if(!friendId)
throw new Error(
"لا يوجد صديق في الرابط"
);

if(friendId === currentUser.uid)
throw new Error(
"لا يمكنك فتح محادثة مع نفسك"
);

const snap =
await getDoc(
doc(
db,
"users",
friendId
)
);

if(!snap.exists())
throw new Error(
"المستخدم غير موجود"
);

const data =
snap.data();

friendUser = {

uid: friendId,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
""

};

friendName.textContent =
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);

chatID =
createChatID(
currentUser.uid,
friendUser.uid
);

await setDoc(
doc(
db,
"chats",
chatID
),
{
members:[
currentUser.uid,
friendUser.uid
],

friendStatus.classList.add(
"typing"
);

return;

}

if(friendOnline){

friendStatus.textContent =
"● متصل";

friendStatus.classList.add(
"online"
);

}else{

friendStatus.textContent =
"● غير متصل";

}

}

function listenFriendStatus(){

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

unsubscribeFriendStatus =
onSnapshot(
doc(
db,
"users",
friendUser.uid
),
snap => {

if(!snap.exists()){

friendOnline = false;
renderFriendStatus();
return;

}

const data =
snap.data();

const last =
data.lastSeen?.toMillis?.() || 0;

friendOnline =
data.online === true &&
last > 0 &&
Date.now() - last < 30000;

renderFriendStatus();

}
);

}


/* ======================================================
NEW: FRIEND ACTIVITY
====================================================== */

function listenFriendActivity(){

if(unsubscribeFriendActivity)
unsubscribeFriendActivity();

unsubscribeFriendActivity =
onSnapshot(
doc(
db,
"chats",
chatID,
"typing",
friendUser.uid
),
snap => {

if(!snap.exists()){

friendTyping = false;
friendRecording = false;

renderFriendStatus();

return;

}

const data =
snap.data();

const updated =
data.updatedAt?.toMillis?.() || 0;

const fresh =
!updated ||
Date.now() - updated < 5000;

friendRecording =
fresh &&
data.recording === true;

friendTyping =
fresh &&
data.typing === true &&
!friendRecording;

renderFriendStatus();

}
);

}

);

() => {

fill.style.width =

time.textContent =
"00:00";

}
);

"loadedmetadata",
() => {

if(
Number.isFinite(
audio.duration
)
){

time.textContent =
formatDuration(
audio.duration
);

}

}
);


/* تقدم الصوت */

audio.addEventListener(
"timeupdate",
() => {

if(
Number.isFinite(
audio.duration
) &&
audio.duration > 0
){

const percent =
(
audio.currentTime /
audio.duration
) * 100;

fill.style.width =
percent + "%";

time.textContent =
formatDuration(
audio.currentTime
);

}

}
);


/* الضغط على شريط الصوت */

progress.addEventListener(
"click",
e => {

e.stopPropagation();

if(
!audio.duration ||
!Number.isFinite(
audio.duration
)
)
return;

const rect =
progress.getBoundingClientRect();

const percent =
Math.min(
1,
Math.max(
0,
(e.clientX - rect.left) /
rect.width
)
);

audio.currentTime =
audio.duration * percent;

}
);

}

const messageElements =

function renderMessages(snapshot){

messages.scrollHeight -

messages.clientHeight < 120;

snapshot.docChanges()
.forEach(
change => {

const id =
change.doc.id;

const data =
change.doc.data();

if(change.type === "removed"){

messageElements
.get(id)
?.remove();

messageElements.delete(id);

return;

}

if(
Array.isArray(
data.deletedFor
) &&
data.deletedFor.includes(
currentUser.uid
)
)
return;

if(
data.senderId !==
currentUser.uid
){

markRead(
id,
data
);

}

const box =
document.createElement(
"div"
);

box.className =
"message " +
(
data.senderId ===
currentUser.uid
? "mine"
: "other"
);

if(data.type === "call"){

createCallMessage(
box,
data
);

}else if(
data.type === "voice"
){

createVoiceMessage(
box,
data
);

}else{

box.appendChild(
document.createTextNode(
data.text || ""
)
);

}

const meta =
document.createElement(
"div"
);

meta.className =
"message-meta";

const time =
document.createElement(
"span"
);

time.className =
"time";

time.textContent =
formatTime(
data.createdAt
);

meta.appendChild(
time
);

const status =
createStatus(
data
);

if(status)
meta.appendChild(
status
);

box.appendChild(
meta
);

if(
data.type !== "call"
){

addMessageActions(
box,
id,
data.senderId ===
currentUser.uid
);

}

const old =
messageElements.get(
id
);

if(old){

old.replaceWith(
box
);

}else{

messages.appendChild(
box
);

}

messageElements.set(
id,
box
);

}
);

const all =
messages.querySelectorAll(
".message"
);

const empty =
messages.querySelector(
".empty"
);

if(all.length){

empty?.remove();

}else if(!empty){

const e =
document.createElement(
"div"
);

e.className =
"empty";

e.innerHTML =
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(e);

}

if(nearBottom){

requestAnimationFrame(
() => {

messages.scrollTop =
messages.scrollHeight;

}
);

}

}

/* ======================================================
PEER
====================================================== */

function createPeer(){

const pc =
new RTCPeerConnection(
rtcConfig
);

pc.onicecandidate =
async e => {

if(
!e.candidate ||
!activeCallId ||
!currentUser
)
return;

try{

await addDoc(
collection(
db,
"calls",
activeCallId,
"candidates"
),
{
senderId:
currentUser.uid,
candidate:
e.candidate.toJSON(),
createdAt:
serverTimestamp()
}
);

}catch(error){

console.error(
"ICE save:",
error
);

}

};

pc.ontrack = e => {

const stream =
e.streams?.[0];

if(!stream)
return;

remoteAudio.srcObject =
stream;

const hasVideo =
stream
.getVideoTracks()
.some(
t =>
t.readyState !==
"ended"
);

if(hasVideo){

remoteVideo.srcObject =
stream;

remoteVideo.muted = true;

remoteVideo.style.display =
"block";

remoteAvatar.style.display =
"none";

videoArea.style.display =
"block";

audioCallView.style.display =
"none";

remoteVideo
.play()
.catch(
()=>{}
);

}else{

playRemoteAudio();

}

};

pc.onconnectionstatechange =
async () => {

const state =
pc.connectionState;

if(state === "connected"){

stopOutgoingTimeout();

callState.textContent =
"متصل";

showConnectedButtons();

startCallTimer();

await playRemoteAudio();

}

if(state === "connecting"){

callState.textContent =
"جارٍ الاتصال...";

}

if(state === "disconnected"){

callState.textContent =
"انقطع الاتصال";

}

if(state === "failed"){

callState.textContent =
"تعذر الاتصال";

setTimeout(
() => {

if(activeCallId)
finishCall();

},
1500
);

}

if(state === "closed"){

callState.textContent =
"انتهت المكالمة";

}

};

return pc;

}

/* ======================================================
START CALL
====================================================== */

async function startCall(type){

if(activeCallId){

alert(
"هناك مكالمة نشطة"
);

return;

}

if(
!currentUser ||
!friendUser
){

alert(
"تعذر بدء المكالمة"
);

return;

}

activeCallId =
crypto.randomUUID();

activeCallType =
type;

activeCallRole =
"caller";

activeCallPeer = {

uid:
friendUser.uid,

name:
friendUser.name,

photo:
friendUser.photo

};

callSeconds = 0;
callMessageSaved = false;
pendingIceCandidates = [];
upgradeVersion = 0;
lastHandledUpgradeVersion = 0;

showCallScreen();

showOutgoingButtons();

callState.textContent =
"جارٍ الاتصال...";

try{

localStream =
await navigator.mediaDevices.getUserMedia({

audio:true,

video:
type === "video"

});

if(type === "video"){

localVideo.srcObject =
localStream;

localVideo.style.display =
"block";

}

peerConnection =
createPeer();

localStream
.getTracks()
.forEach(
track => {

peerConnection.addTrack(
track,
localStream
);

}
);

const offer =
await peerConnection.createOffer();

await peerConnection.setLocalDescription(
offer
);

await setDoc(
doc(
db,
"calls",
activeCallId
),
{
callId:
activeCallId,
callerId:
currentUser.uid,
receiverId:
friendUser.uid,
callType:
type,
status:
"ringing",
offer:{
type:
offer.type,
sdp:
offer.sdp
},
createdAt:
serverTimestamp(),
upgradeVersion:
0
}
);

listenCallerCall();

startOutgoingTimeout();

}catch(e){

console.error(
"Start call:",
e
);

alert(
"تعذر بدء المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

await cancelOutgoingCall(
false
);

}

}


/* ======================================================
CALLER LISTENER
====================================================== */

function listenCallerCall(){

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall =
onSnapshot(
doc(
db,
"calls",
activeCallId
),
async snap => {

if(!snap.exists()){

cleanupCall();
return;

}

const data =
snap.data();

if(
[
"cancelled",
"rejected",
"missed",
"ended"
].includes(
data.status
)
){

stopRingtone();

callSeconds =
Number(
data.duration || 0
);

cleanupCall();

return;

}

if(
data.answer &&
peerConnection &&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

await flushIce();
await playRemoteAudio();

}catch(e){

console.error(
"Answer:",
e
);

}

}

if(
data.status ===
"ringing"
){

callState.textContent =
data.receivedAt
? "يرن"
: "جارٍ الاتصال...";

}

if(
data.status ===
"connected"
){

stopOutgoingTimeout();
stopRingtone();

callState.textContent =
"متصل";

showConnectedButtons();

startCallTimer();

await playRemoteAudio();

}

if(
data.callType ===
"video" &&
activeCallType !==
"video"
){

activeCallType =
"video";

setupCallVisuals();

}

if(
data.upgradeOffer &&
Number(
data.upgradeVersion || 0
) >
lastHandledUpgradeVersion
){

await handleUpgradeOffer(
data
);

}

if(
data.upgradeAnswer &&
peerConnection &&
Number(
data.upgradeAnswerVersion || 0
) >
lastHandledUpgradeVersion
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.upgradeAnswer
)
);

lastHandledUpgradeVersion =
Number(
data.upgradeAnswerVersion
);

await flushIce();

}catch(e){

console.error(
"Upgrade answer:",
e
);

}

}

}
);

listenCallCandidates();

}


/* ======================================================
INCOMING CALLS
====================================================== */

function listenIncomingCalls(){

if(!currentUser)
return;

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

const q =
query(
collection(
db,
"calls"
),
where(
"receiverId",
"==",
currentUser.uid
)
);

unsubscribeIncomingCalls =
onSnapshot(
q,
async snapshot => {

for(
const change
of snapshot.docChanges()
){

if(
change.type !==
"added" &&
change.type !==
"modified"
)
continue;

const id =
change.doc.id;

const data =
change.doc.data();

if(
data.receiverId !==
currentUser.uid ||
data.status !==
"ringing" ||
!data.offer
)
continue;

if(
activeCallId ===
id
)
continue;

if(activeCallId)
continue;

if(
handledIncomingCalls.has(
id
)
)
continue;

const created =
data.createdAt?.toMillis?.() ||
0;

if(
created &&
Date.now() -
created >
30000
){

try{

await updateDoc(
doc(
db,
"calls",
id
),
{
status:
"missed",
duration:
0,
endedAt:
serverTimestamp()
}
);

}catch(e){

console.error(e);

}

continue;

}

handledIncomingCalls.add(
id
);

const callerSnap =
await getDoc(
doc(
db,
"users",
data.callerId
)
);

const callerData =
callerSnap.exists()
? callerSnap.data()
: {};

activeCallId =
id;

activeCallType =
data.callType ||
"audio";

activeCallRole =
"receiver";

activeCallPeer = {

uid:
data.callerId,

name:
callerData.name ||
"مستخدم Mecd",

photo:
callerData.photo ||
callerData.photoURL ||
""

};

callSeconds = 0;
callMessageSaved = false;
pendingIceCandidates = [];
upgradeVersion = 0;
lastHandledUpgradeVersion = 0;

showIncoming();

callState.textContent =
activeCallType === "video"
? "📹 مكالمة فيديو واردة"
: "📞 مكالمة صوتية واردة";

startRingtone();

listenReceiverCallStatus();

}

}
);

}


/* ======================================================
RECEIVER STATUS
====================================================== */

function listenReceiverCallStatus(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

unsubscribeActiveCall =
onSnapshot(
doc(
db,
"calls",
activeCallId
),
async snap => {

if(!snap.exists()){

stopRingtone();
cleanupCall();
return;

}

const data =
snap.data();

if(
[
"cancelled",
"missed",
"rejected"
].includes(
data.status
)
){

stopRingtone();
cleanupCall();
return;

}

if(
data.status ===
"ended"
){

stopRingtone();

callSeconds =
Number(
data.duration || 0
);

cleanupCall();

return;

}

if(
data.callType ===
"video" &&
activeCallType !==
"video"
){

activeCallType =
"video";

setupCallVisuals();

}

if(
data.upgradeOffer &&
Number(
data.upgradeVersion || 0
) >

){

data
);

}

}
);

}


/* ======================================================
ACCEPT
====================================================== */

async function acceptIncomingCall(){

if(
!activeCallId ||
!activeCallPeer
)
return;

try{

const callId =
activeCallId;

const snap =
await getDoc(
doc(
db,
"calls",
callId
)
);

if(!snap.exists()){

stopRingtone();
cleanupCall();
return;

}

const data =
snap.data();

if(
data.status !==
"ringing"
){

stopRingtone();
cleanupCall();
return;

}

stopRingtone();

incomingCall.style.display =
"none";

showCallScreen();

callState.textContent =
"جارٍ الاتصال...";

localStream =
await navigator.mediaDevices.getUserMedia({

audio:true,

video:
activeCallType ===
"video"

});

if(
activeCallType ===
"video"
){

localVideo.srcObject =
localStream;

localVideo.style.display =
"block";

}

peerConnection =
createPeer();

localStream
.getTracks()
.forEach(
track => {

peerConnection.addTrack(
track,
localStream
);

}
);

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.offer
)
);

await flushIce();

const answer =
await peerConnection.createAnswer();

await peerConnection.setLocalDescription(
answer
);

await updateDoc(
doc(
db,
"calls",
callId
),
{
answer:{
type:
answer.type,
sdp:
answer.sdp
},
status:
"connected",
callType:
activeCallType,
receivedAt:
serverTimestamp()
}
);

showConnectedButtons();

startCallTimer();

await playRemoteAudio();

}catch(e){

console.error(
"Accept:",
e
);

alert(
"تعذر قبول المكالمة. تأكد من السماح بالميكروفون والكاميرا."
);

try{

if(activeCallId){

await updateDoc(
doc(
db,
"calls",
activeCallId
),
{
status:
"rejected",
endedAt:
serverTimestamp()
}
);

}

}catch(err){

console.error(err);

}

stopRingtone();
cleanupCall();

}

}


/* ======================================================
CANDIDATES
====================================================== */

function listenCallCandidates(){

if(unsubscribeCandidates)
unsubscribeCandidates();

if(!activeCallId)
return;

const callId =
activeCallId;

unsubscribeCandidates =
onSnapshot(
collection(
db,
"calls",
callId,
"candidates"
),
snapshot => {

snapshot.docChanges()
.forEach(
change => {

if(
change.type !==
"added"
)
return;

const data =
change.doc.data();

if(
data.senderId ===
currentUser.uid
)
return;

if(
activeCallId !==
callId
)
return;

addCandidate(
data.candidate
);

}
);

}
);

}


/* ======================================================
REJECT
====================================================== */

async function rejectIncomingCall(){

const id =
activeCallId;

stopRingtone();

if(!id){

cleanupCall();
return;

}

try{

const snap =
await getDoc(
doc(
db,
"calls",
id
)
);

if(snap.exists()){

await updateDoc(
doc(
db,
"calls",
id
),
{
status:
"rejected",
duration:
0,
endedAt:
serverTimestamp()
}
);

await saveCallMessage(
"rejected",
0
);

}

}catch(e){

console.error(
"Reject:",
e
);

}

cleanupCall();

}


/* ======================================================
CANCEL
====================================================== */

async function cancelOutgoingCall(
saveMessage = true
){

const id =
activeCallId;

stopRingtone();

if(!id){

cleanupCall();
return;

}

try{

const snap =
await getDoc(
doc(
db,
"calls",
id
)
);

if(snap.exists()){

const data =
snap.data();

if(
data.status ===
"ringing" ||
data.status ===
"connected"
){

await updateDoc(
doc(
db,
"calls",
id
),
{
status:
"cancelled",
duration:
data.status ===
"ringing"
? 0
: callSeconds,
callType:
activeCallType ||
data.callType ||
"audio",
endedAt:
serverTimestamp()
}
);

if(saveMessage){

await saveCallMessage(
data.status ===
"ringing"
? "cancelled"
: "completed",
data.status ===
"ringing"
? 0
: callSeconds
);

}

}

}

}catch(e){

console.error(
"Cancel:",
e
);

}

cleanupCall();

}


/* ======================================================
AUDIO -> VIDEO
====================================================== */

async function switchToVideo(){

if(
!activeCallId ||
!peerConnection ||
!localStream ||
activeCallType !==
"audio"
)
return;

try{

switchVideoButton.disabled =
true;

callState.textContent =
"جارٍ تشغيل الفيديو...";

const camera =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:"user"
}
}

});

const track =
camera.getVideoTracks()[0];

if(!track)
throw new Error(
"لا توجد كاميرا"
);

localStream.addTrack(
track
);

const sender =
peerConnection
.getSenders()
.find(
s =>
s.track?.kind ===
"video"
);

if(sender){

await sender.replaceTrack(
track
);

}else{

peerConnection.addTrack(
track,
localStream
);

}

activeCallType =
"video";

localVideo.srcObject =
localStream;

localVideo.style.display =
"block";

setupCallVisuals();

const version =
Date.now();

upgradeVersion =
version;

const offer =
await peerConnection.createOffer();

await peerConnection.setLocalDescription(
offer
);

await updateDoc(
doc(
db,
"calls",
activeCallId
),
{
callType:
"video",

upgradeOffer:{
type:
offer.type,
sdp:
offer.sdp
},

upgradeVersion:
version,

upgradeBy:
currentUser.uid
}
);

callState.textContent =
"جارٍ تحويل المكالمة إلى فيديو...";

}catch(e){

console.error(
"Switch video:",
e
);

alert(
"تعذر تشغيل الكاميرا"
);

}finally{

switchVideoButton.disabled =
false;

}

}


/* ======================================================
HANDLE UPGRADE
====================================================== */

async function handleUpgradeOffer(
data
){

if(
!peerConnection ||
!activeCallId
)
return;

const version =
Number(
data.upgradeVersion || 0
);

if(
version <=
lastHandledUpgradeVersion
)
return;

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.upgradeOffer
)
);

lastHandledUpgradeVersion =
version;

if(!localStream){

localStream =
await navigator.mediaDevices.getUserMedia({

audio:true,
video:true

});

localStream
.getTracks()
.forEach(
track => {

peerConnection.addTrack(
track,
localStream
);

}
);

}else if(
!localStream.getVideoTracks().length
){

const camera =
await navigator.mediaDevices.getUserMedia({
video:true
});

const track =
camera.getVideoTracks()[0];

localStream.addTrack(
track
);

const sender =
peerConnection
.getSenders()
.find(
s =>
s.track?.kind ===
"video"
);

if(sender){

await sender.replaceTrack(
track
);

}else{

peerConnection.addTrack(
track,
localStream
);

}

}

activeCallType =
"video";

localVideo.srcObject =
localStream;

localVideo.style.display =
"block";

setupCallVisuals();

const answer =
await peerConnection.createAnswer();

await peerConnection.setLocalDescription(
answer
);

await updateDoc(
doc(
db,
"calls",
activeCallId
),
{
callType:
"video",

upgradeAnswer:{
type:
answer.type,
sdp:
answer.sdp
},

upgradeAnswerVersion:
version
}
);

callState.textContent =
"متصل • فيديو";

showConnectedButtons();

}catch(e){

console.error(
"Upgrade:",
e
);

callState.textContent =
"تعذر تشغيل الفيديو";

}

}


/* ======================================================
SAVE CALL MESSAGE
====================================================== */

async function saveCallMessage(
status,
duration
){

if(
!activeCallId ||
!activeCallPeer ||
callMessageSaved
)
return;

callMessageSaved =
true;

const callerId =
activeCallRole ===
"caller"
? currentUser.uid
: activeCallPeer.uid;

const receiverId =
activeCallRole ===
"caller"
? activeCallPeer.uid
: currentUser.uid;

const targetChat =
createChatID(
callerId,
receiverId
);

try{

await setDoc(
doc(
db,
"chats",
targetChat,
"messages",
"call_" +
activeCallId
),
{
type:
"call",

callId:
activeCallId,

callType:
activeCallType ||
"audio",

callerId,

receiverId,

callStatus:
status,

duration:
Number(
duration || 0
),

senderId:
callerId,

read:
false,

createdAt:
serverTimestamp()
},
{
merge:true
}
);

}catch(e){

console.error(
"Call message:",
e
);

}

}


/* ======================================================
FINISH CALL
====================================================== */

async function finishCall(
status = null
){

const id =
activeCallId;

stopRingtone();
stopOutgoingTimeout();

if(!id){

cleanupCall();
return;

}

const duration =
callSeconds;

const finalStatus =
status ||
(
duration > 0
? "completed"
: "missed"
);

try{

const snap =
await getDoc(
doc(
db,
"calls",
id
)
);

if(snap.exists()){

const data =
snap.data();

if(
data.status !==
"ended" &&
data.status !==
"cancelled" &&
data.status !==
"rejected" &&
data.status !==
"missed"
){

await updateDoc(
doc(
db,
"calls",
id
),
{
status:
finalStatus ===
"completed"
? "ended"
: finalStatus,

duration,

callType:
activeCallType ||
data.callType ||
"audio",

endedAt:
serverTimestamp()
}
);

}

}

}catch(e){

console.error(
"Finish:",
e
);

}

await saveCallMessage(
finalStatus,
duration
);

cleanupCall();

}


/* ======================================================
CLEANUP
====================================================== */

function cleanupCall(){

stopRingtone();
stopCallTimer();
stopOutgoingTimeout();

if(unsubscribeActiveCall){

unsubscribeActiveCall();
unsubscribeActiveCall =
null;

}

if(unsubscribeCandidates){

unsubscribeCandidates();
unsubscribeCandidates =
null;

}

if(localStream){

localStream
.getTracks()
.forEach(
track => {

try{
track.stop();
}catch{}

}
);

localStream =
null;

}

if(peerConnection){

try{
peerConnection.close();
}catch{}

peerConnection =
null;

}

pendingIceCandidates = [];

if(remoteAudio){

remoteAudio.pause();

remoteAudio.srcObject =
null;

remoteAudio.muted =
false;

}

remoteVideo.srcObject =
null;

localVideo.srcObject =
null;

incomingCall.style.display =
"none";

callScreen.style.display =
"none";

audioCallView.style.display =
"flex";

videoArea.style.display =
"none";

remoteVideo.style.display =
"none";

remoteAvatar.style.display =
"flex";

localVideo.style.display =
"none";

localAvatar.style.display =
"none";

hideAllCallButtons();

activeCallId =
null;

activeCallType =
null;

activeCallRole =
null;

activeCallPeer =
null;

callSeconds =
0;

callMessageSaved =
false;

upgradeVersion =
0;

lastHandledUpgradeVersion =
0;

muteButton.textContent =
"🎤";

speakerButton.textContent =
"🔊";

switchVideoButton.textContent =
"📹";

muteButton.classList.remove(
"active"
);

speakerButton.classList.remove(
"active"
);

switchVideoButton.disabled =
false;

}


/* ======================================================
MUTE
====================================================== */

muteButton.onclick = () => {

if(!localStream)
return;

const track =
localStream.getAudioTracks()[0];

if(!track)
return;

track.enabled =
!track.enabled;

muteButton.textContent =
track.enabled
? "🎤"
: "🔇";

muteButton.classList.toggle(
"active",
!track.enabled
);

};


/* ======================================================
SPEAKER
====================================================== */

speakerButton.onclick =
async () => {

remoteAudioMuted =
!remoteAudioMuted;

remoteAudio.muted =
remoteAudioMuted;

speakerButton.textContent =
remoteAudioMuted
? "🔇"
: "🔊";

speakerButton.classList.toggle(
"active",
remoteAudioMuted
);

if(!remoteAudioMuted){

await playRemoteAudio();

}

};


/* ======================================================
FLIP CAMERA
====================================================== */

flipCameraButton.onclick =
async () => {

if(
!localStream ||
activeCallType !==
"video"
)
return;

try{

const oldTrack =
localStream
.getVideoTracks()[0];

if(!oldTrack)
return;

cameraFacing =
cameraFacing ===
"user"
? "environment"
: "user";

const stream =
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:{
ideal:
cameraFacing
}
}

});

const newTrack =
stream.getVideoTracks()[0];

if(!newTrack)
return;

const sender =
peerConnection
?.getSenders()
.find(
s =>
s.track?.kind ===
"video"
);

if(sender){

await sender.replaceTrack(
newTrack
);

}

oldTrack.stop();

localStream.removeTrack(
oldTrack
);

localStream.addTrack(
newTrack
);

localVideo.srcObject =
localStream;

}catch(e){

console.error(
"Flip:",
e
);

}

};


/* ======================================================
BUTTONS
====================================================== */

callButton.onclick = () => {

startCall(
"audio"
);

};

videoButton.onclick = () => {

startCall(
"video"
);

};

switchVideoButton.onclick =
switchToVideo;

acceptIncoming.onclick =
acceptIncomingCall;

rejectIncoming.onclick =
rejectIncomingCall;

acceptCallButton.onclick =
acceptIncomingCall;

rejectCallButton.onclick =
rejectIncomingCall;

endCallButton.onclick =
async () => {

if(!activeCallId){

cleanupCall();
return;

}

const role =
activeCallRole;

const id =
activeCallId;

if(role === "caller"){

const snap =
await getDoc(
doc(
db,
"calls",
id
)
).catch(
() => null
);

if(
snap?.exists() &&
snap.data().status ===
"ringing"
){

await cancelOutgoingCall(
true
);

return;

}

}

await finishCall();

};


/* ======================================================
BACK
====================================================== */

backButton.onclick =
async () => {

await updateMyActivity(
"none"
);

if(activeCallId){

if(
activeCallRole ===
"caller"
){

await cancelOutgoingCall();

}else{

await finishCall();

}

}

if(unsubscribeMessages)
unsubscribeMessages();

if(unsubscribeFriendStatus)
unsubscribeFriendStatus();

unsubscribeFriendActivity();

unsubscribeIncomingCalls();

stopPresence();

history.back();

};


/* ======================================================
VISIBILITY
====================================================== */

document.addEventListener(
"visibilitychange",
() => {

if(!currentUser)
return;

if(
document.visibilityState ===
"visible"
){

updateMyPresence(true);

if(activeCallId){

playRemoteAudio();

}

}else if(!activeCallId){

updateMyPresence(false);

updateMyActivity(
"none"
);

}

}
);

window.addEventListener(
"pagehide",
() => {

return;

updateMyPresence(false);

});

INIT

onAuthStateChanged(
auth,
async user => {

"يجب تسجيل الدخول أولاً";

return;

}

user;

showApp();

}catch(e){

e
);

loading.textContent =
e.message ||
"حدث خطأ";

}

});

"🔥 Mecd Chat System جاهز"
);
