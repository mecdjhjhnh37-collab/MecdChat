<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>


<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}


body{

height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:

radial-gradient(
circle at top,
#123d35,
transparent 40%
),

linear-gradient(
180deg,
#07110f,
#020504
);

overflow:hidden;

}



.app{

height:100vh;

max-width:650px;

margin:auto;

display:flex;

flex-direction:column;

}



/* ===== Header ===== */


header{

height:75px;

display:flex;

align-items:center;

gap:12px;

padding:12px 15px;

background:#050807;

border-bottom:
1px solid
rgba(255,255,255,.08);

}



.back{

width:45px;

height:45px;

border:0;

border-radius:15px;

background:#18231f;

color:white;

font-size:22px;

cursor:pointer;

}



.avatar{

width:48px;

height:48px;

border-radius:16px;

background:#12352c;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

font-size:24px;

}



.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



.user-info{

flex:1;

}



.user-name{

font-size:17px;

font-weight:bold;

}



.user-status{

font-size:12px;

color:#777;

margin-top:5px;

}



.user-status.online{

color:#00e889;

}



/* ===== Messages ===== */


.messages{

flex:1;

overflow-y:auto;

padding:

20px 15px 100px;

display:flex;

flex-direction:column;

gap:10px;

}



.empty{

margin:auto;

text-align:center;

color:#72817c;

}



/* ===== Message ===== */


.message{

max-width:78%;

padding:12px 15px;

border-radius:18px;

position:relative;

word-break:break-word;

}



.message.mine{

align-self:flex-start;

background:#00c96b;

color:#00150e;

border-bottom-left-radius:5px;

}



.message.other{

align-self:flex-end;

background:#18231f;

border-bottom-right-radius:5px;

border:1px solid rgba(255,255,255,.08);

}



.time{

display:block;

font-size:9px;

opacity:.6;

margin-top:5px;

}




/* ===== Input ===== */


.input-area{

position:fixed;

bottom:0;

left:50%;

transform:translateX(-50%);

width:100%;

max-width:650px;

padding:10px;

display:flex;

gap:8px;

background:#050807;

}



#messageInput{

flex:1;

padding:14px;

border-radius:17px;

border:1px solid #27332f;

background:#111916;

color:white;

outline:none;

font-size:15px;

}



#voiceButton,
#sendButton{

width:50px;

height:50px;

border:0;

border-radius:16px;

font-size:22px;

cursor:pointer;

}



#voiceButton{

background:#18231f;

color:white;

}



#sendButton{

background:#00e889;

color:#00150e;

}



/* ===== Delete menu ===== */


.message-menu{

position:absolute;

right:10px;

top:50%;

transform:translateY(-50%);

background:#111916;

padding:8px;

border-radius:12px;

z-index:999;

}



.message-menu button{

background:#18231f;

color:white;

border:0;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

}


</style>

</head>
<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
deleteDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915"

};



const appFirebase =
initializeApp(
firebaseConfig
);


const auth =
getAuth(
appFirebase
);


const db =
getFirestore(
appFirebase
);




const messages =
document.getElementById(
"messages"
);


const messageInput =
document.getElementById(
"messageInput"
);


const sendButton =
document.getElementById(
"sendButton"
);


const friendName =
document.getElementById(
"friendName"
);


const friendAvatar =
document.getElementById(
"friendAvatar"
);



let currentUser = null;

let friendUser = null;

let chatID = null;

let unsubscribeMessages = null;




function createChatID(
a,
b
){

return [
a,
b
]
.sort()
.join("_");

}




async function loadFriend(){


const params =
new URLSearchParams(
location.search
);


const id =
params.get(
"friend"
);



if(!id){

alert(
"لا يوجد صديق"
);

return false;

}



const userDoc =
await getDoc(
doc(
db,
"users",
id
)
);



if(!userDoc.exists()){

alert(
"المستخدم غير موجود"
);

return false;

}



const data =
userDoc.data();



friendUser={

uid:id,

name:
data.name || "مستخدم",

photo:
data.photo || ""

};



friendName.textContent =
friendUser.name;



if(friendUser.photo){

friendAvatar.innerHTML =
`
<img src="${friendUser.photo}">
`;

}



chatID =
createChatID(
currentUser.uid,
friendUser.uid
);



await setDoc(

doc(
db,
"chats",
chatID
),

{

members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp()

},

{
merge:true
}

);



return true;


}






function listenMessages(){


const ref =
collection(
db,
"chats",
chatID,
"messages"
);



const q =
query(
ref,
orderBy(
"createdAt",
"asc"
)
);



unsubscribeMessages =
onSnapshot(
q,
snap=>{


messages.innerHTML="";


snap.forEach(
item=>{


const data =
item.data();


const box =
document.createElement(
"div"
);



box.className =
"message " +

(
data.senderId === currentUser.uid

?

"mine"

:

"other"

);



if(data.type==="voice"){


const audio =
document.createElement(
"audio"
);


audio.controls=true;

audio.src =
data.audio;


box.appendChild(
audio
);



}else{


box.appendChild(

document.createTextNode(
data.text || ""
)

);


}



messages.appendChild(
box
);



addMessageActions(
box,
item.id,
data.senderId === currentUser.uid
);



}

);



messages.scrollTop =
messages.scrollHeight;



}

);


}




async function sendMessage(){


const text =
messageInput.value.trim();



if(!text)
return;



await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

text:text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

createdAt:
serverTimestamp()

}

);



messageInput.value="";


}




sendButton.onclick =
sendMessage;



messageInput.addEventListener(
"keydown",
e=>{


if(e.key==="Enter"){

sendMessage();

}


});
  /* =========================
   ضغط مطول على الرسالة
========================= */


function addMessageActions(
messageElement,
messageID,
isMine
){

let timer;


messageElement.addEventListener(
"pointerdown",
()=>{


timer=setTimeout(()=>{


showMessageMenu(
messageElement,
messageID,
isMine
);


},500);


});



messageElement.addEventListener(
"pointerup",
()=>{

clearTimeout(timer);

});


messageElement.addEventListener(
"pointercancel",
()=>{

clearTimeout(timer);

});


messageElement.addEventListener(
"pointerleave",
()=>{

clearTimeout(timer);

});


}





function showMessageMenu(
messageElement,
messageID,
isMine
){


removeMenus();



const menu =
document.createElement(
"div"
);


menu.className =
"message-menu";



const button =
document.createElement(
"button"
);



if(isMine){


button.textContent =
"🗑️ إلغاء الإرسال";



button.onclick =
async(e)=>{


e.stopPropagation();



await deleteMessage(
messageID
);



removeMenus();


};


}

else{


button.textContent =
"🗑️ حذف لدي";



button.onclick =
(e)=>{


e.stopPropagation();



messageElement.remove();



removeMenus();


};


}



menu.appendChild(
button
);



messageElement.appendChild(
menu
);



}




function removeMenus(){


document
.querySelectorAll(
".message-menu"
)

.forEach(
e=>e.remove()
);


}




async function deleteMessage(
id
){


try{


await deleteDoc(

doc(

db,

"chats",

chatID,

"messages",

id

)

);



}catch(error){


console.error(
"Delete error:",
error
);


}


}






/* =========================
   تسجيل الدخول وفتح الدردشة
========================= */


onAuthStateChanged(
auth,
async(user)=>{


if(!user){

return;

}



currentUser =
user;



const ok =
await loadFriend();



if(ok){


listenMessages();



document
.getElementById(
"loading"
)
.style.display =
"none";



document
.getElementById(
"app"
)
.style.display =
"flex";


}



}

);







/* =========================
   زر الرجوع
========================= */


document
.getElementById(
"backButton"
)

.onclick =
()=>{


history.back();


};




</script>


</body>

</html>
