<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#fff;
background:radial-gradient(circle at top,#123d35,transparent 40%),linear-gradient(180deg,#07110f,#020504);
overflow:hidden
}
.app{height:100vh;max-width:650px;margin:auto;display:flex;flex-direction:column;position:relative}
header{height:75px;display:flex;align-items:center;gap:12px;padding:12px 15px;background:#050807;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;z-index:10}
.back{width:45px;height:45px;border:0;border-radius:15px;background:#18231f;color:#fff;font-size:22px;cursor:pointer}
.avatar,.call-avatar{width:48px;height:48px;border-radius:50%;background:#12352c;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:24px;flex-shrink:0}
.avatar img,.call-avatar img,.local-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.user-info{flex:1;min-width:0}
.user-name{font-size:17px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-status{font-size:12px;color:#777;margin-top:5px;transition:.2s}
.user-status.online,.user-status.typing,.user-status.recording{color:#00e889}
.user-status.recording{font-weight:bold}
.call-buttons{display:flex;gap:8px;flex-shrink:0}
.call-buttons button{width:42px;height:42px;border:0;border-radius:14px;background:#18231f;color:#fff;font-size:18px;cursor:pointer}
.messages{flex:1;min-height:0;overflow-y:auto;padding:20px 15px 150px;display:flex;flex-direction:column;gap:10px}
.empty{margin:auto;text-align:center;color:#72817c;line-height:1.8}
.message{max-width:78%;padding:10px 13px;border-radius:18px;position:relative;word-break:break-word;overflow-wrap:anywhere;user-select:none;line-height:1.5;align-self:flex-start;min-width:0}
.message.mine{align-self:flex-start;background:#00c96b;color:#00150e;border-bottom-left-radius:5px}
.message.other{align-self:flex-end;background:#18231f;border:1px solid rgba(255,255,255,.08);border-bottom-right-radius:5px}
.time{display:block;font-size:9px;opacity:.6;margin-top:5px}
.message-meta{display:flex;align-items:center;gap:5px;margin-top:5px}
.message-status{font-size:12px;font-weight:bold;direction:ltr}
.message-status.read{color:#006dff}

.input-area{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:650px;padding:10px;display:flex;gap:8px;background:#050807;z-index:50}
#messageInput{flex:1;min-width:0;padding:14px;border-radius:17px;border:1px solid #27332f;background:#111916;color:#fff;outline:none;font-size:15px}
#messageInput:focus{border-color:#00e889}
#voiceButton,#sendButton,#attachButton{width:50px;height:50px;border:0;border-radius:16px;font-size:22px;cursor:pointer;flex-shrink:0}
#attachButton{background:#18231f;color:#fff;font-size:28px;transition:.15s}
#attachButton:active{transform:scale(.92)}
#voiceButton{background:#18231f;color:#fff;transition:.18s}
#voiceButton.recording{background:#321817;color:#ff5555;transform:scale(1.05)}
#sendButton{background:#00e889;color:#00150e}
#sendButton:disabled{opacity:.6}

#attachMenu{position:fixed;bottom:70px;right:10px;width:175px;padding:7px;background:#0b1512;border:1px solid rgba(0,232,137,.18);border-radius:17px;box-shadow:0 10px 35px rgba(0,0,0,.55);display:none;z-index:1000}
#attachMenu.show{display:block}
.attach-option{width:100%;height:45px;border:0;border-radius:12px;background:#18231f;color:#fff;display:flex;align-items:center;gap:10px;padding:0 13px;font-size:14px;font-weight:bold;cursor:pointer;margin-bottom:5px}
.attach-option:last-child{margin-bottom:0}
.attach-option:active{transform:scale(.98)}
.attach-icon{font-size:20px;width:28px;text-align:center}
.hidden-file{display:none!important}

.image-message{padding:6px!important;max-width:82%!important;overflow:hidden!important}
.message-image{display:block;width:auto;max-width:100%;max-height:360px;border-radius:14px;object-fit:contain;cursor:pointer;user-select:none}
.image-message .message-meta{padding:0 5px 2px}

.voice-message{align-self:flex-start!important;display:block!important;width:330px!important;max-width:calc(100% - 20px)!important;min-width:250px!important;height:auto!important;min-height:76px!important;padding:8px 10px 7px!important;border-radius:18px!important;position:relative!important;overflow:visible!important;flex:none!important;box-sizing:border-box!important;background:linear-gradient(135deg,#162923,#0d1714)!important;border:1px solid rgba(0,232,137,.16)!important;box-shadow:0 5px 18px rgba(0,0,0,.16);line-height:normal!important;white-space:normal!important}
.message.mine.voice-message{align-self:flex-start!important;background:linear-gradient(135deg,#087e50,#00a866)!important;color:#fff;border:1px solid rgba(255,255,255,.08)!important}
.message.other.voice-message{align-self:flex-end!important;background:linear-gradient(135deg,#162923,#0d1714)!important}
.voice-message-box{display:flex!important;align-items:center!important;gap:9px!important;direction:rtl!important;width:100%!important;height:auto!important;min-height:48px!important;flex:none!important;overflow:hidden!important;border-radius:inherit}
.voice-icon{width:43px!important;height:43px!important;min-width:43px!important;max-width:43px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;background:rgba(0,232,137,.13)!important;color:#00e889!important;font-size:18px!important;flex:none!important;box-shadow:0 0 0 1px rgba(0,232,137,.08),0 4px 14px rgba(0,0,0,.18)}
.voice-message.mine .voice-icon{background:rgba(255,255,255,.16)!important;color:#fff!important;box-shadow:none}
.voice-player{display:block!important;flex:1 1 auto!important;width:auto!important;min-width:0!important;height:auto!important}
.voice-controls{display:flex!important;align-items:center!important;gap:8px!important;width:100%!important;height:38px!important;min-height:38px!important}
.voice-play{width:38px!important;height:38px!important;min-width:38px!important;max-width:38px!important;border:0!important;border-radius:50%!important;background:#00e889!important;color:#00150e!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:14px!important;cursor:pointer!important;flex:none!important;box-shadow:0 4px 12px rgba(0,232,137,.18);transition:transform .15s,background .15s}
.voice-play:active{transform:scale(.90)}
.voice-message.mine .voice-play{background:#fff!important;color:#087e50!important}
.voice-progress{flex:1 1 auto!important;width:auto!important;min-width:30px!important;height:7px!important;min-height:7px!important;max-height:7px!important;border-radius:20px!important;background:rgba(255,255,255,.13)!important;overflow:hidden!important;cursor:pointer!important;position:relative!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.voice-progress-fill{width:0%;height:100%!important;background:linear-gradient(90deg,#00c96b,#00e889)!important;border-radius:20px;transition:width .05s linear}
.voice-message.mine .voice-progress{background:rgba(0,0,0,.18)!important}
.voice-message.mine .voice-progress-fill{background:#fff!important}
.voice-time{font-size:10px!important;font-weight:bold!important;color:#b9c7c2!important;width:39px!important;min-width:39px!important;max-width:39px!important;text-align:center!important;direction:ltr!important;flex:none!important}
.voice-message.mine .voice-time{color:rgba(255,255,255,.85)!important}
.voice-label{font-size:9px!important;color:#84938e!important;margin-top:4px!important;margin-right:52px!important;height:11px!important;display:flex!important;align-items:center!important;gap:4px!important}
.voice-label::before{content:"";width:5px;height:5px;min-width:5px;border-radius:50%;background:#00e889;display:inline-block}
.voice-message.mine .voice-label{color:rgba(255,255,255,.7)!important}
.voice-message.mine .voice-label::before{background:#fff}
.voice-audio{display:none!important;width:0!important;height:0!important}

.call-message{min-width:245px;max-width:310px}
.call-box{display:flex;align-items:center;gap:11px}
.call-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,232,137,.14);color:#00e889;font-size:22px;flex-shrink:0}
.call-info{flex:1;min-width:0}
.call-title{font-size:14px;font-weight:bold}
.call-subtitle{font-size:11px;opacity:.65;margin-top:4px}
.call-duration{font-size:11px;opacity:.7;margin-top:4px}
.call-message.missed .call-icon{background:rgba(216,59,59,.15);color:#ff5555}
.call-message.rejected .call-icon,.call-message.cancelled .call-icon{background:rgba(255,255,255,.08);color:#aaa}

.message-menu{position:absolute!important;left:50%!important;bottom:calc(100% + 8px)!important;transform:translateX(-50%)!important;width:160px!important;min-width:160px!important;max-width:160px!important;height:auto!important;min-height:0!important;padding:5px!important;background:#0b1512!important;border:1px solid rgba(0,232,137,.18)!important;border-radius:15px!important;box-shadow:0 8px 25px rgba(0,0,0,.55)!important;z-index:999999!important;display:block!important;flex:none!important;white-space:normal!important}
.message-menu button{width:100%!important;min-width:0!important;height:auto!important;min-height:40px!important;padding:10px 14px!important;border:0!important;border-radius:11px!important;background:#18231f!important;color:#fff!important;font-size:13px!important;font-weight:bold!important;cursor:pointer!important;display:block!important}
.message-menu button:hover{background:#22332d!important}

#incomingCall{position:fixed;top:85px;left:50%;transform:translateX(-50%);width:min(620px,calc(100% - 24px));padding:14px;background:#101815;border:1px solid rgba(255,255,255,.1);border-radius:20px;box-shadow:0 15px 45px rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:space-between;gap:12px}
.incoming-call-info{display:flex;align-items:center;gap:11px;min-width:0}
.incoming-name{font-size:15px;font-weight:bold}
.incoming-type{font-size:12px;color:#9aa7a3;margin-top:4px}
.call-avatar{width:52px;height:52px}
.incoming-actions{display:flex;gap:9px}
.incoming-actions button{width:46px;height:46px;border:0;border-radius:50%;font-size:20px;color:#fff;cursor:pointer}
#rejectIncoming{background:#d83b3b}
#acceptIncoming{background:#00e889;color:#00150e}

#callScreen{position:fixed;inset:0;background:#020504;z-index:10000;display:none;flex-direction:column;overflow:hidden}
.call-top{height:85px;padding:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
.call-top-info{text-align:center}
#callTitle{font-size:20px;font-weight:bold}
#callState{font-size:13px;color:#00e889;margin-top:6px}
#callDuration{font-size:12px;color:#9aa7a3;margin-top:4px}
#audioCallView{flex:1;display:flex;align-items:center;justify-content:center;background:#020504}
#videoArea{position:relative;flex:1;background:#000;overflow:hidden;display:none}
#remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
#remoteAvatar{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07110f;z-index:1}
#remoteAvatar img{width:150px;height:150px;border-radius:50%;object-fit:cover}
#remoteAvatarEmoji{font-size:70px}
#localVideo{position:absolute;width:110px;height:145px;left:16px;top:95px;object-fit:cover;border-radius:18px;border:2px solid rgba(255,255,255,.7);background:#111;z-index:5;display:none}
#localAvatar{position:absolute;width:110px;height:110px;left:16px;top:110px;border-radius:50%;background:#12352c;z-index:6;display:none;align-items:center;justify-content:center;overflow:hidden;font-size:40px}
.call-controls{min-height:100px;padding:15px;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(5,8,7,.98);z-index:20}
.call-control{width:58px;height:58px;border:0;border-radius:50%;background:#18231f;color:#fff;font-size:22px;cursor:pointer}
.call-control.accept{background:#00e889;color:#00150e}
.call-control.reject,.call-control.end{background:#d83b3b}
.call-control.active{background:#00e889;color:#00150e}
.hidden{display:none!important}

@media(max-width:500px){
.message{max-width:84%}
.voice-message{width:300px!important;max-width:calc(100vw - 70px)!important;min-width:245px!important}
header{padding:10px 12px}
#incomingCall{top:75px}
#localVideo{width:100px;height:135px;left:12px;top:90px}
#localAvatar{width:100px;height:100px;left:12px;top:105px}
.call-control{width:54px;height:54px}
}
</style>
</head>

<body>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020504;color:white;font-size:18px;z-index:999999">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>
<button id="backButton" class="back" type="button">→</button>
<div id="friendAvatar" class="avatar">👤</div>
<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>
<div class="call-buttons">
<button id="callButton" type="button">📞</button>
<button id="videoButton" type="button">📹</button>
</div>
</header>

<div id="messages" class="messages">
<div class="empty">💬<br>ابدأ المحادثة الآن</div>
</div>

<div id="attachMenu">
<button id="galleryButton" class="attach-option" type="button">
<span class="attach-icon">🖼️</span><span>صورة</span>
</button>
<button id="cameraButton" class="attach-option" type="button">
<span class="attach-icon">📷</span><span>كاميرا</span>
</button>
</div>

<input id="galleryInput" class="hidden-file" type="file" accept="image/*">
<input id="cameraInput" class="hidden-file" type="file" accept="image/*" capture="environment">

<div class="input-area">
<button id="attachButton" type="button">＋</button>
<input id="messageInput" type="text" placeholder="اكتب رسالة..." autocomplete="off" maxlength="2000">
<button id="voiceButton" type="button">🎤</button>
<button id="sendButton" type="button">➤</button>
</div>

</main>

<div id="incomingCall">
<div class="incoming-call-info">
<div id="incomingAvatar" class="call-avatar">👤</div>
<div>
<div id="incomingName" class="incoming-name">مكالمة واردة</div>
<div id="incomingType" class="incoming-type">📞 مكالمة صوتية</div>
</div>
</div>
<div class="incoming-actions">
<button id="rejectIncoming" type="button">✕</button>
<button id="acceptIncoming" type="button">✓</button>
</div>
</div>

<div id="callScreen">

<div class="call-top">
<div class="call-top-info">
<div id="callTitle">مكالمة</div>
<div id="callState">جارٍ الاتصال...</div>
<div id="callDuration">00:00</div>
</div>
</div>

<div id="audioCallView">
<div id="audioCallAvatar" class="call-avatar" style="width:150px;height:150px;font-size:55px">👤</div>
</div>

<div id="videoArea">

<div id="remoteAvatar">
<div id="remoteAvatarEmoji">👤</div>
</div>

<video id="remoteVideo" autoplay playsinline></video>

<div id="localAvatar">👤</div>

<video id="localVideo" autoplay muted playsinline></video>

</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<div class="call-controls">

<button id="switchVideoButton" class="call-control hidden" type="button">📹</button>
<button id="muteButton" class="call-control hidden" type="button">🎤</button>
<button id="speakerButton" class="call-control hidden" type="button">🔊</button>
<button id="flipCameraButton" class="call-control hidden" type="button">🔄</button>
<button id="acceptCallButton" class="call-control accept hidden" type="button">✓</button>
<button id="rejectCallButton" class="call-control reject hidden" type="button">✕</button>
<button id="endCallButton" class="call-control end hidden" type="button">📞</button>

</div>
</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getAuth,onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
updateDoc,
addDoc,
collection,
query,
where,
orderBy,
onSnapshot,
deleteDoc,
serverTimestamp,
arrayUnion,
getDocs,
limit
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",
authDomain:"mecd-tools.firebaseapp.com",
projectId:"mecd-tools",
storageBucket:"mecd-tools.firebasestorage.app",
messagingSenderId:"643005547408",
appId:"1:643005547408:web:b1719060ec340dd0e0a915"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

const $=id=>document.getElementById(id);

const loading=$("loading");
const app=$("app");
const messages=$("messages");
const messageInput=$("messageInput");
const sendButton=$("sendButton");
const voiceButton=$("voiceButton");
const attachButton=$("attachButton");
const attachMenu=$("attachMenu");
const galleryButton=$("galleryButton");
const cameraButton=$("cameraButton");
const galleryInput=$("galleryInput");
const cameraInput=$("cameraInput");
const friendName=$("friendName");
const friendAvatar=$("friendAvatar");
const friendStatus=$("friendStatus");
const backButton=$("backButton");
const callButton=$("callButton");
const videoButton=$("videoButton");

const incomingCall=$("incomingCall");
const incomingAvatar=$("incomingAvatar");
const incomingName=$("incomingName");
const incomingType=$("incomingType");
const acceptIncoming=$("acceptIncoming");
const rejectIncoming=$("rejectIncoming");

const callScreen=$("callScreen");
const callTitle=$("callTitle");
const callState=$("callState");
const callDuration=$("callDuration");

const audioCallView=$("audioCallView");
const audioCallAvatar=$("audioCallAvatar");
const videoArea=$("videoArea");
const remoteVideo=$("remoteVideo");
const remoteAvatar=$("remoteAvatar");
const remoteAvatarEmoji=$("remoteAvatarEmoji");
const localVideo=$("localVideo");
const localAvatar=$("localAvatar");
const remoteAudio=$("remoteAudio");

const switchVideoButton=$("switchVideoButton");
const muteButton=$("muteButton");
const speakerButton=$("speakerButton");
const flipCameraButton=$("flipCameraButton");
const acceptCallButton=$("acceptCallButton");
const rejectCallButton=$("rejectCallButton");
const endCallButton=$("endCallButton");

let currentUser=null;
let friendUser=null;
let chatID=null;

let unsubscribeMessages=null;
let unsubscribeFriendStatus=null;
let unsubscribeFriendActivity=null;
let unsubscribeIncomingCalls=null;
let unsubscribeActiveCall=null;
let unsubscribeCandidates=null;

let presenceInterval=null;
let typingTimer=null;

let typingState=false;
let voiceRecording=false;

let localStream=null;
let peerConnection=null;

let activeCallId=null;
let activeCallType=null;
let activeCallRole=null;
let activeCallPeer=null;

let callSeconds=0;
let callTimer=null;
let callTimeout=null;

let remoteAudioMuted=false;
let cameraFacing="user";

let callMessageSaved=false;
let finishingCall=false;

let friendOnline=false;
let friendTyping=false;
let friendRecording=false;

let pendingIceCandidates=[];
let handledIncomingCalls=new Set();

let localNegotiationId=null;
let processedRenegotiationOffer=null;
let processedRenegotiationAnswer=null;

const rtcConfig={
iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
]
};

function createChatID(a,b){
return [a,b].sort().join("_");
}

function escapeHtml(value){
return String(value??"").replace(
/[&<>'"]/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);
}

function formatTime(timestamp){
if(!timestamp?.toDate)return "";
try{
return timestamp.toDate().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"});
}catch{return ""}
}

function formatDuration(seconds){
seconds=Math.max(0,Math.floor(Number(seconds||0)));
const m=Math.floor(seconds/60);
const s=seconds%60;
return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function setUserAvatar(element,user){
if(user?.photo){
element.innerHTML=`<img src="${escapeHtml(user.photo)}" alt="">`;
}else{
element.innerHTML="👤";
}
}

function showApp(){
loading.style.display="none";
app.style.display="flex";
}

async function updateMyPresence(online=true){
if(!currentUser)return;
try{
await setDoc(
doc(db,"users",currentUser.uid),
{online,lastSeen:serverTimestamp()},
{merge:true}
);
}catch(e){
console.error("Presence:",e);
}
}

function startPresence(){
updateMyPresence(true);
clearInterval(presenceInterval);
presenceInterval=setInterval(()=>{
if(document.visibilityState==="visible"){
updateMyPresence(true);
}
},10000);
}

function stopPresence(){
clearInterval(presenceInterval);
presenceInterval=null;
updateMyPresence(false);
}

async function loadFriend(){

const friendId=new URLSearchParams(location.search).get("friend");

if(!friendId)throw new Error("لا يوجد صديق في الرابط");
if(friendId===currentUser.uid)throw new Error("لا يمكنك فتح محادثة مع نفسك");

const snap=await getDoc(doc(db,"users",friendId));

if(!snap.exists())throw new Error("المستخدم غير موجود");

const data=snap.data();

friendUser={
uid:friendId,
name:data.name||"مستخدم Mecd",
photo:data.photo||data.photoURL||""
};

friendName.textContent=friendUser.name;
setUserAvatar(friendAvatar,friendUser);

chatID=createChatID(currentUser.uid,friendUser.uid);

await setDoc(
doc(db,"chats",chatID),
{
members:[currentUser.uid,friendUser.uid],
createdAt:serverTimestamp()
},
{merge:true}
);

listenFriendStatus();
listenFriendActivity();
}

function renderFriendStatus(){

friendStatus.classList.remove("online","typing","recording");

if(friendRecording){
