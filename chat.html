<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%;
overflow:hidden
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,Tahoma,sans-serif;
background:#07110f;
color:#fff;
-webkit-font-smoothing:antialiased
}

button,input{
font:inherit
}

button{
-webkit-tap-highlight-color:transparent
}

.app{
height:100dvh;
width:100%;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background:
radial-gradient(circle at 50% -10%,rgba(0,232,137,.08),transparent 35%),
#07110f;
overflow:hidden
}

/* ================= HEADER ================= */

header{
height:62px;
min-height:62px;
width:100%;
display:flex;
align-items:center;
gap:8px;
padding:7px 10px;
background:#000;
border-bottom:1px solid rgba(255,255,255,.08);
z-index:100;
direction:ltr;
box-shadow:0 1px 3px rgba(0,0,0,.3)
}

.back{
width:40px;
height:40px;
border:0;
background:transparent;
color:#fff;
font-size:25px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%
}

.back:active{
background:#171717
}

.header-profile{
flex:1;
min-width:0;
height:48px;
display:flex;
align-items:center;
gap:9px;
direction:rtl;
cursor:pointer;
border-radius:8px;
padding:2px 4px
}

.header-profile:active{
background:#151515
}

.avatar{
width:43px;
height:43px;
min-width:43px;
border-radius:50%;
background:#26332f;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:20px
}

.avatar img{
width:100%;
height:100%;
object-fit:cover
}

.user-info{
min-width:0;
flex:1;
text-align:right
}

.user-name{
font-size:16px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#fff;
line-height:20px
}

.user-status{
font-size:12px;
color:#9aa29f;
margin-top:1px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00e889
}

.call-buttons{
display:flex;
align-items:center;
gap:2px;
direction:ltr
}

.call-buttons button{
width:39px;
height:39px;
border:0;
border-radius:50%;
background:transparent;
color:#fff;
font-size:19px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center
}

.call-buttons button:active{
background:#171717
}

/* ================= CHAT ================= */

.messages{
flex:1;
min-height:0;
overflow-y:auto;
overflow-x:hidden;
padding:14px 10px 105px;
display:flex;
flex-direction:column;
gap:5px;
scroll-behavior:smooth;
background:
radial-gradient(circle at 20% 20%,rgba(0,232,137,.025),transparent 30%),
radial-gradient(circle at 80% 70%,rgba(0,0,0,.18),transparent 35%),
#07110f;
-webkit-overflow-scrolling:touch
}

.messages::-webkit-scrollbar{
width:4px
}

.messages::-webkit-scrollbar-thumb{
background:#24332e;
border-radius:10px
}

.empty{
margin:auto;
text-align:center;
color:#74807c;
line-height:1.8;
font-size:14px
}

/* ================= BUBBLES ================= */

.message{
position:relative;
max-width:78%;
padding:7px 10px 22px;
border-radius:12px;
word-break:break-word;
overflow-wrap:anywhere;
line-height:1.45;
font-size:15px;
user-select:text;
transition:transform .15s ease,background-color .2s ease;
box-shadow:0 1px 1px rgba(0,0,0,.15)
}

.message.mine{
align-self:flex-start;
background:#b7e36b;
color:#12200b;
border-bottom-left-radius:3px
}

.message.other{
align-self:flex-end;
background:#202b28;
color:#fff;
border:1px solid rgba(255,255,255,.035);
border-bottom-right-radius:3px
}

.message.highlight{
background:#00e889!important;
color:#00150e!important
}

.message-text{
white-space:pre-wrap
}

.message-meta{
position:absolute;
bottom:4px;
left:8px;
display:flex;
align-items:center;
gap:4px;
direction:ltr
}

.message.other .message-meta{
left:auto;
right:8px
}

.time{
font-size:9px;
opacity:.62;
white-space:nowrap
}

.message-status{
font-size:11px;
line-height:1;
font-weight:600;
letter-spacing:-2px
}

.message-status.read{
color:#1688ff
}

/* ================= MEDIA ================= */

.message.image-message,
.message.video-message{
padding:5px 5px 22px!important;
width:max-content;
max-width:82%
}

.message-image,
.message-video{
display:block;
width:auto;
max-width:270px;
max-height:300px;
border-radius:9px;
object-fit:cover;
cursor:pointer
}

.message.video-message{
background:#202b28!important
}

/* ================= REPLY ================= */

.message-reply{
display:flex;
gap:6px;
margin-bottom:5px;
padding:5px 7px;
background:rgba(0,0,0,.14);
border-right:3px solid #00e889;
border-radius:7px;
cursor:pointer;
min-width:100%;
overflow:hidden
}

.message.other .message-reply{
background:rgba(255,255,255,.055)
}

.reply-content{
min-width:0;
overflow:hidden
}

.reply-name{
font-size:10px;
font-weight:700;
color:#00e889;
margin-bottom:1px
}

.message.mine .reply-name{
color:#19300d
}

.reply-text{
font-size:10px;
opacity:.75;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

/* ================= REACTIONS ================= */

.message-reactions{
position:absolute;
bottom:-10px;
right:8px;
display:flex;
align-items:center;
gap:2px;
z-index:5
}

.message.mine .message-reactions{
right:auto;
left:8px
}

.reaction-chip{
border:1px solid rgba(255,255,255,.14);
background:#111b18;
color:#fff;
border-radius:11px;
padding:1px 5px;
font-size:11px;
display:flex;
align-items:center;
gap:2px;
cursor:pointer;
box-shadow:0 2px 5px rgba(0,0,0,.3)
}

.reaction-chip.mine{
border-color:#00e889;
background:#193c2e
}

.reaction-count{
font-size:9px
}

.heart-pop{
position:absolute;
bottom:5px;
right:12px;
font-size:22px;
pointer-events:none;
animation:heartPop .7s ease forwards;
z-index:20
}

.message.mine .heart-pop{
right:auto;
left:12px
}

@keyframes heartPop{
0%{transform:scale(.2);opacity:0}
45%{transform:scale(1.3);opacity:1}
100%{transform:scale(1);opacity:0}
}

/* ================= PINNED ================= */

.pinned-banner{
display:none;
height:38px;
padding:5px 12px;
background:#0c1814;
border-bottom:1px solid rgba(0,232,137,.15);
align-items:center;
gap:8px;
z-index:90
}

.pinned-banner.show{
display:flex
}

.pinned-banner-content{
flex:1;
display:flex;
align-items:center;
gap:7px;
min-width:0;
cursor:pointer
}

.pinned-banner-text{
color:#bcefcf;
font-size:11px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.pinned-banner-close{
width:28px;
height:28px;
border:0;
background:transparent;
color:#aaa;
cursor:pointer
}

/* ================= INPUT ================= */

.input-area{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:7px 8px 9px;
display:flex;
align-items:flex-end;
gap:6px;
background:linear-gradient(to top,#000 75%,rgba(0,0,0,.9));
z-index:80;
direction:ltr
}

.input-capsule{
flex:1;
min-width:0;
min-height:48px;
max-height:125px;
display:flex;
align-items:flex-end;
gap:4px;
padding:4px 6px;
background:#fff;
border-radius:25px;
box-shadow:0 2px 8px rgba(0,0,0,.3);
direction:rtl
}

#messageInput{
flex:1;
min-width:0;
min-height:39px;
max-height:115px;
padding:10px 5px;
border:0;
outline:none;
background:transparent;
color:#111;
font-size:15px;
resize:none
}

#messageInput::placeholder{
color:#777
}

.input-icon{
width:38px;
height:38px;
min-width:38px;
border:0;
background:transparent;
color:#4c5552;
font-size:21px;
border-radius:50%;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center
}

.input-icon:active{
background:#eee
}

#voiceButton,
#sendButton{
width:48px;
height:48px;
min-width:48px;
border:0;
border-radius:50%;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
font-size:20px
}

#voiceButton{
background:#18231f;
color:#fff
}

#voiceButton.recording{
background:#00e889;
color:#00150e;
animation:pulse 1s infinite
}

#sendButton{
background:#00e889;
color:#00150e;
font-size:19px
}

#sendButton:disabled{
opacity:.5
}

@keyframes pulse{
50%{transform:scale(1.06)}
}

/* ================= ATTACHMENT SHEET ================= */

.attach-backdrop,
.bottom-sheet-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:1000;
display:flex;
align-items:flex-end;
justify-content:center
}

.attach-sheet{
width:100%;
max-width:650px;
background:#fff;
color:#111;
border-radius:24px 24px 0 0;
padding:12px 15px 28px;
animation:sheetUp .22s ease
}

.sheet-handle{
width:38px;
height:4px;
background:#ccc;
border-radius:10px;
margin:0 auto 18px
}

.attachment-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px 10px
}

.attach-item{
border:0;
background:transparent;
display:flex;
flex-direction:column;
align-items:center;
gap:7px;
color:#222;
font-size:11px;
cursor:pointer
}

.attach-icon{
width:54px;
height:54px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
background:#edf2ef
}

.attach-item:active .attach-icon{
transform:scale(.94)
}

@keyframes sheetUp{
from{transform:translateY(100%)}
to{transform:translateY(0)}
}

/* ================= CONTEXT MENU ================= */

.bottom-sheet-backdrop{
align-items:center;
padding:15px
}

.context-card{
width:100%;
max-width:430px;
background:rgba(25,35,32,.94);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
border-radius:20px;
padding:12px;
box-shadow:0 15px 50px rgba(0,0,0,.7);
animation:contextIn .18s ease
}

@keyframes contextIn{
from{opacity:0;transform:scale(.94)}
to{opacity:1;transform:scale(1)}
}

.quick-reactions{
display:flex;
justify-content:space-around;
align-items:center;
padding:7px;
margin-bottom:8px;
border-radius:15px;
background:rgba(255,255,255,.06)
}

.quick-reaction{
border:0;
background:transparent;
font-size:23px;
cursor:pointer;
transition:transform .15s
}

.quick-reaction:active{
transform:scale(1.3)
}

.context-actions{
display:flex;
flex-direction:column;
gap:3px
}

.context-action{
width:100%;
height:43px;
border:0;
border-radius:10px;
background:transparent;
color:#fff;
display:flex;
align-items:center;
gap:12px;
padding:0 13px;
font-size:14px;
text-align:right;
cursor:pointer
}

.context-action:active{
background:rgba(255,255,255,.08)
}

.context-action.delete{
color:#ff7777
}

/* ================= CONTACT CARD ================= */

.contact-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.62);
z-index:1100;
display:flex;
align-items:flex-end;
justify-content:center
}

.contact-card{
width:100%;
max-width:650px;
background:#111b18;
border-radius:26px 26px 0 0;
padding:12px 20px 30px;
box-shadow:0 -10px 40px rgba(0,0,0,.6);
animation:sheetUp .23s ease
}

.contact-handle{
width:40px;
height:4px;
background:#52605b;
border-radius:5px;
margin:0 auto 20px
}

.contact-top{
display:flex;
flex-direction:column;
align-items:center;
text-align:center
}

.contact-big-avatar{
width:92px;
height:92px;
border-radius:50%;
overflow:hidden;
background:#26332f;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
margin-bottom:12px
}

.contact-big-avatar img{
width:100%;
height:100%;
object-fit:cover
}

.contact-card-name{
font-size:20px;
font-weight:700
}

.contact-card-id{
font-size:12px;
color:#87928e;
margin-top:4px
}

.contact-status{
font-size:12px;
color:#00e889;
margin-top:7px
}

.contact-actions{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:22px
}

.contact-action{
border:0;
background:#18231f;
color:#fff;
border-radius:14px;
padding:11px 5px;
font-size:11px;
cursor:pointer
}

.contact-action:active{
background:#20312b
}

/* ================= MENU ================= */

#attachMenu{
display:none
}

.hidden-file{
display:none!important
}

/* ================= RESPONSIVE ================= */

@media(max-width:420px){
.message{
max-width:84%;
font-size:14px
}

.call-buttons button{
width:36px;
height:36px
}

.avatar{
width:41px;
height:41px;
min-width:41px
}

.user-name{
font-size:15px
}

.attachment-grid{
gap:15px 6px
}
}
</style>
</head>

<body>

<div id="loading"
style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-size:16px;z-index:999999">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>

<button id="backButton" class="back" type="button" aria-label="رجوع">‹</button>

<div id="headerProfile" class="header-profile">

<div id="friendAvatar" class="avatar">
👤
</div>

<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>

</div>

<div class="call-buttons">

<button id="callButton" type="button" aria-label="اتصال">
⌕
</button>

<button id="videoButton" type="button" aria-label="فيديو">
▣
</button>

<button id="moreButton" type="button" aria-label="المزيد">
⋮
</button>

</div>

</header>

<div id="pinnedBanner" class="pinned-banner">

<div id="pinnedBannerClick" class="pinned-banner-content">

</div>

<button id="pinnedBannerClose" class="pinned-banner-close" type="button">

</button>

</div>

<div id="messages" class="messages">

ابدأ المحادثة الآن
</div>

</div>

<input
id="galleryInput"

>

<input
id="cameraInput"
class="hidden-file"
type="file"
accept="image/*,video/*"
capture="environment"
>

<div id="replyCompose" class="reply-compose"
style="
position:absolute;
bottom:64px;
left:0;
width:100%;
padding:7px 10px;
background:#07100d;
border-top:1px solid rgba(0,232,137,.14);
z-index:70;
display:none;
align-items:center;
gap:8px
">

<div
class="reply-compose-content"
style="
flex:1;
min-width:0;
padding:7px 10px;
background:#111916;
border-radius:10px;
border-right:3px solid #00e889;
overflow:hidden
">

<div id="replyComposeName"
style="font-size:10px;font-weight:bold;color:#00e889;margin-bottom:2px">
الرد على الرسالة
</div>

<div id="replyComposeText"
style="font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
</div>

</div>

<button
id="replyCancel"
type="button"
style="
width:32px;
height:32px;
border:0;
border-radius:10px;
background:#18231f;
color:#fff;
cursor:pointer
">
✕
</button>

</div>

<div class="input-area">

<div class="input-capsule">

<button id="emojiButton" class="input-icon" type="button" aria-label="رموز">
☺
</button>

<input
id="messageInput"
type="text"
placeholder="اكتب رسالة"
autocomplete="off"
maxlength="2000"
>

<button id="attachButton" class="input-icon" type="button" aria-label="مرفقات">
⌕
</button>

</div>

<button id="voiceButton" type="button" aria-label="رسالة صوتية">
●
</button>

<button id="sendButton" type="button" aria-label="إرسال">
➤
</button>

</div>

</main>

/* ================= STATE ================= */

/* ================= HELPERS ================= */

function createChatID(a,b){
return [a,b].sort().join("_");
}

function escapeHtml(value){
return String(value??"").replace(
/[&<>'"]/g,
c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);
}

function getMessagePreview(data){

if(data?.type==="text")
return data.text||"رسالة";

if(data?.type==="image")
return "📷 صورة";

if(data?.type==="video")
return "🎥 فيديو";

if(data?.type==="voice")
return "🎤 رسالة صوتية";

return "رسالة";
}

function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString("ar",{
hour:"2-digit",
minute:"2-digit"
});

}catch{

return "";

}

}

function setUserAvatar(element,user){

element.innerHTML="";

if(user?.photo){

const img=document.createElement("img");

img.src=user.photo;
img.alt="";
img.onerror=()=>{
element.textContent="👤";
};

element.appendChild(img);

}else{

element.textContent="👤";

}

}


/* ================= REPLY ================= */

function startReply(data){

editingMessageId=null;
sendButton.textContent="➤";

replyTarget={
id:data.id,
senderId:data.senderId,

/* ================= REACTIONS ================= */

async function toggleReaction(messageId,emoji){

if(!currentUser||!chatID||!messageId)
return;

try{

const messageRef=
doc(db,"chats",chatID,"messages",messageId);

const snap=await getDoc(messageRef);

if(!snap.exists())
return;

const data=snap.data();

const reactions=
Array.isArray(data.reactions)
?data.reactions
:[];

const mine=reactions.find(
r=>r &&
r.userId===currentUser.uid &&
r.emoji===emoji
);

if(mine){

await updateDoc(
messageRef,
{
reactions:arrayRemove(mine)
}
);

}else{

const oldMine=reactions.find(
r=>r &&
r.userId===currentUser.uid
);

if(oldMine){

await updateDoc(
messageRef,
{
reactions:arrayRemove(oldMine)
}
);

}

await updateDoc(
messageRef,
{
reactions:arrayUnion({
userId:currentUser.uid,
emoji
})
}
);

}

}catch(error){

console.error("Reaction error:",error);

}

}

function renderReactions(box,data){

if(
!Array.isArray(data.reactions) ||
!data.reactions.length
)
return;

const wrapper=
document.createElement("div");

wrapper.className="message-reactions";

const counts={};

for(const reaction of data.reactions){

if(!reaction?.emoji)
continue;

if(!counts[reaction.emoji]){

counts[reaction.emoji]={
count:0,
mine:false
};

}

counts[reaction.emoji].count++;

if(
reaction.userId===currentUser.uid
)
counts[reaction.emoji].mine=true;

}

reactionList.forEach(emoji=>{

const info=counts[emoji];

if(!info)
return;

const chip=
document.createElement("button");

chip.type="button";

chip.className=
"reaction-chip"+
(info.mine?" mine":"");

chip.innerHTML=
escapeHtml(emoji)+
(
info.count>1
?` <span class="reaction-count">${info.count}</span>`
:""
);

chip.onclick=e=>{
e.stopPropagation();
toggleReaction(data.id,emoji);
};

wrapper.appendChild(chip);

});

if(wrapper.children.length)
box.appendChild(wrapper);

}

/* ================= MESSAGE ACTIONS ================= */

function setupSwipeToReply(element,data){

let startX=0;
let currentX=0;
let swiping=false;

element.addEventListener(
"touchstart",
e=>{

startX=e.touches[0].clientX;
currentX=startX;
swiping=true;

},
{passive:true}
);

element.addEventListener(
"touchmove",
e=>{

if(!swiping)
return;

currentX=e.touches[0].clientX;

const diff=currentX-startX;

if(
data.senderId!==currentUser.uid &&
diff>0 &&
diff<100
){

element.style.transform=
`translateX(${diff}px)`;

}else if(
data.senderId===currentUser.uid &&
diff<0 &&
diff>-100
){

element.style.transform=
`translateX(${diff}px)`;

}

},
{passive:true}
);

element.addEventListener(
"touchend",
()=>{

if(!swiping)
return;

swiping=false;

const diff=currentX-startX;

if(Math.abs(diff)>65)
startReply(data);

element.style.transform="translateX(0)";

}
);

}

function addMessageActions(element,data){

let timer=null;
let longPress=false;
let lastClick=0;

element.addEventListener(
"pointerdown",
()=>{

longPress=false;

timer=setTimeout(()=>{

longPress=true;

showContextMenu(data);

},500);

}
);

element.addEventListener(
"pointerup",
()=>{

clearTimeout(timer);

}
);

element.addEventListener(
"pointercancel",
()=>{

clearTimeout(timer);

}
);

element.addEventListener(
"contextmenu",
e=>{

e.preventDefault();

showContextMenu(data);

}
);

element.addEventListener(
"click",
e=>{

if(longPress)
return;

if(
e.target.closest("button") ||
e.target.closest(".message-reply") ||
e.target.closest("video")
)
return;

const now=Date.now();

if(now-lastClick<300){

triggerHeartReaction(
element,
data.id
);

}

lastClick=now;

}
);

setupSwipeToReply(element,data);

}

async function uploadMediaAndSend(file,type){

if(
!file ||
!currentUser ||
!friendUser ||
!chatID
)
return;

const maxSize=
type==="video"
?80*1024*1024
:15*1024*1024;

if(file.size>maxSize){

alert(
type==="video"
?"الفيديو كبير جداً"
:"الصورة كبيرة جداً"
);

return;

}

try{

const safeName=
file.name
.replace(/[^\w.\-]+/g,"_")
.slice(-80);

const fileName=
`${currentUser.uid}/${Date.now()}_${safeName}`;

const result=
await supabase.storage
.from("mecd-media")
.upload(
fileName,
file,
{
upsert:false,
contentType:file.type
}
);

if(result.error)
throw result.error;

const publicResult=
supabase.storage
.from("mecd-media")
.getPublicUrl(fileName);

const mediaUrl=
publicResult.data.publicUrl;

await addDoc(
collection(
db,
"chats",
chatID,
"messages"
),
{

url:mediaUrl,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

type,

read:false,

deletedFor:[],

createdAt:
serverTimestamp()

}
);

}catch(error){

console.error(
"Upload error:",
error
);

alert(
"فشل رفع الملف. تأكد من إعداد Storage."
);

}

}

lastSeen;

"user-status";

}else{

friendStatus.textContent=
"● غير متصل";

friendStatus.className=
"user-status";

}

},
error=>{

console.error(
"Status listener error:",
error
);

friendStatus.textContent=
"● غير متصل";

}
);

}


/* ================= LOAD FRIEND ================= */

async function loadFriend(){

const params=
new URLSearchParams(
location.search
);

const friendId=
params.get("friend");

if(!friendId)
throw new Error(
"لا يوجد معرف صديق في الرابط"
);

if(friendId===currentUser.uid)
throw new Error(
"لا يمكنك فتح محادثة مع نفسك"
);

const snap=
await getDoc(
doc(db,"users",friendId)
);

if(!snap.exists())
throw new Error(
"المستخدم غير موجود"
);

const data=snap.data();

friendUser={
uid:friendId,
name:
data.name||
data.displayName||
"مستخدم",
photo:
data.photo||
data.photoURL||
""
};

friendName.textContent=
friendUser.name;

setUserAvatar(
friendAvatar,
friendUser
);

chatID=
createChatID(
currentUser.uid,
friendUser.uid
);

listenFriendStatus();

}


/* ================= AUTH ================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

loading.textContent=
"يجب تسجيل الدخول أولاً";

return;

}

currentUser=user;

try{

await loadFriend();

listenMessages();

loading.style.display="none";

app.style.display="flex";

requestAnimationFrame(()=>{

messages.scrollTop=
messages.scrollHeight;

});

}catch(error){

console.error(error);

loading.textContent=
error?.message||
"حدث خطأ أثناء فتح الدردشة";

}

});


/* ================= CLEANUP ================= */

window.addEventListener(
"beforeunload",
()=>{

if(unsubscribeMessages)
unsubscribeMessages();

if(unsubscribeFriend)
unsubscribeFriend();

}
);

</script>
