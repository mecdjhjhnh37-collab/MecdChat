<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b141a">
<title>WhatsApp Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

html,body{
width:100%;
height:100%
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:#e9edef;
background:#0b141a;
overflow:hidden
}

.app{
height:100vh;
max-width:650px;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
background: radial-gradient(circle at center, rgba(11,20,26,0.95), rgba(11,20,26,0.98)), url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
background-blend-mode: overlay;
}

header{
height:60px;
display:flex;
align-items:center;
gap:12px;
padding:10px 16px;
background:#202c33;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
z-index:10
}

.back{
width:36px;
height:36px;
border:0;
border-radius:50%;
background:transparent;
color:#aebac1;
font-size:20px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}
.back:hover{
background:rgba(255,255,255,0.05);
}

.avatar,
.call-avatar{
width:40px;
height:40px;
border-radius:50%;
background:#2a3942;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:20px;
flex-shrink:0
}

.avatar img,
.call-avatar img,
.local-avatar img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%
}

.user-info{
flex:1;
min-width:0
}

.user-name{
font-size:16px;
font-weight:500;
color:#e9edef;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.user-status{
font-size:13px;
color:#8696a0;
margin-top:2px;
transition:.2s
}

.user-status.online,
.user-status.typing,
.user-status.recording{
color:#00a884
}

.user-status.recording{
font-weight:normal
}

.call-buttons{
display:flex;
gap:4px;
flex-shrink:0
}

.call-buttons button{
width:40px;
height:40px;
border:0;
border-radius:50%;
background:transparent;
color:#aebac1;
font-size:18px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}
.call-buttons button:hover{
background:rgba(255,255,255,0.05);
}

.messages{
flex:1;
min-height:0;
overflow-y:auto;
padding:20px 16px 150px;
display:flex;
flex-direction:column;
gap:4px;
scroll-behavior: smooth;
}

.empty{
margin:auto;
text-align:center;
color:#8696a0;
line-height:1.8
}

.message{
max-width:65%;
padding:6px 7px 8px 9px;
border-radius:7.5px;
position:relative;
word-break:break-word;
overflow-wrap:anywhere;
user-select:none;
line-height:1.45;
min-width:60px;
font-size:14.2px;
overflow:visible !important;
transition: transform 0.15s ease-out, background-color 0.5s ease;
margin-bottom: 2px;
box-shadow: 0 1px 0.5px rgba(11,20,26,0.13);
}

.message.mine{
align-self:flex-end;
background:#005c4b;
color:#e9edef;
border-top-right-radius:0;
}

.message.other{
align-self:flex-start;
background:#202c33;
color:#e9edef;
border-top-left-radius:0;
}

.message.highlight {
background-color: #00a884 !important;
color: #000 !important;
transition: background-color 0.2s ease;
}

.heart-pop {
position: absolute;
bottom: -22px;
right: 15px;
transform: scale(0);
font-size: 24px;
animation: popEffect 0.4s ease forwards;
pointer-events: none;
z-index: 30;
background: #202c33;
border-radius: 50%;
padding: 2px 4px;
box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.message.mine .heart-pop {
right: auto;
left: 15px;
}

@keyframes popEffect {
0% { transform: scale(0); opacity: 0; }
50% { transform: scale(1.3); opacity: 1; }
100% { transform: scale(1); opacity: 1; }
}

.time{
display:inline-block;
font-size:11px;
color:#8696a0;
margin-left:4px;
vertical-align: bottom;
float: left;
margin-top: 4px;
margin-right: 4px;
}

.message.mine .time {
color: #8696a0;
}

.message-meta{
display:inline-block;
float: left;
margin-top: 4px;
vertical-align: bottom;
}

.message-status{
font-size:13px;
font-weight:bold;
direction:ltr;
display:inline-block;
vertical-align: bottom;
color:#8696a0;
}

.message-status.read{
color:#53bdeb
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:6px 16px 10px;
display:flex;
align-items: center;
gap:8px;
background:#202c33;
z-index:50
}

#messageInput{
flex:1;
min-width:0;
padding:9px 12px;
border-radius:8px;
border:none;
background:#2a3942;
color:#e9edef;
outline:none;
font-size:15px
}

#messageInput::placeholder {
color: #8696a0;
}

#messageInput:focus{
border-color:transparent
}

#voiceButton,
#sendButton,
#attachButton{
width:40px;
height:40px;
border:0;
border-radius:50%;
font-size:20px;
cursor:pointer;
flex-shrink:0;
display: flex;
align-items: center;
justify-content: center;
background: transparent;
color: #8696a0;
}

#attachButton{
color:#8696a0;
font-size:22px;
transition:.15s
}

#attachButton:hover{
color:#e9edef;
}

#attachButton:active{
transform:scale(.92)
}

#voiceButton{
color:#8696a0;
transition:.18s
}

#voiceButton:hover{
color:#e9edef;
}

#voiceButton.recording{
background:#321817;
color:#ff5555;
transform:scale(1.05)
}

#sendButton{
background:transparent;
color:#00a884;
font-size:18px;
}

#sendButton:hover{
color:#00c29a;
}

#sendButton:disabled{
opacity:.4;
cursor: default;
}

#attachMenu{
position:fixed;
bottom:65px;
left:16px;
width:200px;
padding:8px 0;
background:#233138;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.4);
display:none;
z-index:1000
}

#attachMenu.show{
display:block
}

.attach-option{
width:100%;
height:40px;
border:0;
background:transparent;
color:#e9edef;
display:flex;
align-items:center;
gap:14px;
padding:0 16px;
font-size:14px;
cursor:pointer;
}

.attach-option:hover{
background:rgba(255,255,255,0.05);
}

.attach-icon{
font-size:18px;
width:24px;
text-align:center
}

.hidden-file{
display:none!important
}

.image-message,
.video-message{
padding:3px !important;
width:max-content !important;
max-width:82vw !important;
overflow:visible !important;
display:flex !important;
flex-direction:column !important;
align-items:flex-start !important;
box-sizing:border-box !important;
flex:0 0 auto !important;
border-radius:8px !important;
}

.message-image,
.message-video{
display:block !important;
width:auto !important;
height:auto !important;
max-width:100% !important;
max-height:300px !important;
border-radius:6px !important;
object-fit:contain !important;
cursor:pointer !important;
user-select:none !important;
flex:0 0 auto !important;
}

.message-image{
object-fit:contain !important;
}

.message-video{
background:#000 !important;
}

.image-message .message-meta,
.video-message .message-meta{
padding:0 4px 2px !important;
width:100% !important;
box-sizing:border-box !important;
}

.voice-message{
display:block !important;
width:280px !important;
max-width:calc(100% - 20px) !important;
min-width:230px !important;
height:auto !important;
min-height:60px !important;
padding:6px 8px !important;
border-radius:8px !important;
position:relative !important;
overflow:visible !important;
flex:none !important;
box-sizing:border-box !important;
background:transparent !important;
border:none !important;
line-height:normal !important;
white-space:normal !important
}

.message.mine.voice-message{
align-self:flex-end !important;
background:transparent !important;
color:#e9edef;
}

.message.other.voice-message{
align-self:flex-start !important;
background:transparent !important;
}

.voice-message-box{
display:flex !important;
align-items:center !important;
gap:8px !important;
direction:rtl !important;
width:100% !important;
height:auto !important;
min-height:40px !important;
flex:none !important;
overflow:hidden !important;
border-radius:inherit;
}

.voice-icon{
width:36px !important;
height:36px !important;
min-width:36px !important;
max-width:36px !important;
border-radius:50% !important;
display:flex !important;
align-items:center !important;
justify-content:center !important;
background:#2a3942 !important;
color:#00a884 !important;
font-size:16px !important;
flex:none !important;
}

.voice-message.mine .voice-icon{
background:#005c4b !important;
color:#e9edef !important;
}

.voice-player{
display:block !important;
flex:1 1 auto !important;
width:auto !important;
min-width:0 !important;
height:auto !important
}

.voice-controls{
display:flex !important;
align-items:center !important;
gap:8px !important;
width:100% !important;
height:32px !important;
min-height:32px !important
}

.voice-play{
width:32px !important;
height:32px !important;
min-width:32px !important;
max-width:32px !important;
border:0 !important;
border-radius:50% !important;
background:#00a884 !important;
color:#fff !important;
display:flex !important;
align-items:center !important;
justify-content:center !important;
font-size:12px !important;
cursor:pointer !important;
flex:none !important;
transition:transform .15s,background .15s
}

.voice-play:active{
transform:scale(.90)
}

.voice-message.mine .voice-play{
background:#00a884 !important;
color:#fff !important
}

.voice-progress{
flex:1 1 auto !important;
width:auto !important;
min-width:30px !important;
height:4px !important;
min-height:4px !important;
max-height:4px !important;
border-radius:2px !important;
background:#374248 !important;
overflow:hidden !important;
cursor:pointer !important;
position:relative !important;
}

.voice-progress-fill{
width:0%;
height:100% !important;
background:#00a884 !important;
border-radius:2px;
transition:width .05s linear
}

.voice-message.mine .voice-progress{
background:#227c6f !important
}

.voice-message.mine .voice-progress-fill{
background:#e9edef !important
}

.voice-time{
font-size:11px !important;
color:#8696a0 !important;
width:36px !important;
min-width:36px !important;
max-width:36px !important;
text-align:center !important;
direction:ltr !important;
flex:none !important
}

.voice-message.mine .voice-time{
color:#8696a0 !important;
}

.voice-label{
display:none !important;
}

.voice-audio{
display:none !important;
width:0 !important;
height:0 !important
}

.call-message{
min-width:220px;
max-width:280px
}

.call-box{
display:flex;
align-items:center;
gap:10px
}

.call-icon{
width:38px;
height:38px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,168,132,.15);
color:#00a884;
font-size:18px;
flex-shrink:0
}

.call-info{
flex:1;
min-width:0
}

.call-title{
font-size:14px;
font-weight:500;
color:#e9edef;
}

.call-subtitle{
font-size:12px;
color:#8696a0;
margin-top:2px;
}

.call-duration{
font-size:11px;
color:#8696a0;
margin-top:2px;
}

.call-message.missed .call-icon{
background:rgba(239,68,68,.15);
color:#ef4444
}

.call-message.rejected .call-icon,
.call-message.cancelled .call-icon{
background:rgba(255,255,255,.08);
color:#8696a0
}

.message-reply{
display:flex;
align-items:stretch;
gap:6px;
margin-bottom:4px;
padding:6px 8px;
border-radius:6px;
background:rgba(0,0,0,.2);
border-right:3px solid #00a884;
font-size:12px;
max-width:100%;
overflow:hidden;
cursor:pointer;
transition: background 0.2s;
}

.message-reply:hover{
background:rgba(0,0,0,.35);
}

.message.other .message-reply{
background:rgba(255,255,255,.04)
}

.reply-line{
display:none;
}

.reply-content{
min-width:0;
overflow:hidden
}

.reply-name{
font-weight:500;
font-size:12px;
margin-bottom:2px;
color:#00a884
}

.message.mine .reply-name{
color:#53bdeb
}

.reply-text{
color:#8696a0;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.message-reactions{
display:flex;
align-items:center;
flex-wrap:wrap;
gap:4px;
margin-top: 4px;
position: relative;
z-index: 5;
}

.reaction-chip{
border:none;
background:#111b21;
border-radius:12px;
padding:2px 6px;
font-size:12px;
line-height:16px;
cursor:pointer;
display:flex;
align-items:center;
gap:3px;
box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.reaction-chip.mine{
background:#202c33;
border:1px solid rgba(0,168,132,0.3);
}

.reaction-count{
font-size:11px;
color:#8696a0;
}

.pinned-label{
display:flex;
align-items:center;
gap:4px;
font-size:11px;
color:#00a884;
margin-bottom:4px;
font-weight:500;
}

.message.mine .pinned-label{
color:#53bdeb;
}

.reply-compose{
position:fixed;
bottom:65px;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:8px 16px;
background:#202c33;
border-top:1px solid rgba(255,255,255,.08);
z-index:45;
display:none;
align-items:center;
gap:12px
}

.reply-compose.show{
display:flex
}

.reply-compose-content{
flex:1;
min-width:0;
padding:6px 10px;
background:#2a3942;
border-radius:8px;
border-right:3px solid #00a884;
overflow:hidden
}

.reply-compose-name{
font-size:12px;
font-weight:500;
color:#00a884;
margin-bottom:2px
}

.reply-compose-text{
font-size:13px;
color:#8696a0;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.reply-cancel{
width:32px;
height:32px;
border:0;
border-radius:50%;
background:transparent;
color:#8696a0;
font-size:16px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}
.reply-cancel:hover{
background:rgba(255,255,255,0.05);
color:#e9edef;
}

.message-menu{
position:absolute !important;
left:50% !important;
bottom:calc(100% + 6px) !important;
transform:translateX(-50%) !important;
width:170px !important;
min-width:170px !important;
max-width:170px !important;
height:auto !important;
min-height:0 !important;
padding:6px 0 !important;
background:#233138 !important;
border-radius:8px !important;
box-shadow:0 4px 15px rgba(0,0,0,.5) !important;
z-index:999999 !important;
display:block !important;
flex:none !important;
white-space:normal !important;
}

.message-menu button{
width:100% !important;
min-width:0 !important;
height:auto !important;
min-height:36px !important;
padding:8px 16px !important;
border:0 !important;
border-radius:0 !important;
background:transparent !important;
color:#e9edef !important;
font-size:14px !important;
font-weight:normal !important;
text-align:right !important;
cursor:pointer !important;
display:block !important;
}

.message-menu button:hover{
background:rgba(255,255,255,0.05) !important;
}

#incomingCall{
position:fixed;
top:70px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
padding:14px 16px;
background:#202c33;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,.6);
z-index:9000;
display:none;
align-items:center;
justify-content:space-between;
gap:12px
}

.incoming-call-info{
display:flex;
align-items:center;
gap:12px;
min-width:0
}

.incoming-name{
font-size:15px;
font-weight:500;
color:#e9edef;
}

.incoming-type{
font-size:13px;
color:#8696a0;
margin-top:2px
}

.incoming-actions{
display:flex;
gap:8px
}

.incoming-actions button{
width:40px;
height:40px;
border:0;
border-radius:50%;
font-size:18px;
color:#fff;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

#rejectIncoming{
background:#ef4444
}

#acceptIncoming{
background:#00a884;
color:#fff;
}

#callScreen{
position:fixed;
inset:0;
background:#0b141a;
z-index:10000;
display:none;
flex-direction:column;
overflow:hidden
}

.call-top{
height:80px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(180deg,rgba(0,0,0,.6),transparent)
}

.call-top-info{
text-align:center
}

#callTitle{
font-size:18px;
font-weight:500;
color:#e9edef;
}

#callState{
font-size:13px;
color:#00a884;
margin-top:4px
}

#callDuration{
font-size:12px;
color:#8696a0;
margin-top:2px
}

#audioCallView{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#0b141a
}

#videoArea{
position:relative;
flex:1;
background:#000;
overflow:hidden;
display:none
}

#remoteVideo{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
background:#000;
display:none
}

#remoteAvatar{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#111b21;
z-index:1
}

#remoteAvatar img{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover
}

#remoteAvatarEmoji{
font-size:60px
}

#localVideo{
position:absolute;
width:100px;
height:140px;
left:16px;
top:16px;
object-fit:cover;
border-radius:8px;
border:1px solid rgba(255,255,255,.2);
background:#111;
z-index:5;
display:none
}

#localAvatar{
position:absolute;
width:100px;
height:100px;
left:16px;
top:16px;
border-radius:50%;
background:#2a3942;
z-index:6;
display:none;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:35px
}

.call-controls{
min-height:90px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
background:#111b21;
z-index:20
}

.call-control{
width:50px;
height:50px;
border:0;
border-radius:50%;
background:#2a3942;
color:#e9edef;
font-size:20px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.call-control.accept{
background:#00a884;
color:#fff
}

.call-control.reject,
.call-control.end{
background:#ef4444;
color:#fff;
}

.call-control.active{
background:#00a884;
color:#fff
}

.hidden{
display:none!important
}

@media(max-width:500px){
.message{max-width:78%}
.voice-message{width:260px !important;max-width:calc(100vw - 60px) !important;min-width:220px !important}
header{padding:8px 12px}
#incomingCall{top:60px}
#localVideo{width:90px;height:120px;left:12px;top:12px}
#localAvatar{width:90px;height:90px;left:12px;top:12px}
.call-control{width:46px;height:46px}
.message-menu{
width:160px !important;
min-width:160px !important;
max-width:160px !important
}
}
</style>
</head>

<body>

<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b141a;color:#e9edef;font-size:16px;z-index:999999">
جارٍ فتح الدردشة...
</div>

<main id="app" class="app" style="display:none">

<header>
<button id="backButton" class="back" type="button">➔</button>
<div id="friendAvatar" class="avatar">👤</div>
<div class="user-info">
<div id="friendName" class="user-name">جار التحميل...</div>
<div id="friendStatus" class="user-status">غير متصل</div>
</div>
<div class="call-buttons">
<button id="callButton" type="button">📞</button>
<button id="videoButton" type="button">📹</button>
</div>
</header>

<div id="messages" class="messages">
<div class="empty">💬<br>ابدأ المحادثة الآن</div>
</div>

<div id="attachMenu">
<button id="galleryButton" class="attach-option" type="button">
<span class="attach-icon">🖼️</span>
<span>صورة أو فيديو</span>
</button>
<button id="cameraButton" class="attach-option" type="button">
<span class="attach-icon">📷</span>
<span>كاميرا</span>
</button>

async function uploadMediaToSupabase(file){
if(!file) throw new Error("لم يتم اختيار ملف.");
if(!file.type.startsWith("image/") && !file.type.startsWith("video/")){
throw new Error("الملف يجب أن يكون صورة أو فيديو.");
}

const extension = file.name.includes(".") ? file.name.split(".").pop().toLowerCase() : (file.type.startsWith("video/") ? "mp4" : "jpg");
const filePath = `${currentUser.uid}/${Date.now()}_${crypto.randomUUID()}.${extension}`;

const { error: uploadError } = await supabase.storage.from(SUPABASE_BUCKET).upload(filePath, file, {
cacheControl: "3600",
contentType: file.type,
upsert: false
});

if(uploadError){
throw new Error("تعذر رفع الملف: " + (uploadError.message || "خطأ في التخزين"));
}

const { data: publicData } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(filePath);
const publicUrl = publicData?.publicUrl;
if(!publicUrl) throw new Error("تم رفع الملف ولكن تعذر الحصول على رابطه.");

return {
url: publicUrl,
path: filePath,
type: file.type,
size: file.size,
name: file.name || ""
};
}

function setupSwipeToReply(element, data){
let startX = 0;
let currentX = 0;
let isSwiping = false;

element.addEventListener("touchstart", e => {
startX = e.touches[0].clientX;
isSwiping = true;
});

element.addEventListener("touchmove", e => {
if (!isSwiping) return;
currentX = e.touches[0].clientX;
let diffX = currentX - startX;
if (data.senderId !== currentUser.uid && diffX > 0 && diffX < 120) {
element.style.transform = `translateX(${diffX}px)`;
} else if (data.senderId === currentUser.uid && diffX < 0 && diffX > -120) {
element.style.transform = `translateX(${diffX}px)`;
}
});

element.addEventListener("touchend", () => {
if (!isSwiping) return;
isSwiping = false;
let diffX = currentX - startX;
if (Math.abs(diffX) > 60) {
startReply(data);
}
element.style.transform = "translateX(0px)";
});
}

function addMessageActions(element, data){
let timer = null;
const cancel = () => { clearTimeout(timer); };

element.addEventListener("pointerdown", e => {
if(e.target.closest(".message-menu") || e.target.closest("button") || e.target.closest("video") || e.target.closest(".message-reply")) return;
timer = setTimeout(() => { showMessageMenu(element, data); }, 500);
});

element.addEventListener("pointerup", cancel);
element.addEventListener("pointercancel", cancel);
element.addEventListener("contextmenu", e => {
e.preventDefault();
showMessageMenu(element, data);
});

let lastClickTime = 0;
element.addEventListener("click", e => {
if(e.target.closest(".message-menu") || e.target.closest("button") || e.target.closest(".message-reply")) return;
const currentTime = new Date().getTime();
const tapLength = currentTime - lastClickTime;
if (tapLength < 300 && tapLength > 0) {
triggerHeartReaction(element, data.id);
e.preventDefault();
}
lastClickTime = currentTime;
});

setupSwipeToReply(element, data);
}

if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)){

}else if(data.type === "image"){

let ringtoneContext = null;
let ringtoneTimer = null;
let ringtoneGain = null;

function startRingtone(){
stopRingtone();
try{
ringtoneContext = new (window.AudioContext || window.webkitAudioContext)();
ringtoneGain = ringtoneContext.createGain();
ringtoneGain.gain.value = 0.06;
ringtoneGain.connect(ringtoneContext.destination);

const playTone = () => {
if(!ringtoneContext) return;
const osc = ringtoneContext.createOscillator();
osc.type = "sine";
osc.frequency.value = 880;
osc.connect(ringtoneGain);
osc.start();
osc.stop(ringtoneContext.currentTime + 0.35);
};

playTone();
ringtoneTimer = setInterval(playTone, 1200);
}catch(e){
console.warn("Ringtone notice:", e);
}
}

function stopRingtone(){
if(ringtoneTimer){
clearInterval(ringtoneTimer);
ringtoneTimer = null;
}
if(ringtoneContext){
try{ ringtoneContext.close(); }catch{}
ringtoneContext = null;
}
ringtoneGain = null;
}

async function playRemoteAudio(){

}

async function addCandidate(candidate){
if(!peerConnection || !candidate) return;
if(peerConnection.remoteDescription){
try{
await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
}catch(e){
console.error("ICE error:", e);
}
}else{
pendingIceCandidates.push(candidate);
}
}

async function flushIce(){
if(!peerConnection || !peerConnection.remoteDescription) return;
const list = pendingIceCandidates.splice(0);
for(const candidate of list){
try{
await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
}catch(e){
console.error("ICE queue error:", e);
}
}
}

function createPeer(){
const pc = new RTCPeerConnection(rtcConfig);

pc.onnegotiationneeded = async () => {
try{
const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
if(activeCallId && activeCallRole === "caller"){
await updateDoc(doc(db, "calls", activeCallId), {
offer: { type: offer.type, sdp: offer.sdp }
});
}
}catch(e){
console.error("Negotiation error:", e);
}
};

pc.onicecandidate = async e => {
if(!e.candidate || !activeCallId || !currentUser) return;
try{
await addDoc(collection(db, "calls", activeCallId, "candidates"), {
senderId: currentUser.uid,
candidate: e.candidate.toJSON(),
createdAt: serverTimestamp()
});
}catch(error){
console.error("ICE save error:", error);
}
};

pc.ontrack = e => {
const stream = e.streams?.[0];
if(!stream) return;
remoteAudio.srcObject = stream;
const hasVideo = stream.getVideoTracks().some(t => t.readyState !== "ended");

if(hasVideo){
remoteVideo.srcObject = stream;
remoteVideo.muted = true;
remoteVideo.style.display = "block";
remoteAvatar.style.display = "none";
videoArea.style.display = "block";
audioCallView.style.display = "none";
remoteVideo.play().catch(() => {});
}else{
playRemoteAudio();
}
};

pc.onconnectionstatechange = async () => {
const state = pc.connectionState;
if(state === "connected"){
stopOutgoingTimeout();
callState.textContent = "متصل";
showConnectedButtons();
startCallTimer();
await playRemoteAudio();
}
if(state === "connecting"){
callState.textContent = "جارٍ الاتصال...";
}
if(state === "disconnected"){
callState.textContent = "انقطع الاتصال";
}
if(state === "failed"){
callState.textContent = "تعذر الاتصال";
setTimeout(() => { if(activeCallId) finishCall(); }, 1500);
}
};

return pc;
}

async function prepareAudioVideoChannel(){
if(!peerConnection) return;
const exists = peerConnection.getTransceivers().some(t => t.receiver?.track?.kind === "video");
if(exists) return;
try{
peerConnection.addTransceiver("video", { direction: "sendrecv" });
}catch(e){
console.error("Video transceiver error:", e);
}
}

async function getVideoSender(){
if(!peerConnection) return null;
const transceiver = peerConnection.getTransceivers().find(t => t.receiver?.track?.kind === "video");
if(transceiver) return transceiver.sender;
const sender = peerConnection.getSenders().find(s => s.track?.kind === "video");
return sender || null;
}

async function enableVideoForCall(updateFirestore = true){
if(!activeCallId || !peerConnection || !localStream) return;
if(localStream.getVideoTracks().some(track => track.readyState !== "ended")){
activeCallType = "video";
setupCallVisuals();
showConnectedButtons();
return;
}

try{
callState.textContent = "جارٍ تشغيل الكاميرا...";
const videoStream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: { ideal: cameraFacing } }
});
const newTrack = videoStream.getVideoTracks()[0];
if(!newTrack) throw new Error("لم يتم الحصول على الكاميرا");

const sender = await getVideoSender();
if(!sender){
newTrack.stop();
throw new Error("قناة الفيديو غير جاهزة");
}

await sender.replaceTrack(newTrack);
localStream.addTrack(newTrack);
localVideo.srcObject = localStream;
localVideo.style.display = "block";
activeCallType = "video";
setupCallVisuals();
showConnectedButtons();

if(updateFirestore){
try{
const snap = await getDoc(doc(db, "calls", activeCallId));
if(snap.exists()){
await updateDoc(doc(db, "calls", activeCallId), {
callType: "video",
videoEnabled: true,
videoChangedAt: serverTimestamp()
});
}
}catch(e){
console.error("Video sync error:", e);
}
}
callState.textContent = "متصل";
}catch(e){
console.error("Enable video error:", e);
callState.textContent = "متصل";
}
}

function startOutgoingTimeout(){
clearTimeout(callTimeout);
callTimeout = setTimeout(async () => {
if(!activeCallId || activeCallRole !== "caller") return;
const id = activeCallId;
try{
const snap = await getDoc(doc(db, "calls", id));

await updateDoc(doc(db, "calls", id), {

endedAt: serverTimestamp()
});
await saveCallMessage("missed", 0);

}
cleanupCall();

}

async function startCall(type){
if(activeCallId){
alert("هناك مكالمة نشطة");
return;
}
if(!currentUser || !friendUser) return;

activeCallId = crypto.randomUUID();
activeCallType = type;
activeCallRole = "caller";
activeCallPeer = {
uid: friendUser.uid,
name: friendUser.name,
photo: friendUser.photo
};
callSeconds = 0;
callMessageSaved = false;
pendingIceCandidates = [];

showCallScreen();
showOutgoingButtons();
callState.textContent = "جارٍ الاتصال...";

try{
localStream = await navigator.mediaDevices.getUserMedia({
audio: true,
video: type === "video"
});

if(type === "video"){
localVideo.srcObject = localStream;
localVideo.style.display = "block";
}

peerConnection = createPeer();
if(type === "audio"){
await prepareAudioVideoChannel();
}

localStream.getTracks().forEach(track => {
peerConnection.addTrack(track, localStream);
});

const offer = await peerConnection.createOffer();
await peerConnection.setLocalDescription(offer);

await setDoc(doc(db, "calls", activeCallId), {
callId: activeCallId,
callerId: currentUser.uid,
receiverId: friendUser.uid,
callType: type,
status: "ringing",
offer: { type: offer.type, sdp: offer.sdp },
createdAt: serverTimestamp(),
videoEnabled: type === "video"
});

listenCallerCall();
startOutgoingTimeout();
}catch(e){
console.error("Start call error:", e);
await cancelOutgoingCall(false);
}
}

function listenCallerCall(){
if(unsubscribeActiveCall) unsubscribeActiveCall();
unsubscribeActiveCall = onSnapshot(doc(db, "calls", activeCallId), async snap => {
if(!snap.exists()){
cleanupCall();
return;
}
const data = snap.data();
if(["cancelled", "rejected", "missed", "ended"].includes(data.status)){
stopRingtone();
callSeconds = Number(data.duration || 0);
cleanupCall();
return;
}

if(data.callType === "video" && activeCallType === "audio" && peerConnection && localStream){
await enableVideoForCall(false);
}

if(data.answer && peerConnection && !peerConnection.currentRemoteDescription){
try{
await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
await flushIce();
await playRemoteAudio();
}catch(e){
console.error("Answer set error:", e);
}
}

if(data.status === "ringing"){
callState.textContent = data.receivedAt ? "يرن" : "جارٍ الاتصال...";
}
if(data.status === "connected"){
stopOutgoingTimeout();
stopRingtone();
callState.textContent = "متصل";
showConnectedButtons();
startCallTimer();
await playRemoteAudio();
}
});
listenCallCandidates();
}

function listenIncomingCalls(){
if(!currentUser) return;
if(unsubscribeIncomingCalls) unsubscribeIncomingCalls();

const q = query(collection(db, "calls"), where("receiverId", "==", currentUser.uid));
unsubscribeIncomingCalls = onSnapshot(q, async snapshot => {
for(const change of snapshot.docChanges()){
if(change.type !== "added" && change.type !== "modified") continue;
const id = change.doc.id;
const data = change.doc.data();

if(data.receiverId !== currentUser.uid || data.status !== "ringing" || !data.offer) continue;
if(activeCallId) continue;
if(handledIncomingCalls.has(id)) continue;
handledIncomingCalls.add(id);

const callerSnap = await getDoc(doc(db, "users", data.callerId));
const callerData = callerSnap.exists() ? callerSnap.data() : {};

activeCallId = id;
activeCallType = data.callType || "audio";
activeCallRole = "receiver";
activeCallPeer = {
uid: data.callerId,
name: callerData.name || "مستخدم WhatsApp",
photo: callerData.photo || callerData.photoURL || ""
};
callSeconds = 0;
callMessageSaved = false;
pendingIceCandidates = [];

showIncoming();
startRingtone();
listenReceiverCallStatus();
}
});
}

function listenReceiverCallStatus(){
if(!activeCallId) return;
if(unsubscribeActiveCall) unsubscribeActiveCall();
unsubscribeActiveCall = onSnapshot(doc(db, "calls", activeCallId), async snap => {
if(!snap.exists()){
stopRingtone();
cleanupCall();
return;
}
const data = snap.data();
if(["cancelled", "missed", "rejected", "ended"].includes(data.status)){
stopRingtone();
cleanupCall();
return;
}
if(data.callType === "video" && activeCallType === "audio" && peerConnection && localStream){
await enableVideoForCall(false);
}
});
listenCallCandidates();
}

async function acceptIncomingCall(){
if(!activeCallId || !activeCallPeer) return;
try{
const callId = activeCallId;
const snap = await getDoc(doc(db, "calls", callId));
if(!snap.exists()){
stopRingtone();
cleanupCall();
return;
}
const data = snap.data();
if(data.status !== "ringing"){
stopRingtone();
cleanupCall();
return;
}

stopRingtone();
incomingCall.style.display = "none";
showCallScreen();
callState.textContent = "جارٍ الاتصال...";

localStream = await navigator.mediaDevices.getUserMedia({
audio: true,
video: activeCallType === "video"
});

if(activeCallType === "video"){
localVideo.srcObject = localStream;
localVideo.style.display = "block";
}

peerConnection = createPeer();
localStream.getTracks().forEach(track => {
peerConnection.addTrack(track, localStream);
});

await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
await flushIce();

const answer = await peerConnection.createAnswer();
await peerConnection.setLocalDescription(answer);

await updateDoc(doc(db, "calls", callId), {
answer: { type: answer.type, sdp: answer.sdp },
status: "connected",
callType: activeCallType,
receivedAt: serverTimestamp(),
videoEnabled: activeCallType === "video"
});

showConnectedButtons();
startCallTimer();
await playRemoteAudio();
}catch(e){
console.error("Accept call error:", e);
stopRingtone();
cleanupCall();
}
}

function listenCallCandidates(){
if(unsubscribeCandidates) unsubscribeCandidates();
if(!activeCallId) return;
const callId = activeCallId;

unsubscribeCandidates = onSnapshot(collection(db, "calls", callId, "candidates"), snapshot => {
snapshot.docChanges().forEach(change => {
if(change.type !== "added") return;
const data = change.doc.data();
if(data.senderId === currentUser.uid) return;
if(activeCallId !== callId) return;
addCandidate(data.candidate);
});
});
}

async function rejectIncomingCall(){
const id = activeCallId;
stopRingtone();
if(!id){
cleanupCall();
return;
}
try{
const snap = await getDoc(doc(db, "calls", id));
if(snap.exists()){
await updateDoc(doc(db, "calls", id), {
status: "rejected",
duration: 0,
endedAt: serverTimestamp()
});
await saveCallMessage("rejected", 0);
}
}catch(e){
console.error("Reject error:", e);
}
cleanupCall();
}

async function cancelOutgoingCall(saveMessage = true){
const id = activeCallId;
stopRingtone();
if(!id){
cleanupCall();
return;
}
try{
const snap = await getDoc(doc(db, "calls", id));
if(snap.exists()){
const data = snap.data();
if(data.status === "ringing" || data.status === "connected"){
await updateDoc(doc(db, "calls", id), {
status: "cancelled",
duration: data.status === "ringing" ? 0 : callSeconds,
callType: activeCallType || data.callType || "audio",
endedAt: serverTimestamp()
});
if(saveMessage){
await saveCallMessage(data.status === "ringing" ? "cancelled" : "completed", data.status === "ringing" ? 0 : callSeconds);
}
}
}
}catch(e){
console.error("Cancel call error:", e);
}
cleanupCall();
}

async function saveCallMessage(status, duration){
if(!activeCallId || !activeCallPeer || callMessageSaved) return;
callMessageSaved = true;

const callerId = activeCallRole === "caller" ? currentUser.uid : activeCallPeer.uid;
const receiverId = activeCallRole === "caller" ? activeCallPeer.uid : currentUser.uid;
const targetChat = createChatID(callerId, receiverId);

try{
await setDoc(doc(db, "chats", targetChat, "messages", "call_" + activeCallId), {
type: "call",
callId: activeCallId,
callType: activeCallType || "audio",
callerId,
receiverId,
callStatus: status,
duration: Number(duration || 0),
senderId: callerId,
read: false,
deletedFor: [],
createdAt: serverTimestamp()
}, { merge: true });
}catch(e){
console.error("Save call message error:", e);
}
}

async function finishCall(status = null){
const id = activeCallId;
stopRingtone();
stopOutgoingTimeout();
if(!id){
cleanupCall();
return;
}

const duration = callSeconds;
const finalStatus = status || (duration > 0 ? "completed" : "missed");

try{
const snap = await getDoc(doc(db, "calls", id));
if(snap.exists()){
const data = snap.data();
if(!["ended", "cancelled", "rejected", "missed"].includes(data.status)){
await updateDoc(doc(db, "calls", id), {
status: finalStatus === "completed" ? "ended" : finalStatus,
duration,
callType: activeCallType || data.callType || "audio",
endedAt: serverTimestamp()
});
}
}
}catch(e){
console.error("Finish call error:", e);
}

await saveCallMessage(finalStatus, duration);
cleanupCall();
}

function cleanupCall(){
stopRingtone();
stopCallTimer();
stopOutgoingTimeout();

if(unsubscribeActiveCall){
unsubscribeActiveCall();
unsubscribeActiveCall = null;
}
if(unsubscribeCandidates){
unsubscribeCandidates();
unsubscribeCandidates = null;
}

if(localStream){
localStream.getTracks().forEach(track => { try{ track.stop(); }catch{} });
localStream = null;
}

if(peerConnection){
try{ peerConnection.close(); }catch{}
peerConnection = null;
}

pendingIceCandidates = [];

if(remoteAudio){
remoteAudio.pause();
remoteAudio.srcObject = null;
remoteAudio.muted = false;
}

remoteVideo.srcObject = null;
localVideo.srcObject = null;
incomingCall.style.display = "none";
callScreen.style.display = "none";
audioCallView.style.display = "flex";
videoArea.style.display = "none";
remoteVideo.style.display = "none";
remoteAvatar.style.display = "flex";
localVideo.style.display = "none";
localAvatar.style.display = "none";

hideAllCallButtons();
activeCallId = null;
activeCallType = null;
activeCallRole = null;
activeCallPeer = null;
callSeconds = 0;
callMessageSaved = false;

muteButton.textContent = "🎤";
speakerButton.textContent = "🔊";
switchVideoButton.textContent = "📹";
muteButton.classList.remove("active");
speakerButton.classList.remove("active");
switchVideoButton.disabled = false;
}

muteButton.onclick = () => {
if(!localStream) return;
const track = localStream.getAudioTracks()[0];
if(!track) return;
track.enabled = !track.enabled;
muteButton.textContent = track.enabled ? "🎤" : "🔇";
muteButton.classList.toggle("active", !track.enabled);
};

speakerButton.onclick = async () => {
remoteAudioMuted = !remoteAudioMuted;
remoteAudio.muted = remoteAudioMuted;
speakerButton.textContent = remoteAudioMuted ? "🔇" : "🔊";
speakerButton.classList.toggle("active", remoteAudioMuted);
if(!remoteAudioMuted){
await playRemoteAudio();
}
};

flipCameraButton.onclick = async () => {
if(!localStream || activeCallType !== "video") return;
try{
const oldTrack = localStream.getVideoTracks()[0];
if(!oldTrack) return;
cameraFacing = cameraFacing === "user" ? "environment" : "user";
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: { ideal: cameraFacing } }
});
const newTrack = stream.getVideoTracks()[0];
if(!newTrack) return;

const sender = await getVideoSender();
if(sender){
await sender.replaceTrack(newTrack);
}
oldTrack.stop();
localStream.removeTrack(oldTrack);
localStream.addTrack(newTrack);
localVideo.srcObject = localStream;
}catch(e){
console.error("Flip camera error:", e);
}
};

switchVideoButton.onclick = async () => {
if(!activeCallId) return;
if(!peerConnection || activeCallType !== "audio") return;
switchVideoButton.disabled = true;
await enableVideoForCall(true);
switchVideoButton.disabled = false;
};

callButton.onclick = () => startCall("audio");
videoButton.onclick = () => startCall("video");
acceptIncoming.onclick = acceptIncomingCall;
rejectIncoming.onclick = rejectIncomingCall;
acceptCallButton.onclick = acceptIncomingCall;
rejectCallButton.onclick = rejectIncomingCall;

endCallButton.onclick = async () => {
if(!activeCallId){
cleanupCall();
return;
}
if(activeCallRole === "caller"){
const snap = await getDoc(doc(db, "calls", activeCallId)).catch(() => null);
if(snap?.exists() && snap.data().status === "ringing"){
await cancelOutgoingCall(true);
return;
}
}
await finishCall();
};

backButton.onclick = async () => {
await updateMyActivity("none");
cancelReply();
if(activeCallId){
if(activeCallRole === "caller"){
await cancelOutgoingCall();
}else{
await finishCall();
}
}
if(unsubscribeMessages) unsubscribeMessages();
if(unsubscribeFriendStatus) unsubscribeFriendStatus();
if(unsubscribeFriendActivity) unsubscribeFriendActivity();
if(unsubscribeIncomingCalls)unsubscribeIncomingCalls();
stopPresence();
history.back();
};

document.addEventListener("visibilitychange", () => {
if(!currentUser) return;
if(document.visibilityState === "visible"){
updateMyPresence(true);
if(activeCallId){
playRemoteAudio();
}
}else if(!activeCallId){
updateMyPresence(false);
updateMyActivity("none");
}
});

window.addEventListener("pagehide", () => {
if(!currentUser) return;
updateMyPresence(false);
});

onAuthStateChanged(auth, async user => {
if(!user){
loading.textContent = "يجب تسجيل الدخول أولاً";
return;
}
currentUser = user;
try{
startPresence();
await loadFriend();
listenMessages();
listenIncomingCalls();
await connectVoiceJS();
showApp();
}catch(e){
console.error(e);
loading.textContent = e.message || "حدث خطأ";
}
});

</script>

</body>
</html>
