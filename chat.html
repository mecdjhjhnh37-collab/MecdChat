<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">
<title>Mecd Chat - الدردشة</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;
background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);
overflow:hidden;
}

.app{
width:100%;
max-width:650px;
height:100vh;
margin:auto;
display:flex;
flex-direction:column;
position:relative;
}

header{
height:75px;
padding:12px 18px;
display:flex;
align-items:center;
gap:12px;
background:#050807;
border-bottom:1px solid rgba(255,255,255,.08);
flex-shrink:0;
position:relative;
z-index:100;
}

.back{
width:45px;
height:45px;
border:none;
border-radius:14px;
background:rgba(255,255,255,.06);
color:white;
font-size:24px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.back:active{
transform:scale(.94);
}

.avatar{
width:48px;
height:48px;
border-radius:50%;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:#12352c;
font-size:24px;
flex-shrink:0;
border:1px solid rgba(0,230,118,.3);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.user-info{
flex:1;
min-width:0;
}

.user-name{
font-size:17px;
font-weight:bold;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.user-status{
font-size:11px;
color:#7d8985;
margin-top:4px;
transition:.2s ease;
}

.user-status.online{
color:#00e889;
}

.user-status.typing{
color:#00e889;
font-weight:bold;
}

.search-bar{
display:none;
align-items:center;
gap:6px;
padding:8px 12px;
background:#0b1411;
border-bottom:1px solid rgba(0,232,137,.18);
z-index:96;
}

.search-bar.show{
display:flex;
}

#searchInput{
flex:1;
min-width:0;
padding:8px 12px;
border-radius:12px;
border:1px solid rgba(255,255,255,.1);
background:#131d19;
color:#fff;
font-family:inherit;
font-size:13px;
outline:none;
}

.search-bar button{
border:none;
border-radius:10px;
background:#18231f;
color:#fff;
padding:8px 10px;
font-family:inherit;
font-size:12px;
cursor:pointer;
white-space:nowrap;
}

.search-count{
font-size:11px;
color:#8cf5c2;
min-width:44px;
text-align:center;
white-space:nowrap;
}

.upload-banner{
display:none;
padding:8px 14px;
background:#0e1d18;
border-bottom:1px solid rgba(0,232,137,.2);
color:#8cf5c2;
font-size:12px;
text-align:center;
z-index:95;
}

.upload-banner.show{
display:block;
}

.messages{
flex:1;
overflow-y:auto;
padding:18px 15px 92px;
display:flex;
flex-direction:column;
gap:10px;
}

.empty{
margin:auto;
text-align:center;
color:#72817c;
line-height:1.8;
font-size:14px;
}

.message{
position:relative;
max-width:78%;
padding:11px 14px;
border-radius:18px;
font-size:15px;
line-height:1.5;
word-wrap:break-word;
overflow-wrap:anywhere;
white-space:pre-wrap;
user-select:none;
-webkit-user-select:none;
flex-shrink:0;
}

.message.mine{
align-self:flex-start;
background:#00c96b;
color:#00150e;
border-bottom-left-radius:5px;
}

.message.other{
align-self:flex-end;
background:#18231f;
color:white;
border:1px solid rgba(255,255,255,.07);
border-bottom-right-radius:5px;
}

.message.search-hit{
outline:2px solid #00e889;
}

.meta-row{
display:flex;
align-items:center;
gap:5px;
margin-top:4px;
}

.time{
font-size:9px;
opacity:.65;
}

.read-mark{
font-size:10px;
opacity:.75;
letter-spacing:-1px;
}

.read-mark.seen{
color:#003b22;
font-weight:bold;
opacity:1;
}

.message.other .read-mark{
display:none;
}

.input-area{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:650px;
padding:12px;
display:flex;
gap:9px;
background:rgba(5,8,7,.97);
border-top:1px solid rgba(255,255,255,.08);
z-index:20;
}

#messageInput{
flex:1;
min-width:0;
padding:14px 16px;
border-radius:17px;
border:1px solid rgba(255,255,255,.09);
outline:none;
background:#111916;
color:white;
font-family:inherit;
font-size:15px;
direction:rtl;
}

#messageInput:focus{
border-color:#00e676;
box-shadow:0 0 0 3px rgba(0,230,118,.07);
}

#messageInput::placeholder{
color:#63716d;
}

#sendButton{
width:52px;
height:52px;
border:none;
border-radius:17px;
background:#00e889;
color:#00150e;
font-size:22px;
cursor:pointer;
flex-shrink:0;
}

#sendButton:active{
transform:scale(.94);
}

#sendButton:disabled{
opacity:.5;
cursor:not-allowed;
}

.loading{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
background:#020504;
color:#a8bdb6;
font-size:15px;
z-index:100;
}

.spinner{
width:35px;
height:35px;
border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;
border-radius:50%;
animation:spin .8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

#voiceButton,
#callButton,
#videoButton{
width:45px;
height:45px;
border:none;
border-radius:15px;
background:#18231f;
color:white;
font-size:20px;
cursor:pointer;
flex-shrink:0;
}

#voiceButton.recording{
background:#321817;
color:#ff5555;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

.call-buttons{
display:flex;
gap:4px;
margin-right:auto;
align-items:center;
}

.call-buttons button{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:transparent;
color:white;
font-size:19px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

#moreButton{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:transparent;
color:#fff;
font-size:30px;
line-height:1;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.top-more-menu{
position:absolute;
top:62px;
left:10px;
min-width:180px;
background:#23302c;
border:1px solid rgba(255,255,255,.08);
border-radius:10px;
box-shadow:0 8px 30px rgba(0,0,0,.5);
padding:6px;
z-index:2000;
}

.top-more-menu button{
display:block;
width:100%;
padding:12px 14px;
background:transparent;
border:none;
color:#fff;
text-align:right;
font-family:inherit;
font-size:14px;
border-radius:7px;
cursor:pointer;
white-space:nowrap;
}

.top-more-menu button:hover{
background:rgba(255,255,255,.08);
}

#attachButton{
width:45px;
height:45px;
border:none;
border-radius:15px;
background:#18231f;
color:#fff;
font-size:28px;
line-height:1;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
flex:0 0 45px;
}

.attach-menu{
position:fixed;
bottom:76px;
right:max(14px,calc(50% - 311px));
display:none;
flex-direction:column;
gap:7px;
padding:8px;
background:#111916;
border:1px solid rgba(255,255,255,.1);
border-radius:16px;
z-index:90;
box-shadow:0 15px 35px rgba(0,0,0,.55);
}

.attach-menu.show{
display:flex;
}

.attach-menu button{
border:0;
background:#18231f;
color:#fff;
border-radius:12px;
padding:11px 16px;
font-family:inherit;
font-size:14px;
white-space:nowrap;
text-align:right;
cursor:pointer;
}

.message-image{
display:block;
max-width:min(270px,100%);
max-height:360px;
width:auto;
height:auto;
border-radius:14px;
object-fit:cover;
cursor:pointer;
}

.message-video{
display:block;
max-width:min(320px,100%);
max-height:420px;
width:auto;
height:auto;
border-radius:14px;
background:#000;
}

.media-message{
padding:7px;
}

.reply-box{
padding:7px 9px;
margin-bottom:7px;
border-right:3px solid rgba(0,0,0,.25);
background:rgba(0,0,0,.12);
border-radius:9px;
font-size:11px;
opacity:.9;
max-width:100%;
overflow:hidden;
cursor:pointer;
}

.reply-box strong{
display:block;
font-size:10px;
margin-bottom:2px;
}

.edited-mark{
font-size:9px;
opacity:.65;
margin-right:5px;
}

.reactions{
display:flex;
gap:4px;
flex-wrap:wrap;
margin-top:5px;
}

.reaction-btn{
border:1px solid rgba(255,255,255,.12);
background:rgba(0,0,0,.12);
color:inherit;
border-radius:12px;
padding:2px 7px;
font-size:12px;
cursor:pointer;
}

.pinned-mark{
font-size:10px;
opacity:.75;
margin-top:4px;
}

.reply-preview{
position:fixed;
bottom:76px;
left:50%;
transform:translateX(-50%);
width:min(626px,calc(100% - 24px));
display:none;
align-items:center;
justify-content:space-between;
gap:10px;
padding:9px 12px;
background:#111916;
border:1px solid rgba(0,232,137,.2);
border-radius:14px;
z-index:25;
}

.reply-preview.show{
display:flex;
}

.reply-preview-text{
min-width:0;
font-size:12px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.reply-preview-close{
border:0;
background:transparent;
color:#fff;
font-size:18px;
cursor:pointer;
}

.message.voice-message{
width:min(340px,84%);
max-width:84%;
min-height:66px;
padding:8px 10px;
display:block;
overflow:hidden;
}

.voice-player{
width:100%;
display:flex;
align-items:center;
gap:10px;
}

.voice-play{
width:42px;
height:42px;
flex:0 0 42px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.88);
color:#087b50;
font-size:17px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.message.other .voice-play{
background:#00c96b;
color:#00150e;
}

.voice-body{
flex:1;
min-width:0;
}

.voice-row{
display:flex;
align-items:center;
gap:8px;
width:100%;
}

.voice-progress{
flex:1;
min-width:0;
width:100%;
height:5px;
accent-color:#00e889;
cursor:pointer;
}

.voice-duration{
min-width:38px;
font-size:10px;
opacity:.75;
direction:ltr;
text-align:center;
}

#recordBox{
position:fixed;
bottom:78px;
left:50%;
transform:translateX(-50%);
background:#18231f;
padding:10px 15px;
border-radius:20px;
display:flex;
gap:10px;
align-items:center;
z-index:50;
border:1px solid rgba(0,232,137,.2);
}

#recordText{
color:#00e889;
white-space:nowrap;
}

#cancelRecord{
background:#ff3333;
color:white;
border:none;
border-radius:12px;
padding:6px 12px;
cursor:pointer;
white-space:nowrap;
}

.message-menu{
position:fixed;
bottom:82px;
left:50%;
transform:translateX(-50%);
width:min(320px,calc(100% - 28px));
background:#111916;
border:1px solid rgba(0,232,137,.25);
border-radius:16px;
padding:10px;
z-index:999;
box-shadow:0 14px 36px rgba(0,0,0,.75);
}

.message-menu-reactions{
display:flex;
justify-content:space-around;
padding-bottom:8px;
margin-bottom:6px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.message-menu-reactions button{
background:#18231f;
border:none;
border-radius:10px;
padding:7px 10px;
font-size:16px;
cursor:pointer;
}

.message-menu button.action-btn{
background:#18231f;
color:white;
border:none;
padding:11px 15px;
border-radius:10px;
cursor:pointer;
font-family:inherit;
font-size:14px;
display:block;
width:100%;
margin:4px 0;
text-align:right;
white-space:nowrap;
}

.message-menu button.action-btn:hover{
background:#22312c;
}

.image-lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:1200;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.image-lightbox.show{
display:flex;
}

.image-lightbox img{
max-width:100%;
max-height:90vh;
border-radius:14px;
object-fit:contain;
}

.incoming-call{
position:fixed;
top:84px;
left:50%;
transform:translateX(-50%);
width:min(620px,calc(100% - 24px));
z-index:300;
background:#111916;
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:12px 14px;
box-shadow:0 15px 45px rgba(0,0,0,.45);
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.incoming-call-info{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.incoming-name{
font-weight:bold;
font-size:15px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.incoming-type{
font-size:12px;
color:#9aa7a3;
margin-top:3px;
}

.incoming-actions{
display:flex;
gap:8px;
flex-shrink:0;
}

.incoming-actions button{
width:45px;
height:45px;
border:0;
border-radius:50%;
cursor:pointer;
}

.incoming-accept{
background:#00c96b;
color:#00150e;
}

.incoming-reject{
background:#ff3b30;
color:#fff;
}

.call-screen{
position:fixed;
inset:0;
background:#020504;
z-index:500;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
}

.call-screen.show{
display:flex;
}

.call-avatar{
width:90px;
height:90px;
border-radius:50%;
background:#12352c;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-size:40px;
}

.call-avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.call-name{
font-size:22px;
font-weight:bold;
margin-top:15px;
}

.call-state{
font-size:13px;
color:#89958f;
margin-top:7px;
}

.call-timer{
font-size:13px;
color:#00e889;
margin-top:7px;
}

.call-controls{
display:flex;
gap:15px;
margin-top:45px;
}

.call-controls button{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#18231f;
color:#fff;
font-size:22px;
cursor:pointer;
}

.call-controls .end{
background:#ff3b30;
}

.video-stage{
position:absolute;
inset:0;
background:#000;
display:none;
}

.video-stage.show{
display:block;
}

#remoteVideo{
width:100%;
height:100%;
object-fit:cover;
}

#localVideo{
position:absolute;
top:20px;
right:20px;
width:120px;
height:170px;
object-fit:cover;
border-radius:15px;
border:2px solid rgba(255,255,255,.2);
display:none;
z-index:5;
}

.video-stage-controls{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
z-index:10;
}

.video-stage-controls button{
width:55px;
height:55px;
border:0;
border-radius:50%;
background:#18231f;
color:#fff;
font-size:20px;
cursor:pointer;
}

.video-request{
position:fixed;
bottom:100px;
left:50%;
transform:translateX(-50%);
width:min(400px,calc(100% - 30px));
background:#111916;
border:1px solid rgba(255,255,255,.1);
border-radius:18px;
padding:15px;
z-index:700;
display:none;
}

.video-request-text{
font-size:13px;
line-height:1.6;
margin-bottom:12px;
}

.video-request-actions{
display:flex;
gap:8px;
}

.video-request-actions button{
flex:1;
height:42px;
border:0;
border-radius:12px;
font-family:inherit;
cursor:pointer;
}

#acceptVideoRequest{
background:#00c96b;
color:#00150e;
}

#rejectVideoRequest{
background:#18231f;
color:#fff;
}
</style>
</head>

<body>

<div id="loading" class="loading">
<div class="spinner"></div>
<div>جارٍ فتح الدردشة...</div>
</div>

<main id="app" class="app" style="display:none">
<header>
<button id="backButton" class="back" type="button">←</button>
<div id="friendAvatar" class="avatar">👤</div>
<div class="user-info">
<div id="friendName" class="user-name">جارٍ التحميل...</div>
<div id="friendStatus" class="user-status">● غير متصل</div>
</div>

<div class="call-buttons">
<button id="callButton" type="button" title="مكالمة صوتية">📞</button>
<button id="videoButton" type="button" title="مكالمة فيديو">📹</button>
<button id="moreButton" type="button" title="المزيد">⋮</button>
</div>

<div id="topMoreMenu" class="top-more-menu" hidden>
<button id="clearChatButton" type="button">مسح المحادثة</button>
<button id="searchChatButton" type="button">بحث</button>
</div>
</header>

<div id="searchBar" class="search-bar">
<input id="searchInput" type="text" placeholder="ابحث في الرسائل...">
<span id="searchCount" class="search-count">0 / 0</span>
<button id="prevMatchBtn" type="button">▲</button>
<button id="nextMatchBtn" type="button">▼</button>
<button id="closeSearchBtn" type="button">✕</button>
</div>

<div id="uploadBanner" class="upload-banner">جارٍ رفع الملف...</div>

<div id="messages" class="messages">
<div class="empty">💬<br>ابدأ المحادثة الآن</div>
</div>

<div id="attachMenu" class="attach-menu">
<button id="galleryButton" type="button">🖼️ صورة أو فيديو</button>
<button id="cameraButton" type="button">📷 كاميرا</button>
</div>

<input id="galleryInput" type="file" accept="image/*,video/*" style="display:none">
<input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none">

<div id="replyPreview" class="reply-preview">
<div id="replyPreviewText" class="reply-preview-text"></div>
<button id="replyPreviewClose" class="reply-preview-close" type="button">×</button>
</div>

<div id="recordBox" style="display:none">
<span id="recordText">🎤 يسجل صوت…</span>
<span id="recordTime">00:00</span>
<button id="cancelRecord" type="button">إلغاء</button>
</div>

<div class="input-area">
<button id="attachButton" type="button">＋</button>
<input id="messageInput" type="text" placeholder="اكتب رسالة..." autocomplete="off" maxlength="2000">
<button id="voiceButton" type="button">🎤</button>
<button id="sendButton" type="button">➤</button>
</div>
</main>

<div id="imageLightbox" class="image-lightbox">
<img id="lightboxImg" src="" alt="معاينة الصورة">
</div>

<div id="incomingCall" class="incoming-call" style="display:none">
<div class="incoming-call-info">
<div id="incomingAvatar" class="call-avatar">👤</div>
<div>
<div id="incomingName" class="incoming-name">مكالمة</div>
<div id="incomingType" class="incoming-type">مكالمة صوتية</div>
</div>
</div>
<div class="incoming-actions">
<button id="acceptIncoming" class="incoming-accept" type="button">✓</button>
<button id="rejectIncoming" class="incoming-reject" type="button">✕</button>
</div>
</div>

<div id="callScreen" class="call-screen">
<div id="videoStage" class="video-stage">
<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay muted playsinline></video>
<div class="video-stage-controls">
<button id="muteCall" type="button">🎤</button>
<button id="switchVideo" type="button">📹</button>
<button id="endCall" type="button">✕</button>
</div>
</div>

<div id="normalCallContent">
<div id="callAvatar" class="call-avatar">👤</div>
<div id="callName" class="call-name">مكالمة</div>
<div id="callState" class="call-state">جاري الاتصال...</div>
<div id="callTimer" class="call-timer">00:00</div>
<div class="call-controls">
<button id="muteCallNormal" type="button">🎤</button>
<button id="endCallNormal" type="button" class="end">✕</button>
</div>
</div>
<audio id="remoteAudioCall" autoplay></audio>
</div>

<div id="videoRequestBox" class="video-request">

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>'"]/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"
  }[c]));
}

function formatTime(timestamp){
  if(!timestamp?.toDate) return "";
  try{
    return timestamp.toDate().toLocaleTimeString("ar", { hour:"2-digit", minute:"2-digit" });
  }catch{
    return "";
  }
}

function formatSeconds(value){
  if(!Number.isFinite(value)) return "00:00";
  const seconds = Math.max(0, Math.floor(value));
  return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0");
}

async function toggleReaction(messageId, emoji){
  if(!currentUser || !chatID || !messageId || !emoji) return;
  try{
    const messageRef = doc(db, "chats", chatID, "messages", messageId);
    const snap = await getDoc(messageRef);
    if(!snap.exists()) return;
    const data = snap.data();
    const reactions = Array.isArray(data.reactions) ? data.reactions : [];
    const mine = reactions.some(r => r && r.userId === currentUser.uid && r.emoji === emoji);
    if(mine){
      await updateDoc(messageRef, { reactions: arrayRemove({ userId: currentUser.uid, emoji }) });
    }else{
      const oldMine = reactions.find(r => r && r.userId === currentUser.uid);
      if(oldMine){
        await updateDoc(messageRef, { reactions: arrayRemove(oldMine) });
      }
      await updateDoc(messageRef, { reactions: arrayUnion({ userId: currentUser.uid, emoji }) });
    }
  }catch(error){
    console.error("Reaction error:", error);
  }
}

function renderReactions(box, data){
  if(!Array.isArray(data.reactions) || !data.reactions.length) return;
  const wrapper = document.createElement("div");
  wrapper.className = "reactions";
  const counts = {};
  data.reactions.forEach(reaction => {
    if(!reaction || !reaction.emoji) return;
    if(!counts[reaction.emoji]){
      counts[reaction.emoji] = { count: 0, mine: false };
    }
    counts[reaction.emoji].count++;
    if(reaction.userId === currentUser.uid){
      counts[reaction.emoji].mine = true;
    }
  });
  reactionList.forEach(emoji => {
    const info = counts[emoji];
    if(!info) return;
    const button = document.createElement("button");
    button.type = "button";
    button.className = "reaction-btn";
    button.textContent = emoji + (info.count > 1 ? ` ${info.count}` : "");
    button.onclick = e => {
      e.stopPropagation();
      toggleReaction(data.id, emoji);
    };
    wrapper.appendChild(button);
  });
  box.appendChild(wrapper);
}

function renderMessage(data){
  const isMine = data.senderId === currentUser.uid;
  const box = document.createElement("div");
  let className = "message " + (isMine ? "mine" : "other");
  if(data.type === "image" || data.type === "video") className += " media-message";
  if(data.type === "voice" && (data.audio || data.url)) className += " voice-message";
  box.className = className;

  if(data.replyTo){
    const replyBox = document.createElement("div");
    replyBox.className = "reply-box";
    const strong = document.createElement("strong");
    strong.textContent = data.replyTo.senderId === currentUser.uid ? "أنت" : (data.replyTo.senderName || "المستخدم");
    const text = document.createElement("div");
    text.textContent = data.replyTo.text || "رسالة";
    replyBox.append(strong, text);
    replyBox.onclick = e => {
      e.stopPropagation();
      const target = document.querySelector(`[data-message-id="${CSS.escape(data.replyTo.messageId || "")}"]`);
      if(target){
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.style.outline = "2px solid #00e889";
        setTimeout(() => { target.style.outline = ""; }, 1500);
      }
    };
    box.appendChild(replyBox);
  }

  if(data.type === "text" || (data.type === "voice" && !data.audio && !data.url && data.text)){
    box.appendChild(document.createTextNode(data.text || ""));
    if(data.isEdited){
      const edited = document.createElement("span");
      edited.className = "edited-mark";
      edited.textContent = "معدلة";
      box.appendChild(edited);
    }
  }

  if(data.type === "image" && data.url){
    const img = document.createElement("img");
    img.className = "message-image";
    img.src = data.url;
    img.alt = "صورة";
    img.loading = "lazy";
    img.onclick = e => {
      e.stopPropagation();
      openLightbox(data.url);
    };
    box.appendChild(img);
  }

  if(data.type === "video" && data.url){
    const video = document.createElement("video");
    video.className = "message-video";
    video.src = data.url;
    video.controls = true;
    video.playsInline = true;
    box.appendChild(video);
  }

  const voiceSrc = data.url || data.audio;
  if(data.type === "voice" && voiceSrc){
    const player = document.createElement("div");
    player.className = "voice-player";
    const play = document.createElement("button");
    play.type = "button";
    play.className = "voice-play";
    play.textContent = "▶";
    const body = document.createElement("div");
    body.className = "voice-body";
    const row = document.createElement("div");
    row.className = "voice-row";
    const progress = document.createElement("input");
    progress.type = "range";
    progress.min = "0";
    progress.max = "100";
    progress.value = "0";
    progress.className = "voice-progress";
    const duration = document.createElement("span");
    duration.className = "voice-duration";
    duration.textContent = "00:00";

    const audio = new Audio(voiceSrc);
    audio.preload = "metadata";
    audio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatSeconds(audio.duration);
    });
    audio.addEventListener("timeupdate", () => {
      if(audio.duration){
        progress.value = String((audio.currentTime / audio.duration) * 100);
        duration.textContent = formatSeconds(audio.currentTime);
      }
    });
    audio.addEventListener("ended", () => {
      play.textContent = "▶";
      progress.value = "0";
      if(activeAudio === audio){
        activeAudio = null;
        activePlayBtn = null;
      }
    });
    play.onclick = e => {
      e.stopPropagation();
      if(activeAudio && activeAudio !== audio){
        activeAudio.pause();
        if(activePlayBtn) activePlayBtn.textContent = "▶";
      }
      if(audio.paused){
        activeAudio = audio;
        activePlayBtn = play;
        audio.play().catch(console.error);
        play.textContent = "Ⅱ";
      }else{
        audio.pause();
        play.textContent = "▶";
      }
    };
    progress.oninput = e => {
      e.stopPropagation();
      if(audio.duration){
        audio.currentTime = (Number(progress.value) / 100) * audio.duration;
      }
    };
    row.append(progress, duration);
    body.appendChild(row);
    player.append(play, body);
    box.appendChild(player);
  }

  const metaRow = document.createElement("div");
  metaRow.className = "meta-row";

  const meta = document.createElement("span");
  meta.className = "time";
  meta.textContent = formatTime(data.createdAt);
  metaRow.appendChild(meta);

  if(isMine){
    const readMark = document.createElement("span");
    readMark.className = "read-mark" + (data.read ? " seen" : "");
    readMark.textContent = data.read ? "✓✓" : "✓";
    metaRow.appendChild(readMark);
  }

  box.appendChild(metaRow);

  if(data.pinned){
    const pin = document.createElement("div");
    pin.className = "pinned-mark";
    pin.textContent = "📌 مثبتة";
    box.appendChild(pin);
  }

  renderReactions(box, data);
  box.dataset.messageId = data.id;
  addMessageActions(box, data);
  return box;
}

  closeMessageMenu();

      await updateDoc(doc(db, "chats", chatID, "messages", data.id), { pinned: !data.pinned });

      console.error("Pin error:", error);
    }

  menu.appendChild(pin);

  if(data.senderId === currentUser.uid && data.type === "text"){

      sendButton.textContent = "✓";

      messageInput.focus();
    };
    menu.appendChild(edit);
  }

  const del = document.createElement("button");
  del.type = "button";
  del.className = "action-btn";
  del.textContent = data.senderId === currentUser.uid ? "🗑 حذف للجميع" : "🗑 حذف لدي";
  del.onclick = async e => {
    e.stopPropagation();
    closeMessageMenu();
    try{
      if(data.senderId === currentUser.uid){
        await deleteDoc(doc(db, "chats", chatID, "messages", data.id));
      }else{
        await updateDoc(doc(db, "chats", chatID, "messages", data.id), {
          deletedFor: arrayUnion(currentUser.uid)
        });
      }
    }catch(error){
      console.error("Delete error:", error);
    }
  };
  menu.appendChild(del);

  app.appendChild(menu);
}

function addMessageActions(messageElement, data){
  let pressTimer = null;
  let longPress = false;

  messageElement.addEventListener("pointerdown", e => {
    if(e.target.closest("button,input,video")) return;
    longPress = false;
    pressTimer = setTimeout(() => {
      longPress = true;
      showMessageMenu(data);
    }, 450);
  });
  messageElement.addEventListener("pointerup", () => { clearTimeout(pressTimer); });
  messageElement.addEventListener("pointercancel", () => { clearTimeout(pressTimer); });
  messageElement.addEventListener("contextmenu", e => {
    e.preventDefault();
    showMessageMenu(data);
  });

  let lastTap = 0;
  messageElement.addEventListener("click", e => {
    if(longPress) return;
    if(e.target.closest("button,input,video,.reply-box,.message-menu")) return;
    const now = Date.now();
    if(now - lastTap < 300 && now - lastTap > 0){
      toggleReaction(data.id, "❤️");
    }
    lastTap = now;
  });
}

function renderMessages(snapshot){
  const hadNoMessages = !messages.querySelector(".message");
  const nearBottom = hadNoMessages || (messages.scrollHeight - messages.scrollTop - messages.clientHeight < 180);
  messages.querySelectorAll(".message").forEach(el => el.remove());

  const docs = snapshot.docs.filter(docSnap => {
    const data = docSnap.data();
    return !(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid));
  });

  const empty = messages.querySelector(".empty");
  if(empty) empty.remove();

  if(!docs.length){
    const emptyBox = document.createElement("div");
    emptyBox.className = "empty";
    emptyBox.innerHTML = "💬<br>ابدأ المحادثة الآن";
    messages.appendChild(emptyBox);
    return;
  }

  let hasNewMine = false;
  docs.forEach(docSnap => {
    const data = { ...docSnap.data(), id: docSnap.id };
    if(data.senderId === currentUser.uid && !data.createdAt){
      hasNewMine = true;
    }
    if(data.senderId !== currentUser.uid && data.read === false){
      updateDoc(doc(db, "chats", chatID, "messages", data.id), { read: true }).catch(() => {});
    }
    messages.appendChild(renderMessage(data));
  });

  if(nearBottom || hasNewMine){
    scrollToBottom(true);
  }
}

function listenMessages(){
  if(!chatID) return;
  const q = query(collection(db, "chats", chatID, "messages"), orderBy("createdAt", "asc"));
  if(unsubscribeMessages) unsubscribeMessages();
  unsubscribeMessages = onSnapshot(q, renderMessages, error => {
    console.error("Messages error:", error);
  });
}

async function sendMessage(){
  const text = messageInput.value.trim();
  if(!text || !currentUser || !friendUser || !chatID) return;
  sendButton.disabled = true;
  await setTypingState(false);

  try{
    if(editingMessageId){
      await updateDoc(doc(db, "chats", chatID, "messages", editingMessageId), {
        text,
        isEdited: true
      });
      editingMessageId = null;
      sendButton.textContent = "➤";
    }else{
      const data = {
        text,
        senderId: currentUser.uid,
        receiverId: friendUser.uid,
        type: "text",
        read: false,
        deletedFor: [],
        createdAt: serverTimestamp()
      };
      if(replyTarget){
        data.replyTo = {
          messageId: replyTarget.id,
          senderId: replyTarget.senderId,
          senderName: replyTarget.senderName,
          text: replyTarget.text
        };
      }
      await addDoc(collection(db, "chats", chatID, "messages"), data);
      await updateChatSummary(text);
    }
    messageInput.value = "";
    cancelReply();
    scrollToBottom(true);
  }catch(error){
    console.error("Send message error:", error);
    alert("تعذر إرسال الرسالة:\n" + error.message);
  }finally{
    sendButton.disabled = false;
  }
}

sendButton.addEventListener("click", sendMessage);
messageInput.addEventListener("keydown", event => {

    event.preventDefault();
    sendMessage();

});

messageInput.addEventListener("input", () => {

async function uploadToSupabaseBucket(blobOrFile, folderPrefix, extension){
  const rawName = blobOrFile.name || `file.${extension}`;
  const safeName = String(rawName).replace(/[^a-zA-Z0-9._-]/g, "_");
  const fileName = `${currentUser.uid}/${folderPrefix}_${Date.now()}_${safeName}`;

  const { error } = await supabase.storage
    .from("mecd-media")
    .upload(fileName, blobOrFile, { upsert: false, contentType: blobOrFile.type || undefined });
  if(error) throw error;

  const { data: publicURLData } = supabase.storage.from("mecd-media").getPublicUrl(fileName);
  return publicURLData.publicUrl;
}

async function uploadMediaAndSend(file, type){
  if(!currentUser || !friendUser || !chatID || !file) return;
  setUploading(true, type === "video" ? "جارٍ رفع الفيديو..." : "جارٍ رفع الصورة...");
  try{
    const ext = file.name?.split(".").pop() || (type === "video" ? "mp4" : "jpg");
    const mediaUrl = await uploadToSupabaseBucket(file, type, ext);

    await addDoc(collection(db, "chats", chatID, "messages"), {
      url: mediaUrl,
      senderId: currentUser.uid,
      receiverId: friendUser.uid,
      type,
      read: false,
      deletedFor: [],
      createdAt: serverTimestamp()
    });

    await updateChatSummary(type === "video" ? "🎥 فيديو" : "📷 صورة");
    scrollToBottom(true);
  }catch(error){
    console.error("Upload error:", error);
    alert("فشل رفع الملف: تأكد من إعدادات سلة Supabase أو اتصال الإنترنت.");
  }finally{
    setUploading(false);
  }
}

async function clearMyChat(){
  if(!currentUser || !chatID) return;
  const confirmed = confirm("هل تريد حذف الرسائل من جهازك؟");
  if(!confirmed) return;
  try{
    const snap = await getDocs(collection(db, "chats", chatID, "messages"));
    const tasks = [];
    snap.docs.forEach(messageDoc => {
      const data = messageDoc.data();
      if(Array.isArray(data.deletedFor) && data.deletedFor.includes(currentUser.uid)) return;
      if(data.senderId === currentUser.uid){
        tasks.push(deleteDoc(messageDoc.ref));
      }else{
        tasks.push(updateDoc(messageDoc.ref, { deletedFor: arrayUnion(currentUser.uid) }));
      }
    });
    await Promise.all(tasks);
  }catch(error){
    console.error("Clear chat error:", error);
    alert("تعذر مسح المحادثة");
  }
}

function clearSearchHighlights(){
  document.querySelectorAll(".message.search-hit").forEach(el => el.classList.remove("search-hit"));
  searchMatches = [];
  searchIndex = -1;
  if($("searchCount")) $("searchCount").textContent = "0 / 0";
}

function focusMatchAt(index){
  if(!searchMatches.length) return;
  searchIndex = (index + searchMatches.length) % searchMatches.length;
  searchMatches.forEach((el, i) => {
    el.classList.toggle("search-hit", i === searchIndex);
  });
  searchMatches[searchIndex].scrollIntoView({ behavior: "smooth", block: "center" });
  if($("searchCount")) $("searchCount").textContent = `${searchIndex + 1} / ${searchMatches.length}`;
}

function runChatSearch(){
  const term = ($("searchInput")?.value || "").trim().toLowerCase();
  clearSearchHighlights();
  if(!term) return;
  const allMsgs = Array.from(document.querySelectorAll(".message"));
  searchMatches = allMsgs.filter(el => el.textContent.toLowerCase().includes(term));
  if(searchMatches.length){
    focusMatchAt(0);
  }else if($("searchCount")){
    $("searchCount").textContent = "0 / 0";
  }
}

/* =========================
   WebRTC Calls
========================= */
let pc = null;
let localStream = null;
let remoteStream = null;
let callId = null;
let callData = null;
let role = null;
let connected = false;
let ending = false;
let pendingCandidates = [];
let addedCandidates = new Set();
let callStartedAt = 0;
let callSeconds = 0;
let callTimer = null;
let stopCallWatch = null;
let stopIncomingWatch = null;
let stopCandidatesWatch = null;
let lastUpgradeOffer = "";
let lastUpgradeAnswer = "";
let remoteMuted = false;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },
    { urls: "stun:stun1.l.google.com:19302" },
    { urls: "stun:stun2.l.google.com:19302" }
  ]
};

function state(text){
  const el = $("callState");
  if(el) el.textContent = text;
}

function showCallScreen(type){
  const screen = $("callScreen");
  if(!screen) return;
  screen.classList.add("show");
  $("normalCallContent").style.display = type === "video" ? "none" : "block";
  if(type === "video") showVideoStage();
  setUserAvatar($("callAvatar"), friendUser);
  $("callName").textContent = friendUser?.name || "مكالمة";
}

function hideCallScreen(){
  $("callScreen")?.classList.remove("show");
  $("videoStage")?.classList.remove("show");
  if($("localVideo")){
    $("localVideo").style.display = "none";
    $("localVideo").srcObject = null;
  }
  if($("remoteVideo")){
    $("remoteVideo").srcObject = null;
  }
  if($("remoteAudioCall")){
    $("remoteAudioCall").srcObject = null;
  }
}

function showVideoStage(){
  $("videoStage")?.classList.add("show");
}

function startTimer(start){
  if(callTimer) clearInterval(callTimer);
  callStartedAt = start || Date.now();
  callTimer = setInterval(() => {
    const seconds = Math.max(0, Math.floor((Date.now() - callStartedAt) / 1000));
    callSeconds = seconds;
    $("callTimer").textContent = formatSeconds(seconds);
  }, 500);
}

function stopTimer(){
  if(callTimer){
    clearInterval(callTimer);
    callTimer = null;
  }
}

async function attachLocalTracksToPeer(){
  if(!pc || !localStream) return;
  for(const track of localStream.getTracks()){
    const existingSender = pc.getSenders().find(
      sender => sender.track === track || (sender.track && sender.track.kind === track.kind)
    );
    if(!existingSender){
      pc.addTrack(track, localStream);
    }else if(existingSender.track !== track){
      await existingSender.replaceTrack(track);
    }
  }
}

async function ensureMedia(needVideo = false){
  if(!navigator.mediaDevices?.getUserMedia){
    throw new Error("المتصفح لا يدعم المكالمات");
  }
  if(!localStream){
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: needVideo ? { facingMode: "user" } : false
    });
  }else if(needVideo && !localStream.getVideoTracks().length){
    const cam = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
    const newVideoTrack = cam.getVideoTracks()[0];
    if(newVideoTrack){
      localStream.getVideoTracks().forEach(oldTrack => {
        oldTrack.stop();
        localStream.removeTrack(oldTrack);
      });
      localStream.addTrack(newVideoTrack);
    }
  }

  await attachLocalTracksToPeer();

  if(localStream.getVideoTracks().length && $("localVideo")){
    $("localVideo").srcObject = localStream;
    $("localVideo").style.display = "block";
  }
}

async function flushCandidates(){
  if(!pc?.remoteDescription) return;
  const list = pendingCandidates.splice(0);
  for(const candidate of list){
    try{
      await pc.addIceCandidate(candidate);
    }catch(error){
      console.warn("ICE queued", error);
    }
  }
}

async function addRemoteCandidate(candidate, id){
  if(!candidate || addedCandidates.has(id)) return;
  addedCandidates.add(id);
  if(!pc?.remoteDescription){
    pendingCandidates.push(candidate);
    return;
  }
  try{
    await pc.addIceCandidate(candidate);
  }catch(error){
    console.warn("ICE", error);
  }
}

function createPeer(){
  if(pc){
    pc.onicecandidate = null;
    pc.ontrack = null;
    pc.onconnectionstatechange = null;
    pc.close();
    pc = null;
  }
  pc = new RTCPeerConnection(rtcConfig);
  pc.onicecandidate = async event => {
    if(!event.candidate || !callId || !currentUser) return;
    try{
      await addDoc(collection(db, "calls", callId, "candidates"), {
        senderId: currentUser.uid,
        candidate: event.candidate.toJSON(),
        createdAt: serverTimestamp()
      });
    }catch(error){
      console.error("ICE save", error);
    }
  };

  pc.ontrack = event => {
    const stream = event.streams?.[0] || remoteStream || new MediaStream();
    remoteStream = stream;
    if(event.track.kind === "audio"){
      const audio = $("remoteAudioCall");
      audio.srcObject = stream;
      audio.muted = remoteMuted;
      audio.play().catch(() => {});
    }
    if(event.track.kind === "video"){
      const video = $("remoteVideo");
      video.srcObject = stream;
      video.muted = true;
      showVideoStage();
      video.play().catch(() => {});
    }
  };

  pc.onconnectionstatechange = () => {
    if(!pc) return;
    if(pc.connectionState === "connected"){
      connected = true;
      if(!callStartedAt) startTimer();
      state(callData?.videoAccepted === true || callData?.callType === "video" ? "● متصل • فيديو" : "● متصل");
    }
    if(["failed", "closed"].includes(pc.connectionState) && !ending){
      finishCall("ended").catch(() => {});
    }
  };
  return pc;
}

async function saveCallMessage(status, duration){
  if(!callId || !currentUser || !chatID || !callData) return;
  const id = "call_" + callId;
  const kind = (callData.callType === "video" || callData.videoAccepted === true) ? "فيديو" : "صوتية";
  const summary = status === "connected"
    ? `📞 مكالمة ${kind} • ${formatSeconds(duration)}`
    : `📞 مكالمة ${kind} • ${status}`;
  try{
    await setDoc(doc(db, "chats", chatID, "messages", id), {
      type: "text",
      text: summary,
      senderId: currentUser.uid,
      receiverId: friendUser?.uid || "",
      duration,
      callStatus: status,
      read: false,
      createdAt: serverTimestamp(),
      deletedFor: []
    }, { merge: true });
    await updateChatSummary(summary);
  }catch(error){
    console.error("Call message error:", error);
  }
}

async function finishCall(status = "ended", remote = false){
  if(ending) return;
  ending = true;
  stopTimer();
  try{
    if(callId && !remote){
      await updateDoc(doc(db, "calls", callId), {
        status,
        duration: callSeconds,
        endedAt: serverTimestamp()
      });
    }
    if(callId && currentUser && chatID && callData){
      await saveCallMessage(status, callSeconds);
    }
  }catch(error){
    console.error("Finish call error:", error);
  }finally{
    stopCallWatch?.();
    stopCallWatch = null;
    stopCandidatesWatch?.();
    stopCandidatesWatch = null;
    if(pc){
      pc.onicecandidate = null;
      pc.ontrack = null;
      pc.onconnectionstatechange = null;
      pc.close();
      pc = null;
    }
    if(localStream){
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    remoteStream = null;
    pendingCandidates = [];
    addedCandidates.clear();
    callStartedAt = 0;
    callSeconds = 0;
    lastUpgradeOffer = "";
    lastUpgradeAnswer = "";
    remoteMuted = false;
    connected = false;
    hideCallScreen();
    $("incomingCall").style.display = "none";
    $("videoRequestBox").style.display = "none";
    callId = null;
    callData = null;
    role = null;
    ending = false;
  }
}

async function createInitialCall(type = "audio"){
  if(!currentUser || !friendUser?.uid || callId) return;
  try{
    ending = false;
    role = "caller";
    connected = false;
    callStartedAt = 0;
    callSeconds = 0;
    const callRef = await addDoc(collection(db, "calls"), {
      callerId: currentUser.uid,
      callerName: currentUser.displayName || "مستخدم Mecd",
      callerPhoto: currentUser.photoURL || "",
      receiverId: friendUser.uid,
      receiverName: friendUser.name || "مستخدم Mecd",
      receiverPhoto: friendUser.photo || "",
      callType: type,
      status: "ringing",
      createdAt: serverTimestamp(),
      videoAccepted: false
    });
    callId = callRef.id;
    callData = { callType: type, status: "ringing" };
    createPeer();
    await ensureMedia(type === "video");

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await updateDoc(callRef, { offer: { type: offer.type, sdp: offer.sdp } });
    showCallScreen(type);
    state(type === "video" ? "جاري الاتصال بالفيديو..." : "جاري الاتصال...");
    watchCall();
    watchCandidates();
  }catch(error){
    console.error("Create call error:", error);
    alert("تعذر بدء المكالمة:\n" + error.message);
    await finishCall("cancelled").catch(() => {});
  }
}

function watchCandidates(){
  if(!callId) return;
  stopCandidatesWatch?.();
  const q = query(collection(db, "calls", callId, "candidates"));
  stopCandidatesWatch = onSnapshot(q, snap => {
    snap.docChanges().forEach(change => {
      if(change.type !== "added") return;
      const data = change.doc.data();
      if(data.senderId === currentUser?.uid) return;
      addRemoteCandidate(new RTCIceCandidate(data.candidate), change.doc.id);
    });
  });
}

async function handleUpgradeOffer(d){
  if(!pc || role !== "receiver" || !d.upgradeOffer || lastUpgradeOffer === d.upgradeOffer.sdp) return;
  lastUpgradeOffer = d.upgradeOffer.sdp;
  try{
    await ensureMedia(true);
    await pc.setRemoteDescription(new RTCSessionDescription(d.upgradeOffer));
    await flushCandidates();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await updateDoc(doc(db, "calls", callId), {
      upgradeAnswer: { type: answer.type, sdp: answer.sdp },
      videoAccepted: true,
      callType: "video"
    });
    callData.videoAccepted = true;
    callData.callType = "video";
    showVideoStage();
    state("● متصل • فيديو");
  }catch(error){
    console.error("Upgrade offer", error);
  }
}

async function handleVideoRequest(d){
  if(d.videoRequestedBy === currentUser?.uid) return;
  const lastHandled = Number(sessionStorage.getItem("videoRequestVersion") || 0);
  const v = Number(d.videoRequestVersion || 0);
  if(v <= lastHandled) return;
  sessionStorage.setItem("videoRequestVersion", String(v));
  if(d.videoRequestStatus === "pending"){
    $("videoRequestText").textContent = "يريد الطرف الآخر تحويل المكالمة إلى فيديو";
    $("videoRequestBox").style.display = "block";
  }
}

async function acceptVideoRequest(){
  if(!callId || !currentUser) return;
  $("videoRequestBox").style.display = "none";
  try{
    await updateDoc(doc(db, "calls", callId), {
      videoRequestStatus: "accepted",
      videoAccepted: false,
      videoAcceptedBy: currentUser.uid
    });
    state("تم قبول طلب الفيديو…");
  }catch(error){
    console.error(error);
  }
}

async function rejectVideoRequest(){
  if(!callId) return;
  $("videoRequestBox").style.display = "none";
  try{
    await updateDoc(doc(db, "calls", callId), {
      videoRequestStatus: "rejected",
      videoAccepted: false
    });
    state("تم رفض طلب الفيديو");
  }catch(error){
    console.error(error);
  }
}

async function startVideoUpgrade(){
  if(!callId || !pc || !connected || !currentUser || callData?.callType === "video" || callData?.videoAccepted === true) return;
  try{
    const version = Date.now();
    await updateDoc(doc(db, "calls", callId), {
      videoRequestVersion: version,
      videoRequestStatus: "pending",
      videoRequestedBy: currentUser.uid
    });
    state("تم إرسال طلب الفيديو…");
  }catch(error){
    console.error(error);
    alert("تعذر إرسال طلب الفيديو");
  }
}

async function callerStartUpgrade(d){
  if(role !== "caller" || d.videoRequestStatus !== "accepted" || d.videoAccepted === true || !pc) return;
  try{
    await ensureMedia(true);
    const version = Number(d.videoRequestVersion || Date.now());
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await updateDoc(doc(db, "calls", callId), {
      upgradeOffer: { type: offer.type, sdp: offer.sdp },
      upgradeVersion: version,
      callType: "video"
    });
    callData.callType = "video";
    state("جاري تشغيل الفيديو…");
    showVideoStage();
  }catch(error){
    console.error("start upgrade", error);
    alert("تعذر تشغيل الكاميرا.");
  }
}

function watchCall(){
  if(!callId) return;
  stopCallWatch?.();
  stopCallWatch = onSnapshot(doc(db, "calls", callId), async snap => {
    if(!snap.exists()){
      await finishCall("ended", true);
      return;
    }
    const d = snap.data();
    callData = { ...(callData || {}), ...d };

    if(["rejected", "cancelled", "missed", "ended"].includes(d.status)){
      callSeconds = Number(d.duration || callSeconds || 0);
      await finishCall(d.status, true);
      return;
    }

    if(d.status === "connected"){
      connected = true;
      const start = d.connectedAt?.toMillis?.() || Date.now();
      if(!callStartedAt) startTimer(start);
      state(d.videoAccepted === true || d.callType === "video" ? "● متصل • فيديو" : "● متصل");
    }

    if(d.answer?.sdp && role === "caller" && pc && !pc.currentRemoteDescription){
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
        await flushCandidates();
        connected = true;
        if(!callStartedAt) startTimer(d.connectedAt?.toMillis?.() || Date.now());
      }catch(error){
        console.error("answer", error);
      }
    }

    if(d.videoRequestStatus === "pending") await handleVideoRequest(d);
    if(d.videoRequestStatus === "rejected" && role === "caller") state("تم رفض طلب الفيديو");
    if(d.videoRequestStatus === "accepted" && role === "caller") await callerStartUpgrade(d);
    if(d.upgradeOffer && d.upgradeOffer.sdp !== lastUpgradeOffer && role === "receiver") await handleUpgradeOffer(d);

    if(d.upgradeAnswer && d.upgradeAnswer.sdp !== lastUpgradeAnswer && role === "caller" && pc){
      lastUpgradeAnswer = d.upgradeAnswer.sdp;
      try{
        await pc.setRemoteDescription(new RTCSessionDescription(d.upgradeAnswer));
        await flushCandidates();
        callData.videoAccepted = true;
        callData.callType = "video";
        showVideoStage();
        state("● متصل • فيديو");
      }catch(error){
        console.error("upgrade answer", error);
      }
    }

    if(d.callType === "video" || d.videoAccepted === true){
      if(localStream?.getVideoTracks().length){
        $("localVideo").style.display = "block";
      }
      showVideoStage();
    }
  });
}

async function acceptIncoming(){
  if(!callId || !callData || ending) return;
  const id = callId;
  ending = false;
  role = "receiver";
  connected = false;
  $("incomingCall").style.display = "none";
  try{
    const snap = await getDoc(doc(db, "calls", id));
    if(!snap.exists() || snap.data().status !== "ringing"){
      await finishCall("cancelled", true);
      return;
    }
    callData = { ...callData, ...snap.data() };
    createPeer();
    await ensureMedia(callData.callType === "video");

    await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
    await flushCandidates();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await updateDoc(doc(db, "calls", id), {
      answer: { type: answer.type, sdp: answer.sdp },
      status: "connected",
      connectedAt: serverTimestamp()
    });
    showCallScreen(callData.callType);
    startTimer();
    watchCall();
    watchCandidates();
  }catch(error){
    console.error("accept", error);
    alert("تعذر قبول المكالمة.");
    await finishCall("rejected").catch(() => {});
  }
}

async function rejectIncoming(){
  if(!callId) return;
  const id = callId;
  try{
    await updateDoc(doc(db, "calls", id), {
      status: "rejected",
      duration: 0,
      endedAt: serverTimestamp()
    });
  }catch(error){
    console.error(error);
  }
  $("incomingCall").style.display = "none";
  callId = null;
  callData = null;
  role = null;
}

function renderIncoming(id, data){
  if(callId || ending) return;
  callId = id;
  callData = data;
  role = "receiver";
  connected = false;
  $("incomingName").textContent = data.callerName || "مستخدم Mecd";
  $("incomingType").textContent = data.callType === "video" ? "مكالمة فيديو" : "مكالمة صوتية";
  setUserAvatar($("incomingAvatar"), { photo: data.callerPhoto || "" });
  $("incomingCall").style.display = "flex";
}

function listenIncoming(){
  if(!currentUser) return;
  stopIncomingWatch?.();
  const q = query(
    collection(db, "calls"),
    where("receiverId", "==", currentUser.uid),
    where("status", "==", "ringing")
  );
  stopIncomingWatch = onSnapshot(q, snap => {
    for(const change of snap.docChanges()){
      const data = change.doc.data();
      const id = change.doc.id;
      if(change.type === "added"){
        const created = data.createdAt?.toMillis?.() || 0;
        if(created && (Date.now() - created > 35000)){
          updateDoc(doc(db, "calls", id), {
            status: "missed",
            duration: 0,
            endedAt: serverTimestamp()
          }).catch(() => {});
          continue;
        }
        renderIncoming(id, data);
      }
      if(change.type === "removed" && callId === id && !connected){
        $("incomingCall").style.display = "none";
        callId = null;
        callData = null;
        role = null;
      }
    }
  });
}

/* =========================
   Voice Recording (Supabase)
========================= */
const vBtn = $("voiceButton");
const rBox = $("recordBox");
const rText = $("recordText");
const rTime = $("recordTime");
const rCancel = $("cancelRecord");

let vRec = null;
let vStream = null;
let vChunks = [];
let vCancelled = false;
let vTimer = null;
let vStart = 0;

function resetVoice(){
  rBox.style.display = "none";
  rTime.textContent = "00:00";
  vBtn?.classList.remove("recording");
  clearInterval(vTimer);
  vTimer = null;
  vRec = null;
}

async function startVoice(){
  if(vRec || !currentUser || !friendUser || !chatID) return;
  try{
    vStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    vChunks = [];
    vCancelled = false;
    const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
    vRec = new MediaRecorder(vStream, { mimeType });

    vRec.ondataavailable = event => {
      if(event.data && event.data.size > 0) vChunks.push(event.data);
    };

    vRec.onstop = async () => {
      const chunksCopy = [...vChunks];
      const recordedMime = vRec?.mimeType || mimeType;
      vChunks = [];
      vStream?.getTracks().forEach(track => track.stop());
      vStream = null;
      const wasCancelled = vCancelled;
      vCancelled = false;
      resetVoice();

      if(wasCancelled) return;

      const blob = new Blob(chunksCopy, { type: recordedMime });
      if(blob.size < 1000){
        alert("التسجيل قصير جداً.");
        return;
      }

      if(!currentUser || !friendUser || !chatID) return;
      setUploading(true, "جارٍ إرسال التسجيل الصوتي...");
      try{
        const ext = recordedMime.includes("mp4") ? "m4a" : "webm";
        const audioUrl = await uploadToSupabaseBucket(blob, "voice", ext);

        await addDoc(collection(db, "chats", chatID, "messages"), {
          type: "voice",
          url: audioUrl,
          mimeType: blob.type,
          text: "🎤 تسجيل صوتي",
          senderId: currentUser.uid,
          receiverId: friendUser.uid,
          read: false,
          createdAt: serverTimestamp(),
          deletedFor: []
        });
        await updateChatSummary("🎤 تسجيل صوتي");
        scrollToBottom(true);
      }catch(error){
        console.error(error);
        alert("تعذر رفع أو إرسال التسجيل الصوتي");
      }finally{
        setUploading(false);
      }
    };

    vRec.start();
    rBox.style.display = "flex";
    rText.textContent = "🎤 يسجل صوت…";
    vBtn.classList.add("recording");
    vStart = Date.now();
    vTimer = setInterval(() => {
      const seconds = Math.floor((Date.now() - vStart) / 1000);
      rTime.textContent = formatSeconds(seconds);
    }, 500);
  }catch(error){
    console.error(error);
    alert("الرجاء السماح بالوصول للميكروفون لتسجيل الصوت.");
    vStream?.getTracks().forEach(track => track.stop());
    vStream = null;
    resetVoice();
  }
}

function cancelVoice(){
  if(!vRec) return;
  vCancelled = true;
  if(vRec.state !== "inactive"){
    vRec.stop();
  }else{
    resetVoice();
  }
}

vBtn?.addEventListener("click", () => {
  if(vRec && vRec.state === "recording"){
    vRec.stop();
  }else{
    startVoice();
  }
});

rCancel?.addEventListener("click", event => {
  event.preventDefault();
  event.stopPropagation();
  cancelVoice();
});

/* =========================
   Auth & Lifecycle
========================= */
onAuthStateChanged(auth, async user => {
  if(!user){
    if(unsubscribeMessages) unsubscribeMessages();
    if(unsubscribeFriendStatus) unsubscribeFriendStatus();
    stopIncomingWatch?.();
    stopPresence();
    showError("يجب تسجيل الدخول أولاً إلى Mecd Chat.");
    return;
  }
  currentUser = user;
  try{
    startPresence();
    await loadFriend();
    listenMessages();
    listenIncoming();
    window.chatDB = db;
    window.chatUser = currentUser;
    window.chatFriend = friendUser;
    window.chatID = chatID;
    loading.style.display = "none";
    app.style.display = "flex";
    messageInput.blur();
  }catch(error){
    console.error("Chat loading error:", error);
    showError(error);
  }
});

window.addEventListener("pagehide", () => {
  if(callId && !ending){
    finishCall(connected ? "ended" : "cancelled").catch(() => {});
  }
});

window.addEventListener("beforeunload", () => {
  if(unsubscribeMessages) unsubscribeMessages();
  if(unsubscribeFriendStatus) unsubscribeFriendStatus();
  stopIncomingWatch?.();
  stopPresence();
});
</script>
