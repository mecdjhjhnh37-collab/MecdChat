<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

height:100vh;

font-family:Arial,Tahoma,sans-serif;

color:white;

background:

radial-gradient(
circle at top,
#123d35,
transparent 40%
),

linear-gradient(
180deg,
#07110f,
#020504
);

overflow:hidden;

}

.app{

height:100vh;

max-width:650px;

margin:auto;

display:flex;

flex-direction:column;

}

header{

height:75px;

display:flex;

align-items:center;

gap:12px;

padding:12px 15px;

background:#050807;

border-bottom:1px solid rgba(255,255,255,.08);

}

.back{

width:45px;

height:45px;

border:0;

border-radius:15px;

background:#18231f;

color:white;

font-size:22px;

cursor:pointer;

}

.avatar{

width:48px;

height:48px;

border-radius:16px;

background:#12352c;

display:flex;

align-items:center;

justify-content:center;

overflow:hidden;

font-size:24px;

}

.avatar img{

width:100%;

height:100%;

object-fit:cover;

}

.user-info{

flex:1;

}

.user-name{

font-size:17px;

font-weight:bold;

}

.user-status{

font-size:12px;

color:#777;

margin-top:5px;

}

.user-status.online{

color:#00e889;

}

.call-buttons{

display:flex;

gap:8px;

}

.call-buttons button{

width:42px;

height:42px;

border:0;

border-radius:14px;

background:#18231f;

color:white;

font-size:18px;

cursor:pointer;

}


/* الرسائل */

.messages{

flex:1;

overflow-y:auto;

padding:20px 15px 150px;

display:flex;

flex-direction:column;

gap:10px;

}

.empty{

margin:auto;

text-align:center;

color:#72817c;

}

.message{

max-width:78%;

padding:12px 15px;

border-radius:18px;

position:relative;

word-break:break-word;

}

.message.mine{

align-self:flex-start;

background:#00c96b;

color:#00150e;

border-bottom-left-radius:5px;

}

.message.other{

align-self:flex-end;

background:#18231f;

border:1px solid rgba(255,255,255,.08);

border-bottom-right-radius:5px;

}

.time{

display:block;

font-size:9px;

opacity:.6;

margin-top:5px;

}


/* الكتابة */

.input-area{

position:fixed;

bottom:0;

left:50%;

transform:translateX(-50%);

width:100%;

max-width:650px;

padding:10px;

display:flex;

gap:8px;

background:#050807;

}

#messageInput{

flex:1;

padding:14px;

border-radius:17px;

border:1px solid #27332f;

background:#111916;

color:white;

outline:none;

font-size:15px;

}

#voiceButton,
#sendButton{

width:50px;

height:50px;

border:0;

border-radius:16px;

font-size:22px;

cursor:pointer;

}

#voiceButton{

background:#18231f;

color:white;

}

#sendButton{

background:#00e889;

color:#00150e;

}


/* قائمة حذف الرسالة */

.message-menu{

position:absolute;

left:10px;

bottom:55px;

background:#101815;

padding:8px;

border-radius:16px;

box-shadow:0 8px 25px #000;

z-index:999;

width:150px;

max-width:calc(100% - 20px);

animation:showMenu .2s ease;

}

@keyframes showMenu{

from{

opacity:0;

transform:translateY(10px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.message-menu button{

width:100%;

background:#18231f;

color:white;

border:0;

padding:12px;

border-radius:10px;

font-size:14px;

cursor:pointer;

white-space:nowrap;

}

</style>

</head>

<body>


<div
id="loading"
style="
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020504;
color:white;
font-size:18px;
z-index:999;
">

جارٍ فتح الدردشة...

</div>



<main
id="app"
class="app"
style="display:none;"
>


<header>


<button
id="backButton"
class="back"
type="button"
>
→
</button>



<div
id="friendAvatar"
class="avatar"
>
👤
</div>




<div class="user-info">


<div
id="friendName"
class="user-name"
>
جار التحميل...
</div>



<div
id="friendStatus"
class="user-status"
>
● غير متصل
</div>



</div>




<div class="call-buttons">


<button
id="callButton"
type="button"
>
📞
</button>


<button
id="videoButton"
type="button"
>
📹
</button>


</div>


</header>





<div
id="messages"
class="messages"
>


<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>


</div>





<div class="input-area">


<input
id="messageInput"
placeholder="اكتب رسالة..."
autocomplete="off"
maxlength="2000"
>



<button
id="voiceButton"
type="button"
>
🎤
</button>



<button
id="sendButton"
type="button"
>
➤
</button>



</div>



</main>





<script type="module">


import {

initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,
onAuthStateChanged

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

getFirestore,
doc,
getDoc,
setDoc,
collection,
query,
orderBy,
onSnapshot,
addDoc,
deleteDoc,
updateDoc,
arrayUnion,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



import {

getStorage

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";



const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915"

};



const firebaseApp =
initializeApp(
firebaseConfig
);



const auth =
getAuth(
firebaseApp
);



const db =
getFirestore(
firebaseApp
);



const storage =
getStorage(
firebaseApp
);



window.chatDB =
db;

window.storage =
storage;



const messages =
document.getElementById(
"messages"
);



const messageInput =
document.getElementById(
"messageInput"
);



const sendButton =
document.getElementById(
"sendButton"
);



const friendName =
document.getElementById(
"friendName"
);



const friendAvatar =
document.getElementById(
"friendAvatar"
);



const friendStatus =
document.getElementById(
"friendStatus"
);



const backButton =
document.getElementById(
"backButton"
);



const callButton =
document.getElementById(
"callButton"
);



const videoButton =
document.getElementById(
"videoButton"
);



let currentUser =
null;



let friendUser =
null;



let chatID =
null;



let unsubscribeMessages =
null;



let unsubscribeFriendStatus =
null;



let presenceInterval =
null;



/* =========================
   إنشاء Chat ID
========================= */

function createChatID(a,b){

return [

a,
b

]
.sort()
.join("_");

}



/* =========================
   تحديث حالة المستخدم
========================= */

async function updateMyPresence(){

if(!currentUser)
return;


try{

await setDoc(

doc(
db,
"users",
currentUser.uid
),

{

online:true,

lastSeen:
serverTimestamp()

},

{

merge:true

}

);

}catch(error){

console.error(
"Presence error:",
error
);

}

}



/* =========================
   تشغيل Presence
========================= */

function startPresence(){

updateMyPresence();


if(presenceInterval){

clearInterval(
presenceInterval
);

}


presenceInterval =
setInterval(

()=>{

updateMyPresence();

},

10000

);

}



/* =========================
   إيقاف Presence
========================= */

function stopPresence(){

if(presenceInterval){

clearInterval(
presenceInterval
);

presenceInterval =
null;

}

}



/* =========================
   مراقبة حالة الصديق
========================= */

function listenFriendStatus(){

if(!friendUser)
return;


if(unsubscribeFriendStatus){

unsubscribeFriendStatus();

unsubscribeFriendStatus =
null;

}


const friendRef =
doc(
db,
"users",
friendUser.uid
);



unsubscribeFriendStatus =
onSnapshot(

friendRef,

snap=>{

if(!snap.exists())
return;


const data =
snap.data();


const lastSeen =
data.lastSeen &&

typeof data.lastSeen.toMillis ===
"function"

?

data.lastSeen.toMillis()

:

0;


const online =
data.online === true &&

lastSeen > 0 &&

(Date.now() - lastSeen < 30000);


if(online){

friendStatus.textContent =
"● متصل";

friendStatus.classList.add(
"online"
);

}else{

friendStatus.textContent =
"● غير متصل";

friendStatus.classList.remove(
"online"
);

}

},

error=>{

console.error(
"Friend status error:",
error
);

}

);

}



/* =========================
   تحميل الصديق
========================= */

async function loadFriend(){

const params =
new URLSearchParams(
location.search
);


const id =
params.get("friend");


if(!id){

alert(
"لا يوجد صديق"
);

return false;

}



const userDoc =
await getDoc(

doc(
db,
"users",
id
)

);



if(!userDoc.exists()){

alert(
"المستخدم غير موجود"
);

return false;

}



const data =
userDoc.data();



friendUser = {

uid:id,

name:
data.name ||
"مستخدم Mecd",

photo:
data.photo ||
""

};



friendName.textContent =
friendUser.name;



if(friendUser.photo){

friendAvatar.innerHTML = `

<img
src="${friendUser.photo}"
alt="صورة الحساب"
>

`;

}else{

friendAvatar.textContent =
"👤";

}



chatID =
createChatID(

currentUser.uid,

friendUser.uid

);



window.chatID =
chatID;

window.chatUser =
currentUser;

window.chatFriend =
friendUser;



await setDoc(

doc(
db,
"chats",
chatID
),

{

members:[
currentUser.uid,
friendUser.uid
],

createdAt:
serverTimestamp()

},

{

merge:true

}

);



listenFriendStatus();


return true;

}



/* =========================
   الاستماع للرسائل
========================= */

function listenMessages(){

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages =
null;

}



const ref =
collection(

db,
"chats",
chatID,
"messages"

);



const q =
query(

ref,

orderBy(
"createdAt",
"asc"
)

);



unsubscribeMessages =
onSnapshot(

q,

snap=>{

messages.innerHTML =
"";


let visibleMessages =
0;


snap.forEach(

item=>{

const data =
item.data();


/* الرسائل المحذوفة لدي */

if(

Array.isArray(
data.deletedFor
)

&&

data.deletedFor.includes(
currentUser.uid
)

){

return;

}


visibleMessages++;


const box =
document.createElement(
"div"
);


box.className =

"message " +

(

data.senderId ===
currentUser.uid

?

"mine"

:

"other"

);


/* رسالة صوتية */

if(data.type === "voice"){

const audio =
document.createElement(
"audio"
);


audio.controls =
true;


audio.src =
data.audio ||
"";


audio.style.width =
"230px";


audio.style.maxWidth =
"100%";


box.appendChild(
audio
);



const voiceText =
document.createElement(
"span"
);


voiceText.textContent =
"🎤 رسالة صوتية";


voiceText.style.display =
"block";


voiceText.style.fontSize =
"12px";


box.appendChild(
voiceText
);

}else{

box.appendChild(

document.createTextNode(
data.text ||
""
)

);

}



/* الوقت */

const time =
document.createElement(
"span"
);


time.className =
"time";


if(

data.createdAt &&

typeof data.createdAt.toDate ===
"function"

){

time.textContent =

data.createdAt
.toDate()
.toLocaleTimeString(

"ar",

{

hour:
"2-digit",

minute:
"2-digit"

}

);

}



box.appendChild(
time
);



messages.appendChild(
box
);



addMessageActions(

box,

item.id,

data.senderId ===
currentUser.uid

);

}

);



if(visibleMessages === 0){

messages.innerHTML = `

<div class="empty">

💬

<br>

ابدأ المحادثة الآن

</div>

`;

}



/* النزول لآخر الرسائل */

requestAnimationFrame(

()=>{

messages.scrollTop =
messages.scrollHeight;

}

);

},

error=>{

console.error(
"Messages error:",
error
);

}

);

}



/* =========================
   إرسال رسالة
========================= */

async function sendMessage(){

const text =
messageInput.value.trim();


if(!text)
return;


if(
!currentUser ||
!friendUser ||
!chatID
)
return;



try{

sendButton.disabled =
true;



await addDoc(

collection(
db,
"chats",
chatID,
"messages"
),

{

text:text,

senderId:
currentUser.uid,

receiverId:
friendUser.uid,

createdAt:
serverTimestamp()

}

);



messageInput.value =
"";


}catch(error){

console.error(
"Send message error:",
error
);


alert(
"حدث خطأ أثناء إرسال الرسالة"
);

}finally{

sendButton.disabled =
false;

messageInput.focus();

}

}



/* =========================
   زر الإرسال
========================= */

sendButton.onclick =
sendMessage;



messageInput.addEventListener(

"keydown",

e=>{

if(e.key === "Enter"){

e.preventDefault();

sendMessage();

}

});



/* =========================
   قائمة حذف الرسائل
========================= */

function addMessageActions(

element,

id,

mine

){

let timer =
null;



/* ضغط مطول */

element.addEventListener(

"pointerdown",

e=>{

if(
e.target.closest(
".message-menu"
)
)
return;



timer =
setTimeout(

()=>{

showDeleteMenu();

},

500

);

}

);



/* إلغاء الضغط */

element.addEventListener(

"pointerup",

()=>{

if(timer){

clearTimeout(
timer
);

timer =
null;

}

}

);



element.addEventListener(

"pointercancel",

()=>{

if(timer){

clearTimeout(
timer
);

timer =
null;

}

}

);



element.addEventListener(

"pointerleave",

()=>{

if(timer){

clearTimeout(
timer
);

timer =
null;

}

}

);



/* كليك يمين */

element.addEventListener(

"contextmenu",

e=>{

e.preventDefault();

showDeleteMenu();

}

);



/* إظهار القائمة */

function showDeleteMenu(){

removeMenus();



const menu =
document.createElement(
"div"
);



menu.className =
"message-menu";



const button =
document.createElement(
"button"
);



if(mine){

button.textContent =
"🗑️ إلغاء الإرسال";



button.onclick =
async e=>{

e.stopPropagation();



try{

await deleteDoc(

doc(

db,

"chats",

chatID,

"messages",

id

)

);



removeMenus();



}catch(error){

console.error(
"Delete message error:",
error
);


alert(
"حدث خطأ أثناء إلغاء إرسال الرسالة"
);

}

};



}else{

button.textContent =
"🗑️ حذف لدي";



button.onclick =
async e=>{

e.stopPropagation();



try{

await updateDoc(

doc(

db,

"chats",

chatID,

"messages",

id

)

),

{

deletedFor:
arrayUnion(
currentUser.uid
)

}

);



removeMenus();



}catch(error){

console.error(
"Delete for me error:",
error
);


alert(
"حدث خطأ أثناء حذف الرسالة"
);

}

};

}



menu.appendChild(
button
);



element.appendChild(
menu
);

}

}



/* =========================
   إغلاق قوائم الحذف
========================= */

function removeMenus(){

document
.querySelectorAll(
".message-menu"
)
.forEach(

menu=>{

menu.remove();

}

);

}



/* الضغط خارج القائمة */

document.addEventListener(

"pointerdown",

e=>{

if(
e.target.closest(
".message-menu"
)
)
return;


removeMenus();

}

);



/* =========================
   تسجيل الدخول
========================= */

onAuthStateChanged(

auth,

async user=>{

if(!user){

console.log(
"لا يوجد مستخدم مسجل"
);

stopPresence();

return;

}



currentUser =
user;



console.log(
"تم تسجيل الدخول:",
currentUser.uid
);



/* تشغيل حالة متصل */

startPresence();



try{

const ok =
await loadFriend();



console.log(
"نتيجة loadFriend:",
ok
);



if(ok){

listenMessages();



document.getElementById(
"loading"
).style.display =
"none";



document.getElementById(
"app"
).style.display =
"flex";

}

}catch(error){

console.error(
"Mecd Chat error:",
error
);



document.getElementById(
"loading"
).innerHTML = `

<div>

⚠️ حدث خطأ أثناء فتح الدردشة

</div>

<div

style="
font-size:12px;
color:#777;
margin-top:8px;
"

>

${error.message || ""}

</div>

`;

}

});



/* =========================
   عند العودة للصفحة
========================= */

document.addEventListener(

"visibilitychange",

()=>{

if(
document.visibilityState ===
"visible"
){

updateMyPresence();

}

});



/* =========================
   الأزرار
========================= */

backButton.onclick =
()=>{

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages =
null;

}



if(unsubscribeFriendStatus){

unsubscribeFriendStatus();

unsubscribeFriendStatus =
null;

}



stopPresence();



history.back();

};



callButton.onclick =
()=>{

alert(
"📞 الاتصال قيد التطوير"
);

};



videoButton.onclick =
()=>{

alert(
"📹 الفيديو قيد التطوير"
);

};

</script>



<script
type="module"
src="voice.js"
></script>


</body>

</html>
