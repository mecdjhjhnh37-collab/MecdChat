<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mecd Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0b141a;
            color: #e9edef;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* الهيدر العلوي */
        .chat-header {
            background-color: #202c33;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2a3942;
        }
        .chat-header h3 {
            font-size: 16px;
            color: #f3f3f3;
        }
        /* منطقة الرسائل */
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
            font-size: 14px;
            cursor: pointer;
        }
        .message.sent {
            background-color: #005c4b;
            align-self: flex-end;
        }
        .message.received {
            background-color: #202c33;
            align-self: flex-start;
        }
        .message .time {
            font-size: 10px;
            color: #8696a0;
            float: left;
            margin-top: 5px;
            margin-left: 10px;
        }
        
        /* شريط التعديل العلوي فوق خانة الكتابة */
        #edit-banner {
            background-color: #202c33;
            padding: 8px 15px;
            display: none;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2a3942;
            font-size: 13px;
        }
        #edit-banner span {
            color: #00a884;
            font-weight: bold;
        }
        #edit-banner button {
            background: none;
            border: none;
            color: #8696a0;
            cursor: pointer;
            font-size: 14px;
        }

        /* خانة الإدخال السفلية */
        .chat-input-area {
            background-color: #202c33;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            background-color: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            color: #e9edef;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area button {
            background-color: #00a884;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="chat-header">
        <h3>Diana Mostafa</h3>
    </div>

    <!-- رسائل المحادثة (كمثال تجريبي) -->
    <div class="chat-messages" id="messages-container">
        <div class="message sent" onclick="startEdit(1, 'مرحباً، كيف حالك؟')">
            مرحباً، كيف حالك؟
            <span class="time">08:10</span>
        </div>
        <div class="message sent" onclick="startEdit(2, 'تجربة تعديل الرسالة هنا')">
            تجربة تعديل الرسالة هنا
            <span class="time">08:42</span>
        </div>
    </div>

    <!-- بانر يظهر فقط عند تفعيل وضع التعديل -->
    <div id="edit-banner">
        <div>✏️ تعديل الرسالة: <span id="editing-text-preview"></span></div>
        <button onclick="cancelEdit()">إلغاء ✕</button>
    </div>

    <!-- خانة الكتابة وزر الإرسال -->
    <div class="chat-input-area">
        <input type="text" id="message-input" placeholder="اكتب رسالة...">
        <button id="send-btn" onclick="handleSendMessage()">➤</button>
    </div>

    <script>
        let editingMessageId = null; // تخزين معرف الرسالة قيد التعديل

        // 1. عندما يضغط المستخدم على أي رسالة لإرسالها لوضع التعديل
        function startEdit(id, currentText) {
            editingMessageId = id;
            const inputField = document.getElementById('message-input');
            const editBanner = document.getElementById('edit-banner');
            const editPreview = document.getElementById('editing-text-preview');

            // وضع النص القديم في خانة الإدخال
            inputField.value = currentText;
            inputField.focus();

            // إظهار بانر التعديل
            editBanner.style.display = 'flex';
            editPreview.innerText = currentText;
        }

        // 2. إلغاء وضع التعديل
        function cancelEdit() {
            editingMessageId = null;
            document.getElementById('message-input').value = '';
            document.getElementById('edit-banner').style.display = 'none';
        }

        // 3. التعامل مع الإرسال أو التحديث
        function handleSendMessage() {
            const inputField = document.getElementById('message-input');
            const text = inputField.value.trim();

            if (text === "") return;

            if (editingMessageId !== null) {
                // --- حالة التعديل ---
                console.log("تم تعديل الرسالة رقم " + editingMessageId + " إلى: " + text);
                // هنا يمكنك وضع كود تحديث الرسالة في قاعدة البيانات لديك (مثل Firebase)
                
                // إعادة الوضع الطبيعي
                cancelEdit();
            } else {
                // --- حالة إرسال رسالة جديدة ---
                console.log("إرسال رسالة جديدة: " + text);
                
                // إضافة الرسالة واجهةً (كمثال)
                const container = document.getElementById('messages-container');
                container.innerHTML += `
                    <div class="message sent">
                        ${text}
                        <span class="time">الآن</span>
                    </div>
                `;

                // تفريغ المربع
                inputField.value = '';
                container.scrollTop = container.scrollHeight;
            }
        }
    </script>
</body>
</html>
