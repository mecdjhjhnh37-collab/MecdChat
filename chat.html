/* =========================================================
   RINGTONE ENGINE
========================================================= */

let audioContext=null;
let ringtoneTimer=null;
let ringtoneMode=null;

function ensureAudioContext(){

try{

if(!audioContext){

audioContext=
new (
window.AudioContext||
window.webkitAudioContext
)();

}

if(audioContext.state==="suspended")
audioContext.resume().catch(()=>{});

}catch(e){

console.warn(
"AudioContext:",
e
);

}

}

function playTone(
frequency,
duration=0.18,
volume=0.045
){

if(!audioContext)
return;

try{

const oscillator=
audioContext.createOscillator();

const gain=
audioContext.createGain();

oscillator.type="sine";
oscillator.frequency.value=frequency;

gain.gain.setValueAtTime(
0,
audioContext.currentTime
);

gain.gain.linearRampToValueAtTime(
volume,
audioContext.currentTime+0.02
);

gain.gain.exponentialRampToValueAtTime(
0.001,
audioContext.currentTime+duration
);

oscillator.connect(gain);
gain.connect(audioContext.destination);

oscillator.start();

oscillator.stop(
audioContext.currentTime+duration+0.03
);

}catch(e){

console.warn(
"Tone:",
e
);

}

}

function playCallerRing(){

ensureAudioContext();

stopRingtone();

ringtoneMode="caller";

const ring=()=>{

if(ringtoneMode!=="caller")
return;

playTone(440,0.22,0.045);

setTimeout(
()=>{
if(ringtoneMode==="caller")
playTone(480,0.22,0.04);
},
260
);

};

ring();

ringtoneTimer=setInterval(
ring,
1700
);

}

function playReceiverRing(){

ensureAudioContext();

stopRingtone();

ringtoneMode="receiver";

const ring=()=>{

if(ringtoneMode!=="receiver")
return;

playTone(620,0.20,0.055);

setTimeout(
()=>{
if(ringtoneMode==="receiver")
playTone(780,0.20,0.05);
},
250
);

setTimeout(
()=>{
if(ringtoneMode==="receiver")
playTone(620,0.20,0.055);
},
520
);

};

ring();

ringtoneTimer=setInterval(
ring,
1900
);

}

function stopRingtone(){

ringtoneMode=null;

if(ringtoneTimer){

clearInterval(
ringtoneTimer
);

ringtoneTimer=null;

}

}

if(
window.crypto&&
typeof crypto.randomUUID==="function"
)

Date.now()+"_"+
Math.random()
.toString(36)

function escapeHtml(value){

return String(value??"")
.replace(/[&<>'"]/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));

}

function formatTime(timestamp){

if(!timestamp?.toDate)
return "";

try{

return timestamp.toDate()
.toLocaleTimeString(
"ar",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

function formatDuration(seconds){

seconds=Math.max(
0,
Math.floor(
Number(seconds||0)
)
);

const minutes=
Math.floor(seconds/60);

const secs=
seconds%60;

return String(minutes)
.padStart(2,"0")
+
":"+
String(secs)
.padStart(2,"0");

}

async function updateMyPresence(

){

if(!currentUser)
return;

try{

}
);

}

/* =========================================================
   VOICE RECORDING
========================================================= */

async function startVoiceRecording(){

if(voiceRecording)
return;

if(
!navigator.mediaDevices||
!navigator.mediaDevices.getUserMedia
){

safeAlert(
"المتصفح لا يدعم تسجيل الصوت"
);

return;

}

try{

ensureAudioContext();

const stream=
await navigator.mediaDevices.getUserMedia(
{
audio:{
echoCancellation:true,
noiseSuppression:true,
autoGainControl:true
}
}
);

recordedChunks=[];

let mimeType="";

const types=[
"audio/webm;codecs=opus",
"audio/webm",
"audio/ogg;codecs=opus",
"audio/mp4"
];

for(
const type of types
){

if(
window.MediaRecorder&&
MediaRecorder.isTypeSupported(type)
){

mimeType=type;
break;

}

}

if(!window.MediaRecorder){

stream.getTracks()
.forEach(
track=>track.stop()
);

safeAlert(
"تسجيل الصوت غير مدعوم في هذا المتصفح"
);

return;

}

mediaRecorder=
mimeType
?
new MediaRecorder(
stream,
{
mimeType
}
)
:
new MediaRecorder(
stream
);

mediaRecorder.ondataavailable=
event=>{

if(
event.data&&
event.data.size>0
){

recordedChunks.push(
event.data
);

}

};

mediaRecorder.onerror=
event=>{

console.error(
"MediaRecorder:",
event
);

};

mediaRecorder.onstop=
async()=>{

stream.getTracks()
.forEach(
track=>{
try{
track.stop();
}catch{}
}
);

voiceButton.classList.remove(
"recording"
);

voiceRecording=false;

updateMyActivity(
messageInput.value.trim()
?"typing"
:"none"
);

if(!recordedChunks.length)
return;

const blob=
new Blob(
recordedChunks,
{
type:
mediaRecorder.mimeType||
"audio/webm"
}
);

await sendVoiceMessage(
blob
);

mediaRecorder=null;
recordedChunks=[];

};

mediaRecorder.start(
250
);

voiceRecording=true;

voiceButton.classList.add(
"recording"
);

updateMyActivity(
"recording"
);

}catch(e){

console.error(
"Voice recording:",
e
);

voiceRecording=false;

voiceButton.classList.remove(
"recording"
);

safeAlert(
"تعذر الوصول إلى الميكروفون. تأكد من السماح بالميكروفون."
);

}

}

function stopVoiceRecording(){

if(
!mediaRecorder||
!voiceRecording
)
return;

try{

mediaRecorder.stop();

}catch(e){

console.error(
"Stop recording:",
e
);

voiceRecording=false;

voiceButton.classList.remove(
"recording"
);

}

}

voiceButton.addEventListener(
"pointerdown",
event=>{

event.preventDefault();

startVoiceRecording();

}
);

voiceButton.addEventListener(
"pointerup",
event=>{

event.preventDefault();

stopVoiceRecording();

}
);

voiceButton.addEventListener(
"pointercancel",
stopVoiceRecording
);

voiceButton.addEventListener(
"pointerleave",
()=>{

if(voiceRecording)
stopVoiceRecording();

}
);

){

)

?"ogg":
blob.type.includes("mp4")
?"mp4":
"webm";

storage,

);

storageRef,
blob,
{

blob.type||
"audio/webm"
}
);

await getDownloadURL(

);

collection(

chatID,

),

senderId:
currentUser.uid,

friendUser.uid,

),
{

lastMessageAt:
serverTimestamp(),
lastSenderId:
currentUser.uid
},

}
);

);

);

}

/* =========================================================
   RENDER MESSAGES
========================================================= */

const messageElements=
new Map();

function renderMessages(
snapshot
){

const nearBottom=
messages.scrollHeight-
messages.scrollTop-
messages.clientHeight<120;

snapshot.docChanges()
.forEach(
change=>{

const id=
change.doc.id;

const data=
change.doc.data();

if(change.type==="removed"){

messageElements
.get(id)
?.remove();

messageElements.delete(id);

return;

}

if(
Array.isArray(data.deletedFor)&&
data.deletedFor.includes(
currentUser.uid
)
){

return;

}

if(
data.senderId!==currentUser.uid
){

markRead(
id,
data
);

}

const box=
document.createElement("div");

box.className=
"message "+
(
data.senderId===currentUser.uid
?"mine"
:"other"
);

if(data.type==="call"){

createCallMessage(
box,
data
);

}else if(data.type==="voice"){

createVoiceMessage(
box,
data
);

}else{

box.appendChild(
document.createTextNode(
data.text||""
)
);

}

const meta=
document.createElement("div");

meta.className=
"message-meta";

const time=
document.createElement("span");

time.className="time";

time.textContent=
formatTime(
data.createdAt
);

meta.appendChild(
time
);

const status=
createStatus(
data
);

if(status){

meta.appendChild(
status
);

}

box.appendChild(
meta
);

if(
data.type!=="call"
){

addMessageActions(
box,
id,
data.senderId===
currentUser.uid
);

}

const old=
messageElements.get(id);

if(old){

old.replaceWith(
box
);

}else{

messages.appendChild(
box
);

}

messageElements.set(
id,
box
);

}
);

const all=
messages.querySelectorAll(
".message"
);

const empty=
messages.querySelector(
".empty"
);

if(all.length){

empty?.remove();

}else if(!empty){

const element=
document.createElement(
"div"
);

element.className="empty";

element.innerHTML=
"💬<br>ابدأ المحادثة الآن";

messages.appendChild(
element
);

}

if(nearBottom){

requestAnimationFrame(
()=>{
messages.scrollTop=
messages.scrollHeight;
}
);

}

}

/* =========================================================
   PEER CONNECTION
========================================================= */

function createPeer(){

const pc=
new RTCPeerConnection(
rtcConfig
);

pc.onicecandidate=
async event=>{

if(
!event.candidate||
!activeCallId||
!currentUser
)
return;

try{

await addDoc(
collection(
db,
"calls",
activeCallId,
"candidates"
),
{
senderId:
currentUser.uid,
candidate:
event.candidate.toJSON(),
createdAt:
serverTimestamp()
}
);

}catch(error){

console.error(
"ICE save:",
error
);

}

};

pc.ontrack=
event=>{

if(
event.streams&&
event.streams[0]
){

attachRemoteStream(
event.streams[0]
);

}

};

pc.onconnectionstatechange=
()=>{

if(pc!==peerConnection)
return;

const state=
pc.connectionState;

console.log(
"RTC:",
state
);

if(state==="connected"){

stopOutgoingTimeout();

stopRingtone();

callState.textContent=
activeCallType==="video"
?"متصل • فيديو"
:"متصل";

showConnectedButtons();

startCallTimer();

playRemoteAudio();

}

if(state==="connecting"){

callState.textContent=
"جارٍ الاتصال...";

}

if(state==="disconnected"){

callState.textContent=
"انقطع الاتصال...";

}

if(state==="failed"){

callState.textContent=
"تعذر الاتصال";

}

};

pc.oniceconnectionstatechange=
()=>{

if(pc!==peerConnection)
return;

if(
pc.iceConnectionState==="failed"
){

try{

pc.restartIce();

}catch{}

}

};

return pc;

}

/* =========================================================
   CALLER LISTENER
========================================================= */

function listenCallerCall(){

if(!activeCallId)
return;

if(unsubscribeActiveCall)
unsubscribeActiveCall();

const callId=
activeCallId;

unsubscribeActiveCall=
onSnapshot(
doc(
db,
"calls",
callId
),
async snap=>{

if(activeCallId!==callId)
return;

if(!snap.exists()){

cleanupCall();

return;

}

const data=
snap.data();

if(
data.status==="cancelled"||
data.status==="rejected"||
data.status==="missed"
){

stopRingtone();

await saveCallMessage(
data.status,
Number(data.duration||0),
callId,
data.callType||activeCallType
);

cleanupCall();

return;

}

if(
data.status==="ended"
){

stopRingtone();

cleanupCall();

return;

}

if(
data.answer&&
peerConnection&&
!peerConnection.currentRemoteDescription
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

await flushIce();

}catch(e){

console.error(
"Answer:",
e
);

}

}

if(
data.status==="ringing"
){

callState.textContent=
data.receivedAt
?"يرن..."
:"جارٍ الاتصال...";

}

if(
data.status==="connected"
){

stopRingtone();

stopOutgoingTimeout();

callState.textContent=
data.callType==="video"
?"متصل • فيديو"
:"متصل";

showConnectedButtons();

startCallTimer();

playRemoteAudio();

}

if(
data.callType==="video"&&
activeCallType!=="video"
){

activeCallType="video";

setupCallVisuals();

}

if(
data.upgradeOffer&&
Number(data.upgradeVersion||0)>
lastHandledUpgradeVersion
){

await handleUpgradeOffer(
data
);

}

if(
data.upgradeAnswer&&
peerConnection&&
Number(data.upgradeAnswerVersion||0)>
lastHandledUpgradeVersion
){

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.upgradeAnswer
)
);

lastHandledUpgradeVersion=
Number(
data.upgradeAnswerVersion
);

await flushIce();

}catch(e){

console.error(
"Upgrade answer:",
e
);

}

}

}
);

}


/* =========================================================
   INCOMING CALLS
========================================================= */

function listenIncomingCalls(){

if(
!currentUser
)
return;

if(unsubscribeIncomingCalls)
unsubscribeIncomingCalls();

const q=
query(
collection(db,"calls"),
where(
"receiverId",
"==",
currentUser.uid
)
);

unsubscribeIncomingCalls=
onSnapshot(
q,
async snapshot=>{

for(
const change of snapshot.docChanges()
){

if(
change.type!=="added"&&
change.type!=="modified"
)
continue;

const id=
change.doc.id;

const data=
change.doc.data();

if(
data.receiverId!==currentUser.uid||
data.status!=="ringing"||
!data.offer
)
continue;

if(
activeCallId===id||
activeCallId
)
continue;

if(
handledIncomingCalls.has(id)
)
continue;

const created=
data.createdAt?.toMillis?.()||0;

if(
created&&
Date.now()-created>30000
){

try{

await updateDoc(
doc(db,"calls",id),
{
status:"missed",
duration:0,
endedAt:
serverTimestamp()
}
);

}catch(e){

console.error(e);

}

continue;

}

handledIncomingCalls.add(id);

const callerSnap=
await getDoc(
doc(
db,
"users",
data.callerId
)
);

const callerData=
callerSnap.exists()
?callerSnap.data()
:{};

activeCallId=id;

activeCallType=
data.callType==="video"
?"video"
:"audio";

activeCallRole="receiver";

activeCallPeer={
uid:data.callerId,
name:
callerData.name||
"مستخدم Mecd",
photo:
callerData.photo||
callerData.photoURL||
""
};

callSeconds=0;
callMessageSaved=false;

pendingIceCandidates=[];

upgradeVersion=0;
lastHandledUpgradeVersion=0;

showIncoming();

playReceiverRing();

listenReceiverCallStatus();

listenCallCandidates();

}

}
);

}

);

/* =========================================================
   HANDLE VIDEO UPGRADE
========================================================= */

async function handleUpgradeOffer(
data
){

if(
!peerConnection||
!activeCallId||
!data.upgradeOffer
)
return;

const version=
Number(
data.upgradeVersion||0
);

if(
version<=lastHandledUpgradeVersion
)
return;

try{

await peerConnection.setRemoteDescription(
new RTCSessionDescription(
data.upgradeOffer
)
);

await flushIce();

if(!localStream){

localStream=
await navigator.mediaDevices.getUserMedia(
{
audio:true,
video:{
facingMode:"user"
}
}
);

localStream
.getTracks()
.forEach(
track=>{
peerConnection.addTrack(
track,
localStream
);
}
);

}else if(
!localStream.getVideoTracks().length
){

const camera=
await navigator.mediaDevices.getUserMedia(
{
video:{
facingMode:"user"
}
}
);

const track=
camera.getVideoTracks()[0];

const sender=
peerConnection
.getSenders()
.find(
item=>
item.track?.kind==="video"
);

if(sender){

await sender.replaceTrack(
track
);

}else{

peerConnection.addTrack(
track,
localStream
);

}

localStream.addTrack(
track
);

}

activeCallType="video";

lastHandledUpgradeVersion=
version;

localVideo.srcObject=
localStream;

localVideo.style.display=
"block";

setupCallVisuals();

const answer=
await peerConnection.createAnswer(
{
offerToReceiveAudio:true,
offerToReceiveVideo:true
}
);

await peerConnection.setLocalDescription(
answer
);

await updateDoc(
doc(
db,
"calls",
activeCallId
),
{
callType:"video",
upgradeAnswer:{
type:answer.type,
sdp:answer.sdp
},
upgradeAnswerVersion:
version
}
);

callState.textContent=
"متصل • فيديو";

showConnectedButtons();

}catch(e){

console.error(
"Upgrade:",
e
);

callState.textContent=
"تعذر تشغيل الفيديو";

}

}


/* =========================================================
   SAVE CALL MESSAGE
========================================================= */

async function saveCallMessage(
status,
duration,
forcedCallId=null,
forcedCallType=null
){

const callId=
forcedCallId||
activeCallId;

if(!callId)
return;

if(
!forcedCallId&&
callMessageSaved
)
return;

if(!forcedCallId)
callMessageSaved=true;

let callerId;
let receiverId;

if(
activeCallRole==="caller"&&
activeCallPeer
){

callerId=
currentUser.uid;

receiverId=
activeCallPeer.uid;

}else if(
activeCallRole==="receiver"&&
activeCallPeer
){

callerId=
activeCallPeer.uid;

receiverId=
currentUser.uid;

}else{

return;

}

const targetChat=
createChatID(
callerId,
receiverId
);

try{

await setDoc(
doc(
db,
"chats",
targetChat,
"messages",
"call_"+callId
),
{
type:"call",
callId,
callType:
forcedCallType||
activeCallType||
"audio",
callerId,
receiverId,
callStatus:status,
duration:
Number(duration||0),
senderId:callerId,
read:false,
createdAt:
serverTimestamp()
},
{
merge:true
}
);

}catch(e){

console.error(
"Call message:",
e
);

}

}


/* =========================================================
   FINISH CALL
========================================================= */

async function finishCall(
status=null
){

const id=
activeCallId;

stopRingtone();

if(!id){

cleanupCall();

return;

}

const duration=
callSeconds;

const finalStatus=
status||
(
duration>0
?"completed"
:"missed"
);

const type=
activeCallType||
"audio";

try{

await updateDoc(
doc(
db,
"calls",
id
),
{
status:
finalStatus==="completed"
?"ended"
:finalStatus,
duration,
callType:type,
endedAt:
serverTimestamp()
}
);

}catch(e){

console.error(
"Finish:",
e
);

}

await saveCallMessage(
finalStatus,
duration,
id,
type
);

cleanupCall();

}


/* =========================================================
   CLEANUP
========================================================= */

function cleanupCall(){

stopRingtone();

stopCallTimer();

stopOutgoingTimeout();

if(unsubscribeActiveCall){

try{
unsubscribeActiveCall();
}catch{}

unsubscribeActiveCall=null;

}

if(unsubscribeCandidates){

try{
unsubscribeCandidates();
}catch{}

unsubscribeCandidates=null;

}

if(localStream){

localStream
.getTracks()
.forEach(
track=>{
try{
track.stop();
}catch{}
}
);

localStream=null;

}

if(peerConnection){

try{
peerConnection.ontrack=null;
peerConnection.onicecandidate=null;
peerConnection.close();
}catch{}

peerConnection=null;

}

pendingIceCandidates=[];

try{

remoteAudio.pause();
remoteAudio.srcObject=null;

}catch{}

try{

remoteVideo.pause();
remoteVideo.srcObject=null;

}catch{}

try{

localVideo.pause();
localVideo.srcObject=null;

}

return;

if(
document.visibilityState==="visible"
){

updateMyPresence(true);

if(activeCallId){

playRemoteAudio();

}

}else if(
!activeCallId
){

updateMyPresence(false);

updateMyActivity(
"none"
);

}

}
);


/* =========================================================
   PAGE HIDE
========================================================= */

window.addEventListener(
"pagehide",
()=>{

if(!currentUser)
return;

updateMyPresence(false);

}
);


/* =========================================================
   INIT
========================================================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

loading.textContent=
"يجب تسجيل الدخول أولاً";

return;

}

currentUser=user;

try{

startPresence();

await loadFriend();

listenMessages();

listenIncomingCalls();

showApp();

}catch(e){

console.error(
"INIT:",
e
);

loading.textContent=
e.message||
"حدث خطأ";

}

});


console.log(
"🔥 Mecd Chat - Fixed WebRTC + Voice + Ringtone"
);

</script>

</body>
</html>
