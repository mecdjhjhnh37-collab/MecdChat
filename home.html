<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}


.container{

width:90%;
max-width:500px;

margin:auto;

padding:40px 0;

}


.profile{

text-align:center;

margin-bottom:40px;

}


.avatar{

width:100px;
height:100px;

margin:auto;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:50px;

background:rgba(0,255,145,.12);

border:1px solid rgba(0,255,145,.25);

}


h1{

margin-top:20px;

font-size:36px;

}


.id{

color:#00e889;

margin-top:10px;

font-size:18px;

}


.card{

padding:20px;

margin-bottom:15px;

border-radius:22px;

background:rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

cursor:pointer;

}


.card:hover{

background:rgba(0,120,80,.7);

}


</style>

</head>


<body>


<div class="container">


<div class="profile">

<div class="avatar">
👤
</div>

<h1>
Mecd Chat
</h1>

<div class="id">
ID: 000001
</div>

</div>



<div class="card">
👥 الأصدقاء
</div>


<div class="card">
➕ إنشاء غرفة دردشة
</div>


<div class="card">
🔑 دخول دردشة عبر ID
</div>


<div class="card">
⚙️ الإعدادات
</div>



</div>


</body>

</html>
