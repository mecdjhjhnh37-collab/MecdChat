<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>غرفة الدردشة - Mecd Chat</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  color:white;

  background:
    radial-gradient(
      circle at 50% 0%,
      #123d35 0%,
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #07110f 0%,
      #020504 100%
    );
}

button,
input,
textarea{
  font-family:inherit;
}


/* =========================
   التطبيق
========================= */

.app{
  width:100%;
  max-width:700px;
  min-height:100vh;

  margin:auto;

  display:flex;
  flex-direction:column;
}


/* =========================
   الهيدر
========================= */

header{
  position:sticky;
  top:0;

  z-index:20;

  min-height:78px;

  padding:14px 16px;

  display:flex;
  align-items:center;

  gap:12px;

  background:
    rgba(5,16,14,.94);

  backdrop-filter:
    blur(16px);

  border-bottom:
    1px solid
    rgba(255,255,255,.07);
}


.back{
  width:45px;
  height:45px;

  flex:none;

  border:0;
  border-radius:14px;

  background:
    rgba(255,255,255,.06);

  color:white;

  font-size:23px;

  cursor:pointer;
}


.back:active{
  transform:scale(.95);
}


.logo{
  width:47px;
  height:47px;

  flex:none;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #00e676,
      #00a85a
    );

  font-size:25px;
}


.header-info{
  min-width:0;
  flex:1;
}


.room-name{
  font-size:18px;
  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.room-code{
  margin-top:4px;

  color:#00e889;

  font-size:12px;
}


.members-button{
  min-width:45px;
  height:45px;

  padding:0 10px;

  border:0;
  border-radius:14px;

  background:
    rgba(255,255,255,.06);

  color:white;

  font-size:18px;

  cursor:pointer;
}


/* =========================
   معلومات الغرفة
========================= */

.room-info{
  margin:16px;

  padding:16px;

  border-radius:20px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  text-align:center;
}


.room-info-title{
  color:#cbd5d1;

  font-size:13px;
}


.room-info-code{
  margin-top:7px;

  color:#00e889;

  font-size:21px;

  font-weight:bold;

  letter-spacing:2px;
}


.owner{
  margin-top:7px;

  color:#7f8d88;

  font-size:12px;
}


/* =========================
   الرسائل
========================= */

.messages{
  flex:1;

  padding:
    8px
    16px
    125px;

  overflow-y:auto;

  scroll-behavior:smooth;
}


.empty{
  min-height:45vh;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;

  color:#74817c;
}


.empty-icon{
  font-size:48px;

  margin-bottom:12px;
}


.empty-title{
  color:#b7c2be;

  font-size:18px;

  margin-bottom:6px;
}


.empty-text{
  font-size:13px;
}


/* =========================
   الرسالة
========================= */

.message-row{
  display:flex;

  margin:8px 0;
}


.message-row.mine{
  justify-content:flex-start;
}


.message-row.other{
  justify-content:flex-end;
}


.message{
  max-width:82%;

  padding:10px 13px;

  border-radius:18px;

  background:#101b18;

  border:
    1px solid
    rgba(255,255,255,.06);
}


.message-row.mine .message{
  background:#006b49;

  border-bottom-left-radius:6px;
}


.message-row.other .message{
  border-bottom-right-radius:6px;
}


.message-name{
  margin-bottom:4px;

  color:#8debc4;

  font-size:11px;

  font-weight:bold;
}


.message-row.mine .message-name{
  color:#d6fff0;
}


.message-text{
  white-space:pre-wrap;

  word-break:break-word;

  line-height:1.55;

  font-size:15px;
}


.message-time{
  margin-top:5px;

  color:
    rgba(255,255,255,.5);

  font-size:9px;
}


/* =========================
   منطقة الكتابة
========================= */

.composer{
  position:fixed;

  right:0;
  bottom:0;
  left:0;

  z-index:30;

  display:flex;

  justify-content:center;

  padding:
    10px
    12px
    14px;

  background:
    linear-gradient(
      180deg,
      rgba(2,5,4,0),
      rgba(2,5,4,.96) 35%
    );
}


.composer-inner{
  width:100%;

  max-width:700px;

  display:flex;

  align-items:flex-end;

  gap:8px;
}


.message-input{
  flex:1;

  min-height:52px;
  max-height:130px;

  padding:
    15px
    16px;

  resize:none;

  border:
    1px solid
    rgba(255,255,255,.1);

  border-radius:18px;

  outline:none;

  background:#111916;

  color:white;

  font-size:15px;

  line-height:1.4;
}


.message-input::placeholder{
  color:#69746f;
}


.message-input:focus{
  border-color:#00e676;

  box-shadow:
    0 0 0 2px
    rgba(0,230,118,.1);
}


.send{
  width:52px;
  height:52px;

  flex:none;

  border:0;

  border-radius:17px;

  background:#00e889;

  color:#00150e;

  font-size:21px;

  font-weight:bold;

  cursor:pointer;
}


.send:active{
  transform:scale(.96);
}


.send:disabled{
  opacity:.45;

  cursor:not-allowed;
}


/* =========================
   شاشة التحميل والخطأ
========================= */

.center-screen{
  min-height:100vh;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:25px;
}


.panel{
  width:100%;

  max-width:420px;

  padding:30px 22px;

  border-radius:25px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.08);

  text-align:center;
}


.panel-icon{
  font-size:45px;

  margin-bottom:14px;
}


.panel h1{
  font-size:23px;

  margin-bottom:9px;
}


.panel p{
  color:#899692;

  line-height:1.7;

  font-size:14px;
}


.panel-button{
  width:100%;

  height:52px;

  margin-top:20px;

  border:0;

  border-radius:16px;

  background:#00e889;

  color:#00150e;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;
}


.spinner{
  display:inline-block;

  width:17px;
  height:17px;

  margin-left:7px;

  vertical-align:middle;

  border:
    2px solid
    rgba(255,255,255,.2);

  border-top-color:#00e889;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}


@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


.hidden{
  display:none !important;
}


/* =========================
   الموبايل
========================= */

@media(max-width:480px){

  .room-info{
    margin:12px;
  }

  .messages{
    padding-right:12px;
    padding-left:12px;
  }

  .message{
    max-width:88%;
  }

}

</style>

</head>


<body>


<!-- =================================
     شاشة التحميل
================================= -->

<div
  id="statusScreen"
  class="center-screen"
>

<div class="panel">

<div
  id="statusIcon"
  class="panel-icon"
>
💬
</div>


<h1 id="statusTitle">

<span class="spinner"></span>

جاري فتح الغرفة...

</h1>


<p id="statusText">

لحظة واحدة...

</p>


<button
  id="statusButton"
  class="panel-button hidden"
  type="button"
>

العودة

</button>

</div>

</div>



<!-- =================================
     التطبيق
================================= -->

<div
  id="app"
  class="app hidden"
>


<!-- =================================
     Header
================================= -->

<header>


<button
  id="backButton"
  class="back"
  type="button"
>
←
</button>


<div class="logo">
💬
</div>


<div class="header-info">


<div
  id="roomName"
  class="room-name"
>
غرفة الدردشة
</div>


<div
  id="roomCode"
  class="room-code"
>
...
</div>


</div>


<button
  id="membersButton"
  class="members-button"
  type="button"
  title="الأعضاء"
>
👥
</button>


</header>



<!-- =================================
     معلومات الغرفة
================================= -->

<section class="room-info">


<div class="room-info-title">

رمز الغرفة

</div>


<div
  id="roomInfoCode"
  class="room-info-code"
>

------

</div>


<div
  id="ownerText"
  class="owner"
>

جاري تحميل معلومات الغرفة...

</div>


</section>



<!-- =================================
     الرسائل
================================= -->

<main
  id="messages"
  class="messages"
>


<div
  id="empty"
  class="empty"
>


<div class="empty-icon">
💬
</div>


<div class="empty-title">
لا توجد رسائل بعد
</div>


<div class="empty-text">
ابدأ المحادثة مع أعضاء الغرفة.
</div>


</div>


</main>



<!-- =================================
     كتابة الرسالة
================================= -->

<div class="composer">


<div class="composer-inner">


<textarea
  id="messageInput"
  class="message-input"
  rows="1"
  maxlength="2000"
  placeholder="اكتب رسالة..."
></textarea>


<button
  id="sendButton"
  class="send"
  type="button"
  title="إرسال"
>
➤
</button>


</div>


</div>


</div>



<script type="module">


/* =====================================
   Firebase
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp,
  updateDoc,
  arrayUnion
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =====================================
   Firebase Config
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

  authDomain:
    "mecd-tools.firebaseapp.com",

  projectId:
    "mecd-tools",

  storageBucket:
    "mecd-tools.firebasestorage.app",

  messagingSenderId:
    "643005547408",

  appId:
    "1:643005547408:web:b1719060ec340dd0e0a915",

  measurementId:
    "G-0VKYR3TQV2"

};


const firebaseApp =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    firebaseApp
  );


const db =
  getFirestore(
    firebaseApp
  );



/* =====================================
   العناصر
===================================== */

const statusScreen =
  document.getElementById(
    "statusScreen"
  );


const statusIcon =
  document.getElementById(
    "statusIcon"
  );


const statusTitle =
  document.getElementById(
    "statusTitle"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const statusButton =
  document.getElementById(
    "statusButton"
  );


const app =
  document.getElementById(
    "app"
  );


const roomNameElement =
  document.getElementById(
    "roomName"
  );


const roomCodeElement =
  document.getElementById(
    "roomCode"
  );


const roomInfoCode =
  document.getElementById(
    "roomInfoCode"
  );


const ownerText =
  document.getElementById(
    "ownerText"
  );


const messagesElement =
  document.getElementById(
    "messages"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


const membersButton =
  document.getElementById(
    "membersButton"
  );



/* =====================================
   بيانات الرابط
===================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const roomId =
  params.get(
    "roomId"
  );


const urlCode =
  params.get(
    "code"
  );



/* =====================================
   المتغيرات
===================================== */

let currentUser =
  null;


let currentRoom =
  null;


let unsubscribeMessages =
  null;


let joinedRoom =
  false;



/* =====================================
   شاشة الحالة
===================================== */

function showStatus(
  icon,
  title,
  text,
  showButton = false
){

  statusIcon.textContent =
    icon;


  statusTitle.textContent =
    title;


  statusText.textContent =
    text;


  statusButton.classList.toggle(
    "hidden",
    !showButton
  );


  statusScreen.classList.remove(
    "hidden"
  );


  app.classList.add(
    "hidden"
  );

}



/* =====================================
   إظهار التطبيق
===================================== */

function showApp(){

  statusScreen.classList.add(
    "hidden"
  );


  app.classList.remove(
    "hidden"
  );

}



/* =====================================
   الوقت
===================================== */

function formatTime(
  timestamp
){

  if(!timestamp){
    return "";
  }


  const date =
    timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);


  return date.toLocaleTimeString(
    "ar",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}



/* =====================================
   عرض رسالة
===================================== */

function renderMessage(
  message
){

  const row =
    document.createElement(
      "div"
    );


  const mine =
    message.userId ===
    currentUser.uid;


  row.className =
    "message-row " +
    (
      mine
        ? "mine"
        : "other"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "message";


  const name =
    document.createElement(
      "div"
    );


  name.className =
    "message-name";


  name.textContent =
    mine
      ? "أنت"
      : (
          message.userName ||
          "مستخدم Mecd"
        );


  const text =
    document.createElement(
      "div"
    );


  text.className =
    "message-text";


  text.textContent =
    message.text ||
    "";


  const time =
    document.createElement(
      "div"
    );


  time.className =
    "message-time";


  time.textContent =
    formatTime(
      message.createdAt
    );


  bubble.appendChild(
    name
  );


  bubble.appendChild(
    text
  );


  bubble.appendChild(
    time
  );


  row.appendChild(
    bubble
  );


  messagesElement.appendChild(
    row
  );

}



/* =====================================
   الاستماع للرسائل
===================================== */

function listenToMessages(){

  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  const messagesRef =
    collection(
      db,
      "rooms",
      roomId,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      (snapshot) => {

        messagesElement.innerHTML =
          "";


        if(snapshot.empty){

          const empty =
            document.createElement(
              "div"
            );


          empty.className =
            "empty";


          empty.innerHTML = `
            <div class="empty-icon">💬</div>
            <div class="empty-title">لا توجد رسائل بعد</div>
            <div class="empty-text">ابدأ المحادثة مع أعضاء الغرفة.</div>
          `;


          messagesElement.appendChild(
            empty
          );


          return;

        }


        snapshot.forEach(
          (messageDoc) => {

            renderMessage(
              {
                id:
                  messageDoc.id,

                ...messageDoc.data()

              }
            );

          }
        );


        requestAnimationFrame(
          () => {

            messagesElement.scrollTop =
              messagesElement.scrollHeight;

          }
        );

      },

      (error) => {

        console.error(
          "Messages listener error:",
          error
        );

      }

    );

}



/* =====================================
   إضافة المستخدم للغرفة
===================================== */

async function joinRoom(){

  if(joinedRoom){

    return;

  }


  joinedRoom =
    true;


  try{

    const roomRef =
      doc(
        db,
        "rooms",
        roomId
      );


    await updateDoc(
      roomRef,
      {
        members:
          arrayUnion(
            currentUser.uid
          )
      }
    );


  }catch(error){

    console.warn(
      "Members update error:",
      error
    );

  }

}



/* =====================================
   تحميل الغرفة
===================================== */

async function loadRoom(){

  if(!roomId){

    showStatus(
      "⚠️",
      "تعذر فتح الغرفة",
      "رابط الغرفة غير صحيح.",
      true
    );

    return;

  }


  try{

    const roomRef =
      doc(
        db,
        "rooms",
        roomId
      );


    const roomSnapshot =
      await getDoc(
        roomRef
      );


    if(!roomSnapshot.exists()){

      showStatus(
        "⚠️",
        "الغرفة غير موجودة",
        "ربما تم حذف الغرفة أو أن الرابط غير صحيح.",
        true
      );

      return;

    }


    const room =
      roomSnapshot.data();


    /* =================================
       التأكد من الكود
    ================================= */

    if(
      urlCode &&
      room.code &&
      urlCode !== room.code
    ){

      showStatus(
        "🔒",
        "رمز الغرفة غير صحيح",
        "لا يمكن فتح هذه الغرفة بهذا الرابط.",
        true
      );

      return;

    }


    currentRoom =
      room;


    /* =================================
       معلومات الغرفة
    ================================= */

    roomNameElement.textContent =
      room.name ||
      "غرفة الدردشة";


    roomCodeElement.textContent =
      "ID: " +
      (
        room.code ||
        "------"
      );


    roomInfoCode.textContent =
      room.code ||
      "------";


    ownerText.textContent =
      "أنشأها: " +
      (
        room.ownerName ||
        "مستخدم Mecd"
      );


    /* =================================
       إضافة العضو
    ================================= */

    await joinRoom();


    /* =================================
       فتح الصفحة
    ================================= */

    showApp();


    listenToMessages();

  }
  catch(error){

    console.error(
      "Load room error:",
      error
    );


    showStatus(
      "⚠️",
      "تعذر فتح الغرفة",
      "حدث خطأ أثناء الاتصال بـ Firebase. حاول مرة أخرى.",
      true
    );

  }

}



/* =====================================
   إرسال رسالة
===================================== */

async function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){

    return;

  }


  if(!currentUser){

    return;

  }


  if(!roomId){

    return;

  }


  sendButton.disabled =
    true;


  try{

    await addDoc(

      collection(
        db,
        "rooms",
        roomId,
        "messages"
      ),

      {

        text:
          text,

        userId:
          currentUser.uid,

        userName:
          currentUser.displayName ||
          "مستخدم Mecd",

        userPhoto:
          currentUser.photoURL ||
          "",

        createdAt:
          serverTimestamp()

      }

    );


    messageInput.value =
      "";


    resizeInput();


  }
  catch(error){

    console.error(
      "Send message error:",
      error
    );


    alert(
      "تعذر إرسال الرسالة. تأكد من صلاحيات Firestore."
    );

  }
  finally{

    sendButton.disabled =
      false;


    messageInput.focus();

  }

}



/* =====================================
   تغيير حجم الكتابة
===================================== */

function resizeInput(){

  messageInput.style.height =
    "auto";


  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      130
    ) +
    "px";

}



/* =====================================
   زر الإرسال
===================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);



/* =====================================
   الكتابة
===================================== */

messageInput.addEventListener(
  "input",
  resizeInput
);


messageInput.addEventListener(
  "keydown",
  (event) => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);



/* =====================================
   الرجوع
===================================== */

backButton.addEventListener(
  "click",
  () => {

    if(
      unsubscribeMessages
    ){

      unsubscribeMessages();

    }


    history.back();

  }
);



/* =====================================
   الأعضاء
===================================== */

membersButton.addEventListener(
  "click",
  () => {

    if(!currentRoom){

      return;

    }


    const members =
      Array.isArray(
        currentRoom.members
      )
        ? currentRoom.members.length
        : 1;


    alert(
      "عدد أعضاء الغرفة: " +
      members
    );

  }
);



/* =====================================
   زر العودة من الخطأ
===================================== */

statusButton.addEventListener(
  "click",
  () => {

    history.back();

  }
);



/* =====================================
   تسجيل الدخول
===================================== */

onAuthStateChanged(

  auth,

  async (user) => {

    if(!user){

      currentUser =
        null;


      showStatus(
        "🔐",
        "يجب تسجيل الدخول",
        "سجّل الدخول إلى Mecd Tools أولاً.",
        true
      );


      return;

    }


    currentUser =
      user;


    await loadRoom();

  }

);

</script>
