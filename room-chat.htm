<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>الغرفة - Mecd Chat</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  font-family:
    Arial,
    Tahoma,
    sans-serif;

  color:white;

  background:
    radial-gradient(
      circle at 50% 0%,
      #123d35 0%,
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #07110f 0%,
      #020504 100%
    );

}


/* =========================
   التطبيق
========================= */

.app{

  width:100%;

  max-width:700px;

  height:100vh;

  margin:auto;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


/* =========================
   الهيدر
========================= */

header{

  flex-shrink:0;

  height:78px;

  padding:
    12px
    16px;

  display:flex;

  align-items:center;

  gap:12px;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(4,10,8,.85);

  backdrop-filter:
    blur(15px);

}


.back{

  width:44px;

  height:44px;

  flex-shrink:0;

  border:0;

  border-radius:14px;

  background:
    rgba(255,255,255,.06);

  color:white;

  font-size:22px;

  cursor:pointer;

}


.back:active{

  transform:scale(.94);

}


.room-icon{

  width:46px;

  height:46px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #00e676,
      #00a85a
    );

  font-size:23px;

}


.room-info{

  min-width:0;

  flex:1;

}


.room-name{

  font-size:17px;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.room-code{

  direction:ltr;

  text-align:right;

  margin-top:4px;

  color:#00e676;

  font-size:11px;

  letter-spacing:1px;

}


.online{

  display:flex;

  align-items:center;

  gap:6px;

  padding:
    7px
    10px;

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius:20px;

  color:#91a09b;

  font-size:11px;

}


.online-dot{

  width:7px;

  height:7px;

  border-radius:50%;

  background:#00e676;

  box-shadow:
    0 0 8px
    #00e676;

}


/* =========================
   الرسائل
========================= */

.messages{

  flex:1;

  overflow-y:auto;

  padding:
    20px
    15px
    25px;

  display:flex;

  flex-direction:column;

  gap:10px;

  scroll-behavior:smooth;

}


.messages::-webkit-scrollbar{

  width:5px;

}


.messages::-webkit-scrollbar-thumb{

  background:
    rgba(255,255,255,.1);

  border-radius:10px;

}


/* =========================
   رسالة النظام
========================= */

.system-message{

  align-self:center;

  max-width:90%;

  margin:
    8px
    auto
    15px;

  padding:
    9px
    14px;

  border-radius:15px;

  background:
    rgba(255,255,255,.04);

  color:#71807b;

  font-size:11px;

  text-align:center;

  line-height:1.6;

}


/* =========================
   الرسالة
========================= */

.message{

  max-width:78%;

  padding:
    10px
    13px;

  border-radius:18px;

  position:relative;

  animation:
    messageIn
    .2s
    ease;

}


@keyframes messageIn{

  from{

    opacity:0;

    transform:
      translateY(6px);

  }

  to{

    opacity:1;

    transform:
      translateY(0);

  }

}


.message.mine{

  align-self:flex-start;

  background:
    linear-gradient(
      135deg,
      #00a85a,
      #007d48
    );

  border-bottom-left-radius:5px;

}


.message.other{

  align-self:flex-end;

  background:
    rgba(255,255,255,.075);

  border:
    1px solid
    rgba(255,255,255,.06);

  border-bottom-right-radius:5px;

}


.sender{

  margin-bottom:5px;

  color:#00e676;

  font-size:11px;

  font-weight:bold;

}


.mine .sender{

  color:#d8ffe9;

}


.message-text{

  color:white;

  font-size:14px;

  line-height:1.6;

  word-break:break-word;

}


.message-time{

  margin-top:5px;

  color:
    rgba(255,255,255,.5);

  font-size:9px;

}


/* =========================
   إدخال الرسالة
========================= */

.input-area{

  flex-shrink:0;

  padding:
    10px
    12px
    14px;

  display:flex;

  align-items:center;

  gap:8px;

  border-top:
    1px solid
    rgba(255,255,255,.07);

  background:
    rgba(4,10,8,.92);

  backdrop-filter:
    blur(15px);

}


.message-input{

  flex:1;

  min-width:0;

  height:50px;

  padding:
    0
    16px;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:17px;

  outline:none;

  background:
    #101815;

  color:white;

  font-family:inherit;

  font-size:15px;

}


.message-input::placeholder{

  color:#68746f;

}


.message-input:focus{

  border-color:#00e676;

  box-shadow:
    0 0 0 2px
    rgba(0,230,118,.08);

}


.send{

  width:50px;

  height:50px;

  flex-shrink:0;

  border:0;

  border-radius:17px;

  background:#00e889;

  color:#00150e;

  font-size:21px;

  cursor:pointer;

}


.send:active{

  transform:scale(.94);

}


.send:disabled{

  opacity:.4;

  cursor:not-allowed;

}


/* =========================
   شاشة التحميل
========================= */

.loading-screen{

  position:fixed;

  inset:0;

  z-index:100;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:18px;

  background:
    linear-gradient(
      180deg,
      #07110f,
      #020504
    );

}


.spinner{

  width:38px;

  height:38px;

  border:
    4px solid
    rgba(255,255,255,.12);

  border-top-color:
    #00e889;

  border-radius:50%;

  animation:
    spin
    .8s
    linear
    infinite;

}


@keyframes spin{

  to{

    transform:
      rotate(360deg);

  }

}


.loading-text{

  color:#9aaba4;

  font-size:14px;

}


/* =========================
   خطأ
========================= */

.error-screen{

  position:fixed;

  inset:0;

  z-index:101;

  display:none;

  align-items:center;

  justify-content:center;

  padding:25px;

  background:
    #020504;

}


.error-card{

  width:100%;

  max-width:430px;

  padding:28px;

  border-radius:25px;

  text-align:center;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.08);

}


.error-icon{

  font-size:45px;

  margin-bottom:18px;

}


.error-card h2{

  margin-bottom:10px;

}


.error-card p{

  color:#8f9b97;

  font-size:13px;

  line-height:1.7;

  margin-bottom:20px;

}


.error-back{

  width:100%;

  height:50px;

  border:0;

  border-radius:15px;

  background:#00e889;

  color:#00150e;

  font-size:16px;

  font-weight:bold;

}


/* =========================
   الموبايل
========================= */

@media(max-width:480px){

  header{

    height:72px;

    padding:
      10px
      12px;

  }

  .back{

    width:42px;

    height:42px;

  }

  .room-icon{

    width:42px;

    height:42px;

  }

  .room-name{

    font-size:15px;

  }

  .online{

    padding:
      6px
      8px;

    font-size:9px;

  }

  .messages{

    padding:
      15px
      10px
      20px;

  }

  .message{

    max-width:85%;

  }

}

</style>

</head>


<body>


<!-- =========================
     شاشة التحميل
========================= -->

<div
  id="loadingScreen"
  class="loading-screen"
>

<div class="spinner"></div>

<div class="loading-text">
جاري فتح الغرفة...
</div>

</div>


<!-- =========================
     شاشة الخطأ
========================= -->

<div
  id="errorScreen"
  class="error-screen"
>

<div class="error-card">

<div class="error-icon">
⚠️
</div>

<h2>
تعذر فتح الغرفة
</h2>

<p
  id="errorText"
>
حدث خطأ أثناء تحميل الغرفة.
</p>

<button
  id="errorBack"
  class="error-back"
>
العودة
</button>

</div>

</div>


<!-- =========================
     التطبيق
========================= -->

<main
  id="app"
  class="app"
  style="display:none;"
>


<!-- =========================
     الهيدر
========================= -->

<header>

<button
  id="backButton"
  class="back"
  type="button"
>
→
</button>


<div class="room-icon">
🏠
</div>


<div class="room-info">

<div
  id="roomName"
  class="room-name"
>
جاري التحميل...
</div>


<div
  id="roomCode"
  class="room-code"
>
ROOM
</div>

</div>


<div class="online">

<span class="online-dot"></span>

متصل

</div>

</header>


<!-- =========================
     الرسائل
========================= -->

<section
  id="messages"
  class="messages"
>

<div class="system-message">

🔒 هذه غرفة دردشة خاصة.

<br>

ابدأ بإرسال رسالة!

</div>

</section>


<!-- =========================
     إدخال الرسالة
========================= -->

<form
  id="messageForm"
  class="input-area"
>

<input
  id="messageInput"
  class="message-input"
  type="text"
  maxlength="1000"
  autocomplete="off"
  placeholder="اكتب رسالة..."
/>


<button
  id="sendButton"
  class="send"
  type="submit"
>
➤
</button>

</form>


</main>


<script type="module">


/* =====================================
   Firebase
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   Firebase Config
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

  authDomain:
    "mecd-tools.firebaseapp.com",

  projectId:
    "mecd-tools",

  storageBucket:
    "mecd-tools.firebasestorage.app",

  messagingSenderId:
    "643005547408",

  appId:
    "1:643005547408:web:b1719060ec340dd0e0a915",

  measurementId:
    "G-0VKYR3TQV2"

};


/* =====================================
   تشغيل Firebase
===================================== */

const firebaseApp =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    firebaseApp
  );


const db =
  getFirestore(
    firebaseApp
  );


/* =====================================
   العناصر
===================================== */

const loadingScreen =
  document.getElementById(
    "loadingScreen"
  );


const errorScreen =
  document.getElementById(
    "errorScreen"
  );


const errorText =
  document.getElementById(
    "errorText"
  );


const errorBack =
  document.getElementById(
    "errorBack"
  );


const app =
  document.getElementById(
    "app"
  );


const roomNameElement =
  document.getElementById(
    "roomName"
  );


const roomCodeElement =
  document.getElementById(
    "roomCode"
  );


const messagesElement =
  document.getElementById(
    "messages"
  );


const messageForm =
  document.getElementById(
    "messageForm"
  );


const messageInput =
  document.getElementById(
    "messageInput"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


/* =====================================
   معلومات الرابط
===================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const roomId =
  urlParams.get(
    "roomId"
  );


const roomCode =
  urlParams.get(
    "code"
  );


/* =====================================
   المستخدم
===================================== */

let currentUser = null;


/* =====================================
   معلومات الغرفة
===================================== */

let currentRoom = null;


/* =====================================
   مراقبة الرسائل
===================================== */

let unsubscribeMessages = null;


/* =====================================
   عرض الخطأ
===================================== */

function showError(message){

  loadingScreen.style.display =
    "none";

  app.style.display =
    "none";

  errorText.textContent =
    message;

  errorScreen.style.display =
    "flex";

}


/* =====================================
   إغلاق شاشة التحميل
===================================== */

function showApp(){

  loadingScreen.style.display =
    "none";

  errorScreen.style.display =
    "none";

  app.style.display =
    "flex";

}


/* =====================================
   الهروب من HTML
===================================== */

function escapeHTML(text){

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;

}


/* =====================================
   تنسيق الوقت
===================================== */

function formatTime(timestamp){

  if(!timestamp){
    return "";
  }


  try{

    const date =
      timestamp.toDate();


    return date.toLocaleTimeString(
      "ar",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }catch(error){

    return "";

  }

}


/* =====================================
   تحميل الغرفة
===================================== */

async function loadRoom(){

  if(!roomId){

    showError(
      "رابط الغرفة غير صحيح."
    );

    return;

  }


  try{

    const roomRef =
      doc(
        db,
        "rooms",
        roomId
      );


    const roomSnapshot =
      await getDoc(
        roomRef
      );


    if(!roomSnapshot.exists()){

      showError(
        "هذه الغرفة غير موجودة."
      );

      return;

    }


    const room =
      roomSnapshot.data();


    /* =================================
       التأكد من الكود
    ================================= */

    if(
      roomCode &&
      room.code !== roomCode
    ){

      showError(
        "بيانات الغرفة غير صحيحة."
      );

      return;

    }


    currentRoom = {

      id:
        roomSnapshot.id,

      ...room

    };


    /* =================================
       عرض معلومات الغرفة
    ================================= */

    roomNameElement.textContent =
      room.name ||
      "غرفة دردشة";


    roomCodeElement.textContent =
      "ID: " +
      (
        room.code ||
        "------"
      );


    showApp();


    /* =================================
       تشغيل الرسائل
    ================================= */

    listenToMessages();


    messageInput.focus();


  }catch(error){

    console.error(
      "Load room error:",
      error
    );


    showError(
      "تعذر تحميل الغرفة."
    );

  }

}


/* =====================================
   الاستماع للرسائل
===================================== */

function listenToMessages(){

  if(!currentRoom){
    return;
  }


  if(unsubscribeMessages){

    unsubscribeMessages();

  }


  const messagesRef =
    collection(
      db,
      "rooms",
      currentRoom.id,
      "messages"
    );


  const messagesQuery =
    query(
      messagesRef,
      orderBy(
        "createdAt",
        "asc"
      )
    );


  unsubscribeMessages =
    onSnapshot(

      messagesQuery,

      (snapshot) => {

        /*
         * نحافظ على رسالة النظام
         */

        messagesElement.innerHTML = `

          <div class="system-message">

            🔒 هذه غرفة دردشة خاصة.

            <br>

            ابدأ بالدردشة!

          </div>

        `;


        snapshot.forEach(
          (messageDoc) => {

            const message =
              messageDoc.data();


            addMessageToScreen(
              message
            );

          }
        );


        scrollToBottom();

      },

      (error) => {

        console.error(
          "Messages error:",
          error
        );

      }

    );

}


/* =====================================
   إضافة رسالة للشاشة
===================================== */

function addMessageToScreen(message){

  const isMine =
    currentUser &&
    message.senderId ===
    currentUser.uid;


  const messageElement =
    document.createElement(
      "div"
    );


  messageElement.className =
    "message " +
    (
      isMine
      ? "mine"
      : "other"
    );


  const sender =
    escapeHTML(
      message.senderName ||
      "مستخدم Mecd"
    );


  const text =
    escapeHTML(
      message.text ||
      ""
    );


  const time =
    formatTime(
      message.createdAt
    );


  messageElement.innerHTML = `

    <div class="sender">
      ${sender}
    </div>

    <div class="message-text">
      ${text}
    </div>

    ${
      time
      ?
      `<div class="message-time">${time}</div>`
      :
      ""
    }

  `;


  messagesElement.appendChild(
    messageElement
  );

}


/* =====================================
   النزول لآخر رسالة
===================================== */

function scrollToBottom(){

  requestAnimationFrame(
    () => {

      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }
  );

}


/* =====================================
   إرسال رسالة
===================================== */

async function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(!currentUser){
    return;
  }


  if(!currentRoom){
    return;
  }


  sendButton.disabled =
    true;


  messageInput.disabled =
    true;


  try{

    const messagesRef =
      collection(
        db,
        "rooms",
        currentRoom.id,
        "messages"
      );


    await addDoc(

      messagesRef,

      {

        text:
          text,

        senderId:
          currentUser.uid,

        senderName:
          currentUser.displayName ||
          "مستخدم Mecd",

        senderPhoto:
          currentUser.photoURL ||
          "",

        createdAt:
          serverTimestamp()

      }

    );


    messageInput.value =
      "";


    messageInput.focus();


  }catch(error){

    console.error(
      "Send message error:",
      error
    );


    alert(
      "تعذر إرسال الرسالة. حاول مرة أخرى."
    );

  }


  sendButton.disabled =
    false;

  messageInput.disabled =
    false;

}


/* =====================================
   إرسال النموذج
===================================== */

messageForm.addEventListener(

  "submit",

  (event) => {

    event.preventDefault();

    sendMessage();

  }

);


/* =====================================
   الرجوع
===================================== */

backButton.addEventListener(

  "click",

  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

    }


    history.back();

  }

);


/* =====================================
   زر الرجوع عند الخطأ
===================================== */

errorBack.addEventListener(

  "click",

  () => {

    history.back();

  }

);


/* =====================================
   فحص تسجيل الدخول
===================================== */

onAuthStateChanged(

  auth,

  async(user) => {

    if(!user){

      showError(
        "يجب تسجيل الدخول إلى Mecd Tools أولاً."
      );

      return;

    }


    currentUser =
      user;


    await loadRoom();

  }

);

</script>


</body>

</html>
