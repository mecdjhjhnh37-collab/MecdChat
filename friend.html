<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat - الصديق</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(circle at 50% 0%,#123d35 0%,transparent 35%),
linear-gradient(180deg,#07110f 0%,#020504 100%);

overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.glow{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
filter:blur(100px);
opacity:.18;
}

.glow.one{
background:#00e676;
top:-100px;
right:-100px;
}

.glow.two{
background:#2979ff;
bottom:-100px;
left:-100px;
}

.app{
position:relative;
z-index:1;
width:100%;
max-width:650px;
min-height:100vh;
margin:auto;
padding:25px 20px 45px;
}

header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:35px;
}

.title{
font-size:22px;
font-weight:bold;
}

.back{
border:1px solid rgba(255,255,255,.08);
background:rgba(255,255,255,.04);
color:white;
padding:10px 15px;
border-radius:15px;
font-size:14px;
cursor:pointer;
}

.profile{
text-align:center;
padding:30px 20px;

border-radius:28px;

background:
linear-gradient(
135deg,
rgba(0,85,58,.5),
rgba(2,31,24,.7)
);

border:1px solid rgba(0,255,145,.15);

margin-bottom:25px;
}

.avatar{
width:110px;
height:110px;

margin:0 auto 20px;

border-radius:30px;

display:flex;
align-items:center;
justify-content:center;

font-size:48px;

background:#7e57c2;

overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
font-size:25px;
font-weight:bold;
margin-bottom:10px;
}

.id{
color:#00e889;
font-size:15px;
}

.actions{
display:flex;
flex-direction:column;
gap:14px;
}

.action{
width:100%;
padding:17px;

border:none;
border-radius:17px;

font-family:inherit;
font-size:16px;
font-weight:bold;

cursor:pointer;
}

.action:active{
transform:scale(.98);
}

.chat{
background:#00e889;
color:#00150e;
}

.block{
background:#ffb300;
color:#211600;
}

.remove{
background:#ef5350;
color:white;
}

.cancel{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.1);
color:white;
}

.message{
display:none;

padding:17px;
margin-bottom:20px;

border-radius:18px;

text-align:center;

background:rgba(0,230,118,.08);
border:1px solid rgba(0,230,118,.15);

color:#8fffc5;
}

.loading{
position:fixed;
inset:0;
z-index:999;

display:flex;
align-items:center;
justify-content:center;

background:#020504;

color:#a8bdb6;
}

.spinner{
width:35px;
height:35px;

border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div class="background">
<div class="glow one"></div>
<div class="glow two"></div>
</div>

<div id="loading" class="loading">
<div class="spinner"></div>
<div>جارٍ تحميل الصديق...</div>
</div>

<main id="app" class="app" style="display:none;">

<header>

<div class="title">
👤 الصديق
</div>

<button id="backBtn" class="back">
← رجوع
</button>

</header>

<div id="message" class="message"></div>

<section class="profile">

<div id="avatar" class="avatar">
👤
</div>

<div id="name" class="name">
مستخدم Mecd
</div>

<div id="friendId" class="id">
ID: ---
</div>

</section>

<section class="actions">

<button id="chatBtn" class="action chat">
💬 دردشة
</button>

<button id="blockBtn" class="action block">
🚫 حظر
</button>

<button id="removeBtn" class="action remove">
❌ إلغاء الصداقة
</button>

<button id="cancelBtn" class="action cancel">
← العودة إلى الأصدقاء
</button>

</section>

</main>

<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
deleteDoc,
setDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const avatar =
document.getElementById("avatar");

const name =
document.getElementById("name");

const friendId =
document.getElementById("friendId");

const message =
document.getElementById("message");

const chatBtn =
document.getElementById("chatBtn");

const blockBtn =
document.getElementById("blockBtn");

const removeBtn =
document.getElementById("removeBtn");

const backBtn =
document.getElementById("backBtn");

const cancelBtn =
document.getElementById("cancelBtn");


const friendsURL =
"./friends.html";


let currentUser = null;
let friendUID = null;
let friendData = null;


/* إظهار رسالة */

function showMessage(text){

message.textContent = text;
message.style.display = "block";

}


/* جلب UID من الرابط */

const params =
new URLSearchParams(
window.location.search
);

friendUID =
params.get("uid");


/* تسجيل الدخول */

onAuthStateChanged(

auth,

async(user)=>{

if(!user){

window.location.replace(
"./index.html"
);

return;

}

currentUser = user;

if(!friendUID){

showMessage(
"لم يتم تحديد الصديق."
);

loading.style.display = "none";
app.style.display = "block";

return;

}

if(friendUID === currentUser.uid){

showMessage(
"لا يمكنك فتح صفحة نفسك كصديق."
);

loading.style.display = "none";
app.style.display = "block";

return;

}

await loadFriend();

}

);


/* تحميل الصديق */

async function loadFriend(){

try{

const friendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
friendUID
);

const friendSnap =
await getDoc(friendRef);


if(!friendSnap.exists()){

showMessage(
"هذا الشخص ليس موجوداً في قائمة أصدقائك."
);

loading.style.display = "none";
app.style.display = "block";

return;

}


friendData =
friendSnap.data();


/* الاسم */

name.textContent =
friendData.name ||
"مستخدم Mecd";


/* ID */

friendId.textContent =
"ID: " +
(
friendData.chatID ||
"---"
);


/* الصورة */

if(friendData.photo){

avatar.innerHTML = `
<img
src="${friendData.photo}"
alt="صورة الصديق"
>
`;

}else{

avatar.textContent = "👤";

}


loading.style.display = "none";
app.style.display = "block";


}catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء تحميل الصديق."
);

loading.style.display = "none";
app.style.display = "block";

}

}


/* =========================
   الدردشة
========================= */

chatBtn.addEventListener(

"click",

()=>{

/*
نفتح صفحة الدردشة مع UID الصديق.
إذا كانت صفحة الدردشة عندك باسم مختلف،
سنغير الرابط لاحقاً.
*/

window.location.href =
"./chat.html?uid=" +
encodeURIComponent(friendUID);

}

);


/* =========================
   إلغاء الصداقة
========================= */

removeBtn.addEventListener(

"click",

async()=>{

const confirmed =
confirm(
"هل تريد فعلاً إلغاء الصداقة مع " +
(friendData?.name || "هذا الشخص") +
"؟"
);

if(!confirmed){
return;
}

removeBtn.disabled = true;
removeBtn.textContent =
"جاري الإلغاء...";


try{

const friendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
friendUID
);

await deleteDoc(friendRef);


showMessage(
"✅ تم إلغاء الصداقة بنجاح."
);

removeBtn.textContent =
"✓ تم إلغاء الصداقة";

setTimeout(

()=>{

window.location.href =
friendsURL;

},

1000

);


}catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء إلغاء الصداقة."
);

removeBtn.disabled = false;

removeBtn.textContent =
"❌ إلغاء الصداقة";

}

});


/* =========================
   الحظر
========================= */

blockBtn.addEventListener(

"click",

async()=>{

const confirmed =
confirm(
"هل تريد حظر " +
(friendData?.name || "هذا الشخص") +
"؟"
);

if(!confirmed){
return;
}

blockBtn.disabled = true;
blockBtn.textContent =
"جاري الحظر...";


try{

const friendRef =
doc(
db,
"users",
currentUser.uid,
"friends",
friendUID
);


/*
نحفظ حالة الحظر داخل
سجل الصديق نفسه.
*/

await setDoc(

friendRef,

{
...friendData,
blocked: true,
blockedAt: Date.now()
},

{
merge:true
}

);


showMessage(
"🚫 تم حظر هذا الشخص."
);

blockBtn.textContent =
"✓ تم الحظر";


}catch(error){

console.error(error);

showMessage(
"حدث خطأ أثناء الحظر."
);

blockBtn.disabled = false;

blockBtn.textContent =
"🚫 حظر";

}

});


/* =========================
   الرجوع
========================= */

function goBack(){

window.location.href =
friendsURL;

}

backBtn.addEventListener(
"click",
goBack
);

cancelBtn.addEventListener(
"click",
goBack
);

</script>

</body>
</html>
