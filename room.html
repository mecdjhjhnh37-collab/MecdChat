<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء غرفة - Mecd Chat</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Tahoma,sans-serif;
  color:white;

  background:
    radial-gradient(
      circle at 50% 0%,
      #123d35 0%,
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #07110f 0%,
      #020504 100%
    );
}

.app{
  width:100%;
  max-width:650px;
  min-height:100vh;
  margin:auto;
  padding:25px 18px 40px;
}

header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:45px;
}

.back{
  width:45px;
  height:45px;
  border:0;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  color:white;
  font-size:23px;
  cursor:pointer;
}

.back:active{
  transform:scale(.95);
}

.logo{
  width:48px;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #00e676,
      #00a85a
    );

  font-size:25px;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.subtitle{
  margin-top:4px;
  color:#899692;
  font-size:12px;
}

.hero{
  text-align:center;
  margin-bottom:30px;
}

.icon{
  width:90px;
  height:90px;

  margin:0 auto 20px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:28px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  font-size:45px;
}

h1{
  font-size:30px;
  margin-bottom:10px;
}

.hero p{
  color:#8f9b97;
  line-height:1.7;
  font-size:14px;
}

.card{
  padding:22px;

  border-radius:25px;

  background:rgba(255,255,255,.045);

  border:1px solid rgba(255,255,255,.08);
}

label{
  display:block;

  margin-bottom:8px;

  color:#cbd5d1;
  font-size:14px;
}

input{
  width:100%;
  height:55px;

  margin-bottom:20px;
  padding:0 16px;

  border:1px solid rgba(255,255,255,.1);

  border-radius:16px;

  outline:none;

  background:#111916;
  color:white;

  font-family:inherit;
  font-size:16px;
}

input::placeholder{
  color:#69746f;
}

input:focus{
  border-color:#00e676;

  box-shadow:
    0 0 0 2px
    rgba(0,230,118,.1);
}

button.create{
  width:100%;
  height:56px;

  border:0;
  border-radius:17px;

  background:#00e889;
  color:#00150e;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;

  transition:
    transform .15s,
    opacity .15s;
}

button.create:active{
  transform:scale(.98);
}

button.create:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.error{
  display:none;

  margin-top:15px;
  padding:13px;

  border-radius:14px;

  background:rgba(255,60,60,.1);

  color:#ff8d8d;

  font-size:13px;
  line-height:1.6;
}

.loading{
  display:none;

  margin-top:15px;

  color:#8e9995;

  text-align:center;

  font-size:13px;
}

.spinner{
  display:inline-block;

  width:15px;
  height:15px;

  margin-left:7px;

  vertical-align:middle;

  border:
    2px solid
    rgba(255,255,255,.2);

  border-top-color:#00e889;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

</style>

</head>


<body>


<div class="app">


<header>

<button
  type="button"
  class="back"
  id="backButton"
>
←
</button>


<div class="logo">
💬
</div>


<div>

<div class="title">
Mecd Chat
</div>

<div class="subtitle">
إنشاء غرفة دردشة
</div>

</div>

</header>


<section class="hero">

<div class="icon">
🏠
</div>


<h1>
إنشاء غرفة
</h1>


<p>
أنشئ غرفة خاصة وشارك اسم الغرفة
وكلمة السر مع أصدقائك.
</p>

</section>


<div class="card">


<label for="roomName">
اسم الغرفة
</label>


<input
  id="roomName"
  type="text"
  maxlength="40"
  placeholder="مثلاً: أصدقاء المدرسة"
  autocomplete="off"
/>


<label for="roomPassword">
كلمة السر
</label>


<input
  id="roomPassword"
  type="password"
  maxlength="40"
  placeholder="اكتب كلمة سر للغرفة"
  autocomplete="new-password"
/>


<button
  type="button"
  id="createButton"
  class="create"
>
إنشاء غرفة
</button>


<div
  id="loading"
  class="loading"
>

<span class="spinner"></span>

جاري إنشاء الغرفة...

</div>


<div
  id="error"
  class="error"
></div>


</div>

</div>


<script type="module">


/* =====================================
   Firebase
===================================== */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================
   Firebase Config
===================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

  authDomain:
    "mecd-tools.firebaseapp.com",

  projectId:
    "mecd-tools",

  storageBucket:
    "mecd-tools.firebasestorage.app",

  messagingSenderId:
    "643005547408",

  appId:
    "1:643005547408:web:b1719060ec340dd0e0a915",

  measurementId:
    "G-0VKYR3TQV2"

};


/* =====================================
   تشغيل Firebase
===================================== */

const firebaseApp =
  initializeApp(
    firebaseConfig
  );


const auth =
  getAuth(
    firebaseApp
  );


const db =
  getFirestore(
    firebaseApp
  );


/* =====================================
   العناصر
===================================== */

const roomName =
  document.getElementById(
    "roomName"
  );


const roomPassword =
  document.getElementById(
    "roomPassword"
  );


const createButton =
  document.getElementById(
    "createButton"
  );


const loading =
  document.getElementById(
    "loading"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const backButton =
  document.getElementById(
    "backButton"
  );


/* =====================================
   المستخدم الحالي
===================================== */

let currentUser = null;


/* =====================================
   حالة تسجيل الدخول
===================================== */

onAuthStateChanged(

  auth,

  (user) => {

    if(!user){

      currentUser = null;

      createButton.disabled = true;

      showError(
        "يجب تسجيل الدخول إلى Mecd Tools أولاً."
      );

      return;
    }


    currentUser = user;

    createButton.disabled = false;

    errorBox.style.display = "none";

  }

);


/* =====================================
   عرض الخطأ
===================================== */

function showError(message){

  errorBox.textContent = message;

  errorBox.style.display = "block";

}


/* =====================================
   توليد كود الغرفة
===================================== */

function generateRoomCode(){

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";


  for(
    let i = 0;
    i < 6;
    i++
  ){

    const randomIndex =
      Math.floor(
        Math.random() *
        characters.length
      );


    code +=
      characters[
        randomIndex
      ];

  }


  return code;

}


/* =====================================
   إنشاء الغرفة
===================================== */

async function createRoom(){

  /* إخفاء الخطأ القديم */

  errorBox.style.display =
    "none";


  /* التأكد من تسجيل الدخول */

  if(!currentUser){

    showError(
      "يجب تسجيل الدخول أولاً."
    );

    return;

  }


  /* قراءة اسم الغرفة */

  const name =
    roomName.value.trim();


  /* قراءة كلمة السر */

  const password =
    roomPassword.value.trim();


  /* =====================================
     التحقق من اسم الغرفة
  ===================================== */

  if(!name){

    showError(
      "اكتب اسم الغرفة أولاً."
    );

    roomName.focus();

    return;

  }


  /* =====================================
     التحقق من كلمة السر
  ===================================== */

  if(!password){

    showError(
      "اكتب كلمة سر للغرفة."
    );

    roomPassword.focus();

    return;

  }


  if(password.length < 4){

    showError(
      "كلمة السر يجب أن تكون 4 أحرف أو أرقام على الأقل."
    );

    roomPassword.focus();

    return;

  }


  /* =====================================
     منع الضغط المتكرر
  ===================================== */

  createButton.disabled =
    true;


  loading.style.display =
    "block";


  createButton.textContent =
    "جاري إنشاء الغرفة...";


  try{

    /* =====================================
       إنشاء كود الغرفة
    ===================================== */

    const code =
      generateRoomCode();


    /* =====================================
       بيانات الغرفة
    ===================================== */

    const roomData = {

      name:
        name,

      password:
        password,

      code:
        code,

      ownerId:
        currentUser.uid,

      ownerName:
        currentUser.displayName ||
        "مستخدم Mecd",

      ownerPhoto:
        currentUser.photoURL ||
        "",

      createdAt:
        serverTimestamp(),

      members:
        [
          currentUser.uid
        ],

      active:
        true

    };


    /* =====================================
       حفظ الغرفة في Firestore
    ===================================== */

    const roomRef =
      await addDoc(

        collection(
          db,
          "rooms"
        ),

        roomData

      );


    /* =====================================
       رابط الغرفة
       
       مهم جداً:
       نفتح room.html
       
       وليس:
       chat.html
       room-chat.html
    ===================================== */

    const targetURL =
      "./room.html" +
      "?roomId=" +
      encodeURIComponent(
        roomRef.id
      ) +
      "&code=" +
      encodeURIComponent(
        code
      );


    /* =====================================
       الانتقال إلى room.html
    ===================================== */

    window.location.replace(
      targetURL
    );


  }catch(error){

    console.error(
      "Create room error:",
      error
    );


    loading.style.display =
      "none";


    createButton.disabled =
      false;


    createButton.textContent =
      "إنشاء غرفة";


    showError(
      "تعذر إنشاء الغرفة. تأكد من اتصال الإنترنت وإعدادات Firebase ثم حاول مرة أخرى."
    );

  }

}


/* =====================================
   زر إنشاء الغرفة
===================================== */

createButton.addEventListener(

  "click",

  createRoom

);


/* =====================================
   Enter في اسم الغرفة
===================================== */

roomName.addEventListener(

  "keydown",

  (event) => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      roomPassword.focus();

    }

  }

);


/* =====================================
   Enter في كلمة السر
===================================== */

roomPassword.addEventListener(

  "keydown",

  (event) => {

    if(
      event.key === "Enter"
    ){

      event.preventDefault();

      createRoom();

    }

  }

);


/* =====================================
   زر الرجوع
===================================== */

backButton.addEventListener(

  "click",

  () => {

    history.back();

  }

);


</script>


</body>

</html>
