<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة فيديو</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Tahoma,sans-serif;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    color:white;

    overflow:hidden;
}

.video-app{
    width:100%;
    height:100vh;

    position:relative;

    background:#020504;
}

/* =========================================================
   الفيديو البعيد
   ========================================================= */

.remote-video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#07110f;

    z-index:1;
}

/* =========================================================
   صورة الطرف الآخر
   ========================================================= */

.remote-placeholder{
    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #12352c,
            #020504 70%
        );

    z-index:2;

    transition:.25s;
}

.remote-placeholder.hidden{
    display:none;
}

.remote-avatar{
    width:105px;
    height:105px;

    border-radius:30px;

    background:#18231f;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:50px;

    border:
        2px solid
        rgba(0,232,137,.25);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.5);
}

.remote-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.remote-placeholder-name{
    margin-top:18px;

    font-size:21px;

    font-weight:bold;
}

/* =========================================================
   الفيديو المحلي
   ========================================================= */

.local-video{
    position:absolute;

    width:125px;
    height:175px;

    right:15px;
    bottom:105px;

    object-fit:cover;

    background:#111916;

    border-radius:20px;

    border:
        2px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.6);

    z-index:10;
}

/* =========================================================
   الأعلى
   ========================================================= */

.top-bar{
    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:18px 15px;

    display:flex;

    align-items:center;

    gap:12px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.65),
            transparent
        );

    z-index:20;
}

.back-button{
    width:45px;
    height:45px;

    border:0;

    border-radius:15px;

    background:
        rgba(24,35,31,.85);

    color:white;

    font-size:22px;

    cursor:pointer;
}

.top-info{
    min-width:0;

    flex:1;
}

.top-name{
    font-size:17px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.top-status{
    margin-top:4px;

    font-size:12px;

    color:#00e889;
}

/* =========================================================
   حالة المكالمة وسط الشاشة
   ========================================================= */

.call-info{
    position:absolute;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    text-align:center;

    z-index:15;

    pointer-events:none;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,.8);
}

.call-name{
    font-size:24px;

    font-weight:bold;
}

.call-status{
    margin-top:8px;

    font-size:14px;

    color:#00e889;
}

/* =========================================================
   أزرار المكالمة
   ========================================================= */

.controls{
    position:absolute;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    z-index:30;
}

.control-button{
    width:58px;
    height:58px;

    border:0;

    border-radius:50%;

    background:
        rgba(24,35,31,.95);

    color:white;

    font-size:23px;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);
}

.control-button:active{
    transform:scale(.92);
}

.control-button.off{
    background:#4b2222;
}

.end-button{
    width:66px;
    height:66px;

    border:0;

    border-radius:50%;

    background:#e53935;

    color:white;

    font-size:25px;

    cursor:pointer;

    box-shadow:
        0 8px 30px
        rgba(229,57,53,.35);
}

.end-button:active{
    transform:scale(.92);
}

/* =========================================================
   شاشة التحميل
   ========================================================= */

.loading{
    position:fixed;

    inset:0;

    background:#020504;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    z-index:100;
}

.loading.hidden{
    display:none;
}

.spinner{
    width:42px;
    height:42px;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:#00e889;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

.loading-text{
    margin-top:15px;

    color:#aaa;

    font-size:14px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================================
   الخطأ
   ========================================================= */

.error-box{
    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:#020504;

    z-index:200;

    text-align:center;
}

.error-box.hidden{
    display:none;
}

.error-content{
    max-width:400px;

    padding:25px;

    border-radius:20px;

    background:#111916;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.error-title{
    font-size:20px;

    font-weight:bold;

    color:#ff6464;

    margin-bottom:12px;
}

.error-message{
    color:#aaa;

    line-height:1.6;

    font-size:13px;
}

/* =========================================================
   شاشة المكالمة الواردة
   ========================================================= */

.incoming{
    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.82);

    backdrop-filter:blur(10px);

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:300;

    padding:20px;
}

.incoming.hidden{
    display:none;
}

.incoming-card{
    width:100%;

    max-width:360px;

    padding:30px 22px;

    border-radius:28px;

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    text-align:center;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.6);
}

.incoming-avatar{
    width:95px;
    height:95px;

    margin:auto;

    border-radius:28px;

    overflow:hidden;

    background:#18231f;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:45px;
}

.incoming-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.incoming-title{
    margin-top:20px;

    font-size:22px;

    font-weight:bold;
}

.incoming-subtitle{
    margin-top:8px;

    color:#00e889;

    font-size:14px;
}

.incoming-buttons{
    display:flex;

    gap:12px;

    margin-top:25px;
}

.incoming-buttons button{
    flex:1;

    height:52px;

    border:0;

    border-radius:17px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.accept-button{
    background:#00c96b;
    color:#00150e !important;
}

.reject-button{
    background:#352020;
}

@media(max-width:500px){

    .local-video{
        width:105px;
        height:150px;

        right:10px;
        bottom:105px;
    }

    .controls{
        gap:10px;
    }

    .control-button{
        width:54px;
        height:54px;
    }

    .end-button{
        width:62px;
        height:62px;
    }

}

</style>

</head>

<body>

<div class="video-app">

    <!-- فيديو الطرف الآخر -->

    <video
        id="remoteVideo"
        class="remote-video"
        autoplay
        playsinline>
    </video>


    <!-- صورة الطرف الآخر قبل وصول الفيديو -->

    <div
        id="remotePlaceholder"
        class="remote-placeholder">

        <div
            id="remoteAvatar"
            class="remote-avatar">

            👤

        </div>

        <div
            id="remotePlaceholderName"
            class="remote-placeholder-name">

            جارٍ الاتصال...

        </div>

    </div>


    <!-- فيديو الهاتف الحالي -->

    <video
        id="localVideo"
        class="local-video"
        autoplay
        muted
        playsinline>
    </video>


    <!-- الأعلى -->

    <div class="top-bar">

        <button
            id="backButton"
            class="back-button"
            type="button">

            →

        </button>

        <div class="top-info">

            <div
                id="topName"
                class="top-name">

                جارٍ الاتصال...

            </div>

            <div
                id="topStatus"
                class="top-status">

                جارٍ الاتصال...

            </div>

        </div>

    </div>


    <!-- المعلومات -->

    <div class="call-info">

        <div
            id="callName"
            class="call-name">

            جارٍ الاتصال...

        </div>

        <div
            id="callStatus"
            class="call-status">

            جارٍ الاتصال...

        </div>

    </div>


    <!-- أزرار التحكم -->

    <div class="controls">

        <button
            id="muteButton"
            class="control-button"
            type="button">

            🎤

        </button>

        <button
            id="cameraButton"
            class="control-button"
            type="button">

            📹

        </button>

        <button
            id="endButton"
            class="end-button"
            type="button">

            ☎

        </button>

    </div>

</div>


<!-- شاشة التحميل -->

<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    <div class="loading-text">

        جارٍ تجهيز مكالمة الفيديو...

    </div>

</div>


<!-- الخطأ -->

<div
    id="errorBox"
    class="error-box hidden">

    <div class="error-content">

        <div class="error-title">

            ⚠️ تعذر الاتصال

        </div>

        <div
            id="errorMessage"
            class="error-message">

        </div>

    </div>

</div>


<script
    type="module"
    src="./Video-call.js">
</script>

</body>

</html>
