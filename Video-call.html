<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة فيديو</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:#020504;

}

.video-app{

    position:relative;

    width:100%;
    height:100dvh;

    max-width:650px;

    margin:auto;

    overflow:hidden;

    background:#020504;

}

/* =========================
   فيديو الطرف الآخر
========================= */

.remote-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#07110f;

    z-index:1;

    transition:
        width .25s ease,
        height .25s ease,
        left .25s ease,
        top .25s ease,
        border-radius .25s ease;

}

/* =========================
   شاشة الانتظار
========================= */

.remote-placeholder{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #123d35,
            #020504 70%
        );

    z-index:2;

}

.remote-avatar{

    width:82px;
    height:82px;

    border-radius:24px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#18231f;

    font-size:36px;

    margin-bottom:12px;

}

.remote-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.remote-name{

    font-size:18px;

    font-weight:bold;

}

.call-status{

    margin-top:6px;

    color:#00e889;

    font-size:12px;

}

/* =========================
   الشريط العلوي
========================= */

.top-bar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    min-height:64px;

    padding:
        max(8px, env(safe-area-inset-top))
        12px
        8px;

    display:flex;

    align-items:center;

    gap:9px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.72),
            rgba(0,0,0,0)
        );

    z-index:20;

}

.back-button{

    width:38px;
    height:38px;

    flex-shrink:0;

    border:0;

    border-radius:12px;

    background:
        rgba(24,35,31,.9);

    color:white;

    font-size:19px;

    cursor:pointer;

}

.top-info{

    min-width:0;

    flex:1;

}

.top-name{

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.top-status{

    margin-top:2px;

    font-size:11px;

    color:#00e889;

}

/* =========================
   فيديو المستخدم الصغير
========================= */

.local-video{

    position:absolute;

    left:12px;

    bottom:88px;

    width:92px;
    height:128px;

    object-fit:cover;

    background:#111916;

    border-radius:15px;

    border:
        2px solid
        rgba(0,232,137,.55);

    z-index:25;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.55);

    cursor:pointer;

    transition:
        all .25s ease;

}

/* =========================
   عند تكبير فيديو المستخدم
========================= */

.video-app.local-big .local-video{

    left:0;
    bottom:0;

    width:100%;
    height:100%;

    border-radius:0;

    border:0;

    z-index:8;

}

.video-app.local-big .remote-video{

    top:12px;
    right:12px;

    left:auto;

    width:100px;
    height:140px;

    border-radius:15px;

    z-index:25;

    border:
        2px solid
        rgba(0,232,137,.55);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.55);

    cursor:pointer;

}

/* =========================
   الأزرار
========================= */

.controls{

    position:absolute;

    bottom:
        max(12px, env(safe-area-inset-bottom));

    left:0;
    right:0;

    height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    z-index:40;

}

.control-button{

    width:48px;
    height:48px;

    flex-shrink:0;

    border:0;

    border-radius:16px;

    background:#18231f;

    color:white;

    font-size:19px;

    cursor:pointer;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.4);

}

.control-button:active,
.end-button:active,
.back-button:active{

    transform:scale(.94);

}

.control-button.off{

    background:#522626;

}

.end-button{

    width:52px;
    height:52px;

    flex-shrink:0;

    border:0;

    border-radius:18px;

    background:#e83f3f;

    color:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.45);

}

/* =========================
   التحميل
========================= */

.loading{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#020504;

    color:white;

    font-size:15px;

    z-index:100;

}

.hidden{

    display:none !important;

}

/* =========================
   الخطأ
========================= */

.error-box{

    position:absolute;

    left:15px;
    right:15px;

    bottom:85px;

    padding:12px;

    border-radius:14px;

    background:
        rgba(70,20,20,.95);

    color:#ffb3b3;

    text-align:center;

    font-size:12px;

    z-index:50;

}

/* =========================
   الشاشات الصغيرة
========================= */

@media(max-width:380px){

    .local-video{

        width:82px;
        height:115px;

        bottom:84px;
        left:9px;

        border-radius:13px;

    }

    .control-button{

        width:44px;
        height:44px;

        font-size:17px;

    }

    .end-button{

        width:48px;
        height:48px;

        font-size:20px;

    }

    .controls{

        gap:8px;

    }

}

</style>

</head>

<body>

<div id="loading"
     class="loading">

    جارٍ تشغيل مكالمة الفيديو...

</div>

<main id="videoApp"
      class="video-app">

    <!-- فيديو الطرف الآخر -->

    <video id="remoteVideo"
           class="remote-video"
           autoplay
           playsinline>
    </video>


    <!-- صورة الطرف الآخر أثناء الانتظار -->

    <div id="remotePlaceholder"
         class="remote-placeholder">

        <div id="remoteAvatar"
             class="remote-avatar">

            👤

        </div>

        <div id="remoteName"
             class="remote-name">

            جارٍ التحميل...

        </div>

        <div id="callStatus"
             class="call-status">

            جارٍ الاتصال...

        </div>

    </div>


    <!-- الشريط العلوي -->

    <div class="top-bar">

        <button id="backButton"
                class="back-button"
                type="button">

            →

        </button>

        <div class="top-info">

            <div id="topName"
                 class="top-name">

                جارٍ الاتصال...

            </div>

            <div id="topStatus"
                 class="top-status">

                جارٍ الاتصال...

            </div>

        </div>

    </div>


    <!-- فيديو المستخدم -->

    <video id="localVideo"
           class="local-video"
           autoplay
           muted
           playsinline>
    </video>


    <!-- الخطأ -->

    <div id="errorBox"
         class="error-box hidden">
    </div>


    <!-- أزرار التحكم -->

    <div class="controls">

        <button id="muteButton"
                class="control-button"
                type="button">

            🎤

        </button>

        <button id="cameraButton"
                class="control-button"
                type="button">

            📹

        </button>

        <button id="endButton"
                class="end-button"
                type="button">

            ☎

        </button>

    </div>

</main>


<script
    type="module"
    src="./Video-call.js?v=3">
</script>

</body>

</html>
