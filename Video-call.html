<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Call</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

body{
    margin:0;
    background:#050807;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

video{
    width:100%;
    height:350px;
    background:black;
    border-radius:20px;
    border:2px solid #00e676;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:15px;
    background:#00e676;
    font-size:18px;
}

#id{
    margin-top:15px;
    color:#00e676;
    word-break:break-all;
}

</style>

</head>


<body>

<div class="container">

<h1>📞 مكالمة فيديو</h1>


<video id="myVideo" autoplay muted playsinline></video>

<video id="remoteVideo" autoplay playsinline></video>


<div id="id">
جاري إنشاء المعرف...
</div>


<button onclick="createCall()">
إنشاء مكالمة
</button>


<button onclick="joinCall()">
انضمام
</button>


<input id="callId"
placeholder="ضع كود الاتصال"
style="
width:100%;
padding:15px;
margin-top:15px;
border-radius:15px;
">


<button onclick="endCall()">
إنهاء المكالمة
</button>


</div>


<script src="video-call.js"></script>

</body>
</html>
