<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Video Call - Mecd Chat</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
height:100vh;
font-family:Arial,Tahoma,sans-serif;
background:
radial-gradient(circle at top,#123d35,transparent 40%),
linear-gradient(180deg,#07110f,#020504);
color:white;
overflow:hidden;
}

.video-app{
height:100vh;
max-width:650px;
margin:auto;
position:relative;
background:#020504;
overflow:hidden;
}

#remoteVideo{
width:100%;
height:100%;
object-fit:cover;
background:#020504;
}

#localVideo{
position:absolute;
top:20px;
right:20px;
width:125px;
height:175px;
object-fit:cover;
border-radius:18px;
background:#111916;
border:2px solid rgba(255,255,255,.2);
z-index:5;
}

.top-bar{
position:absolute;
top:0;
left:0;
right:0;
height:75px;
display:flex;
align-items:center;
padding:12px 15px;
background:linear-gradient(
180deg,
rgba(0,0,0,.65),
transparent
);
z-index:10;
}

.user-info{
flex:1;
}

.user-name{
font-size:17px;
font-weight:bold;
}

.status{
font-size:12px;
color:#aaa;
margin-top:5px;
}

.status.connected{
color:#00e889;
}

.controls{
position:absolute;
bottom:30px;
left:0;
right:0;
display:flex;
justify-content:center;
gap:15px;
z-index:20;
}

.control{
width:58px;
height:58px;
border:0;
border-radius:50%;
background:#18231f;
color:white;
font-size:22px;
cursor:pointer;
}

.control.off{
background:#303a36;
}

.end-call{
background:#ff4545;
}

#loading{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:#020504;
z-index:100;
font-size:18px;
}

.hidden{
display:none !important;
}
</style>

</head>

<body>

<div class="video-app">

<div id="loading">
جارٍ تشغيل مكالمة الفيديو...
</div>

<video
id="remoteVideo"
autoplay
playsinline>
</video>

<video
id="localVideo"
autoplay
muted
playsinline>
</video>

<div class="top-bar">

<div class="user-info">

<div
id="friendName"
class="user-name">
جاري الاتصال...
</div>

<div
id="callStatus"
class="status">
● جاري الاتصال
</div>

</div>

</div>

<div class="controls">

<button
id="cameraButton"
class="control"
type="button">
📹
</button>

<button
id="micButton"
class="control"
type="button">
🎤
</button>

<button
id="endButton"
class="control end-call"
type="button">
📞
</button>

</div>

</div>

<script
type="module"
src="video-call.js">
</script>

</body>
</html>
