<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Video Call</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial,Tahoma,sans-serif;
    background:#020504;
    color:white;
}

.video-app{
    width:100%;
    height:100vh;
    max-width:900px;
    margin:auto;
    position:relative;
    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 45%
        ),
        #020504;
}

/* الفيديو الكبير */
#remoteVideo{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#07110f;
}

/* شاشة انتظار */
.waiting{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:#07110f;
    z-index:2;
    text-align:center;
}

.waiting-avatar{
    width:100px;
    height:100px;
    border-radius:30px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:48px;
}

.waiting-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.waiting-name{
    font-size:20px;
    font-weight:bold;
}

.waiting-status{
    color:#84938e;
    font-size:13px;
}

/* الفيديو الصغير */
.local-box{
    position:absolute;
    top:18px;
    right:18px;
    width:125px;
    height:175px;
    border-radius:20px;
    overflow:hidden;
    background:#101815;
    border:2px solid rgba(255,255,255,.12);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    z-index:5;
}

#localVideo{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* الاسم والحالة */
.top-info{
    position:absolute;
    top:18px;
    left:18px;
    z-index:6;
    padding:10px 14px;
    border-radius:15px;
    background:rgba(5,8,7,.65);
    backdrop-filter:blur(10px);
}

#friendName{
    font-size:15px;
    font-weight:bold;
}

#callStatus{
    margin-top:4px;
    color:#00e889;
    font-size:11px;
}

/* أزرار التحكم */
.controls{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    z-index:10;
}

.control{
    width:55px;
    height:55px;
    border:0;
    border-radius:18px;
    background:#18231f;
    color:white;
    font-size:21px;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.control:active{
    transform:scale(.93);
}

.control.off{
    background:#333d39;
    opacity:.8;
}

.end-call{
    width:62px;
    height:62px;
    border:0;
    border-radius:20px;
    background:#ff4d4d;
    color:white;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(255,0,0,.2);
}

.end-call:active{
    transform:scale(.93);
}

/* كتم الفيديو */
.video-off{
    background:#18231f;
}

/* رسالة الخطأ */
.error-box{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    background:#020504;
    z-index:100;
}

.error-content{
    max-width:350px;
}

.error-content h2{
    margin-bottom:10px;
}

.error-content p{
    color:#8b9995;
    font-size:13px;
    line-height:1.7;
}

.back-button{
    margin-top:20px;
    padding:13px 25px;
    border:0;
    border-radius:15px;
    background:#00e889;
    color:#00150e;
    font-weight:bold;
    cursor:pointer;
}

/* الهاتف */
@media(max-width:500px){

    .local-box{
        width:100px;
        height:145px;
        top:12px;
        right:12px;
        border-radius:17px;
    }

    .top-info{
        top:12px;
        left:12px;
    }

    .control{
        width:50px;
        height:50px;
        border-radius:16px;
    }

    .end-call{
        width:58px;
        height:58px;
        border-radius:18px;
    }

    .controls{
        bottom:20px;
        gap:9px;
    }
}
</style>
</head>

<body>

<div class="video-app">

    <!-- فيديو الطرف الآخر -->
    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>

    <!-- شاشة الانتظار -->
    <div
        id="waiting"
        class="waiting">

        <div
            id="waitingAvatar"
            class="waiting-avatar">
            👤
        </div>

        <div
            id="waitingName"
            class="waiting-name">
            جارٍ الاتصال...
        </div>

        <div
            id="waitingStatus"
            class="waiting-status">
            جاري تشغيل الكاميرا...
        </div>

    </div>


    <!-- معلومات الصديق -->
    <div class="top-info">

        <div id="friendName">
            مكالمة فيديو
        </div>

        <div
            id="callStatus">
            جاري الاتصال...
        </div>

    </div>


    <!-- الفيديو المحلي -->
    <div class="local-box">

        <video
            id="localVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <!-- أزرار التحكم -->
    <div class="controls">

        <button
            id="micButton"
            class="control"
            type="button">
            🎤
        </button>

        <button
            id="cameraButton"
            class="control"
            type="button">
            📹
        </button>

        <button
            id="switchCameraButton"
            class="control"
            type="button">
            🔄
        </button>

        <button
            id="endButton"
            class="end-call"
            type="button">
            📞
        </button>

    </div>


    <!-- الخطأ -->
    <div
        id="errorBox"
        class="error-box">

        <div class="error-content">

            <h2>
                ⚠️ تعذر تشغيل مكالمة الفيديو
            </h2>

            <p id="errorText">
                حدث خطأ أثناء تشغيل المكالمة.
            </p>

            <button
                id="backButton"
                class="back-button"
                type="button">
                رجوع
            </button>

        </div>

    </div>

</div>


<script type="module">

/*
============================================================
هذا الملف هو واجهة مكالمة الفيديو فقط.

الكود الرئيسي موجود في:

Video-call.js

ويتم تشغيله من صفحة Mecd Chat.
============================================================
*/

const params =
    new URLSearchParams(
        location.search
    );


const friendName =
    params.get("friendName");


const nameElement =
    document.getElementById(
        "friendName"
    );


const waitingName =
    document.getElementById(
        "waitingName"
    );


if(friendName){

    nameElement.textContent =
        friendName;

    waitingName.textContent =
        friendName;

}


/*
============================================================
زر الرجوع
============================================================
*/

document
.getElementById("backButton")
.addEventListener(
    "click",
    () => {

        history.back();

    }
);

</script>

</body>
</html>
