<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة فيديو</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

}

/* =========================================================
   التطبيق
========================================================= */

.video-app{

    position:relative;

    width:100%;
    height:100dvh;

    max-width:650px;

    margin:auto;

    overflow:hidden;

    background:#020504;

}


/* =========================================================
   فيديو الطرف الآخر - كبير
========================================================= */

.remote-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#07110f;

    z-index:1;

}


/* =========================================================
   شاشة الانتظار
========================================================= */

.remote-placeholder{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #123d35,
            #020504 70%
        );

    z-index:2;

}

.remote-avatar{

    width:90px;
    height:90px;

    border-radius:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#18231f;

    font-size:40px;

    margin-bottom:15px;

}

.remote-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.remote-name{

    font-size:19px;

    font-weight:bold;

}

.call-status{

    margin-top:7px;

    color:#00e889;

    font-size:13px;

}


/* =========================================================
   الشريط العلوي
========================================================= */

.top-bar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:
        max(10px, env(safe-area-inset-top))
        12px
        12px;

    display:flex;

    align-items:center;

    gap:10px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.75),
            transparent
        );

    z-index:40;

}

.back-button{

    width:42px;
    height:42px;

    flex-shrink:0;

    border:0;

    border-radius:14px;

    background:
        rgba(24,35,31,.9);

    color:white;

    font-size:21px;

    cursor:pointer;

}

.top-info{

    min-width:0;

    flex:1;

}

.top-name{

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.top-status{

    margin-top:2px;

    font-size:11px;

    color:#00e889;

}


/* =========================================================
   فيديو المستخدم الصغير
========================================================= */

.local-video{

    position:absolute;

    left:12px;

    bottom:110px;

    width:105px;
    height:145px;

    object-fit:cover;

    background:#111916;

    border-radius:17px;

    border:
        2px solid
        rgba(0,232,137,.55);

    z-index:30;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.55);

    cursor:pointer;

    transition:
        all .25s ease;

}


/* =========================================================
   عندما يصبح فيديو المستخدم كبير
========================================================= */

.video-app.local-big
.local-video{

    inset:0;

    width:100%;
    height:100%;

    border:0;

    border-radius:0;

    z-index:10;

}


/* =========================================================
   فيديو الطرف الآخر يصبح صغير
========================================================= */

.video-app.local-big
.remote-video{

    top:auto;
    left:auto;

    right:12px;

    bottom:110px;

    width:105px;
    height:145px;

    border-radius:17px;

    border:
        2px solid
        rgba(0,232,137,.55);

    z-index:30;

    box-shadow:
        0 7px 25px
        rgba(0,0,0,.55);

    cursor:pointer;

    transition:
        all .25s ease;

}


/* =========================================================
   الأزرار
========================================================= */

.controls{

    position:absolute;

    left:0;
    right:0;

    bottom:
        max(12px, env(safe-area-inset-bottom));

    height:70px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    z-index:50;

}


/* =========================================================
   زر المايك والكاميرا
========================================================= */

.control-button{

    width:52px;
    height:52px;

    flex-shrink:0;

    border:0;

    border-radius:18px;

    background:#18231f;

    color:white;

    font-size:21px;

    cursor:pointer;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.4);

    display:flex;

    align-items:center;

    justify-content:center;

}

.control-button:active{

    transform:scale(.92);

}

.control-button.off{

    background:#522626;

}


/* =========================================================
   زر إنهاء المكالمة
========================================================= */

.end-button{

    width:58px;
    height:58px;

    flex-shrink:0;

    border:0;

    border-radius:20px;

    background:#e83f3f;

    color:white;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.45);

    display:flex;

    align-items:center;

    justify-content:center;

}

.end-button:active{

    transform:scale(.92);

}


/* =========================================================
   Loading
========================================================= */

.loading{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#020504;

    color:white;

    font-size:16px;

    z-index:100;

}


/* =========================================================
   Hidden
========================================================= */

.hidden{

    display:none !important;

}


/* =========================================================
   Error
========================================================= */

.error-box{

    position:absolute;

    left:15px;
    right:15px;

    bottom:95px;

    padding:14px;

    border-radius:15px;

    background:
        rgba(70,20,20,.95);

    color:#ffb3b3;

    text-align:center;

    font-size:13px;

    z-index:60;

}


/* =========================================================
   الهاتف
========================================================= */

@media(max-width:500px){

    .local-video{

        width:95px;
        height:135px;

        left:10px;

        bottom:105px;

        border-radius:15px;

    }


    .video-app.local-big
    .remote-video{

        width:95px;
        height:135px;

        right:10px;

        bottom:105px;

        border-radius:15px;

    }


    .control-button{

        width:50px;
        height:50px;

        border-radius:17px;

    }


    .end-button{

        width:56px;
        height:56px;

        border-radius:19px;

    }


    .controls{

        gap:10px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     Loading
======================================================== -->

<div id="loading"
     class="loading">

    جارٍ تشغيل مكالمة الفيديو...

</div>


<!-- =======================================================
     التطبيق
======================================================== -->

<main class="video-app">


    <!-- =====================================================
         فيديو الطرف الآخر
    ====================================================== -->

    <video
        id="remoteVideo"
        class="remote-video"
        autoplay
        playsinline>
    </video>


    <!-- =====================================================
         Placeholder
    ====================================================== -->

    <div
        id="remotePlaceholder"
        class="remote-placeholder">


        <div
            id="remoteAvatar"
            class="remote-avatar">

            👤

        </div>


        <div
            id="remoteName"
            class="remote-name">

            جارٍ التحميل...

        </div>


        <div
            id="callStatus"
            class="call-status">

            جارٍ الاتصال...

        </div>


    </div>


    <!-- =====================================================
         Top bar
    ====================================================== -->

    <div class="top-bar">


        <button
            id="backButton"
            class="back-button"
            type="button">

            →

        </button>


        <div class="top-info">


            <div
                id="topName"
                class="top-name">

                جارٍ الاتصال...

            </div>


            <div
                id="topStatus"
                class="top-status">

                جارٍ الاتصال...

            </div>


        </div>


    </div>


    <!-- =====================================================
         فيديو المستخدم
    ====================================================== -->

    <video
        id="localVideo"
        class="local-video"
        autoplay
        muted
        playsinline>
    </video>


    <!-- =====================================================
         Error
    ====================================================== -->

    <div
        id="errorBox"
        class="error-box hidden">
    </div>


    <!-- =====================================================
         Controls
    ====================================================== -->

    <div class="controls">


        <button
            id="muteButton"
            class="control-button"
            type="button">

            🎤

        </button>


        <button
            id="cameraButton"
            class="control-button"
            type="button">

            📹

        </button>


        <button
            id="endButton"
            class="end-button"
            type="button">

            ☎

        </button>


    </div>


</main>


<script
    type="module"
    src="./Video-call.js?v=3">
</script>


</body>

</html>
