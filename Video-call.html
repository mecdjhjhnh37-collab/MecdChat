<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Video Call</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

height:100vh;

font-family:Arial,Tahoma,sans-serif;

background:

radial-gradient(
circle at top,
#123d35,
transparent 40%
),

linear-gradient(
180deg,
#07110f,
#020504
);

color:white;

overflow:hidden;

}


.app{

height:100vh;

max-width:900px;

margin:auto;

display:flex;

flex-direction:column;

}


header{

height:70px;

display:flex;

align-items:center;

gap:12px;

padding:12px 15px;

background:#050807;

border-bottom:1px solid rgba(255,255,255,.08);

}


.back{

width:45px;

height:45px;

border:0;

border-radius:15px;

background:#18231f;

color:white;

font-size:22px;

cursor:pointer;

}


.title{

font-size:18px;

font-weight:bold;

flex:1;

}


.status{

font-size:13px;

color:#777;

}


.status.online{

color:#00e889;

}


/* الفيديو */

.video-area{

flex:1;

position:relative;

display:flex;

align-items:center;

justify-content:center;

padding:15px;

}


.remote-video{

width:100%;

height:100%;

background:#000;

border-radius:25px;

object-fit:cover;

}


.local-video{

position:absolute;

bottom:30px;

right:30px;

width:170px;

height:230px;

background:#111;

border-radius:20px;

object-fit:cover;

border:2px solid #00e889;

}


/* أزرار التحكم */

.controls{

height:90px;

display:flex;

align-items:center;

justify-content:center;

gap:15px;

background:#050807;

}


.control-btn{

width:60px;

height:60px;

border:0;

border-radius:20px;

background:#18231f;

color:white;

font-size:25px;

cursor:pointer;

}


.control-btn:hover{

background:#24352f;

}


.end-call{

background:#e80045;

}


.end-call:hover{

background:#ff155c;

}


.muted{

background:#00e889;

color:#00150e;

}


#loading{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

background:#020504;

z-index:999;

font-size:18px;

}


@media(max-width:600px){

.local-video{

width:120px;

height:170px;

right:15px;

bottom:20px;

}

}

</style>

</head>


<body>


<div id="loading">

جارٍ تجهيز الاتصال...

</div>


<main class="app" id="app" style="display:none">


<header>


<button class="back" id="backButton">

→

</button>


<div class="title">

📹 مكالمة فيديو

</div>


<div class="status" id="callStatus">

غير متصل

</div>


</header>



<div class="video-area">


<video

id="remoteVideo"

class="remote-video"

autoplay

playsinline>

</video>



<video

id="localVideo"

class="local-video"

autoplay

muted

playsinline>

</video>


</div>



<div class="controls">


<button

id="micButton"

class="control-btn">

🎤

</button>



<button

id="cameraButton"

class="control-btn">

📷

</button>



<button

id="endButton"

class="control-btn end-call">

📞

</button>


</div>


</main>



<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>


<script type="module" src="Video-call.js"></script>


</body>

</html>
