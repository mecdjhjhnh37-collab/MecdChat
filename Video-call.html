<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة فيديو</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

}

.video-app{

    width:100%;
    height:100dvh;

    max-width:650px;

    margin:auto;

    position:relative;

    overflow:hidden;

    background:#020504;

}


/* =========================================================
   فيديو الطرف الآخر - الفيديو الكبير
========================================================= */

.remote-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#07110f;

    z-index:1;

    cursor:pointer;

}


/* =========================================================
   فيديو المستخدم - صغير بالبداية
========================================================= */

.local-video{

    position:absolute;

    left:12px;
    bottom:92px;

    width:105px;
    height:145px;

    object-fit:cover;

    background:#111916;

    border-radius:17px;

    border:
        2px solid
        rgba(0,232,137,.55);

    z-index:20;

    box-shadow:
        0 6px 25px
        rgba(0,0,0,.55);

    cursor:pointer;

    transition:
        width .25s ease,
        height .25s ease,
        left .25s ease,
        right .25s ease,
        top .25s ease,
        bottom .25s ease,
        border-radius .25s ease;

}


/* =========================================================
   عند التبديل:
   المستخدم يصبح كبير
========================================================= */

.video-app.local-big .local-video{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    border:0;

    border-radius:0;

    object-fit:cover;

    z-index:5;

}


/* الطرف الآخر يصبح صغير */

.video-app.local-big .remote-video{

    left:auto;
    right:12px;
    top:82px;
    bottom:auto;

    width:105px;
    height:145px;

    border-radius:17px;

    border:
        2px solid
        rgba(0,232,137,.55);

    object-fit:cover;

    z-index:20;

    box-shadow:
        0 6px 25px
        rgba(0,0,0,.55);

}


/* =========================================================
   Placeholder
========================================================= */

.remote-placeholder{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #123d35,
            #020504 70%
        );

    z-index:2;

    pointer-events:none;

}

.remote-avatar{

    width:82px;
    height:82px;

    border-radius:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#18231f;

    font-size:36px;

    margin-bottom:12px;

}

.remote-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.remote-name{

    font-size:18px;

    font-weight:bold;

}

.call-status{

    margin-top:7px;

    color:#00e889;

    font-size:12px;

}


/* =========================================================
   الشريط العلوي
========================================================= */

.top-bar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:
        10px 12px;

    display:flex;

    align-items:center;

    gap:9px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.72),
            transparent
        );

    z-index:30;

}

.back-button{

    width:40px;
    height:40px;

    border:0;

    border-radius:13px;

    background:
        rgba(24,35,31,.9);

    color:white;

    font-size:20px;

    cursor:pointer;

}

.top-info{

    min-width:0;

    flex:1;

}

.top-name{

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.top-status{

    margin-top:2px;

    font-size:11px;

    color:#00e889;

}


/* =========================================================
   الأزرار
========================================================= */

.controls{

    position:absolute;

    bottom:14px;

    left:0;
    right:0;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    z-index:40;

}

.control-button{

    width:48px;
    height:48px;

    border:0;

    border-radius:16px;

    background:#18231f;

    color:white;

    font-size:20px;

    cursor:pointer;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.35);

}

.control-button:active{

    transform:scale(.94);

}

.control-button.off{

    background:#522626;

}

.end-button{

    width:54px;
    height:54px;

    border:0;

    border-radius:18px;

    background:#e83f3f;

    color:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.4);

}

.end-button:active{

    transform:scale(.94);

}


/* =========================================================
   رسالة الخطأ
========================================================= */

.error-box{

    position:absolute;

    left:15px;
    right:15px;

    bottom:90px;

    padding:12px;

    border-radius:14px;

    background:
        rgba(70,20,20,.95);

    color:#ffb3b3;

    text-align:center;

    font-size:12px;

    z-index:50;

}

.loading{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#020504;

    color:white;

    font-size:15px;

    z-index:100;

}

.hidden{

    display:none !important;

}


/* =========================================================
   شاشات الهاتف
========================================================= */

@media(max-width:500px){

    .local-video{

        width:92px;
        height:128px;

        left:10px;
        bottom:82px;

        border-radius:15px;

    }

    .video-app.local-big .remote-video{

        right:10px;
        top:70px;

        width:92px;
        height:128px;

        border-radius:15px;

    }

    .control-button{

        width:46px;
        height:46px;

        border-radius:15px;

        font-size:19px;

    }

    .
