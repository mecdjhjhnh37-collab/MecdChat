<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}


.card{

width:90%;
max-width:400px;

padding:40px 25px;

text-align:center;

border-radius:30px;

background:
rgba(0,60,40,.65);

border:1px solid rgba(0,255,145,.25);

box-shadow:
0 20px 60px rgba(0,0,0,.4);

}


.logo{

width:100px;
height:100px;

margin:0 auto 25px;

border-radius:30px;

display:flex;
align-items:center;
justify-content:center;

font-size:55px;

background:
rgba(0,255,145,.12);

}


h1{

font-size:38px;
margin-bottom:15px;

}


p{

color:#a8bdb6;
font-size:18px;
line-height:1.7;

}


button{

margin-top:30px;

width:100%;

padding:16px;

border:0;

border-radius:18px;

font-size:18px;

font-weight:bold;

cursor:pointer;

background:#00e889;

color:#00150e;

}


button:active{

transform:scale(.97);

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
💬
</div>


<h1>
Mecd Chat
</h1>


<p>
أهلاً بك 👋<br>
سجّل الدخول للبدء بالدردشة
</p>


<button>
🔵 تسجيل الدخول بواسطة Google
</button>


</div>


</body>

</html>
