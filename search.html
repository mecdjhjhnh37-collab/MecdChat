<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050807">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="Mecd Chat">

<title>Mecd Chat - بحث عن صديق</title>

<style>

*{

box-sizing:border-box;

margin:0;
padding:0;
}

body{

min-height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:

radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),

linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow-x:hidden;
}

.background{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

z-index:0;
}

.glow{

position:absolute;

width:300px;
height:300px;

border-radius:50%;

filter:blur(100px);

opacity:.18;
}

.glow.one{

background:#00e676;

top:-100px;
right:-100px;
}

.glow.two{

background:#2979ff;

bottom:-100px;
left:-100px;
}

.app{

position:relative;

z-index:1;

width:100%;

max-width:650px;

min-height:100vh;

margin:auto;

padding:22px 20px 45px;

display:flex;

flex-direction:column;
}

header{

display:flex;

align-items:center;

justify-content:space-between;

margin-bottom:30px;
}

.brand{

display:flex;

align-items:center;

gap:12px;
}

.logo{

width:52px;
height:52px;

display:flex;

align-items:center;
justify-content:center;

border-radius:16px;

font-size:27px;

background:

linear-gradient(
135deg,
#00e676,
#00a85a
);

box-shadow:

0 10px 30px
rgba(0,230,118,.22);
}

.brand h2{
font-size:21px;
}

.brand span{

display:block;

margin-top:4px;

color:#8d9a97;

font-size:12px;
}

.page-title{

text-align:center;

margin-bottom:35px;
}

.page-title h1{

font-size:
clamp(30px,7vw,45px);

margin-bottom:12px;
}

.page-title h1 span{

color:#00e676;
}

.page-title p{

color:#9ba7a4;

font-size:14px;

line-height:1.7;
}

.search-box{

padding:25px 20px;

border-radius:27px;

border:1px solid
rgba(255,255,255,.09);

background:
rgba(255,255,255,.035);

box-shadow:
0 20px 60px
rgba(0,0,0,.18);
}

.input-label{

display:block;

margin-bottom:10px;

font-size:16px;

color:#d4dfdc;
}

#searchInput{

width:100%;

padding:18px 20px;

border-radius:20px;

border:1px solid
rgba(255,255,255,.1);

outline:none;

background:#0d1714;

color:white;

font-family:inherit;

font-size:18px;

direction:ltr;

text-align:left;

transition:.2s ease;
}

#searchInput:focus{

border-color:#00e676;

box-shadow:
0 0 0 3px
rgba(0,230,118,.08);
}

.search-button{

width:100%;

margin-top:16px;

padding:18px;

border:none;

border-radius:19px;

background:#00e889;

color:#00150e;

font-family:inherit;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.2s ease;
}

.search-button:hover{

background:#00f294;

transform:translateY(-2px);
}

.search-button:active{

transform:scale(.98);
}

.result{

margin-top:28px;

padding:20px;

border-radius:25px;

border:1px solid
rgba(255,255,255,.09);

background:
rgba(255,255,255,.035);

display:none;
}

.result.show{
display:block;
}

.result-title{

color:#9ba7a4;

font-size:14px;

margin-bottom:17px;
}

.user-card{

display:flex;

align-items:center;

gap:15px;
}

.user-avatar{

width:70px;
height:70px;

flex-shrink:0;

border-radius:20px;

overflow:hidden;

display:flex;

align-items:center;
justify-content:center;

background:

linear-gradient(
135deg,
#293b37,
#15211e
);

border:3px solid
#00e676;

font-size:30px;
}

.user-avatar img{

width:100%;
height:100%;

object-fit:cover;
}

.user-info{

flex:1;

min-width:0;
}

.user-name{

font-size:21px;

font-weight:bold;

margin-bottom:7px;
}

.user-id{

color:#00e676;

font-size:14px;
}

.actions{

display:flex;

gap:9px;

margin-top:20px;

width:100%;
}

.send-button,
.cancel-button,
.friend-button{

border-radius:14px;

font-family:inherit;

font-size:13px;

font-weight:bold;

cursor:pointer;

transition:.2s ease;
}

.send-button{

flex:1;

padding:13px 8px;

border:none;

background:#00b968;

color:#00150e;
}

.send-button:hover{

background:#00d47a;
}

.cancel-button{

flex:1;

padding:13px 8px;

border:1px solid
rgba(255,100,100,.25);

background:
rgba(255,70,70,.08);

color:#ff9b9b;
}

.cancel-button:hover{

background:
rgba(255,70,70,.15);
}

.friend-button{

width:100%;

padding:14px;

border:none;

background:#00a85f;

color:#00150e;
}

.send-button:disabled,
.cancel-button:disabled{

opacity:.5;

cursor:not-allowed;
}

.status-text{

width:100%;

padding:11px 10px;

border-radius:13px;

background:
rgba(0,230,118,.08);

border:1px solid
rgba(0,230,118,.13);

color:#00e676;

text-align:center;

font-size:13px;

font-weight:bold;
}

.not-found{

margin-top:25px;

padding:30px 20px;

border-radius:22px;

border:1px solid
rgba(255,255,255,.07);

background:
rgba(255,255,255,.025);

text-align:center;

color:#899591;

font-size:14px;

line-height:1.8;

display:none;
}

.not-found.show{
display:block;
}

.not-found-icon{

font-size:42px;

margin-bottom:10px;
}

.message{

margin-top:15px;

padding:12px;

border-radius:13px;

text-align:center;

font-size:13px;

display:none;
}

.message.show{
display:block;
}

.message.success{

background:
rgba(0,230,118,.08);

color:#00e676;
}

.message.error{

background:
rgba(255,70,70,.08);

color:#ff9999;
}

.back-button{

width:100%;

margin-top:30px;

padding:17px;

border-radius:18px;

border:1px solid
rgba(255,255,255,.08);

background:
rgba(255,255,255,.035);

color:white;

font-family:inherit;

font-size:15px;

cursor:pointer;
}

footer{

margin-top:auto;

padding-top:40px;

text-align:center;

color:#58635f;

font-size:11px;
}

.loading{

position:fixed;

inset:0;

z-index:10000;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:18px;

background:
linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;

font-size:16px;
}

.spinner{

width:35px;
height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

@media(max-width:480px){

.app{

padding:18px 15px 35px;
}

.logo{

width:45px;
height:45px;

border-radius:14px;

font-size:23px;
}

.brand h2{
font-size:18px;
}

.page-title h1{
font-size:31px;
}

.search-box{
padding:20px 16px;
}

.user-avatar{

width:64px;
height:64px;

border-radius:18px;
}

.user-name{
font-size:18px;
}

.actions{

gap:7px;
}

.send-button,
.cancel-button{

font-size:12px;

padding:12px 5px;
}

}

</style>

</head>

<body>

<div class="background">

<div class="glow one"></div>
<div class="glow two"></div>

</div>


<div
id="loading"
class="loading"
>

<div class="spinner"></div>

<div>
جارٍ التحميل...
</div>

</div>


<main
id="app"
class="app"
style="display:none;"
>


<header>

<div class="brand">

<div class="logo">
💬
</div>

<div>

<h2>
Mecd Chat
</h2>

<span>
بحث عن صديق
</span>

</div>

</div>

</header>


<section class="page-title">

<h1>

بحث عن
<span>صديق</span>

</h1>

<p>

ابحث عن مستخدم في Mecd Chat باستخدام الـ ID الخاص به.

</p>

</section>


<section class="search-box">

<label
class="input-label"
for="searchInput"
>
ID الصديق
</label>


<input
id="searchInput"
type="text"
placeholder="MC-000003"
autocomplete="off"
>


<button
id="searchButton"
class="search-button"
type="button"
>
بحث
</button>


<div
id="message"
class="message"
>
</div>


<div
id="notFound"
class="not-found"
>

<div class="not-found-icon">
🔍
</div>

لم يتم العثور على مستخدم بهذا الـ ID.

</div>


<div
id="result"
class="result"
>

<div class="result-title">
تم العثور على المستخدم
</div>


<div class="user-card">

<div
id="userAvatar"
class="user-avatar"
>
👤
</div>


<div class="user-info">

<div
id="userName"
class="user-name"
>
مستخدم Mecd
</div>

<div
id="userId"
class="user-id"
>
</div>

</div>

</div>


<div
id="actions"
class="actions"
>
</div>


</div>

</section>


<button
id="backBtn"
class="back-button"
type="button"
>

← العودة إلى Mecd Chat

</button>


<footer>

Mecd Chat © 2026

</footer>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
deleteDoc,
collection,
getDocs,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const searchInput =
document.getElementById("searchInput");

const searchButton =
document.getElementById("searchButton");

const result =
document.getElementById("result");

const notFound =
document.getElementById("notFound");

const message =
document.getElementById("message");

const userAvatar =
document.getElementById("userAvatar");

const userName =
document.getElementById("userName");

const userId =
document.getElementById("userId");

const actions =
document.getElementById("actions");

const backBtn =
document.getElementById("backBtn");


let currentUser = null;

let foundUser = null;


function escapeHTML(text){

return String(text || "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function showMessage(text,type){

message.textContent = text;

message.className =
"message show " + type;

}


function hideMessage(){

message.textContent = "";

message.className =
"message";

}


function normalizeID(value){

return String(value || "")
.trim()
.toUpperCase()
.replace(/\s+/g,"");

}


/* =========================================
   GET USER BY CHAT ID
========================================= */

async function findUserByChatID(chatID){

const snap =
await getDocs(
collection(db,"users")
);

for(const userDoc of snap.docs){

const data =
userDoc.data();

const id =
normalizeID(
data.chatID ||
data.id ||
""
);

if(id === chatID){

return {

uid:userDoc.id,

name:
data.name ||
data.displayName ||
"مستخدم Mecd",

photo:
data.photo ||
data.photoURL ||
"",

chatID:
data.chatID ||
data.id ||
chatID

};

}

}

return null;

}


/* =========================================
   CHECK FRIEND
========================================= */

async function isFriend(uid){

const snap =
await getDoc(
doc(
db,
"users",
currentUser.uid,
"friends",
uid
)
);

return snap.exists();

}


/* =========================================
   FIND PENDING REQUEST
========================================= */

async function findPendingRequest(fromUid,toUid){

const snap =
await getDocs(
collection(db,"friendRequests")
);

for(const requestDoc of snap.docs){

const data =
requestDoc.data();

if(

data.fromUid === fromUid &&

data.toUid === toUid &&

data.status === "pending"

){

return {

id:requestDoc.id,

...data

};

}

}

return null;

}


/* =========================================
   SEARCH
========================================= */

async function searchUser(){

hideMessage();

result.classList.remove("show");

notFound.classList.remove("show");

actions.innerHTML = "";

const id =
normalizeID(
searchInput.value
);


if(!id){

showMessage(
"اكتب ID المستخدم أولاً.",
"error"
);

return;

}


searchButton.disabled = true;

searchButton.textContent =
"جاري البحث...";


try{

const user =
await findUserByChatID(id);


if(!user){

notFound.classList.add("show");

return;

}


if(user.uid === currentUser.uid){

result.classList.add("show");

userName.textContent =
"أنت";

userId.textContent =
"ID: " + user.chatID;

if(user.photo){

userAvatar.innerHTML = `

<img
src="${escapeHTML(user.photo)}"
alt="صورة المستخدم"
>

`;

}else{

userAvatar.innerHTML = "👤";

}

actions.innerHTML = `

<div class="status-text">

هذا هو حسابك أنت.

</div>

`;

return;

}


foundUser = user;


result.classList.add("show");

userName.textContent =
user.name;

userId.textContent =
"ID: " + user.chatID;


if(user.photo){

userAvatar.innerHTML = `

<img
src="${escapeHTML(user.photo)}"
alt="صورة المستخدم"
>

`;

}else{

userAvatar.innerHTML = "👤";

}


const alreadyFriend =
await isFriend(user.uid);


if(alreadyFriend){

actions.innerHTML = `

<div class="status-text">

✅ أنتم أصدقاء بالفعل

</div>

`;

return;

}


const pending =
await findPendingRequest(
currentUser.uid,
user.uid
);


if(pending){

showPendingButtons();

return;

}


const incoming =
await findPendingRequest(
user.uid,
currentUser.uid
);


if(incoming){

actions.innerHTML = `

<div class="status-text">

📩 أرسل لك هذا المستخدم طلب صداقة.
<br>
يمكنك قبول الطلب من صفحة الأصدقاء 🔔

</div>

`;

return;

}


showSendButton();


}catch(error){

console.error(
"Search error:",
error
);

showMessage(
"حدث خطأ أثناء البحث:\n" +
error.message,
"error"
);

}finally{

searchButton.disabled = false;

searchButton.textContent =
"بحث";

}

}


/* =========================================
   SEND BUTTON
========================================= */

function showSendButton(){

actions.innerHTML = `

<button
id="sendButton"
class="send-button"
type="button"
>
إرسال طلب صداقة
</button>

`;

const button =
document.getElementById(
"sendButton"
);

button.addEventListener(
"click",
sendFriendRequest
);

}


/* =========================================
   PENDING BUTTONS
========================================= */

function showPendingButtons(){

actions.innerHTML = `

<div
class="status-text"
>
تم إرسال الطلب مسبقاً
</div>

<button
id="cancelButton"
class="cancel-button"
type="button"
>
إلغاء الطلب
</button>

`;

const cancelButton =
document.getElementById(
"cancelButton"
);

cancelButton.addEventListener(
"click",
cancelFriendRequest
);

}


/* =========================================
   SEND REQUEST
========================================= */

async function sendFriendRequest(){

if(!foundUser)
return;


const button =
document.getElementById(
"sendButton"
);

if(button){

button.disabled = true;

button.textContent =
"جاري الإرسال...";
}


try{

const existing =
await findPendingRequest(
currentUser.uid,
foundUser.uid
);

if(existing){

showPendingButtons();

return;

}


const existingFriend =
await isFriend(
foundUser.uid
);

if(existingFriend){

actions.innerHTML = `

<div class="status-text">

✅ أنتم أصدقاء بالفعل

</div>

`;

return;

}


/*
   نستخدم ID ثابت للطلب.
   هذا يمنع إرسال طلبات مكررة.
*/

const requestID =
currentUser.uid +
"_" +
foundUser.uid;


await setDoc(

doc(
db,
"friendRequests",
requestID
),

{

fromUid:
currentUser.uid,

toUid:
foundUser.uid,

fromName:
currentUser.displayName ||
"مستخدم Mecd",

fromPhoto:
currentUser.photoURL ||
"",

status:
"pending",

createdAt:
serverTimestamp()

}

);


showPendingButtons();

showMessage(
"تم إرسال طلب الصداقة بنجاح.",
"success"
);


}catch(error){

console.error(
"Send request error:",
error
);

showMessage(
"تعذر إرسال طلب الصداقة:\n" +
error.message,
"error"
);

showSendButton();

}

}


/* =========================================
   CANCEL REQUEST
========================================= */

async function cancelFriendRequest(){

if(!foundUser)
return;


const button =
document.getElementById(
"cancelButton"
);

if(button){

button.disabled = true;

button.textContent =
"جاري الإلغاء...";
}


try{

const pending =
await findPendingRequest(
currentUser.uid,
foundUser.uid
);


if(!pending){

showSendButton();

showMessage(
"لا يوجد طلب صداقة لإلغائه.",
"error"
);

return;

}


await deleteDoc(

doc(
db,
"friendRequests",
pending.id
)

);


showSendButton();

showMessage(
"تم إلغاء طلب الصداقة.",
"success"
);


}catch(error){

console.error(
"Cancel request error:",
error
);

showMessage(
"تعذر إلغاء الطلب:\n" +
error.message,
"error"
);

showPendingButtons();

}

}


/* =========================================
   ENTER KEY
========================================= */

searchInput.addEventListener(
"keydown",
event=>{

if(event.key === "Enter"){

searchUser();

}

}
);


/* =========================================
   SEARCH BUTTON
========================================= */

searchButton.addEventListener(
"click",
searchUser
);


/* =========================================
   BACK
========================================= */

backBtn.addEventListener(
"click",
()=>{

window.location.href =
"./index.html";

}
);


/* =========================================
   AUTH
========================================= */

onAuthStateChanged(
auth,
user=>{

if(!user){

loading.style.display =
"none";

app.style.display =
"flex";

showMessage(
"يجب تسجيل الدخول أولاً.",
"error"
);

return;

}

currentUser = user;

loading.style.display =
"none";

app.style.display =
"flex";

}
);

</script>

</body>

</html>
