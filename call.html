<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050807">

<title>Mecd Chat - مكالمة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:Arial,Tahoma,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );
}


/* =========================================
   الصفحة
========================================= */

.call-page{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;

}


/* =========================================
   معلومات الشخص
========================================= */

.user-area{

    margin-top:95px;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

}


/* =========================================
   الصورة
========================================= */

.avatar{

    width:125px;
    height:125px;

    border-radius:38px;

    background:#12352c;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:55px;

    border:2px solid rgba(0,232,137,.15);

    box-shadow:
        0 15px 45px rgba(0,0,0,.35);

}


.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}


/* =========================================
   الاسم
========================================= */

.user-name{

    margin-top:20px;

    max-width:85vw;

    font-size:22px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================================
   الحالة
========================================= */

.call-status{

    margin-top:9px;

    color:#899792;

    font-size:14px;

}


.call-status.connected{

    color:#00e889;

}


/* =========================================
   الأزرار
========================================= */

.call-controls{

    position:absolute;

    bottom:105px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

}


.call-button{

    width:62px;
    height:62px;

    border:none;

    border-radius:20px;

    background:#18231f;

    color:white;

    font-size:25px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    box-shadow:
        0 8px 25px rgba(0,0,0,.3);

    transition:
        transform .15s ease,
        background .15s ease;

}


.call-button:active{

    transform:scale(.92);

}


.call-button.end{

    background:#d93636;

}


.call-button.muted{

    background:#00c96b;

    color:#00150e;

}


/* =========================================
   رسالة الخطأ
========================================= */

.error-box{

    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:calc(100% - 40px);

    max-width:400px;

    padding:22px;

    text-align:center;

    background:#0b1512;

    border:1px solid rgba(255,255,255,.08);

    border-radius:20px;

    display:none;

}


.error-box button{

    margin-top:15px;

    border:0;

    padding:11px 22px;

    border-radius:13px;

    background:#00e889;

    color:#00150e;

    font-weight:bold;

}


/* =========================================
   الصوت
========================================= */

#audioRemote{

    display:none;

}

</style>
</head>


<body>

<main class="call-page">


    <section class="user-area">


        <div id="friendAvatar"
             class="avatar">
            👤
        </div>


        <div id="friendName"
             class="user-name">
            مستخدم Mecd
        </div>


        <div id="callStatus"
             class="call-status">
            جارٍ الاتصال...
        </div>


    </section>


    <div class="call-controls">


        <button id="muteButton"
                class="call-button"
                type="button">
            🎤
        </button>


        <button id="endButton"
                class="call-button end"
                type="button">
            📞
        </button>


    </div>


    <audio id="audioRemote"
           autoplay
           playsinline>
    </audio>


    <div id="errorBox"
         class="error-box">

        <div id="errorText">
            حدث خطأ في المكالمة
        </div>

        <button id="backErrorButton"
                type="button">
            رجوع
        </button>

    </div>


</main>


<script type="module">

/* =========================================
   Firebase
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

    authDomain:
        "mecd-tools.firebaseapp.com",

    projectId:
        "mecd-tools",

    storageBucket:
        "mecd-tools.firebasestorage.app",

    messagingSenderId:
        "643005547408",

    appId:
        "1:643005547408:web:b1719060ec340dd0e0a915"

};


initializeApp(firebaseConfig);


/* =========================================
   عناصر الصفحة
========================================= */

const friendAvatar =
    document.getElementById(
        "friendAvatar"
    );

const friendName =
    document.getElementById(
        "friendName"
    );

const callStatus =
    document.getElementById(
        "callStatus"
    );

const muteButton =
    document.getElementById(
        "muteButton"
    );

const endButton =
    document.getElementById(
        "endButton"
    );

const audioRemote =
    document.getElementById(
        "audioRemote"
    );

const errorBox =
    document.getElementById(
        "errorBox"
    );

const errorText =
    document.getElementById(
        "errorText"
    );

const backErrorButton =
    document.getElementById(
        "backErrorButton"
    );


/* =========================================
   بيانات chat.html
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const callId =
    params.get("callId");


const mode =
    params.get("mode") ||
    "outgoing";


const name =
    params.get("name") ||
    "مستخدم Mecd";


const photo =
    params.get("photo") ||
    "";


/* =========================================
   عرض الاسم والصورة فوراً
========================================= */

friendName.textContent =
    name;


if(photo){

    const img =
        document.createElement(
            "img"
        );

    img.src = photo;

    img.alt = "صورة الحساب";

    img.onload = () => {

        friendAvatar.innerHTML = "";

        friendAvatar.appendChild(
            img
        );

    };

    img.onerror = () => {

        friendAvatar.textContent =
            "👤";

    };

}else{

    friendAvatar.textContent =
        "👤";

}


/* =========================================
   لا يوجد Call ID
========================================= */

if(!callId){

    showError(
        "لم يتم العثور على رقم المكالمة"
    );

}


/* =========================================
   تحميل call.js
========================================= */

let callSystem = null;


async function loadCallSystem(){

    try{

        callSystem =
            await import("./call.js");


        startCallProcess();

    }catch(error){

        console.error(
            "call.js error:",
            error
        );

        showError(
            "تعذر تشغيل نظام المكالمة"
        );

    }

}


/* =========================================
   تشغيل المكالمة
========================================= */

async function startCallProcess(){

    try{

        if(mode === "outgoing"){

            callStatus.textContent =
                "جارٍ الاتصال...";


            await callSystem
                .startOutgoingCall(
                    callId
                );

        }else{

            callStatus.textContent =
                "مكالمة واردة";


            await callSystem
                .watchIncomingCall(
                    callId
                );

        }

    }catch(error){

        console.error(
            "Call process error:",
            error
        );

        showError(
            error?.message ||
            "تعذر تشغيل المكالمة"
        );

    }

}


/* =========================================
   الصوت القادم
========================================= */

window.onRemoteStream =
    stream => {

        try{

            audioRemote.srcObject =
                stream;

            const playPromise =
                audioRemote.play();

            if(
                playPromise &&
                typeof playPromise.then ===
                "function"
            ){

                playPromise.catch(
                    error => {

                        console.log(
                            "Audio play waiting:",
                            error
                        );

                    }
                );

            }

        }catch(error){

            console.error(
                "Remote audio error:",
                error
            );

        }

    };


/* =========================================
   تم الاتصال
========================================= */

window.onCallConnected =
    () => {

        callStatus.textContent =
            "● متصل";

        callStatus.classList.add(
            "connected"
        );

    };


/* =========================================
   فشل الاتصال
========================================= */

window.onCallFailed =
    () => {

        callStatus.textContent =
            "تعذر الاتصال";

        callStatus.classList.remove(
            "connected"
        );

    };


/* =========================================
   انتهاء المكالمة
========================================= */

window.onCallEnded =
    () => {

        callStatus.textContent =
            "انتهت المكالمة";

        setTimeout(
            () => {

                window.location.href =
                    "chat.html";

            },
            900
        );

    };


/* =========================================
   كتم الميكروفون
========================================= */

let muted = false;


muteButton.onclick =
    () => {

        const stream =
            window.localStream;


        if(!stream){

            return;

        }


        const tracks =
            stream.getAudioTracks();


        if(!tracks.length){

            return;

        }


        muted =
            !muted;


        tracks.forEach(
            track => {

                track.enabled =
                    !muted;

            }
        );


        if(muted){

            muteButton.textContent =
                "🔇";

            muteButton.classList.add(
                "muted"
            );

        }else{

            muteButton.textContent =
                "🎤";

            muteButton.classList.remove(
                "muted"
            );

        }

    };


/* =========================================
   إنهاء المكالمة
========================================= */

let ending = false;


endButton.onclick =
    async () => {

        if(ending){

            return;

        }


        ending = true;


        endButton.disabled =
            true;


        try{

            if(callSystem){

                await callSystem
                    .cleanupCall(
                        callId
                    );

            }

        }catch(error){

            console.error(
                "End call error:",
                error
            );

        }


        window.location.href =
            "chat.html";

    };


/* =========================================
   إظهار الخطأ
========================================= */

function showError(message){

    errorText.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================
   رجوع
========================================= */

backErrorButton.onclick =
    () => {

        window.location.href =
            "chat.html";

    };


/* =========================================
   تشغيل
========================================= */

if(callId){

    loadCallSystem();

}

</script>

</body>
</html>
