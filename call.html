<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<meta name="theme-color" content="#020504">

<title>Mecd Chat - المكالمة</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

body{
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(
circle at 50% 15%,
#123d35 0%,
#07110f 35%,
#020504 75%
);
}

.call-page{
width:100%;
height:100vh;

display:flex;
flex-direction:column;
align-items:center;
justify-content:space-between;

padding:30px 20px 35px;
}

/* =========================
   الأعلى
========================= */

.top{
width:100%;
max-width:500px;

display:flex;
align-items:center;
justify-content:space-between;
}

.back{
width:45px;
height:45px;

border:0;
border-radius:15px;

background:rgba(24,35,31,.85);

color:white;
font-size:22px;

cursor:pointer;
}

.call-type{
color:#8d9b96;
font-size:13px;
}

/* =========================
   الشخص
========================= */

.person{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

width:100%;
margin-top:20px;
}

.avatar-wrap{
width:145px;
height:145px;

border-radius:45px;
padding:4px;

background:
linear-gradient(
145deg,
#00e889,
#087653,
#18231f
);

box-shadow:
0 0 45px
rgba(0,232,137,.16);
}

.avatar{
width:100%;
height:100%;

border-radius:41px;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:#12352c;

font-size:65px;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
margin-top:22px;

font-size:25px;
font-weight:bold;

max-width:90%;

overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.status{
margin-top:9px;

color:#8d9b96;
font-size:14px;
}

.status.connected{
color:#00e889;
}

.timer{
margin-top:8px;

font-size:13px;
color:#68756f;

min-height:18px;
}

/* =========================
   النبض
========================= */

.pulse{
width:190px;
height:190px;

position:absolute;

border-radius:50%;

border:
1px solid
rgba(0,232,137,.08);

animation:
pulse 2s infinite;

pointer-events:none;
}

@keyframes pulse{

0%{
transform:scale(.75);
opacity:.7;
}

70%{
transform:scale(1.25);
opacity:0;
}

100%{
transform:scale(1.25);
opacity:0;
}

}

/* =========================
   الأزرار
========================= */

.controls{
width:100%;
max-width:500px;

display:flex;
align-items:center;
justify-content:center;

gap:18px;
}

.control{
width:58px;
height:58px;

border:0;
border-radius:20px;

background:#18231f;
color:white;

font-size:22px;

cursor:pointer;

transition:.15s;
}

.control:active{
transform:scale(.94);
}

.control.active{
background:#00e889;
color:#00150e;
}

.end{
width:72px;
height:72px;

border:0;
border-radius:25px;

background:#d93636;
color:white;

font-size:28px;

cursor:pointer;

box-shadow:
0 10px 30px
rgba(217,54,54,.22);
}

.end:active{
transform:scale(.94);
}

/* =========================
   الخطأ
========================= */

.error{
position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

padding:25px;

background:#020504;

z-index:300;
}

.error-box{
width:100%;
max-width:380px;

padding:25px;

text-align:center;

border-radius:25px;

background:#0b1512;

border:
1px solid
rgba(255,255,255,.08);
}

.error-box h2{
font-size:20px;
margin-bottom:12px;
}

.error-box p{
color:#89958f;

font-size:14px;
line-height:1.7;

margin-bottom:20px;
}

.error-box button{
width:100%;

padding:13px;

border:0;
border-radius:15px;

background:#00e889;

color:#00150e;

font-weight:bold;
font-size:15px;

cursor:pointer;
}

/* =========================
   تحميل
========================= */

.loading{
position:fixed;
inset:0;

display:flex;

flex-direction:column;

align-items:center;
justify-content:center;

background:#020504;

z-index:200;
}

.spinner{
width:42px;
height:42px;

border:
3px solid
#18231f;

border-top-color:
#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;

margin-bottom:18px;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

/* =========================
   شاشة المكالمة الواردة
========================= */

.incoming-actions{
display:none;

position:fixed;

left:0;
right:0;
bottom:0;

padding:25px;

gap:15px;

z-index:400;
}

.incoming-actions button{
flex:1;

height:55px;

border:0;
border-radius:18px;

font-size:17px;
font-weight:bold;
}

.accept{
background:#00e889;
color:#00150e;
}

.reject{
background:#d93636;
color:white;
}

@media(max-height:650px){

.call-page{
padding-top:15px;
padding-bottom:20px;
}

.avatar-wrap{
width:110px;
height:110px;
}

.avatar{
border-radius:35px;
font-size:50px;
}

.name{
margin-top:13px;
font-size:21px;
}

.person{
margin-top:5px;
}

.control{
width:52px;
height:52px;
}

.end{
width:64px;
height:64px;
}

}

</style>

</head>

<body>

<!-- =========================
     التحميل
========================= -->

<div
id="loading"
class="loading">

<div class="spinner"></div>

<div id="loadingText">
جاري تجهيز المكالمة...
</div>

</div>


<!-- =========================
     الصفحة
========================= -->

<main
id="callPage"
class="call-page">

<div class="top">

<button
id="backButton"
class="back"
type="button">

→

</button>

<div class="call-type">

مكالمة صوتية

</div>

</div>


<section class="person">

<div
id="pulse"
class="pulse">
</div>


<div class="avatar-wrap">

<div
id="avatar"
class="avatar">

👤

</div>

</div>


<div
id="name"
class="name">

مستخدم Mecd

</div>


<div
id="status"
class="status">

جاري الاتصال...

</div>


<div
id="timer"
class="timer">
</div>

</section>


<div class="controls">

<button
id="muteButton"
class="control"
type="button">

🎤

</button>


<button
id="speakerButton"
class="control"
type="button">

🔊

</button>


<button
id="endButton"
class="end"
type="button">

☎

</button>

</div>

</main>


<!-- =========================
     الخطأ
========================= -->

<div
id="errorBox"
class="error">

<div class="error-box">

<h2>
⚠️ تعذر الاتصال
</h2>

<p id="errorText">
حدث خطأ أثناء إنشاء المكالمة.
</p>

<button
id="errorBack"
type="button">

العودة

</button>

</div>

</div>


<!-- الصوت القادم من الطرف الثاني -->

<audio
id="remoteAudio"
autoplay
playsinline>
</audio>


<script type="module">

import {
getAuth,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

startOutgoingCall,
acceptIncomingCall,
watchIncomingCall,
cleanupCall,
clearIncomingCall,
getCall,
rejectCall

} from "./call.js";


const $ =
id =>
document.getElementById(id);


const loading =
$("loading");

const loadingText =
$("loadingText");

const nameEl =
$("name");

const avatarEl =
$("avatar");

const statusEl =
$("status");

const timerEl =
$("timer");

const muteButton =
$("muteButton");

const speakerButton =
$("speakerButton");

const endButton =
$("endButton");

const backButton =
$("backButton");

const errorBox =
$("errorBox");

const errorText =
$("errorText");

const errorBack =
$("errorBack");

const remoteAudio =
$("remoteAudio");

const pulse =
$("pulse");


/* =========================
   الرابط
========================= */

const params =
new URLSearchParams(
location.search
);


const callId =
params.get("callId");

const mode =
params.get("mode");

const personName =
params.get("name") ||
"مستخدم Mecd";

const personPhoto =
params.get("photo") ||
"";


let ending =
false;

let accepted =
false;

let timerInterval =
null;

let seconds =
0;


/* =========================
   الشخص
========================= */

nameEl.textContent =
personName;


if(personPhoto){

avatarEl.innerHTML =
`<img src="${escapeHtml(personPhoto)}"
alt="صورة الحساب">`;

}


/* =========================
   حماية
========================= */

function escapeHtml(value){

return String(value).replace(
/[&<>'"]/g,
c => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c])
);

}


/* =========================
   الحالة
========================= */

function setStatus(
text,
connected=false
){

statusEl.textContent =
text;

statusEl.classList.toggle(
"connected",
connected
);

}


/* =========================
   المؤقت
========================= */

function startTimer(){

if(timerInterval)
return;

seconds=0;

timerInterval =
setInterval(() => {

seconds++;

const min =
Math.floor(
seconds / 60
)
.toString()
.padStart(2,"0");

const sec =
(seconds % 60)
.toString()
.padStart(2,"0");

timerEl.textContent =
`${min}:${sec}`;

},1000);

}


/* =========================
   الصوت
========================= */

window.onRemoteStream =
stream => {

remoteAudio.srcObject =
stream;

remoteAudio.play()
.catch(() => {});

};


/* =========================
   اتصال ناجح
========================= */

window.onCallConnected =
() => {

loading.style.display =
"none";

setStatus(
"● متصل",
true
);

pulse.style.display =
"none";

startTimer();

};


/* =========================
   خطأ
========================= */

window.onCallError =
message => {

showError(
message ||
"تعذر إنشاء الاتصال."
);

};


/* =========================
   انتهاء المكالمة
========================= */

window.onCallEnded =
() => {

if(ending)
return;

ending=true;

setStatus(
"انتهت المكالمة"
);

if(timerInterval){

clearInterval(
timerInterval
);

timerInterval=null;

}

setTimeout(
() => history.back(),
1000
);

};


/* =========================
   عرض الخطأ
========================= */

function showError(message){

loading.style.display =
"none";

errorText.textContent =
message ||
"حدث خطأ غير معروف.";

errorBox.style.display =
"flex";

}


/* =========================
   تنظيف
========================= */

async function finish(){

if(ending)
return;

ending=true;

if(timerInterval){

clearInterval(
timerInterval
);

timerInterval=null;

}

try{

await cleanupCall(
callId
);

await clearIncomingCall();

}catch(error){

console.error(
"Finish error:",
error
);

}

}


/* =========================
   إنهاء
========================= */

endButton.addEventListener(
"click",
async () => {

await finish();

history.back();

}
);


/* =========================
   رجوع
========================= */

backButton.addEventListener(
"click",
async () => {

await finish();

history.back();

}
);


/* =========================
   زر الخطأ
========================= */

errorBack.addEventListener(
"click",
async () => {

await finish();

history.back();

}
);


/* =========================
   كتم الميكروفون
========================= */

muteButton.addEventListener(
"click",
() => {

const stream =
window.localCallStream;

if(!stream)
return;

const tracks =
stream.getAudioTracks();

if(!tracks.length)
return;

const currentlyEnabled =
tracks[0].enabled;

tracks.forEach(
track => {

track.enabled =
!currentlyEnabled;

}
);

muteButton.textContent =
currentlyEnabled
? "🔇"
: "🎤";

muteButton.classList.toggle(
"active",
currentlyEnabled
);

}
);


/* =========================
   السماعة
========================= */

speakerButton.addEventListener(
"click",
() => {

const active =
speakerButton.classList.toggle(
"active"
);

speakerButton.textContent =
active
? "🔊"
: "🔈";

}
);


/* =========================
   التحقق
========================= */

if(!callId){

showError(
"رقم المكالمة غير موجود."
);

}


/* =========================
   تشغيل
========================= */

async function start(){

if(!callId)
return;

try{

if(mode === "outgoing"){

loadingText.textContent =
"جاري الاتصال...";

setStatus(
"جاري الاتصال..."
);

await startOutgoingCall(
callId
);

}

else if(mode === "incoming"){

loadingText.textContent =
"مكالمة واردة...";

setStatus(
"مكالمة واردة..."
);


/*
نراقب المكالمة حتى يصل Offer
*/

await watchIncomingCall(
callId
);


/*
انتظار Offer
*/

const waitForOffer =
setInterval(
async () => {

if(accepted)
return;

try{

const call =
await getCall(
callId
);


if(!call){

clearInterval(
waitForOffer
);

showError(
"المكالمة غير موجودة."
);

return;

}


if(
call.status ===
"ended"
){

clearInterval(
waitForOffer
);

window.onCallEnded?.();

return;

}


if(call.offer){

clearInterval(
waitForOffer
);


const answer =
confirm(
`📞 مكالمة واردة من ${personName}\n\nهل تريد الرد؟`
);


if(!answer){

await rejectCall(
callId
);

history.back();

return;

}


accepted=true;

setStatus(
"جاري الاتصال..."
);


await acceptIncomingCall(
callId
);

}

}catch(error){

console.error(
"Offer error:",
error
);

}

},
400
);

}

else{

showError(
"نوع المكالمة غير صحيح."
);

return;

}

}catch(error){

console.error(
"Call start error:",
error
);

showError(
error.message ||
"تعذر بدء المكالمة."
);

}

}


/* =========================
   Firebase
========================= */

const auth =
getAuth();


onAuthStateChanged(
auth,
user => {

if(!user){

showError(
"يجب تسجيل الدخول أولاً."
);

return;

}

start();

}
);


/* =========================
   مغادرة الصفحة
========================= */

window.addEventListener(
"pagehide",
() => {

if(!ending){

cleanupCall(
callId
);

}

});

</script>

</body>
</html>
