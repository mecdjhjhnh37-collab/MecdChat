<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Call</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial,Tahoma,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at 50% 20%,
            #123d35 0%,
            #07110f 45%,
            #020504 100%
        );

    display:flex;
    align-items:center;
    justify-content:center;
}

.call{
    width:100%;
    max-width:650px;
    height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;

    padding:55px 25px 40px;
}


/* =========================
   الحالة
========================= */

.status{
    color:#00e889;
    font-size:14px;
    font-weight:bold;
    margin-top:10px;
}


/* =========================
   صورة المستخدم
========================= */

.avatar{
    width:125px;
    height:125px;

    border-radius:38px;

    background:#12352c;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:55px;

    border:3px solid
        rgba(0,232,137,.18);

    box-shadow:
        0 0 35px
        rgba(0,232,137,.12);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* =========================
   معلومات المستخدم
========================= */

.info{
    text-align:center;
}

.name{
    margin-top:20px;

    font-size:24px;
    font-weight:bold;

    max-width:320px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.type{
    margin-top:8px;

    color:#7f918b;
    font-size:14px;
}


/* =========================
   أزرار التحكم
========================= */

.controls{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:18px;
}

.control{
    width:62px;
    height:62px;

    border:0;
    border-radius:21px;

    background:#18231f;

    color:white;

    font-size:25px;

    cursor:pointer;

    transition:
        transform .15s,
        background .15s;
}

.control:active{
    transform:scale(.92);
}

.control.active{
    background:#00e889;
    color:#00150e;
}


/* =========================
   زر إنهاء المكالمة
========================= */

.end{
    width:72px;
    height:72px;

    border:0;
    border-radius:25px;

    background:#d93636;

    color:white;

    font-size:30px;

    cursor:pointer;

    transition:
        transform .15s;
}

.end:active{
    transform:scale(.92);
}


/* =========================
   رسالة الخطأ
========================= */

.error{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:25px;

    background:#020504;

    z-index:100;
}

.error-box{
    width:100%;
    max-width:400px;

    padding:25px;

    border-radius:22px;

    background:#0b1512;

    border:1px solid
        rgba(255,255,255,.08);

    text-align:center;
}

.error-box h2{
    margin-bottom:12px;
}

.error-box p{
    color:#9aa8a3;
    line-height:1.7;
}

.error-box button{
    margin-top:20px;

    width:100%;
    padding:14px;

    border:0;
    border-radius:15px;

    background:#00e889;
    color:#00150e;

    font-weight:bold;
    font-size:15px;

    cursor:pointer;
}


/* =========================
   صوت مخفي
========================= */

#remoteAudio{
    display:none;
}

</style>
</head>


<body>


<div class="call">


    <!-- =========================
         معلومات الاتصال
    ========================== -->

    <div class="info">

        <div
            id="avatar"
            class="avatar">
            👤
        </div>

        <div
            id="name"
            class="name">
            جارٍ الاتصال...
        </div>

        <div
            id="type"
            class="type">
            مكالمة صوتية
        </div>

        <div
            id="status"
            class="status">
            جاري الاتصال...
        </div>

    </div>


    <!-- =========================
         أزرار التحكم
    ========================== -->

    <div class="controls">

        <button
            id="muteButton"
            class="control"
            type="button"
            title="كتم الميكروفون">
            🎤
        </button>


        <button
            id="speakerButton"
            class="control"
            type="button"
            title="مكبر الصوت">
            🔊
        </button>


        <button
            id="endButton"
            class="end"
            type="button"
            title="إنهاء المكالمة">
            📞
        </button>

    </div>

</div>


<!-- =========================
     الصوت القادم
========================= -->

<audio
    id="remoteAudio"
    autoplay
    playsinline>
</audio>


<!-- =========================
     شاشة الخطأ
========================= -->

<div
    id="error"
    class="error">

    <div class="error-box">

        <h2>
            ⚠️ حدث خطأ
        </h2>

        <p id="errorText">
            تعذر تشغيل المكالمة.
        </p>

        <button
            id="errorButton"
            type="button">
            العودة
        </button>

    </div>

</div>


<script type="module">

import {
    startOutgoingCall,
    acceptIncomingCall,
    watchIncomingCall,
    cleanupCall,
    getCall,
    clearIncomingCall
}
from "./call.js";


/* =========================
   عناصر الصفحة
========================= */

const avatar =
    document.getElementById("avatar");

const name =
    document.getElementById("name");

const type =
    document.getElementById("type");

const status =
    document.getElementById("status");

const muteButton =
    document.getElementById("muteButton");

const speakerButton =
    document.getElementById("speakerButton");

const endButton =
    document.getElementById("endButton");

const remoteAudio =
    document.getElementById("remoteAudio");

const error =
    document.getElementById("error");

const errorText =
    document.getElementById("errorText");

const errorButton =
    document.getElementById("errorButton");


/* =========================
   بيانات الرابط
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const callId =
    params.get("callId");

const mode =
    params.get("mode");

const callerName =
    params.get("name") ||
    "مستخدم Mecd";

const callerPhoto =
    params.get("photo") ||
    "";


/* =========================
   حالة الصفحة
========================= */

let ended = false;
let muted = false;
let speaker = true;


/* =========================
   عرض معلومات المستخدم
========================= */

function showUser(
    userName,
    userPhoto
){

    name.textContent =
        userName ||
        "مستخدم Mecd";


    if(userPhoto){

        avatar.innerHTML =
            `<img src="${
                escapeHtml(userPhoto)
            }" alt="صورة الحساب">`;

    }else{

        avatar.textContent =
            "👤";

    }

}


/* =========================
   حماية HTML
========================= */

function escapeHtml(value){

    return String(value).replace(
        /[&<>'"]/g,
        c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            "'":'&#39;',
            '"':'&quot;'
        }[c])
    );

}


/* =========================
   عرض الخطأ
========================= */

function showError(message){

    errorText.textContent =
        message ||
        "تعذر تشغيل المكالمة.";

    error.style.display =
        "flex";

}


/* =========================
   استقبال الصوت
========================= */

window.onRemoteStream =
    stream => {

        try{

            remoteAudio.srcObject =
                stream;

            remoteAudio.muted =
                false;

            remoteAudio.volume =
                speaker ? 1 : 0;

            remoteAudio.play()
                .catch(() => {});

            status.textContent =
                "● متصل";

        }catch(e){

            console.error(
                "Remote audio error:",
                e
            );

        }

    };


/* =========================
   عند انتهاء المكالمة
========================= */

window.onCallEnded =
    () => {

        if(ended)
            return;

        ended = true;

        status.textContent =
            "انتهت المكالمة";

        setTimeout(
            () => {
                window.history.back();
            },
            1000
        );

    };


/* =========================
   كتم الميكروفون
========================= */

muteButton.addEventListener(
    "click",
    () => {

        const stream =
            window.localStream;

        if(!stream){

            /*
             * call.js يحتفظ بالـ stream داخلياً،
             * لذلك إذا لم يكن مكشوفاً لا نفعل شيئاً.
             */

            alert(
                "🎤 الميكروفون لم يبدأ بعد"
            );

            return;

        }

        const tracks =
            stream.getAudioTracks();

        if(!tracks.length)
            return;

        muted =
            !muted;

        tracks.forEach(
            track => {
                track.enabled =
                    !muted;
            }
        );

        muteButton.textContent =
            muted
            ? "🔇"
            : "🎤";

        muteButton.classList.toggle(
            "active",
            muted
        );

    }
);


/* =========================
   مكبر الصوت
========================= */

speakerButton.addEventListener(
    "click",
    () => {

        speaker =
            !speaker;

        remoteAudio.volume =
            speaker ? 1 : 0;

        speakerButton.textContent =
            speaker
            ? "🔊"
            : "🔇";

        speakerButton.classList.toggle(
            "active",
            !speaker
        );

    }
);


/* =========================
   إنهاء المكالمة
========================= */

async function end(){

    if(ended)
        return;

    ended = true;

    status.textContent =
        "جاري إنهاء المكالمة...";

    try{

        await cleanupCall(
            callId
        );

    }catch(e){

        console.error(
            "End error:",
            e
        );

    }

    setTimeout(
        () => {
            window.history.back();
        },
        300
    );

}


endButton.addEventListener(
    "click",
    end
);


/* =========================
   زر الخطأ
========================= */

errorButton.addEventListener(
    "click",
    () => {

        window.history.back();

    }
);


/* =========================
   تشغيل المكالمة
========================= */

async function init(){

    try{

        if(!callId){

            throw new Error(
                "رقم المكالمة غير موجود"
            );

        }


        /* =========================
           المكالمة الصادرة
        ========================== */

        if(mode === "outgoing"){

            const call =
                await getCall(
                    callId
                );

            if(!call){

                throw new Error(
                    "المكالمة غير موجودة"
                );

            }

            showUser(
                call.receiverName,
                call.receiverPhoto
            );

            status.textContent =
                "جاري الاتصال...";


            await startOutgoingCall(
                callId
            );


            status.textContent =
                "في انتظار الرد...";

        }


        /* =========================
           المكالمة الواردة
        ========================== */

        else if(mode === "incoming"){

            showUser(
                callerName,
                callerPhoto
            );

            type.textContent =
                "📞 مكالمة واردة";

            status.textContent =
                "مكالمة واردة";


            /*
             * هنا نعرض نافذة قبول
             */

            const accept =
                confirm(
                    "📞 " +
                    callerName +
                    "\n\nهل تريد قبول المكالمة؟"
                );


            if(!accept){

                await cleanupCall(
                    callId
                );

                await clearIncomingCall();

                window.history.back();

                return;

            }


            status.textContent =
                "جاري الاتصال...";


            await clearIncomingCall();


            await acceptIncomingCall(
                callId
            );


            status.textContent =
                "● متصل";

        }


        else{

            throw new Error(
                "نوع المكالمة غير معروف"
            );

        }


        /* =========================
           مراقبة المكالمة
        ========================== */

        if(mode === "incoming"){

            await watchIncomingCall(
                callId
            );

        }

    }catch(e){

        console.error(
            "Call page error:",
            e
        );

        showError(
            e.message ||
            "تعذر تشغيل المكالمة"
        );

    }

}


/* =========================
   بدء الصفحة
========================= */

init();


/* =========================
   منع الخروج بدون تنظيف
========================= */

window.addEventListener(
    "pagehide",
    () => {

        if(
            !ended &&
            callId
        ){

            cleanupCall(
                callId
            );

        }

    }
);

</script>

</body>
</html>
