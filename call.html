<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة صوتية</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Tahoma,sans-serif;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    color:white;

    overflow:hidden;
}

.call-app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    position:relative;

    background:
        radial-gradient(
            circle,
            #12352c,
            #020504 70%
        );
}

.top-bar{
    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:18px 15px;

    display:flex;
    align-items:center;

    gap:12px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.7),
            transparent
        );
}

.back{
    width:45px;
    height:45px;

    border:0;
    border-radius:15px;

    background:#18231f;

    color:white;

    font-size:22px;

    cursor:pointer;
}

.info{
    flex:1;
}

.name{
    font-size:18px;
    font-weight:bold;
}

.status{
    margin-top:5px;

    color:#00e889;

    font-size:12px;
}

.avatar{
    width:125px;
    height:125px;

    border-radius:35px;

    overflow:hidden;

    background:#18231f;

    border:
        2px solid
        rgba(0,232,137,.2);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:55px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.5);
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.center-name{
    margin-top:22px;

    font-size:25px;

    font-weight:bold;
}

.center-status{
    margin-top:8px;

    font-size:14px;

    color:#00e889;
}

.timer{
    margin-top:8px;

    font-size:13px;

    color:#89958f;
}

.controls{
    position:absolute;

    bottom:30px;

    left:50%;

    transform:
        translateX(-50%);

    display:flex;

    gap:15px;
}

.control{
    width:60px;
    height:60px;

    border:0;

    border-radius:50%;

    background:#18231f;

    color:white;

    font-size:23px;

    cursor:pointer;
}

.control.off{
    background:#4b2222;
}

.end{
    width:68px;
    height:68px;

    border:0;

    border-radius:50%;

    background:#e53935;

    color:white;

    font-size:25px;

    cursor:pointer;
}

.loading{
    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#020504;
}

.loading.hidden{
    display:none;
}

.spinner{
    width:42px;
    height:42px;

    border:
        4px solid
        rgba(255,255,255,.12);

    border-top-color:#00e889;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

.loading-text{
    margin-top:15px;

    color:#aaa;

    font-size:14px;
}

.error{
    position:fixed;

    inset:0;

    z-index:200;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#020504;

    text-align:center;
}

.error.hidden{
    display:none;
}

.error-card{
    width:100%;
    max-width:380px;

    padding:25px;

    border-radius:22px;

    background:#111916;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.error-title{
    color:#ff6464;

    font-size:20px;

    font-weight:bold;

    margin-bottom:12px;
}

#errorMessage{
    color:#aaa;

    font-size:13px;

    line-height:1.7;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:500px){

    .avatar{
        width:110px;
        height:110px;
    }

    .center-name{
        font-size:22px;
    }

    .control{
        width:55px;
        height:55px;
    }

    .end{
        width:63px;
        height:63px;
    }

}

</style>

</head>

<body>

<div class="call-app">

    <div class="top-bar">

        <button
            id="backButton"
            class="back"
            type="button">

            →

        </button>

        <div class="info">

            <div
                id="topName"
                class="name">

                جارٍ الاتصال...

            </div>

            <div
                id="topStatus"
                class="status">

                جارٍ الاتصال...

            </div>

        </div>

    </div>


    <div
        id="avatar"
        class="avatar">

        👤

    </div>


    <div
        id="centerName"
        class="center-name">

        جارٍ الاتصال...

    </div>


    <div
        id="centerStatus"
        class="center-status">

        جارٍ الاتصال...

    </div>


    <div
        id="timer"
        class="timer">

        00:00

    </div>


    <div class="controls">

        <button
            id="muteButton"
            class="control"
            type="button">

            🎤

        </button>

        <button
            id="speakerButton"
            class="control"
            type="button">

            🔊

        </button>

        <button
            id="endButton"
            class="end"
            type="button">

            ☎

        </button>

    </div>

</div>


<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    <div class="loading-text">

        جارٍ تجهيز المكالمة...

    </div>

</div>


<div
    id="errorBox"
    class="error hidden">

    <div class="error-card">

        <div class="error-title">

            ⚠️ تعذر الاتصال

        </div>

        <div id="errorMessage"></div>

    </div>

</div>


<script
    type="module"
    src="./call-page.js">
</script>

</body>
</html>
