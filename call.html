<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Call</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
height:100vh;
font-family:Arial,Tahoma,sans-serif;
color:white;

background:
radial-gradient(circle at top,#123d35,transparent 45%),
linear-gradient(180deg,#07110f,#020504);

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;
}

.call-screen{
width:100%;
max-width:650px;
height:100vh;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

padding:30px;
text-align:center;
}

.avatar{
width:130px;
height:130px;

border-radius:40px;

background:#098dcc;

display:flex;
align-items:center;
justify-content:center;

font-size:60px;

overflow:hidden;

box-shadow:
0 10px 40px rgba(0,0,0,.45);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
font-size:27px;
font-weight:bold;
margin-top:25px;
}

.status{
font-size:16px;
color:#899590;
margin-top:10px;
}

.status.ringing{
color:#00e889;
}

.buttons{
display:flex;
gap:35px;
margin-top:70px;
}

.call-btn{
width:70px;
height:70px;

border:0;
border-radius:50%;

font-size:28px;

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;
}

.cancel{
background:#e53935;
color:white;
}

.accept{
background:#00e889;
color:#00150e;
}

.hidden{
display:none;
}
</style>

</head>

<body>

<div class="call-screen">

<div
id="avatar"
class="avatar">
👤
</div>

<div
id="name"
class="name">
جارٍ التحميل...
</div>

<div
id="status"
class="status">
جاري الاتصال...
</div>

<div
id="buttons"
class="buttons">

<button
id="cancelButton"
class="call-btn cancel"
type="button">
📞
</button>

<button
id="acceptButton"
class="call-btn accept hidden"
type="button">
📞
</button>

</div>

</div>


<script type="module">

/*
================================
Mecd Call
الخطوة الأولى
================================
*/

const params =
new URLSearchParams(
location.search
);

const name =
params.get("name") ||
"مستخدم Mecd";

const photo =
params.get("photo") ||
"";

const mode =
params.get("mode") ||
"outgoing";


const nameElement =
document.getElementById("name");

const avatarElement =
document.getElementById("avatar");

const statusElement =
document.getElementById("status");

const cancelButton =
document.getElementById("cancelButton");

const acceptButton =
document.getElementById("acceptButton");


nameElement.textContent =
name;


if(photo){

avatarElement.innerHTML =
`<img src="${photo}" alt="">`;

}


if(mode==="incoming"){

statusElement.textContent =
"📞 مكالمة واردة";

statusElement.classList.add(
"ringing"
);

acceptButton.classList.remove(
"hidden"
);

}else{

statusElement.textContent =
"جاري الاتصال...";

}


cancelButton.addEventListener(
"click",
()=>{

window.close();

history.back();

}
);


acceptButton.addEventListener(
"click",
()=>{

statusElement.textContent =
"تم قبول المكالمة";

acceptButton.classList.add(
"hidden"
);

}
);

</script>

</body>
</html>
