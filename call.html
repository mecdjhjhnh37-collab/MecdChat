<script type="module">

import {
    getAuth,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getApps,
    getApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    startOutgoingCall,
    acceptIncomingCall,
    watchIncomingCall,
    cleanupCall,
    clearIncomingCall,
    getCall
} from "./call.js";


const $ =
    id =>
    document.getElementById(id);


const loading =
    $("loading");

const nameEl =
    $("name");

const avatarEl =
    $("avatar");

const statusEl =
    $("status");

const timerEl =
    $("timer");

const muteButton =
    $("muteButton");

const speakerButton =
    $("speakerButton");

const endButton =
    $("endButton");

const backButton =
    $("backButton");

const errorBox =
    $("errorBox");

const errorText =
    $("errorText");

const errorBack =
    $("errorBack");

const remoteAudio =
    $("remoteAudio");

const pulse =
    $("pulse");


const params =
    new URLSearchParams(
        location.search
    );


const callId =
    params.get("callId");

const mode =
    params.get("mode");

const personName =
    params.get("name") ||
    "مستخدم Mecd";

const personPhoto =
    params.get("photo") ||
    "";


let ending =
    false;

let timerInterval =
    null;

let seconds =
    0;

let offerInterval =
    null;


/* =================================
   عرض الشخص
================================= */

nameEl.textContent =
    personName;


if(personPhoto){

    avatarEl.innerHTML =
        `<img src="${escapeHtml(personPhoto)}"
              alt="صورة الحساب">`;

}


/* =================================
   حماية HTML
================================= */

function escapeHtml(value){

    return String(value).replace(
        /[&<>'"]/g,
        c => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            "'":"&#39;",
            '"':"&quot;"
        }[c])
    );

}


/* =================================
   الحالة
================================= */

function setStatus(
    text,
    connected = false
){

    statusEl.textContent =
        text;

    statusEl.classList.toggle(
        "connected",
        connected
    );

}


/* =================================
   المؤقت
================================= */

function startTimer(){

    if(timerInterval)
        return;

    seconds =
        0;

    timerInterval =
        setInterval(() => {

            seconds++;

            const min =
                Math.floor(
                    seconds / 60
                )
                .toString()
                .padStart(2,"0");

            const sec =
                (seconds % 60)
                .toString()
                .padStart(2,"0");

            timerEl.textContent =
                `${min}:${sec}`;

        },1000);

}


/* =================================
   الصوت القادم
================================= */

window.onRemoteStream =
    stream => {

        remoteAudio.srcObject =
            stream;

        remoteAudio.autoplay =
            true;

        remoteAudio.play()
            .catch(
                error => {

                    console.log(
                        "Audio autoplay:",
                        error
                    );

                }
            );

    };


/* =================================
   اتصال ناجح
================================= */

window.onCallConnected =
    () => {

        loading.style.display =
            "none";

        setStatus(
            "● متصل",
            true
        );

        pulse.style.display =
            "none";

        startTimer();

    };


/* =================================
   انتهاء المكالمة
================================= */

window.onCallEnded =
    () => {

        if(ending)
            return;

        ending =
            true;


        if(offerInterval){

            clearInterval(
                offerInterval
            );

            offerInterval =
                null;

        }


        setStatus(
            "انتهت المكالمة"
        );


        if(timerInterval){

            clearInterval(
                timerInterval
            );

            timerInterval =
                null;

        }


        setTimeout(
            () => {

                history.back();

            },
            800
        );

    };


/* =================================
   خطأ
================================= */

window.onCallError =
    message => {

        console.error(
            "Call error:",
            message
        );

        showError(
            message
        );

    };


function showError(
    message
){

    loading.style.display =
        "none";

    errorText.textContent =
        message ||
        "حدث خطأ أثناء إنشاء المكالمة.";

    errorBox.style.display =
        "flex";

}


/* =================================
   تنظيف
================================= */

async function finish(){

    if(ending)
        return;


    ending =
        true;


    if(offerInterval){

        clearInterval(
            offerInterval
        );

        offerInterval =
            null;

    }


    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }


    try{

        await cleanupCall(
            callId
        );

        await clearIncomingCall();

    }catch(error){

        console.error(
            "Finish:",
            error
        );

    }

}


/* =================================
   إنهاء
================================= */

endButton.addEventListener(
    "click",
    async () => {

        await finish();

        history.back();

    }
);


/* =================================
   رجوع
================================= */

backButton.addEventListener(
    "click",
    async () => {

        await finish();

        history.back();

    }
);


/* =================================
   زر الخطأ
================================= */

errorBack.addEventListener(
    "click",
    async () => {

        await finish();

        history.back();

    }
);


/* =================================
   كتم الميكروفون
================================= */

muteButton.addEventListener(
    "click",
    () => {

        const stream =
            window.localCallStream;


        if(!stream){

            return;

        }


        const tracks =
            stream.getAudioTracks();


        if(!tracks.length){

            return;

        }


        const currentlyEnabled =
            tracks[0].enabled;


        tracks.forEach(
            track => {

                track.enabled =
                    !currentlyEnabled;

            }
        );


        muteButton.textContent =
            currentlyEnabled
            ? "🔇"
            : "🎤";


        muteButton.classList.toggle(
            "active",
            currentlyEnabled
        );

    }
);


/* =================================
   زر السماعة
================================= */

speakerButton.addEventListener(
    "click",
    () => {

        const active =
            speakerButton.classList.toggle(
                "active"
            );


        speakerButton.textContent =
            active
            ? "🔊"
            : "🔈";


        /*
         * المتصفح لا يسمح دائماً
         * بالتحكم بمخرج الصوت في الهاتف.
         *
         * لذلك الزر يغيّر الحالة
         * فقط عندما لا يدعم الجهاز
         * تغيير Audio Output.
         */

        if(
            "setSinkId" in remoteAudio
        ){

            /*
             * لا يوجد مخرج صوت محدد
             * يمكن اختياره من الويب
             * في أغلب الهواتف.
             */

        }

    }
);


/* =================================
   التحقق
================================= */

if(!callId){

    showError(
        "رقم المكالمة غير موجود."
    );

}


else if(
    mode !== "incoming" &&
    mode !== "outgoing"
){

    showError(
        "نوع المكالمة غير صحيح."
    );

}


/* =================================
   تشغيل
================================= */

async function start(){

    if(
        !callId ||
        ending
    ){

        return;

    }


    try{

        /* =========================
           صادر
        ========================= */

        if(
            mode ===
            "outgoing"
        ){

            setStatus(
                "جاري الاتصال..."
            );


            loading.style.display =
                "flex";


            await startOutgoingCall(
                callId
            );


            return;

        }


        /* =========================
           وارد
        ========================= */

        setStatus(
            "مكالمة واردة..."
        );


        loading.style.display =
            "flex";


        await watchIncomingCall(
            callId
        );


        /*
         * ننتظر وصول Offer.
         */

        let accepted =
            false;


        offerInterval =
            setInterval(
                async () => {

                    if(
                        accepted ||
                        ending
                    ){

                        return;

                    }


                    try{

                        const call =
                            await getCall(
                                callId
                            );


                        /*
                         * المكالمة انتهت
                         */

                        if(
                            !call ||
                            call.status ===
                            "ended"
                        ){

                            clearInterval(
                                offerInterval
                            );

                            offerInterval =
                                null;

                            window.onCallEnded?.();

                            return;

                        }


                        /*
                         * وصل Offer
                         */

                        if(
                            call.offer
                        ){

                            clearInterval(
                                offerInterval
                            );

                            offerInterval =
                                null;


                            const answer =
                                confirm(
                                    `📞 مكالمة واردة من ${personName}\n\nهل تريد الرد؟`
                                );


                            if(!answer){

                                ending =
                                    true;


                                try{

                                    await cleanupCall(
                                        callId
                                    );

                                    await clearIncomingCall();

                                }catch(error){

                                    console.error(
                                        error
                                    );

                                }


                                history.back();

                                return;

                            }


                            accepted =
                                true;


                            setStatus(
                                "جاري الاتصال..."
                            );


                            await acceptIncomingCall(
                                callId
                            );

                        }

                    }catch(error){

                        console.error(
                            "Offer error:",
                            error
                        );

                    }

                },
                400
            );

    }catch(error){

        console.error(
            "Start call:",
            error
        );


        showError(
            error.message ||
            "تعذر بدء المكالمة."
        );

    }

}


/* =================================
   Firebase Auth
================================= */

const firebaseApp =
    getApps().length
        ? getApp()
        : null;


if(!firebaseApp){

    showError(
        "Firebase لم يتم تشغيله."
    );

}else{

    const auth =
        getAuth(
            firebaseApp
        );


    onAuthStateChanged(
        auth,
        user => {

            if(!user){

                showError(
                    "يجب تسجيل الدخول أولاً."
                );

                return;

            }


            start();

        }
    );

}


/* =================================
   مغادرة الصفحة
================================= */

window.addEventListener(
    "pagehide",
    () => {

        if(
            !ending &&
            callId
        ){

            /*
             * لا ننتظر Promise هنا لأن
             * الصفحة قد تكون في طريقها للإغلاق.
             */

            cleanupCall(
                callId
            );

        }

    }
);

</script>
