<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat - مكالمة</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;

    font-family:Arial,Tahoma,sans-serif;
    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 42%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );
}

.call-page{
    width:100%;
    height:100vh;
    max-width:650px;
    margin:auto;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;
}

.top{
    width:100%;
    padding:20px 18px 0;
    text-align:center;

    font-size:14px;
    color:#71807b;
}

.person{
    width:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    margin-top:45px;
}

.avatar{
    width:125px;
    height:125px;

    border-radius:38px;
    overflow:hidden;

    background:#12352c;

    border:2px solid rgba(0,232,137,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:55px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.35);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.name{
    margin-top:20px;

    max-width:90%;

    font-size:23px;
    font-weight:bold;

    text-align:center;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.status{
    margin-top:9px;

    font-size:14px;
    color:#00e889;
}

.status.ended{
    color:#777;
}

.controls{
    position:absolute;

    bottom:82px;
    left:0;

    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:14px;
    padding:0 20px;
}

.control{
    width:58px;
    height:58px;

    border:0;
    border-radius:19px;

    background:#18231f;
    color:white;

    font-size:22px;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
}

.control:active{
    transform:scale(.93);
}

.control.red{
    background:#e53935;
    color:white;
}

.control.off{
    background:#18231f;
    color:#ff5555;
}

.incoming-actions{
    display:none;

    position:absolute;

    bottom:82px;
    left:0;

    width:100%;

    justify-content:center;
    gap:18px;
}

.incoming-actions button{
    width:65px;
    height:65px;

    border:0;
    border-radius:22px;

    font-size:25px;

    cursor:pointer;
}

#acceptButton{
    background:#00e889;
    color:#00150e;
}

#rejectButton{
    background:#e53935;
    color:white;
}

.hidden{
    display:none !important;
}

.loader{
    width:18px;
    height:18px;

    border:2px solid rgba(255,255,255,.2);
    border-top-color:#00e889;

    border-radius:50%;

    display:inline-block;

    animation:spin .7s linear infinite;

    vertical-align:middle;

    margin-left:6px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#errorBox{
    position:absolute;

    top:20px;
    left:20px;
    right:20px;

    padding:13px;

    border-radius:14px;

    background:#251111;

    border:1px solid rgba(255,80,80,.2);

    color:#ff7777;

    text-align:center;

    font-size:13px;

    display:none;
}

audio{
    display:none;
}

</style>
</head>

<body>

<main class="call-page">

    <div class="top">
        Mecd Chat
    </div>

    <div id="errorBox"></div>

    <section class="person">

        <div id="avatar" class="avatar">
            👤
        </div>

        <div id="name" class="name">
            مستخدم Mecd
        </div>

        <div id="status" class="status">
            جارٍ الاتصال...
        </div>

    </section>

    <audio
        id="remoteAudio"
        autoplay
        playsinline>
    </audio>

    <div id="controls" class="controls">

        <button
            id="muteButton"
            class="control"
            type="button">
            🎤
        </button>

        <button
            id="endButton"
            class="control red"
            type="button">
            📞
        </button>

    </div>

    <div
        id="incomingActions"
        class="incoming-actions">

        <button
            id="rejectButton"
            type="button">
            📞
        </button>

        <button
            id="acceptButton"
            type="button">
            📞
        </button>

    </div>

</main>

<script type="module">

/* =========================================
   Firebase
   مهم جداً:
   Firebase يتم تشغيله قبل call.js
========================================= */

import {
    initializeApp,
    getApps,
    getApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

    authDomain:
        "mecd-tools.firebaseapp.com",

    projectId:
        "mecd-tools",

    storageBucket:
        "mecd-tools.firebasestorage.app",

    messagingSenderId:
        "643005547408",

    appId:
        "1:643005547408:web:b1719060ec340dd0e0a915"

};


/* =========================================
   تشغيل Firebase
========================================= */

const firebaseApp =
    getApps().length > 0
        ? getApp()
        : initializeApp(
            firebaseConfig
        );


const auth =
    getAuth(
        firebaseApp
    );


console.log(
    "✅ Firebase جاهز قبل تحميل call.js"
);


/* =========================================
   عناصر الصفحة
========================================= */

const avatar =
    document.getElementById("avatar");

const nameElement =
    document.getElementById("name");

const statusElement =
    document.getElementById("status");

const controls =
    document.getElementById("controls");

const incomingActions =
    document.getElementById("incomingActions");

const muteButton =
    document.getElementById("muteButton");

const endButton =
    document.getElementById("endButton");

const acceptButton =
    document.getElementById("acceptButton");

const rejectButton =
    document.getElementById("rejectButton");

const remoteAudio =
    document.getElementById("remoteAudio");

const errorBox =
    document.getElementById("errorBox");


/* =========================================
   بيانات المكالمة
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const callId =
    params.get("callId") || "";


const mode =
    params.get("mode") || "outgoing";


const friendName =
    params.get("name") ||
    "مستخدم Mecd";


const friendPhoto =
    params.get("photo") ||
    "";


/* =========================================
   عرض بيانات الصديق
========================================= */

nameElement.textContent =
    friendName;


if(friendPhoto){

    const img =
        document.createElement("img");

    img.src =
        friendPhoto;

    img.alt =
        "صورة الحساب";

    img.onload =
        () => {

            avatar.innerHTML =
                "";

            avatar.appendChild(
                img
            );

        };

    img.onerror =
        () => {

            avatar.innerHTML =
                "👤";

        };

}else{

    avatar.innerHTML =
        "👤";

}


/* =========================================
   مكالمة واردة
========================================= */

if(
    mode === "incoming"
){

    statusElement.textContent =
        "📞 مكالمة واردة";

    controls.classList.add(
        "hidden"
    );

    incomingActions.style.display =
        "flex";

}


/* =========================================
   تحميل call.js
   بعد Firebase
========================================= */

let callModule = null;


async function loadCallModule(){

    try{

        console.log(
            "⏳ تحميل call.js..."
        );


        callModule =
            await import(
                "./call.js"
            );


        console.log(
            "✅ call.js تم تحميله"
        );


        console.log(
            "الدوال الموجودة:",
            Object.keys(callModule)
        );


        startCallPage();


    }catch(error){

        console.error(
            "❌ call.js error:",
            error
        );


        showError(
            "❌ تعذر تحميل نظام المكالمات<br><small>" +
            (
                error.message ||
                error
            ) +
            "</small>"
        );

    }

}


/* =========================================
   إظهار الخطأ
========================================= */

function showError(message){

    errorBox.innerHTML =
        message;

    errorBox.style.display =
        "block";

    statusElement.textContent =
        "حدث خطأ";

    statusElement.classList.add(
        "ended"
    );

}


/* =========================================
   تشغيل المكالمة
========================================= */

function startCallPage(){

    if(!callId){

        showError(
            "❌ لا يوجد رقم للمكالمة"
        );

        return;

    }


    if(
        !callModule ||
        typeof callModule !== "object"
    ){

        showError(
            "❌ call.js لم يتم تحميله بشكل صحيح"
        );

        return;

    }


    window.onRemoteStream =
        stream => {

            try{

                remoteAudio.srcObject =
                    stream;

                remoteAudio
                    .play()
                    .catch(
                        error => {

                            console.log(
                                "Audio autoplay:",
                                error
                            );

                        }
                    );

            }catch(error){

                console.error(
                    error
                );

            }

        };


    window.onCallConnected =
        () => {

            statusElement.textContent =
                "● متصل";

            statusElement.classList.remove(
                "ended"
            );

        };


    window.onCallFailed =
        () => {

            statusElement.textContent =
                "تعذر الاتصال";

            statusElement.classList.add(
                "ended"
            );

        };


    window.onCallEnded =
        () => {

            statusElement.textContent =
                "انتهت المكالمة";

            statusElement.classList.add(
                "ended"
            );

            controls.classList.add(
                "hidden"
            );

            incomingActions.classList.add(
                "hidden"
            );

        };


    /* =====================================
       مكالمة صادرة
    ===================================== */

    if(
        mode === "outgoing"
    ){

        statusElement.innerHTML =
            '<span class="loader"></span> جارٍ الاتصال...';


        if(
            typeof callModule.startOutgoingCall !==
            "function"
        ){

            showError(
                "❌ الدالة startOutgoingCall غير موجودة في call.js"
            );

            return;

        }


        callModule
            .startOutgoingCall(
                callId
            )
            .catch(
                error => {

                    console.error(
                        "Outgoing call:",
                        error
                    );

                    showError(
                        "❌ " +
                        (
                            error.message ||
                            "تعذر بدء المكالمة"
                        )
                    );

                }
            );

    }

    /* =====================================
       مكالمة واردة
    ===================================== */

    else{

        if(
            typeof callModule.watchIncomingCall !==
            "function"
        ){

            showError(
                "❌ الدالة watchIncomingCall غير موجودة في call.js"
            );

            return;

        }


        callModule
            .watchIncomingCall(
                callId
            )
            .catch(
                error => {

                    console.error(
                        "Incoming call:",
                        error
                    );

                    showError(
                        "❌ " +
                        (
                            error.message ||
                            "تعذر مراقبة المكالمة"
                        )
                    );

                }
            );

    }

}


/* =========================================
   كتم الميكروفون
========================================= */

let muted = false;


muteButton.onclick =
    () => {

        const stream =
            callModule?.getLocalStream?.();


        if(!stream){

            return;

        }


        const tracks =
            stream.getAudioTracks();


        if(!tracks.length){

            return;

        }


        muted =
            !muted;


        tracks.forEach(
            track => {

                track.enabled =
                    !muted;

            }
        );


        muteButton.textContent =
            muted
                ? "🔇"
                : "🎤";


        muteButton.classList.toggle(
            "off",
            muted
        );

    };


/* =========================================
   إنهاء المكالمة
========================================= */

async function finishCall(){

    try{

        if(
            callModule &&
            typeof callModule.cleanupCall ===
            "function"
        ){

            await callModule
                .cleanupCall(
                    callId
                );

        }

    }catch(error){

        console.error(
            error
        );

    }


    window.location.href =
        "chat.html";

}


endButton.onclick =
    finishCall;


/* =========================================
   رفض المكالمة
========================================= */

rejectButton.onclick =
    async () => {

        try{

            if(
                callModule &&
                typeof callModule.endCall ===
                "function"
            ){

                await callModule
                    .endCall(
                        callId
                    );

            }


            if(
                callModule &&
                typeof callModule.clearIncomingCall ===
                "function"
            ){

                await callModule
                    .clearIncomingCall();

            }

        }catch(error){

            console.error(
                error
            );

        }


        window.location.href =
            "chat.html";

    };


/* =========================================
   قبول المكالمة
========================================= */

acceptButton.onclick =
    async () => {

        acceptButton.disabled =
            true;

        statusElement.innerHTML =
            '<span class="loader"></span> جاري الرد...';


        try{

            if(
                !callModule ||
                typeof callModule.acceptIncomingCall !==
                "function"
            ){

                throw new Error(
                    "الدالة acceptIncomingCall غير موجودة في call.js"
                );

            }


            let accepted =
                false;


            for(
                let i = 0;
                i < 10;
                i++
            ){

                try{

                    await callModule
                        .acceptIncomingCall(
                            callId
                        );

                    accepted =
                        true;

                    break;

                }catch(error){

                    if(
                        error.message ===
                        "لم يصل طلب الاتصال بعد"
                    ){

                        await new Promise(
                            resolve =>
                                setTimeout(
                                    resolve,
                                    500
                                )
                        );

                        continue;

                    }

                    throw error;

                }

            }


            if(!accepted){

                throw new Error(
                    "لم يصل طلب الاتصال"
                );

            }


            if(
                typeof callModule.clearIncomingCall ===
                "function"
            ){

                await callModule
                    .clearIncomingCall();

            }


            incomingActions.style.display =
                "none";

            controls.classList.remove(
                "hidden"
            );


            statusElement.textContent =
                "● متصل";


        }catch(error){

            console.error(
                "Accept call:",
                error
            );


            acceptButton.disabled =
                false;


            showError(
                "❌ " +
                (
                    error.message ||
                    "تعذر قبول المكالمة"
                )
            );

        }

    };


/* =========================================
   التشغيل
========================================= */

loadCallModule();

</script>

</body>
</html>
