<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050807">

<title>Mecd Chat - مكالمة صوتية</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
        Arial,
        Tahoma,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at top,
            #123d35,
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #07110f,
            #020504
        );

    overflow:hidden;

}

.call-app{

    width:100%;
    height:100vh;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at center,
            #12352c,
            #020504 70%
        );

}


/* =========================================================
   الخلفية
========================================================= */

.glow{

    position:absolute;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
        rgba(0,232,137,.07);

    filter:blur(70px);

    pointer-events:none;

}


/* =========================================================
   الأعلى
========================================================= */

.top-bar{

    position:absolute;

    top:0;
    left:0;
    right:0;

    padding:18px 15px;

    display:flex;

    align-items:center;

    gap:12px;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.65),
            transparent
        );

    z-index:20;

}

.back-button{

    width:45px;
    height:45px;

    border:0;

    border-radius:15px;

    background:
        rgba(24,35,31,.9);

    color:white;

    font-size:22px;

    cursor:pointer;

}

.top-info{

    flex:1;

    min-width:0;

}

.top-name{

    font-size:17px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.top-status{

    margin-top:4px;

    font-size:12px;

    color:#00e889;

}


/* =========================================================
   الطرف الآخر
========================================================= */

.person{

    position:relative;

    z-index:5;

    text-align:center;

}

.avatar{

    width:120px;
    height:120px;

    margin:auto;

    border-radius:35px;

    background:#18231f;

    border:
        2px solid
        rgba(0,232,137,.22);

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:52px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.name{

    margin-top:22px;

    font-size:25px;

    font-weight:bold;

}

.status{

    margin-top:9px;

    color:#00e889;

    font-size:14px;

}


/* =========================================================
   أزرار المكالمة
========================================================= */

.controls{

    position:absolute;

    left:50%;

    bottom:35px;

    transform:
        translateX(-50%);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:20px;

    z-index:30;

}

.control{

    width:60px;
    height:60px;

    border:0;

    border-radius:50%;

    background:#18231f;

    color:white;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.4);

}

.control:active{

    transform:scale(.92);

}

.end{

    width:70px;
    height:70px;

    border:0;

    border-radius:50%;

    background:#e53935;

    color:white;

    font-size:26px;

    cursor:pointer;

    box-shadow:
        0 10px 35px
        rgba(229,57,53,.3);

}

.end:active{

    transform:scale(.92);

}


/* =========================================================
   شاشة المكالمة الواردة
========================================================= */

.incoming{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.84);

    backdrop-filter:
        blur(12px);

}

.incoming.hidden{

    display:none;

}

.incoming-card{

    width:100%;

    max-width:370px;

    padding:32px 22px;

    border-radius:28px;

    background:#0b1512;

    border:
        1px solid
        rgba(0,232,137,.18);

    text-align:center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.65);

}

.incoming-avatar{

    width:105px;
    height:105px;

    margin:auto;

    border-radius:30px;

    background:#18231f;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:48px;

}

.incoming-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

}

.incoming-name{

    margin-top:20px;

    font-size:23px;

    font-weight:bold;

}

.incoming-text{

    margin-top:8px;

    color:#00e889;

    font-size:14px;

}

.incoming-buttons{

    display:flex;

    gap:12px;

    margin-top:27px;

}

.incoming-buttons button{

    flex:1;

    height:53px;

    border:0;

    border-radius:17px;

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

}

.accept{

    background:#00c96b;

    color:#00150e !important;

}

.reject{

    background:#352020;

}


/* =========================================================
   حالة الاتصال
========================================================= */

.connection-status{

    position:absolute;

    left:50%;

    bottom:125px;

    transform:
        translateX(-50%);

    color:#8b9994;

    font-size:12px;

    z-index:10;

    text-align:center;

}


/* =========================================================
   Responsive
========================================================= */

@media(max-width:500px){

    .avatar{

        width:105px;
        height:105px;

        border-radius:30px;

    }

    .name{

        font-size:22px;

    }

    .controls{

        gap:14px;

        bottom:28px;

    }

}

</style>

</head>


<body>

<div class="call-app">

    <div class="glow"></div>


    <!-- الأعلى -->

    <div class="top-bar">

        <button
            id="backButton"
            class="back-button"
            type="button">

            →

        </button>

        <div class="top-info">

            <div
                id="topName"
                class="top-name">

                مكالمة صوتية

            </div>

            <div
                id="topStatus"
                class="top-status">

                اتصال صوتي

            </div>

        </div>

    </div>


    <!-- الشخص -->

    <div class="person">

        <div
            id="avatar"
            class="avatar">

            👤

        </div>

        <div
            id="name"
            class="name">

            جاري الاتصال...

        </div>

        <div
            id="status"
            class="status">

            جارٍ الاتصال...

        </div>

    </div>


    <!-- حالة الاتصال -->

    <div
        id="connectionStatus"
        class="connection-status">

        اتصال صوتي

    </div>


    <!-- التحكم -->

    <div class="controls">

        <button
            id="muteButton"
            class="control"
            type="button">

            🎤

        </button>

        <button
            id="endButton"
            class="end"
            type="button">

            ☎

        </button>

    </div>

</div>


<!-- الصوت البعيد -->

<audio
    id="remoteAudio"
    autoplay>
</audio>


<!-- المكالمة الواردة -->

<div
    id="incoming"
    class="incoming hidden">

    <div class="incoming-card">

        <div
            id="incomingAvatar"
            class="incoming-avatar">

            👤

        </div>

        <div
            id="incomingName"
            class="incoming-name">

            مكالمة واردة

        </div>

        <div class="incoming-text">

            📞 يتصل بك الآن

        </div>

        <div class="incoming-buttons">

            <button
                id="rejectButton"
                class="reject"
                type="button">

                رفض

            </button>

            <button
                id="acceptButton"
                class="accept"
                type="button">

                قبول

            </button>

        </div>

    </div>

</div>


<script type="module">

import {

    auth,
    db,
    makeOutgoingCall,
    acceptCall,
    rejectCall,
    endCall,
    cleanupCall

} from "./call.js";


import {

    onAuthStateChanged

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    collection,
    query,
    where,
    onSnapshot,
    orderBy,
    limit

} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const $ =
    id =>
        document.getElementById(id);


const nameElement =
    $("name");

const topName =
    $("topName");

const statusElement =
    $("status");

const topStatus =
    $("topStatus");

const avatar =
    $("avatar");

const incoming =
    $("incoming");

const incomingName =
    $("incomingName");

const incomingAvatar =
    $("incomingAvatar");

const acceptButton =
    $("acceptButton");

const rejectButton =
    $("rejectButton");

const endButton =
    $("endButton");

const muteButton =
    $("muteButton");

const remoteAudio =
    $("remoteAudio");

const connectionStatus =
    $("connectionStatus");


let currentUser =
    null;

let currentCallId =
    null;

let microphoneMuted =
    false;

let incomingUnsubscribe =
    null;


/* =========================================================
   بيانات المستخدم
========================================================= */

function setPerson(
    personName,
    photo
){

    const safeName =
        personName ||
        "مستخدم Mecd";


    nameElement.textContent =
        safeName;

    topName.textContent =
        safeName;


    if(photo){

        avatar.innerHTML =
            `<img src="${escapeHtml(photo)}"
                  alt="صورة الحساب">`;

        incomingAvatar.innerHTML =
            `<img src="${escapeHtml(photo)}"
                  alt="صورة الحساب">`;

    }else{

        avatar.textContent =
            "👤";

        incomingAvatar.textContent =
            "👤";

    }

}


function escapeHtml(value){

    return String(value)

        .replace(
            /[&<>'"]/g,

            c => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                "'":"&#39;",
                '"':"&quot;"

            }[c])

        );

}


/* =========================================================
   المكالمة الصادرة
========================================================= */

async function startOutgoing(){

    const data =
        JSON.parse(
            sessionStorage.getItem(
                "mecdOutgoingCall"
            ) || "{}"
        );


    if(!data.friendId){

        statusElement.textContent =
            "لم يتم تحديد المستخدم";

        return;

    }


    currentCallId =
        await makeOutgoingCall({

            friendId:
                data.friendId,

            friendName:
                data.friendName,

            friendPhoto:
                data.friendPhoto

        });


    setPerson(
        data.friendName,
        data.friendPhoto
    );


    statusElement.textContent =
        "يرن الآن...";

    topStatus.textContent =
        "مكالمة صادرة";

    connectionStatus.textContent =
        "بانتظار الرد...";

}


/* =========================================================
   المكالمة الواردة
========================================================= */

function listenIncomingCalls(user){

    const callsRef =
        collection(
            db,
            "calls"
        );


    const q =
        query(

            callsRef,

            where(
                "receiverId",
                "==",
                user.uid
            ),

            where(
                "status",
                "==",
                "ringing"
            ),

            orderBy(
                "createdAt",
                "desc"
            ),

            limit(1)

        );


    incomingUnsubscribe =
        onSnapshot(

            q,

            snapshot => {

                snapshot.docChanges()
                    .forEach(
                        change => {

                            if(
                                change.type !==
                                "added"
                            ){

                                return;

                            }


                            const data =
                                change.doc.data();


                            currentCallId =
                                change.doc.id;


                            incomingName.textContent =
                                data.callerName ||
                                "مستخدم Mecd";


                            if(
                                data.callerPhoto
                            ){

                                incomingAvatar.innerHTML =
                                    `<img src="${escapeHtml(data.callerPhoto)}"
                                          alt="صورة الحساب">`;

                            }else{

                                incomingAvatar.textContent =
                                    "👤";

                            }


                            incoming.classList.remove(
                                "hidden"
                            );

                        }
                    );

            },

            error => {

                console.error(
                    "Incoming calls:",
                    error
                );

            }

        );

}


/* =========================================================
   قبول
========================================================= */

acceptButton.addEventListener(

    "click",

    async () => {

        if(!currentCallId){

            return;

        }


        try{

            incoming.classList.add(
                "hidden"
            );


            statusElement.textContent =
                "جارٍ الاتصال...";


            topStatus.textContent =
                "مكالمة صوتية";


            connectionStatus.textContent =
                "جارٍ الاتصال...";


            await acceptCall(
                currentCallId
            );


            statusElement.textContent =
                "متصل";


            connectionStatus.textContent =
                "المكالمة متصلة";


        }catch(error){

            console.error(
                error
            );

            alert(
                "تعذر قبول المكالمة"
            );

        }

    }

);


/* =========================================================
   رفض
========================================================= */

rejectButton.addEventListener(

    "click",

    async () => {

        if(!currentCallId){

            return;

        }


        await rejectCall(
            currentCallId
        );


        incoming.classList.add(
            "hidden"
        );


        currentCallId =
            null;

    }

);


/* =========================================================
   إنهاء
========================================================= */

endButton.addEventListener(

    "click",

    async () => {

        await endCall();

        window.history.back();

    }

);


/* =========================================================
   كتم الميكروفون
========================================================= */

muteButton.addEventListener(

    "click",

    () => {

        const stream =
            window.localStream;

        /*
           نصل إلى الميكروفون
           من خلال WebRTC
        */

        const tracks =
            document
                .querySelectorAll(
                    "audio"
                );


        /*
           الحالة الفعلية موجودة
           داخل call.js.
        */

        microphoneMuted =
            !microphoneMuted;


        muteButton.textContent =
            microphoneMuted
            ?
            "🔇"
            :
            "🎤";

    }

);


/* =========================================================
   رجوع
========================================================= */

$("backButton")
    .addEventListener(

        "click",

        async () => {

            await endCall();

            window.history.back();

        }

    );


/* =========================================================
   WebRTC events
========================================================= */

window.addEventListener(

    "mecd-call-connected",

    () => {

        statusElement.textContent =
            "متصل";

        topStatus.textContent =
            "● متصل";

        connectionStatus.textContent =
            "المكالمة متصلة";

    }

);


window.addEventListener(

    "mecd-call-ended",

    () => {

        statusElement.textContent =
            "انتهت المكالمة";

        connectionStatus.textContent =
            "انتهت المكالمة";

    }

);


window.addEventListener(

    "mecd-call-rejected",

    () => {

        statusElement.textContent =
            "تم رفض المكالمة";

        connectionStatus.textContent =
            "لم يتم الرد";

        setTimeout(
            () => {
                window.history.back();
            },
            1200
        );

    }

);


/* =========================================================
   التشغيل
========================================================= */

onAuthStateChanged(

    auth,

    async user => {

        if(!user){

            statusElement.textContent =
                "يجب تسجيل الدخول أولاً";

            return;

        }


        currentUser =
            user;


        const params =
            new URLSearchParams(
                location.search
            );


        const type =
            params.get(
                "type"
            );


        if(
            type ===
            "outgoing"
        ){

            const friendId =
                params.get(
                    "friend"
                );


            const friendName =
                params.get(
                    "name"
                ) ||
                "مستخدم Mecd";


            const photo =
                params.get(
                    "photo"
                ) ||
                "";


            setPerson(
                friendName,
                photo
            );


            statusElement.textContent =
                "جارٍ الاتصال...";


            try{

                await makeOutgoingCall({

                    friendId,

                    friendName,

                    friendPhoto:
                        photo

                });


                sessionStorage.removeItem(
                    "mecdOutgoingCall"
                );


                statusElement.textContent =
                    "يرن الآن...";

                connectionStatus.textContent =
                    "بانتظار الرد...";

            }catch(error){

                console.error(
                    error
                );

                statusElement.textContent =
                    "تعذر بدء المكالمة";

                connectionStatus.textContent =
                    error.message ||
                    "حدث خطأ";

            }


        }else{

            /*
               صفحة انتظار المكالمات الواردة
            */

            setPerson(
                "مكالمة صوتية",
                ""
            );


            statusElement.textContent =
                "بانتظار المكالمة...";


            listenIncomingCalls(
                user
            );

        }

    }

);


/* =========================================================
   تنظيف
========================================================= */

window.addEventListener(

    "pagehide",

    () => {

        if(
            incomingUnsubscribe
        ){

            incomingUnsubscribe();

        }

        cleanupCall();

    }

);

</script>

</body>

</html>
