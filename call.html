<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050807">

<title>Mecd Chat</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    font-family:Arial,Tahoma,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#123d35,transparent 40%),
        linear-gradient(180deg,#07110f,#020504);
    overflow:hidden;
}

.app{
    height:100vh;
    max-width:650px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    background:#050807;
    border-bottom:1px solid rgba(255,255,255,.08);
    flex-shrink:0;
}

.back{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:#18231f;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:16px;
    background:#12352c;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:24px;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

.user-status.online{
    color:#00e889;
}

.call-buttons{
    display:flex;
    gap:8px;
    flex-shrink:0;
}

.call-buttons button{
    width:42px;
    height:42px;
    border:0;
    border-radius:14px;
    background:#18231f;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:20px 15px 150px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.empty{
    margin:auto;
    text-align:center;
    color:#72817c;
}

.message{
    max-width:78%;
    padding:12px 15px;
    border-radius:18px;
    position:relative;
    word-break:break-word;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

.message.mine{
    align-self:flex-start;
    background:#00c96b;
    color:#00150e;
    border-bottom-left-radius:5px;
}

.message.other{
    align-self:flex-end;
    background:#18231f;
    border:1px solid rgba(255,255,255,.08);
    border-bottom-right-radius:5px;
}

.time{
    display:block;
    font-size:9px;
    opacity:.6;
    margin-top:5px;
}

.input-area{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:650px;
    padding:10px;
    display:flex;
    gap:8px;
    background:#050807;
    z-index:50;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:14px;
    border-radius:17px;
    border:1px solid #27332f;
    background:#111916;
    color:white;
    outline:none;
    font-size:15px;
}

#voiceButton,
#sendButton{
    width:50px;
    height:50px;
    border:0;
    border-radius:16px;
    font-size:22px;
    cursor:pointer;
    flex-shrink:0;
}

#voiceButton{
    background:#18231f;
    color:white;
}

#sendButton{
    background:#00e889;
    color:#00150e;
}

#sendButton:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message-menu{
    position:absolute;
    left:50%;
    bottom:calc(100% + 8px);
    transform:translateX(-50%);
    width:max-content;
    min-width:150px;
    max-width:calc(100vw - 30px);
    padding:5px;
    background:#0b1512;
    border:1px solid rgba(0,232,137,.18);
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.55);
    z-index:99999;
}

.message-menu button{
    width:100%;
    min-width:140px;
    padding:10px 14px;
    border:0;
    border-radius:11px;
    background:#18231f;
    color:white;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

@media(max-width:400px){
    .call-buttons button{
        width:38px;
        height:38px;
    }

    .avatar{
        width:44px;
        height:44px;
    }
}
</style>
</head>

<body>

<div id="loading"
     style="
     position:fixed;
     inset:0;
     display:flex;
     align-items:center;
     justify-content:center;
     background:#020504;
     color:white;
     font-size:18px;
     z-index:9999;">
    جارٍ فتح الدردشة...
</div>

<main id="app"
      class="app"
      style="display:none;">

<header>

<button id="backButton"
        class="back"
        type="button">
    →
</button>

<div id="friendAvatar"
     class="avatar">
    👤
</div>

<div class="user-info">

<div id="friendName"
     class="user-name">
    جار التحميل...
</div>

<div id="friendStatus"
     class="user-status">
    ● غير متصل
</div>

</div>

<div class="call-buttons">

<button id="callButton"
        type="button">
    📞
</button>

<button id="videoButton"
        type="button">
    📹
</button>

</div>

</header>

<div id="messages"
     class="messages">

<div class="empty">
    💬
    <br>
    ابدأ المحادثة الآن
</div>

</div>

<div class="input-area">

<input id="messageInput"
       placeholder="اكتب رسالة..."
       autocomplete="off"
       maxlength="2000">

<button id="voiceButton"
        type="button">
    🎤
</button>

<button id="sendButton"
        type="button">
    ➤
</button>

</div>

</main>

<script type="module" src="./chat.js"></script>

<script type="module" src="./voice.js"></script>

</body>
</html>
