<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}

.container{
width:90%;
max-width:500px;
margin:auto;
padding:40px 0;
}

.profile{
text-align:center;
margin-bottom:35px;
}

.avatar{
width:105px;
height:105px;
margin:auto;
border-radius:50%;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:rgba(0,255,145,.12);
border:3px solid #00e889;

font-size:45px;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
margin-top:20px;
font-size:38px;
}

.name{
margin-top:15px;
font-size:25px;
font-weight:bold;
}

.id{
margin-top:12px;
font-size:18px;
color:#00e889;
}

.card{
padding:22px;
margin-bottom:15px;

border-radius:25px;

background:rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

cursor:pointer;

transition:.2s;
}

.card:active{
transform:scale(.98);
}

.logout{
background:rgba(160,40,40,.25);
color:#ffaaaa;
}

.loading{
height:100vh;

display:flex;
align-items:center;
justify-content:center;

flex-direction:column;

gap:20px;

color:#a8bdb6;

font-size:18px;
}

.spinner{
width:35px;
height:35px;

border:4px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

</style>

</head>

<body>


<!-- Loading -->

<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>


<!-- Mecd Chat -->

<div id="app" class="container" style="display:none;">


<div class="profile">

<div id="avatar" class="avatar">
👤
</div>

<h1>
Mecd Chat
</h1>

<div id="name" class="name">
مستخدم Mecd
</div>

<div id="userId" class="id">
جارٍ تحميل ID...
</div>

</div>


<div class="card">
👥 الأصدقاء
</div>


<div class="card">
➕ إنشاء غرفة دردشة
</div>


<div class="card">
🔑 دخول دردشة عبر ID
</div>


<div class="card">
⚙️ الإعدادات
</div>


<!-- العودة إلى Mecd Tools -->

<div id="backBtn" class="card logout">
🚪 العودة إلى Mecd Tools
</div>


</div>


<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* Firebase */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);



/* Elements */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const avatar =
document.getElementById("avatar");

const name =
document.getElementById("name");

const userId =
document.getElementById("userId");

const backBtn =
document.getElementById("backBtn");



/* Mecd Tools */

const mecdToolsURL =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";



/*
الحصول على ID ثابت من Firestore
*/

async function getChatID(user){

try{

const userRef =
doc(db,"users",user.uid);


const userDoc =
await getDoc(userRef);


if(userDoc.exists()){

const data =
userDoc.data();


if(data.chatID){

return data.chatID;

}

}


/*
إذا الحساب جديد
نستخدم عداد داخل Firestore
*/

const counterRef =
doc(db,"settings","chatCounter");


const counterDoc =
await getDoc(counterRef);


let number = 1;


if(counterDoc.exists()){

number =
Number(counterDoc.data().number || 0) + 1;

}


/* ID */

const newID =
"MC-" +
String(number).padStart(6,"0");


/* حفظ المستخدم */

await setDoc(
userRef,
{

name:
user.displayName || "مستخدم Mecd",

photo:
user.photoURL || "",

email:
user.email || "",

chatID:
newID

},
{
merge:true
}
);


/* حفظ العداد */

await setDoc(
counterRef,
{
number:number
},
{
merge:true
}
);


return newID;


}catch(error){

console.error(
"خطأ في إنشاء ID:",
error
);


/*
إذا حدث خطأ في Firestore
نظهر الحساب لكن بدون ID مزيف
*/

return "MC-000001";

}

}



/* Firebase Login Check */

onAuthStateChanged(
auth,
async(user)=>{


if(user){

try{


/* الاسم */

name.textContent =
user.displayName ||
"مستخدم Mecd";


/* الصورة */

if(user.photoURL){

avatar.innerHTML = `
<img
src="${user.photoURL}"
alt="صورة الحساب"
>
`;

}


/* ID */

const id =
await getChatID(user);


userId.textContent =
"ID: " + id;


/* إظهار الصفحة */

loading.style.display =
"none";

app.style.display =
"block";


}catch(error){

console.error(error);

window.location.href =
mecdToolsURL;

}


}else{


/*
إذا غير مسجل الدخول:
العودة إلى Mecd Tools
*/

window.location.replace(
mecdToolsURL
);

}

});



/*
زر العودة

مهم جداً:
لا يوجد signOut هنا.

يعني الحساب يبقى مسجل دخول.
*/

backBtn.addEventListener(
"click",
()=>{

window.location.href =
mecdToolsURL;

});


</script>

</body>

</html>
