<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family:Arial,sans-serif;

min-height:100vh;

color:white;

background:
radial-gradient(
circle at 50% -10%,
#08704d 0%,
#03291f 35%,
transparent 60%
),
linear-gradient(
180deg,
#02130e,
#010706
);

}


/* الصفحة */

.container{

width:min(92%,520px);

margin:auto;

padding:35px 0 45px;

}


/* الحساب */

.profile{

text-align:center;

padding:25px 20px 30px;

margin-bottom:25px;

border-radius:30px;

background:
linear-gradient(
145deg,
rgba(0,85,58,.55),
rgba(0,30,22,.45)
);

border:1px solid rgba(0,255,145,.18);

box-shadow:
0 15px 45px rgba(0,0,0,.3);

}


/* صورة الحساب */

.avatar{

width:105px;

height:105px;

margin:0 auto 18px;

border-radius:50%;

object-fit:cover;

display:block;

border:3px solid #00e889;

box-shadow:
0 0 25px rgba(0,232,137,.18);

background:#123c31;

}


/* الاسم */

.name{

font-size:29px;

font-weight:bold;

margin-bottom:10px;

}


/* ID */

.id{

display:inline-block;

padding:8px 18px;

border-radius:15px;

font-size:18px;

font-weight:bold;

color:#00e889;

background:rgba(0,232,137,.09);

border:1px solid rgba(0,232,137,.18);

}


/* عنوان */

.title{

font-size:23px;

font-weight:bold;

margin:25px 5px 15px;

}


/* البطاقات */

.card{

display:flex;

align-items:center;

gap:16px;

width:100%;

padding:20px;

margin-bottom:14px;

border-radius:22px;

text-decoration:none;

color:white;

background:
linear-gradient(
135deg,
rgba(0,85,58,.65),
rgba(2,35,27,.9)
);

border:1px solid rgba(0,255,145,.16);

box-shadow:
0 10px 30px rgba(0,0,0,.25);

transition:.18s;

cursor:pointer;

}


.card:active{

transform:scale(.97);

}


.card-icon{

width:55px;

height:55px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

border-radius:17px;

background:rgba(0,255,145,.10);

}


.card-text{

flex:1;

font-size:19px;

font-weight:bold;

}


.card-arrow{

font-size:25px;

color:#00e889;

}


/* تسجيل الخروج */

.logout{

display:flex;

align-items:center;

justify-content:center;

width:100%;

padding:18px;

margin-top:25px;

border-radius:20px;

border:1px solid rgba(255,70,70,.25);

background:rgba(100,15,15,.35);

color:#ff9b9b;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


.logout:active{

transform:scale(.97);

}


/* تحميل */

.loading{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:15px;

font-size:18px;

color:#a8bdb6;

}


.spinner{

width:32px;

height:32px;

border:3px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}


@keyframes spin{

to{
transform:rotate(360deg);
}

}


.hidden{

display:none;

}

</style>

</head>


<body>


<!-- التحميل -->

<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>



<!-- الصفحة -->

<main id="app" class="container hidden">


<!-- الحساب -->

<section class="profile">

<img
id="avatar"
class="avatar"
src=""
alt="صورة الحساب"
>

<div
id="name"
class="name">
</div>

<div
id="userId"
class="id">
</div>

</section>



<div class="title">
💬 Mecd Chat
</div>



<!-- الأصدقاء -->

<div class="card">

<div class="card-icon">
👥
</div>

<div class="card-text">
الأصدقاء
</div>

<div class="card-arrow">
←
</div>

</div>



<!-- إنشاء غرفة -->

<div class="card">

<div class="card-icon">
➕
</div>

<div class="card-text">
إنشاء غرفة دردشة
</div>

<div class="card-arrow">
←
</div>

</div>



<!-- الدخول عبر ID -->

<div class="card">

<div class="card-icon">
🔑
</div>

<div class="card-text">
دخول دردشة عبر ID
</div>

<div class="card-arrow">
←
</div>

</div>



<!-- الإعدادات -->

<div class="card">

<div class="card-icon">
⚙️
</div>

<div class="card-text">
الإعدادات
</div>

<div class="card-arrow">
←
</div>

</div>



<!-- تسجيل الخروج -->

<button
id="logoutBtn"
class="logout">

🚪 تسجيل الخروج

</button>


</main>



<script type="module">


/* Firebase */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
runTransaction
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* إعداد Firebase */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* العناصر */

const loading =
document.getElementById("loading");

const main =
document.getElementById("app");

const avatar =
document.getElementById("avatar");

const name =
document.getElementById("name");

const userId =
document.getElementById("userId");

const logoutBtn =
document.getElementById("logoutBtn");



/* إنشاء ID جديد */

async function getAccountId(user){

const userRef =
doc(db,"users",user.uid);


/* هل الحساب موجود؟ */

const existing =
await getDoc(userRef);


if(existing.exists()){

return existing.data().id;

}


/* إنشاء ID جديد */

const counterRef =
doc(db,"counters","accounts");


let newId;


await runTransaction(db,async(transaction)=>{

const counterSnap =
await transaction.get(counterRef);


let number = 0;


if(counterSnap.exists()){

number =
counterSnap.data().number || 0;

}


/* الرقم التالي */

number++;


/* ID */

newId =
"MC-" +
String(number).padStart(6,"0");


/* حفظ العداد */

transaction.set(
counterRef,
{
number:number
},
{
merge:true
}
);


/* حفظ الحساب */

transaction.set(
userRef,
{
id:newId,
name:user.displayName || "مستخدم Mecd",
photo:user.photoURL || "",
createdAt:Date.now()
}
);

});


return newId;

}



/* تسجيل الدخول */

onAuthStateChanged(
auth,
async(user)=>{

if(!user){

window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

return;

}


try{


/* الحصول على ID */

const id =
await getAccountId(user);


/* الصورة */

if(user.photoURL){

avatar.src =
user.photoURL;

}else{

avatar.src =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="200"
height="200">

<rect width="100%" height="100%"
fill="#315f52"/>

<text x="50%"
y="58%"
font-size="90"
text-anchor="middle"
fill="white">

${(user.displayName || "M").charAt(0)}

</text>

</svg>
`);

}


/* الاسم */

name.textContent =
user.displayName || "مستخدم Mecd";


/* ID */

userId.textContent =
"ID: " + id;


/* إظهار الصفحة */

loading.classList.add("hidden");

main.classList.remove("hidden");


}catch(error){

console.error(error);

loading.innerHTML =
"حدث خطأ أثناء تحميل الحساب ❌";

}

});



/* تسجيل الخروج */

logoutBtn.addEventListener(
"click",
async()=>{

try{

await signOut(auth);

window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

}catch(error){

console.error(error);

alert(
"حدث خطأ أثناء تسجيل الخروج"
);

}

});

</script>


</body>

</html>
