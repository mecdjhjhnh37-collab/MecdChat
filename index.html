<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
   <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050807">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="Mecd Chat">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;

font-family:
Arial,
Tahoma,
sans-serif;

color:white;

background:
radial-gradient(
circle at 50% 0%,
#123d35 0%,
transparent 35%
),
linear-gradient(
180deg,
#07110f 0%,
#020504 100%
);

overflow-x:hidden;
}

.background{
position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;
z-index:0;
}

.glow{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
filter:blur(100px);
opacity:.18;
}

.glow.one{
background:#00e676;
top:-100px;
right:-100px;
}

.glow.two{
background:#2979ff;
bottom:-100px;
left:-100px;
}

.app{
position:relative;
z-index:1;

width:100%;
max-width:650px;
min-height:100vh;

margin:auto;

padding:28px 20px 45px;

display:flex;
flex-direction:column;
}

header{
display:flex;
align-items:center;
justify-content:space-between;

margin-bottom:45px;
}

.brand{
display:flex;
align-items:center;
gap:12px;
}

.logo{
width:52px;
height:52px;

display:flex;
align-items:center;
justify-content:center;

border-radius:16px;

font-size:27px;

background:
linear-gradient(
135deg,
#00e676,
#00a85a
);

box-shadow:
0 10px 30px
rgba(0,230,118,.22);
}

.brand h2{
font-size:21px;
}

.brand span{
display:block;

margin-top:4px;

color:#8d9a97;

font-size:12px;
}

.status{
display:flex;
align-items:center;
gap:7px;

padding:8px 12px;

border:1px solid
rgba(255,255,255,.08);

border-radius:20px;

background:
rgba(255,255,255,.04);

color:#aab5b2;

font-size:12px;
}

.status-dot{
width:8px;
height:8px;

border-radius:50%;

background:#00e676;

box-shadow:
0 0 10px #00e676;
}

.hero{
text-align:center;

margin-bottom:32px;
}

.hero h1{
font-size:
clamp(32px,7vw,48px);

line-height:1.2;

margin-bottom:18px;

letter-spacing:-.8px;
}

.hero h1 span{
color:#00e676;
}

.hero-description{
max-width:440px;

margin:0 auto 28px;

color:#9ba7a4;

line-height:1.8;

font-size:16px;
}

.avatar{
width:92px;
height:92px;

margin:0 auto 18px;

display:flex;
align-items:center;
justify-content:center;

border-radius:28px;

overflow:hidden;

font-size:45px;

background:
rgba(255,255,255,.055);

border:1px solid
rgba(255,255,255,.09);

box-shadow:
0 20px 60px rgba(0,0,0,.3),
inset 0 0 30px
rgba(255,255,255,.025);
}

.avatar img{
width:100%;
height:100%;

object-fit:cover;
}

.account-info{
display:flex;
flex-direction:column;
align-items:center;

gap:7px;

margin-bottom:35px;
}

.account-name{
font-size:24px;
font-weight:bold;
}

.account-id{
font-size:18px;
color:#00e676;
font-weight:bold;
direction:ltr;
}

.choices{
display:flex;
flex-direction:column;
gap:18px;
}

.choice{
position:relative;

width:100%;
min-height:130px;

padding:25px;

border-radius:25px;

border:1px solid
rgba(255,255,255,.09);

color:white;

text-align:right;

cursor:pointer;

overflow:hidden;

transition:.25s ease;

font-family:inherit;
}

.choice::before{
content:"";

position:absolute;

width:180px;
height:180px;

border-radius:50%;

filter:blur(55px);

opacity:.13;

top:-100px;
left:-60px;
}

.choice:hover{
transform:translateY(-4px);
}

.choice:active{
transform:scale(.98);
}

.friends-choice{
background:
linear-gradient(
135deg,
rgba(0,230,118,.16),
rgba(0,230,118,.035)
);
}

.friends-choice::before{
background:#00e676;
}

.search-choice{
background:
linear-gradient(
135deg,
rgba(41,121,255,.17),
rgba(41,121,255,.035)
);
}

.search-choice::before{
background:#2979ff;
}

.back-choice{
background:
linear-gradient(
135deg,
rgba(180,50,50,.18),
rgba(120,30,30,.04)
);

color:#ffaaaa;
}

.choice-content{
position:relative;
z-index:2;

display:flex;
align-items:center;

gap:20px;
}

.choice-icon{
flex-shrink:0;

width:72px;
height:72px;

display:flex;
align-items:center;
justify-content:center;

border-radius:21px;

font-size:34px;

background:
rgba(255,255,255,.07);
}

.choice-text{
flex:1;
}

.choice-text h3{
font-size:21px;

margin-bottom:8px;
}

.choice-text p{
color:#9ca9a6;

font-size:13px;

line-height:1.6;
}

.arrow{
font-size:26px;

color:#7d8986;
}

.info{
margin-top:30px;

padding:18px;

border-radius:20px;

background:
rgba(255,255,255,.035);

border:1px solid
rgba(255,255,255,.06);

text-align:center;

color:#798581;

font-size:12px;

line-height:1.7;
}

footer{
margin-top:auto;

padding-top:45px;

text-align:center;

color:#58635f;

font-size:11px;
}

.loading{
position:fixed;

inset:0;

z-index:999;

display:flex;

align-items:center;
justify-content:center;

flex-direction:column;

gap:20px;

background:
linear-gradient(
180deg,
#07110f,
#020504
);

color:#a8bdb6;

font-size:18px;
}

.spinner{
width:35px;
height:35px;

border:4px solid
rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:
spin .8s linear infinite;
}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

@media(max-width:480px){

.app{
padding:20px 15px 35px;
}

header{
margin-bottom:38px;
}

.logo{
width:45px;
height:45px;

border-radius:14px;

font-size:23px;
}

.brand h2{
font-size:18px;
}

.status{
font-size:10px;
}

.hero-description{
font-size:15px;

margin-bottom:24px;
}

.avatar{
width:82px;
height:82px;

font-size:40px;

margin-bottom:15px;
}

.hero h1{
font-size:31px;

margin-bottom:16px;
}

.account-name{
font-size:23px;
}

.account-id{
font-size:17px;
}

.choice{
min-height:130px;

padding:19px;
}

.choice-icon{
width:61px;
height:61px;

font-size:29px;
}

.choice-text h3{
font-size:18px;
}

.choice-text p{
font-size:12px;
}

}

</style>

</head>

<body>

<div class="background">

<div class="glow one"></div>

<div class="glow two"></div>

</div>


<div
id="loading"
class="loading"
>

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>


<main
id="app"
class="app"
style="display:none;"
>

<header>

<div class="brand">

<div class="logo">
💬
</div>

<div>

<h2>
Mecd Chat
</h2>

<span>
دردشة وغرف خاصة
</span>

</div>

</div>


<div class="status">

<div class="status-dot"></div>

متصل

</div>

</header>


<section class="hero">

<h1>

<span>
Mecd Chat
</span>

</h1>

<p class="hero-description">

تواصل مع أصدقائك بسهولة وأمان.

</p>


<div
id="avatar"
class="avatar"
>

👤

</div>

</section>


<div class="account-info">

<div
id="name"
class="account-name"
>

مستخدم Mecd

</div>


<div
id="userId"
class="account-id"
>

جارٍ تحميل ID...

</div>

</div>


<section class="choices">


<button
type="button"
class="choice friends-choice"
id="friendsBtn"
>

<div class="choice-content">

<div class="choice-icon">
👥
</div>

<div class="choice-text">

<h3>
الأصدقاء
</h3>

<p>
عرض الأصدقاء والتواصل معهم بسهولة.
</p>

</div>

<div class="arrow">
←
</div>

</div>

</button>


<button
type="button"
class="choice search-choice"
id="searchFriendBtn"
>

<div class="choice-content">

<div class="choice-icon">
🔎
</div>

<div class="choice-text">

<h3>
بحث عن صديق
</h3>

<p>
ابحث عن صديق باستخدام ID الخاص به.
</p>

</div>

<div class="arrow">
←
</div>

</div>

</button>


<button
type="button"
class="choice back-choice"
id="backBtn"
>

<div class="choice-content">

<div class="choice-icon">
🚪
</div>

<div class="choice-text">

<h3>
العودة إلى Mecd Tools
</h3>

<p>
العودة إلى الصفحة الرئيسية بدون تسجيل الخروج.
</p>

</div>

<div class="arrow">
←
</div>

</div>

</button>

</section>


<div class="info">

🔒 حسابك مرتبط بـ Mecd Tools.

<br>

لن يتم تسجيل خروجك عند العودة إلى Mecd Tools.

</div>


<footer>

Mecd Chat © 2026

</footer>

</main>


<script type="module">


/* =========================
   Firebase
========================= */

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,
onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

getFirestore,
doc,
getDoc,
setDoc,
runTransaction

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================
   Firebase Config
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915",

measurementId:
"G-0VKYR3TQV2"

};


/* =========================
   تشغيل Firebase
========================= */

const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


/* =========================
   عناصر الصفحة
========================= */

const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const avatar =
document.getElementById("avatar");

const name =
document.getElementById("name");

const userId =
document.getElementById("userId");

const friendsBtn =
document.getElementById("friendsBtn");

const searchFriendBtn =
document.getElementById("searchFriendBtn");

const backBtn =
document.getElementById("backBtn");


/* =========================
   الروابط
========================= */

const mecdToolsURL =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

const friendsURL =
"./friends.html";

const searchFriendURL =
"./search.html";


/* ==================================================
   إنشاء ID المستخدم
================================================== */

async function getChatID(user){

try{

/*
   مرجع حساب المستخدم
*/
const userRef =
doc(
db,
"users",
user.uid
);


/*
   أولاً نتحقق هل لديه ID مسبق
*/
const userDoc =
await getDoc(userRef);


if(userDoc.exists()){

const data =
userDoc.data();


if(
data.chatID &&
typeof data.chatID === "string" &&
data.chatID.startsWith("MC-")
){

return data.chatID;

}

}


/*
   مرجع العداد العام
*/
const counterRef =
doc(
db,
"settings",
"chatCounter"
);


/*
   استخدام Transaction
   لمنع تكرار الـ ID
*/
const newNumber =
await runTransaction(

db,

async(transaction)=>{

const counterDoc =
await transaction.get(
counterRef
);

let number = 0;


if(counterDoc.exists()){

number =
Number(
counterDoc.data().number || 0
);

}


/*
   زيادة الرقم
*/
number++;


/*
   حفظ الرقم الجديد
*/
transaction.set(

counterRef,

{
number:number
},

{
merge:true
}

);


/*
   إرجاع الرقم
*/
return number;

}

);


/*
   إنشاء ID
*/
const newID =
"MC-" +
String(newNumber)
.padStart(6,"0");


/*
   حفظ بيانات المستخدم
*/
await setDoc(

userRef,

{

name:
user.displayName ||
"مستخدم Mecd",

photo:
user.photoURL ||
"",

email:
user.email ||
"",

chatID:
newID

},

{

merge:true

}

);


/*
   إرجاع ID
*/
return newID;


}catch(error){

console.error(
"خطأ في إنشاء ID:",
error
);

throw error;

}

}


/* ==================================================
   مراقبة تسجيل الدخول
================================================== */

onAuthStateChanged(

auth,

async(user)=>{


/*
   إذا لم يسجل الدخول
*/
if(!user){

window.location.replace(
mecdToolsURL
);

return;

}


try{


/*
   اسم المستخدم
*/
name.textContent =
user.displayName ||
"مستخدم Mecd";


/*
   صورة المستخدم
*/
if(user.photoURL){

avatar.innerHTML = `

<img
src="${user.photoURL}"
alt="صورة الحساب"
>

`;

}else{

avatar.textContent =
"👤";

}


/*
   الحصول على ID
*/
const id =
await getChatID(user);


/*
   عرض ID
*/
userId.textContent =
"ID: " + id;


/*
   إخفاء التحميل
*/
loading.style.display =
"none";


/*
   إظهار التطبيق
*/
app.style.display =
"flex";


}catch(error){

console.error(
"Mecd Chat error:",
error
);


loading.innerHTML = `

<div>

⚠️ حدث خطأ أثناء تحميل الحساب

</div>

<div
style="
font-size:12px;
color:#777;
margin-top:8px;
"
>

${error.message || ""}

</div>

`;

}

});


/* =========================
   زر الأصدقاء
========================= */

friendsBtn.addEventListener(

"click",

()=>{

window.location.href =
friendsURL;

}

);


/* =========================
   زر البحث
========================= */

searchFriendBtn.addEventListener(

"click",

()=>{

window.location.href =
searchFriendURL;

}

);


/* =========================
   العودة إلى Mecd Tools
========================= */

backBtn.addEventListener(

"click",

()=>{

window.location.href =
mecdToolsURL;

}

);


/* =========================
   Service Worker
========================= */

if(
"serviceWorker" in navigator
){

window.addEventListener(

"load",

()=>{

navigator.serviceWorker
.register("./sw.js")

.then(

registration=>{

console.log(
"Mecd Chat Service Worker:",
registration.scope
);

}

)

.catch(

error=>{

console.error(
"Service Worker:",
error
);

}

);

}

);

}

</script>

</body>

</html>
