<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}


.card{

width:90%;
max-width:400px;

padding:40px 25px;

text-align:center;

border-radius:30px;

background:
rgba(0,60,40,.65);

border:1px solid rgba(0,255,145,.25);

box-shadow:
0 20px 60px rgba(0,0,0,.4);

}


.logo{

width:100px;
height:100px;

margin:0 auto 25px;

border-radius:30px;

display:flex;
align-items:center;
justify-content:center;

font-size:55px;

background:
rgba(0,255,145,.12);

}


h1{

font-size:38px;
margin-bottom:15px;

}


p{

color:#a8bdb6;
font-size:18px;
line-height:1.7;

}


button{

margin-top:30px;

width:100%;

padding:16px;

border:0;

border-radius:18px;

font-size:18px;

font-weight:bold;

cursor:pointer;

background:#00e889;

color:#00150e;

}


button:active{

transform:scale(.97);

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
💬
</div>


<h1>
Mecd Chat
</h1>


<p>
أهلاً بك 👋<br>
سجّل الدخول للبدء بالدردشة
</p>


<button id="loginBtn">
🔵 تسجيل الدخول بواسطة Google
</button>


</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getAuth,
GoogleAuthProvider,
signInWithPopup
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain: "mecd-tools.firebaseapp.com",

projectId: "mecd-tools",

storageBucket: "mecd-tools.firebasestorage.app",

messagingSenderId: "643005547408",

appId: "1:643005547408:web:6aa62cfee07acc72e0a915",

measurementId: "G-P2G68RY19Q"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


const loginBtn = document.getElementById("loginBtn");


loginBtn.onclick = async () => {

try {

const result = await signInWithPopup(
auth,
provider
);


console.log("تم تسجيل الدخول:", result.user);


// هنا لاحقاً نفتح صفحة الدردشة


} catch(error){

console.log(error);

alert("حدث خطأ في تسجيل الدخول");

}

};


</script>


</body>

</html>
