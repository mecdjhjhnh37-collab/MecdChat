<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}


.container{

width:90%;
max-width:500px;

margin:auto;
padding:40px 0;

}


.profile{

text-align:center;
margin-bottom:35px;

}


.avatar{

width:105px;
height:105px;

margin:auto;

border-radius:50%;

overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:rgba(0,255,145,.12);

border:3px solid #00e889;

font-size:45px;

}


.avatar img{

width:100%;
height:100%;

object-fit:cover;

}


h1{

margin-top:20px;
font-size:38px;

}


.name{

margin-top:15px;
font-size:25px;
font-weight:bold;

}


.id{

margin-top:12px;
font-size:18px;
color:#00e889;

}


.card{

padding:22px;

margin-bottom:15px;

border-radius:25px;

background:rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

}


.logout{

background:rgba(160,40,40,.25);

color:#ffaaaa;

}


.loading{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:20px;

color:#a8bdb6;

font-size:18px;

}


.spinner{

width:35px;
height:35px;

border:4px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}


@keyframes spin{

to{
transform:rotate(360deg);
}

}

</style>

</head>


<body>


<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>




<div id="app" class="container" style="display:none;">


<div class="profile">


<div id="avatar" class="avatar">
👤
</div>


<h1>
Mecd Chat
</h1>


<div id="name" class="name"></div>


<div id="userId" class="id"></div>


</div>




<div class="card">
👥 الأصدقاء
</div>


<div class="card">
➕ إنشاء غرفة دردشة
</div>


<div class="card">
🔑 دخول دردشة عبر ID
</div>


<div class="card">
⚙️ الإعدادات
</div>


<div id="logoutBtn" class="card logout">
🚪 تسجيل الخروج
</div>


</div>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain: "mecd-tools.firebaseapp.com",

projectId: "mecd-tools",

storageBucket: "mecd-tools.firebasestorage.app",

messagingSenderId: "643005547408",

appId: "1:643005547408:web:b1719060ec340dd0e0a915"

};



const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);



const loading =
document.getElementById("loading");

const app =
document.getElementById("app");

const avatar =
document.getElementById("avatar");

const name =
document.getElementById("name");

const userId =
document.getElementById("userId");

const logout =
document.getElementById("logoutBtn");





async function getUserID(user){


const ref =
doc(db,"users",user.uid);


const old =
await getDoc(ref);



if(old.exists()){


return old.data().chatID;


}



const all =
await getDocs(collection(db,"users"));



let number =
all.size + 1;



let newID =
"MC-" +
String(number).padStart(6,"0");



await setDoc(ref,{

name:user.displayName || "مستخدم Mecd",

photo:user.photoURL || "",

chatID:newID

});



return newID;


}





onAuthStateChanged(auth,async(user)=>{


if(user){


let id =
await getUserID(user);



loading.style.display="none";

app.style.display="block";



name.textContent =
user.displayName || "مستخدم Mecd";



if(user.photoURL){


avatar.innerHTML =
`
<img src="${user.photoURL}">
`;

}



userId.textContent =
"ID: " + id;



}else{


window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

}



});






logout.onclick=async()=>{


await signOut(auth);


window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

};



</script>


</body>

</html>
