<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
min-height:100vh;
font-family:Arial,sans-serif;
color:white;
display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}


.card{

width:90%;
max-width:400px;

padding:40px 25px;

text-align:center;

border-radius:30px;

background:
rgba(0,60,40,.65);

border:1px solid rgba(0,255,145,.25);

box-shadow:
0 20px 60px rgba(0,0,0,.4);

}


.logo{

width:100px;
height:100px;

margin:0 auto 25px;

border-radius:30px;

display:flex;
align-items:center;
justify-content:center;

font-size:55px;

background:
rgba(0,255,145,.12);

}


.profile img{

width:80px;
height:80px;

border-radius:50%;

margin-bottom:15px;

border:2px solid #00e889;

}


h1{

font-size:38px;
margin-bottom:15px;

}


h2{

margin-bottom:10px;

}


p{

color:#a8bdb6;
font-size:18px;
line-height:1.7;

}

</style>

</head>


<body>


<div class="card">


<div class="logo">
💬
</div>


<h1>
Mecd Chat
</h1>


<div id="profile" class="profile">

</div>


<p id="status">
جارٍ تحميل الحساب...
</p>


</div>



<script type="module">


import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain: "mecd-tools.firebaseapp.com",

projectId: "mecd-tools",

storageBucket: "mecd-tools.firebasestorage.app",

messagingSenderId: "643005547408",

appId: "1:643005547408:web:b1719060ec340dd0e0a915",

measurementId: "G-0VKYR3TQV2"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



const profile =
document.getElementById("profile");


const status =
document.getElementById("status");



onAuthStateChanged(auth,(user)=>{


if(user){


profile.innerHTML = `

<img src="${user.photoURL || 'https://via.placeholder.com/80'}">

<h2>
${user.displayName || "مستخدم Mecd"}
</h2>

<p>
${user.email}
</p>

`;


status.textContent =
"تم تحميل الحساب ✅";


}else{


window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

}


});


</script>


</body>

</html>
