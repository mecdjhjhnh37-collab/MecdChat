<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
min-height:100vh;
color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);
}

.container{
width:90%;
max-width:500px;
margin:auto;
padding:40px 0;
}

.profile{
text-align:center;
margin-bottom:40px;
}

.avatar{
width:100px;
height:100px;
margin:auto;
border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:50px;

background:rgba(0,255,145,.12);
border:2px solid #00e889;

overflow:hidden;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
margin-top:20px;
font-size:36px;
}

.name{
margin-top:12px;
font-size:24px;
font-weight:bold;
}

.email{
margin-top:7px;
color:#a8bdb6;
font-size:16px;
}

.id{
color:#00e889;
margin-top:12px;
font-size:18px;
}

.card{
padding:20px;
margin-bottom:15px;

border-radius:22px;

background:rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

cursor:pointer;

transition:.2s;
}

.card:active{
transform:scale(.98);
}

.logout{
background:rgba(180,40,40,.25);
border-color:rgba(255,80,80,.25);
color:#ffaaaa;
}

.loading{
min-height:100vh;

display:flex;
align-items:center;
justify-content:center;

flex-direction:column;

gap:20px;

font-size:20px;

color:#a8bdb6;
}

.spinner{
width:35px;
height:35px;

border:4px solid rgba(255,255,255,.15);
border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

</style>

</head>

<body>


<!-- شاشة التحميل -->

<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>



<!-- صفحة Mecd Chat -->

<div id="app" class="container" style="display:none;">


<div class="profile">


<div id="avatar" class="avatar">
👤
</div>


<h1>
Mecd Chat
</h1>


<div id="name" class="name">
مستخدم Mecd
</div>


<div id="email" class="email">
</div>


<div id="userId" class="id">
ID: 000001
</div>


</div>



<div class="card">
👥 الأصدقاء
</div>


<div class="card">
➕ إنشاء غرفة دردشة
</div>


<div class="card">
🔑 دخول دردشة عبر ID
</div>


<div class="card">
⚙️ الإعدادات
</div>


<div id="logoutBtn" class="card logout">
🚪 تسجيل الخروج
</div>


</div>



<script type="module">


import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain: "mecd-tools.firebaseapp.com",

projectId: "mecd-tools",

storageBucket: "mecd-tools.firebasestorage.app",

messagingSenderId: "643005547408",

appId: "1:643005547408:web:b1719060ec340dd0e0a915",

measurementId: "G-0VKYR3TQV2"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);



const loading =
document.getElementById("loading");

const main =
document.getElementById("app");

const avatar =
document.getElementById("avatar");

const name =
document.getElementById("name");

const email =
document.getElementById("email");

const userId =
document.getElementById("userId");

const logoutBtn =
document.getElementById("logoutBtn");



onAuthStateChanged(auth,(user)=>{


if(user){

loading.style.display = "none";

main.style.display = "block";


// اسم الحساب

name.textContent =
user.displayName || "مستخدم Mecd";


// الإيميل

email.textContent =
user.email || "";


// صورة Google

if(user.photoURL){

avatar.innerHTML = `
<img
src="${user.photoURL}"
alt="صورة الحساب"
>
`;

}else{

avatar.textContent = "👤";

}


// إنشاء ID ثابت من UID

const savedId =
localStorage.getItem("mecdChatID");

if(!savedId){

const newId =
"MC" +
Math.floor(100000 + Math.random() * 900000);

localStorage.setItem(
"mecdChatID",
newId
);

userId.textContent =
"ID: " + newId;

}else{

userId.textContent =
"ID: " + savedId;

}


}else{


loading.style.display = "none";


// إذا لم يكن مسجل دخول
// يرجعه إلى Mecd Tools

window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

}

});



// تسجيل الخروج

logoutBtn.addEventListener("click",async()=>{

logoutBtn.textContent =
"جاري تسجيل الخروج...";

try{

await signOut(auth);

localStorage.removeItem("mecdUser");

window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

}catch(error){

console.error(error);

logoutBtn.textContent =
"🚪 تسجيل الخروج";

}

});


</script>


</body>

</html>
