<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

font-family:Arial,sans-serif;

min-height:100vh;

color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);

}


.container{

width:90%;
max-width:500px;

margin:auto;

padding:40px 0;

}



/* الحساب */

.profile{

text-align:center;

margin-bottom:35px;

}


.avatar{

width:105px;
height:105px;

margin:auto;

border-radius:50%;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:
rgba(0,255,145,.12);

border:3px solid #00e889;

font-size:45px;

}


.avatar img{

width:100%;
height:100%;

object-fit:cover;

}



h1{

margin-top:20px;

font-size:38px;

}


.name{

margin-top:15px;

font-size:25px;

font-weight:bold;

}


.id{

margin-top:12px;

display:inline-block;

padding:8px 18px;

border-radius:20px;

color:#00e889;

background:
rgba(0,255,145,.12);

font-size:18px;

}



/* الخدمات */

.card{

padding:22px;

margin-bottom:15px;

border-radius:25px;

background:
rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

cursor:pointer;

transition:.2s;

}



.card:active{

transform:scale(.97);

}



/* خروج */

.logout{

background:
rgba(150,30,30,.25);

color:#ffaaaa;

border-color:
rgba(255,80,80,.3);

}



/* تحميل */

.loading{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:20px;

color:#a8bdb6;

font-size:18px;

}



.spinner{

width:35px;

height:35px;

border:4px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}



@keyframes spin{

to{
transform:rotate(360deg);
}

}


</style>

</head>


<body>



<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>




<div id="app" class="container" style="display:none;">



<div class="profile">


<div id="avatar" class="avatar">
👤
</div>



<h1>
Mecd Chat
</h1>



<div id="name" class="name">
</div>



<div id="userId" class="id">
</div>


</div>





<div class="card">
👥 الأصدقاء
</div>


<div class="card">
➕ إنشاء غرفة دردشة
</div>


<div class="card">
🔑 دخول دردشة عبر ID
</div>


<div class="card">
⚙️ الإعدادات
</div>


<div id="logoutBtn" class="card logout">
🚪 تسجيل الخروج
</div>



</div>






<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getAuth,

onAuthStateChanged,

signOut

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";





const firebaseConfig = {


apiKey:
"AIzaSyA8ZA5fcy5Tl3hZ7_5n91xVOw06syHPGyI",


authDomain:
"mecd-tools.firebaseapp.com",


projectId:
"mecd-tools",


storageBucket:
"mecd-tools.firebasestorage.app",


messagingSenderId:
"643005547408",


appId:
"1:643005547408:web:b1719060ec340dd0e0a915",


measurementId:
"G-0VKYR3TQV2"


};





const app =
initializeApp(firebaseConfig);



const auth =
getAuth(app);





const loading =
document.getElementById("loading");


const main =
document.getElementById("app");


const avatar =
document.getElementById("avatar");


const name =
document.getElementById("name");


const userId =
document.getElementById("userId");


const logoutBtn =
document.getElementById("logoutBtn");






onAuthStateChanged(auth,(user)=>{


if(user){



loading.style.display="none";

main.style.display="block";




// الاسم

name.textContent =
user.displayName || "مستخدم Mecd";




// الصورة

if(user.photoURL){


avatar.innerHTML =

`
<img src="${user.photoURL}">
`;

}




// ID

let id =
localStorage.getItem("mecdChatID");



if(!id){


let num =
localStorage.getItem("mecdNumber");



if(!num){

num=1;

}else{

num =
Number(num)+1;

}



localStorage.setItem(
"mecdNumber",
num
);



id =
"MC-" +
String(num).padStart(6,"0");



localStorage.setItem(
"mecdChatID",
id
);



}



userId.textContent =
"ID: "+id;



}else{



loading.style.display="none";


window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";



}



});








logoutBtn.onclick =
async()=>{


logoutBtn.textContent =
"جاري تسجيل الخروج...";


await signOut(auth);



localStorage.removeItem(
"mecdChatID"
);



window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";



};




</script>



</body>

</html>
