<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

min-height:100vh;

font-family:Arial,sans-serif;

color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);

}


.container{

width:90%;
max-width:500px;

margin:auto;

padding:40px 0;

}



.profile{

text-align:center;

margin-bottom:35px;

}



.avatar{

width:105px;
height:105px;

margin:auto;

border-radius:50%;

overflow:hidden;

display:flex;

align-items:center;

justify-content:center;

background:
rgba(0,255,145,.12);

border:3px solid #00e889;

font-size:45px;

}



.avatar img{

width:100%;
height:100%;

object-fit:cover;

}



h1{

margin-top:20px;

font-size:38px;

}



.name{

margin-top:15px;

font-size:25px;

font-weight:bold;

}



.id{

margin-top:12px;

font-size:18px;

color:#00e889;

}



.card{

padding:22px;

margin-bottom:15px;

border-radius:25px;

background:
rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

}



.logout{

background:
rgba(160,40,40,.25);

color:#ffaaaa;

}



.loading{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:20px;

color:#a8bdb6;

font-size:18px;

}



.spinner{

width:35px;

height:35px;

border:4px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}


@keyframes spin{

to{
transform:rotate(360deg);
}

}


</style>

</head>


<body>



<div id="loading" class="loading">

<div class="spinner"></div>

<div>
جارٍ تحميل الحساب...
</div>

</div>





<div id="app" class="container" style="display:none;">



<div class="profile">


<div id="avatar" class="avatar">
👤
</div>


<h1>
Mecd Chat
</h1>


<div id="name" class="name">
</div>


<div id="userId" class="id">
</div>


</div>




<div class="card">
👥 الأصدقاء
</div>


<div class="card">
➕ إنشاء غرفة دردشة
</div>


<div class="card">
🔑 دخول دردشة عبر ID
</div>


<div class="card">
⚙️ الإعدادات
</div>


<div id="logoutBtn" class="card logout">
🚪 تسجيل الخروج
</div>



</div>





<script>


const loading =
document.getElementById("loading");


const app =
document.getElementById("app");


const avatar =
document.getElementById("avatar");


const name =
document.getElementById("name");


const userId =
document.getElementById("userId");



const logout =
document.getElementById("logoutBtn");





// جلب حساب Mecd Tools

const user =
JSON.parse(localStorage.getItem("mecdUser"));





if(user){



loading.style.display="none";

app.style.display="block";




// الاسم

name.textContent =
user.name || "مستخدم Mecd";





// الصورة

if(user.photo){


avatar.innerHTML =
`
<img src="${user.photo}">
`;

}





// إنشاء ID

let id =
localStorage.getItem("mecdChatID");



if(!id){



let number =
localStorage.getItem("mecdNumber");



if(!number){

number=1;

}else{

number =
Number(number)+1;

}



localStorage.setItem(
"mecdNumber",
number
);



id =
"MC-" +
String(number).padStart(6,"0");



localStorage.setItem(
"mecdChatID",
id
);



}



userId.textContent =
"ID: "+id;






}else{


window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

}






// تسجيل الخروج


logout.onclick=()=>{


localStorage.removeItem("mecdUser");

localStorage.removeItem("mecdChatID");


window.location.href =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";

};



</script>


</body>

</html>
