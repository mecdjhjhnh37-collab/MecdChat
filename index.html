<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mecd Chat</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

min-height:100vh;

font-family:Arial,sans-serif;

color:white;

background:
radial-gradient(circle at top,#064d37,transparent 40%),
linear-gradient(180deg,#03110d,#020707);

}


.container{

width:90%;
max-width:500px;

margin:auto;

padding:40px 0;

}


.profile{

text-align:center;

margin-bottom:35px;

}


.avatar{

width:105px;
height:105px;

margin:auto;

border-radius:50%;

overflow:hidden;

display:flex;

align-items:center;
justify-content:center;

background:rgba(0,255,145,.12);

border:3px solid #00e889;

font-size:45px;

}


.avatar img{

width:100%;
height:100%;

object-fit:cover;

}


h1{

margin-top:20px;

font-size:38px;

}


.name{

margin-top:15px;

font-size:25px;

font-weight:bold;

}


.id{

margin-top:12px;

font-size:18px;

color:#00e889;

}


.card{

padding:22px;

margin-bottom:15px;

border-radius:25px;

background:rgba(0,85,58,.55);

border:1px solid rgba(0,255,145,.18);

font-size:20px;

cursor:pointer;

transition:.2s;

}


.card:active{

transform:scale(.98);

}


.logout{

background:rgba(160,40,40,.25);

color:#ffaaaa;

}


.loading{

height:100vh;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

gap:20px;

color:#a8bdb6;

font-size:18px;

}


.spinner{

width:35px;

height:35px;

border:4px solid rgba(255,255,255,.15);

border-top-color:#00e889;

border-radius:50%;

animation:spin .8s linear infinite;

}


@keyframes spin{

to{

transform:rotate(360deg);

}

}

</style>

</head>


<body>


<!-- شاشة التحميل -->

<div id="loading" class="loading">

<div class="spinner"></div>

<div id="loadingText">
جارٍ التحقق من الحساب...
</div>

</div>



<!-- Mecd Chat -->

<div id="app" class="container" style="display:none;">


<div class="profile">


<div id="avatar" class="avatar">

👤

</div>


<h1>
Mecd Chat
</h1>


<div id="name" class="name">

</div>


<div id="userId" class="id">

</div>


</div>



<div class="card">

👥 الأصدقاء

</div>


<div class="card">

➕ إنشاء غرفة دردشة

</div>


<div class="card">

🔑 دخول دردشة عبر ID

</div>


<div class="card">

⚙️ الإعدادات

</div>


<div id="logoutBtn" class="card logout">

🚪 تسجيل الخروج

</div>


</div>



<script type="module">


/* =========================
   Firebase
========================= */


import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
setDoc,
runTransaction
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================
   Firebase Config
========================= */


const firebaseConfig = {

apiKey:
"AIzaSyA8ZA5fcy1Tl3hZ7_5n91xVOw06syHPGyI",

authDomain:
"mecd-tools.firebaseapp.com",

projectId:
"mecd-tools",

storageBucket:
"mecd-tools.firebasestorage.app",

messagingSenderId:
"643005547408",

appId:
"1:643005547408:web:b1719060ec340dd0e0a915"

};



/* =========================
   Firebase Start
========================= */


const firebaseApp =
initializeApp(firebaseConfig);


const auth =
getAuth(firebaseApp);


const db =
getFirestore(firebaseApp);



/* =========================
   Elements
========================= */


const loading =
document.getElementById("loading");


const loadingText =
document.getElementById("loadingText");


const app =
document.getElementById("app");


const avatar =
document.getElementById("avatar");


const name =
document.getElementById("name");


const userId =
document.getElementById("userId");


const logout =
document.getElementById("logoutBtn");



/* =========================
   Mecd Tools URL
========================= */


const mecdToolsURL =
"https://mecdjhjhnh37-collab.github.io/Website-g-zel/";



/* =========================
   إنشاء ID ثابت للمستخدم
========================= */


async function getUserID(user){

const userRef =
doc(db,"users",user.uid);


/* أولاً: نبحث عن حساب المستخدم */

const userSnapshot =
await getDoc(userRef);


if(userSnapshot.exists()){

const data =
userSnapshot.data();


if(data.chatID){

return data.chatID;

}

}


/* =========================
   إنشاء ID جديد
========================= */


const newID =
await runTransaction(
db,
async(transaction)=>{


/*

نستخدم مستند خاص بالعداد

حتى لا نعتمد على عدد
المستخدمين الموجودين.

*/


const counterRef =
doc(db,"settings","userCounter");


const counterSnapshot =
await transaction.get(counterRef);


let nextNumber = 1;


if(counterSnapshot.exists()){

const data =
counterSnapshot.data();


nextNumber =
(data.lastNumber || 0) + 1;

}


/* ID الجديد */

const chatID =
"MC-" +
String(nextNumber).padStart(6,"0");


/* تحديث العداد */

transaction.set(
counterRef,
{
lastNumber:nextNumber
},
{
merge:true
}
);


/* حفظ حساب المستخدم */

transaction.set(
userRef,
{

name:
user.displayName || "مستخدم Mecd",

photo:
user.photoURL || "",

chatID:
chatID,

createdAt:
new Date()

},
{
merge:true
}
);


return chatID;

}
);


return newID;

}



/* =========================
   التحقق من تسجيل الدخول
========================= */


onAuthStateChanged(
auth,
async(user)=>{


/*

إذا لم يوجد مستخدم
نعيده إلى Mecd Tools.

*/


if(!user){

window.location.replace(
mecdToolsURL
);

return;

}



/* =========================
   المستخدم مسجل دخول
========================= */


try{


loadingText.textContent =
"جارٍ تحميل حسابك...";


/* الحصول على ID */

const id =
await getUserID(user);


/* الاسم */

name.textContent =
user.displayName ||
"مستخدم Mecd";


/* صورة Google */

if(user.photoURL){

avatar.innerHTML = `

<img
src="${user.photoURL}"
alt="صورة الحساب"
>

`;

}else{

avatar.textContent =
"👤";

}


/* ID */

userId.textContent =
"ID: " + id;


/* إظهار التطبيق */

loading.style.display =
"none";

app.style.display =
"block";


}catch(error){


console.error(
"Mecd Chat error:",
error
);


/*

إذا حصل خطأ في Firestore
لا ندخل المستخدم إلى التطبيق.

*/

loadingText.textContent =
"حدث خطأ أثناء تحميل الحساب";


}

});



/* =========================
   تسجيل الخروج
========================= */


logout.addEventListener(
"click",
async()=>{


logout.textContent =
"جاري تسجيل الخروج...";


logout.style.pointerEvents =
"none";


try{


await signOut(auth);


/*

بعد تسجيل الخروج
نرجع إلى Mecd Tools.

*/

window.location.replace(
mecdToolsURL
);


}catch(error){


console.error(
"Logout error:",
error
);


logout.textContent =
"🚪 تسجيل الخروج";


logout.style.pointerEvents =
"auto";


}

});

</script>


</body>

</html>
